        # A UTC [datetime], or $null for blank, unparseable or placeholder dates (HaloPSA sends 1900-01-01 for none).
        function ConvertTo-PsaDate {
            param($Value)
            if ($null -eq $Value) { return $null }
            $d = [datetime]::MinValue
            if ($Value -is [datetime]) { $d = $Value }
            elseif ($Value -is [datetimeoffset]) { $d = $Value.UtcDateTime }
            else {
                $s = ([string]$Value).Trim()
                if (-not $s) { return $null }
                $styles = [Globalization.DateTimeStyles]::AssumeUniversal -bor [Globalization.DateTimeStyles]::AdjustToUniversal
                if (-not [datetime]::TryParse($s, [Globalization.CultureInfo]::InvariantCulture, $styles, [ref]$d)) { return $null }
            }
            if ($d.Kind -eq [DateTimeKind]::Local) { $d = $d.ToUniversalTime() }
            elseif ($d.Kind -eq [DateTimeKind]::Unspecified) { $d = [datetime]::SpecifyKind($d, [DateTimeKind]::Utc) }
            if ($d.Year -lt 1971) { return $null }
            return $d
        }

        # critical, high, medium or low for a PSA priority label ('' when it matches none).
        function Get-PsaPriorityClass {
            param([string]$Label)
            if ([string]::IsNullOrWhiteSpace($Label)) { return '' }
            foreach ($k in @('critical', 'high', 'medium', 'low')) { foreach ($p in $PsaState.PriorityPatterns[$k]) { if ($Label -match $p) { return $k } } }
            return ''
        }

        function New-PsaTicketRow {
            param($Id, $Number, $Summary, $CompanyId, $CompanyName, $Status, $PriorityLabel, $QueueId, $QueueName, $AssigneeId, $AssigneeName, $Created, $Updated, $Raw)
            $cr = ConvertTo-PsaDate $Created
            $up = ConvertTo-PsaDate $Updated
            if ($null -eq $up) { $up = $cr }
            $blank = { param($v) if (Test-PsaBlank $v) { '' } else { [string]$v } }
            return @{
                id = [string]$Id; number = $(if (Test-PsaBlank $Number) { [string]$Id } else { [string]$Number }); summary = [string]$Summary
                companyId = (& $blank $CompanyId); companyName = [string]$CompanyName; status = [string]$Status
                priority = (Get-PsaPriorityClass ([string]$PriorityLabel)); priorityLabel = [string]$PriorityLabel
                queueId = (& $blank $QueueId); queueName = [string]$QueueName
                assigneeId = (& $blank $AssigneeId); assigneeName = [string]$AssigneeName
                created = $cr; updated = $up; raw = $Raw
            }
        }

        # A 403 on a read becomes a plain sentence about the API user's permissions.
        function Invoke-PsaRead {
            param([string]$Path, [string]$What)
            try { return Invoke-Psa GET $Path }
            catch {
                $m = [string]$_.Exception.Message
                if ($m -match '\(HTTP 403\)') { throw "$(Get-PsaName) refused to $What (HTTP 403). Give the API user permission to read service tickets and their notes, then run this again." }
                throw
            }
        }

        # Kaseya BMS list replies are {Success, Result}; Result may be the list or hold it. Unverified: the list shape.
        function Get-PsaBmsList {
            param($Reply)
            $res = Get-PsaProp $Reply 'Result'
            if ($null -eq $res) { return @() }
            if ($res -is [array]) { return @($res | Where-Object { $null -ne $_ }) }
            foreach ($n in @('Items', 'Data', 'Tickets', 'Records')) { $v = Get-PsaProp $res $n; if ($null -ne $v) { return @($v | Where-Object { $null -ne $_ }) } }
            return @($res)
        }

        function Find-PsaTickets {
            param($UpdatedBefore = $null, [string[]]$Status = @(), [int]$Max = 500, [switch]$IncludeClosed)
            $c = Get-PsaConn
            $cut = ConvertTo-PsaDate $UpdatedBefore
            $iso = if ($cut) { $cut.ToString('yyyy-MM-ddTHH:mm:ssZ') } else { '' }
            $want = @($Status | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object { ([string]$_).Trim().ToLowerInvariant() })
            if ($Max -lt 1) { $Max = 1 }
            $found = New-Object System.Collections.ArrayList
            $what = 'list tickets'
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: the lastUpdated condition with a [date] literal (CW conditions syntax) and the list fields used.
                    $conds = @(); if (-not $IncludeClosed) { $conds += 'closedFlag=false' }
                    if ($iso) { $conds += "lastUpdated < [$iso]" }
                    if ($want.Count -eq 1) { $conds += ('status/name="' + $Status[0].Trim().Replace('"', '\"') + '"') }
                    $cq = if ($conds.Count) { "conditions=$(ConvertTo-PsaQuery ($conds -join ' and '))&" } else { '' }
                    for ($p = 1; $p -le $PsaExtraState.MaxPages; $p++) {
                        $page = @(Invoke-PsaRead "/service/tickets?$($cq)orderBy=$(ConvertTo-PsaQuery 'id asc')&pageSize=100&page=$p" $what | Where-Object { $null -ne $_ })
                        foreach ($t in $page) {
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'id') $null (Get-PsaProp $t 'summary') (Get-PsaPath $t 'company.id') (Get-PsaPath $t 'company.name') (Get-PsaPath $t 'status.name') (Get-PsaPath $t 'priority.name') (Get-PsaPath $t 'board.id') (Get-PsaPath $t 'board.name') $(if (Get-PsaPath $t 'owner.identifier') { Get-PsaPath $t 'owner.identifier' } else { Get-PsaPath $t 'owner.id' }) (Get-PsaPath $t 'owner.name') (Get-PsaPath $t '_info.dateEntered') (Get-PsaPath $t '_info.lastUpdated') $t))
                        }
                        if ($page.Count -lt 100 -or $found.Count -ge $Max) { break }
                    }
                }
                'autotask' {
                    # Unverified: lastActivityDate as the "last touched" field, and the SLA due-date fields read later.
                    $f = @()
                    if (-not $IncludeClosed) { foreach ($v in @(Get-PsaAtCompleteStatuses)) { $f += [ordered]@{ op = 'noteq'; field = 'status'; value = $v } } }
                    if ($iso) { $f += [ordered]@{ op = 'lt'; field = 'lastActivityDate'; value = $iso } }
                    if (-not $f.Count) { $f += [ordered]@{ op = 'gt'; field = 'id'; value = 0 } }
                    $path = "/Tickets/query?search=$(ConvertTo-PsaQuery (@{ filter = $f; MaxRecords = 500 } | ConvertTo-Json -Depth 6 -Compress))"
                    $statusVals = @(Get-PsaAtPicklist 'Tickets' 'status'); $prioVals = @(Get-PsaAtPicklist 'Tickets' 'priority'); $queueVals = @(Get-PsaAtPicklist 'Tickets' 'queueID')
                    $label = { param($vals, $v) $h = @($vals | Where-Object { [string](Get-PsaProp $_ 'value') -eq [string]$v }) | Select-Object -First 1; if ($h) { [string](Get-PsaProp $h 'label') } else { '' } }
                    for ($p = 1; $p -le $PsaExtraState.MaxPages -and $path; $p++) {
                        $r = Invoke-PsaRead $path $what
                        foreach ($t in @(Get-PsaProp $r 'items' | Where-Object { $null -ne $_ })) {
                            $st = Get-PsaProp $t 'status'; $pr = Get-PsaProp $t 'priority'; $q = Get-PsaProp $t 'queueID'
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'id') (Get-PsaProp $t 'ticketNumber') (Get-PsaProp $t 'title') (Get-PsaProp $t 'companyID') '' $(& $label $statusVals $st) $(& $label $prioVals $pr) $q $(& $label $queueVals $q) (Get-PsaProp $t 'assignedResourceID') '' (Get-PsaProp $t 'createDate') (Get-PsaProp $t 'lastActivityDate') $t))
                        }
                        $path = [string](Get-PsaPath $r 'pageDetails.nextPageUrl')
                        if ($found.Count -ge $Max) { break }
                    }
                }
                'halopsa' {
                    # Unverified: list paging (pageinate, page_size, page_no), lastactiondate, and status_name/team/agent_name on list rows.
                    $open = if ($IncludeClosed) { '' } else { 'open_only=true&' }
                    for ($p = 1; $p -le $PsaExtraState.MaxPages; $p++) {
                        $r = Invoke-PsaRead "/Tickets?$($open)pageinate=true&page_size=100&page_no=$p&order=id" $what
                        $page = @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ })
                        foreach ($t in $page) {
                            $pid0 = Get-PsaProp $t 'priority_id'
                            $plabel = [string](Get-PsaProp $t 'priority_name'); if (-not $plabel -and -not (Test-PsaBlank $pid0)) { $plabel = "P$pid0" }
                            $sname = [string](Get-PsaProp $t 'status_name'); if (-not $sname) { $sname = "Status $(Get-PsaProp $t 'status_id')" }
                            $upd = Get-PsaProp $t 'lastactiondate'; if (-not (ConvertTo-PsaDate $upd)) { $upd = Get-PsaProp $t 'last_update' }
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'id') $null (Get-PsaProp $t 'summary') (Get-PsaProp $t 'client_id') (Get-PsaProp $t 'client_name') $sname $plabel (Get-PsaProp $t 'team_id') (Get-PsaProp $t 'team') (Get-PsaProp $t 'agent_id') (Get-PsaProp $t 'agent_name') (Get-PsaProp $t 'dateoccurred') $upd $t))
                        }
                        $total = Get-PsaProp $r 'record_count'
                        if ($page.Count -lt 100 -or ($null -ne $total -and $p * 100 -ge [int]$total) -or $found.Count -ge $Max) { break }
                    }
                }
                'kaseyabms' {
                    # Unverified: list paging (PageNumber, PageSize), the reply shape and every field name below. Open/closed is read from the status name.
                    for ($p = 1; $p -le $PsaExtraState.MaxPages; $p++) {
                        $page = @(Get-PsaBmsList (Invoke-PsaRead "/servicedesk/tickets?PageNumber=$p&PageSize=100" $what))
                        foreach ($t in $page) {
                            $sname = [string](Get-PsaProp $t 'StatusName')
                            if (-not $IncludeClosed -and $sname -match '(?i)complete|closed|resolved|cancel') { continue }
                            $upd = $null; foreach ($n in @('LastActivityUpdate', 'LastModifiedDate', 'ModifiedOn', 'UpdatedOn')) { if (ConvertTo-PsaDate (Get-PsaProp $t $n)) { $upd = Get-PsaProp $t $n; break } }
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'Id') (Get-PsaProp $t 'TicketNumber') (Get-PsaProp $t 'Title') (Get-PsaProp $t 'AccountId') (Get-PsaProp $t 'AccountName') $sname (Get-PsaProp $t 'PriorityName') (Get-PsaProp $t 'QueueId') (Get-PsaProp $t 'QueueName') (Get-PsaProp $t 'AssigneeId') (Get-PsaProp $t 'AssigneeName') (Get-PsaProp $t 'OpenDate') $upd $t))
                        }
                        if ($page.Count -lt 100 -or $found.Count -ge $Max) { break }
                    }
                }
                'syncro' {
                    # Unverified: customer_business_then_name, priority, updated_at and due_date on list rows (status "Not Closed" is in PSA.md).
                    $st = if ($IncludeClosed) { '' } else { "status=$(ConvertTo-PsaQuery 'Not Closed')&" }
                    for ($p = 1; $p -le $PsaExtraState.MaxPages; $p++) {
                        $r = Invoke-PsaRead "/tickets?$($st)page=$p" $what
                        foreach ($t in @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ })) {
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'id') (Get-PsaProp $t 'number') (Get-PsaProp $t 'subject') (Get-PsaProp $t 'customer_id') (Get-PsaProp $t 'customer_business_then_name') (Get-PsaProp $t 'status') (Get-PsaProp $t 'priority') '' (Get-PsaProp $t 'problem_type') (Get-PsaProp $t 'user_id') (Get-PsaPath $t 'user.full_name') (Get-PsaProp $t 'created_at') (Get-PsaProp $t 'updated_at') $t))
                        }
                        $pages = Get-PsaPath $r 'meta.total_pages'
                        if ($null -eq $pages -or $p -ge [int]$pages -or $found.Count -ge $Max) { break }
                    }
                }
                'zendesk' {
                    # Unverified: the updated< search with a time, and sideloading SLAs with include=tickets(slas) on search.
                    $q = 'type:ticket'; if (-not $IncludeClosed) { $q += ' status<solved' }; if ($iso) { $q += " updated<$iso" }
                    $path = "/search?query=$(ConvertTo-PsaQuery $q)&sort_by=updated_at&sort_order=asc&per_page=100&include=$(ConvertTo-PsaQuery 'tickets(slas)')"
                    for ($p = 1; $p -le 10 -and $path; $p++) {
                        $r = Invoke-PsaRead $path $what
                        foreach ($t in @(Get-PsaProp $r 'results' | Where-Object { $null -ne $_ })) {
                            $null = $found.Add((New-PsaTicketRow (Get-PsaProp $t 'id') $null (Get-PsaProp $t 'subject') (Get-PsaProp $t 'organization_id') '' (Get-PsaProp $t 'status') (Get-PsaProp $t 'priority') (Get-PsaProp $t 'group_id') '' (Get-PsaProp $t 'assignee_id') '' (Get-PsaProp $t 'created_at') (Get-PsaProp $t 'updated_at') $t))
                        }
                        $path = [string](Get-PsaProp $r 'next_page')
                        if ($found.Count -ge $Max) { break }
                    }
                }
            }
            # The same filters again here, for the PSAs that can't filter on the server.
            $out = @($found | Where-Object {
                    (-not $cut -or ($null -ne $_.updated -and $_.updated -lt $cut)) -and
                    (-not $want.Count -or $want -contains $_.status.Trim().ToLowerInvariant())
                })
            return @($out | Select-Object -First $Max)
        }

        # Fills blank company, technician, queue and status names, one lookup per id. A failed lookup leaves an id-based name.
        function Resolve-PsaTicketNames {
            param($Tickets)
            $c = Get-PsaConn
            $cache = $PsaExtraState.Names
            $look = {
                param([string]$Kind, [string]$Id)
                if (Test-PsaBlank $Id) { return '' }
                $key = "$Kind`:$Id"
                if ($cache.ContainsKey($key)) { return $cache[$key] }
                $name = ''
                try {
                    switch ("$($c.Psa)/$Kind") {
                        'autotask/company' { $name = [string](Get-PsaPath (Invoke-Psa GET "/Companies/$Id") 'item.companyName') }
                        'autotask/user' { $i = Get-PsaProp (Invoke-Psa GET "/Resources/$Id") 'item'; $name = ("$(Get-PsaProp $i 'firstName') $(Get-PsaProp $i 'lastName')").Trim() }
                        'halopsa/user' { $name = [string](Get-PsaProp (Invoke-Psa GET "/Agent/$Id") 'name') }        # Unverified
                        'syncro/user' { $name = [string](Get-PsaPath (Invoke-Psa GET "/users/$Id") 'user.full_name') }  # Unverified: the field name
                        'zendesk/company' { $name = [string](Get-PsaPath (Invoke-Psa GET "/organizations/$Id") 'organization.name') }
                        'zendesk/user' { $name = [string](Get-PsaPath (Invoke-Psa GET "/users/$Id") 'user.name') }
                        'zendesk/queue' { $name = [string](Get-PsaPath (Invoke-Psa GET "/groups/$Id") 'group.name') }
                    }
                }
                catch { $name = '' }
                $cache[$key] = $name
                return $name
            }
            foreach ($t in @($Tickets)) {
                if ($null -eq $t) { continue }
                if (-not $t.companyName) { $t.companyName = & $look 'company' $t.companyId; if (-not $t.companyName) { $t.companyName = $(if ($t.companyId) { "Company $($t.companyId)" } else { 'No company' }) } }
                if (-not $t.assigneeName) { $t.assigneeName = & $look 'user' $t.assigneeId; if (-not $t.assigneeName) { $t.assigneeName = $(if ($t.assigneeId) { "Technician $($t.assigneeId)" } else { 'Unassigned' }) } }
                if (-not $t.queueName -and $t.queueId) { $t.queueName = & $look 'queue' $t.queueId; if (-not $t.queueName) { $t.queueName = "Queue $($t.queueId)" } }
            }
        }

        # ConnectWise SLA hours for one SLA and priority, cached. Unverified: /service/SLAs/{id} and its /priorities
        # (respondHours, resolutionHours). Wall-clock hours: CW applies business hours, so treat the result as approximate.
        function Get-PsaCwSlaHours {
            param([string]$SlaId, [string]$PriorityId)
            $key = "cw:$SlaId"
            if (-not $PsaExtraState.Sla.ContainsKey($key)) {
                $base = Invoke-Psa GET "/service/SLAs/$SlaId"
                $prios = @(); try { $prios = @(Invoke-Psa GET "/service/SLAs/$SlaId/priorities?pageSize=100" | Where-Object { $null -ne $_ }) } catch { }
                $PsaExtraState.Sla[$key] = @{ base = $base; prios = $prios }
            }
            $d = $PsaExtraState.Sla[$key]
            $src = $d.base
            if ($PriorityId) { $hit = @($d.prios | Where-Object { [string](Get-PsaPath $_ 'priority.id') -eq $PriorityId }) | Select-Object -First 1; if ($hit) { $src = $hit } }
            $num = { param($o, $n) $v = Get-PsaProp $o $n; if (Test-PsaBlank $v) { $null } else { [double]$v } }
            return @{ respond = (& $num $src 'respondHours'); resolve = (& $num $src 'resolutionHours') }
        }

        function Get-PsaTicketSla {
            param($Ticket)
            $c = Get-PsaConn
            $raw = $Ticket.raw
            $none = @{ source = 'none'; kind = ''; start = $Ticket.created; target = $null; breached = $null; detail = '' }
            $mk = { param($kind, $target, $breached, $detail) @{ source = 'psa'; kind = $kind; start = $Ticket.created; target = $target; breached = $breached; detail = $detail } }
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: dateResponded, isInSla and sla.id on the ticket; see Get-PsaCwSlaHours for the hours.
                    $slaId = [string](Get-PsaPath $raw 'sla.id')
                    $flag = if ((Get-PsaProp $raw 'isInSla') -eq $false) { $true } else { $null }
                    if ((Test-PsaBlank $slaId) -or $null -eq $Ticket.created) { if ($flag) { return (& $mk 'resolve' $null $true 'ConnectWise marks this ticket as out of SLA.') }; return $none }
                    $h = $null; try { $h = Get-PsaCwSlaHours $slaId ([string](Get-PsaPath $raw 'priority.id')) } catch { $h = $null }
                    if ($null -eq $h) { return $none }
                    $responded = ConvertTo-PsaDate (Get-PsaProp $raw 'dateResponded')
                    if (-not $responded -and $null -ne $h.respond) { return (& $mk 'respond' $Ticket.created.AddHours($h.respond) $flag "ConnectWise SLA: respond within $($h.respond) hours") }
                    if ($null -ne $h.resolve) { return (& $mk 'resolve' $Ticket.created.AddHours($h.resolve) $flag "ConnectWise SLA: resolve within $($h.resolve) hours") }
                    return $none
                }
                'autotask' {
                    # Unverified: firstResponseDueDateTime, firstResponseDateTime, resolvedDueDateTime, serviceLevelAgreementHasBeenMet.
                    $flag = if ((Get-PsaProp $raw 'serviceLevelAgreementHasBeenMet') -eq $false) { $true } else { $null }
                    $fr = ConvertTo-PsaDate (Get-PsaProp $raw 'firstResponseDateTime'); $frDue = ConvertTo-PsaDate (Get-PsaProp $raw 'firstResponseDueDateTime')
                    $resDue = ConvertTo-PsaDate (Get-PsaProp $raw 'resolvedDueDateTime'); $due = ConvertTo-PsaDate (Get-PsaProp $raw 'dueDateTime')
                    if (-not $fr -and $frDue) { return (& $mk 'respond' $frDue $flag 'Autotask first response due date') }
                    if ($resDue) { return (& $mk 'resolve' $resDue $flag 'Autotask resolution due date') }
                    if ($due) { return (& $mk 'due' $due $flag 'Autotask ticket due date') }
                    return $none
                }
                'halopsa' {
                    # Unverified: respondbydate, responsedate and fixbydate (1900-01-01 means none).
                    $responded = ConvertTo-PsaDate (Get-PsaProp $raw 'responsedate'); $respondBy = ConvertTo-PsaDate (Get-PsaProp $raw 'respondbydate'); $fixBy = ConvertTo-PsaDate (Get-PsaProp $raw 'fixbydate')
                    if (-not $responded -and $respondBy) { return (& $mk 'respond' $respondBy $null 'HaloPSA respond-by date') }
                    if ($fixBy) { return (& $mk 'resolve' $fixBy $null 'HaloPSA fix-by date') }
                    return $none
                }
                'kaseyabms' {
                    # Unverified: the due-date field names.
                    foreach ($n in @('ResponseDueDate', 'ResolutionDueDate', 'DueDate')) { $d = ConvertTo-PsaDate (Get-PsaProp $raw $n); if ($d) { return (& $mk $(if ($n -eq 'ResponseDueDate') { 'respond' } elseif ($n -eq 'DueDate') { 'due' } else { 'resolve' }) $d $null "Kaseya BMS $n") } }
                    return $none
                }
                'syncro' {
                    # Unverified: due_date on the ticket.
                    $d = ConvertTo-PsaDate (Get-PsaProp $raw 'due_date'); if ($d) { return (& $mk 'due' $d $null 'Syncro due date') }
                    return $none
                }
                'zendesk' {
                    # Unverified: SLA policy metrics (slas.policy_metrics with metric, stage, breach_at). Needs a plan with SLA policies.
                    $slas = Get-PsaProp $raw 'slas'
                    if ($null -eq $slas) { try { $slas = Get-PsaPath (Invoke-Psa GET "/tickets/$($Ticket.id)?include=slas") 'ticket.slas' } catch { $slas = $null } }
                    $metrics = @(Get-PsaProp $slas 'policy_metrics' | Where-Object { $null -ne $_ })
                    if (-not $metrics.Count) { return $none }
                    $active = @($metrics | Where-Object { [string](Get-PsaProp $_ 'stage') -eq 'active' -and (ConvertTo-PsaDate (Get-PsaProp $_ 'breach_at')) } | Sort-Object { ConvertTo-PsaDate (Get-PsaProp $_ 'breach_at') })
                    if (-not $active.Count) { return (& $mk '' $null $null 'Zendesk SLA is paused or already met') }
                    $m = $active[0]; $metric = [string](Get-PsaProp $m 'metric')
                    return (& $mk $(if ($metric -match 'reply') { 'respond' } else { 'resolve' }) (ConvertTo-PsaDate (Get-PsaProp $m 'breach_at')) $null "Zendesk SLA policy ($metric)")
                }
            }
            return $none
        }

        # Moves a ticket to another board (ConnectWise), queue (Autotask, Kaseya BMS), team (HaloPSA), issue type (Syncro)
        # or group (Zendesk). -Queue is a name or an id. Throws when the PSA refuses.
        function Set-PsaQueue {
            param([string]$Id, [string]$Queue)
            $c = Get-PsaConn
            if ([string]::IsNullOrWhiteSpace($Queue)) { throw 'Set-PsaQueue needs a queue name or id.' }
            $q = $Queue.Trim(); $isNum = $q -match '^\d+$'
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: json-patch on board (a reference, so {id} or {name}). CW may refuse when the status doesn't exist on the new board.
                    $val = if ($isNum) { @{ id = [int]$q } } else { @{ name = $q } }
                    $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'board'; value = $val })
                }
                'autotask' {
                    # Unverified: PATCH /Tickets with queueID (the field at_create_ticket uses).
                    $qv = if ($isNum) { $q } else { Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'queueID') @("(?i)^$([regex]::Escape($q))$") }
                    if ($null -eq $qv) { throw "Autotask has no ticket queue named '$q'." }
                    $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; queueID = [int]$qv })
                }
                'halopsa' {
                    # Unverified: team_id or team (name) on the POST /Tickets update.
                    $b = [ordered]@{ id = [long]$Id }; if ($isNum) { $b.team_id = [long]$q } else { $b.team = $q }
                    $null = Invoke-Psa POST '/Tickets' @($b)
                }
                'kaseyabms' {
                    # Unverified: json-patch on /QueueId.
                    if (-not $isNum) { throw 'Kaseya BMS needs a numeric queue id.' }
                    $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/QueueId'; value = [int]$q })
                }
                'syncro' {
                    # Unverified: Syncro has no queues; the issue type (problem_type) is the closest field.
                    $null = Invoke-Psa PUT "/tickets/$Id" @{ problem_type = $q }
                }
                'zendesk' {
                    # group_id on PUT /tickets is in PSA.md. Unverified: the GET /groups name lookup.
                    $gid = $q
                    if (-not $isNum) {
                        $g = @(Get-PsaProp (Invoke-Psa GET '/groups?per_page=100') 'groups' | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ 'name') -ieq $q }) | Select-Object -First 1
                        if (-not $g) { throw "Zendesk has no group named '$q'." }
                        $gid = [string](Get-PsaProp $g 'id')
                    }
                    $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ group_id = [long]$gid } }
                }
            }
        }

        # The ticket's notes: @(@{ text; internal; created }).
        function Get-PsaTicketNotes {
            param([string]$Id)
            $c = Get-PsaConn
            $what = "read the notes on ticket $Id"
            $rows = @(); $tp = 'text'; $ip = ''; $dp = 'created'; $flip = $false
            switch ($c.Psa) {
                'connectwise' { $rows = @(Invoke-PsaRead "/service/tickets/$Id/notes?orderBy=$(ConvertTo-PsaQuery 'id desc')&pageSize=100" $what); $ip = 'internalAnalysisFlag'; $dp = 'dateCreated' }
                'autotask' {
                    # Unverified: TicketNotes query by ticketID; "internal" is read from the publish label.
                    $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'ticketID'; value = [long]$Id }) }
                    $rows = @(Get-PsaProp (Invoke-PsaRead "/TicketNotes/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 5 -Compress))" $what) 'items'); $tp = 'description'; $dp = 'createDateTime'
                    $pubVals = @(Get-PsaAtPicklist 'TicketNotes' 'publish')
                    return @($rows | Where-Object { $null -ne $_ } | ForEach-Object {
                            $pv = [string](Get-PsaProp $_ 'publish'); $pl = @($pubVals | Where-Object { [string](Get-PsaProp $_ 'value') -eq $pv }) | Select-Object -First 1
                            @{ text = [string](Get-PsaProp $_ 'description'); internal = ([string](Get-PsaProp $pl 'label') -match '(?i)internal'); created = (ConvertTo-PsaDate (Get-PsaProp $_ 'createDateTime')) }
                        })
                }
                'halopsa' { $rows = @(Get-PsaProp (Invoke-PsaRead "/Actions?ticket_id=$Id&count=100" $what) 'actions'); $tp = 'note'; $ip = 'hiddenfromuser'; $dp = 'datetime' }   # Unverified
                'kaseyabms' { $rows = @(Get-PsaBmsList (Invoke-PsaRead "/servicedesk/tickets/$Id/notes" $what)); $tp = 'Details'; $ip = 'IsInternal'; $dp = 'NoteDate' }      # Unverified
                'syncro' { $rows = @(Get-PsaPath (Invoke-PsaRead "/tickets/$Id" $what) 'ticket.comments'); $tp = 'body'; $ip = 'hidden'; $dp = 'created_at' }
                'zendesk' { $rows = @(Get-PsaProp (Invoke-PsaRead "/tickets/$Id/comments" $what) 'comments'); $tp = 'body'; $ip = 'public'; $dp = 'created_at'; $flip = $true }  # Unverified
            }
            return @($rows | Where-Object { $null -ne $_ } | ForEach-Object {
                    $iv = [bool](Get-PsaProp $_ $ip); if ($flip) { $iv = -not $iv }
                    @{ text = [string](Get-PsaProp $_ $tp); internal = $iv; created = (ConvertTo-PsaDate (Get-PsaProp $_ $dp)) }
                })
        }
        # Autotask assigns a resource together with a role. Returns the resource's default Service Desk role, or ''.
        function Get-PsaDefaultRole {
            param([string]$UserId)
            $c = Get-PsaConn
            if ($c.Psa -ne 'autotask' -or [string]::IsNullOrWhiteSpace($UserId)) { return '' }
            # Unverified: defaultServiceDeskRoleID on the Resources entity.
            $v = Get-PsaPath (Invoke-Psa GET "/Resources/$UserId") 'item.defaultServiceDeskRoleID'
            if (Test-PsaBlank $v) { return '' }
            return [string]$v
        }
        # ---------- end psa-extra.ps1 ----------
        # <<< src/psa-extra.ps1

        $escMarker = '[Auto-Escalation]'
        $run = @{ warnings = (New-Object System.Collections.ArrayList); actions = (New-Object System.Collections.ArrayList) }
        function Stop-EscRun {
            param([string]$Status, [string]$Message)
            Set-NodeOutput ([ordered]@{ status = $Status; message = $Message; public_note = ''; internal_note = $Message; ticket_id = ''; preview = $false; escalations = @(); counts = @{}; settings = @{}; actions = @($run.actions); warnings = @($run.warnings) })
            throw $Message
        }

        # ---- inputs ----
        $escIn = Get-NodeInput
        if ($escIn -is [string]) { $escIn = $(if ($escIn.Trim()) { try { $escIn | ConvertFrom-Json } catch { $null } } else { $null }) }
        $escWrap = Get-PsaProp $escIn 'trigger'; if ($null -ne $escWrap) { $escIn = $escWrap }
        function Get-EscInput {
            param([string]$Name, $Default)
            $v = Get-PsaProp $escIn $Name
            if ($null -eq $v) { return $Default }
            if ($v -is [string] -and ([string]::IsNullOrWhiteSpace($v) -or $v.Trim().StartsWith('@'))) { return $Default }
            return $v
        }
        function ConvertTo-EscBool { param($v) if ($v -is [bool]) { return $v }; return ([string]$v).Trim() -match '^(?i)(true|yes|1|on)$' }
        function ConvertTo-EscInt {
            param($v, [string]$Name, [int]$Min, [int]$Max)
            $n = 0; if (-not [int]::TryParse(([string]$v).Trim(), [ref]$n) -or $n -lt $Min -or $n -gt $Max) { throw "$Name must be a whole number from $Min to $Max." }
            return $n
        }
        # The "," keeps a one-item JSON list a list: a function return unrolls arrays.
        function ConvertFrom-EscJson { param($v, [string]$Name) if ($v -is [string]) { try { return , ($v | ConvertFrom-Json -NoEnumerate) } catch { throw "$Name isn't valid JSON." } }; return , $v }
        # A list of name/value pairs from a JSON object, hashtable or pscustomobject.
        function Get-EscPairs {
            param($o)
            $pairs = New-Object System.Collections.ArrayList
            if ($null -eq $o) { return , $pairs }
            if ($o -is [System.Collections.IDictionary]) { foreach ($k in @($o.Keys)) { $null = $pairs.Add(@([string]$k, $o[$k])) } }
            else { foreach ($pp in @($o.PSObject.Properties)) { $null = $pairs.Add(@($pp.Name, $pp.Value)) } }
            return , $pairs
        }
        function ConvertTo-EscMinutes {
            param($Value)
            $m = @{ critical = 15; high = 60; medium = 240; low = 480 }
            if ($null -eq $Value) { return $m }
            foreach ($p in (Get-EscPairs (ConvertFrom-EscJson $Value 'minutes_untouched_by_priority'))) {
                $k = Get-PsaPriorityHint ([string]$p[0])
                $n = 0; if (-not $k -or -not [int]::TryParse([string]$p[1], [ref]$n) -or $n -lt 1) { throw "minutes_untouched_by_priority needs a whole number of minutes (1 or more) for each of critical, high, medium and low. '$($p[0])' was '$($p[1])'." }
                $m[$k] = $n
            }
            return $m
        }
        # escalation_map: {"<from queue name or id>": "<to queue>"} or {"<from>": {"queue": "...", "assignee": "...", "role": "..."}},
        # or a list [{"from": "...", "queue": "...", "assignee": "...", "role": "..."}]. "*" matches any queue without its own entry.
        function ConvertTo-EscMap {
            param($Value)
            $out = New-Object System.Collections.ArrayList
            if ($null -eq $Value) { return , $out }
            $v = ConvertFrom-EscJson $Value 'escalation_map'
            $items = New-Object System.Collections.ArrayList
            if ($v -is [array]) { foreach ($e in $v) { $null = $items.Add(@([string](Get-PsaProp $e 'from'), $e)) } }
            else { foreach ($p in (Get-EscPairs $v)) { $null = $items.Add($p) } }
            foreach ($it in $items) {
                $from = ([string]$it[0]).Trim(); $e = $it[1]
                if (-not $from) { throw 'Every escalation_map entry needs a "from" queue name or id (or "*").' }
                $q = ''; $a = ''; $r = ''
                if ($e -is [string] -or $e -is [ValueType]) { $q = [string]$e }
                else {
                    foreach ($n in @('queue', 'to', 'board', 'team', 'group')) { $x = Get-PsaProp $e $n; if (-not (Test-PsaBlank $x)) { $q = [string]$x; break } }
                    foreach ($n in @('assignee', 'user', 'user_id', 'dispatcher_user_id')) { $x = Get-PsaProp $e $n; if (-not (Test-PsaBlank $x)) { $a = [string]$x; break } }
                    $x = Get-PsaProp $e 'role'; if (-not (Test-PsaBlank $x)) { $r = [string]$x }
                }
                if (-not $q.Trim() -and -not $a.Trim()) { throw "The escalation_map entry for '$from' names no queue and no assignee." }
                $null = $out.Add(@{ from = $from.ToLowerInvariant(); fromLabel = $from; queue = $q.Trim(); assignee = $a.Trim(); role = $r.Trim() })
            }
            return , $out
        }
        function Format-EscSpan {
            param([double]$Minutes)
            $m = [int][Math]::Round([Math]::Abs($Minutes))
            if ($m -ge 2880) { return "$([int][Math]::Floor($m / 1440)) days" }
            if ($m -ge 120) { $hrs = "$([int][Math]::Floor($m / 60)) hours"; if ($m % 60) { $hrs += " $($m % 60) minutes" }; return $hrs }
            return "$m minutes"
        }

        try {
            $preview = ConvertTo-EscBool (Get-EscInput 'preview' $false)
            $maxT = ConvertTo-EscInt (Get-EscInput 'max_tickets' 10) 'max_tickets' 1 100
            $maxScan = ConvertTo-EscInt (Get-EscInput 'max_scan' 500) 'max_scan' 1 5000
            $limits = ConvertTo-EscMinutes (Get-EscInput 'minutes_untouched_by_priority' $null)
            $riskPct = ConvertTo-EscInt (Get-EscInput 'sla_risk_percent' 80) 'sla_risk_percent' 1 100
            $checkSla = ConvertTo-EscBool (Get-EscInput 'check_sla' $true)
            # A Routine sends no input, so the AutoEscalation-Map secret (the same JSON) is the default map.
            $mapRaw = Get-EscInput 'escalation_map' $null; if ($null -eq $mapRaw) { $ms = Get-PsaSecret 'AutoEscalation-Map'; if (-not [string]::IsNullOrWhiteSpace($ms)) { $mapRaw = $ms } }
            $map = ConvertTo-EscMap $mapRaw
            # A Routine sends no input, so the Dispatcher-Email secret is the default recipient.
            $dRaw = Get-EscInput 'dispatcher_email' ''; if (-not ([string]$dRaw).Trim()) { $dRaw = [string](Get-PsaSecret 'Dispatcher-Email') }
            $dispatch = @(@($dRaw) | ForEach-Object { ([string]$_) -split '[,;]' } | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            foreach ($a in $dispatch) { if ($a -notmatch '^[^@\s]+@[^@\s]+\.[^@\s]+$') { throw "'$a' in dispatcher_email isn't an email address." } }
            $skip = @(@(Get-EscInput 'skip_statuses' 'waiting,pending,on hold,scheduled') | ForEach-Object { ([string]$_) -split '[,;]' } | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ })
            $settings = [ordered]@{
                psa = [string](Get-EscInput 'psa' ''); preview = $preview; max_tickets = $maxT; minutes_untouched_by_priority = $limits; sla_risk_percent = $riskPct
                check_sla = $checkSla; dispatcher_email = @($dispatch); skip_statuses = $skip; marker = $escMarker
                from = [string](Get-EscInput 'from' ''); message_stream = [string](Get-EscInput 'message_stream' 'outbound')
            }
        }
        catch { Stop-EscRun 'rejected' "Auto-Escalation didn't run because an input is invalid: $($_.Exception.Message)" }

        # ---- read the PSA ----
        try { $conn = Connect-Psa (Get-PsaType $settings.psa) }
        catch { Stop-EscRun 'error' "Auto-Escalation couldn't connect to the PSA. $($_.Exception.Message)" }
        $psaName = Get-PsaName
        $now = [datetime]::UtcNow
        try { $open = @(Find-PsaTickets -Max $maxScan) }
        catch { Stop-EscRun 'error' "Auto-Escalation couldn't read open tickets from $psaName. $($_.Exception.Message)" }
        $null = $run.actions.Add("Read $($open.Count) open tickets from $psaName.")
        if ($open.Count -ge $maxScan) { $null = $run.warnings.Add("Stopped reading at max_scan ($maxScan) open tickets, so some weren't checked.") }

        $counts = [ordered]@{ open = $open.Count; skipped = 0; atRisk = 0; alreadyEscalated = 0; notesUnreadable = 0; selected = 0; toReassign = 0; noteOnly = 0; overLimit = 0 }
        $cands = New-Object System.Collections.ArrayList
        $slaWarned = @{ done = $false }
        foreach ($t in $open) {
            $st = $t.status.ToLowerInvariant()
            if (@($skip | Where-Object { $st.Contains($_) }).Count) { $counts.skipped++; continue }
            $prio = if ($t.priority) { $t.priority } else { 'medium' }
            $limit = [int]$limits[$prio]
            $idle = if ($null -ne $t.updated) { ($now - $t.updated).TotalMinutes } else { 0 }
            $untouched = $idle -ge $limit
            $slaRisk = $false; $slaText = ''; $pct = 0
            if ($checkSla) {
                $sla = $null
                try { $sla = Get-PsaTicketSla $t }
                catch { if (-not $slaWarned.done) { $slaWarned.done = $true; $null = $run.warnings.Add("Couldn't read $psaName SLA details for some tickets, so only the untouched time was checked for them. First error: $($_.Exception.Message)") } }
                if ($null -ne $sla -and $sla.source -eq 'psa') {
                    $what = switch ($sla.kind) { 'respond' { 'respond-by' } 'resolve' { 'resolve-by' } default { 'due' } }
                    if ($null -ne $sla.target) {
                        $total = ($sla.target - $sla.start).TotalMinutes
                        $pct = if ($total -gt 0) { [int][Math]::Round(100 * ($now - $sla.start).TotalMinutes / $total) } else { 100 }
                        $when = $sla.target.ToString('ddd d MMM HH:mm', [Globalization.CultureInfo]::InvariantCulture) + ' UTC'
                        if ($now -ge $sla.target) { $slaRisk = $true; $slaText = "Its SLA $what time ($when) has passed." }
                        elseif ($pct -ge $riskPct) { $slaRisk = $true; $slaText = "It has used $pct% of the time to its SLA $what time ($when)." }
                    }
                    elseif ($sla.breached -eq $true) { $slaRisk = $true; $slaText = "$psaName marks it as out of SLA." }
                }
            }
            if (-not $untouched -and -not $slaRisk) { continue }
            $counts.atRisk++
            $score = [Math]::Max($(if ($limit -gt 0) { $idle / $limit } else { 0 }), $pct / 100.0)
            $null = $cands.Add(@{ t = $t; prio = $prio; limit = $limit; idle = $idle; untouched = $untouched; slaRisk = $slaRisk; slaText = $slaText; score = $score })
        }

        # Most overdue first; skip tickets already escalated (marker note); stop at max_tickets.
        $picked = New-Object System.Collections.ArrayList
        $noteReads = 0
        foreach ($cd in @($cands | Sort-Object { $_.score } -Descending)) {
            if ($picked.Count -ge $maxT) { $counts.overLimit++; continue }
            if ($noteReads -ge ($maxT * 5 + 20)) { $counts.overLimit++; continue }
            $noteReads++
            $notes = $null
            try { $notes = @(Get-PsaTicketNotes $cd.t.id) }
            catch {
                # Fail closed: without the notes we can't tell whether it was already escalated.
                $counts.notesUnreadable++
                $null = $run.warnings.Add("Skipped ticket $($cd.t.number) because its notes couldn't be read to check for an earlier escalation: $($_.Exception.Message)")
                continue
            }
            if (@($notes | Where-Object { $_.text -and $_.text.Contains($escMarker) }).Count) { $counts.alreadyEscalated++; continue }
            $null = $picked.Add($cd)
        }
        if ($counts.overLimit) { $null = $run.warnings.Add("$($counts.overLimit) more at-risk tickets were left for the next run because of max_tickets ($maxT).") }
        try { Resolve-PsaTicketNames @($picked | ForEach-Object { $_.t }) }
        catch { $null = $run.warnings.Add("Couldn't look up some company or technician names: $($_.Exception.Message)") }

        # ---- plan each escalation ----
        $escalations = @(foreach ($cd in $picked) {
                $t = $cd.t
                $qid = $t.queueId.ToLowerInvariant(); $qname = $t.queueName.Trim().ToLowerInvariant()
                $entry = @($map | Where-Object { $_.from -ne '*' -and (($qid -and $_.from -eq $qid) -or ($qname -and $_.from -eq $qname)) }) | Select-Object -First 1
                if (-not $entry) { $entry = @($map | Where-Object { $_.from -eq '*' }) | Select-Object -First 1 }
                $reasons = @()
                if ($cd.untouched) { $reasons += "It has had no update for $(Format-EscSpan $cd.idle), past the $($cd.limit)-minute limit for $($cd.prio) priority tickets." }
                if ($cd.slaRisk) { $reasons += $cd.slaText }
                $qLabel = if ($t.queueName) { $t.queueName } elseif ($t.queueId) { "queue $($t.queueId)" } else { 'no queue' }
                $active = (-not $cd.untouched) -and [bool]$t.assigneeId
                $action = 'note-only'; $why = ''; $toQ = ''; $toA = ''; $toR = ''
                if ($active) { $why = "It was updated recently and is assigned to $($t.assigneeName), so it stays with them." }
                elseif (-not $entry) { $why = "There is no escalation_map entry for $qLabel, so it wasn't moved." }
                else {
                    $toQ = $entry.queue; $toA = $entry.assignee; $toR = $entry.role
                    $sameQ = $toQ -and ($toQ.ToLowerInvariant() -eq $qid -or $toQ.ToLowerInvariant() -eq $qname)
                    if ($sameQ) { $toQ = '' }
                    $sameA = $toA -and ($toA -eq $t.assigneeId)
                    if ($sameA) { $toA = '' }
                    if ($toQ -or $toA) { $action = 'reassign' }
                    else { $why = "It is already where the escalation_map sends $qLabel tickets, so it wasn't moved again." }
                }
                if ($action -eq 'reassign') { $counts.toReassign++ } else { $counts.noteOnly++ }
                [ordered]@{
                    id = $t.id; number = $t.number; summary = $t.summary; company = $t.companyName; technician = $t.assigneeName; assigneeId = $t.assigneeId
                    queue = $qLabel; queueId = $t.queueId; priority = $cd.prio; priorityLabel = $t.priorityLabel; status = $t.status
                    minutesUntouched = [int][Math]::Round($cd.idle); untouched = $cd.untouched; slaAtRisk = $cd.slaRisk
                    reason = ($reasons -join ' '); action = $action; whyNotMoved = $why; toQueue = $toQ; toAssignee = $toA; toRole = $toR
                    result = $(if ($preview) { 'preview' } else { 'planned' }); outcome = ''; error = ''; noted = $false
                }
            })
        $counts.selected = $escalations.Count

        $checked = $open.Count - $counts.skipped
        if (-not $escalations.Count) {
            $msg = "No open tickets need escalating. $checked open tickets were checked."
            if ($counts.alreadyEscalated) { $msg += " $($counts.alreadyEscalated) at-risk tickets were already escalated earlier." }
        }
        elseif ($preview) { $msg = "Preview: $($escalations.Count) ticket$(if ($escalations.Count -ne 1) { 's' }) would be escalated ($($counts.toReassign) moved up a tier, $($counts.noteOnly) noted and flagged only). Nothing was changed. Run again with preview set to false to make the changes." }
        else { $msg = "$($escalations.Count) ticket$(if ($escalations.Count -ne 1) { 's' }) to escalate: $($counts.toReassign) to move up a tier and $($counts.noteOnly) to note and flag only." }

        Set-NodeOutput ([ordered]@{
                status = $(if ($preview -and $escalations.Count) { 'pending_confirmation' } else { 'success' }); message = $msg; public_note = ''; internal_note = $msg; ticket_id = ''
                preview = $preview; psa = $conn.Psa; psaName = $psaName; generatedAt = $now.ToString('yyyy-MM-ddTHH:mm:ssZ')
                escalations = @($escalations); counts = $counts; settings = $settings
                actions = @($run.actions); warnings = @($run.warnings)
            })
      timeoutSeconds: 300
      retryCount: 0
      parameters: []
      aiExtensions: []
      testInput: |-
        {
          "preview": true,
          "max_tickets": 10,
          "minutes_untouched_by_priority": {
            "critical": 15,
            "high": 60,
            "medium": 240,
            "low": 480
          },
          "sla_risk_percent": 80,
          "escalation_map": {
            "Service Desk": {
              "queue": "Tier 2"
            },
            "Tier 2": {
              "queue": "Tier 3"
            }
          },
          "dispatcher_email": "dispatch@example.com",
          "skip_statuses": "waiting,pending,on hold,scheduled",
          "psa": ""
        }
  - id: reassign
    name: Reassign up a tier
    type: powershell-script
    position:
      x: 460
      y: 80
    properties:
      script: |-
        # === Step 2: Reassign up a tier (Auto-Escalation) ===
        # For each planned escalation with action "reassign": moves the ticket to the mapped queue, board, team or
        # group, and/or assigns the mapped user. One tier per run. Does nothing in preview, and nothing for
        # "note-only" tickets (no map entry, or someone is actively working them).
        # >>> _shared/psa.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/psa.ps1: one adapter for six PSAs ----------
        # ConnectWise PSA, Autotask, HaloPSA, Kaseya BMS, Syncro and Zendesk.
        # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
        # The source of each call, and whether it has been checked, is in reference/build-kit/PSA.md.
        # Calls marked "Unverified" below have not been proven by a live run; check them before the first live write.
        # Secrets use the same Key Vault names as each PSA's catalog extension.
        # All state lives in the $PsaState hashtable and is changed in place, because the runner
        # runs a step in a child scope where $script: variables don't behave.

        $PsaState = @{
            Conn       = $null
            Picklists  = @{}
            MaxRetries = 4
            Secrets    = @{
                connectwise = @('CW-ApiUrl', 'CW-CompanyID', 'CW-PublicKey', 'CW-PrivateKey', 'CW-ClientId')
                autotask    = @('Autotask-ApiUrl', 'Autotask-ApiIntegrationCode', 'Autotask-Username', 'Autotask-Secret')
                halopsa     = @('Halo-ApiUrl', 'Halo-ClientId', 'Halo-ClientSecret')
                kaseyabms   = @('KaseyaBMS-ApiUrl', 'KaseyaBMS-Username', 'KaseyaBMS-Password', 'KaseyaBMS-CompanyName')
                syncro      = @('Syncro-ApiUrl', 'Syncro-ApiKey')
                zendesk     = @('Zendesk-BaseUrl', 'Zendesk-Email', 'Zendesk-ApiToken')
            }
            Names      = @{ connectwise = 'ConnectWise'; autotask = 'Autotask'; halopsa = 'HaloPSA'; kaseyabms = 'Kaseya BMS'; syncro = 'Syncro'; zendesk = 'Zendesk' }
        }

        # ---- small helpers (all Psa-prefixed so they don't clash with other shared files) ----
        function Get-PsaSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
        function Get-PsaProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-PsaPath { param($o, [string]$Path) foreach ($n in $Path -split '\.') { $o = Get-PsaProp $o $n; if ($null -eq $o) { return $null } }; return $o }
        function Test-PsaBlank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -eq '0') }
        function ConvertTo-PsaQuery { param([string]$s) return [uri]::EscapeDataString($s) }
        function Get-PsaText { param([string]$s, [int]$Max) if ($null -eq $s) { return '' }; if ($s.Length -gt $Max) { return $s.Substring(0, $Max) }; return $s }
        function Get-PsaName { if ($null -eq $PsaState.Conn) { return 'the PSA' }; return $PsaState.Names[$PsaState.Conn.Psa] }
        function Get-PsaConn { if ($null -eq $PsaState.Conn) { throw 'Call Connect-Psa before any other PSA function.' }; return $PsaState.Conn }
        # ConnectWise conditions quote strings and leave numbers bare.
        function Get-PsaCwOwner { param([string]$u) if ($u -match '^\d+$') { return "owner/id=$u" }; return "owner/identifier=`"$u`"" }
        function Get-PsaHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
        function Get-PsaRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
        function Get-PsaErrorText { param($Err) $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }; if (-not $d) { $d = [string]$Err.Exception.Message }; return $d }

        # Normalizes a priority hint to critical, high, medium or low ('' when blank).
        function Get-PsaPriorityHint {
            param([string]$Hint)
            $h = ([string]$Hint).Trim().ToLowerInvariant()
            if (-not $h) { return '' }
            if ($h -match '^(critical|urgent|emergency|p?1)$') { return 'critical' }
            if ($h -match '^(high|p?2)$') { return 'high' }
            if ($h -match '^(medium|normal|moderate|p?3)$') { return 'medium' }
            if ($h -match '^(low|p?4)$') { return 'low' }
            throw "Priority '$Hint' isn't one of: critical, high, medium, low."
        }
        $PsaState.PriorityPatterns = @{
            critical = @('(?i)critical', '(?i)urgent', '(?i)emergency', '(?i)\b(p|priority\s*)1\b')
            high     = @('(?i)high', '(?i)\b(p|priority\s*)2\b')
            medium   = @('(?i)medium', '(?i)normal', '(?i)moderate', '(?i)\b(p|priority\s*)3\b')
            low      = @('(?i)low', '(?i)\b(p|priority\s*)4\b')
        }
        # The first item whose label property matches one of the patterns, in pattern order.
        function Select-PsaByLabel {
            param($Items, [string]$LabelProp, [string[]]$Patterns)
            foreach ($p in $Patterns) {
                $hit = @($Items | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ $LabelProp) -match $p }) | Select-Object -First 1
                if ($hit) { return $hit }
            }
            return $null
        }

        # Which PSA: the run's psa input, then the PSA-Type secret, then ConnectWise when its secrets are
        # set (so runners set up before PSA-Type existed keep working). '' means none is configured.
        function Get-PsaType {
            param([string]$Requested)
            $v = $Requested; if ([string]::IsNullOrWhiteSpace($v) -or $v.StartsWith('@')) { $v = Get-PsaSecret 'PSA-Type' }
            if ([string]::IsNullOrWhiteSpace($v)) { if (Get-PsaSecret 'CW-ApiUrl') { return 'connectwise' }; return '' }
            $v = $v.Trim().ToLowerInvariant()
            $alias = @{ 'cw' = 'connectwise'; 'connectwise-manage' = 'connectwise'; 'connectwise psa' = 'connectwise'; 'connectwise manage' = 'connectwise'; 'autotask-psa' = 'autotask'; 'datto autotask' = 'autotask'; 'halo' = 'halopsa'; 'halo-psa' = 'halopsa'; 'kaseya' = 'kaseyabms'; 'kaseya-bms' = 'kaseyabms'; 'kaseya bms' = 'kaseyabms'; 'bms' = 'kaseyabms'; 'syncromsp' = 'syncro'; 'zendesk-ticketing' = 'zendesk' }
            if ($alias.ContainsKey($v)) { $v = $alias[$v] }
            if (-not $PsaState.Secrets.ContainsKey($v)) { throw "PSA '$v' isn't supported. Use one of: $(($PsaState.Secrets.Keys | Sort-Object) -join ', ')." }
            return $v
        }

        # Reads the PSA's secrets, mints a token where the PSA needs one, and keeps the connection in $PsaState.
        # With no -Psa it uses Get-PsaType. Returns @{ Psa; Base; Headers }.
        function Connect-Psa {
            param([string]$Psa)
            if ([string]::IsNullOrWhiteSpace($Psa)) { $Psa = Get-PsaType ''; if (-not $Psa) { throw 'No PSA is set up. Add the PSA-Type secret (connectwise, autotask, halopsa, kaseyabms, syncro or zendesk) to the runner Key Vault.' } }
            $Psa = $Psa.Trim().ToLowerInvariant()
            if (-not $PsaState.Secrets.ContainsKey($Psa)) { $Psa = Get-PsaType $Psa }
            $v = @{}; $missing = @()
            foreach ($n in $PsaState.Secrets[$Psa]) { $v[$n] = Get-PsaSecret $n; if ([string]::IsNullOrWhiteSpace($v[$n])) { $missing += $n } }
            if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
            $json = 'application/json'
            $c = $null
            switch ($Psa) {
                'connectwise' {
                    $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['CW-CompanyID'])+$($v['CW-PublicKey']):$($v['CW-PrivateKey'])"))
                    $c = @{ Base = $v['CW-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Basic $b"; clientId = $v['CW-ClientId']; Accept = $json } }
                }
                'autotask' {
                    $c = @{ Base = ($v['Autotask-ApiUrl'].TrimEnd('/') -replace '/atservicesrest/v1\.0$', '') + '/atservicesrest/v1.0'
                        Headers = @{ ApiIntegrationCode = $v['Autotask-ApiIntegrationCode']; UserName = $v['Autotask-Username']; Secret = $v['Autotask-Secret']; Accept = $json } }
                }
                'halopsa' {
                    $base = $v['Halo-ApiUrl'].TrimEnd('/') -replace '/api$', ''
                    $form = "grant_type=client_credentials&client_id=$([uri]::EscapeDataString($v['Halo-ClientId']))&client_secret=$([uri]::EscapeDataString($v['Halo-ClientSecret']))&scope=all"
                    $tok = $null
                    try { $tok = Invoke-RestMethod -Method POST -Uri "$base/auth/token" -Body $form -ContentType 'application/x-www-form-urlencoded' -ErrorAction Stop }
                    catch {
                        # Some instances run a separate auth server; /api/authinfo names it.
                        $info = Invoke-RestMethod -Method GET -Uri "$base/api/authinfo" -ErrorAction Stop
                        $authUrl = [string](Get-PsaProp $info 'auth_url'); if (-not $authUrl) { throw "HaloPSA sign-in failed and /api/authinfo named no auth server: $(Get-PsaErrorText $_)" }
                        $tok = Invoke-RestMethod -Method POST -Uri "$($authUrl.TrimEnd('/'))/token" -Body $form -ContentType 'application/x-www-form-urlencoded' -ErrorAction Stop
                    }
                    $access = Get-PsaProp $tok 'access_token'; if (-not $access) { throw 'HaloPSA sign-in returned no access_token. Check the Halo-* secrets.' }
                    $c = @{ Base = "$base/api"; Headers = @{ Authorization = "Bearer $access"; Accept = $json } }
                }
                'kaseyabms' {
                    $base = $v['KaseyaBMS-ApiUrl'].TrimEnd('/') -replace '/v2$', ''
                    # Unverified: the GrantType value 'password' (PSA.md).
                    $r = Invoke-RestMethod -Method POST -Uri "$base/v2/security/authenticate" -Form @{ UserName = $v['KaseyaBMS-Username']; Password = $v['KaseyaBMS-Password']; Tenant = $v['KaseyaBMS-CompanyName']; GrantType = 'password' } -ErrorAction Stop
                    $token = Get-PsaPath $r 'Result.AccessToken'; if (-not $token) { $token = Get-PsaPath $r 'result.accessToken' }
                    if (-not $token) { throw 'Kaseya BMS sign-in returned no Result.AccessToken. Check the KaseyaBMS-* secrets.' }
                    $c = @{ Base = "$base/v2"; Headers = @{ Authorization = "Bearer $token"; Accept = $json } }
                }
                'syncro' { $c = @{ Base = $v['Syncro-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Bearer $($v['Syncro-ApiKey'])"; Accept = $json } } }
                'zendesk' {
                    # Unverified: whether the Zendesk-BaseUrl secret already ends in /api/v2, so it is added when missing.
                    $base = $v['Zendesk-BaseUrl'].TrimEnd('/'); if ($base -notmatch '/api/v2$') { $base += '/api/v2' }
                    $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['Zendesk-Email'])/token:$($v['Zendesk-ApiToken'])"))
                    $c = @{ Base = $base; Headers = @{ Authorization = "Basic $b"; Accept = $json } }
                }
            }
            $c.Psa = $Psa
            $PsaState.Conn = $c
            $PsaState.Picklists = @{}
            return $c
        }

        # One call to the connected PSA. Path is relative to the API base (or a full URL).
        # Retries 429 (and 502, 503, 504 on GET) honoring Retry-After; other errors throw a plain message.
        function Invoke-Psa {
            param([string]$Method, [string]$Path, $Body = $null, [string]$ContentType = 'application/json')
            $c = Get-PsaConn
            $uri = if ($Path -match '^https?://') { $Path } else { "$($c.Base)$Path" }
            for ($i = 1; $i -le $PsaState.MaxRetries; $i++) {
                $p = @{ Method = $Method; Uri = $uri; Headers = $c.Headers; ErrorAction = 'Stop' }
                if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }); $p.ContentType = $ContentType }
                try { return Invoke-RestMethod @p }
                catch {
                    $code = Get-PsaHttpStatus $_
                    if (($code -eq 429 -or ($Method -eq 'GET' -and $code -in @(502, 503, 504))) -and $i -lt $PsaState.MaxRetries) { Start-Sleep -Seconds (Get-PsaRetryAfter $_ $i); continue }
                    throw "$(Get-PsaName) $Method $Path failed$(if ($code) { " (HTTP $code)" }): $(Get-PsaErrorText $_)"
                }
            }
        }

        # Autotask picklists are per tenant: match on the label, never a hard-coded number.
        function Get-PsaAtPicklist {
            param([string]$Entity, [string]$Field)
            if (-not $PsaState.Picklists.ContainsKey($Entity)) { $PsaState.Picklists[$Entity] = @(Get-PsaProp (Invoke-Psa GET "/$Entity/entityInformation/fields") 'fields') }
            $f = @($PsaState.Picklists[$Entity] | Where-Object { [string](Get-PsaProp $_ 'name') -eq $Field }) | Select-Object -First 1
            return @(Get-PsaProp $f 'picklistValues' | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'isActive') -ne $false })
        }
        function Select-PsaAtValue {
            param($Values, [string[]]$Patterns)
            $hit = Select-PsaByLabel $Values 'label' $Patterns
            if ($hit) { return (Get-PsaProp $hit 'value') }
            return $null
        }
        function Get-PsaAtCompleteStatuses {
            $v = @(Get-PsaAtPicklist 'Tickets' 'status' | Where-Object { [string](Get-PsaProp $_ 'label') -match '(?i)complete' } | ForEach-Object { [int](Get-PsaProp $_ 'value') })
            if (-not $v.Count) { $v = @(5) }
            return $v
        }

        # Normalized ticket: @{ id; summary; description; companyId; status; assigneeId; assigneeIds; raw }.
        function Get-PsaTicket {
            param([string]$Id)
            $c = Get-PsaConn
            switch ($c.Psa) {
                'connectwise' {
                    $t = Invoke-Psa GET "/service/tickets/$Id"
                    $desc = ''
                    try { $n = @(Invoke-Psa GET "/service/tickets/$Id/notes?orderBy=$(ConvertTo-PsaQuery 'id asc')&pageSize=1"); if ($n.Count -and $null -ne $n[0]) { $desc = [string](Get-PsaProp $n[0] 'text') } } catch { }
                    $owner = Get-PsaProp $t 'owner'
                    $a = @(@((Get-PsaProp $owner 'identifier'), (Get-PsaProp $owner 'id')) | Where-Object { -not (Test-PsaBlank $_) } | ForEach-Object { [string]$_ })
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'summary'); description = $desc; companyId = [string](Get-PsaPath $t 'company.id'); status = [string](Get-PsaPath $t 'status.name'); assigneeId = $(if ($a.Count) { $a[0] } else { '' }); assigneeIds = $a; raw = $t }
                }
                'autotask' {
                    $t = Get-PsaProp (Invoke-Psa GET "/Tickets/$Id") 'item'
                    if ($null -eq $t) { throw "Autotask returned no ticket $Id." }
                    $a = Get-PsaProp $t 'assignedResourceID'
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'title'); description = [string](Get-PsaProp $t 'description'); companyId = [string](Get-PsaProp $t 'companyID'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                }
                'halopsa' {
                    $t = Invoke-Psa GET "/Tickets/$($Id)?includedetails=true"
                    $a = Get-PsaProp $t 'agent_id'
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'summary'); description = [string](Get-PsaProp $t 'details'); companyId = [string](Get-PsaProp $t 'client_id'); status = [string](Get-PsaProp $t 'status_id'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                }
                'kaseyabms' {
                    $t = Get-PsaProp (Invoke-Psa GET "/servicedesk/tickets/$Id") 'Result'
                    if ($null -eq $t) { throw "Kaseya BMS returned no ticket $Id." }
                    $a = Get-PsaProp $t 'AssigneeId'
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'Title'); description = [string](Get-PsaProp $t 'Details'); companyId = [string](Get-PsaProp $t 'AccountId'); status = [string](Get-PsaProp $t 'StatusName'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                }
                'syncro' {
                    $t = Get-PsaProp (Invoke-Psa GET "/tickets/$Id") 'ticket'
                    if ($null -eq $t) { throw "Syncro returned no ticket $Id." }
                    $cm = @(Get-PsaProp $t 'comments' | Where-Object { $null -ne $_ })
                    $desc = if ($cm.Count) { [string](Get-PsaProp $cm[0] 'body') } else { '' }
                    $pt = [string](Get-PsaProp $t 'problem_type'); if ($pt) { $desc = "Issue type: $pt`n$desc" }
                    $a = Get-PsaProp $t 'user_id'
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'subject'); description = $desc; companyId = [string](Get-PsaProp $t 'customer_id'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                }
                'zendesk' {
                    $t = Get-PsaProp (Invoke-Psa GET "/tickets/$Id") 'ticket'
                    if ($null -eq $t) { throw "Zendesk returned no ticket $Id." }
                    $a = Get-PsaProp $t 'assignee_id'
                    return @{ id = $Id; summary = [string](Get-PsaProp $t 'subject'); description = [string](Get-PsaProp $t 'description'); companyId = [string](Get-PsaProp $t 'organization_id'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                }
            }
        }

        # Creates a ticket and returns @{ id; raw }.
        #   -CompanyId  the PSA's own company id (Find-PsaCompany resolves a name to it)
        #   -Priority   a hint: critical, high, medium or low. It is matched to the tenant's priority list where the PSA has one.
        #   -Queue      optional board (ConnectWise), queue (Autotask, Kaseya BMS), team (HaloPSA), issue type (Syncro) or group id (Zendesk)
        #   -Extra      optional hashtable of raw PSA fields merged into the body, for tenant-specific required ids
        function New-PsaTicket {
            param([string]$CompanyId, [string]$Summary, [string]$Description = '', [string]$Priority = '', [string]$Queue = '', [hashtable]$Extra = @{})
            $c = Get-PsaConn
            if ([string]::IsNullOrWhiteSpace($CompanyId)) { throw 'New-PsaTicket needs a company id. Use Find-PsaCompany to look one up by name.' }
            if ([string]::IsNullOrWhiteSpace($Summary)) { throw 'New-PsaTicket needs a summary.' }
            $hint = Get-PsaPriorityHint $Priority
            $pats = @(); if ($hint) { $pats = $PsaState.PriorityPatterns[$hint] }
            $isNum = $Queue -match '^\d+$'
            $id = $null; $raw = $null
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: not in PSA.md yet. Body and /service/priorities lookup from the CW swagger clients.
                    $b = [ordered]@{ summary = (Get-PsaText $Summary 100); company = @{ id = [int]$CompanyId }; initialDescription = $Description }
                    if ($Queue) { $b.board = $(if ($isNum) { @{ id = [int]$Queue } } else { @{ name = $Queue } }) }
                    if ($hint) { $pr = Select-PsaByLabel @(Invoke-Psa GET '/service/priorities?pageSize=100') 'name' $pats; if ($pr) { $b.priority = @{ id = [int](Get-PsaProp $pr 'id') } } }
                    foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/service/tickets' $b
                    $id = Get-PsaProp $raw 'id'
                }
                'autotask' {
                    # From the at_create_ticket extension descriptor: title, companyID, status, priority and dueDateTime are required.
                    $status = Get-PsaSecret 'Autotask-NewStatusId'
                    if (-not $status) { $status = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'status') @('^New$', '(?i)^new') }
                    if (-not $status) { $status = 1 }
                    $prio = $null
                    if ($hint) { $prio = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'priority') $pats }
                    if ($null -eq $prio) { $def = @(Get-PsaAtPicklist 'Tickets' 'priority' | Where-Object { (Get-PsaProp $_ 'isDefaultValue') -eq $true }) | Select-Object -First 1; if ($def) { $prio = Get-PsaProp $def 'value' } }
                    if ($null -eq $prio) { $prio = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'priority') $PsaState.PriorityPatterns['medium'] }
                    if ($null -eq $prio) { throw 'Could not find an Autotask ticket priority. Pass -Priority, or -Extra @{ priority = <id> }.' }
                    $due = (Get-Date).ToUniversalTime().AddDays($(switch ($hint) { 'critical' { 0.25 } 'high' { 1 } 'low' { 7 } default { 3 } }))
                    $b = [ordered]@{ companyID = [long]$CompanyId; title = (Get-PsaText $Summary 255); description = (Get-PsaText $Description 8000); status = [int]$status; priority = [int]$prio; dueDateTime = $due.ToString('yyyy-MM-ddTHH:mm:ssZ') }
                    if ($Queue) {
                        $qv = if ($isNum) { $Queue } else { Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'queueID') @("^$([regex]::Escape($Queue))$") }
                        if ($null -eq $qv) { throw "Autotask has no ticket queue named '$Queue'." }
                        $b.queueID = [int]$qv
                    }
                    $bc = Get-PsaSecret 'Autotask-BillingCodeId'; if ($bc) { $b.billingCodeID = [long]$bc }
                    foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/Tickets' $b
                    $id = Get-PsaProp $raw 'itemId'
                }
                'halopsa' {
                    # Unverified: not in PSA.md yet. Halo priority ids are per tenant; 1 to 4 are the out-of-box Critical to Low.
                    $b = [ordered]@{ summary = $Summary; details = $Description; client_id = [long]$CompanyId }
                    if ($hint) { $b.priority_id = @{ critical = 1; high = 2; medium = 3; low = 4 }[$hint] }
                    if ($Queue) { if ($isNum) { $b.team_id = [long]$Queue } else { $b.team = $Queue } }
                    foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/Tickets' @($b)
                    $first = @($raw)[0]
                    $id = Get-PsaProp $first 'id'
                }
                'kaseyabms' {
                    # Unverified: not in PSA.md yet. BMS needs tenant ids for status, type, source and priority; they come from
                    # the optional KaseyaBMS-NewStatusId, -TicketTypeId, -TicketSourceId, -PriorityId and -QueueId secrets, or -Extra.
                    $b = [ordered]@{ Title = $Summary; Details = $Description; AccountId = [long]$CompanyId; OpenDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }
                    foreach ($pair in @(@('StatusId', 'KaseyaBMS-NewStatusId'), @('TypeId', 'KaseyaBMS-TicketTypeId'), @('SourceId', 'KaseyaBMS-TicketSourceId'), @('PriorityId', 'KaseyaBMS-PriorityId'), @('QueueId', 'KaseyaBMS-QueueId'))) {
                        $sv = Get-PsaSecret $pair[1]; if ($sv -and $sv -match '^\d+$') { $b[$pair[0]] = [int]$sv }
                    }
                    if ($Queue) { if (-not $isNum) { throw 'Kaseya BMS needs a numeric queue id for -Queue.' }; $b.QueueId = [int]$Queue }
                    foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/servicedesk/tickets' $b
                    $id = Get-PsaPath $raw 'Result.Id'; if ($null -eq $id) { $id = Get-PsaProp $raw 'Result' }
                }
                'syncro' {
                    # Unverified: not in PSA.md yet. Syncro takes the description as the first comment, and priority as a label.
                    $b = [ordered]@{ customer_id = [long]$CompanyId; subject = $Summary; status = 'New'; comments_attributes = @(@{ subject = 'Initial Issue'; body = $(if ($Description) { $Description } else { $Summary }); hidden = $false; do_not_email = $true }) }
                    if ($hint) { $b.priority = @{ critical = '0 Urgent'; high = '1 High'; medium = '2 Normal'; low = '3 Low' }[$hint] }
                    if ($Queue) { $b.problem_type = $Queue }
                    foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/tickets' $b
                    $id = Get-PsaPath $raw 'ticket.id'
                }
                'zendesk' {
                    # Unverified: not in PSA.md yet. Zendesk priorities are fixed: urgent, high, normal, low.
                    $t = [ordered]@{ subject = $Summary; comment = @{ body = $(if ($Description) { $Description } else { $Summary }) }; organization_id = [long]$CompanyId }
                    if ($hint) { $t.priority = @{ critical = 'urgent'; high = 'high'; medium = 'normal'; low = 'low' }[$hint] }
                    if ($Queue) { if (-not $isNum) { throw 'Zendesk needs a numeric group id for -Queue.' }; $t.group_id = [long]$Queue }
                    foreach ($k in $Extra.Keys) { $t[$k] = $Extra[$k] }
                    $raw = Invoke-Psa POST '/tickets' @{ ticket = $t }
                    $id = Get-PsaPath $raw 'ticket.id'
                }
            }
            if (Test-PsaBlank $id) { throw "$(Get-PsaName) accepted the new ticket but returned no id." }
            return @{ id = [string]$id; raw = $raw }
        }

        # Adds a note. Internal (technician-only) by default; -Public makes it visible to the client.
        # Throws when the PSA rejects it.
        function Add-PsaNote {
            param([string]$Id, [string]$Text, [string]$Title = 'Note', [switch]$Public, [switch]$Internal)
            $c = Get-PsaConn
            $pub = [bool]$Public
            switch ($c.Psa) {
                'connectwise' {
                    # Public notes go on the Discussion tab (detailDescriptionFlag). Unverified for public notes; internal is [ext].
                    $null = Invoke-Psa POST "/service/tickets/$Id/notes" @{ text = $Text; internalAnalysisFlag = (-not $pub); detailDescriptionFlag = $pub; resolutionFlag = $false }
                }
                'autotask' {
                    $pv = $null
                    if ($pub) {
                        # Unverified: which publish label makes a note client-visible. Tries "All Autotask Users" style labels.
                        $pv = Get-PsaSecret 'Autotask-NotePublicPublishId'
                        if (-not $pv) { $pv = Select-PsaAtValue (Get-PsaAtPicklist 'TicketNotes' 'publish') @('(?i)^All Autotask Users$', '(?i)^All', '(?i)public') }
                    }
                    else {
                        $pv = Get-PsaSecret 'Autotask-NotePublishId'
                        if (-not $pv) { $pv = Select-PsaAtValue (Get-PsaAtPicklist 'TicketNotes' 'publish') @('^Internal Only$', 'Internal') }
                    }
                    $type = Get-PsaSecret 'Autotask-NoteTypeId'
                    if (-not $type) { $vals = @(Get-PsaAtPicklist 'TicketNotes' 'noteType' | Where-Object { [string](Get-PsaProp $_ 'value') -ne '13' -and [string](Get-PsaProp $_ 'label') -notmatch 'Workflow' }); $type = Select-PsaAtValue $vals @('Internal', 'Task Detail', 'Detail', '.') }
                    if ($null -eq $pv -or $null -eq $type) { throw 'Could not find the Autotask note publish and type values. Set the Autotask-NotePublishId and Autotask-NoteTypeId secrets.' }
                    $null = Invoke-Psa POST "/Tickets/$Id/Notes" @{ ticketID = [long]$Id; title = $Title; description = $Text; noteType = [int]$type; publish = [int]$pv }
                }
                'halopsa' {
                    # Unverified: outcome ids are per tenant; 7 is the built-in Private Note. Halo-NoteOutcomeId overrides it.
                    $outcome = Get-PsaSecret $(if ($pub) { 'Halo-PublicNoteOutcomeId' } else { 'Halo-NoteOutcomeId' })
                    if (-not $outcome) { $outcome = Get-PsaSecret 'Halo-NoteOutcomeId' }
                    if (-not $outcome) { $outcome = 7 }
                    $null = Invoke-Psa POST '/Actions' @(@{ ticket_id = [long]$Id; note = $Text; hiddenfromuser = (-not $pub); outcome_id = [int]$outcome })
                }
                'kaseyabms' {
                    # Unverified: how to list note types, so the KaseyaBMS-NoteTypeId secret supplies one.
                    $type = Get-PsaSecret 'KaseyaBMS-NoteTypeId'
                    if (-not $type) { throw 'Kaseya BMS notes need a note type id. Set the KaseyaBMS-NoteTypeId secret.' }
                    $null = Invoke-Psa POST "/servicedesk/tickets/$Id/notes" @{ Details = $Text; IsInternal = (-not $pub); NoteDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); TypeId = [int]$type }
                }
