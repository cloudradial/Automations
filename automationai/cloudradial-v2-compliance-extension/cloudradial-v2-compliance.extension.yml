# CloudRadial AutomationAI - extension export (cloudradial-v2-compliance 0.2.1).
# Built from the catalog 0.2.0 export with the flexible-asset write fixes. Import on Extensions -> Custom; it overrides the catalog copy in this tenant.
automationsExtension: 1
extension:
  slug: cloudradial-v2-compliance
  name: CloudRadial v2 API — Compliance & Assets
  vendor: CloudRadial
  version: 0.2.1
  description: Read + write security assessments, certificates and flexible assets in the CloudRadial v2 API.
  detailsMarkdown: |-
    ## How it works

    **0.2.1:** flexible-asset writes are usable end to end - `cr_patch_flexible_asset` now carries `name`, `resourceUrl` and `traitsJson` (0.2.0 accepted only the id, so a patch changed nothing), `cr_patch_flexible_asset_type` carries the type's fields, and `cr_create_flexible_asset_type` accepts the type's `fields` in the same call.

    This is one of **eight CloudRadial v2 API domain extensions** (the former single `cloudradial-v2-api` extension, split so no single extension exceeds the 128-tool model cap). This part covers **security assessments, certificates, and flexible assets / their types and fields** with full **read + write** access: `cr_list_*`/`cr_get_*` query the OData v4 collections, and `cr_create_*`/`cr_update_*`/`cr_patch_*`/`cr_delete_*` call the v2 REST write endpoints. Write tools require approval and never run in a dry run.

    All eight parts share the **same** three secrets and Basic-auth profile, so provisioning one API key pair enables every part. Sibling extensions: cloudradial-v2-endpoints, cloudradial-v2-companies, cloudradial-v2-training, cloudradial-v2-content, cloudradial-v2-services, cloudradial-v2-feedback, cloudradial-v2-tokens.

    **Authentication** is HTTP **Basic**: the API **public key** is the username, the API **private key** is the password. Create a key pair in CloudRadial under **Settings -> Integrations -> API** ("+ Add API Key"); the private key is shown only once at creation.

    **Suggested URL:** https://api.us.cloudradial.com (set your regional root, e.g. https://api.eu.cloudradial.com).

    **Secrets**
    - `CloudRadial-BaseUrl`: regional API root, e.g. `https://api.us.cloudradial.com` (no trailing slash).
    - `CloudRadial-PublicKey`: API **public key** (Basic-auth username) from Settings -> Integrations -> API.
    - `CloudRadial-PrivateKey`: API **private key** (Basic-auth password). Shown only at key creation.
  contextMarkdown: |-
    # CloudRadial v2 REST API — Compliance & Assets

    Base URL: `https://api.us.cloudradial.com` (regional: `api.eu.cloudradial.com`, `api.au.cloudradial.com`, etc.).
    Auth is HTTP **Basic**: username = API **public key**, password = API **private key** (`Authorization: Basic base64(publicKey:privateKey)`, `Accept: application/json`).

    This extension covers security assessments, certificates, and flexible assets / their types and fields.

    ## Reading (OData v4, /v2/odata)
    - **List:** `GET /v2/odata/<EntitySet>` -> `{ "value": [ ... ] }`. Options: `$filter`, `$select`, `$orderby`, `$top`, `$skip`, `$count`, `$expand`.
    - **Get one:** `GET /v2/odata/<EntitySet>(<key>)` (integer keys bare; string keys quoted).
    - Most rows are company-scoped; filter by `companyId`.

    ## Writing (REST, /v2/<entity>)
    - **Create:** `POST /v2/<entity>` with a JSON body of the entity fields.
    - **Replace:** `PUT /v2/<entity>/<key>` (full update).
    - **Partial update:** `PATCH /v2/<entity>/<key>` as RFC 6902 JSON-Patch (`application/json-patch+json`); the cr_patch_* tools send only the fields you supply as `replace` ops.
    - **Delete:** `DELETE /v2/<entity>/<key>` (soft delete where supported).
    - Write tools require approval and are skipped in dry runs.

    ## Entity sets
    | Entity set | Key | Notable fields |
    |---|---|---|
    | Assessment | assessmentId | assessmentId, companyId, title, category, description, recommendations, tier, scheduleInterval |
    | Certificate | id | id, companyId, companyDomainId, name, url, expirationDate, issuer, isValid |
    | FlexibleAsset | id | id, flexibleAssetTypeId, companyId, name, resourceUrl, traitsJson |
    | FlexibleAssetType | id | id, name, description, icon, showInMenu |
    | FlexibleAssetField | id | id, flexibleAssetTypeId, order, name, nameKey, kind, hint, decimals |

    Tip: narrow with `$filter`/`$select` to inspect a focused subset, then resolve the record key before any write. (`$top`/`$skip` are owned by the runner's auto-pagination and are not caller inputs.)

    ## Flexible assets
    - A type's fields define the trait keys: each field's `nameKey` is its name in lowercase with spaces as hyphens (`Serial Number` -> `serial-number`). Create the type with its fields in one `cr_create_flexible_asset_type` call, or add fields later with `cr_create_flexible_asset_field`.
    - `cr_create_flexible_asset` takes `traits` as an object. Reads return the same values as a JSON string in `traitsJson`.
    - To update values, send the complete traits object as a JSON string in `cr_patch_flexible_asset` `traitsJson`.
    - Match existing assets by a stable trait (for example a serial number) inside `traitsJson` before creating, so re-runs do not duplicate.
  requiredSecretNames:
    - CloudRadial-BaseUrl
    - CloudRadial-PublicKey
    - CloudRadial-PrivateKey
  invocationProfileJson: '{"baseUrlSecret":"CloudRadial-BaseUrl","auth":{"scheme":"basic","usernameTemplate":"{CloudRadial-PublicKey}","passwordSecret":"CloudRadial-PrivateKey"},"headers":{"Accept":"application/json"}}'
