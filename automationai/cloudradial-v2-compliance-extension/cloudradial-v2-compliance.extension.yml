      description: Use to create, update or delete security assessments, certificates, and flexible assets / their types and fields. Mutating; requires approval.
      instructions: |-
        Use to create, update, or delete records. These are mutating calls — every cr_create_/cr_update_/cr_patch_/cr_delete_ tool requires approval and does NOT execute in a dry run.
        1. Resolve the target first: use the cr_list_*/cr_get_* tools (in this skill) to find the record's key and confirm you have the right one.
        2. To create, call cr_create_* with the required body fields (the tool's required list).
        3. To change a few fields, prefer cr_patch_* (JSON-Patch: send only the fields to change). To replace the whole record, use cr_update_*.
        4. To remove a record, call cr_delete_* with its key. Soft-delete where the API supports it.
        5. Confirm the mutation with the user before approving; echo back what changed.
      toolNames:
        - cr_list_assessment
        - cr_get_assessment
        - cr_list_certificate
        - cr_get_certificate
        - cr_list_flexible_asset
        - cr_get_flexible_asset
        - cr_list_flexible_asset_type
        - cr_get_flexible_asset_type
        - cr_list_flexible_asset_field
        - cr_get_flexible_asset_field
        - cr_import_assessment_template
        - cr_create_certificate
        - cr_update_certificate
        - cr_patch_certificate
        - cr_delete_certificate
        - cr_create_flexible_asset
        - cr_patch_flexible_asset
        - cr_delete_flexible_asset
        - cr_create_flexible_asset_type
        - cr_patch_flexible_asset_type
        - cr_delete_flexible_asset_type
        - cr_create_flexible_asset_field
      references:
        - https://support.cloudradial.com/hc/en-us/articles/43433723502612-Understanding-the-CloudRadial-UCP-v2-API-Platform
        - https://support.cloudradial.com/hc/en-us/articles/360050153571-Using-the-CloudRadial-API
    - slug: query-compliance
      name: Query Compliance & Assets
      description: Use to look up / report on security assessments, certificates, and flexible assets / their types and fields (read-only).
      instructions: |-
        1. Identify the entity set(s) relevant to the request (see this skill's tools).
        2. For a search/listing, call the matching cr_list_* tool with an OData `filter` (e.g. `companyId eq 5` or `contains(name,'acme')`), and use `orderby` to sort. The cr_list_* tools auto-paginate (the runner walks `$skip`/`$top` to exhaustion, capped at maxPages) and return the COMPLETE set, so always filter to narrow large collections rather than paging by hand.
        3. To fetch one record you already have the key for, call the matching cr_get_* tool.
        4. Summarize the returned records (`value` array) for the user; offer to refine the filter if the result set is large.
      toolNames:
        - cr_list_assessment
        - cr_get_assessment
        - cr_list_certificate
        - cr_get_certificate
        - cr_list_flexible_asset
        - cr_get_flexible_asset
        - cr_list_flexible_asset_type
        - cr_get_flexible_asset_type
        - cr_list_flexible_asset_field
        - cr_get_flexible_asset_field
      references:
