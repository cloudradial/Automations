automationsWorkflow: 1
name: Password Reset (ServiceAI Triage)
definition:
  schemaVersion: 1
  activities:
  - id: start
    name: Start
    type: start
    position:
      x: 100
      y: 80
    properties:
      webhookEnabled: false
  - id: end
    name: End
    type: end
    position:
      x: 1180
      y: 80
  - id: node-1
    name: Parse & Validate
    type: powershell-script
    position:
      x: 280
      y: 80
    properties:
      script: |-
        # === NODE: Parse & Validate ===
        # Fired by a ServiceAI "Use in Triage" Action with the ticket payload. The ticket
        # carries the target user (email/UPN) + tenant AND the authenticated requester
        # (submittedByUPN). Rules:
        #   - No submittedByUPN  -> do NOT trigger (incomplete, no action).
        #   - submittedByUPN == target -> reset (verified self-request).
        #   - submittedByUPN != target -> DO NOT reset; hold for human confirmation.
        function Clean { param($v) $s=[string]$v; if($s -match '^\s*@[A-Za-z0-9_]+\s*$'){return $null}; if([string]::IsNullOrWhiteSpace($s)){return $null}; return $s.Trim() }
        function Get-Prop { param($o,$n) if($null -eq $o){return $null} if($o -is [System.Collections.IDictionary]){ if($o.Contains($n)){return $o[$n]} return $null } $pp=$o.PSObject.Properties[$n]; if($null -ne $pp){return $o.$n} return $null }
        function Looks-Email { param($v) $s=[string]$v; return ($s -match '^[^@\s]+@[^@\s]+\.[^@\s]+$') }
        function Find-Field { param($obj,$objNames,$keys) foreach($on in $objNames){ $o = if([string]::IsNullOrEmpty($on)){$obj}else{Get-Prop $obj $on}; if($null -ne $o){ foreach($k in $keys){ $v=Clean (Get-Prop $o $k); if($null -ne $v){ return $v } } } } return $null }
        function Find-Email { param($obj,$objNames,$keys) foreach($on in $objNames){ $o = if([string]::IsNullOrEmpty($on)){$obj}else{Get-Prop $obj $on}; if($null -ne $o){ foreach($k in $keys){ $v=Clean (Get-Prop $o $k); if($null -ne $v -and (Looks-Email $v)){ return $v } } } } return $null }
        function Emit-Incomplete { param($TicketId,$Msg) Set-NodeOutput ([ordered]@{ status='incomplete'; message='We could not process this request. A technician will follow up shortly.'; public_note='We could not process this request. A technician will follow up shortly.'; internal_note=$Msg; upn=''; ticket_id=[string]$TicketId }); throw $Msg }

        $in = Get-NodeInput
        if ($null -eq $in) { Emit-Incomplete '' 'No webhook payload received.' }
        if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch { Emit-Incomplete '' 'Webhook payload was a string that is not valid JSON.' } }
        $wrap = Get-Prop $in 'trigger'; if ($null -ne $wrap) { $in = $wrap }
        if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch {} }
        $t = Get-Prop $in 'Ticket'; if ($null -eq $t) { $t = $in }

        $ticketId = [string](Get-Prop $t 'id'); if([string]::IsNullOrWhiteSpace($ticketId)){ $ticketId=[string](Get-Prop $t 'ticketNumber') }
        $contactId = [string](Get-Prop $t 'contactID')
        $companyTenantId = Clean (Find-Field $t @('','company','ticket') @('companyTenantId','tenantId','customerTenantId','azureTenantId'))

        # Target user (whose password to reset)
        $targetEmail = Find-Email $t @('','contact','user','requester','endUser','primaryContact') @('userPrincipalName','upn','contactEmail','contactEmailAddress','contactEmailAddress2','email','emailAddress','emailAddress2','mail','userEmail','requesterEmail','endUserEmail','primaryEmail')

        # Authenticated requester (who submitted / was verified by the portal). REQUIRED.
        $submittedByUpn = Find-Field $t @('','submitter','authenticatedUser','requester','contact') @('submittedByUPN','submittedByUpn','submittedBy','submitterUpn','submitterUPN','authenticatedBy','authenticatedUpn','authenticatorUpn','requestedByUpn','requestedByUPN','submittedByEmail','requestedByEmail')
        $submittedByOid = Find-Field $t @('','submitter','authenticatedUser') @('submittedByOfficeId','submitterObjectId','userOfficeId','authenticatedByObjectId','submittedByObjectId')

        if((-not $submittedByUpn) -and (-not $submittedByOid)){ Emit-Incomplete $ticketId "Ticket $ticketId has no authenticated requester (submittedByUPN). Password reset will not trigger without it." }
        if(-not $targetEmail){ Emit-Incomplete $ticketId "Ticket $ticketId did not include the target user's email (contactID $contactId). No reset performed." }

        Set-NodeOutput ([ordered]@{
            status='ok'; ticket_id=$ticketId; contactId=$contactId
            targetEmail=$targetEmail; companyTenantId=$companyTenantId
            submittedByUpn=$submittedByUpn; submittedByOfficeId=$submittedByOid
            actions=@(); warnings=@()
        })
      timeoutSeconds: 600
      retryCount: 0
      parameters:
      - name: trigger
        expression: '{{ nodes.trigger.output }}'
      aiExtensions:
      - microsoft-365
      testInput: |-
        {
          "id": 29410,
          "ticketNumber": "T20260614.0007",
          "title": "Please reset my password",
          "description": "User is locked out and needs a password reset.",
          "companyID": 250,
          "contactID": 8841,
          "contactEmail": "leia.organa@azurative.net",
          "submittedByUPN": "leia.organa@azurative.net",
          "companyTenantId": ""
        }
  - id: node-2
    name: Resolve & Decide
    type: powershell-script
    position:
      x: 460
      y: 80
    properties:
      script: |-
        # === NODE: Resolve & Decide (verify authenticated requester vs target) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Add-Action  { param($S,$M) if($M){$S['actions'] =@(@($S['actions']) +$M)} }
        function Add-Warning { param($S,$M) if($M){$S['warnings']=@(@($S['warnings'])+$M)} }
        function Stop-Incomplete { param($S,$M) $o=@{}; if($null -ne $S){foreach($k in $S.Keys){$o[$k]=$S[$k]}}; $o['status']='incomplete'; $o['message']='We could not process this request. A technician will follow up shortly.'; $o['public_note']='We could not process this request. A technician will follow up shortly.'; $o['internal_note']=$M; if(-not $o.Contains('upn')){$o['upn']=''}; Set-NodeOutput $o; throw $M }
        function Get-Sec     { param($N) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $N -AsPlainText -ErrorAction SilentlyContinue }
        function Get-HttpErrorDetail { param($E) $m=''; try{$m=[string]$E.Exception.Message}catch{}; $d=''; try{ if($null -ne $E.ErrorDetails){ $d=[string]$E.ErrorDetails.Message } }catch{}; if([string]::IsNullOrWhiteSpace($d)){ try{ if($null -ne $E.Exception.PSObject.Properties['Response'] -and $null -ne $E.Exception.Response){ $d=(New-Object System.IO.StreamReader($E.Exception.Response.GetResponseStream())).ReadToEnd() } }catch{} }; return (@($m,$d)|Where-Object{$_}) -join ' | ' }
        function Get-GraphHeaders { param($T,$C,$S) $r=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{client_id=$C;client_secret=$S;scope='https://graph.microsoft.com/.default';grant_type='client_credentials'} -ErrorAction Stop; $tok=''; if($null -ne $r.PSObject.Properties['access_token']){$tok=[string]$r.access_token}; if([string]::IsNullOrWhiteSpace($tok)){throw 'Token response had no access_token'}; return @{Authorization="Bearer $tok";'Content-Type'='application/json';Accept='application/json'} }
        function Invoke-Graph { param($Method,$Path,$Body,$Headers) $p=@{Method=$Method;Uri="https://graph.microsoft.com$Path";Headers=$Headers;ErrorAction='Stop'}; if($null -ne $Body){$p['Body']=($Body|ConvertTo-Json -Depth 10)}; Invoke-RestMethod @p }

        $state = Read-State
        if($state['status'] -eq 'incomplete' -or -not $state.Contains('targetEmail')){ Stop-Incomplete $state ("Upstream step failed; halting. " + [string]$state['internal_note']) }
        $clientId=Get-Sec 'M365-ClientId'; $clientSecret=Get-Sec 'M365-ClientSecret'; $secretTenant=Get-Sec 'M365-TenantId'
        $tenantId=[string]$state['companyTenantId']
        if([string]::IsNullOrWhiteSpace($tenantId) -or $tenantId -notmatch '^[0-9a-fA-F-]{36}$' -or $tenantId -like '*ffffffff-ffff*'){ $tenantId=$secretTenant }
        $miss=@(); if([string]::IsNullOrWhiteSpace([string]$tenantId)){$miss+='M365-TenantId'}; if([string]::IsNullOrWhiteSpace([string]$clientId)){$miss+='M365-ClientId'}; if([string]::IsNullOrWhiteSpace([string]$clientSecret)){$miss+='M365-ClientSecret'}
        if($miss.Count -gt 0){ Stop-Incomplete $state "Cannot authenticate - missing secret(s): $($miss -join ', ')." }
        try { $headers = Get-GraphHeaders $tenantId $clientId $clientSecret } catch { Stop-Incomplete $state "Token request failed for tenant $tenantId : $(Get-HttpErrorDetail $_)" }
        $state['tenantId']=$tenantId

        # Resolve the TARGET account.
        $email=[string]$state['targetEmail']; $esc=$email.Replace("'","''")
        try {
            $res = Invoke-Graph 'Get' "/v1.0/users?`$filter=userPrincipalName eq '$esc' or mail eq '$esc'&`$select=id,displayName,userPrincipalName,mail,accountEnabled,userType&`$count=true" $null (@{ ConsistencyLevel='eventual' } + $headers)
            $u = @($res.value) | Select-Object -First 1
            if($null -eq $u){ Stop-Incomplete $state "No Microsoft 365 account found for '$email' in tenant $tenantId. No reset performed." }
            $state['userId']=[string]$u.id; $state['userPrincipalName']=[string]$u.userPrincipalName; $state['displayName']=[string]$u.displayName; $state['mail']=[string]$u.mail
            $state['upn']=[string]$u.userPrincipalName; $state['accountEnabled']=[bool]$u.accountEnabled; $state['userType']=[string]$u.userType
        } catch { if($_.Exception.Message -like 'No Microsoft 365 account*'){ throw }; Stop-Incomplete $state "Could not look up '$email' in tenant $tenantId : $(Get-HttpErrorDetail $_)" }

        # --- Decide: did the AUTHENTICATED requester ask for THEIR OWN reset? ---
        $subUpn=[string]$state['submittedByUpn']; $subOid=[string]$state['submittedByOfficeId']
        $ownerByOid = (-not [string]::IsNullOrWhiteSpace($subOid)) -and ($subOid -ieq [string]$state['userId'])
        $ownerByUpn = (-not [string]::IsNullOrWhiteSpace($subUpn)) -and (($subUpn -ieq [string]$state['userPrincipalName']) -or ($subUpn -ieq [string]$state['mail']))
        if($ownerByOid -or $ownerByUpn){
            # Verified self-request -> reset, subject to safety gates.
            if($state['userType'] -ieq 'Guest'){ Stop-Incomplete $state "Target '$($state['upn'])' is a guest (B2B) account; not resettable." }
            if($state['accountEnabled'] -eq $false){ Stop-Incomplete $state "Target '$($state['upn'])' is disabled; escalate to a technician." }
            try {
                $roles = Invoke-Graph 'Get' "/v1.0/users/$($state['userId'])/memberOf?`$select=id,displayName" $null $headers
                $priv = @('Global Administrator','Privileged Role Administrator','Privileged Authentication Administrator','Authentication Administrator','Security Administrator','User Administrator','Helpdesk Administrator','Exchange Administrator','SharePoint Administrator','Application Administrator','Cloud Application Administrator')
                $hit = @(@($roles.value) | Where-Object { $_.'@odata.type' -eq '#microsoft.graph.directoryRole' -and ($priv -contains [string]$_.displayName) } | ForEach-Object { [string]$_.displayName })
                if(@($hit).Count -gt 0){ Stop-Incomplete $state "Target '$($state['upn'])' holds a privileged role ($([string]::Join(', ',$hit))); ticket-triggered reset blocked. Handle manually." }
            } catch { if($_.Exception.Message -like '*privileged role*'){ throw }; Add-Warning $state "Could not verify privileged-role membership: $(Get-HttpErrorDetail $_)" }
            $state['decision']='reset'
            Add-Action $state "Verified self-request: $subUpn is the account owner ($($state['upn']))"
        } else {
            # Someone other than the account owner asked -> hold for human confirmation, no reset.
            $state['decision']='confirm'
            Add-Action $state "Requester ($subUpn) is not the account owner ($($state['upn'])); held for confirmation"
        }
        Set-NodeOutput $state
      timeoutSeconds: 600
      retryCount: 0
      parameters: []
      aiExtensions:
      - microsoft-365
  - id: node-3
    name: Reset If Verified
    type: powershell-script
    position:
      x: 640
      y: 80
    properties:
      script: |-
        # === NODE: Reset If Verified (only when decision = reset) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Add-Action  { param($S,$M) if($M){$S['actions'] =@(@($S['actions']) +$M)} }
        function Add-Warning { param($S,$M) if($M){$S['warnings']=@(@($S['warnings'])+$M)} }
        function Stop-Incomplete { param($S,$M) $o=@{}; if($null -ne $S){foreach($k in $S.Keys){$o[$k]=$S[$k]}}; $o['status']='incomplete'; $o['message']='We could not process this request. A technician will follow up shortly.'; $o['public_note']='We could not process this request. A technician will follow up shortly.'; $o['internal_note']=$M; if(-not $o.Contains('upn')){$o['upn']=''}; Set-NodeOutput $o; throw $M }
        function Get-Sec     { param($N) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $N -AsPlainText -ErrorAction SilentlyContinue }
        function Get-HttpErrorDetail { param($E) $m=''; try{$m=[string]$E.Exception.Message}catch{}; $d=''; try{ if($null -ne $E.ErrorDetails){ $d=[string]$E.ErrorDetails.Message } }catch{}; if([string]::IsNullOrWhiteSpace($d)){ try{ if($null -ne $E.Exception.PSObject.Properties['Response'] -and $null -ne $E.Exception.Response){ $d=(New-Object System.IO.StreamReader($E.Exception.Response.GetResponseStream())).ReadToEnd() } }catch{} }; return (@($m,$d)|Where-Object{$_}) -join ' | ' }
        function Get-GraphHeaders { param($T,$C,$S) $r=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{client_id=$C;client_secret=$S;scope='https://graph.microsoft.com/.default';grant_type='client_credentials'} -ErrorAction Stop; $tok=''; if($null -ne $r.PSObject.Properties['access_token']){$tok=[string]$r.access_token}; if([string]::IsNullOrWhiteSpace($tok)){throw 'Token response had no access_token'}; return @{Authorization="Bearer $tok";'Content-Type'='application/json';Accept='application/json'} }
        function Invoke-Graph { param($Method,$Path,$Body,$Headers) $p=@{Method=$Method;Uri="https://graph.microsoft.com$Path";Headers=$Headers;ErrorAction='Stop'}; if($null -ne $Body){$p['Body']=($Body|ConvertTo-Json -Depth 10)}; Invoke-RestMethod @p }
        function New-TempPassword { param([int]$Length=16) $sets=@('ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnpqrstuvwxyz','23456789','!@#$%^&*-_=+'); $all=-join $sets; $bytes=[byte[]]::new($Length); [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes); $chars=@(); for($i=0;$i -lt $Length;$i++){ $chars+=$all[$bytes[$i]%$all.Length] }; $b=[byte[]]::new($sets.Count); [System.Security.Cryptography.RandomNumberGenerator]::Fill($b); for($j=0;$j -lt $sets.Count;$j++){ $chars[$j]=$sets[$j][$b[$j]%$sets[$j].Length] }; return (-join $chars) }

        $state = Read-State
        if([string]$state['decision'] -ne 'reset'){ Set-NodeOutput $state; return }
        if([string]::IsNullOrWhiteSpace([string]$state['userId'])){ Stop-Incomplete $state ("No userId in state; halting. " + [string]$state['internal_note']) }
        $clientId=Get-Sec 'M365-ClientId'; $clientSecret=Get-Sec 'M365-ClientSecret'
        try { $headers = Get-GraphHeaders $state['tenantId'] $clientId $clientSecret } catch { Stop-Incomplete $state "Token request failed: $(Get-HttpErrorDetail $_)" }
        $pwd = New-TempPassword 16
        try {
            Invoke-Graph 'Patch' "/v1.0/users/$($state['userId'])" @{ passwordProfile=@{ password=$pwd; forceChangePasswordNextSignIn=$true } } $headers | Out-Null
            $state['tempPassword']=$pwd
            Add-Action $state 'Reset password to a temporary value (change required at next sign-in)'
        } catch { Stop-Incomplete $state "Could not reset password for $($state['upn']): $(Get-HttpErrorDetail $_)" }
        try {
            Invoke-Graph 'Post' "/v1.0/users/$($state['userId'])/revokeSignInSessions" @{} $headers | Out-Null
            Add-Action $state 'Revoked all active sign-in sessions'
        } catch { Add-Warning $state "Could not revoke sign-in sessions: $(Get-HttpErrorDetail $_)" }
        Set-NodeOutput $state
      timeoutSeconds: 600
      retryCount: 0
      parameters: []
      aiExtensions:
      - microsoft-365
  - id: node-4
    name: Finish
    type: powershell-script
    position:
      x: 820
      y: 80
    properties:
      script: |-
        # === NODE: Finish (emit outcome; temp password only in internal_note) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }

        $state = Read-State
        $upn=[string]$state['upn']; $ticketId=[string]$state['ticket_id']; $decision=[string]$state['decision']
        $subUpn=[string]$state['submittedByUpn']
        $actions = @($state['actions']) -join '; '

        if($decision -eq 'reset'){
            $pwd=[string]$state['tempPassword']
            $internal = "Password reset completed for $upn (verified self-request by $subUpn). Actions: $actions. Temporary password: $pwd (user must change at next sign-in)."
            $public = "Your password has been reset. Sign in with the temporary password provided and you'll be prompted to set a new one."
            Set-NodeOutput ([ordered]@{ status='complete'; message="Password reset completed for $upn."; public_note=$public; internal_note=$internal; upn=$upn; ticket_id=$ticketId; requester=$subUpn; warnings=@($state['warnings']) })
        } else {
            # submitter != account owner -> no reset; note that someone will confirm.
            $internal = "Reset requested by $subUpn for a different account ($upn). No reset performed - held for human verification. A technician should confirm the requester's authority before resetting."
            $public = "Thanks for the request. Because this password reset was submitted for another user, someone will reach out shortly to confirm before we make any changes."
            Set-NodeOutput ([ordered]@{ status='pending_confirmation'; message="Reset for $upn held for confirmation (requested by $subUpn)."; public_note=$public; internal_note=$internal; upn=$upn; ticket_id=$ticketId; requester=$subUpn; warnings=@($state['warnings']) })
        }
      timeoutSeconds: 600
      retryCount: 0
      parameters: []
      aiExtensions: []
  connections:
  - source: start
    target: node-1
    sourceHandle: null
  - source: node-1
    target: node-2
    sourceHandle: null
  - source: node-2
    target: node-3
    sourceHandle: null
  - source: node-3
    target: node-4
    sourceHandle: null
  - source: node-4
    target: end
    sourceHandle: null
  startActivityId: start
