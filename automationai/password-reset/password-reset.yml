automationsWorkflow: 1
name: Password Reset (Self-Service)
definition:
  schemaVersion: 1
  activities:
  - id: start
    name: Start
    type: start
    position:
      x: 100
      y: 80
    properties:
      webhookEnabled: false
  - id: end
    name: End
    type: end
    position:
      x: 1360
      y: 80
  - id: node-1
    name: Parse & Validate
    type: powershell-script
    position:
      x: 280
      y: 80
    properties:
      script: |-
        # === NODE: Parse & Validate ===
        # Broken-out rebuild of the single-node Password Reset. Same contract & gates,
        # one step per concern. Trigger: CloudRadial ticket webhook ("Password Reset").
        # Payload fields: userPrincipalName (or email) = target; companyTenantId = M365
        # tenant GUID (tenant scope); submittedByUpn = TRUSTED authenticated submitter
        # (injected by CloudRadial, falls back to Ticket object; NEVER user-typed);
        # userOfficeId = submitter's Entra object id; revokeSessions (default true); ticketId.
        function Get-Prop { param($o,$n) if($null -eq $o){return $null} if($o -is [System.Collections.IDictionary]){ if($o.Contains($n)){return $o[$n]} return $null } $pp=$o.PSObject.Properties[$n]; if($null -ne $pp){return $o.$n} return $null }
        function Fail-Incomplete { param($TicketId,$Upn,$Msg) Set-NodeOutput ([ordered]@{ status='incomplete'; message='We could not process this request. A technician will follow up shortly.'; public_note='We could not process this request. A technician will follow up shortly.'; internal_note=$Msg; ticket_id=[string]$TicketId; upn=[string]$Upn }); throw $Msg }

        $nodeInput = Get-NodeInput
        if ($null -eq $nodeInput) { Fail-Incomplete '' '' 'No webhook payload was received. This workflow expects a CloudRadial ticket webhook body.' }
        $in = $nodeInput
        $wrap = Get-Prop $in 'trigger'; if ($null -ne $wrap) { $in = $wrap }
        if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch { Fail-Incomplete '' '' 'Webhook payload was a string that is not valid JSON.' } }

        $answers = @{}
        foreach ($p in $in.PSObject.Properties) { if ($null -ne $p.Value -and ($p.Value -is [string] -or $p.Value.GetType().IsValueType)) { $answers[$p.Name] = $p.Value } }
        $submitterFromTicket = $null
        $ticket = Get-Prop $in 'Ticket'
        if ($null -ne $ticket) {
            foreach ($q in @(Get-Prop $ticket 'Questions')) { $qid=[string](Get-Prop $q 'Id'); if(-not [string]::IsNullOrWhiteSpace($qid)){ $answers[$qid]=(Get-Prop $q 'Value') } }
            $tid = Get-Prop $ticket 'TicketId'; if ($null -ne $tid) { $answers['ticketId'] = $tid }
            foreach ($sf in @('SubmittedByEmail','SubmitterEmail','ContactEmail','RequesterEmail','Email','UserEmail','ContactUpn')) { $sv=[string](Get-Prop $ticket $sf); if(-not [string]::IsNullOrWhiteSpace($sv) -and $sv -like '*@*'){ $submitterFromTicket=$sv; break } }
        }
        $company = Get-Prop $in 'Company'
        if ($null -ne $company) {
            $ctid = Get-Prop $company 'CompanyTenantId'; if ($null -ne $ctid) { $answers['companyTenantId'] = $ctid }
            $oid  = Get-Prop $company 'OfficeId';        if ($null -ne $oid)  { $answers['officeId'] = $oid }
        }
        function Get-Field { param([string[]]$Names) foreach ($n in $Names) { if ($answers.ContainsKey($n)) { $v=$answers[$n]; if($null -ne $v -and -not [string]::IsNullOrWhiteSpace([string]$v)){ return $v } } } return $null }

        $upn             = [string](Get-Field @('userPrincipalName','upn','email','email_address'))
        $companyTenantId = [string](Get-Field @('companyTenantId','m365Identifier','tenantId','CompanyTenantId'))
        $officeId        = [string](Get-Field @('officeId','OfficeId'))
        $ticketId        = [string](Get-Field @('ticketId','ticket_id','id'))
        $submittedByUpn  = [string](Get-Field @('submittedByUpn','submitted_by','submitterUpn'))
        if ([string]::IsNullOrWhiteSpace($submittedByUpn) -and -not [string]::IsNullOrWhiteSpace($submitterFromTicket)) { $submittedByUpn = $submitterFromTicket }
        $userOfficeId    = [string](Get-Field @('userOfficeId','UserOfficeId'))
        $revokeSessions  = $true
        $rawRevoke = Get-Field @('revokeSessions','revoke_sessions')
        if ($null -ne $rawRevoke -and -not [string]::IsNullOrWhiteSpace([string]$rawRevoke)) { try { $revokeSessions = [System.Convert]::ToBoolean([string]$rawRevoke) } catch { $revokeSessions = $true } }

        if ([string]::IsNullOrWhiteSpace($upn)) { Fail-Incomplete $ticketId '' "Ticket $ticketId is missing the required userPrincipalName. No reset performed." }

        Set-NodeOutput ([ordered]@{
            status='ok'; ticketId=$ticketId; ticket_id=$ticketId
            upn=$upn; companyTenantId=$companyTenantId; officeId=$officeId
            submittedByUpn=$submittedByUpn; userOfficeId=$userOfficeId; revokeSessions=$revokeSessions
            actions=@(); warnings=@()
        })
      timeoutSeconds: 1800
      retryCount: 0
      parameters:
      - name: trigger
        expression: '{{ nodes.trigger.output }}'
      aiExtensions:
      - microsoft-entra-id
      testInput: |-
        {
          "userPrincipalName": "leia.organa@azurative.net",
          "submittedByUpn": "leia.organa@azurative.net",
          "userOfficeId": "00000000-0000-0000-0000-000000000000",
          "companyTenantId": "",
          "ticketId": "91530",
          "revokeSessions": "true"
        }
  - id: node-2
    name: Resolve & Ownership Gate
    type: powershell-script
    position:
      x: 460
      y: 80
    properties:
      script: |-
        # === NODE: Resolve target + OWNERSHIP GATE (fail closed) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Is-Terminal { param($S) return (@('incomplete','rejected','error','success') -contains [string]$S['status']) }
        function Get-KvSecret { param([string[]]$Names) foreach($n in $Names){ $v=Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue; if(-not [string]::IsNullOrWhiteSpace($v)){ return $v } } return $null }
        function Reject { param($S,$Status,$Public,$Internal,$Category,$Extra) $o=@{}; foreach($k in $S.Keys){$o[$k]=$S[$k]}; $o['status']=$Status; $o['message']=$Public; $o['public_note']=$Public; $o['internal_note']=$Internal; $o['category']=$Category; if($Extra){foreach($k in $Extra.Keys){$o[$k]=$Extra[$k]}}; Set-NodeOutput $o }
        function Get-GraphHeaders { param($T,$C,$S) $r=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -Body @{client_id=$C;client_secret=$S;scope='https://graph.microsoft.com/.default';grant_type='client_credentials'} -ErrorAction Stop; return @{Authorization="Bearer $($r.access_token)";'Content-Type'='application/json'} }
        function Invoke-Graph { param($M,$P,$B,$H) $p=@{Method=$M;Uri="https://graph.microsoft.com$P";Headers=$H;ErrorAction='Stop'}; if($null -ne $B){$p['Body']=($B|ConvertTo-Json -Depth 10)}; Invoke-RestMethod @p }

        $state = Read-State
        if (Is-Terminal $state) { Set-NodeOutput $state; return }

        $graphTenantId=Get-KvSecret @('M365-TenantId','M365-TenantID','Entra-TenantID','Graph-TenantId')
        $graphClientId=Get-KvSecret @('M365-ClientId','M365-ClientID','Entra-ClientID','Graph-ClientId')
        $graphClientSecret=Get-KvSecret @('M365-ClientSecret','Entra-ClientSecret','Graph-ClientSecret')
        $missing=@(); if([string]::IsNullOrWhiteSpace($graphTenantId)){$missing+='M365-TenantID'}; if([string]::IsNullOrWhiteSpace($graphClientId)){$missing+='M365-ClientID'}; if([string]::IsNullOrWhiteSpace($graphClientSecret)){$missing+='M365-ClientSecret'}
        if($missing.Count -gt 0){ $avail=try{(@(Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -ErrorAction Stop).Name|Sort-Object) -join ', '}catch{'(unable to list)'}; $m="Graph app credentials not found (M365-*/Entra-*/Graph-*). Secrets in vault '$($env:RUNNER_KV_NAME)': $avail"; Set-NodeOutput @{status='error';message=$m;internal_note=$m;ticket_id=[string]$state['ticket_id']}; throw $m }
        $state['graphTenantId']=$graphTenantId
        try { $H=Get-GraphHeaders $graphTenantId $graphClientId $graphClientSecret } catch { $m="Failed to obtain a Microsoft Graph token: $($_.Exception.Message)"; Set-NodeOutput @{status='error';message=$m;internal_note=$m;ticket_id=[string]$state['ticket_id']}; throw $m }

        $upn=[string]$state['upn']
        try { $user=Invoke-Graph 'Get' "/v1.0/users/$upn`?`$select=id,userPrincipalName,displayName,accountEnabled,mail,proxyAddresses" $null $H } catch { Reject $state 'rejected' 'We could not find that account. A technician will follow up shortly.' "Could not find user $upn in Entra ID: $($_.Exception.Message)" 'resolution'; return }
        $userId=[string]$user.id; $resolvedUpn=[string]$user.userPrincipalName
        $state['userId']=$userId; $state['resolvedUpn']=$resolvedUpn; $state['upn']=$resolvedUpn; $state['accountEnabled']=[bool]$user.accountEnabled

        # OWNERSHIP GATE
        $submittedByUpn=[string]$state['submittedByUpn']; $userOfficeId=[string]$state['userOfficeId']
        if([string]::IsNullOrWhiteSpace($submittedByUpn)){ Reject $state 'rejected' 'We could not verify your identity for this request. A technician will follow up shortly.' "Password reset rejected: submitter identity was not present, so ownership of $resolvedUpn could not be verified." 'identity-unverified' @{user_id=$userId}; return }
        $isOwner=$false
        if(-not [string]::IsNullOrWhiteSpace($userOfficeId) -and $userOfficeId.Trim().ToLowerInvariant() -eq $userId.Trim().ToLowerInvariant()){ $isOwner=$true }
        if(-not $isOwner){
            $targetIds=New-Object System.Collections.Generic.List[string]
            if($resolvedUpn){$targetIds.Add($resolvedUpn)}; if([string]$user.mail){$targetIds.Add([string]$user.mail)}
            foreach($pa in @($user.proxyAddresses)){ $c=([string]$pa) -replace '^(?i)smtp:',''; if(-not [string]::IsNullOrWhiteSpace($c)){$targetIds.Add($c)} }
            $sn=$submittedByUpn.Trim().ToLowerInvariant()
            foreach($id in $targetIds){ if($id.Trim().ToLowerInvariant() -eq $sn){ $isOwner=$true; break } }
        }
        if(-not $isOwner){ Reject $state 'rejected' 'You can only reset your own account. If you need a reset for another user, please contact the service desk.' "Password reset DENIED: submitter '$submittedByUpn' requested a reset for '$resolvedUpn' (a different account). Possible misuse -- technician review." 'identity-mismatch' @{user_id=$userId;submitter=$submittedByUpn}; return }
        $state['actions']=@(@($state['actions'])+"Ownership verified for $resolvedUpn")
        Set-NodeOutput $state
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions:
      - microsoft-entra-id
  - id: node-3
    name: Safety Gates
    type: powershell-script
    position:
      x: 640
      y: 80
    properties:
      script: |-
        # === NODE: Safety Gates (disabled / tenant-scope / privileged / risk) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Is-Terminal { param($S) return (@('incomplete','rejected','error','success') -contains [string]$S['status']) }
        function Get-KvSecret { param([string[]]$Names) foreach($n in $Names){ $v=Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue; if(-not [string]::IsNullOrWhiteSpace($v)){ return $v } } return $null }
        function Reject { param($S,$Status,$Public,$Internal,$Category,$Extra) $o=@{}; foreach($k in $S.Keys){$o[$k]=$S[$k]}; $o['status']=$Status; $o['message']=$Public; $o['public_note']=$Public; $o['internal_note']=$Internal; $o['category']=$Category; if($Extra){foreach($k in $Extra.Keys){$o[$k]=$Extra[$k]}}; Set-NodeOutput $o }
        function Get-GraphHeaders { param($T,$C,$S) $r=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -Body @{client_id=$C;client_secret=$S;scope='https://graph.microsoft.com/.default';grant_type='client_credentials'} -ErrorAction Stop; return @{Authorization="Bearer $($r.access_token)";'Content-Type'='application/json'} }
        function Invoke-Graph { param($M,$P,$B,$H) $p=@{Method=$M;Uri="https://graph.microsoft.com$P";Headers=$H;ErrorAction='Stop'}; if($null -ne $B){$p['Body']=($B|ConvertTo-Json -Depth 10)}; Invoke-RestMethod @p }

        $state = Read-State
        if (Is-Terminal $state) { Set-NodeOutput $state; return }
        $userId=[string]$state['userId']; $resolvedUpn=[string]$state['resolvedUpn']; $graphTenantId=[string]$state['graphTenantId']
        $H=Get-GraphHeaders $graphTenantId (Get-KvSecret @('M365-ClientId','M365-ClientID','Entra-ClientID','Graph-ClientId')) (Get-KvSecret @('M365-ClientSecret','Entra-ClientSecret','Graph-ClientSecret'))

        if(-not [bool]$state['accountEnabled']){ Reject $state 'rejected' 'A technician is reviewing your request and will reach out shortly.' "Password reset rejected: account $resolvedUpn is DISABLED. Confirm whether this is intentional (offboarding/hold) before resetting." 'policy' @{user_id=$userId}; return }

        $companyTenantId=[string]$state['companyTenantId']
        if($companyTenantId -match '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'){
            if($companyTenantId.Trim().ToLowerInvariant() -ne $graphTenantId.Trim().ToLowerInvariant()){ Reject $state 'rejected' 'A technician is reviewing your request and will reach out shortly.' "Password reset rejected: request's M365 tenant ($companyTenantId) does not match the tenant this runner is configured for. Cross-tenant reset blocked." 'tenant-scope' @{user_id=$userId;companyTenantId=$companyTenantId}; return }
        }

        try { $roles=Invoke-Graph 'Get' "/v1.0/users/$userId/memberOf/microsoft.graph.directoryRole?`$select=id,displayName" $null $H; if(@($roles.value).Count -gt 0){ Reject $state 'rejected' 'A technician is reviewing your request and will reach out shortly.' "Password reset rejected: $resolvedUpn holds Entra directory role(s). Privileged account -- reset via a technician, not automation." 'privilege' @{user_id=$userId}; return } } catch { }

        try { $risky=Invoke-Graph 'Get' "/v1.0/identityProtection/riskyUsers/$userId" $null $H; $rl=[string]$risky.riskLevel; $rs=[string]$risky.riskState; if($rl -eq 'high' -or $rs -eq 'atRisk' -or $rs -eq 'confirmedCompromised'){ Reject $state 'rejected' 'A technician is reviewing your request and will reach out shortly.' "Password reset rejected: $resolvedUpn is flagged HIGH-RISK in Identity Protection (level=$rl, state=$rs)." 'risk' @{user_id=$userId}; return } } catch { }

        Set-NodeOutput $state
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions:
      - microsoft-entra-id
  - id: node-4
    name: Reset Password
    type: powershell-script
    position:
      x: 820
      y: 80
    properties:
      script: |-
        # === NODE: Reset Password (+ optional session revoke) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Is-Terminal { param($S) return (@('incomplete','rejected','error','success') -contains [string]$S['status']) }
        function Get-KvSecret { param([string[]]$Names) foreach($n in $Names){ $v=Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue; if(-not [string]::IsNullOrWhiteSpace($v)){ return $v } } return $null }
        function Get-GraphHeaders { param($T,$C,$S) $r=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$T/oauth2/v2.0/token" -Body @{client_id=$C;client_secret=$S;scope='https://graph.microsoft.com/.default';grant_type='client_credentials'} -ErrorAction Stop; return @{Authorization="Bearer $($r.access_token)";'Content-Type'='application/json'} }
        function Invoke-Graph { param($M,$P,$B,$H) $p=@{Method=$M;Uri="https://graph.microsoft.com$P";Headers=$H;ErrorAction='Stop'}; if($null -ne $B){$p['Body']=($B|ConvertTo-Json -Depth 10)}; Invoke-RestMethod @p }
        function New-TempPassword { param([int]$Length=16) $U='ABCDEFGHJKLMNPQRSTUVWXYZ';$L='abcdefghijkmnpqrstuvwxyz';$D='23456789';$S='!@#$%^&*-_=+'; $all=$U+$L+$D+$S; $rng=[System.Security.Cryptography.RandomNumberGenerator]::Create(); $pick={param($set) $b=New-Object 'System.Byte[]' 1; $rng.GetBytes($b); $set[[int]($b[0]%$set.Length)]}; $chars=@((& $pick $U),(& $pick $L),(& $pick $D),(& $pick $S)); for($i=$chars.Count;$i -lt $Length;$i++){ $chars+=(& $pick $all) }; ($chars | Sort-Object {Get-Random}) -join '' }

        $state = Read-State
        if (Is-Terminal $state) { Set-NodeOutput $state; return }
        $userId=[string]$state['userId']; $resolvedUpn=[string]$state['resolvedUpn']
        $H=Get-GraphHeaders ([string]$state['graphTenantId']) (Get-KvSecret @('M365-ClientId','M365-ClientID','Entra-ClientID','Graph-ClientId')) (Get-KvSecret @('M365-ClientSecret','Entra-ClientSecret','Graph-ClientSecret'))

        $tempPassword = New-TempPassword 16
        $actions=@($state['actions']); $warnings=@($state['warnings'])
        try {
            Invoke-Graph 'Patch' "/v1.0/users/$userId" @{ passwordProfile=@{ password=$tempPassword; forceChangePasswordNextSignIn=$true } } $H | Out-Null
            $actions+='Reset password and set force-change at next sign-in'
        } catch { $m="Failed to reset password for $resolvedUpn : $($_.Exception.Message)"; $o=@{}; foreach($k in $state.Keys){$o[$k]=$state[$k]}; $o['status']='error'; $o['message']='Something went wrong resetting your password. A technician will follow up shortly.'; $o['public_note']=$o['message']; $o['internal_note']=$m; $o['category']='graph-error'; Set-NodeOutput $o; throw $m }
        $revoke=$true; if($state.Contains('revokeSessions')){ $revoke=[bool]$state['revokeSessions'] }
        if($revoke){ try { Invoke-Graph 'Post' "/v1.0/users/$userId/revokeSignInSessions" @{} $H | Out-Null; $actions+='Revoked all active sign-in sessions' } catch { $warnings+="Could not revoke sessions: $($_.Exception.Message)" } }
        $state['tempPassword']=$tempPassword; $state['actions']=$actions; $state['warnings']=$warnings
        Set-NodeOutput $state
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions:
      - microsoft-entra-id
  - id: node-5
    name: Finish
    type: powershell-script
    position:
      x: 1000
      y: 80
    properties:
      script: |-
        # === NODE: Finish (build notes + output contract; temp password only in internal_note) ===
        function Read-State { $in=Get-NodeInput; $s=[ordered]@{}; if($null -ne $in){ if($in -is [System.Collections.IDictionary]){ foreach($k in $in.Keys){$s[[string]$k]=$in[$k]} } else { foreach($p in $in.PSObject.Properties){$s[$p.Name]=$p.Value} } }; return $s }
        function Is-Terminal { param($S) return (@('incomplete','rejected','error','success') -contains [string]$S['status']) }

        $state = Read-State
        if (Is-Terminal $state) { Set-NodeOutput $state; return }   # a gate already produced the final (rejected) output

        $resolvedUpn=[string]$state['resolvedUpn']; $ticketId=[string]$state['ticket_id']; $submittedByUpn=[string]$state['submittedByUpn']
        $userId=[string]$state['userId']; $tempPassword=[string]$state['tempPassword']
        $actions=@($state['actions']); $warnings=@($state['warnings'])
        $reportDate=(Get-Date).ToString('yyyy-MM-dd HH:mm:ss K')
        $noteLines=@("Password reset completed for $resolvedUpn (verified self-service; submitter $submittedByUpn).","Ticket: $ticketId  |  Generated: $reportDate",'','Actions performed:')
        foreach($a in $actions){ $noteLines+=" - $a" }
        if($warnings.Count -gt 0){ $noteLines+=''; $noteLines+='Warnings / manual follow-up:'; foreach($w in $warnings){ $noteLines+=" - $w" } }
        $noteLines+=''; $noteLines+="Temporary password (deliver to the user out-of-band): $tempPassword"; $noteLines+='Note: this workflow does not change MFA methods.'
        $internalNote=$noteLines -join "`n"
        $publicNote="Your password has been reset. You'll be prompted to set a new password the next time you sign in, and your other sessions have been signed out. If you did NOT request this, contact the service desk immediately."

        Set-NodeOutput @{
            status='success'; message=$publicNote; public_note=$publicNote; internal_note=$internalNote
            ticket_id=$ticketId; user_id=$userId; upn=$resolvedUpn; passwordReset=$true
            actions=$actions; warnings=$warnings
            audit=[pscustomobject]@{ category='approved'; requestedBy=$submittedByUpn; submittedByUpn=$submittedByUpn; forceChangeAtNextSignIn=$true; evaluatedAt=$reportDate; outcome='success' }
        }
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions: []
  connections:
  - source: start
    target: node-1
    sourceHandle: null
  - source: node-1
    target: node-2
    sourceHandle: null
  - source: node-2
    target: node-3
    sourceHandle: null
  - source: node-3
    target: node-4
    sourceHandle: null
  - source: node-4
    target: node-5
    sourceHandle: null
  - source: node-5
    target: end
    sourceHandle: null
  startActivityId: start
