        # Plain text from a note body that may be HTML.
        function ConvertTo-PsaPlainText {
            param([string]$Text)
            if ($null -eq $Text) { return '' }
            $t = $Text -replace '(?i)<br\s*/?>', "`n" -replace '(?i)</p>', "`n" -replace '<[^>]+>', ''
            $t = $t -replace '&nbsp;', ' ' -replace '&amp;', '&' -replace '&lt;', '<' -replace '&gt;', '>' -replace '&quot;', '"' -replace '&#39;', "'"
            return ($t -replace "(`r?`n){3,}", "`n`n").Trim()
        }

        # Notes on a ticket, newest first: @(@{ text; public; created; raw }).
        # public is $true when the client can see the note.
        function Get-PsaNotes {
            param([string]$Id, [int]$Max = 50)
            $c = Get-PsaConn
            $rows = New-Object System.Collections.ArrayList
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: list form of GET /service/tickets/{id}/notes (PSA.md has the first-note read only).
                    foreach ($n in @(Invoke-Psa GET "/service/tickets/$Id/notes?orderBy=$(ConvertTo-PsaQuery 'id desc')&pageSize=$Max")) {
                        if ($null -eq $n) { continue }
                        $pub = (Get-PsaProp $n 'detailDescriptionFlag') -eq $true -or (Get-PsaProp $n 'resolutionFlag') -eq $true
                        $null = $rows.Add(@{ text = [string](Get-PsaProp $n 'text'); public = $pub; created = [string](Get-PsaProp $n 'dateCreated'); raw = $n })
                    }
                }
                'autotask' {
                    # Unverified: the Tickets/{id}/Notes child collection read. Internal notes are the publish values whose label says Internal.
                    $internal = @(Get-PsaAtPicklist 'TicketNotes' 'publish' | Where-Object { [string](Get-PsaProp $_ 'label') -match '(?i)internal' } | ForEach-Object { [string](Get-PsaProp $_ 'value') })
                    $r = Invoke-Psa GET "/Tickets/$Id/Notes"
                    foreach ($n in @(Get-PsaProp $r 'items')) {
                        if ($null -eq $n) { continue }
                        $pub = $internal -notcontains [string](Get-PsaProp $n 'publish')
                        $null = $rows.Add(@{ text = [string](Get-PsaProp $n 'description'); public = $pub; created = [string](Get-PsaProp $n 'createDateTime'); raw = $n })
                    }
                }
                'halopsa' {
                    # Unverified: GET /api/Actions?ticket_id= returns { actions: [...] } with note, hiddenfromuser and datetime.
                    $r = Invoke-Psa GET "/Actions?ticket_id=$Id&count=$Max"
                    $list = @(Get-PsaProp $r 'actions'); if (-not @($list | Where-Object { $null -ne $_ }).Count -and $r -is [array]) { $list = @($r) }
                    foreach ($n in $list) {
                        if ($null -eq $n) { continue }
                        $txt = [string](Get-PsaProp $n 'note'); if (-not $txt) { $txt = [string](Get-PsaProp $n 'note_html') }
                        $null = $rows.Add(@{ text = (ConvertTo-PsaPlainText $txt); public = ((Get-PsaProp $n 'hiddenfromuser') -ne $true); created = [string](Get-PsaProp $n 'datetime'); raw = $n })
                    }
                }
                'kaseyabms' {
                    # Unverified: GET /v2/servicedesk/tickets/{id}/notes returns Result: [{ Details, IsInternal, NoteDate }].
                    $r = Invoke-Psa GET "/servicedesk/tickets/$Id/notes"
                    foreach ($n in @(Get-PsaProp $r 'Result')) {
                        if ($null -eq $n) { continue }
                        $null = $rows.Add(@{ text = [string](Get-PsaProp $n 'Details'); public = ((Get-PsaProp $n 'IsInternal') -ne $true); created = [string](Get-PsaProp $n 'NoteDate'); raw = $n })
                    }
                }
                'syncro' {
                    # Comments come with the ticket (PSA.md, Get ticket).
                    $t = Get-PsaProp (Invoke-Psa GET "/tickets/$Id") 'ticket'
                    foreach ($n in @(Get-PsaProp $t 'comments')) {
                        if ($null -eq $n) { continue }
                        $null = $rows.Add(@{ text = [string](Get-PsaProp $n 'body'); public = ((Get-PsaProp $n 'hidden') -ne $true); created = [string](Get-PsaProp $n 'created_at'); raw = $n })
                    }
                }
                'zendesk' {
                    # GET /tickets/{id}/comments returns { comments: [{ body, public, created_at }] } (vendor docs).
                    $r = Invoke-Psa GET "/tickets/$Id/comments?sort_order=desc"
                    foreach ($n in @(Get-PsaProp $r 'comments')) {
                        if ($null -eq $n) { continue }
                        $null = $rows.Add(@{ text = [string](Get-PsaProp $n 'body'); public = ((Get-PsaProp $n 'public') -eq $true); created = [string](Get-PsaProp $n 'created_at'); raw = $n })
                    }
                }
            }
            # Newest first. Notes without a readable date keep the order the PSA returned.
            $i = 0
            $keyed = @(foreach ($r in $rows) { $d = [datetime]::MinValue; if ($r.created) { $null = [datetime]::TryParse($r.created, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal, [ref]$d) }; $i++; [pscustomobject]@{ d = $d; i = $i; n = $r } })
            if (@($keyed | Where-Object { $_.d -ne [datetime]::MinValue }).Count -eq $keyed.Count -and $keyed.Count) { $keyed = @($keyed | Sort-Object -Property @{ Expression = 'd'; Descending = $true }, @{ Expression = 'i'; Descending = $false }) }
            return @($keyed | Select-Object -First $Max | ForEach-Object { $_.n })
        }

        # A link a technician can open, or '' when this PSA's link can't be worked out.
        # -Template wins: {id} (or {ticketId}) is replaced with the ticket id.
        function Get-PsaTicketUrl {
            param([string]$Id, [string]$Template = '')
            if ($Template -and -not $Template.StartsWith('@')) { return ($Template -replace '\{(id|ticketId)\}', [uri]::EscapeDataString($Id)) }
            $c = Get-PsaConn
            $u = $null; try { $u = [uri]$c.Base } catch { return '' }
            $root = "$($u.Scheme)://$($u.Host)"
            switch ($c.Psa) {
                # Unverified: the ConnectWise ticket screen link, with the api- prefix of cloud hosts removed.
                'connectwise' { return "$($root -replace '://api-', '://')/v4_6_release/services/system_io/Service/fv_sr100_request.rpt?service_recid=$Id" }
                # Unverified: the web UI host mirrors the API zone host (webservices5 -> ww5).
                'autotask' { return "$($root -replace '://webservices', '://ww')/Mvc/ServiceDesk/TicketDetail.mvc?ticketId=$Id" }
                # Unverified: the HaloPSA agent ticket link.
                'halopsa' { return "$root/ticket?id=$Id" }
                'kaseyabms' { return '' }
                # Unverified: the Syncro ticket page.
                'syncro' { return "$root/tickets/$Id" }
                'zendesk' { return "$root/agent/tickets/$Id" }
            }
            return ''
        }

        # A readable status name. Autotask and HaloPSA hand out status ids; the others already use names.
        function Get-PsaStatusName {
            param([string]$Status)
            $s = ([string]$Status).Trim()
            if ($s -notmatch '^\d+$') { return $s }
            $c = Get-PsaConn
            switch ($c.Psa) {
                'autotask' {
                    $hit = @(Get-PsaAtPicklist 'Tickets' 'status' | Where-Object { [string](Get-PsaProp $_ 'value') -eq $s }) | Select-Object -First 1
                    if ($hit) { return [string](Get-PsaProp $hit 'label') }
                }
                'halopsa' {
                    # Unverified: GET /api/Status/{id} returns { id, name }.
                    try { $r = Invoke-Psa GET "/Status/$s"; $n = [string](Get-PsaProp $r 'name'); if ($n) { return $n } } catch { }
                }
            }
            return $s
        }
        # ---------- end src/psa-extra.ps1 ----------
        # <<< src/psa-extra.ps1
        # >>> src/step.ps1 (generated by src/build.js; edit the source, not this block)
        # ---------- src/step.ps1: helpers every step in this workflow uses ----------
        # Reading the trigger body (flat or the CloudRadial {Ticket, Company} shape), reading the previous
        # step's context, and emailing staff through Postmark. Needs _shared/psa.ps1 above it (Get-PsaSecret).

        function Get-StepProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Read-StepJson { param($v) if ($null -eq $v) { return $null }; if ($v -is [string]) { if (-not $v.Trim()) { return $null }; try { return ($v | ConvertFrom-Json) } catch { return $null } }; return $v }
        function Test-StepTrue { param($v) if ($v -eq $true) { return $true }; return (@('true', 'yes', 'y', '1') -contains ([string]$v).Trim().ToLowerInvariant()) }
        # A value as trimmed text. A CloudRadial token that wasn't filled in arrives as literal "@name", which counts as missing.
        function Get-StepText { param($v) if ($null -eq $v) { return '' }; $s = ([string]$v).Trim(); if ($s.StartsWith('@')) { return '' }; return $s }
        # A list from a comma, semicolon or line separated value (or an array). Items are trimmed; an item may start with @ (an @domain).
        function Get-StepList { param($v) if ($null -eq $v) { return @() }; if ($v -isnot [string]) { return @(@($v) | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ }) }; return @(($v -split '[,;\r\n]+') | ForEach-Object { $_.Trim() } | Where-Object { $_ }) }
        function Test-StepEmail { param([string]$s) return ($s -match '^[^@\s]+@[^@\s]+\.[^@\s]+$') }

        # Every simple field of the trigger body, keyed case-insensitively. Handles a body wrapped in "trigger",
        # a JSON string, and the CloudRadial {Ticket:{TicketId, Questions:[{Id, Value}]}, Company:{...}} shape.
        function Read-StepTrigger {
            param($Raw)
            $in = Read-StepJson $Raw
            $w = Get-StepProp $in 'trigger'; if ($null -ne $w) { $in = Read-StepJson $w }
            $a = @{}
            if ($null -eq $in -or $in -is [string] -or $in -is [array]) { return $a }
            $addProps = {
                param($obj, [string]$prefix)
                $pairs = if ($obj -is [System.Collections.IDictionary]) { @($obj.Keys | ForEach-Object { [pscustomobject]@{ Name = [string]$_; Value = $obj[$_] } }) } else { @($obj.PSObject.Properties | ForEach-Object { [pscustomobject]@{ Name = $_.Name; Value = $_.Value } }) }
                foreach ($p in $pairs) {
                    if ($null -eq $p.Value) { continue }
                    if ($p.Value -is [string] -or $p.Value.GetType().IsValueType) { $a["$prefix$($p.Name)"] = $p.Value }
                }
            }
            & $addProps $in ''
            $t = Get-StepProp $in 'Ticket'
            if ($null -ne $t -and $t -isnot [string]) {
                & $addProps $t 'Ticket.'
                foreach ($q in @(Get-StepProp $t 'Questions')) { $qid = [string](Get-StepProp $q 'Id'); if ($qid) { $a[$qid] = Get-StepProp $q 'Value' } }
                foreach ($k in @('TicketId', 'Status', 'StatusName', 'Subject', 'Summary', 'ContactEmail', 'Priority')) { if ($a.ContainsKey("Ticket.$k") -and -not $a.ContainsKey($k)) { $a[$k] = $a["Ticket.$k"] } }
            }
            $co = Get-StepProp $in 'Company'
            if ($null -ne $co -and $co -isnot [string]) {
                & $addProps $co 'Company.'
                foreach ($k in @('CompanyName', 'CompanyId', 'CompanyPsaId', 'CompanyTenantId')) { if ($a.ContainsKey("Company.$k") -and -not $a.ContainsKey($k)) { $a[$k] = $a["Company.$k"] } }
                if ($a.ContainsKey('Company.Name') -and -not $a.ContainsKey('CompanyName')) { $a['CompanyName'] = $a['Company.Name'] }
            }
            return $a
        }
        # The first non-empty field among the names.
        function Get-StepField { param([hashtable]$A, [string[]]$Names) foreach ($n in $Names) { if ($A.ContainsKey($n)) { $v = Get-StepText $A[$n]; if ($v) { return $v } } }; return '' }

        # The previous step's context, carried in its output as ctx (an object) or ctx_json (a string).
        function Read-StepContext {
            param($Raw)
            $in = Read-StepJson $Raw
            $ctx = Read-StepJson (Get-StepProp $in 'ctx_json')
            if ($null -eq $ctx) { $ctx = Read-StepJson (Get-StepProp $in 'ctx') }
            return $ctx
        }

        # Emails staff through Postmark. Returns @{ sent; id; reason }. Never throws: when Postmark isn't
        # set up or refuses the message, sent is $false and reason says why, so the caller can fall back
        # to an internal note. Secrets: Postmark-ServerToken, Postmark-FromEmail, optional Postmark-ApiUrl.
        function Send-StepEmail {
            param([string[]]$To, [string]$Subject, [string]$Text, [string]$Html = '', [string]$Tag = '')
            $to2 = @($To | Where-Object { Test-StepEmail $_ })
            if (-not $to2.Count) { return @{ sent = $false; id = ''; reason = 'there is no valid recipient address' } }
            $token = Get-PsaSecret 'Postmark-ServerToken'; $from = Get-PsaSecret 'Postmark-FromEmail'; $api = Get-PsaSecret 'Postmark-ApiUrl'
            if (-not $token -or -not $from) { return @{ sent = $false; id = ''; reason = 'Postmark is not set up (add the Postmark-ServerToken and Postmark-FromEmail secrets)' } }
            if (-not $api) { $api = 'https://api.postmarkapp.com' }
            $b = [ordered]@{ From = $from; To = ($to2 -join ','); Subject = $Subject; TextBody = $Text; MessageStream = 'outbound' }
            if ($Html) { $b.HtmlBody = $Html }
            if ($Tag) { $b.Tag = $Tag }
            try {
                $r = Invoke-RestMethod -Method POST -Uri "$($api.TrimEnd('/'))/email" -Headers @{ 'X-Postmark-Server-Token' = $token; Accept = 'application/json' } -Body (ConvertTo-Json -InputObject $b -Depth 5 -Compress) -ContentType 'application/json' -ErrorAction Stop
                return @{ sent = $true; id = [string](Get-StepProp $r 'MessageID'); reason = '' }
            }
            catch {
                $code = 0; try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                $why = ''; try { $why = [string](Get-StepProp ($_.ErrorDetails.Message | ConvertFrom-Json) 'Message') } catch { }
                if (-not $why) { $why = [string]$_.Exception.Message }
                return @{ sent = $false; id = ''; reason = "Postmark refused the email$(if ($code) { " (HTTP $code)" }): $why" }
            }
        }
        function ConvertTo-StepHtml { param([string]$s) if ($null -eq $s) { return '' }; return ($s -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;' -replace '"', '&quot;') }
        # ---------- end src/step.ps1 ----------
        # <<< src/step.ps1
        # Step 3: Route low scores (mode "score" only).
        # Records the score as an internal note on the ticket. When the score is at or below the threshold, it first
        # emails the service manager through Postmark (or, if Postmark isn't set up, says so in the note).
        # When a CloudRadial company id is sent and the CloudRadial secrets are set, it also records the score as
        # CloudRadial feedback, so the Feedback & CSAT Report (automationai/feedback-csat-report) counts it.
        # With confirm=false it returns a preview (status pending_confirmation) and writes nothing.
        # In mode "survey", or when step 1 skipped, it returns the result of the earlier steps.
        $stopState = @{ done = $false }
        $ctx = Read-StepContext (Get-NodeInput)
        trap { if (-not $stopState.done) { $stopState.done = $true; $m = [string]$_.Exception.Message; $tid = ''; if ($null -ne $ctx -and $null -ne $ctx.PSObject.Properties['ticket_id']) { $tid = [string]$ctx.ticket_id }; Set-NodeOutput ([ordered]@{ status = 'error'; message = "The score for ticket $tid could not be recorded: $m"; public_note = ''; internal_note = "Post-close feedback failed: $m"; ticket_id = $tid; mode = 'score'; survey_sent = $false; score = $null; low_score = $false; manager_emailed = $false; actions = @(); warnings = @() }) }; break }
        if ($null -eq $ctx -or $null -eq $ctx.PSObject.Properties['skip']) { throw 'The request details from step 1 are missing. Run the workflow from the start.' }
        if ($ctx.skip -or $ctx.mode -ne 'score') {
            if ($null -eq $ctx.PSObject.Properties['result']) { throw 'The survey step left no result. Run the workflow from the start.' }
            $stopState.done = $true; Set-NodeOutput $ctx.result; return
        }

        $id = [string]$ctx.ticket_id
        $score = [int]$ctx.score; $max = [int]$ctx.score_max; $low = [bool]$ctx.low
        $actions = New-Object System.Collections.ArrayList; foreach ($x in @($ctx.actions)) { if ($x) { $null = $actions.Add([string]$x) } }
        $warnings = New-Object System.Collections.ArrayList; foreach ($x in @($ctx.warnings)) { if ($x) { $null = $warnings.Add([string]$x) } }
        $managers = @($ctx.managers | Where-Object { $_ })
        $mgrText = if ($managers.Count) { $managers -join ', ' } else { 'nobody (no service manager address is set)' }
        $who = if ($ctx.contact) { " from $($ctx.contact)" } else { '' }
        $comment = [string]$ctx.comment

        $noteLines = New-Object System.Collections.ArrayList
        $null = $noteLines.Add("Satisfaction score received: $score out of $max$who.")
        if ($comment) { $null = $noteLines.Add("Comment: $comment") }

        $mailText = @(
            "Ticket $id$(if ($ctx.summary) { " ($($ctx.summary))" }) was rated $score out of $max$who, which is at or below the alert threshold of $($ctx.threshold)."
            $(if ($comment) { "Their comment: $comment" } else { 'They left no comment.' })
            $(if ($ctx.ticket_url) { "Open the ticket: $($ctx.ticket_url)" } else { '' })
            ''
            'Please follow up with them. A note on the ticket records the score.'
        ) -join "`n"
        $subject = "Low satisfaction score on ticket $($id): $score out of $max"

        if (-not $ctx.confirm) {
            $stopState.done = $true
            $preview = ($noteLines -join "`n") + $(if ($low) { "`nIt would email the service manager ($mgrText)." } else { '' })
            Set-NodeOutput ([ordered]@{
                    status = 'pending_confirmation'; message = "Preview: ticket $id was rated $score out of $max. Run again with confirm set to true to record it$(if ($low) { ' and alert the service manager' })."
                    public_note = ''; internal_note = $preview; ticket_id = $id; mode = 'score'; survey_sent = $true; score = $score; low_score = $low; manager_emailed = $false
                    email_text = $(if ($low) { $mailText } else { '' }); actions = @($actions); warnings = @($warnings)
                })
            return
        }

        $conn = Connect-Psa $ctx.psa
        $mail = @{ sent = $false; id = ''; reason = '' }
        if ($low) {
            $mail = Send-StepEmail -To $managers -Subject $subject -Text $mailText -Tag 'post-close-feedback'
            if ($mail.sent) { $null = $actions.Add("Emailed the service manager ($mgrText) about the low score."); $null = $noteLines.Add("This is at or below the alert threshold of $($ctx.threshold), so the service manager ($mgrText) was emailed.") }
            else { $null = $warnings.Add("The service manager email was not sent: $($mail.reason)."); $null = $noteLines.Add("This is at or below the alert threshold of $($ctx.threshold), but the service manager email was not sent because $($mail.reason). Please follow up with the requester.") }
        }
        $note = $noteLines -join "`n"
        try { Add-PsaNote -Id $id -Text $note -Title 'Satisfaction score' }
        catch {
            if (-not $mail.sent) { throw }
            $stopState.done = $true
            $m = "The service manager was emailed about ticket $id, but the internal note could not be added: $($_.Exception.Message) Add the note by hand; a rerun would email again."
            Set-NodeOutput ([ordered]@{ status = 'error'; message = $m; public_note = ''; internal_note = $note; ticket_id = $id; mode = 'score'; survey_sent = $true; score = $score; low_score = $low; manager_emailed = $true; actions = @($actions); warnings = @($warnings) })
            throw $m
        }
        $null = $actions.Add("Added an internal note with the score to ticket $id.")

        # ---- optional: record it as CloudRadial feedback for the CSAT report ----
        $crId = [string]$ctx.cr_company_id
        $crRecorded = $false
        if ($crId -match '^\d+$') {
            if (-not (Get-PsaSecret 'CloudRadial-BaseUrl') -or -not (Get-PsaSecret 'CloudRadial-PublicKey') -or -not (Get-PsaSecret 'CloudRadial-PrivateKey')) {
                $null = $warnings.Add('The score was not recorded in CloudRadial because the CloudRadial-BaseUrl, CloudRadial-PublicKey and CloudRadial-PrivateKey secrets are not all set.')
            }
            else {
                # Unverified: POST /v2/feedback (public v2 spec; companyId and sentiment are required). feedbackRating is
                # 1 positive, 0 neutral, -1 negative; sentiment is sent the same way.
                $pct = $score / [double]$max
                $rating = if ($pct -ge 0.75) { 1 } elseif ($pct -gt 0.5) { 0 } else { -1 }
                $fb = [ordered]@{ companyId = [int]$crId; sentiment = $rating; feedbackRating = $rating; feedbackRatingNumber = $score; feedbackComment = $comment; ticketSubject = [string]$ctx.summary; userEmail = [string]$ctx.contact }
                if ($id -match '^\d+$') { $fb.ticketPsaId = [long]$id }
                try { $null = Connect-Cr; $null = Invoke-CrApi -Path '/v2/feedback' -Method 'POST' -Body $fb; $crRecorded = $true; $null = $actions.Add("Recorded the score as CloudRadial feedback for company $crId.") }
                catch { $null = $warnings.Add("The score was not recorded in CloudRadial: $($_.Exception.Message)") }
            }
        }

        $stopState.done = $true
        $msg = if ($low -and $mail.sent) { "Ticket $id was rated $score out of $max. The service manager was emailed and the score was noted on the ticket." }
        elseif ($low) { "Ticket $id was rated $score out of $max. The service manager email could not be sent, so the internal note asks the team to follow up." }
        else { "Ticket $id was rated $score out of $max. The score was noted on the ticket." }
        Set-NodeOutput ([ordered]@{
                status = 'success'; message = $msg; public_note = ''; internal_note = $note; ticket_id = $id; mode = 'score'; survey_sent = $true
                score = $score; low_score = $low; manager_emailed = [bool]$mail.sent; postmark_message_id = [string]$mail.id; cloudradial_recorded = $crRecorded
                actions = @($actions); warnings = @($warnings)
            })
      timeoutSeconds: 300
      retryCount: 0
      parameters: []
      aiExtensions: []
