# Generated by src/build.js from src/*.ps1 and ../_shared. Edit the sources, not this file.
automationsWorkflow: 1
name: QBR Data Pack
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-inputs
      name: Read inputs
      type: powershell-script
      position:
        x: 300
        'y': 120
      properties:
        script: |
          # === STEP: Read inputs ===
          # Edit this file, then run: node automationai/qbr-data-pack/src/build.js
          # Reads the run input (manual run or Routine). A Routine sends no input, so every field has a default.
          #   company_id      CloudRadial company number; when blank, the CloudRadial-CompanyId secret is used
          #   quarter_days    how many days the review covers (default 90, 30 to 366); tickets are compared with the same span before it
          #   preview         true works everything out but leaves the Planner card alone (default false)
          #   psa             optional; overrides the PSA-Type secret (connectwise, autotask, halopsa, kaseyabms, syncro, zendesk)
          #   psa_company_id  optional; the PSA's own id for this client, when CloudRadial's PSA link is missing or wrong
          # Read-only: the only write in this workflow is one internal CloudRadial Planner card.

          function Get-QbrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Test-QbrBlank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or ([string]$v).Trim().StartsWith('@')) }
          function Stop-QbrInput {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'rejected'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @() })
              throw $Why
          }

          $raw = Get-NodeInput
          if ($raw -is [string]) {
              if ([string]::IsNullOrWhiteSpace($raw)) { $raw = $null }
              else { try { $raw = $raw | ConvertFrom-Json -ErrorAction Stop } catch { Stop-QbrInput 'The run input is not valid JSON. Send an object such as {"company_id": 9}.' } }
          }
          $wrap = Get-QbrProp $raw 'trigger'; if ($null -ne $wrap) { $raw = $wrap }
          if ($raw -is [string]) { try { $raw = $raw | ConvertFrom-Json -ErrorAction Stop } catch { $raw = $null } }

          # company_id
          $companyId = 0
          $c = Get-QbrProp $raw 'company_id'; if (Test-QbrBlank $c) { $c = Get-QbrProp $raw 'companyId' }
          if (-not (Test-QbrBlank $c)) {
              $n = 0
              if (-not [int]::TryParse(([string]$c).Trim(), [ref]$n) -or $n -le 0) { Stop-QbrInput "The company_id input must be a CloudRadial company number, such as 9. It was '$c'." }
              $companyId = $n
          }

          # quarter_days
          $quarterDays = 90
          $d = Get-QbrProp $raw 'quarter_days'
          if (-not (Test-QbrBlank $d)) {
              $n = 0
              if (-not [int]::TryParse(([string]$d).Trim(), [ref]$n)) { Stop-QbrInput "The quarter_days input must be a whole number of days, such as 90. It was '$d'." }
              if ($n -lt 30 -or $n -gt 366) { Stop-QbrInput "The quarter_days input must be between 30 and 366. It was $n." }
              $quarterDays = $n
          }

          # preview
          $preview = $false
          $pv = Get-QbrProp $raw 'preview'
          if (-not (Test-QbrBlank $pv)) { $preview = ([string]$pv).Trim() -match '^(?i)(true|yes|1)$' }

          # psa and psa_company_id (optional overrides)
          $psa = ''
          $p = Get-QbrProp $raw 'psa'; if (-not (Test-QbrBlank $p)) { $psa = ([string]$p).Trim() }
          $psaCompanyId = ''
          $pc = Get-QbrProp $raw 'psa_company_id'
          if (-not (Test-QbrBlank $pc)) {
              $psaCompanyId = ([string]$pc).Trim()
              if ($psaCompanyId -notmatch '^\d+$') { Stop-QbrInput "The psa_company_id input must be the PSA's numeric company id, such as 250. It was '$pc'." }
          }

          $now = (Get-Date).ToUniversalTime()
          $q = [int][Math]::Ceiling($now.Month / 3)
          Set-NodeOutput ([ordered]@{
                  status         = 'ok'
                  company_id     = $companyId
                  quarter_days   = $quarterDays
                  preview        = $preview
                  psa            = $psa
                  psa_company_id = $psaCompanyId
                  runAt          = $now.ToString('yyyy-MM-ddTHH:mm:ssZ')
                  quarterLabel   = "Q$q $($now.Year)"
                  quarterKey     = "$($now.Year)-Q$q"
                  warnings       = @()
              })
        timeoutSeconds: 60
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {
            "company_id": "",
            "quarter_days": 90,
            "preview": true
          }
    - id: node-cloudradial
      name: Read CloudRadial data
      type: powershell-script
      position:
        x: 520
        'y': 120
      properties:
        script: |
          # === STEP: Read CloudRadial data ===
          # Edit this file, then run: node automationai/qbr-data-pack/src/build.js
          # Read-only. Works out which CloudRadial company this run is for, then reads that company's endpoints,
          # Planner cards, domains and certificates. Device age, warranty and operating system use the same rules as
          # Endpoint LifeCycle Manager (automationai/endpoint-lifecycle-manager/src/elm.ps1).
          # Every list is filtered to the one company, and filtered again here, so no other client's data is carried on.
          # Secrets: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey, optional CloudRadial-CompanyId.
          # >>> _shared/cloudradial.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          function Get-CrSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive by name through the legacy /api/beta/archive list (which ignores
          # companyId, so it is filtered here), and creates it with -Create. Returns @{ id; companyId; name; inboundAddress } or $null.
          # The create reply doesn't always carry the new id, so the archive is looked up again by name.
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              $find = {
                  $list = @(Get-CrBetaAll '/api/beta/archive')
                  @($list | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  # A 400 here has meant "already exists" when the list missed it, so look again before giving up.
                  try { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  $id = Get-CrId $resp @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('id', 'archiveId', 'companyReportFolderId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = [string](Get-CrProp $hit 'inboundAddress') }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # <<< _shared/cloudradial.ps1

          $in = Get-NodeInput
          function Get-QbrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Copy-QbrInput { param($o) $h = [ordered]@{}; if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] } } elseif ($null -ne $o) { foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value } }; return $h }
          $out = Copy-QbrInput $in
          $warnings = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-QbrProp $in 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }

          function Stop-QbrCr {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'error'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @($warnings) })
              throw $Why
          }

          $ci = [System.Globalization.CultureInfo]::InvariantCulture
          $runDate = (Get-Date).ToUniversalTime()
          function ConvertTo-QbrUtc { param($v) if ($null -eq $v) { return $null }; if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }; if ($v -is [datetimeoffset]) { return $v.UtcDateTime }; $d = [datetime]::MinValue; if ([string]$v -and [datetime]::TryParse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { return $d }; return $null }
          $tmp = ConvertTo-QbrUtc (Get-QbrProp $in 'runAt'); if ($null -ne $tmp) { $runDate = $tmp }
          function ConvertTo-QbrDate { param($v) $d = [datetime]::MinValue; if ($null -ne $v -and [string]$v -and [datetime]::TryParse([string]$v, $ci, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { if ($d.Year -gt 1900) { return $d } }; return $null }
          function Format-QbrDate { param([datetime]$d) return $d.ToString('d MMM yyyy', $ci) }

          try { $null = Connect-Cr } catch { Stop-QbrCr ([string]$_.Exception.Message) }

          # ---- which company: the run's company_id, then the CloudRadial-CompanyId secret ----
          $companyId = [int](Get-QbrProp $in 'company_id')
          $how = 'company_id input'
          if ($companyId -le 0) {
              $sec = [string](Get-CrSecret 'CloudRadial-CompanyId')
              if ($sec.Trim() -match '^\d+$' -and [int]$sec.Trim() -gt 0) { $companyId = [int]$sec.Trim(); $how = 'CloudRadial-CompanyId secret' }
          }
          if ($companyId -le 0) {
              $why = 'No company was given. Set company_id on the run, or add the CloudRadial-CompanyId secret to this runner''s Key Vault.'
              Set-NodeOutput ([ordered]@{ status = 'rejected'; message = $why; public_note = ''; internal_note = $why; ticket_id = ''; actions = @(); warnings = @($warnings) })
              throw $why
          }
          $company = $null
          try { $company = @(Get-CrAll "/v2/odata/company?`$filter=companyId eq $companyId") | Where-Object { [int](Get-QbrProp $_ 'companyId') -eq $companyId } | Select-Object -First 1 }
          catch { Stop-QbrCr "Couldn't read CloudRadial company $($companyId): $($_.Exception.Message)" }
          if ($null -eq $company) { Stop-QbrCr "CloudRadial company $companyId (from the $how) was not found. Check the company number and run again." }
          $companyName = [string](Get-QbrProp $company 'name'); if (-not $companyName) { $companyName = "company $companyId" }
          $out.companyId = $companyId
          $out.companyName = $companyName
          $out.companyVia = $how
          $out.psaKey = [string](Get-QbrProp $company 'psaKey')
          $out.psaIdentifier = [string](Get-QbrProp $company 'psaIdentifier')
          $tenantFields = @('tenantId', 'companyTenantId', 'officeTenantId', 'm365TenantId', 'azureTenantId', 'microsoftTenantId')
          $coTenant = ''; foreach ($f in $tenantFields) { $v = [string](Get-QbrProp $company $f); if ($v -match '^[0-9a-fA-F-]{36}$') { $coTenant = $v.ToLowerInvariant(); break } }
          $out.companyTenantId = $coTenant

          # ---- device rules (same as Endpoint LifeCycle Manager) ----
          function Get-QbrAge {
              param($ep)
              foreach ($f in @('manufacturedDate', 'biosDate', 'cpuDate')) { $d = ConvertTo-QbrDate (Get-QbrProp $ep $f); if ($d) { return @{ years = [math]::Round(($runDate - $d).TotalDays / 365.25, 1); estimated = ($f -ne 'manufacturedDate') } } }
              return $null
          }
          function Get-QbrWarranty {
              param($ep)
              $d = ConvertTo-QbrDate (Get-QbrProp $ep 'expirationDate')
              if (-not $d) { return @{ status = 'unknown'; date = $null } }
              if ($d -lt $runDate) { return @{ status = 'expired'; date = $d } }
              if ($d -le $runDate.AddDays(90)) { return @{ status = 'expiring'; date = $d } }
              return @{ status = 'active'; date = $d }
          }
          function Get-QbrOsType { param([string]$os) if ($os -match '(?i)windows') { 'windows' } elseif ($os -match '(?i)mac\s?os|os x') { 'macos' } else { 'other' } }
          function Get-QbrOsSupport {
              param([string]$os, [string]$type)
              if ($type -eq 'windows') { if ($os -match '(?i)windows\s*11') { return 'supported' }; if ($os -match '(?i)windows\s*(10|8|7|xp|vista)') { return 'unsupported' }; return 'unknown' }
              if ($type -eq 'macos') { if ($os -match '(?i)mac\s?os[^\d]*(\d+)') { if ([int]$Matches[1] -ge 14) { return 'supported' }; return 'unsupported' }; return 'unknown' }
              return 'other'
          }
          function Get-QbrRamGb { param($ep) $b = 0.0; if ([double]::TryParse([string](Get-QbrProp $ep 'memory'), [System.Globalization.NumberStyles]::Float, $ci, [ref]$b) -and $b -gt 0) { return [math]::Round($b / 1073741824, 1) }; return $null }

          # ---- endpoints ----
          $dev = [ordered]@{
              available = $true; reason = ''; total = 0; workstations = 0; servers = 0; virtual = 0
              age = [ordered]@{ 'Under 3 years' = 0; '3 to 5 years' = 0; '5 to 7 years' = 0; '7 years or more' = 0; 'Unknown' = 0 }
              ageEstimated = 0
              warranty = [ordered]@{ expired = 0; expiring = 0; active = 0; unknown = 0 }
              os = [ordered]@{ supported = 0; unsupported = 0; unknown = 0; other = 0 }
              replace = 0; stale = 0; warrantySoon = @()
          }
          try {
              $eps = @(Get-CrAll "/v2/odata/endpoint?`$filter=companyId eq $companyId" | Where-Object { $null -ne $_ -and [int](Get-QbrProp $_ 'companyId') -eq $companyId })
              $soon = New-Object System.Collections.ArrayList
              foreach ($ep in $eps) {
                  $dev.total++
                  $isServer = [bool](Get-QbrProp $ep 'isServer'); $isVirtual = [bool](Get-QbrProp $ep 'isVirtual')
                  if ($isVirtual) { $dev.virtual++ } elseif ($isServer) { $dev.servers++ } else { $dev.workstations++ }
                  $os = [string](Get-QbrProp $ep 'os'); $type = Get-QbrOsType $os; $sup = Get-QbrOsSupport $os $type
                  $dev.os[$sup]++
                  $seen = ConvertTo-QbrDate (Get-QbrProp $ep 'lastCheckIn'); if ($seen -and $seen -lt $runDate.AddDays(-30)) { $dev.stale++ }
                  if ($isVirtual) { continue }   # age and warranty mean nothing for a virtual machine
                  $a = Get-QbrAge $ep
                  $bucket = if ($null -eq $a) { 'Unknown' } elseif ($a.years -ge 7) { '7 years or more' } elseif ($a.years -ge 5) { '5 to 7 years' } elseif ($a.years -ge 3) { '3 to 5 years' } else { 'Under 3 years' }
                  $dev.age[$bucket]++
                  if ($null -ne $a -and $a.estimated) { $dev.ageEstimated++ }
                  $war = Get-QbrWarranty $ep
                  $dev.warranty[$war.status]++
                  if ($war.status -eq 'expiring') { $null = $soon.Add(@{ name = [string](Get-QbrProp $ep 'name'); date = $war.date }) }
                  # Endpoint LifeCycle Manager's "Replace" rule for a workstation.
                  $ram = Get-QbrRamGb $ep
                  $w11 = ([string](Get-QbrProp $ep 'windows11Readiness')) -match '(?i)installed|ready|capable'
                  if (-not $isServer -and $type -ne 'other' -and (($null -ne $a -and $a.years -ge 5) -or ($sup -eq 'unsupported' -and -not $w11) -or ($null -ne $ram -and $ram -lt 4))) { $dev.replace++ }
              }
              $dev.warrantySoon = @($soon | Sort-Object { $_.date } | ForEach-Object { @{ name = $_.name; ends = (Format-QbrDate $_.date) } })
          }
          catch {
              $dev.available = $false; $dev.reason = "Couldn't read the endpoints: $($_.Exception.Message)"
              $null = $warnings.Add($dev.reason)
          }
          $out.devices = $dev

          # ---- Planner cards already on the board (open ones, not counting QBR cards) ----
          $plan = [ordered]@{ available = $true; reason = ''; open = 0; total = 0 }
          try {
              $cards = @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $companyId" | Where-Object { $null -ne $_ -and [int](Get-QbrProp $_ 'companyId') -eq $companyId -and -not [bool](Get-QbrProp $_ 'isDeleted') })
              $cards = @($cards | Where-Object { -not ([string](Get-QbrProp $_ 'body')).Contains('qbr-data-pack') })
              $plan.total = $cards.Count
              $plan.open = @($cards | Where-Object { [string](Get-QbrProp $_ 'status') -notmatch '^(?i)(40|50|60|completed|client_declined|archive)$' }).Count
          }
          catch { $plan.available = $false; $plan.reason = "Couldn't read the Planner cards: $($_.Exception.Message)"; $null = $warnings.Add($plan.reason) }
          $out.planner = $plan

          # ---- domains (60 days) and certificates (30 days) ----
          function Get-QbrExpiring {
              param([object[]]$Rows, [string]$DateField, [int]$Window, [string[]]$NameFields)
              $list = New-Object System.Collections.ArrayList; $total = 0
              foreach ($r in $Rows) {
                  $total++
                  $d = ConvertTo-QbrDate (Get-QbrProp $r $DateField); if (-not $d) { continue }
                  if ($d -gt $runDate.AddDays($Window)) { continue }
                  $name = ''; foreach ($f in $NameFields) { $name = [string](Get-QbrProp $r $f); if ($name) { break } }
                  $left = [int][math]::Floor(($d - $runDate).TotalDays)
                  $null = $list.Add([ordered]@{ name = $name; expires = (Format-QbrDate $d); daysLeft = $left; status = $(if ($left -lt 0) { 'expired' } else { 'expiring' }) })
              }
              return @{ total = $total; items = @($list | Sort-Object { $_.daysLeft }) }
          }
          $dom = [ordered]@{ available = $true; reason = ''; window = 60; total = 0; items = @() }
          $domainNames = @()
          try {
              $rows = @(Get-CrAll "/v2/odata/domain?`$filter=companyId eq $companyId" | Where-Object { $null -ne $_ -and [int](Get-QbrProp $_ 'companyId') -eq $companyId -and -not [bool](Get-QbrProp $_ 'isDeleted') })
              $domainNames = @($rows | ForEach-Object { ([string](Get-QbrProp $_ 'name')).Trim().ToLowerInvariant() } | Where-Object { $_ })
              $e = Get-QbrExpiring $rows 'dateExpires' 60 @('name'); $dom.total = $e.total; $dom.items = $e.items
          }
          catch { $dom.available = $false; $dom.reason = "Couldn't read the domains: $($_.Exception.Message)"; $null = $warnings.Add($dom.reason) }
          $cert = [ordered]@{ available = $true; reason = ''; window = 30; total = 0; items = @() }
          try {
              $rows = @(Get-CrAll "/v2/odata/certificate?`$filter=companyId eq $companyId" | Where-Object { $null -ne $_ -and [int](Get-QbrProp $_ 'companyId') -eq $companyId -and -not [bool](Get-QbrProp $_ 'isDeleted') })
              $e = Get-QbrExpiring $rows 'expirationDate' 30 @('name', 'subject', 'url'); $cert.total = $e.total; $cert.items = $e.items
          }
          catch { $cert.available = $false; $cert.reason = "Couldn't read the certificates: $($_.Exception.Message)"; $null = $warnings.Add($cert.reason) }
          $out.domains = $dom
          $out.certificates = $cert
          $out.domainNames = $domainNames
          $out.warnings = @($warnings)
          $out.status = 'ok'
          Set-NodeOutput $out
        timeoutSeconds: 900
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-psa
      name: Read PSA ticket trends
      type: powershell-script
      position:
        x: 740
        'y': 120
      properties:
        script: |
          # === STEP: Read PSA ticket trends ===
          # Edit this file, then run: node automationai/qbr-data-pack/src/build.js
          # Read-only (GET calls only). Counts this client's tickets opened and closed in the last <quarter_days> days and
          # in the same span before it, the tickets open now, and the top 5 categories of the tickets opened this period.
          # Works with ConnectWise PSA, Autotask, HaloPSA, Kaseya BMS, Syncro and Zendesk through _shared/psa.ps1.
          # If no PSA is set up, or the client can't be matched in the PSA, this section says "not available" and the run continues.
          # Every call is filtered to this one client's PSA company id.
          # Secrets: PSA-Type plus that PSA's own secrets (CW-*, Autotask-*, Halo-*, KaseyaBMS-*, Syncro-*, Zendesk-*).
          # >>> _shared/psa.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/psa.ps1: one adapter for six PSAs ----------
          # ConnectWise PSA, Autotask, HaloPSA, Kaseya BMS, Syncro and Zendesk.
          # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
          # The source of each call, and whether it has been checked, is in reference/build-kit/PSA.md.
          # Calls marked "Unverified" below have not been proven by a live run; check them before the first live write.
          # Secrets use the same Key Vault names as each PSA's catalog extension.
          # All state lives in the $PsaState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $PsaState = @{
              Conn       = $null
              Picklists  = @{}
              MaxRetries = 4
              Secrets    = @{
                  connectwise = @('CW-ApiUrl', 'CW-CompanyID', 'CW-PublicKey', 'CW-PrivateKey', 'CW-ClientId')
                  autotask    = @('Autotask-ApiUrl', 'Autotask-ApiIntegrationCode', 'Autotask-Username', 'Autotask-Secret')
                  halopsa     = @('Halo-ApiUrl', 'Halo-ClientId', 'Halo-ClientSecret')
                  kaseyabms   = @('KaseyaBMS-ApiUrl', 'KaseyaBMS-Username', 'KaseyaBMS-Password', 'KaseyaBMS-CompanyName')
                  syncro      = @('Syncro-ApiUrl', 'Syncro-ApiKey')
                  zendesk     = @('Zendesk-BaseUrl', 'Zendesk-Email', 'Zendesk-ApiToken')
              }
              Names      = @{ connectwise = 'ConnectWise'; autotask = 'Autotask'; halopsa = 'HaloPSA'; kaseyabms = 'Kaseya BMS'; syncro = 'Syncro'; zendesk = 'Zendesk' }
              # Used by the note, status and list functions (here and in _shared/psa-tickets.ps1).
              Statuses      = $null                                     # status list cache (Autotask, HaloPSA, Kaseya BMS)
              UrlTemplate   = $null                                     # the PSA-TicketUrlTemplate secret, read once
              FindTruncated = $false                                    # Find-PsaTickets stopped at -Max with more to read
              Warnings      = (New-Object System.Collections.ArrayList) # plain sentences a step can copy into its output
              Lookups       = @{}                                       # Resolve-PsaTicketNames cache
              Sla           = @{}                                       # Get-PsaTicketSla cache (ConnectWise SLA definitions)
              MaxPages      = 50
              ReadBackWaits = @(3, 6)                                   # seconds between read-backs after a redirected note write
              MaxTicketLoop = 50
              # Redirect handling in Invoke-Psa (see "Redirects" in _shared/README.md).
              StopRedirects     = $null                                 # Invoke-RestMethod takes -MaximumRedirection (checked once)
              LastWriteRedirect = $null                                 # the last write answered with a redirect: @{ Method; Path; Code; Location }
              CwInfoHost        = ''                                    # the https host ConnectWise names in its own _info links
          }

          # ---- small helpers (all Psa-prefixed so they don't clash with other shared files) ----
          function Get-PsaSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-PsaProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-PsaPath { param($o, [string]$Path) foreach ($n in $Path -split '\.') { $o = Get-PsaProp $o $n; if ($null -eq $o) { return $null } }; return $o }
          function Test-PsaBlank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -eq '0') }
          function ConvertTo-PsaQuery { param([string]$s) return [uri]::EscapeDataString($s) }
          function Get-PsaText { param([string]$s, [int]$Max) if ($null -eq $s) { return '' }; if ($s.Length -gt $Max) { return $s.Substring(0, $Max) }; return $s }
          function Get-PsaName { if ($null -eq $PsaState.Conn) { return 'the PSA' }; return $PsaState.Names[$PsaState.Conn.Psa] }
          function Get-PsaConn { if ($null -eq $PsaState.Conn) { throw 'Call Connect-Psa before any other PSA function.' }; return $PsaState.Conn }
          # ConnectWise conditions quote strings and leave numbers bare.
          function Get-PsaCwOwner { param([string]$u) if ($u -match '^\d+$') { return "owner/id=$u" }; return "owner/identifier=`"$u`"" }
          function Get-PsaHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-PsaRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          # An API base URL from a secret: trimmed, no trailing slash, and no doubled slashes in the path
          # ("https://host//v4_6_release/apis/3.0/" becomes "https://host/v4_6_release/apis/3.0"). The scheme's "//" stays.
          function ConvertTo-PsaBaseUrl {
              param([string]$Url)
              $u = ([string]$Url).Trim()
              if ($u -match '^(?<s>[A-Za-z][A-Za-z0-9+.-]*://)(?<r>.*)$') { $u = $Matches['s'] + ($Matches['r'] -replace '/{2,}', '/') }
              else { $u = $u -replace '/{2,}', '/' }
              return $u.TrimEnd('/')
          }
          # The items of a list reply. Invoke-Psa hands back a one-item JSON array as just that item, so "-is [array]"
          # can't tell a bare list from an object that holds the list: an object with one of $Names is the holder
          # (the first of them that has items wins).
          function Get-PsaListReply {
              param($Reply, [string[]]$Names)
              if ($null -eq $Reply) { return @() }
              if ($Reply -is [array]) { return @($Reply | Where-Object { $null -ne $_ }) }
              $holder = $false
              foreach ($n in $Names) {
                  $has = if ($Reply -is [System.Collections.IDictionary]) { $Reply.Contains($n) } else { $null -ne $Reply.PSObject.Properties[$n] }
                  if (-not $has) { continue }
                  $holder = $true
                  $items = @(Get-PsaProp $Reply $n | Where-Object { $null -ne $_ })
                  if ($items.Count) { return $items }
              }
              if ($holder) { return @() }
              return @($Reply)
          }
          function Get-PsaErrorText { param($Err) $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }; if (-not $d) { $d = [string]$Err.Exception.Message }; return $d }

          # Normalizes a priority hint to critical, high, medium or low ('' when blank).
          function Get-PsaPriorityHint {
              param([string]$Hint)
              $h = ([string]$Hint).Trim().ToLowerInvariant()
              if (-not $h) { return '' }
              if ($h -match '^(critical|urgent|emergency|p?1)$') { return 'critical' }
              if ($h -match '^(high|p?2)$') { return 'high' }
              if ($h -match '^(medium|normal|moderate|p?3)$') { return 'medium' }
              if ($h -match '^(low|p?4)$') { return 'low' }
              throw "Priority '$Hint' isn't one of: critical, high, medium, low."
          }
          $PsaState.PriorityPatterns = @{
              critical = @('(?i)critical', '(?i)urgent', '(?i)emergency', '(?i)\b(p|priority\s*)1\b')
              high     = @('(?i)high', '(?i)\b(p|priority\s*)2\b')
              medium   = @('(?i)medium', '(?i)normal', '(?i)moderate', '(?i)\b(p|priority\s*)3\b')
              low      = @('(?i)low', '(?i)\b(p|priority\s*)4\b')
          }
          # The first item whose label property matches one of the patterns, in pattern order.
          function Select-PsaByLabel {
              param($Items, [string]$LabelProp, [string[]]$Patterns)
              foreach ($p in $Patterns) {
                  $hit = @($Items | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ $LabelProp) -match $p }) | Select-Object -First 1
                  if ($hit) { return $hit }
              }
              return $null
          }

          # Which PSA: the run's psa input, then the PSA-Type secret, then ConnectWise when its secrets are
          # set (so runners set up before PSA-Type existed keep working). '' means none is configured.
          function Get-PsaType {
              param([string]$Requested)
              $v = $Requested; if ([string]::IsNullOrWhiteSpace($v) -or $v.StartsWith('@')) { $v = Get-PsaSecret 'PSA-Type' }
              if ([string]::IsNullOrWhiteSpace($v)) { if (Get-PsaSecret 'CW-ApiUrl') { return 'connectwise' }; return '' }
              $v = $v.Trim().ToLowerInvariant()
              $alias = @{ 'cw' = 'connectwise'; 'connectwise-manage' = 'connectwise'; 'connectwise psa' = 'connectwise'; 'connectwise manage' = 'connectwise'; 'autotask-psa' = 'autotask'; 'datto autotask' = 'autotask'; 'halo' = 'halopsa'; 'halo-psa' = 'halopsa'; 'kaseya' = 'kaseyabms'; 'kaseya-bms' = 'kaseyabms'; 'kaseya bms' = 'kaseyabms'; 'bms' = 'kaseyabms'; 'syncromsp' = 'syncro'; 'zendesk-ticketing' = 'zendesk' }
              if ($alias.ContainsKey($v)) { $v = $alias[$v] }
              if (-not $PsaState.Secrets.ContainsKey($v)) { throw "PSA '$v' isn't supported. Use one of: $(($PsaState.Secrets.Keys | Sort-Object) -join ', ')." }
              return $v
          }

          # Reads the PSA's secrets, mints a token where the PSA needs one, and keeps the connection in $PsaState.
          # With no -Psa it uses Get-PsaType. Returns @{ Psa; Base; Headers }.
          function Connect-Psa {
              param([string]$Psa)
              if ([string]::IsNullOrWhiteSpace($Psa)) { $Psa = Get-PsaType ''; if (-not $Psa) { throw 'No PSA is set up. Add the PSA-Type secret (connectwise, autotask, halopsa, kaseyabms, syncro or zendesk) to the runner Key Vault.' } }
              $Psa = $Psa.Trim().ToLowerInvariant()
              if (-not $PsaState.Secrets.ContainsKey($Psa)) { $Psa = Get-PsaType $Psa }
              $v = @{}; $missing = @()
              foreach ($n in $PsaState.Secrets[$Psa]) { $v[$n] = Get-PsaSecret $n; if ([string]::IsNullOrWhiteSpace($v[$n])) { $missing += $n } }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $json = 'application/json'
              $c = $null
              switch ($Psa) {
                  'connectwise' {
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['CW-CompanyID'])+$($v['CW-PublicKey']):$($v['CW-PrivateKey'])"))
                      $c = @{ Base = (ConvertTo-PsaBaseUrl $v['CW-ApiUrl']); Headers = @{ Authorization = "Basic $b"; clientId = $v['CW-ClientId']; Accept = $json } }
                  }
                  'autotask' {
                      $c = @{ Base = ((ConvertTo-PsaBaseUrl $v['Autotask-ApiUrl']) -replace '/atservicesrest/v1\.0$', '') + '/atservicesrest/v1.0'
                          Headers = @{ ApiIntegrationCode = $v['Autotask-ApiIntegrationCode']; UserName = $v['Autotask-Username']; Secret = $v['Autotask-Secret']; Accept = $json } }
                  }
                  'halopsa' {
                      $base = (ConvertTo-PsaBaseUrl $v['Halo-ApiUrl']) -replace '/api$', ''
                      $form = "grant_type=client_credentials&client_id=$([uri]::EscapeDataString($v['Halo-ClientId']))&client_secret=$([uri]::EscapeDataString($v['Halo-ClientSecret']))&scope=all"
                      $tok = $null
                      try { $tok = Invoke-RestMethod -Method POST -Uri "$base/auth/token" -Body $form -ContentType 'application/x-www-form-urlencoded' -ErrorAction Stop }
                      catch {
                          # Some instances run a separate auth server; /api/authinfo names it.
                          $info = Invoke-RestMethod -Method GET -Uri "$base/api/authinfo" -ErrorAction Stop
                          $authUrl = [string](Get-PsaProp $info 'auth_url'); if (-not $authUrl) { throw "HaloPSA sign-in failed and /api/authinfo named no auth server: $(Get-PsaErrorText $_)" }
                          $tok = Invoke-RestMethod -Method POST -Uri "$($authUrl.TrimEnd('/'))/token" -Body $form -ContentType 'application/x-www-form-urlencoded' -ErrorAction Stop
                      }
                      $access = Get-PsaProp $tok 'access_token'; if (-not $access) { throw 'HaloPSA sign-in returned no access_token. Check the Halo-* secrets.' }
                      $c = @{ Base = "$base/api"; Headers = @{ Authorization = "Bearer $access"; Accept = $json } }
                  }
                  'kaseyabms' {
                      $base = (ConvertTo-PsaBaseUrl $v['KaseyaBMS-ApiUrl']) -replace '/v2$', ''
                      # Unverified: the GrantType value 'password' (PSA.md).
                      $r = Invoke-RestMethod -Method POST -Uri "$base/v2/security/authenticate" -Form @{ UserName = $v['KaseyaBMS-Username']; Password = $v['KaseyaBMS-Password']; Tenant = $v['KaseyaBMS-CompanyName']; GrantType = 'password' } -ErrorAction Stop
                      $token = Get-PsaPath $r 'Result.AccessToken'; if (-not $token) { $token = Get-PsaPath $r 'result.accessToken' }
                      if (-not $token) { throw 'Kaseya BMS sign-in returned no Result.AccessToken. Check the KaseyaBMS-* secrets.' }
                      $c = @{ Base = "$base/v2"; Headers = @{ Authorization = "Bearer $token"; Accept = $json } }
                  }
                  'syncro' { $c = @{ Base = (ConvertTo-PsaBaseUrl $v['Syncro-ApiUrl']); Headers = @{ Authorization = "Bearer $($v['Syncro-ApiKey'])"; Accept = $json } } }
                  'zendesk' {
                      # Unverified: whether the Zendesk-BaseUrl secret already ends in /api/v2, so it is added when missing.
                      $base = ConvertTo-PsaBaseUrl $v['Zendesk-BaseUrl']; if ($base -notmatch '/api/v2$') { $base += '/api/v2' }
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['Zendesk-Email'])/token:$($v['Zendesk-ApiToken'])"))
                      $c = @{ Base = $base; Headers = @{ Authorization = "Basic $b"; Accept = $json } }
                  }
              }
              $c.Psa = $Psa
              $PsaState.Conn = $c
              $PsaState.Picklists = @{}
              $PsaState.Statuses = $null; $PsaState.UrlTemplate = $null; $PsaState.Lookups = @{}; $PsaState.Sla = @{}
              $PsaState.LastWriteRedirect = $null; $PsaState.CwInfoHost = ''
              return $c
          }

          # ---- redirects (see "Redirects" in _shared/README.md) ----
          # Invoke-Psa asks Invoke-RestMethod not to follow redirects (-MaximumRedirection 0), so a 3xx comes back as an
          # error it can look at. A test mock without that parameter just doesn't get it.
          function Test-PsaStopRedirects {
              if ($null -eq $PsaState.StopRedirects) {
                  $ok = $false; try { $ok = (Get-Command Invoke-RestMethod -ErrorAction Stop).Parameters.ContainsKey('MaximumRedirection') } catch { }
                  $PsaState.StopRedirects = $ok
              }
              return [bool]$PsaState.StopRedirects
          }
          # @{ Code; Location } when the error is a redirect (a 3xx, or Invoke-RestMethod refusing to follow one), else $null.
          function Get-PsaRedirect {
              param($Err, [string]$Uri)
              $code = Get-PsaHttpStatus $Err
              # PowerShell 7 refuses an https-to-http redirect before -MaximumRedirection applies. That error's text is in
              # ErrorDetails (the exception only says "Operation is not valid"), with no status code and no Location.
              $msg = ''; try { $msg = [string]$Err.Exception.Message } catch { }
              try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $msg += ' ' + [string]$Err.ErrorDetails.Message } } catch { }
              try { $msg += ' ' + [string]$Err.FullyQualifiedErrorId } catch { }
              if (-not (($code -ge 300 -and $code -lt 400) -or ($code -eq 0 -and $msg -match '(?i)redirect'))) { return $null }
              $loc = $null
              try { $l = $Err.Exception.Response.Headers.Location; if ($null -ne $l) { $loc = $(if ($l.IsAbsoluteUri) { $l } else { [uri]::new([uri]$Uri, $l) }) } } catch { }
              return @{ Code = $code; Location = $loc }
          }
          # Where a redirect from $From to $To may be followed with the PSA's credentials: the same host, or a sibling
          # under the same parent domain (staging.example.com and api.example.com), and always https (an http address is
          # upgraded, so credentials never go over http). $null when it isn't safe.
          function Get-PsaRedirectTarget {
              param([string]$From, $To)
              if ($null -eq $To) { return $null }
              $f = $null; $t = $null
              try { $f = [uri]$From; $t = [uri]$To } catch { return $null }
              if (-not $t.IsAbsoluteUri -or $t.Scheme -notin @('http', 'https')) { return $null }
              $a = $f.Host.ToLowerInvariant(); $b = $t.Host.ToLowerInvariant()
              if ($a -ne $b) {
                  $ia = $a.IndexOf('.'); $ib = $b.IndexOf('.')
                  if ($ia -lt 1 -or $ib -lt 1) { return $null }
                  $pa = $a.Substring($ia + 1); $pb = $b.Substring($ib + 1)
                  if ($pa -ne $pb -or $pa.IndexOf('.') -lt 1) { return $null }
              }
              $ub = [UriBuilder]::new($t); $ub.Scheme = 'https'
              if ($t.Scheme -eq 'http' -and $t.IsDefaultPort) { $ub.Port = -1 }
              return $ub.Uri.AbsoluteUri
          }
          # Points the connection at $Target's host (https, same API path) for the rest of the run, and says so.
          function Move-PsaBaseHost {
              param([string]$Target)
              $c = Get-PsaConn
              $old = [uri]$c.Base; $new = [uri]$Target
              if ($old.Scheme -eq 'https' -and $old.Authority -ieq $new.Authority) { return }
              $c.Base = "https://$($new.Authority)$($old.AbsolutePath.TrimEnd('/'))"
              Add-PsaWarning "$(Get-PsaName) redirected calls for $($old.Host) to $($new.Host), so the rest of this run used $($c.Base). Set the API URL secret to that address."
          }
          # ConnectWise names its own host in the _info links of its records. When a reply's links name another https
          # host, it is remembered; Invoke-Psa only moves to it if a write is then redirected without a usable Location.
          function Save-PsaCwInfoHost {
              param($Reply)
              if ($PsaState.CwInfoHost) { return }
              try {
                  $first = $Reply
                  if ($Reply -is [array]) { if (-not $Reply.Count) { return }; $first = $Reply[0] }
                  if ($null -eq $first -or $first -is [string] -or $first -is [valuetype]) { return }
                  $infos = @(Get-PsaProp $first '_info')
                  foreach ($p in @($first.PSObject.Properties)) {
                      $v = $p.Value
                      if ($null -ne $v -and $v -isnot [string] -and $v -isnot [valuetype] -and $v -isnot [array]) { $infos += Get-PsaProp $v '_info' }
                  }
                  foreach ($i in @($infos | Where-Object { $null -ne $_ -and $_ -isnot [string] })) {
                      foreach ($p in @($i.PSObject.Properties)) {
                          if ([string]$p.Value -match '^https://([^/?#]+)/[^?#]*/apis/') { $PsaState.CwInfoHost = $Matches[1]; return }
                      }
                  }
              }
              catch { }
          }

          # One call to the connected PSA. Path is relative to the API base (or a full URL).
          # Retries 429 (and 502, 503, 504 on GET) honoring Retry-After; other errors throw a plain message.
          # A JSON array reply comes back as its items (Invoke-RestMethod itself hands it over as ONE [object[]], which
          # "@(...) | Where-Object" would see as a single record), so a one-item list is just that item.
          # Redirects are never followed blindly: a GET follows up to 3 to a safe https address (Get-PsaRedirectTarget);
          # a write (POST, PUT, PATCH, DELETE) is never sent twice. It sets $PsaState.LastWriteRedirect and throws, and
          # the caller checks whether the change was saved (Add-PsaNote reads the ticket back).
          function Invoke-Psa {
              param([string]$Method, [string]$Path, $Body = $null, [string]$ContentType = 'application/json')
              $c = Get-PsaConn
              $isRead = ([string]$Method).ToUpperInvariant() -eq 'GET'
              $uri = if ($Path -match '^https?://') { $Path } else { "$($c.Base)$Path" }
              $hops = 0
              for ($i = 1; $i -le $PsaState.MaxRetries; $i++) {
                  $p = @{ Method = $Method; Uri = $uri; Headers = $c.Headers; ErrorAction = 'Stop' }
                  if (Test-PsaStopRedirects) { $p.MaximumRedirection = 0 }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }); $p.ContentType = $ContentType }
                  $r = $null; $err = $null
                  try { $r = Invoke-RestMethod @p } catch { $err = $_ }
                  if ($null -eq $err) {
                      if ($isRead -and $c.Psa -eq 'connectwise') { Save-PsaCwInfoHost $r }
                      return $r   # returning the variable hands back an array's items, not the array as one object
                  }
                  $rd = Get-PsaRedirect $err $uri
                  if ($null -ne $rd) {
                      $to = Get-PsaRedirectTarget $uri $rd.Location
                      $codeText = $(if ($rd.Code) { " (HTTP $($rd.Code))" } else { '' })
                      if ($isRead) {
                          if ($to -and $hops -lt 3) {
                              $hops++
                              if ($uri.StartsWith($c.Base)) { Move-PsaBaseHost $to }
                              $uri = $to; $i--; continue
                          }
                          $where = $(if ($null -ne $rd.Location) { "to $(([uri]$rd.Location).GetLeftPart([UriPartial]::Authority))" } else { 'elsewhere' })
                          throw "$(Get-PsaName) $Method $Path was redirected$codeText $where, which isn't followed (it must stay https on the same or a sibling host). Set the API URL secret to the address the PSA uses."
                      }
                      # A write may have been saved before the redirect, so it is never sent again here.
                      if (-not $to -and $c.Psa -eq 'connectwise' -and $PsaState.CwInfoHost) { $to = Get-PsaRedirectTarget $uri "https://$($PsaState.CwInfoHost)/" }
                      if ($to -and $uri.StartsWith($c.Base)) { Move-PsaBaseHost $to }
                      $PsaState.LastWriteRedirect = @{ Method = $Method; Path = $Path; Code = $rd.Code; Location = [string]$rd.Location }
                      throw "$(Get-PsaName) $Method $Path was answered with a redirect$codeText instead of a result, so the change may or may not have been saved. It was not sent again. Set the API URL secret to the address the PSA uses."
                  }
                  $code = Get-PsaHttpStatus $err
                  if (($code -eq 429 -or ($isRead -and $code -in @(502, 503, 504))) -and $i -lt $PsaState.MaxRetries) { Start-Sleep -Seconds (Get-PsaRetryAfter $err $i); continue }
                  throw "$(Get-PsaName) $Method $Path failed$(if ($code) { " (HTTP $code)" }): $(Get-PsaErrorText $err)"
              }
          }

          # Autotask picklists are per tenant: match on the label, never a hard-coded number.
          function Get-PsaAtPicklist {
              param([string]$Entity, [string]$Field)
              if (-not $PsaState.Picklists.ContainsKey($Entity)) { $PsaState.Picklists[$Entity] = @(Get-PsaProp (Invoke-Psa GET "/$Entity/entityInformation/fields") 'fields') }
              $f = @($PsaState.Picklists[$Entity] | Where-Object { [string](Get-PsaProp $_ 'name') -eq $Field }) | Select-Object -First 1
              return @(Get-PsaProp $f 'picklistValues' | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'isActive') -ne $false })
          }
          function Select-PsaAtValue {
              param($Values, [string[]]$Patterns)
              $hit = Select-PsaByLabel $Values 'label' $Patterns
              if ($hit) { return (Get-PsaProp $hit 'value') }
              return $null
          }
          function Get-PsaAtCompleteStatuses {
              $v = @(Get-PsaAtPicklist 'Tickets' 'status' | Where-Object { [string](Get-PsaProp $_ 'label') -match '(?i)complete' } | ForEach-Object { [int](Get-PsaProp $_ 'value') })
              if (-not $v.Count) { $v = @(5) }
              return $v
          }

          # Normalized ticket: @{ id; summary; description; companyId; status; assigneeId; assigneeIds; raw }.
          function Get-PsaTicket {
              param([string]$Id)
              $c = Get-PsaConn
              switch ($c.Psa) {
                  'connectwise' {
                      $t = Invoke-Psa GET "/service/tickets/$Id"
                      $desc = ''
                      try { $n = @(Invoke-Psa GET "/service/tickets/$Id/notes?orderBy=$(ConvertTo-PsaQuery 'id asc')&pageSize=1"); if ($n.Count -and $null -ne $n[0]) { $desc = [string](Get-PsaProp $n[0] 'text') } } catch { }
                      $owner = Get-PsaProp $t 'owner'
                      $a = @(@((Get-PsaProp $owner 'identifier'), (Get-PsaProp $owner 'id')) | Where-Object { -not (Test-PsaBlank $_) } | ForEach-Object { [string]$_ })
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'summary'); description = $desc; companyId = [string](Get-PsaPath $t 'company.id'); status = [string](Get-PsaPath $t 'status.name'); assigneeId = $(if ($a.Count) { $a[0] } else { '' }); assigneeIds = $a; raw = $t }
                  }
                  'autotask' {
                      $t = Get-PsaProp (Invoke-Psa GET "/Tickets/$Id") 'item'
                      if ($null -eq $t) { throw "Autotask returned no ticket $Id." }
                      $a = Get-PsaProp $t 'assignedResourceID'
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'title'); description = [string](Get-PsaProp $t 'description'); companyId = [string](Get-PsaProp $t 'companyID'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'halopsa' {
                      $t = Invoke-Psa GET "/Tickets/$($Id)?includedetails=true"
                      $a = Get-PsaProp $t 'agent_id'
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'summary'); description = [string](Get-PsaProp $t 'details'); companyId = [string](Get-PsaProp $t 'client_id'); status = [string](Get-PsaProp $t 'status_id'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'kaseyabms' {
                      $t = Get-PsaProp (Invoke-Psa GET "/servicedesk/tickets/$Id") 'Result'
                      if ($null -eq $t) { throw "Kaseya BMS returned no ticket $Id." }
                      $a = Get-PsaProp $t 'AssigneeId'
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'Title'); description = [string](Get-PsaProp $t 'Details'); companyId = [string](Get-PsaProp $t 'AccountId'); status = [string](Get-PsaProp $t 'StatusName'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'syncro' {
                      $t = Get-PsaProp (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Syncro returned no ticket $Id." }
                      $cm = @(Get-PsaProp $t 'comments' | Where-Object { $null -ne $_ })
                      $desc = if ($cm.Count) { [string](Get-PsaProp $cm[0] 'body') } else { '' }
                      $pt = [string](Get-PsaProp $t 'problem_type'); if ($pt) { $desc = "Issue type: $pt`n$desc" }
                      $a = Get-PsaProp $t 'user_id'
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'subject'); description = $desc; companyId = [string](Get-PsaProp $t 'customer_id'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'zendesk' {
                      $t = Get-PsaProp (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Zendesk returned no ticket $Id." }
                      $a = Get-PsaProp $t 'assignee_id'
                      return @{ id = $Id; summary = [string](Get-PsaProp $t 'subject'); description = [string](Get-PsaProp $t 'description'); companyId = [string](Get-PsaProp $t 'organization_id'); status = [string](Get-PsaProp $t 'status'); assigneeId = $(if (Test-PsaBlank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
              }
          }

          # Creates a ticket and returns @{ id; raw }.
          #   -CompanyId  the PSA's own company id (Find-PsaCompany resolves a name to it)
          #   -Priority   a hint: critical, high, medium or low. It is matched to the tenant's priority list where the PSA has one.
          #   -Queue      optional board (ConnectWise), queue (Autotask, Kaseya BMS), team (HaloPSA), issue type (Syncro) or group id (Zendesk)
          #   -Extra      optional hashtable of raw PSA fields merged into the body, for tenant-specific required ids
          function New-PsaTicket {
              param([string]$CompanyId, [string]$Summary, [string]$Description = '', [string]$Priority = '', [string]$Queue = '', [hashtable]$Extra = @{})
              $c = Get-PsaConn
              if ([string]::IsNullOrWhiteSpace($CompanyId)) { throw 'New-PsaTicket needs a company id. Use Find-PsaCompany to look one up by name.' }
              if ([string]::IsNullOrWhiteSpace($Summary)) { throw 'New-PsaTicket needs a summary.' }
              $hint = Get-PsaPriorityHint $Priority
              $pats = @(); if ($hint) { $pats = $PsaState.PriorityPatterns[$hint] }
              $isNum = $Queue -match '^\d+$'
              $id = $null; $raw = $null
              switch ($c.Psa) {
                  'connectwise' {
                      # Unverified: not in PSA.md yet. Body and /service/priorities lookup from the CW swagger clients.
                      $b = [ordered]@{ summary = (Get-PsaText $Summary 100); company = @{ id = [int]$CompanyId }; initialDescription = $Description }
                      if ($Queue) { $b.board = $(if ($isNum) { @{ id = [int]$Queue } } else { @{ name = $Queue } }) }
                      # An API member whose security role can't read priorities (403) still gets the ticket, at the board's
                      # default priority, with a warning; a priority is a nice-to-have, a ticket that never opens is not.
                      if ($hint) {
                          $list = $null
                          try { $list = @(Invoke-Psa GET '/service/priorities?pageSize=100') }
                          catch { Add-PsaWarning "ConnectWise wouldn't list ticket priorities, so the new ticket uses the board's default priority instead of $hint. Give the API member's security role Inquire access to Service Desk priorities to fix this. ($($_.Exception.Message))" }
                          if ($null -ne $list) { $pr = Select-PsaByLabel $list 'name' $pats; if ($pr) { $b.priority = @{ id = [int](Get-PsaProp $pr 'id') } } }
                      }
                      foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/service/tickets' $b
                      $id = Get-PsaProp $raw 'id'
                  }
                  'autotask' {
                      # From the at_create_ticket extension descriptor: title, companyID, status, priority and dueDateTime are required.
                      $status = Get-PsaSecret 'Autotask-NewStatusId'
                      if (-not $status) { $status = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'status') @('^New$', '(?i)^new') }
                      if (-not $status) { $status = 1 }
                      $prio = $null
                      if ($hint) { $prio = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'priority') $pats }
                      if ($null -eq $prio) { $def = @(Get-PsaAtPicklist 'Tickets' 'priority' | Where-Object { (Get-PsaProp $_ 'isDefaultValue') -eq $true }) | Select-Object -First 1; if ($def) { $prio = Get-PsaProp $def 'value' } }
                      if ($null -eq $prio) { $prio = Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'priority') $PsaState.PriorityPatterns['medium'] }
                      if ($null -eq $prio) { throw 'Could not find an Autotask ticket priority. Pass -Priority, or -Extra @{ priority = <id> }.' }
                      $due = (Get-Date).ToUniversalTime().AddDays($(switch ($hint) { 'critical' { 0.25 } 'high' { 1 } 'low' { 7 } default { 3 } }))
                      $b = [ordered]@{ companyID = [long]$CompanyId; title = (Get-PsaText $Summary 255); description = (Get-PsaText $Description 8000); status = [int]$status; priority = [int]$prio; dueDateTime = $due.ToString('yyyy-MM-ddTHH:mm:ssZ') }
                      if ($Queue) {
                          $qv = if ($isNum) { $Queue } else { Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'queueID') @("^$([regex]::Escape($Queue))$") }
                          if ($null -eq $qv) { throw "Autotask has no ticket queue named '$Queue'." }
                          $b.queueID = [int]$qv
                      }
                      $bc = Get-PsaSecret 'Autotask-BillingCodeId'; if ($bc) { $b.billingCodeID = [long]$bc }
                      foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/Tickets' $b
                      $id = Get-PsaProp $raw 'itemId'
                  }
                  'halopsa' {
                      # Unverified: not in PSA.md yet. Halo priority ids are per tenant; 1 to 4 are the out-of-box Critical to Low.
                      $b = [ordered]@{ summary = $Summary; details = $Description; client_id = [long]$CompanyId }
                      if ($hint) { $b.priority_id = @{ critical = 1; high = 2; medium = 3; low = 4 }[$hint] }
                      if ($Queue) { if ($isNum) { $b.team_id = [long]$Queue } else { $b.team = $Queue } }
                      foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/Tickets' @($b)
                      $first = @($raw)[0]
                      $id = Get-PsaProp $first 'id'
                  }
                  'kaseyabms' {
                      # Unverified: not in PSA.md yet. BMS needs tenant ids for status, type, source and priority; they come from
                      # the optional KaseyaBMS-NewStatusId, -TicketTypeId, -TicketSourceId, -PriorityId and -QueueId secrets, or -Extra.
                      $b = [ordered]@{ Title = $Summary; Details = $Description; AccountId = [long]$CompanyId; OpenDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }
                      foreach ($pair in @(@('StatusId', 'KaseyaBMS-NewStatusId'), @('TypeId', 'KaseyaBMS-TicketTypeId'), @('SourceId', 'KaseyaBMS-TicketSourceId'), @('PriorityId', 'KaseyaBMS-PriorityId'), @('QueueId', 'KaseyaBMS-QueueId'))) {
                          $sv = Get-PsaSecret $pair[1]; if ($sv -and $sv -match '^\d+$') { $b[$pair[0]] = [int]$sv }
                      }
                      if ($Queue) { if (-not $isNum) { throw 'Kaseya BMS needs a numeric queue id for -Queue.' }; $b.QueueId = [int]$Queue }
                      foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/servicedesk/tickets' $b
                      $id = Get-PsaPath $raw 'Result.Id'; if ($null -eq $id) { $id = Get-PsaProp $raw 'Result' }
                  }
                  'syncro' {
                      # Unverified: not in PSA.md yet. Syncro takes the description as the first comment, and priority as a label.
                      $b = [ordered]@{ customer_id = [long]$CompanyId; subject = $Summary; status = 'New'; comments_attributes = @(@{ subject = 'Initial Issue'; body = $(if ($Description) { $Description } else { $Summary }); hidden = $false; do_not_email = $true }) }
                      if ($hint) { $b.priority = @{ critical = '0 Urgent'; high = '1 High'; medium = '2 Normal'; low = '3 Low' }[$hint] }
                      if ($Queue) { $b.problem_type = $Queue }
                      foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/tickets' $b
                      $id = Get-PsaPath $raw 'ticket.id'
                  }
                  'zendesk' {
                      # Unverified: not in PSA.md yet. Zendesk priorities are fixed: urgent, high, normal, low.
                      $t = [ordered]@{ subject = $Summary; comment = @{ body = $(if ($Description) { $Description } else { $Summary }) }; organization_id = [long]$CompanyId }
                      if ($hint) { $t.priority = @{ critical = 'urgent'; high = 'high'; medium = 'normal'; low = 'low' }[$hint] }
                      if ($Queue) { if (-not $isNum) { throw 'Zendesk needs a numeric group id for -Queue.' }; $t.group_id = [long]$Queue }
                      foreach ($k in $Extra.Keys) { $t[$k] = $Extra[$k] }
                      $raw = Invoke-Psa POST '/tickets' @{ ticket = $t }
                      $id = Get-PsaPath $raw 'ticket.id'
                  }
              }
              if (Test-PsaBlank $id) { throw "$(Get-PsaName) accepted the new ticket but returned no id." }
              return @{ id = [string]$id; raw = $raw }
          }

          # Adds a note. Internal (technician-only) by default; -Public makes it visible to the client.
          # Throws when the PSA rejects it.
          # -Marker makes the write safe to repeat (a ServiceAI Action Runs "Retry" replays the whole request):
          # when a note on the ticket already holds the marker nothing is written. An internal note gets "[marker]"
          # as its last line. A public (client-visible) note never shows the marker: its last line is only the
          # opaque "Ref: xxxxxxxx" (Get-PsaMarkerRef), and a "[marker]" the caller put in -Text is taken out.
          # With -Marker it returns 'written' or 'already-present'; without it, nothing (so existing callers that
          # don't discard the result are unchanged). If the notes can't be read, it throws rather than risk a
          # second copy. Never put personal data (names, UPNs, email addresses) or internal tags in a marker.
          function Add-PsaNote {
              param([string]$Id, [string]$Text, [string]$Title = 'Note', [switch]$Public, [switch]$Internal, [string]$Marker = '')
              $c = Get-PsaConn
              $tag = ''
              $pub = [bool]$Public
              if ($Marker) {
                  $tag = Get-PsaMarkerTag $Marker
                  if (Test-PsaNoteMarker -Id $Id -Marker $tag) { return 'already-present' }
                  if ($pub) {
                      $ref = Get-PsaMarkerRef $tag
                      $Text = ([string]$Text) -replace [regex]::Escape($tag), ''
                      if (-not (Test-PsaMarkerRefIn $Text $ref)) { $Text = "$($Text.TrimEnd())`n$ref" }
                  }
                  elseif ($Text.IndexOf($tag, [StringComparison]::OrdinalIgnoreCase) -lt 0) { $Text = "$($Text.TrimEnd())`n$tag" }
              }
              # A write answered with a redirect may still have been saved (ConnectWise did exactly that), so the note is
              # never sent twice: the ticket is read back, and only a note that isn't there is reported as a failure.
              $PsaState.LastWriteRedirect = $null
              try { Send-PsaNote -Id $Id -Text $Text -Title $Title -Pub $pub }
              catch {
                  if ($null -eq $PsaState.LastWriteRedirect) { throw }
                  $first = [string]$_.Exception.Message
                  # ConnectWise staging saved the note but didn't list it on a read made straight after the redirect,
                  # so the read-back is tried again after short waits before the note is reported as not saved.
                  $found = $false
                  $waits = @(0) + @($PsaState.ReadBackWaits | Where-Object { $null -ne $_ })
                  $tries = 0
                  foreach ($wait in $waits) {
                      if ($wait -gt 0) { Start-Sleep -Seconds $wait }
                      $tries++
                      try { $found = Test-PsaNoteSaved -Id $Id -Text $Text -Tag $tag }
                      catch { throw "$first Reading ticket $Id back to check also failed: $($_.Exception.Message)" }
                      if ($found) { break }
                  }
                  if (-not $found) { throw "$first Reading ticket $Id back ($tries times over $(($waits | Measure-Object -Sum).Sum) seconds) found no such note, so it was not saved." }
                  Add-PsaWarning "$(Get-PsaName) answered the note on ticket $Id with a redirect; reading the ticket back showed the note was saved, so it was not sent again."
              }
              if ($tag) { return 'written' }
          }
          # $true when the note just sent is on the ticket: by its marker (or a public note's Ref line) when it has one,
          # otherwise by its text (case, spaces and line breaks ignored).
          function Test-PsaNoteSaved {
              param([string]$Id, [string]$Text, [string]$Tag = '')
              $notes = @(Get-PsaTicketNotes -Id $Id -TextOnly)
              if ($Tag) { return (Test-PsaNoteMarker -Id $Id -Marker $Tag -Notes $notes) }
              $want = ((ConvertTo-PsaPlainText $Text) -replace '\s+', ' ').Trim()
              if (-not $want) { return $false }
              foreach ($n in $notes) {
                  $have = ((ConvertTo-PsaPlainText ([string]$n.text)) -replace '\s+', ' ').Trim()
                  if ($have.IndexOf($want, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
              }
              return $false
          }
          # The PSA call behind Add-PsaNote (no marker check, no read-back).
          function Send-PsaNote {
              param([string]$Id, [string]$Text, [string]$Title, [bool]$Pub)
              $c = Get-PsaConn
              switch ($c.Psa) {
                  'connectwise' {
                      # Public notes go on the Discussion tab (detailDescriptionFlag). Unverified for public notes; internal is [ext].
                      $null = Invoke-Psa POST "/service/tickets/$Id/notes" @{ text = $Text; internalAnalysisFlag = (-not $pub); detailDescriptionFlag = $pub; resolutionFlag = $false }
                  }
                  'autotask' {
                      $pv = $null
                      if ($pub) {
                          # Unverified: which publish label makes a note client-visible. Tries "All Autotask Users" style labels.
                          $pv = Get-PsaSecret 'Autotask-NotePublicPublishId'
                          if (-not $pv) { $pv = Select-PsaAtValue (Get-PsaAtPicklist 'TicketNotes' 'publish') @('(?i)^All Autotask Users$', '(?i)^All', '(?i)public') }
                      }
                      else {
                          $pv = Get-PsaSecret 'Autotask-NotePublishId'
                          if (-not $pv) { $pv = Select-PsaAtValue (Get-PsaAtPicklist 'TicketNotes' 'publish') @('^Internal Only$', 'Internal') }
                      }
                      $type = Get-PsaSecret 'Autotask-NoteTypeId'
                      if (-not $type) { $vals = @(Get-PsaAtPicklist 'TicketNotes' 'noteType' | Where-Object { [string](Get-PsaProp $_ 'value') -ne '13' -and [string](Get-PsaProp $_ 'label') -notmatch 'Workflow' }); $type = Select-PsaAtValue $vals @('Internal', 'Task Detail', 'Detail', '.') }
                      if ($null -eq $pv -or $null -eq $type) { throw 'Could not find the Autotask note publish and type values. Set the Autotask-NotePublishId and Autotask-NoteTypeId secrets.' }
                      $null = Invoke-Psa POST "/Tickets/$Id/Notes" @{ ticketID = [long]$Id; title = $Title; description = $Text; noteType = [int]$type; publish = [int]$pv }
                  }
                  'halopsa' {
                      # Unverified: outcome ids are per tenant; 7 is the built-in Private Note. Halo-NoteOutcomeId overrides it.
                      $outcome = Get-PsaSecret $(if ($pub) { 'Halo-PublicNoteOutcomeId' } else { 'Halo-NoteOutcomeId' })
                      if (-not $outcome) { $outcome = Get-PsaSecret 'Halo-NoteOutcomeId' }
                      if (-not $outcome) { $outcome = 7 }
                      $null = Invoke-Psa POST '/Actions' @(@{ ticket_id = [long]$Id; note = $Text; hiddenfromuser = (-not $pub); outcome_id = [int]$outcome })
                  }
                  'kaseyabms' {
                      # Unverified: how to list note types, so the KaseyaBMS-NoteTypeId secret supplies one.
                      $type = Get-PsaSecret 'KaseyaBMS-NoteTypeId'
                      if (-not $type) { throw 'Kaseya BMS notes need a note type id. Set the KaseyaBMS-NoteTypeId secret.' }
                      $null = Invoke-Psa POST "/servicedesk/tickets/$Id/notes" @{ Details = $Text; IsInternal = (-not $pub); NoteDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); TypeId = [int]$type }
                  }
                  'syncro' { $null = Invoke-Psa POST "/tickets/$Id/comment" @{ subject = $Title; body = $Text; hidden = (-not $pub); do_not_email = (-not $pub) } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ comment = @{ body = $Text; public = $pub } } } }
              }
          }

          # Assigns the ticket. Autotask also needs the resource's role id.
          function Set-PsaAssignee {
              param([string]$Id, [string]$UserId, [string]$RoleId = '')
              $c = Get-PsaConn
              switch ($c.Psa) {
                  'connectwise' {
                      $val = if ($UserId -match '^\d+$') { @{ id = [int]$UserId } } else { @{ identifier = $UserId } }
                      $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'owner'; value = $val })
                  }
                  'autotask' {
                      if (-not $RoleId) { throw 'Autotask needs the resource role id as well as the resource id.' }
                      $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; assignedResourceID = [long]$UserId; assignedResourceRoleID = [long]$RoleId })
                  }
                  'halopsa' { $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; agent_id = [long]$UserId }) }
                  'kaseyabms' { $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/AssigneeId'; value = [long]$UserId }) }
                  'syncro' { $null = Invoke-Psa PUT "/tickets/$Id" @{ user_id = [long]$UserId } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ assignee_id = [long]$UserId } } }
              }
          }

          # Closes or reopens a ticket. -StatusName picks an exact status (a name, or an id for HaloPSA and Kaseya BMS).
          # Returns the status that was set.
          function Set-PsaStatus {
              param([string]$Id, [ValidateSet('closed', 'open')][string]$State = 'closed', [string]$StatusName = '')
              $c = Get-PsaConn
              $closed = $State -eq 'closed'
              switch ($c.Psa) {
                  'connectwise' {
                      # Unverified: not in PSA.md yet. Statuses belong to the ticket's board; closedStatus and defaultFlag pick one.
                      $t = Invoke-Psa GET "/service/tickets/$Id"
                      $boardId = Get-PsaPath $t 'board.id'
                      if (Test-PsaBlank $boardId) { throw "ConnectWise ticket $Id has no board, so its statuses can't be read." }
                      $all = @(Invoke-Psa GET "/service/boards/$boardId/statuses?pageSize=200" | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'inactive') -ne $true })
                      $st = $null
                      if ($StatusName) { $st = @($all | Where-Object { [string](Get-PsaProp $_ 'name') -eq $StatusName }) | Select-Object -First 1 }
                      elseif ($closed) { $cl = @($all | Where-Object { (Get-PsaProp $_ 'closedStatus') -eq $true }); $st = Select-PsaByLabel $cl 'name' @('(?i)resolved', '(?i)closed', '(?i)complete', '.') }
                      else { $op = @($all | Where-Object { (Get-PsaProp $_ 'closedStatus') -ne $true }); $st = @($op | Where-Object { (Get-PsaProp $_ 'defaultFlag') -eq $true }) | Select-Object -First 1; if (-not $st) { $st = Select-PsaByLabel $op 'name' @('(?i)^new', '(?i)open', '.') } }
                      if (-not $st) { throw "No $(if ($StatusName) { "'$StatusName'" } else { $State }) status on ConnectWise board $boardId." }
                      $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'status'; value = @{ id = [int](Get-PsaProp $st 'id') } })
                      return [string](Get-PsaProp $st 'name')
                  }
                  'autotask' {
                      # Unverified: not in PSA.md yet. Uses the status picklist (Complete = 5 and New = 1 by default) and at_update_ticket's PATCH.
                      $vals = Get-PsaAtPicklist 'Tickets' 'status'
                      $pats = if ($StatusName) { @("^$([regex]::Escape($StatusName))$") } elseif ($closed) { @('(?i)^complete$', '(?i)complete') } else { @('(?i)^new$', '(?i)in progress') }
                      $hit = Select-PsaByLabel $vals 'label' $pats
                      $sv = if ($hit) { Get-PsaProp $hit 'value' } elseif ($StatusName) { $null } elseif ($closed) { 5 } else { 1 }
                      if ($null -eq $sv) { throw "Autotask has no ticket status named '$StatusName'." }
                      $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; status = [int]$sv })
                      return $(if ($hit) { [string](Get-PsaProp $hit 'label') } else { [string]$sv })
                  }
                  'halopsa' {
                      # Unverified: not in PSA.md yet. 9 (Closed) and 1 (New) are Halo's out-of-box ids; Halo-ClosedStatusId and Halo-OpenStatusId override them.
                      $sv = if ($StatusName) { $StatusName } elseif ($closed) { Get-PsaSecret 'Halo-ClosedStatusId' } else { Get-PsaSecret 'Halo-OpenStatusId' }
                      if (-not $sv) { $sv = $(if ($closed) { 9 } else { 1 }) }
                      if ([string]$sv -notmatch '^\d+$') { throw 'HaloPSA needs a numeric status id.' }
                      $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; status_id = [int]$sv })
                      return [string]$sv
                  }
                  'kaseyabms' {
                      # Unverified: not in PSA.md yet. Status ids are per tenant: KaseyaBMS-ClosedStatusId and KaseyaBMS-OpenStatusId.
                      $sv = if ($StatusName) { $StatusName } elseif ($closed) { Get-PsaSecret 'KaseyaBMS-ClosedStatusId' } else { Get-PsaSecret 'KaseyaBMS-OpenStatusId' }
                      if (-not $sv -or [string]$sv -notmatch '^\d+$') { throw "Kaseya BMS needs a status id. Set the KaseyaBMS-$(if ($closed) { 'Closed' } else { 'Open' })StatusId secret." }
                      $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/StatusId'; value = [int]$sv })
                      return [string]$sv
                  }
                  'syncro' {
                      # Unverified: not in PSA.md yet. Resolved and New are Syncro's default status labels.
                      $sv = if ($StatusName) { $StatusName } elseif ($closed) { 'Resolved' } else { 'New' }
                      $null = Invoke-Psa PUT "/tickets/$Id" @{ status = $sv }
                      return $sv
                  }
                  'zendesk' {
                      # The API can't set closed directly; solved closes on Zendesk's own schedule.
                      $sv = if ($StatusName) { $StatusName.ToLowerInvariant() } elseif ($closed) { 'solved' } else { 'open' }
                      $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ status = $sv } }
                      return $sv
                  }
              }
          }

          # Looks a company up by name. Returns @(@{ id; name; exact; raw }) with exact (case-insensitive) matches first.
          function Find-PsaCompany {
              param([string]$Name)
              $c = Get-PsaConn
              $n = ([string]$Name).Trim()
              if (-not $n) { throw 'Find-PsaCompany needs a name.' }
              $rows = @(); $idProp = 'id'; $nameProp = 'name'
              switch ($c.Psa) {
                  'connectwise' {
                      # Unverified: not in PSA.md yet. Uses the documented conditions syntax (strings in double quotes).
                      $q = $n.Replace('\', '\\').Replace('"', '\"')
                      # Build each condition first: an escaped quote inside a string inside $(...) ends the outer string.
                      $exactCond = ConvertTo-PsaQuery ('name="' + $q + '" and deletedFlag=false')
                      $rows = @(Invoke-Psa GET "/company/companies?conditions=$exactCond&pageSize=25")
                      if (-not @($rows | Where-Object { $null -ne $_ }).Count) {
                          $likeCond = ConvertTo-PsaQuery ('name contains "' + $q + '" and deletedFlag=false')
                          $rows = @(Invoke-Psa GET "/company/companies?conditions=$likeCond&pageSize=25")
                      }
                  }
                  'autotask' {
                      # From the at_query_companies extension descriptor.
                      $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'companyName'; value = $n }) }
                      $rows = @(Get-PsaProp (Invoke-Psa GET "/Companies/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 5 -Compress))") 'items')
                      if (-not @($rows | Where-Object { $null -ne $_ }).Count) {
                          $s = @{ filter = @([ordered]@{ op = 'contains'; field = 'companyName'; value = $n }) }
                          $rows = @(Get-PsaProp (Invoke-Psa GET "/Companies/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 5 -Compress))") 'items')
                      }
                      $nameProp = 'companyName'
                  }
                  'halopsa' {
                      # Unverified: not in PSA.md yet. GET /api/Client?search= (halo_query_clients) returns { clients: [...] }.
                      $r = Invoke-Psa GET "/Client?search=$(ConvertTo-PsaQuery $n)&count=50"
                      $rows = @(Get-PsaListReply $r @('clients'))
                  }
                  'kaseyabms' {
                      # Unverified: not in PSA.md yet. The account list filter name is a guess; results are filtered here as well.
                      $r = Invoke-Psa GET "/crm/accounts?Filter.Name=$(ConvertTo-PsaQuery $n)"
                      $rows = @(Get-PsaProp $r 'Result'); $idProp = 'Id'; $nameProp = 'Name'
                      if (@($rows | Where-Object { $null -ne $_ -and $null -eq (Get-PsaProp $_ 'Name') -and $null -ne (Get-PsaProp $_ 'AccountName') }).Count) { $nameProp = 'AccountName' }
                      $rows = @($rows | Where-Object { $null -ne $_ -and ([string](Get-PsaProp $_ $nameProp)).IndexOf($n, [StringComparison]::OrdinalIgnoreCase) -ge 0 })
                  }
                  'syncro' {
                      # Unverified: not in PSA.md yet. GET /customers?query= returns { customers: [...] } with business_name.
                      $rows = @(Get-PsaProp (Invoke-Psa GET "/customers?query=$(ConvertTo-PsaQuery $n)") 'customers'); $nameProp = 'business_name'
                  }
                  'zendesk' {
                      # Unverified: not in PSA.md yet. Organization autocomplete matches names that start with the text.
                      $rows = @(Get-PsaProp (Invoke-Psa GET "/organizations/autocomplete?name=$(ConvertTo-PsaQuery $n)") 'organizations')
                  }
              }
              $out = @(foreach ($r in @($rows | Where-Object { $null -ne $_ })) {
                      $nm = [string](Get-PsaProp $r $nameProp)
                      if (-not $nm -and $c.Psa -eq 'syncro') { $nm = [string](Get-PsaProp $r 'fullname') }
                      @{ id = [string](Get-PsaProp $r $idProp); name = $nm; exact = ($nm.Trim() -ieq $n); raw = $r }
                  })
              return @(@($out | Where-Object { $_.exact }) + @($out | Where-Object { -not $_.exact }))
          }

          # How many open tickets the technician has: an int, or $null when this PSA can't count.
          function Get-PsaOpenCount {
              param([string]$UserId)
              $c = Get-PsaConn
              switch ($c.Psa) {
                  'connectwise' { return [int](Get-PsaProp (Invoke-Psa GET "/service/tickets/count?conditions=$(ConvertTo-PsaQuery "$(Get-PsaCwOwner $UserId) and closedFlag=false")") 'count') }
                  'autotask' {
                      # Unverified: the queryCount field name (PSA.md).
                      $f = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }) + @(Get-PsaAtCompleteStatuses | ForEach-Object { [ordered]@{ op = 'noteq'; field = 'status'; value = $_ } })
                      $r = Invoke-Psa GET "/Tickets/query/count?search=$(ConvertTo-PsaQuery (@{ filter = $f } | ConvertTo-Json -Depth 6 -Compress))"
                      $n = Get-PsaProp $r 'queryCount'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'halopsa' { $n = Get-PsaProp (Invoke-Psa GET "/Tickets?agent_id=$UserId&open_only=true&pageinate=true&page_size=1&page_no=1") 'record_count'; if ($null -eq $n) { return $null }; return [int]$n }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $r = Invoke-Psa GET "/tickets?user_id=$UserId&status=$(ConvertTo-PsaQuery 'Not Closed')&page=1"
                      $te = Get-PsaPath $r 'meta.total_entries'; if ($null -ne $te) { return [int]$te }
                      $n = @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ }).Count; $pages = [int](Get-PsaPath $r 'meta.total_pages')
                      for ($p = 2; $p -le [Math]::Min($pages, 10); $p++) { $n += @(Get-PsaProp (Invoke-Psa GET "/tickets?user_id=$UserId&status=$(ConvertTo-PsaQuery 'Not Closed')&page=$p") 'tickets' | Where-Object { $null -ne $_ }).Count }
                      if ($pages -gt 10) { return $null }
                      return $n
                  }
                  'zendesk' { return [int](Get-PsaProp (Invoke-Psa GET "/search/count?query=$(ConvertTo-PsaQuery "type:ticket assignee:$UserId status<solved")") 'count') }
              }
          }

          # The newest ticket currently assigned to the technician: a date, [datetime]::MinValue
          # when they have none, or $null when this PSA can't tell.
          function Get-PsaLastAssigned {
              param([string]$UserId)
              $c = Get-PsaConn
              $none = [datetime]::MinValue
              $date = { param($v) if (Test-PsaBlank $v) { $none } else { [datetime]::Parse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal) } }
              switch ($c.Psa) {
                  'connectwise' { $r = @(Invoke-Psa GET "/service/tickets?conditions=$(ConvertTo-PsaQuery (Get-PsaCwOwner $UserId))&orderBy=$(ConvertTo-PsaQuery 'dateEntered desc')&pageSize=1&fields=id,dateEntered" | Where-Object { $null -ne $_ }); if (-not $r.Count) { return $none }; return (& $date (Get-PsaProp $r[0] 'dateEntered')) }
                  'autotask' {
                      # The query API can't sort, so take the highest id from the last 90 days.
                      $since = (Get-Date).ToUniversalTime().AddDays(-90).ToString('yyyy-MM-ddTHH:mm:ssZ')
                      $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }, [ordered]@{ op = 'gt'; field = 'createDate'; value = $since }); IncludeFields = @('id', 'createDate'); MaxRecords = 500 }
                      $r = Invoke-Psa GET "/Tickets/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 6 -Compress))"
                      $top = @(Get-PsaProp $r 'items' | Where-Object { $null -ne $_ } | Sort-Object { [long](Get-PsaProp $_ 'id') } -Descending) | Select-Object -First 1
                      if (-not $top) { return $none }; return (& $date (Get-PsaProp $top 'createDate'))
                  }
                  'halopsa' { $t = @(Get-PsaProp (Invoke-Psa GET "/Tickets?agent_id=$UserId&order=dateoccurred&orderdesc=true&pageinate=true&page_size=1&page_no=1") 'tickets' | Where-Object { $null -ne $_ }); if (-not $t.Count) { return $none }; return (& $date (Get-PsaProp $t[0] 'dateoccurred')) }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $latest = $none
                      for ($p = 1; $p -le 10; $p++) {
                          $r = Invoke-Psa GET "/tickets?user_id=$UserId&page=$p"
                          foreach ($t in @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ })) { $d = & $date (Get-PsaProp $t 'created_at'); if ($d -gt $latest) { $latest = $d } }
                          if ($p -ge [int](Get-PsaPath $r 'meta.total_pages')) { break }
                      }
                      return $latest
                  }
                  'zendesk' { $t = @(Get-PsaProp (Invoke-Psa GET "/search?query=$(ConvertTo-PsaQuery "type:ticket assignee:$UserId")&sort_by=created_at&sort_order=desc&per_page=1") 'results' | Where-Object { $null -ne $_ }); if (-not $t.Count) { return $none }; return (& $date (Get-PsaProp $t[0] 'created_at')) }
              }
          }
          # ======== Notes, statuses, links and single-ticket changes ========
          # Merged from the service-desk builds' src/psa-extra.ps1 files (October 2026). Lists of tickets, time,
          # contracts, invoices, contacts and SLA targets are in _shared/psa-tickets.ps1, pasted after this file.

          # A UTC [datetime], or $null for blank, '0', unparseable or placeholder dates (HaloPSA writes 1900-01-01 for none).
          function ConvertTo-PsaDate {
              param($Value)
              if ($null -eq $Value) { return $null }
              $d = [datetime]::MinValue
              if ($Value -is [datetime]) { $d = $Value }
              elseif ($Value -is [datetimeoffset]) { $d = $Value.UtcDateTime }
              else {
                  $s = ([string]$Value).Trim()
                  if (-not $s -or $s -eq '0') { return $null }
                  $styles = [Globalization.DateTimeStyles]::AssumeUniversal -bor [Globalization.DateTimeStyles]::AdjustToUniversal
                  if (-not [datetime]::TryParse($s, [Globalization.CultureInfo]::InvariantCulture, $styles, [ref]$d)) { return $null }
              }
              if ($d.Kind -eq [DateTimeKind]::Local) { $d = $d.ToUniversalTime() }
              elseif ($d.Kind -eq [DateTimeKind]::Unspecified) { $d = [datetime]::SpecifyKind($d, [DateTimeKind]::Utc) }
              if ($d.Year -lt 1971) { return $null }
              return $d
          }
          # yyyy-MM-ddTHH:mm:ssZ, or '' for no date.
          function Format-PsaDate { param($Value) $d = ConvertTo-PsaDate $Value; if ($null -eq $d) { return '' }; return $d.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture) }
          # Plain text from a note body that may be HTML.
          function ConvertTo-PsaPlainText {
              param([string]$Text)
              if ([string]::IsNullOrEmpty($Text)) { return '' }
              $t = $Text -replace '(?i)<br\s*/?>', "`n" -replace '(?i)</p>', "`n" -replace '<[^>]+>', ''
              $t = [System.Net.WebUtility]::HtmlDecode($t)
              return ($t -replace "(`r?`n){3,}", "`n`n").Trim()
          }
          # The first non-blank property of $o among $Names (dotted paths work).
          function Get-PsaFirst { param($o, [string[]]$Names) foreach ($n in $Names) { $v = Get-PsaPath $o $n; if (-not (Test-PsaBlank $v)) { return $v } }; return $null }
          function Get-PsaNumber { param($v) if (Test-PsaBlank $v) { return 0.0 }; $n = 0.0; if ([double]::TryParse([string]$v, [Globalization.NumberStyles]::Float, [Globalization.CultureInfo]::InvariantCulture, [ref]$n)) { return $n }; return 0.0 }
          function Add-PsaWarning { param([string]$Text) if ($Text -and -not $PsaState.Warnings.Contains($Text)) { $null = $PsaState.Warnings.Add($Text) } }
          # critical, high, medium or low for a PSA priority label ('' when it matches none).
          function Get-PsaPriorityLevel {
              param([string]$Label)
              if ([string]::IsNullOrWhiteSpace($Label)) { return '' }
              foreach ($k in @('critical', 'high', 'medium', 'low')) { foreach ($p in $PsaState.PriorityPatterns[$k]) { if ($Label -match $p) { return $k } } }
              return ''
          }

          # A GET where a 403 becomes a plain sentence about the API user's permissions.
          function Invoke-PsaRead {
              param([string]$Path, [string]$What = 'read tickets', [string]$Need = 'read service tickets and their notes')
              try { return Invoke-Psa GET $Path }
              catch {
                  $m = [string]$_.Exception.Message
                  if ($m -match '\(HTTP 403\)') { throw "$(Get-PsaName) refused to $What (HTTP 403). Give the API user permission to $Need, then run this again." }
                  throw
              }
          }
          # Kaseya BMS list replies are {Success, Result}; Result may be the list or hold it. Unverified: the list shape.
          function Get-PsaBmsList {
              param($Reply)
              $res = Get-PsaProp $Reply 'Result'
              if ($null -eq $res) { return @() }
              if ($res -is [array]) { return @($res | Where-Object { $null -ne $_ }) }
              foreach ($n in @('Items', 'Data', 'Tickets', 'Records')) { $v = Get-PsaProp $res $n; if ($null -ne $v) { return @($v | Where-Object { $null -ne $_ }) } }
              return @($res)
          }
          # Autotask query with paging (pageDetails.nextPageUrl). Returns the items, up to -Max.
          function Invoke-PsaAtQuery {
              param([string]$Entity, [object[]]$Filter, [string[]]$Fields = @(), [int]$Max = 500, [string]$What = '')
              $s = [ordered]@{ filter = @($Filter); MaxRecords = [Math]::Min(500, [Math]::Max(1, $Max)) }
              if ($Fields.Count) { $s.IncludeFields = $Fields }
              $path = "/$Entity/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 8 -Compress))"
              $out = New-Object System.Collections.ArrayList
              for ($p = 1; $p -le $PsaState.MaxPages -and $path; $p++) {
                  $r = if ($What) { Invoke-PsaRead $path $What } else { Invoke-Psa GET $path }
                  foreach ($i in @(Get-PsaProp $r 'items' | Where-Object { $null -ne $_ })) { $null = $out.Add($i) }
                  if ($out.Count -ge $Max) { break }
                  $path = [string](Get-PsaPath $r 'pageDetails.nextPageUrl')
              }
              return @($out | Select-Object -First $Max)
          }

          # ---- statuses ----
          # The PSA's ticket statuses as @(@{ id; name }), for the PSAs that key statuses by id (Autotask, HaloPSA,
          # Kaseya BMS). ConnectWise (per board), Syncro and Zendesk use names, so they return @(). Cached per connection.
          function Get-PsaStatusList {
              $c = Get-PsaConn
              if ($null -ne $PsaState.Statuses) { return @($PsaState.Statuses) }
              $list = @()
              switch ($c.Psa) {
                  'autotask' { $list = @(Get-PsaAtPicklist 'Tickets' 'status' | ForEach-Object { @{ id = [string](Get-PsaProp $_ 'value'); name = [string](Get-PsaProp $_ 'label') } }) }
                  'halopsa' {
                      # Unverified: GET /api/Status (HaloAPI Get-HaloStatus) returns an array of { id, name }.
                      $r = Invoke-Psa GET '/Status'
                      $rows = @(Get-PsaProp $r 'statuses'); if (-not @($rows | Where-Object { $null -ne $_ }).Count) { $rows = @($r) }
                      $list = @($rows | Where-Object { $null -ne $_ -and $null -ne (Get-PsaProp $_ 'name') } | ForEach-Object { @{ id = [string](Get-PsaProp $_ 'id'); name = [string](Get-PsaProp $_ 'name') } })
                  }
                  'kaseyabms' {
                      # Vendor docs (BMS swagger): GET /v2/system/statuses/lookup returns { Result: [{ Id, Name, IsActive }] }.
                      $r = Invoke-Psa GET '/system/statuses/lookup'
                      $list = @(Get-PsaBmsList $r | Where-Object { (Get-PsaProp $_ 'IsActive') -ne $false } | ForEach-Object { @{ id = [string](Get-PsaProp $_ 'Id'); name = [string](Get-PsaProp $_ 'Name') } })
                  }
              }
              $PsaState.Statuses = @($list)
              return @($list)
          }
          # The id for a status name (Autotask, HaloPSA, Kaseya BMS). A number is returned as given; the PSAs that
          # use names (ConnectWise, Syncro, Zendesk) get the name back. Throws a plain sentence listing the statuses.
          function Get-PsaStatusId {
              param([string]$Name)
              $n = ([string]$Name).Trim()
              if ($n -match '^\d+$') { return $n }
              $c = Get-PsaConn
              if ($c.Psa -notin @('autotask', 'halopsa', 'kaseyabms')) { return $n }
              $list = @(Get-PsaStatusList)
              $hit = @($list | Where-Object { $_.name.Trim() -ieq $n }) | Select-Object -First 1
              if (-not $hit) { throw "$(Get-PsaName) has no ticket status named '$n'. Its statuses are: $((@($list | ForEach-Object { $_.name }) | Sort-Object -Unique) -join ', ')." }
              return $hit.id
          }
          # A readable status name. Autotask, HaloPSA and Kaseya BMS hand out ids; the others already use names.
          # An id with no match comes back unchanged.
          function Get-PsaStatusName {
              param([string]$Status)
              $s = ([string]$Status).Trim()
              if ($s -notmatch '^\d+$') { return $s }
              $c = Get-PsaConn
              if ($c.Psa -notin @('autotask', 'halopsa', 'kaseyabms')) { return $s }
              $list = @(); try { $list = @(Get-PsaStatusList) } catch { $list = @() }
              $hit = @($list | Where-Object { $_.id -eq $s }) | Select-Object -First 1
              if ($hit) { return $hit.name }
              return $s
          }

          # ---- links ----
          # A link a technician can open, or '' when this PSA's link can't be worked out. No API call.
          #   -Template  wins when given (an unfilled @token counts as blank); {id} or {ticketId} becomes the ticket id.
          #   Otherwise the optional PSA-TicketUrlTemplate secret (same placeholders), then the PSA's usual link.
          function Get-PsaTicketUrl {
              param([string]$Id, [string]$Template = '')
              $tpl = ([string]$Template).Trim()
              if (-not $tpl -or $tpl.StartsWith('@')) {
                  if ($null -eq $PsaState.UrlTemplate) { $PsaState.UrlTemplate = [string](Get-PsaSecret 'PSA-TicketUrlTemplate') }
                  $tpl = $PsaState.UrlTemplate
              }
              if ($tpl) { return ($tpl -replace '\{(id|ticketId)\}', [uri]::EscapeDataString($Id)) }
              if ($null -eq $PsaState.Conn) { return '' }
              $u = $null; try { $u = [uri]$PsaState.Conn.Base } catch { return '' }
              $root = "$($u.Scheme)://$($u.Authority)"
              switch ($PsaState.Conn.Psa) {
                  # Unverified: the ticket screen; the API host api-na.myconnectwise.net serves the UI as na.myconnectwise.net.
                  'connectwise' { return "$($u.Scheme)://$($u.Host -replace '^api-', '')/v4_6_release/services/system_io/Service/fv_sr100_request.rails?service_recid=$Id" }
                  # Unverified: the web UI host mirrors the API zone host (webservices5 -> ww5).
                  'autotask' { return "$($u.Scheme)://$($u.Host -replace '^webservices', 'ww')/Mvc/ServiceDesk/TicketDetail.mvc?ticketId=$Id" }
                  # Unverified: the HaloPSA agent ticket link.
                  'halopsa' { return "$root/tickets?id=$Id" }
                  'kaseyabms' { return '' }
                  # Unverified: the Syncro ticket page.
                  'syncro' { return "$root/tickets/$Id" }
                  'zendesk' { return "$root/agent/tickets/$Id" }
              }
              return ''
          }

          # ---- notes ----
          # A ticket's notes, oldest first: @(@{ id; text; title; created; internal; public; fromClient; author; raw }).
          #   created     UTC [datetime] or $null
          #   internal    $true for a technician-only note; public is its opposite
          #   fromClient  best effort (see each PSA); $false when the PSA doesn't say
          #   -Ticket     a Find-PsaTickets row or Get-PsaTicket result, so Zendesk can tell the requester's comments apart
          #   -Newest     newest first instead;  -Max  keep only the newest N
          #   -TextOnly   skip the extra Zendesk ticket read that works out fromClient
          # A 403 becomes a plain permission sentence. Other read failures throw.
          function Get-PsaTicketNotes {
              param([string]$Id, $Ticket = $null, [switch]$Newest, [int]$Max = 0, [switch]$TextOnly)
              $c = Get-PsaConn
              $what = "read the notes on ticket $Id"
              $notes = New-Object System.Collections.ArrayList
              $add = {
                  param($nid, $text, $title, $created, $internal, $fromClient, $author, $raw)
                  $null = $notes.Add(@{ id = [string]$nid; text = [string]$text; title = [string]$title; created = (ConvertTo-PsaDate $created); internal = [bool]$internal; public = (-not [bool]$internal); fromClient = [bool]$fromClient; author = [string]$author; raw = $raw })
              }
              switch ($c.Psa) {
                  'connectwise' {
                      # Vendor docs: GET /service/tickets/{id}/notes. A note is internal when only the Internal tab flag is set.
                      # Unverified: a note with a contact and no member was written by the client.
                      for ($p = 1; $p -le $PsaState.MaxPages; $p++) {
                          $page = @(Invoke-PsaRead "/service/tickets/$Id/notes?orderBy=$(ConvertTo-PsaQuery 'id asc')&pageSize=100&page=$p" $what | Where-Object { $null -ne $_ })
                          foreach ($n in $page) {
                              $internal = ((Get-PsaProp $n 'internalAnalysisFlag') -eq $true -and (Get-PsaProp $n 'detailDescriptionFlag') -ne $true -and (Get-PsaProp $n 'resolutionFlag') -ne $true)
                              & $add (Get-PsaProp $n 'id') (Get-PsaProp $n 'text') '' (Get-PsaFirst $n @('dateCreated', '_info.dateEntered', '_info.lastUpdated')) $internal ($null -ne (Get-PsaProp $n 'contact') -and $null -eq (Get-PsaProp $n 'member')) ([string](Get-PsaFirst $n @('member.identifier', 'contact.name', 'createdBy'))) $n
                          }
                          if ($page.Count -lt 100) { break }
                      }
                  }
                  'autotask' {
                      # Unverified: TicketNotes query by ticketID. Internal is the publish value whose label says Internal;
                      # createdByContactID set means the client wrote it.
                      $internalIds = @(Get-PsaAtPicklist 'TicketNotes' 'publish' | Where-Object { [string](Get-PsaProp $_ 'label') -match '(?i)internal' } | ForEach-Object { [string](Get-PsaProp $_ 'value') })
                      foreach ($n in @(Invoke-PsaAtQuery 'TicketNotes' @([ordered]@{ op = 'eq'; field = 'ticketID'; value = [long]$Id }) @() 5000 $what)) {
                          $byContact = Get-PsaProp $n 'createdByContactID'
                          & $add (Get-PsaProp $n 'id') (Get-PsaProp $n 'description') (Get-PsaProp $n 'title') (Get-PsaFirst $n @('createDateTime', 'lastActivityDate')) ($internalIds -contains [string](Get-PsaProp $n 'publish')) (-not (Test-PsaBlank $byContact)) ([string](Get-PsaFirst $n @('creatorResourceID', 'createdByContactID'))) $n
                      }
                  }
                  'halopsa' {
                      # Unverified: GET /api/Actions?ticket_id= returns { actions } with note (or note_html), hiddenfromuser and
                      # datetime; who_type 2 is taken to mean the end user wrote it.
                      $r = Invoke-PsaRead "/Actions?ticket_id=$Id&excludesys=true&count=500" $what
                      $rows = @(Get-PsaListReply $r @('actions'))
                      foreach ($n in @($rows | Where-Object { $null -ne $_ })) {
                          & $add (Get-PsaProp $n 'id') (ConvertTo-PsaPlainText ([string](Get-PsaFirst $n @('note', 'note_html')))) ([string](Get-PsaProp $n 'outcome')) (Get-PsaFirst $n @('datetime', 'actiondatecreated')) ((Get-PsaProp $n 'hiddenfromuser') -eq $true) ([string](Get-PsaProp $n 'who_type') -eq '2') ([string](Get-PsaProp $n 'who')) $n
                      }
                  }
                  'kaseyabms' {
                      # Vendor docs (BMS swagger): GET /v2/servicedesk/tickets/{id}/notes returns { Result: [{ Id, Details, CreatedOn,
                      # IsInternal, CreatedByName }] }. It doesn't say whether the client wrote a note, so fromClient is $false.
                      foreach ($n in @(Get-PsaBmsList (Invoke-PsaRead "/servicedesk/tickets/$Id/notes?PageSize=200" $what))) {
                          & $add (Get-PsaProp $n 'Id') (Get-PsaProp $n 'Details') '' (Get-PsaFirst $n @('CreatedOn', 'NoteDate')) ((Get-PsaProp $n 'IsInternal') -eq $true) $false ([string](Get-PsaProp $n 'CreatedByName')) $n
                      }
                  }
                  'syncro' {
                      # PSA.md (Get ticket): the ticket carries its comments; hidden marks a private one.
                      # Unverified: a visible comment with no user_id was written by the client.
                      $t = Get-PsaProp (Invoke-PsaRead "/tickets/$Id" $what) 'ticket'
                      foreach ($n in @(Get-PsaProp $t 'comments' | Where-Object { $null -ne $_ })) {
                          $hidden = (Get-PsaProp $n 'hidden') -eq $true
                          & $add (Get-PsaProp $n 'id') (Get-PsaProp $n 'body') (Get-PsaProp $n 'subject') (Get-PsaProp $n 'created_at') $hidden ((-not $hidden) -and (Test-PsaBlank (Get-PsaProp $n 'user_id'))) ([string](Get-PsaProp $n 'tech')) $n
                      }
                  }
                  'zendesk' {
                      # Vendor docs: GET /tickets/{id}/comments with next_page paging. The client wrote it when the author is the requester.
                      $req = ''
                      if (-not $TextOnly) {
                          if ($null -ne $Ticket) { $req = [string](Get-PsaFirst $Ticket @('contactId', 'requesterId', 'raw.requester_id', 'requester_id')) }
                          if (-not $req) { $req = [string](Get-PsaPath (Invoke-PsaRead "/tickets/$Id" $what) 'ticket.requester_id') }
                      }
                      $path = "/tickets/$Id/comments?sort_order=asc&per_page=100"
                      for ($p = 1; $p -le $PsaState.MaxPages -and $path; $p++) {
                          $r = Invoke-PsaRead $path $what
                          foreach ($n in @(Get-PsaProp $r 'comments' | Where-Object { $null -ne $_ })) {
                              $author = [string](Get-PsaProp $n 'author_id')
                              & $add (Get-PsaProp $n 'id') (Get-PsaProp $n 'body') '' (Get-PsaProp $n 'created_at') ((Get-PsaProp $n 'public') -eq $false) ([bool]$req -and $author -eq $req) $author $n
                          }
                          $path = [string](Get-PsaProp $r 'next_page')
                      }
                  }
              }
              # Oldest first by date; notes without a date keep the PSA's order.
              $i = 0
              $keyed = @(foreach ($n in $notes) { $i++; [pscustomobject]@{ d = $(if ($null -eq $n.created) { [datetime]::MinValue } else { $n.created }); i = $i; n = $n } })
              $sorted = @($keyed | Sort-Object -Property @{ Expression = 'd' }, @{ Expression = 'i' } | ForEach-Object { $_.n })
              if ($Max -gt 0 -and $sorted.Count -gt $Max) { $sorted = @($sorted | Select-Object -Last $Max) }
              if ($Newest) { [array]::Reverse($sorted) }
              return @($sorted)
          }

          # "[marker]" for a marker given with or without its brackets.
          function Get-PsaMarkerTag {
              param([string]$Marker)
              $m = ([string]$Marker).Trim()
              if ($m.StartsWith('[') -and $m.EndsWith(']')) { $m = $m.Substring(1, $m.Length - 2).Trim() }
              if (-not $m) { throw 'A note marker needs some text.' }
              if ($m -match '[\[\]\r\n]') { throw "A note marker can't contain brackets or line breaks ('$Marker')." }
              return "[$m]"
          }
          # The opaque line a public note shows instead of its marker: "Ref: " and the first 8 hex characters
          # (lowercase) of the SHA-256 of "[marker]" lowercased, as UTF-8. It reveals nothing of the marker text.
          function Get-PsaMarkerRef {
              param([string]$Marker)
              $tag = (Get-PsaMarkerTag $Marker).ToLowerInvariant()
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $h = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($tag)) } finally { $sha.Dispose() }
              return 'Ref: ' + ((@($h[0..3] | ForEach-Object { $_.ToString('x2') })) -join '')
          }
          # $true when $Text holds the "Ref: xxxxxxxx" line $Ref (case-insensitive, not part of a longer hex run).
          function Test-PsaMarkerRefIn {
              param([string]$Text, [string]$Ref)
              if (-not $Text) { return $false }
              $hex = ([string]$Ref -replace '^(?i)Ref:\s*', '')
              return ($Text -match "(?i)(?<![0-9a-z])Ref:\s*$([regex]::Escape($hex))(?![0-9a-f])")
          }
          # $true when a note on the ticket already holds the marker (case-insensitive): either the full "[marker]"
          # (internal notes, and public notes written before public notes switched to the opaque ref) or the
          # "Ref: xxxxxxxx" line a public note carries. Pass -Notes to reuse notes already read with
          # Get-PsaTicketNotes. Throws when the notes can't be read.
          function Test-PsaNoteMarker {
              param([string]$Id, [string]$Marker, $Notes = $null)
              $tag = Get-PsaMarkerTag $Marker
              $ref = Get-PsaMarkerRef $tag
              if ($null -eq $Notes) {
                  try { $Notes = @(Get-PsaTicketNotes -Id $Id -TextOnly) }
                  catch { throw "Couldn't check ticket $Id for an earlier note marked $tag, so nothing was written: $($_.Exception.Message)" }
              }
              foreach ($n in @($Notes)) {
                  if ($null -eq $n) { continue }
                  $t = if ($n -is [string]) { $n } else { [string](Get-PsaProp $n 'text') }
                  if ($t.IndexOf($tag, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
                  if (Test-PsaMarkerRefIn $t $ref) { return $true }
              }
              return $false
          }

          # ---- single-ticket changes ----
          # Closes a ticket to -StatusName, or to the PSA's usual closed status, and never to -NotStatus (for example
          # the Resolved status a ticket is already in). Returns the status that was set.
          function Close-PsaTicket {
              param([string]$Id, [string]$StatusName = '', [string]$NotStatus = '')
              $c = Get-PsaConn
              $StatusName = ([string]$StatusName).Trim(); $NotStatus = ([string]$NotStatus).Trim()
              if ($StatusName -and $NotStatus -and $StatusName -ieq $NotStatus) { throw "The closing status '$StatusName' is the status the ticket is already in. Choose a different closing status." }
              switch ($c.Psa) {
                  'connectwise' {
                      if ($StatusName) { return (Set-PsaStatus -Id $Id -StatusName $StatusName) }
                      # Unverified (as Set-PsaStatus): the board's statuses with closedStatus set; skips -NotStatus.
                      $t = Invoke-Psa GET "/service/tickets/$Id"
                      $boardId = Get-PsaPath $t 'board.id'
                      if (Test-PsaBlank $boardId) { throw "ConnectWise ticket $Id has no board, so its statuses can't be read." }
                      $all = @(Invoke-Psa GET "/service/boards/$boardId/statuses?pageSize=200" | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'inactive') -ne $true -and (Get-PsaProp $_ 'closedStatus') -eq $true -and ([string](Get-PsaProp $_ 'name')).Trim() -ine $NotStatus })
                      $st = Select-PsaByLabel $all 'name' @('(?i)^\W*closed\W*$', '(?i)closed', '(?i)complete', '(?i)resolved', '.')
                      if (-not $st) { throw "ConnectWise board $boardId has no closed status other than '$NotStatus'. Set the closing status name." }
                      return (Set-PsaStatus -Id $Id -StatusName ([string](Get-PsaProp $st 'name')))
                  }
                  'autotask' {
                      if (-not $StatusName -and $NotStatus -imatch '^complete$') { throw "'$NotStatus' is already Autotask's closed status. Set the closing status name." }
                      if ($StatusName) { return (Set-PsaStatus -Id $Id -StatusName $StatusName) }
                      return (Set-PsaStatus -Id $Id -State closed)
                  }
                  { $_ -in @('halopsa', 'kaseyabms') } {
                      if ($StatusName) { return (Set-PsaStatus -Id $Id -StatusName (Get-PsaStatusId $StatusName)) }
                      return (Set-PsaStatus -Id $Id -State closed)
                  }
                  'syncro' {
                      # Unverified (as Set-PsaStatus): Resolved is Syncro's default closed label.
                      $target = if ($StatusName) { $StatusName } else { 'Resolved' }
                      if ($target -ieq $NotStatus) { throw "In Syncro, '$NotStatus' is already the closed status, so there is nothing to close. Set the closing status name, or use a different status for tickets waiting to be closed." }
                      return (Set-PsaStatus -Id $Id -StatusName $target)
                  }
                  'zendesk' {
                      # Unverified: setting status closed through the API. Zendesk otherwise closes solved tickets on its own schedule.
                      $target = if ($StatusName) { $StatusName.ToLowerInvariant() } elseif ($NotStatus -ieq 'solved') { 'closed' } else { 'solved' }
                      return (Set-PsaStatus -Id $Id -StatusName $target)
                  }
              }
          }

          # Moves a ticket to another board (ConnectWise), queue (Autotask, Kaseya BMS), team (HaloPSA), issue type (Syncro)
          # or group (Zendesk). -Queue is a name or an id. Throws when the PSA refuses.
          function Set-PsaQueue {
              param([string]$Id, [string]$Queue)
              $c = Get-PsaConn
              if ([string]::IsNullOrWhiteSpace($Queue)) { throw 'Set-PsaQueue needs a queue name or id.' }
              $q = $Queue.Trim(); $isNum = $q -match '^\d+$'
              switch ($c.Psa) {
                  'connectwise' {
                      # Unverified: json-patch on board (a reference, so {id} or {name}). CW may refuse when the status doesn't exist on the new board.
                      $val = if ($isNum) { @{ id = [int]$q } } else { @{ name = $q } }
                      $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'board'; value = $val })
                  }
                  'autotask' {
                      # Unverified: PATCH /Tickets with queueID (the field at_create_ticket uses).
                      $qv = if ($isNum) { $q } else { Select-PsaAtValue (Get-PsaAtPicklist 'Tickets' 'queueID') @("(?i)^$([regex]::Escape($q))$") }
                      if ($null -eq $qv) { throw "Autotask has no ticket queue named '$q'." }
                      $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; queueID = [int]$qv })
                  }
                  'halopsa' {
                      # Unverified: team_id or team (name) on the POST /Tickets update.
                      $b = [ordered]@{ id = [long]$Id }; if ($isNum) { $b.team_id = [long]$q } else { $b.team = $q }
                      $null = Invoke-Psa POST '/Tickets' @($b)
                  }
                  'kaseyabms' {
                      # Unverified: json-patch on /QueueId.
                      if (-not $isNum) { throw 'Kaseya BMS needs a numeric queue id.' }
                      $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/QueueId'; value = [int]$q })
                  }
                  'syncro' {
                      # Unverified: Syncro has no queues; the issue type (problem_type) is the closest field.
                      $null = Invoke-Psa PUT "/tickets/$Id" @{ problem_type = $q }
                  }
                  'zendesk' {
                      # group_id on PUT /tickets is in PSA.md. Unverified: the GET /groups name lookup.
                      $gid = $q
                      if (-not $isNum) {
                          $g = @(Get-PsaProp (Invoke-Psa GET '/groups?per_page=100') 'groups' | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ 'name') -ieq $q }) | Select-Object -First 1
                          if (-not $g) { throw "Zendesk has no group named '$q'." }
                          $gid = [string](Get-PsaProp $g 'id')
                      }
                      $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ group_id = [long]$gid } }
                  }
              }
          }

          # Sets a ticket's contact (the requester in Zendesk). Throws when the PSA rejects it.
          function Set-PsaTicketContact {
              param([string]$Id, [string]$ContactId)
              $c = Get-PsaConn
              if ($ContactId -notmatch '^\d+$') { throw "Set-PsaTicketContact needs a numeric contact id (it was '$ContactId')." }
              switch ($c.Psa) {
                  # Unverified: json-patch on contact, the same shape as owner (PSA.md).
                  'connectwise' { $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'contact'; value = @{ id = [int]$ContactId } }) }
                  # Unverified: PATCH /Tickets with contactID, the at_update_ticket shape.
                  'autotask' { $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; contactID = [long]$ContactId }) }
                  # Unverified: POST /Tickets with user_id updates the end user.
                  'halopsa' { $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; user_id = [long]$ContactId }) }
                  # Vendor docs: PATCH /v2/servicedesk/tickets/{id} json-patch; ContactId is a ticket field. Unverified live.
                  'kaseyabms' { $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/ContactId'; value = [long]$ContactId }) }
                  # Vendor docs: PUT /tickets/{id} takes contact_id in a flat body. Unverified live.
                  'syncro' { $null = Invoke-Psa PUT "/tickets/$Id" @{ contact_id = [long]$ContactId } }
                  # Vendor docs: requester_id on the ticket. Unverified live.
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ requester_id = [long]$ContactId } } }
              }
          }

          # Autotask assigns a resource together with a role. Returns the resource's default Service Desk role id, or ''.
          # The other PSAs don't need a role and get '' with no call.
          function Get-PsaDefaultRole {
              param([string]$UserId)
              $c = Get-PsaConn
              if ($c.Psa -ne 'autotask' -or [string]::IsNullOrWhiteSpace($UserId)) { return '' }
              # Unverified: defaultServiceDeskRoleID on the Resources entity.
              $v = Get-PsaPath (Invoke-Psa GET "/Resources/$UserId") 'item.defaultServiceDeskRoleID'
              if (Test-PsaBlank $v) { return '' }
              return [string]$v
          }

          # A run's "company" input as a PSA company: a numeric id is used as given; a name must match exactly one
          # company (Find-PsaCompany, case-insensitive). Returns @{ id; name }, or @{ id = ''; name = '' } for blank or an
          # unfilled @token. Throws a plain sentence when the name matches none or several.
          function Resolve-PsaCompanyId {
              param([string]$Company)
              $v = ([string]$Company).Trim()
              if (-not $v -or $v.StartsWith('@')) { return @{ id = ''; name = '' } }
              if ($v -match '^\d+$') { return @{ id = $v; name = '' } }
              $hits = @(Find-PsaCompany -Name $v | Where-Object { $_.exact })
              if (-not $hits.Count) { throw "$(Get-PsaName) has no company named '$v'. Use the exact company name or the PSA company id." }
              if ($hits.Count -gt 1) { throw "$(Get-PsaName) has $($hits.Count) companies named '$v'. Use the PSA company id instead." }
              return @{ id = [string]$hits[0].id; name = [string]$hits[0].name }
          }

          # A ticket number as people see it, turned into the PSA's internal id. ConnectWise, HaloPSA and Zendesk show
          # the id itself; Autotask and Kaseya BMS show numbers like T20261008.0001; Syncro shows a number that differs
          # from its id. A leading # is ignored. Throws when the ticket isn't found.
          function Resolve-PsaTicketId {
              param([string]$Ref)
              $c = Get-PsaConn
              $r = ([string]$Ref).Trim().TrimStart('#')
              if (-not $r) { throw 'No ticket number was given.' }
              switch ($c.Psa) {
                  'autotask' {
                      if ($r -match '^\d+$') { return $r }
                      # Unverified: querying Tickets by ticketNumber.
                      $hit = @(Invoke-PsaAtQuery 'Tickets' @([ordered]@{ op = 'eq'; field = 'ticketNumber'; value = $r }) @('id', 'ticketNumber') 1) | Select-Object -First 1
                      if (-not $hit) { throw "Autotask has no ticket $r." }
                      return [string](Get-PsaProp $hit 'id')
                  }
                  'kaseyabms' {
                      if ($r -match '^\d+$') { return $r }
                      # Unverified: the Filter.TicketNumber list filter.
                      $hit = @(Get-PsaBmsList (Invoke-Psa GET "/servicedesk/tickets?Filter.TicketNumber=$(ConvertTo-PsaQuery $r)&PageSize=5") | Where-Object { [string](Get-PsaProp $_ 'TicketNumber') -eq $r }) | Select-Object -First 1
                      if (-not $hit) { throw "Kaseya BMS has no ticket $r." }
                      return [string](Get-PsaProp $hit 'Id')
                  }
                  'syncro' {
                      if ($r -notmatch '^\d+$') { throw "Syncro ticket numbers are numeric; '$r' isn't." }
                      # Unverified: GET /tickets?number= filters on the number customers see. Falls back to treating it as the id.
                      $rows = @()
                      try { $rows = @(Get-PsaProp (Invoke-Psa GET "/tickets?number=$r") 'tickets' | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ 'number') -eq $r }) } catch { $rows = @() }
                      if ($rows.Count) { return [string](Get-PsaProp $rows[0] 'id') }
                      return $r
                  }
                  default {
                      if ($r -notmatch '^\d+$') { throw "$(Get-PsaName) ticket numbers are numeric; '$r' isn't." }
                      return $r
                  }
              }
          }
          # ---------- end _shared/psa.ps1 ----------
          # <<< _shared/psa.ps1

          $in = Get-NodeInput
          function Get-QbrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Copy-QbrInput { param($o) $h = [ordered]@{}; if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] } } elseif ($null -ne $o) { foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value } }; return $h }
          $out = Copy-QbrInput $in
          $warnings = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-QbrProp $in 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }

          $ci = [System.Globalization.CultureInfo]::InvariantCulture
          $now = (Get-Date).ToUniversalTime()
          function ConvertTo-QbrUtc { param($v) if ($null -eq $v) { return $null }; if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }; if ($v -is [datetimeoffset]) { return $v.UtcDateTime }; $d = [datetime]::MinValue; if ([string]$v -and [datetime]::TryParse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { return $d }; return $null }
          $tmp = ConvertTo-QbrUtc (Get-QbrProp $in 'runAt'); if ($null -ne $tmp) { $now = $tmp }
          $days = [int](Get-QbrProp $in 'quarter_days'); if ($days -le 0) { $days = 90 }
          $curStart = $now.AddDays(-$days); $prevStart = $now.AddDays(-2 * $days)
          function Get-QbrIso { param([datetime]$d) return $d.ToString('yyyy-MM-ddTHH:mm:ssZ', $ci) }
          function ConvertTo-QbrDate { param($v) $d = [datetime]::MinValue; if ($null -ne $v -and [string]$v -and [datetime]::TryParse([string]$v, $ci, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { if ($d.Year -gt 1900) { return $d } }; return $null }
          $MaxPages = 10

          $t = [ordered]@{
              available = $false; reason = ''; psa = ''; psaName = ''; psaCompanyId = ''; matchedBy = ''; days = $days
              currentFrom = (Get-QbrIso $curStart); previousFrom = (Get-QbrIso $prevStart); to = (Get-QbrIso $now)
              openedCurrent = $null; openedPrevious = $null; closedCurrent = $null; closedPrevious = $null; openNow = $null
              categories = @(); categoryLabel = 'category'; categoriesFrom = 0; notes = @()
          }
          $notes = New-Object System.Collections.ArrayList
          function Close-QbrStep {
              $t.notes = @($notes)
              $out.tickets = $t
              $out.warnings = @($warnings)
              Set-NodeOutput $out
          }

          # ---- which PSA ----
          $psa = ''
          try { $psa = Get-PsaType ([string](Get-QbrProp $in 'psa')) } catch { $t.reason = "Ticket trends are not available: $($_.Exception.Message)" }
          if (-not $psa) {
              if (-not $t.reason) { $t.reason = 'No PSA is set up on this runner, so ticket trends are not available. Add the PSA-Type secret and that PSA''s secrets to include them.' }
              $null = $warnings.Add($t.reason); Close-QbrStep; return
          }
          $t.psa = $psa; $t.psaName = $PsaState.Names[$psa]
          try { $null = Connect-Psa $psa }
          catch { $t.reason = "Couldn't sign in to $($t.psaName), so ticket trends are not available: $($_.Exception.Message)"; $null = $warnings.Add($t.reason); Close-QbrStep; return }

          # ---- which PSA company: psa_company_id input, then CloudRadial's PSA link, then an exact name match ----
          $pcid = ''
          $given = [string](Get-QbrProp $in 'psa_company_id')
          $psaKey = [string](Get-QbrProp $in 'psaKey')
          $psaIdent = ([string](Get-QbrProp $in 'psaIdentifier')).Trim()
          $coName = [string](Get-QbrProp $in 'companyName')
          try {
              if ($given -match '^\d+$') { $pcid = $given; $t.matchedBy = 'psa_company_id input' }
              elseif ($psaKey -match '^\d+$' -and [long]$psaKey -gt 0) { $pcid = $psaKey; $t.matchedBy = 'the PSA link on the CloudRadial company (psaKey)' }   # Unverified: psaKey is the PSA's own company id for every PSA.
              elseif ($psaIdent -match '^\d+$') { $pcid = $psaIdent; $t.matchedBy = 'the PSA identifier on the CloudRadial company' }
              elseif ($psaIdent -and $psa -eq 'connectwise') {
                  $hit = @(Invoke-Psa GET "/company/companies?conditions=$(ConvertTo-PsaQuery "identifier=`"$($psaIdent.Replace('"', '\"'))`"")&pageSize=2") | Where-Object { $null -ne $_ } | Select-Object -First 1
                  if ($hit) { $pcid = [string](Get-PsaProp $hit 'id'); $t.matchedBy = "ConnectWise company identifier $psaIdent" }
              }
              if (-not $pcid) {
                  foreach ($nm in @($psaIdent, $coName)) {
                      if (-not $nm) { continue }
                      $exact = @(Find-PsaCompany $nm | Where-Object { $_.exact })
                      if ($exact.Count -eq 1) { $pcid = [string]$exact[0].id; $t.matchedBy = "an exact name match on '$nm'"; break }
                  }
              }
          }
          catch { $null = $notes.Add("Looking up the client in $($t.psaName) failed: $($_.Exception.Message)") }
          if (-not $pcid) {
              $t.reason = "Couldn't match $coName to one company in $($t.psaName), so ticket trends are not available. Set psa_company_id on the run, or link the company to the PSA in CloudRadial."
              $null = $warnings.Add($t.reason); Close-QbrStep; return
          }
          $t.psaCompanyId = $pcid

          # ---- counting, per PSA ----
          # Kind: opened (created in the span), closed (closed in the span), open (open now; From/To ignored).
          function Get-QbrCount {
              param([string]$Kind, [datetime]$From, [datetime]$To)
              $f = Get-QbrIso $From; $e = Get-QbrIso $To
              switch ($psa) {
                  'connectwise' {
                      # Unverified: date conditions in square brackets and the closedDate field (CW swagger clients).
                      $cond = switch ($Kind) { 'opened' { "company/id=$pcid and dateEntered>=[$f] and dateEntered<[$e]" } 'closed' { "company/id=$pcid and closedFlag=true and closedDate>=[$f] and closedDate<[$e]" } default { "company/id=$pcid and closedFlag=false" } }
                      return [int](Get-PsaProp (Invoke-Psa GET "/service/tickets/count?conditions=$(ConvertTo-PsaQuery $cond)") 'count')
                  }
                  'autotask' {
                      # Unverified: the queryCount field name (PSA.md), and completedDate as the closed date.
                      $flt = @([ordered]@{ op = 'eq'; field = 'companyID'; value = [long]$pcid })
                      switch ($Kind) {
                          'opened' { $flt += [ordered]@{ op = 'gte'; field = 'createDate'; value = $f }; $flt += [ordered]@{ op = 'lt'; field = 'createDate'; value = $e } }
                          'closed' { $flt += [ordered]@{ op = 'gte'; field = 'completedDate'; value = $f }; $flt += [ordered]@{ op = 'lt'; field = 'completedDate'; value = $e } }
                          default { foreach ($s in @(Get-PsaAtCompleteStatuses)) { $flt += [ordered]@{ op = 'noteq'; field = 'status'; value = $s } } }
                      }
                      $r = Invoke-Psa GET "/Tickets/query/count?search=$(ConvertTo-PsaQuery (@{ filter = $flt } | ConvertTo-Json -Depth 6 -Compress))"
                      $n = Get-PsaProp $r 'queryCount'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'halopsa' {
                      # Unverified: the datesearch values dateoccurred and dateclosed, and closed_only.
                      $q = switch ($Kind) { 'opened' { "datesearch=dateoccurred&startdate=$(ConvertTo-PsaQuery $f)&enddate=$(ConvertTo-PsaQuery $e)" } 'closed' { "closed_only=true&datesearch=dateclosed&startdate=$(ConvertTo-PsaQuery $f)&enddate=$(ConvertTo-PsaQuery $e)" } default { 'open_only=true' } }
                      $n = Get-PsaProp (Invoke-Psa GET "/Tickets?client_id=$pcid&$q&pageinate=true&page_size=1&page_no=1") 'record_count'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'kaseyabms' {
                      # From the public Swagger (Filter.AccountIds, Filter.OpenDate*, Filter.CompletedDate*, TotalRecords). Not yet proven live.
                      $q = switch ($Kind) { 'opened' { "Filter.OpenDateFrom=$(ConvertTo-PsaQuery $f)&Filter.OpenDateTo=$(ConvertTo-PsaQuery $e)" } 'closed' { "Filter.CompletedDateFrom=$(ConvertTo-PsaQuery $f)&Filter.CompletedDateTo=$(ConvertTo-PsaQuery $e)" } default { 'Filter.ExcludeCompleted=true' } }
                      $n = Get-PsaProp (Invoke-Psa GET "/servicedesk/tickets?Filter.AccountIds=$pcid&$q&PageSize=1&PageNumber=1") 'TotalRecords'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'zendesk' {
                      # Unverified: organization:<id> with created> / solved> ISO times in a search count.
                      $q = switch ($Kind) { 'opened' { "type:ticket organization:$pcid created>$f created<$e" } 'closed' { "type:ticket organization:$pcid solved>$f solved<$e" } default { "type:ticket organization:$pcid status<solved" } }
                      return [int](Get-PsaProp (Invoke-Psa GET "/search/count?query=$(ConvertTo-PsaQuery $q)") 'count')
                  }
              }
              return $null
          }

          # Syncro can't count by date, so its tickets are listed (25 a page) and counted here.
          function Get-QbrSyncroRows {
              param([string]$Query)
              $rows = New-Object System.Collections.ArrayList; $capped = $false
              for ($p = 1; $p -le 40; $p++) {
                  $r = Invoke-Psa GET "/tickets?customer_id=$pcid&$Query&page=$p"
                  foreach ($x in @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ })) { $null = $rows.Add($x) }
                  $pages = Get-PsaPath $r 'meta.total_pages'
                  if ($null -eq $pages -or $p -ge [int]$pages) { break }
                  if ($p -eq 40) { $capped = $true }
              }
              return @{ rows = @($rows); capped = $capped }
          }
          function Get-QbrSpan { param($Rows, [string]$Field, [datetime]$From, [datetime]$To) return @($Rows | Where-Object { $d = ConvertTo-QbrDate (Get-PsaProp $_ $Field); $null -ne $d -and $d -ge $From -and $d -lt $To }) }

          # Category names of the tickets opened this period (up to $MaxPages pages).
          function Get-QbrCategoryNames {
              $f = Get-QbrIso $curStart; $e = Get-QbrIso $now
              $names = New-Object System.Collections.ArrayList
              switch ($psa) {
                  'connectwise' {
                      $t.categoryLabel = 'ticket type'
                      $cond = "company/id=$pcid and dateEntered>=[$f] and dateEntered<[$e]"
                      for ($p = 1; $p -le $MaxPages; $p++) {
                          $rows = @(Invoke-Psa GET "/service/tickets?conditions=$(ConvertTo-PsaQuery $cond)&fields=id,type,board&pageSize=1000&page=$p" | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $n = [string](Get-PsaPath $r 'type.name'); $null = $names.Add($n) }
                          if ($rows.Count -lt 1000) { break }
                      }
                  }
                  'autotask' {
                      # Unverified: IncludeFields in a query, and paging through pageDetails.nextPageUrl.
                      $t.categoryLabel = 'issue type'
                      $labels = @{}; foreach ($v in @(Get-PsaAtPicklist 'Tickets' 'issueType')) { $labels[[string](Get-PsaProp $v 'value')] = [string](Get-PsaProp $v 'label') }
                      $flt = @([ordered]@{ op = 'eq'; field = 'companyID'; value = [long]$pcid }, [ordered]@{ op = 'gte'; field = 'createDate'; value = $f }, [ordered]@{ op = 'lt'; field = 'createDate'; value = $e })
                      $next = "/Tickets/query?search=$(ConvertTo-PsaQuery (([ordered]@{ IncludeFields = @('id', 'issueType'); filter = $flt }) | ConvertTo-Json -Depth 6 -Compress))"
                      for ($p = 1; $p -le $MaxPages -and $next; $p++) {
                          $r = Invoke-Psa GET $next
                          foreach ($x in @(Get-PsaProp $r 'items' | Where-Object { $null -ne $_ })) { $it = [string](Get-PsaProp $x 'issueType'); $null = $names.Add($(if ($it -and $labels.ContainsKey($it)) { $labels[$it] } else { '' })) }
                          $next = [string](Get-PsaPath $r 'pageDetails.nextPageUrl')
                      }
                  }
                  'halopsa' {
                      # Unverified: category_1 on the ticket list.
                      for ($p = 1; $p -le $MaxPages; $p++) {
                          $r = Invoke-Psa GET "/Tickets?client_id=$pcid&datesearch=dateoccurred&startdate=$(ConvertTo-PsaQuery $f)&enddate=$(ConvertTo-PsaQuery $e)&pageinate=true&page_size=100&page_no=$p"
                          $rows = @(Get-PsaProp $r 'tickets' | Where-Object { $null -ne $_ })
                          foreach ($x in $rows) { $null = $names.Add([string](Get-PsaProp $x 'category_1')) }
                          if ($rows.Count -lt 100) { break }
                      }
                  }
                  'kaseyabms' {
                      $t.categoryLabel = 'issue type'
                      for ($p = 1; $p -le $MaxPages; $p++) {
                          $r = Invoke-Psa GET "/servicedesk/tickets?Filter.AccountIds=$pcid&Filter.OpenDateFrom=$(ConvertTo-PsaQuery $f)&Filter.OpenDateTo=$(ConvertTo-PsaQuery $e)&PageSize=100&PageNumber=$p"
                          $rows = @(Get-PsaProp $r 'Result' | Where-Object { $null -ne $_ })
                          foreach ($x in $rows) { $null = $names.Add([string](Get-PsaProp $x 'IssueTypeName')) }
                          if ($rows.Count -lt 100) { break }
                      }
                  }
                  'zendesk' {
                      $t.categoryLabel = 'ticket type'
                      $q = "type:ticket organization:$pcid created>$f created<$e"
                      for ($p = 1; $p -le $MaxPages; $p++) {
                          $r = Invoke-Psa GET "/search?query=$(ConvertTo-PsaQuery $q)&per_page=100&page=$p"
                          $rows = @(Get-PsaProp $r 'results' | Where-Object { $null -ne $_ })
                          foreach ($x in $rows) { $null = $names.Add([string](Get-PsaProp $x 'type')) }
                          if (-not (Get-PsaProp $r 'next_page')) { break }
                      }
                  }
              }
              return @($names)
          }

          try {
              if ($psa -eq 'syncro') {
                  # From the Syncro Swagger (customer_id, created_after, resolved_after, 25 a page). Not yet proven live.
                  $since = $prevStart.ToString('yyyy-MM-dd', $ci)
                  $made = Get-QbrSyncroRows "created_after=$since"
                  $t.openedCurrent = @(Get-QbrSpan $made.rows 'created_at' $curStart $now).Count
                  $t.openedPrevious = @(Get-QbrSpan $made.rows 'created_at' $prevStart $curStart).Count
                  $done = Get-QbrSyncroRows "resolved_after=$since"
                  $t.closedCurrent = @(Get-QbrSpan $done.rows 'resolved_at' $curStart $now).Count
                  $t.closedPrevious = @(Get-QbrSpan $done.rows 'resolved_at' $prevStart $curStart).Count
                  $open = Get-QbrSyncroRows "status=$(ConvertTo-PsaQuery 'Not Closed')"
                  $t.openNow = @($open.rows).Count
                  if ($made.capped -or $done.capped -or $open.capped) { $null = $notes.Add('Syncro returned more than 1,000 tickets for one count, so the counts are lower bounds.') }
                  $t.categoryLabel = 'issue type'
                  $catNames = @(Get-QbrSpan $made.rows 'created_at' $curStart $now | ForEach-Object { [string](Get-PsaProp $_ 'problem_type') })
              }
              else {
                  $t.openedCurrent = Get-QbrCount 'opened' $curStart $now
                  $t.openedPrevious = Get-QbrCount 'opened' $prevStart $curStart
                  $t.closedCurrent = Get-QbrCount 'closed' $curStart $now
                  $t.closedPrevious = Get-QbrCount 'closed' $prevStart $curStart
                  $t.openNow = Get-QbrCount 'open' $now $now
                  $catNames = @()
                  try { $catNames = @(Get-QbrCategoryNames) }
                  catch { $null = $notes.Add("Ticket categories weren't available: $($_.Exception.Message)") }
              }
              $t.available = $true
              $t.categoriesFrom = @($catNames).Count
              $named = @($catNames | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              if ($named.Count) {
                  $t.categories = @($named | Group-Object | Sort-Object @{ Expression = 'Count'; Descending = $true }, @{ Expression = 'Name'; Descending = $false } | Select-Object -First 5 | ForEach-Object { [ordered]@{ name = $_.Name; count = $_.Count } })
                  $blank = @($catNames).Count - $named.Count
                  if ($blank -eq 1) { $null = $notes.Add("1 ticket opened this period has no $($t.categoryLabel).") }
                  elseif ($blank -gt 1) { $null = $notes.Add("$blank tickets opened this period have no $($t.categoryLabel).") }
              }
              if ($null -ne $t.openedCurrent -and $t.categoriesFrom -lt [int]$t.openedCurrent -and $t.categoriesFrom -gt 0) { $null = $notes.Add("The top categories are based on the first $($t.categoriesFrom) of $($t.openedCurrent) tickets opened this period.") }
          }
          catch {
              $t.available = $false
              $t.reason = "Couldn't read tickets from $($t.psaName), so ticket trends are not available: $($_.Exception.Message)"
              $null = $warnings.Add($t.reason)
          }
          Close-QbrStep
        timeoutSeconds: 900
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-m365
      name: Read Microsoft 365 licences
      type: powershell-script
      position:
        x: 960
        'y': 120
      properties:
        script: |
          # === STEP: Read Microsoft 365 licences ===
          # Edit this file, then run: node automationai/qbr-data-pack/src/build.js
          # Optional and read-only (GET calls only). Reads the tenant's subscriptions: licences purchased and assigned per SKU.
          # Skipped with a note when the runner has no Microsoft 365 secrets, when the app lacks Organization.Read.All,
          # or when the tenant can't be confirmed as this client's (so another client's licences never reach this card).
          # Graph application permission: Organization.Read.All (or Directory.Read.All).
          # Secrets: M365-TenantId, M365-ClientId, M365-ClientSecret (the Entra-* and Graph-* names work too).
          # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
          # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
          # Signs in with the app registration's client credentials from the runner Key Vault.
          # Each helper names the Graph application permission it needs; when Graph answers 403,
          # the error says which permission to grant (with admin consent).
          # All state lives in the $GraphState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $GraphState = @{
              Base           = 'https://graph.microsoft.com'
              Headers        = $null
              Creds          = $null
              TenantId       = ''
              ExpiresAt      = [datetime]::MinValue
              MaxAttempts    = 5
              MaxWaitSeconds = 120
              LastStatus     = 0
          }

          # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
          # The first secret that has a value, from a list of names.
          function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
          function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-GraphRetryAfter {
              param($Err, [int]$Attempt)
              $s = 0
              try {
                  $ra = $Err.Exception.Response.Headers.RetryAfter
                  if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                  elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
              } catch { }
              if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
              return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
          }
          # Graph's own error message when there is one, otherwise the exception text.
          function Get-GraphErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
              return [string]$Err.Exception.Message
          }
          function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

          function Update-GraphToken {
              $c = $GraphState.Creds
              if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
              $r = $null
              try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
              catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
              $tok = Get-GraphProp $r 'access_token'
              if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
              $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
              $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
              $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
          }

          # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
          # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
          # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
          # Returns @{ TenantId }.
          function Connect-Graph {
              param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
              $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
              $GraphState.TenantId = $TenantId.Trim()
              Update-GraphToken
              return @{ TenantId = $GraphState.TenantId }
          }

          # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
          # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
          # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
          # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
          function Invoke-Graph {
              param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
              if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
              $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
              $short = $uri.Replace($GraphState.Base, '')
              $reauth = $false
              for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                  if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                  $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                  $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                  try {
                      $r = Invoke-RestMethod @p
                      $GraphState.LastStatus = 200
                      return $r
                  }
                  catch {
                      $code = Get-GraphHttpStatus $_
                      $GraphState.LastStatus = $code
                      if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                      if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                      $why = Get-GraphErrorText $_
                      if ($code -eq 403) {
                          $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                          throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                      }
                      throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                  }
              }
          }

          # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
          function Get-GraphAll {
              param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList
              $next = $Path; $n = 0
              while ($next -and $n -lt $MaxPages) {
                  $n++
                  $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                  foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                  $next = [string](Get-GraphProp $r '@odata.nextLink')
              }
              return @($rows)
          }

          # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
          function Get-GraphUser {
              param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }

          # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
          # Mail-enabled security groups and distribution lists can't be changed through Graph.
          function Add-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
              catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
          }

          # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
          function Remove-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
              catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
          }

          # Sets the user's manager. Needs User.ReadWrite.All.
          function Set-GraphManager {
              param([string]$UserId, [string]$ManagerId)
              $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
          }

          # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
          function Revoke-GraphSessions {
              param([string]$UserId)
              $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
          }

          # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
          # Disabling an admin account also needs a privileged role, which app permissions can't grant.
          function Set-GraphAccountEnabled {
              param([string]$UserId, [bool]$Enabled)
              $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
          }

          # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
          # The user must have a usage location before a licence can be added.
          function Set-GraphLicense {
              param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
              $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
              $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
              if (-not $toAdd.Count -and -not $toRemove.Count) { return }
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
              catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
          }

          # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
          # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
          function Get-GraphSignInActivity {
              param([string]$UserId = '')
              $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
              $perm = 'AuditLog.Read.All (with User.Read.All)'
              if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
              # Graph caps the page size at 120 when signInActivity is selected.
              return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
          }

          # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
          function Get-GraphAuthMethods {
              param([string]$UserId)
              return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
          }

          # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
          # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
          function Remove-GraphAuthMethod {
              param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
              if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
              $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
              $seg = @{
                  microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                  phoneAuthenticationMethod                  = 'phoneMethods'
                  fido2AuthenticationMethod                  = 'fido2Methods'
                  emailAuthenticationMethod                  = 'emailMethods'
                  softwareOathAuthenticationMethod           = 'softwareOathMethods'
                  windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                  temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                  platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
              }
              if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
              if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
              $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
          }

          # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
          # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
          function Get-GraphRiskyUsers {
              param([string]$UserId = '', [switch]$AtRiskOnly)
              $perm = 'IdentityRiskyUser.Read.All'
              if ($UserId) {
                  try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                  catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
              }
              $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
              return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
          }

          # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
          function New-GraphTempPassword {
              param([int]$Length = 16)
              if ($Length -lt 8) { $Length = 8 }
              $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
              $all = -join $sets
              $rng = [System.Security.Cryptography.RandomNumberGenerator]
              $chars = New-Object System.Collections.Generic.List[char]
              foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
              while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
              for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
              return -join $chars
          }
          # ---------- end _shared/graph.ps1 ----------
          # <<< _shared/graph.ps1

          $in = Get-NodeInput
          function Get-QbrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Copy-QbrInput { param($o) $h = [ordered]@{}; if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] } } elseif ($null -ne $o) { foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value } }; return $h }
          $out = Copy-QbrInput $in
          $warnings = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-QbrProp $in 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }
          $lic = [ordered]@{ available = $false; reason = ''; tenantId = ''; tenantName = ''; matchedBy = ''; skus = @(); purchased = 0; assigned = 0 }
          function Close-QbrStep { $out.licences = $lic; $out.warnings = @($warnings); Set-NodeOutput $out }
          function Skip-QbrM365 { param([string]$Why) $lic.reason = $Why; $null = $warnings.Add($Why); Close-QbrStep }

          # Friendly names for common SKUs (part numbers otherwise).
          $QbrSkuNames = @{
              'O365_BUSINESS_ESSENTIALS' = 'Microsoft 365 Business Basic'; 'O365_BUSINESS_PREMIUM' = 'Microsoft 365 Business Standard'; 'SPB' = 'Microsoft 365 Business Premium'
              'O365_BUSINESS' = 'Microsoft 365 Apps for business'; 'OFFICESUBSCRIPTION' = 'Microsoft 365 Apps for enterprise'; 'STANDARDPACK' = 'Office 365 E1'
              'ENTERPRISEPACK' = 'Office 365 E3'; 'ENTERPRISEPREMIUM' = 'Office 365 E5'; 'SPE_E3' = 'Microsoft 365 E3'; 'SPE_E5' = 'Microsoft 365 E5'; 'SPE_F1' = 'Microsoft 365 F3'
              'DESKLESSPACK' = 'Office 365 F3'; 'EXCHANGESTANDARD' = 'Exchange Online (Plan 1)'; 'EXCHANGEENTERPRISE' = 'Exchange Online (Plan 2)'; 'EXCHANGEDESKLESS' = 'Exchange Online Kiosk'
              'EXCHANGEARCHIVE_ADDON' = 'Exchange Online Archiving'; 'POWER_BI_PRO' = 'Power BI Pro'; 'PBI_PREMIUM_PER_USER' = 'Power BI Premium Per User'
              'PROJECTPROFESSIONAL' = 'Project Plan 3'; 'PROJECT_P1' = 'Project Plan 1'; 'VISIOCLIENT' = 'Visio Plan 2'; 'VISIOONLINE_PLAN1' = 'Visio Plan 1'
              'EMS' = 'Enterprise Mobility + Security E3'; 'EMSPREMIUM' = 'Enterprise Mobility + Security E5'; 'AAD_PREMIUM' = 'Microsoft Entra ID P1'; 'AAD_PREMIUM_P2' = 'Microsoft Entra ID P2'
              'INTUNE_A' = 'Microsoft Intune Plan 1'; 'ATP_ENTERPRISE' = 'Microsoft Defender for Office 365 (Plan 1)'; 'THREAT_INTELLIGENCE' = 'Microsoft Defender for Office 365 (Plan 2)'
              'MCOEV' = 'Teams Phone Standard'; 'MCOMEETADV' = 'Microsoft 365 Audio Conferencing'; 'MICROSOFT_TEAMS_ENTERPRISE_NEW' = 'Microsoft Teams Enterprise'; 'MICROSOFT_365_COPILOT' = 'Microsoft 365 Copilot'
          }
          function Test-QbrFreeSku { param([string]$Part) $u = $Part.ToUpperInvariant(); if (@('FLOW_FREE', 'POWER_BI_STANDARD', 'TEAMS_EXPLORATORY', 'TEAMS_FREE', 'STREAM', 'WINDOWS_STORE', 'RIGHTSMANAGEMENT_ADHOC', 'MICROSOFT_BUSINESS_CENTER', 'MCOPSTNC', 'PHONESYSTEM_VIRTUALUSER', 'MEETING_ROOM_FREE', 'APPS_FREE') -contains $u) { return $true }; return ($u -match '(_FREE$|^FREE_|_VIRAL|VIRAL_|_TRIAL|TRIAL_|_IW_SKU$|_IW$|EXPLORATORY)') }

          # ---- sign in (optional) ----
          $hasAny = $false
          foreach ($n in @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId', 'M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId')) { if (Get-GraphSecret @($n)) { $hasAny = $true; break } }
          if (-not $hasAny) { Skip-QbrM365 'Microsoft 365 is not connected on this runner (no M365-TenantId or M365-ClientId secret), so licence usage was left out.'; return }
          $conn = $null
          try { $conn = Connect-Graph } catch { Skip-QbrM365 "Couldn't sign in to Microsoft 365, so licence usage was left out: $($_.Exception.Message)"; return }
          $lic.tenantId = [string]$conn.TenantId

          # ---- confirm the tenant belongs to this client ----
          $org = $null
          try { $org = @(Get-QbrProp (Invoke-Graph -Method GET -Path '/v1.0/organization?$select=id,displayName,verifiedDomains' -Permission 'Organization.Read.All') 'value') | Select-Object -First 1 }
          catch {
              if ($GraphState.LastStatus -eq 403) { Skip-QbrM365 'Microsoft Graph refused to read the organization. Grant the app registration the Organization.Read.All application permission, with admin consent, to include licence usage.'; return }
              Skip-QbrM365 "Couldn't read the Microsoft 365 organization, so licence usage was left out: $($_.Exception.Message)"; return
          }
          $lic.tenantName = [string](Get-QbrProp $org 'displayName')
          $verified = @(@(Get-QbrProp $org 'verifiedDomains') | ForEach-Object { ([string](Get-QbrProp $_ 'name')).Trim().ToLowerInvariant() } | Where-Object { $_ })
          $crDomains = @(@(Get-QbrProp $in 'domainNames') | ForEach-Object { ([string]$_).Trim().ToLowerInvariant() } | Where-Object { $_ })
          $coTenant = [string](Get-QbrProp $in 'companyTenantId')
          $companyName = [string](Get-QbrProp $in 'companyName')
          $shared = @($crDomains | Where-Object { $verified -contains $_ })
          if ($coTenant -and $coTenant -eq $lic.tenantId.ToLowerInvariant()) { $lic.matchedBy = 'the tenant id on the CloudRadial company' }
          elseif ($coTenant) { Skip-QbrM365 "The Microsoft 365 tenant on this runner ($($lic.tenantName)) is not the one linked to $companyName in CloudRadial, so licence usage was left out."; return }
          elseif ($shared.Count) { $lic.matchedBy = "the domain $($shared[0]), which is on both the CloudRadial company and the tenant" }
          elseif (-not $crDomains.Count -and [string](Get-QbrProp $in 'companyVia') -eq 'CloudRadial-CompanyId secret') { $lic.matchedBy = 'the CloudRadial-CompanyId secret on this runner (the company has no domains in CloudRadial to compare)' }
          else { Skip-QbrM365 "Couldn't confirm that the Microsoft 365 tenant on this runner ($($lic.tenantName)) belongs to $companyName, because none of its verified domains are on the company in CloudRadial, so licence usage was left out."; return }

          # ---- subscriptions ----
          $skus = @()
          try { $skus = @(Get-GraphAll -Path '/v1.0/subscribedSkus' -Permission 'Organization.Read.All (or Directory.Read.All)') }
          catch {
              if ($GraphState.LastStatus -eq 403) { Skip-QbrM365 'Microsoft Graph refused to list the tenant''s subscriptions. Grant the app registration the Organization.Read.All application permission, with admin consent, to include licence usage.'; return }
              Skip-QbrM365 "Couldn't read the Microsoft 365 subscriptions, so licence usage was left out: $($_.Exception.Message)"; return
          }
          $rows = New-Object System.Collections.ArrayList
          foreach ($s in $skus) {
              $part = [string](Get-QbrProp $s 'skuPartNumber'); if (-not $part) { continue }
              $applies = [string](Get-QbrProp $s 'appliesTo')
              if ((Test-QbrFreeSku $part) -or ($applies -and $applies -ne 'User')) { continue }
              $pre = Get-QbrProp $s 'prepaidUnits'
              $enabled = [int](Get-QbrProp $pre 'enabled'); $warning = [int](Get-QbrProp $pre 'warning'); $suspended = [int](Get-QbrProp $pre 'suspended')
              $used = [int](Get-QbrProp $s 'consumedUnits')
              if ($enabled -le 0 -and $used -le 0) { continue }
              $u = $part.ToUpperInvariant()
              $name = if ($QbrSkuNames.ContainsKey($u)) { $QbrSkuNames[$u] } else { $part }
              $null = $rows.Add([ordered]@{ sku = $part; name = $name; purchased = $enabled; assigned = $used; unassigned = [Math]::Max(0, $enabled - $used); warning = $warning; suspended = $suspended })
          }
          $lic.skus = @($rows | Sort-Object @{ Expression = { $_.purchased }; Descending = $true }, @{ Expression = { $_.name }; Descending = $false })
          $lic.purchased = [int](@($rows | ForEach-Object { $_.purchased }) | Measure-Object -Sum).Sum
          $lic.assigned = [int](@($rows | ForEach-Object { $_.assigned }) | Measure-Object -Sum).Sum
          $lic.available = $true
          Close-QbrStep
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-card
      name: Post QBR-prep card
      type: powershell-script
      position:
        x: 1180
        'y': 120
      properties:
        script: |
          # === STEP: Post QBR-prep card ===
          # Edit this file, then run: node automationai/qbr-data-pack/src/build.js
          # The only write in this workflow: one internal CloudRadial Planner card on this company's board, subject
          # "QBR prep: <quarter>", stable key qbr-data-pack:<year>-Q<n>. A re-run in the same quarter updates that card
          # instead of adding another. With preview: true it works out the card and writes nothing.
          # The card only holds this one company's numbers, gathered by the earlier steps.
          # Secrets: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # >>> _shared/cloudradial.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          function Get-CrSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive by name through the legacy /api/beta/archive list (which ignores
          # companyId, so it is filtered here), and creates it with -Create. Returns @{ id; companyId; name; inboundAddress } or $null.
          # The create reply doesn't always carry the new id, so the archive is looked up again by name.
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              $find = {
                  $list = @(Get-CrBetaAll '/api/beta/archive')
                  @($list | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  # A 400 here has meant "already exists" when the list missed it, so look again before giving up.
                  try { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  $id = Get-CrId $resp @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('id', 'archiveId', 'companyReportFolderId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = [string](Get-CrProp $hit 'inboundAddress') }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # <<< _shared/cloudradial.ps1

          $in = Get-NodeInput
          function Get-QbrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Enc { param($s) return [System.Net.WebUtility]::HtmlEncode([string]$s) }
          $ci = [System.Globalization.CultureInfo]::InvariantCulture
          $warnings = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-QbrProp $in 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }

          function Stop-QbrCard {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'error'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @($warnings) })
              throw $Why
          }
          # "1 device" / "3 devices"
          function Get-QbrCount { param($n, [string]$One, [string]$Many) if ([int]$n -eq 1) { return "1 $One" }; return "$n $Many" }
          function Get-QbrNum { param($v) if ($null -eq $v -or [string]$v -eq '') { return 'not available' }; return [string]$v }
          function ConvertTo-QbrUtc { param($v) if ($null -eq $v) { return $null }; if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }; if ($v -is [datetimeoffset]) { return $v.UtcDateTime }; $d = [datetime]::MinValue; if ([string]$v -and [datetime]::TryParse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { return $d }; return $null }
          function Get-QbrDay { param($v) $d = ConvertTo-QbrUtc $v; if ($null -ne $d) { return $d.ToString('d MMM yyyy', $ci) }; return [string]$v }
          function Add-QbrTable {
              param($Sb, [string]$Caption, [string[]]$Head, [object[]]$Rows)
              $null = $Sb.Append("<p><strong>$(Enc $Caption)</strong></p><table><thead><tr>")
              foreach ($h in $Head) { $null = $Sb.Append("<th>$(Enc $h)</th>") }
              $null = $Sb.Append('</tr></thead><tbody>')
              foreach ($r in $Rows) { $null = $Sb.Append('<tr>'); foreach ($c in @($r)) { $null = $Sb.Append("<td>$(Enc $c)</td>") }; $null = $Sb.Append('</tr>') }
              $null = $Sb.Append('</tbody></table>')
          }

          $companyId = [int](Get-QbrProp $in 'companyId')
          $companyName = [string](Get-QbrProp $in 'companyName')
          if ($companyId -le 0) { Stop-QbrCard 'The earlier steps did not say which company this is for, so no card was written.' }
          $preview = [bool](Get-QbrProp $in 'preview')
          $days = [int](Get-QbrProp $in 'quarter_days'); if ($days -le 0) { $days = 90 }
          $quarterLabel = [string](Get-QbrProp $in 'quarterLabel')
          $CardKey = "qbr-data-pack:$([string](Get-QbrProp $in 'quarterKey'))"
          $CardSubject = "QBR prep: $quarterLabel"
          $dev = Get-QbrProp $in 'devices'
          $tix = Get-QbrProp $in 'tickets'
          $lic = Get-QbrProp $in 'licences'
          $dom = Get-QbrProp $in 'domains'
          $cert = Get-QbrProp $in 'certificates'
          $plan = Get-QbrProp $in 'planner'
          $runAtDate = ConvertTo-QbrUtc (Get-QbrProp $in 'runAt'); if ($null -eq $runAtDate) { $runAtDate = (Get-Date).ToUniversalTime() }
          $runAt = $runAtDate.ToString('yyyy-MM-dd HH:mm', $ci) + ' UTC'
          $to = Get-QbrDay $runAtDate
          $from = if ($null -ne $tix) { Get-QbrDay (Get-QbrProp $tix 'currentFrom') } else { '' }
          if (-not $from) { $from = $runAtDate.AddDays(-$days).ToString('d MMM yyyy', $ci) }

          $sb = New-Object System.Text.StringBuilder
          $headline = New-Object System.Collections.ArrayList
          $null = $sb.Append("<p>This CloudRadial Planner card gathers the numbers for $(Enc $companyName)'s quarterly business review ($(Enc $quarterLabel)). It covers the $days days from $(Enc $from) to $(Enc $to). Nothing was changed in any system to build it.</p>")

          # ---- devices ----
          $devSentence = ''
          if ($null -ne $dev -and [bool](Get-QbrProp $dev 'available')) {
              $total = [int](Get-QbrProp $dev 'total')
              if ($total -eq 0) { $devSentence = "No managed devices are recorded for $(Enc $companyName) in CloudRadial." }
              else {
                  $age = Get-QbrProp $dev 'age'; $war = Get-QbrProp $dev 'warranty'; $os = Get-QbrProp $dev 'os'
                  $old = [int](Get-QbrProp $age '5 to 7 years') + [int](Get-QbrProp $age '7 years or more'); $veryOld = [int](Get-QbrProp $age '7 years or more')
                  $parts = @("$(Enc $companyName) has $(Get-QbrCount $total 'managed device' 'managed devices'): $(Get-QbrCount (Get-QbrProp $dev 'workstations') 'workstation' 'workstations'), $(Get-QbrCount (Get-QbrProp $dev 'servers') 'server' 'servers') and $(Get-QbrCount (Get-QbrProp $dev 'virtual') 'virtual machine' 'virtual machines').")
                  if ($old) { $parts += "$(Get-QbrCount $old 'device is' 'devices are') 5 or more years old$(if ($veryOld) { ", $veryOld of them 7 or more" })." }
                  $exp = [int](Get-QbrProp $war 'expired'); $soon = [int](Get-QbrProp $war 'expiring')
                  if ($exp -or $soon) { $parts += "The warranty has expired on $(Get-QbrCount $exp 'device' 'devices'), and $(Get-QbrCount $soon 'more ends' 'more end') within 90 days." }
                  $uns = [int](Get-QbrProp $os 'unsupported'); if ($uns) { $parts += "$(Get-QbrCount $uns 'device runs' 'devices run') an operating system that no longer gets security updates." }
                  $rep = [int](Get-QbrProp $dev 'replace'); if ($rep) { $parts += "By the Endpoint LifeCycle Manager rules, $(Get-QbrCount $rep 'workstation is' 'workstations are') due for replacement." }
                  $stale = [int](Get-QbrProp $dev 'stale'); if ($stale) { $parts += "$(Get-QbrCount $stale 'device has' 'devices have') not checked in for 30 days." }
                  $devSentence = $parts -join ' '
                  $null = $headline.Add((Get-QbrCount $total 'device' 'devices') + $(if ($old) { " ($old aged 5 years or more)" } else { '' }))
              }
          }
          else { $devSentence = "Device data was not available: $(Enc (Get-QbrProp $dev 'reason'))" }
          $null = $sb.Append("<p>$devSentence</p>")

          # ---- tickets ----
          function Get-QbrTrend {
              param($cur, $prev)
              if ($null -eq $prev -or $null -eq $cur) { return '' }
              $c = [int]$cur; $p = [int]$prev
              if ($p -eq 0) { if ($c -eq 0) { return ', the same as the previous period' }; return ', compared with none in the previous period' }
              if ($c -eq $p) { return ", the same as the $p in the previous period" }
              $pct = [int][Math]::Round([Math]::Abs($c - $p) * 100.0 / $p)
              return ", $(if ($c -gt $p) { 'up' } else { 'down' }) $pct% from $p in the previous period"
          }
          $tixAvailable = ($null -ne $tix -and [bool](Get-QbrProp $tix 'available'))
          if ($tixAvailable) {
              $oc = Get-QbrProp $tix 'openedCurrent'; $op = Get-QbrProp $tix 'openedPrevious'; $cc = Get-QbrProp $tix 'closedCurrent'; $cp = Get-QbrProp $tix 'closedPrevious'; $on = Get-QbrProp $tix 'openNow'
              $label = [string](Get-QbrProp $tix 'categoryLabel'); $cats = @(Get-QbrProp $tix 'categories' | Where-Object { $null -ne $_ })
              $s = "In $(Enc (Get-QbrProp $tix 'psaName')), $(if ($null -ne $oc) { Get-QbrCount $oc 'ticket was' 'tickets were' } else { 'the number of tickets' }) opened in the last $days days$(Get-QbrTrend $oc $op)"
              $s += ", and $(if ($null -ne $cc) { "$cc were closed" } else { 'the closed count is not available' })$(Get-QbrTrend $cc $cp)."
              if ($null -ne $on) { $s += " $(Get-QbrCount $on 'ticket is' 'tickets are') open now." }
              if ($cats.Count) { $s += " The most common $(Enc $label) was $(Enc (Get-QbrProp $cats[0] 'name')) ($(Get-QbrCount (Get-QbrProp $cats[0] 'count') 'ticket' 'tickets'))." }
              $null = $sb.Append("<p>$s</p>")
              if ($null -ne $oc) { $null = $headline.Add("$(Get-QbrCount $oc 'ticket' 'tickets') opened in $days days") }
          }
          else { $why = [string](Get-QbrProp $tix 'reason'); if (-not $why) { $why = 'Ticket trends from the PSA are not available.' }; $null = $sb.Append("<p>$(Enc $why)</p>") }

          # ---- licences ----
          $licAvailable = ($null -ne $lic -and [bool](Get-QbrProp $lic 'available'))
          $skus = @()
          if ($licAvailable) {
              $skus = @(Get-QbrProp $lic 'skus' | Where-Object { $null -ne $_ })
              $pur = [int](Get-QbrProp $lic 'purchased'); $asg = [int](Get-QbrProp $lic 'assigned'); $un = [Math]::Max(0, $pur - $asg)
              if (-not $skus.Count) { $null = $sb.Append('<p>Microsoft 365 shows no paid licences for this tenant.</p>') }
              else {
                  $s = "Microsoft 365 has $(Get-QbrCount $pur 'paid licence' 'paid licences') across $(Get-QbrCount $skus.Count 'subscription' 'subscriptions'), with $asg assigned and $un unassigned."
                  $most = @($skus | Sort-Object @{ Expression = { [int](Get-QbrProp $_ 'unassigned') }; Descending = $true }) | Select-Object -First 1
                  if ([int](Get-QbrProp $most 'unassigned') -gt 0) { $s += " The most unassigned is $(Enc (Get-QbrProp $most 'name')), with $(Get-QbrProp $most 'unassigned') of $(Get-QbrProp $most 'purchased') not in use." }
                  $null = $sb.Append("<p>$s</p>")
                  if ($un) { $null = $headline.Add("$(Get-QbrCount $un 'unassigned licence' 'unassigned licences')") }
              }
          }
          else { $why = [string](Get-QbrProp $lic 'reason'); if (-not $why) { $why = 'Microsoft 365 licence usage is not included.' }; $null = $sb.Append("<p>$(Enc $why)</p>") }

          # ---- domains and certificates ----
          $domItems = @(); $certItems = @()
          $expParts = @()
          if ($null -ne $dom -and [bool](Get-QbrProp $dom 'available')) {
              $domItems = @(Get-QbrProp $dom 'items' | Where-Object { $null -ne $_ })
              $expParts += $(if ($domItems.Count) { "$(Get-QbrCount $domItems.Count 'domain has' 'domains have') expired or will expire within 60 days" } else { 'no domains expire within 60 days' })
          }
          else { $expParts += 'domain expiry dates were not available' }
          if ($null -ne $cert -and [bool](Get-QbrProp $cert 'available')) {
              $certItems = @(Get-QbrProp $cert 'items' | Where-Object { $null -ne $_ })
              $expParts += $(if ($certItems.Count) { "$(Get-QbrCount $certItems.Count 'certificate has' 'certificates have') expired or will expire within 30 days" } else { 'no certificates expire within 30 days' })
          }
          else { $expParts += 'certificate expiry dates were not available' }
          $es = ($expParts -join ', and ')
          $null = $sb.Append("<p>$($es.Substring(0, 1).ToUpperInvariant())$($es.Substring(1)).")
          if ($null -ne $plan -and [bool](Get-QbrProp $plan 'available')) { $po = [int](Get-QbrProp $plan 'open'); $null = $sb.Append(" There $(if ($po -eq 1) { 'is 1 other open card' } else { "are $po other open cards" }) on this Planner board.") }
          $null = $sb.Append('</p>')
          if ($domItems.Count + $certItems.Count) { $null = $headline.Add("$(Get-QbrCount ($domItems.Count + $certItems.Count) 'domain or certificate' 'domains or certificates') expiring soon") }

          # ---- tables ----
          if ($null -ne $dev -and [bool](Get-QbrProp $dev 'available') -and [int](Get-QbrProp $dev 'total') -gt 0) {
              $age = Get-QbrProp $dev 'age'; $war = Get-QbrProp $dev 'warranty'; $os = Get-QbrProp $dev 'os'
              $rows = @(foreach ($k in @('Under 3 years', '3 to 5 years', '5 to 7 years', '7 years or more', 'Unknown')) { , @($k, [string][int](Get-QbrProp $age $k)) })
              Add-QbrTable $sb 'Physical devices by age' @('Age', 'Devices') $rows
              if ([int](Get-QbrProp $dev 'ageEstimated')) { $null = $sb.Append("<p>$(Get-QbrCount (Get-QbrProp $dev 'ageEstimated') 'age is' 'ages are') estimated from the BIOS or processor date.</p>") }
              $rows = @(foreach ($k in @(@('Expired', 'expired'), @('Ends within 90 days', 'expiring'), @('Active', 'active'), @('No date on file', 'unknown'))) { , @($k[0], [string][int](Get-QbrProp $war $k[1])) })
              Add-QbrTable $sb 'Warranty (physical devices)' @('Warranty', 'Devices') $rows
              $rows = @(foreach ($k in @(@('Supported', 'supported'), @('No longer gets security updates', 'unsupported'), @('Version unknown', 'unknown'), @('Not Windows or macOS', 'other'))) { , @($k[0], [string][int](Get-QbrProp $os $k[1])) })
              Add-QbrTable $sb 'Operating system' @('Support', 'Devices') $rows
              $soonList = @(Get-QbrProp $dev 'warrantySoon' | Where-Object { $null -ne $_ })
              if ($soonList.Count) {
                  Add-QbrTable $sb 'Warranties ending within 90 days' @('Device', 'Warranty ends') @($soonList | Select-Object -First 10 | ForEach-Object { , @([string](Get-QbrProp $_ 'name'), [string](Get-QbrProp $_ 'ends')) })
                  if ($soonList.Count -gt 10) { $null = $sb.Append("<p>$($soonList.Count - 10) more are in the workflow run output.</p>") }
              }
          }
          if ($tixAvailable) {
              $rows = @(@(, @('Opened', (Get-QbrNum $oc), (Get-QbrNum $op))) + @(, @('Closed', (Get-QbrNum $cc), (Get-QbrNum $cp))) + @(, @('Open now', (Get-QbrNum $on), '')))
              Add-QbrTable $sb 'Tickets' @('Measure', "Last $days days", "Previous $days days") $rows
              if ($cats.Count) {
                  $lbl = [string](Get-QbrProp $tix 'categoryLabel')
                  Add-QbrTable $sb "Tickets opened this period, top 5 by $lbl" @(($lbl.Substring(0, 1).ToUpperInvariant() + $lbl.Substring(1)), 'Tickets') @($cats | ForEach-Object { , @([string](Get-QbrProp $_ 'name'), [string](Get-QbrProp $_ 'count')) })
              }
              foreach ($n in @(Get-QbrProp $tix 'notes' | Where-Object { $_ })) { $null = $sb.Append("<p>$(Enc $n)</p>") }
          }
          if ($licAvailable -and $skus.Count) {
              Add-QbrTable $sb 'Microsoft 365 licences' @('Licence', 'Purchased', 'Assigned', 'Unassigned') @($skus | Select-Object -First 15 | ForEach-Object { , @([string](Get-QbrProp $_ 'name'), [string](Get-QbrProp $_ 'purchased'), [string](Get-QbrProp $_ 'assigned'), [string](Get-QbrProp $_ 'unassigned')) })
              if ($skus.Count -gt 15) { $null = $sb.Append("<p>$($skus.Count - 15) more subscriptions are in the workflow run output.</p>") }
          }
          if ($domItems.Count + $certItems.Count) {
              $rows = @(@($domItems | ForEach-Object { , @('Domain', [string](Get-QbrProp $_ 'name'), [string](Get-QbrProp $_ 'expires'), $(if ([int](Get-QbrProp $_ 'daysLeft') -lt 0) { 'Expired' } else { [string](Get-QbrProp $_ 'daysLeft') })) }) + @($certItems | ForEach-Object { , @('Certificate', [string](Get-QbrProp $_ 'name'), [string](Get-QbrProp $_ 'expires'), $(if ([int](Get-QbrProp $_ 'daysLeft') -lt 0) { 'Expired' } else { [string](Get-QbrProp $_ 'daysLeft') })) }))
              Add-QbrTable $sb 'Expiring domains and certificates' @('Type', 'Name', 'Expires', 'Days left') $rows
          }
          # Section reasons are already said in their own paragraph; any other warning goes at the end as a note.
          $shown = @(foreach ($sec in @($dev, $tix, $lic, $dom, $cert, $plan)) { [string](Get-QbrProp $sec 'reason') })
          $cardNotes = @($warnings | Where-Object { $_ -and $shown -notcontains $_ })
          foreach ($w in $cardNotes) { $null = $sb.Append("<p>Note: $(Enc $w)</p>") }
          $null = $sb.Append("<p>This card is prepared by the QBR Data Pack automation and updated in place if it runs again this quarter.</p>")

          $summary = "Numbers for the $quarterLabel review: $(if ($headline.Count) { ($headline -join ', ') } else { 'see the card for details' })."
          $psaLine = if ($tixAvailable) { "$([string](Get-QbrProp $tix 'psaName')) company $([string](Get-QbrProp $tix 'psaCompanyId')) (matched by $([string](Get-QbrProp $tix 'matchedBy')))" } else { 'not used' }
          $m365Line = if ($licAvailable) { "tenant $([string](Get-QbrProp $lic 'tenantId')) (matched by $([string](Get-QbrProp $lic 'matchedBy')))" } else { 'not used' }
          $internal = "Internal: CloudRadial company $companyId (chosen by $([string](Get-QbrProp $in 'companyVia'))). PSA: $psaLine. Microsoft 365: $m365Line. Gathered $runAt over $days days. Marker: $CardKey."

          # ---- the card ----
          try { $null = Connect-Cr } catch { Stop-QbrCard ([string]$_.Exception.Message) }
          $cards = @()
          try { $cards = @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $companyId" | Where-Object { $null -ne $_ -and [int](Get-QbrProp $_ 'companyId') -eq $companyId }) }
          catch { Stop-QbrCard "Couldn't read the Planner cards for $($companyName): $($_.Exception.Message)" }
          $fields = [ordered]@{ body = $sb.ToString(); summary = $summary; notes = $internal; status = 0; priority = 0 }
          $r = $null
          try { $r = Set-CrPlannerCard -CompanyId $companyId -Subject $CardSubject -Key $CardKey -Existing $cards -Fields $fields -Preview:$preview }
          catch { Stop-QbrCard "Couldn't write the Planner card for $($companyName): $($_.Exception.Message)" }
          if ($r.optionalFieldsDropped) { $null = $warnings.Add('This portal did not accept the internal notes field, so the card was written without it.') }

          $verb = switch ($r.action) { 'created' { 'added to' } 'updated' { 'updated on' } 'would-create' { 'would be added to' } default { 'would be updated on' } }
          $msg = if ($preview) { "Preview only: the CloudRadial Planner card '$CardSubject' $verb $companyName's board when this runs without preview. $summary Nothing was changed." }
          else { "The CloudRadial Planner card '$CardSubject' was $verb $companyName's board for the vCIO. $summary Nothing else was changed." }

          Set-NodeOutput ([ordered]@{
                  status        = $(if ($preview) { 'pending_confirmation' } else { 'success' })
                  message       = $msg
                  public_note   = ''
                  internal_note = $internal
                  ticket_id     = ''
                  actions       = @("Planner card $($r.action)")
                  warnings      = @($warnings)
                  companyId     = $companyId
                  companyName   = $companyName
                  quarterLabel  = $quarterLabel
                  cardAction    = $r.action
                  productId     = [string]$r.productId
                  cardSubject   = $CardSubject
                  cardBody      = $sb.ToString()
                  devices       = $dev
                  tickets       = $tix
                  licences      = $lic
                  domains       = $dom
                  certificates  = $cert
                  planner       = $plan
              })
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: end
      name: End
      type: end
      position:
        x: 1400
        'y': 120
  connections:
    - source: start
      target: node-inputs
      sourceHandle: null
    - source: node-inputs
      target: node-cloudradial
      sourceHandle: null
    - source: node-cloudradial
      target: node-psa
      sourceHandle: null
    - source: node-psa
      target: node-m365
      sourceHandle: null
    - source: node-m365
      target: node-card
      sourceHandle: null
    - source: node-card
      target: end
      sourceHandle: null
  startActivityId: start
