automationsWorkflow: 1
name: Risky Sign-in Response
description: 'Hourly check for users Microsoft Entra ID Protection has at high risk. For each new one it opens a high-priority PSA ticket (critical for admins) with the risk detail only in an internal note, signs the user out everywhere, requires a password change at next sign-in and emails their manager a short notice. It never blocks an account unless rerun with confirm true and block_upns, and only while the account is still at risk. Needs Entra ID P2.'
definition:
  schemaVersion: 1
  activities:
  - id: start
    name: Start
    type: start
    position:
      x: 100
      y: 200
    properties:
      # Manual run or hourly Routine: the first step reads Get-NodeInput, so the webhook stays off.
      webhookEnabled: false
  - id: node-inputs
    name: Read inputs
    type: powershell-script
    position:
      x: 280
      y: 200
    properties:
      script: |-
        # === NODE: Read inputs ===
        # Reads the run input and fills in defaults. An hourly Routine sends no input, so every field is optional:
        #   min_risk         high (default) = only high-risk users. medium = medium and high
        #   lookback_days    how far back to read risk detections for the internal note (default 7, 1 to 90)
        #   preview          false (default) = respond to new risky users. true = read and plan only, change nothing
        #   notify_manager   true (default) = email each new risky user's manager through Notify-FromMailbox
        #   confirm          false (default). true = block the accounts in block_upns (only those still at risk now)
        #   block_upns       comma-separated sign-in names to block (only used when confirm is true)
        #   company_id       CloudRadial company id (default: the CloudRadial-CompanyId secret)
        #   psa              optional PSA override (default: the PSA-Type secret)
        #   psa_company_id   the company's id in the PSA (default: the PSA-CompanyId secret, then a lookup by name)
        #   tenant_id        optional Microsoft 365 tenant id; when given it must be this runner's tenant
        # A value CloudRadial left as a literal @token (for example "@block_upns") counts as not given.
        $ErrorActionPreference = 'Stop'
        function Get-RsProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-RsText {
            param($o, [string[]]$Names)
            foreach ($n in $Names) {
                $v = Get-RsProp $o $n
                if ($null -eq $v) { continue }
                if ($v -is [array]) { $v = (@($v | Where-Object { $null -ne $_ } | ForEach-Object { [string]$_ }) -join ',') }
                $t = ([string]$v).Trim()
                if ($t -ne '' -and -not $t.StartsWith('@')) { return $t }
            }
            return ''
        }
        function Test-RsYes { param([string]$v, [bool]$Default) if ([string]::IsNullOrWhiteSpace($v)) { return $Default }; return (@('true', 'yes', 'y', '1') -contains $v.Trim().ToLowerInvariant()) }
        function Get-RsSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; if ([string]::IsNullOrWhiteSpace($v)) { return '' }; return $v.Trim() }
        function Stop-RsInput {
            param([string]$Msg)
            Set-NodeOutput ([ordered]@{ status = 'incomplete'; message = $Msg; public_note = ''; internal_note = "Risky sign-in response did not run: $Msg"; ticket_id = ''; actions = @(); warnings = @() })
            throw $Msg
        }

        $runIn = Get-NodeInput
        foreach ($k in @('trigger', 'body', 'input')) { $w = Get-RsProp $runIn $k; if ($null -ne $w) { $runIn = $w } }
        if ($runIn -is [string]) {
            if ([string]::IsNullOrWhiteSpace($runIn)) { $runIn = $null }
            else { try { $runIn = $runIn | ConvertFrom-Json } catch { Stop-RsInput 'The run input is text that is not valid JSON. Nothing was changed.' } }
        }

        $minRisk = (Get-RsText $runIn @('min_risk', 'minRisk', 'risk_level')).ToLowerInvariant()
        if ($minRisk -eq '') { $minRisk = 'high' }
        if (@('high', 'medium') -notcontains $minRisk) { Stop-RsInput "min_risk must be high or medium (it was '$minRisk'). Nothing was changed." }

        $lbText = Get-RsText $runIn @('lookback_days', 'lookbackDays')
        $lookback = 7
        if ($lbText -ne '') {
            if ($lbText -notmatch '^\d+$' -or [int64]$lbText -lt 1 -or [int64]$lbText -gt 90) { Stop-RsInput "lookback_days must be a whole number from 1 to 90 (it was '$lbText'). Nothing was changed." }
            $lookback = [int]$lbText
        }

        $preview = Test-RsYes (Get-RsText $runIn @('preview', 'dry_run', 'dryRun')) $false
        $notify = Test-RsYes (Get-RsText $runIn @('notify_manager', 'notifyManager')) $true
        $confirm = Test-RsYes (Get-RsText $runIn @('confirm', 'approvedToWrite')) $false

        $warnings = @()
        $block = @()
        foreach ($part in ((Get-RsText $runIn @('block_upns', 'blockUpns', 'block')) -split '[,;\s]+')) {
            $t = $part.Trim().Trim('"', "'")
            if ($t -eq '') { continue }
            if ($t -match '^[^@\s]+@[^@\s]+$' -or $t -match '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$') { if ($block -notcontains $t.ToLowerInvariant()) { $block += $t.ToLowerInvariant() } }
            else { $warnings += "Ignored '$t' in block_upns: it is not a sign-in name." }
        }
        if ($block.Count -and -not $confirm) { $warnings += 'block_upns was given but confirm is false, so this run only previews those blocks.' }
        if ($confirm -and $preview) { $warnings += 'preview is true, so confirm was ignored and nothing was blocked.'; $confirm = $false }

        $companyId = Get-RsText $runIn @('company_id', 'companyId', 'CompanyId')
        if ($companyId -eq '') { $companyId = Get-RsSecret 'CloudRadial-CompanyId' }
        if ($companyId -ne '' -and $companyId -notmatch '^\d+$') { Stop-RsInput "company_id must be the CloudRadial company number (it was '$companyId'). Nothing was changed." }

        $psaCompany = Get-RsText $runIn @('psa_company_id', 'psaCompanyId', 'CompanyPsaId')
        if ($psaCompany -eq '') { $psaCompany = Get-RsSecret 'PSA-CompanyId' }

        $tenantIn = (Get-RsText $runIn @('tenant_id', 'tenantId', 'companyTenantId', 'CompanyTenantId')).ToLowerInvariant()
        if ($tenantIn -ne '' -and $tenantIn -notmatch '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$') { Stop-RsInput "tenant_id must be a Microsoft 365 tenant id (a GUID). It was '$tenantIn'. Nothing was changed." }

        Set-NodeOutput ([ordered]@{
                status        = 'running'
                message       = ''
                public_note   = ''
                internal_note = ''
                ticket_id     = ''
                actions       = @()
                warnings      = @($warnings)
                inputs        = [ordered]@{
                    min_risk       = $minRisk
                    lookback_days  = $lookback
                    preview        = $preview
                    notify_manager = $notify
                    confirm        = $confirm
                    block_upns     = @($block)
                    company_id     = $companyId
                    psa            = (Get-RsText $runIn @('psa', 'PSA'))
                    psa_company_id = $psaCompany
                    tenant_id      = $tenantIn
                }
            })
      timeoutSeconds: 120
      retryCount: 0
      parameters: []
      aiExtensions: []
      testInput: |-
        {
          "min_risk": "high",
          "preview": true,
          "notify_manager": true,
          "confirm": false,
          "block_upns": "",
          "company_id": "",
          "psa": "",
          "psa_company_id": ""
        }
  - id: node-find
    name: Find risky users
    type: powershell-script
    position:
      x: 480
      y: 200
    properties:
      script: |-
        # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
        # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
        # Signs in with the app registration's client credentials from the runner Key Vault.
        # Each helper names the Graph application permission it needs; when Graph answers 403,
        # the error says which permission to grant (with admin consent).
        # All state lives in the $GraphState hashtable and is changed in place, because the runner
        # runs a step in a child scope where $script: variables don't behave.

        $GraphState = @{
            Base           = 'https://graph.microsoft.com'
            Headers        = $null
            Creds          = $null
            TenantId       = ''
            ExpiresAt      = [datetime]::MinValue
            MaxAttempts    = 5
            MaxWaitSeconds = 120
            LastStatus     = 0
        }

        # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
        # The first secret that has a value, from a list of names.
        function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
        function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
        function Get-GraphRetryAfter {
            param($Err, [int]$Attempt)
            $s = 0
            try {
                $ra = $Err.Exception.Response.Headers.RetryAfter
                if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
            } catch { }
            if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
            return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
        }
        # Graph's own error message when there is one, otherwise the exception text.
        function Get-GraphErrorText {
            param($Err)
            $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
            if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
            return [string]$Err.Exception.Message
        }
        function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

        function Update-GraphToken {
            $c = $GraphState.Creds
            if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
            $r = $null
            try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
            catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
            $tok = Get-GraphProp $r 'access_token'
            if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
            $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
            $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
            $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
        }

        # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
        # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
        # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
        # Returns @{ TenantId }.
        function Connect-Graph {
            param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
            if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
            $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
            $GraphState.TenantId = $TenantId.Trim()
            Update-GraphToken
            return @{ TenantId = $GraphState.TenantId }
        }

        # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
        # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
        # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
        # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
        function Invoke-Graph {
            param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
            if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
            $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
            $short = $uri.Replace($GraphState.Base, '')
            $reauth = $false
            for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                try {
                    $r = Invoke-RestMethod @p
                    $GraphState.LastStatus = 200
                    return $r
                }
                catch {
                    $code = Get-GraphHttpStatus $_
                    $GraphState.LastStatus = $code
                    if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                    if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                    $why = Get-GraphErrorText $_
                    if ($code -eq 403) {
                        $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                        throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                    }
                    throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                }
            }
        }

        # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
        function Get-GraphAll {
            param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
            $rows = New-Object System.Collections.ArrayList
            $next = $Path; $n = 0
            while ($next -and $n -lt $MaxPages) {
                $n++
                $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                $next = [string](Get-GraphProp $r '@odata.nextLink')
            }
            return @($rows)
        }

        # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
        function Get-GraphUser {
            param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
            try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
            catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
        }

        # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
        # Mail-enabled security groups and distribution lists can't be changed through Graph.
        function Add-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
            catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
        }

        # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
        function Remove-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
            catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
        }

        # Sets the user's manager. Needs User.ReadWrite.All.
        function Set-GraphManager {
            param([string]$UserId, [string]$ManagerId)
            $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
        }

        # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
        function Revoke-GraphSessions {
            param([string]$UserId)
            $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
        }

        # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
        # Disabling an admin account also needs a privileged role, which app permissions can't grant.
        function Set-GraphAccountEnabled {
            param([string]$UserId, [bool]$Enabled)
            $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
        }

        # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
        # The user must have a usage location before a licence can be added.
        function Set-GraphLicense {
            param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
            $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
            $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
            if (-not $toAdd.Count -and -not $toRemove.Count) { return }
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
            catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
        }

        # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
        # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
        function Get-GraphSignInActivity {
            param([string]$UserId = '')
            $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
            $perm = 'AuditLog.Read.All (with User.Read.All)'
            if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
            # Graph caps the page size at 120 when signInActivity is selected.
            return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
        }

        # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
        function Get-GraphAuthMethods {
            param([string]$UserId)
            return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
        }

        # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
        # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
        function Remove-GraphAuthMethod {
            param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
            if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
            $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
            $seg = @{
                microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                phoneAuthenticationMethod                  = 'phoneMethods'
                fido2AuthenticationMethod                  = 'fido2Methods'
                emailAuthenticationMethod                  = 'emailMethods'
                softwareOathAuthenticationMethod           = 'softwareOathMethods'
                windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
            }
            if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
            if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
            $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
        }

        # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
        # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
        function Get-GraphRiskyUsers {
            param([string]$UserId = '', [switch]$AtRiskOnly)
            $perm = 'IdentityRiskyUser.Read.All'
            if ($UserId) {
                try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
            }
            $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
            return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
        }

        # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
        function New-GraphTempPassword {
            param([int]$Length = 16)
            if ($Length -lt 8) { $Length = 8 }
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
            $all = -join $sets
            $rng = [System.Security.Cryptography.RandomNumberGenerator]
            $chars = New-Object System.Collections.Generic.List[char]
            foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
            while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
            for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
            return -join $chars
        }
        # ---------- end _shared/graph.ps1 ----------
        # <<< _shared/graph.ps1

        # === NODE: Find risky users (read-only) ===
        # Reads the users Microsoft Entra ID Protection has at risk now (riskState atRisk) at min_risk or above
        # (needs IdentityRiskyUser.Read.All and Entra ID P2), their recent risk detections for the internal note
        # (needs IdentityRiskEvent.Read.All), their account details and manager (User.Read.All), and who holds a
        # directory admin role (RoleManagement.Read.Directory). Changes nothing.
        # A missing licence or permission for the risk data stops the run with a plain sentence naming it.
        # A missing role-read permission only warns: those users are still ticketed, at high priority.
        $ErrorActionPreference = 'Stop'
        function Get-RsProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Read-RsState {
            param([string]$Needs, [string]$From)
            $raw = Get-NodeInput
            if ($null -ne $raw -and $null -eq (Get-RsProp $raw 'inputs') -and $null -ne (Get-RsProp $raw 'output')) { $raw = Get-RsProp $raw 'output' }
            $st = [ordered]@{}
            if ($raw -is [System.Collections.IDictionary]) { foreach ($k in $raw.Keys) { $st[[string]$k] = $raw[$k] } }
            elseif ($null -ne $raw) { foreach ($p in $raw.PSObject.Properties) { $st[$p.Name] = $p.Value } }
            foreach ($k in @('status', 'message', 'public_note', 'internal_note', 'ticket_id', 'tenant_id', 'checked_at')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('actions', 'warnings', 'risky')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k]) } }
            if (-not $st.Contains('inputs') -or $null -eq $st['inputs'] -or ($Needs -and -not $st.Contains($Needs))) { throw "This step expects the output of the $From step." }
            return $st
        }
        function Stop-RsRun {
            param($St, [string]$Msg, [string]$Status = 'error')
            $St['status'] = $Status; $St['message'] = $Msg; $St['internal_note'] = "Risky sign-in response stopped: $Msg"
            Set-NodeOutput $St
            throw $Msg
        }
        function ConvertTo-RsIso {
            param($v)
            if ($null -eq $v) { return '' }
            if ($v -is [datetime]) { $d = $v; if ($d.Kind -eq [DateTimeKind]::Unspecified) { $d = [datetime]::SpecifyKind($d, [DateTimeKind]::Utc) }; return $d.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }
            $t = [string]$v; if ([string]::IsNullOrWhiteSpace($t)) { return '' }
            $d = [datetime]::MinValue
            if ([datetime]::TryParse($t, [Globalization.CultureInfo]::InvariantCulture, ([Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal), [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }
            return $t
        }
        # Plain names for Identity Protection detection types; anything else is shown as Microsoft names it.
        $RsLabels = @{
            unfamiliarFeatures = 'Unfamiliar sign-in properties'; anonymizedIPAddress = 'Sign-in from an anonymous IP address'; maliciousIPAddress = 'Sign-in from a malicious IP address'
            unlikelyTravel = 'Atypical travel'; impossibleTravel = 'Impossible travel'; leakedCredentials = 'Leaked credentials'; passwordSpray = 'Password spray'
            investigationsThreatIntelligence = 'Microsoft threat intelligence'; adminConfirmedUserCompromised = 'Admin confirmed the user compromised'; newCountry = 'Sign-in from a new country'
            suspiciousInboxForwarding = 'Suspicious inbox forwarding'; mcasSuspiciousInboxManipulationRules = 'Suspicious inbox manipulation rules'; anomalousToken = 'Anomalous token'
            tokenIssuerAnomaly = 'Token issuer anomaly'; suspiciousBrowser = 'Suspicious browser'; malwareInfectedIPAddress = 'Sign-in from a malware-linked IP address'
            attackerinTheMiddle = 'Attacker in the middle'; suspiciousAPITraffic = 'Suspicious API traffic'; mfaFraud = 'User reported MFA fraud'; suspiciousSendingPatterns = 'Suspicious sending patterns'
            anomalousUserActivity = 'Anomalous user activity'; generic = 'Additional risk detected'
        }

        $rs = Read-RsState '' 'Read inputs'
        $opt = $rs['inputs']
        $levels = @('high'); if ([string](Get-RsProp $opt 'min_risk') -eq 'medium') { $levels = @('high', 'medium') }
        $lookback = [int](Get-RsProp $opt 'lookback_days')

        try { $conn = Connect-Graph } catch { Stop-RsRun $rs "Couldn't sign in to Microsoft 365: $($_.Exception.Message) Nothing was changed." }
        $rs['tenant_id'] = [string]$conn.TenantId
        $tenantWanted = [string](Get-RsProp $opt 'tenant_id')
        if ($tenantWanted -and $tenantWanted -ne ([string]$conn.TenantId).ToLowerInvariant()) {
            Stop-RsRun $rs 'The run asked for a different Microsoft 365 tenant than the one this runner is set up for, so nothing was read or changed.' 'rejected'
        }
        $rs['checked_at'] = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC'

        # 1. Users at risk now.
        $all = @()
        try { $all = @(Get-GraphRiskyUsers -AtRiskOnly) }
        catch {
            $m = [string]$_.Exception.Message
            if ($m -match '(?i)licen[cs]|premium|\bP2\b') { Stop-RsRun $rs "Can't read risky users because this Microsoft 365 tenant doesn't have Microsoft Entra ID P2 (included in Microsoft 365 E5 and Entra ID Governance). Nothing was changed." }
            if ($m -match '\(403 Forbidden\)') { Stop-RsRun $rs "Can't read risky users. The app registration needs the IdentityRiskyUser.Read.All application permission, with admin consent. Nothing was changed." }
            Stop-RsRun $rs "Couldn't read risky users from Microsoft Entra ID Protection: $m Nothing was changed."
        }
        $atRisk = @($all | Where-Object {
                $null -ne $_ -and [string](Get-RsProp $_ 'riskState') -eq 'atRisk' -and $levels -contains ([string](Get-RsProp $_ 'riskLevel')).ToLowerInvariant() -and (Get-RsProp $_ 'isDeleted') -ne $true
            })
        $rs['counts'] = [ordered]@{ at_risk_any_level = @($all | Where-Object { $null -ne $_ }).Count; at_risk_in_scope = $atRisk.Count }

        # 2. Who holds a directory admin role. Only read when someone is at risk.
        $admins = @{}
        $adminKnown = $true
        if ($atRisk.Count) {
            try {
                foreach ($r in @(Get-GraphAll -Path "/v1.0/directoryRoles?`$select=id,displayName&`$expand=members" -Permission 'RoleManagement.Read.Directory')) {
                    $roleName = [string](Get-RsProp $r 'displayName')
                    foreach ($mbr in @(Get-RsProp $r 'members')) {
                        if ($null -eq $mbr) { continue }
                        $ids = @([string](Get-RsProp $mbr 'id'))
                        if ([string](Get-RsProp $mbr '@odata.type') -match 'group$') { $ids = @(Get-GraphAll -Path "/v1.0/groups/$(Get-RsProp $mbr 'id')/transitiveMembers?`$select=id" -Permission 'GroupMember.Read.All' | ForEach-Object { [string](Get-RsProp $_ 'id') }) }
                        foreach ($i in $ids) { if (-not $i) { continue }; if (-not $admins.ContainsKey($i)) { $admins[$i] = @() }; if ($admins[$i] -notcontains $roleName) { $admins[$i] += $roleName } }
                    }
                }
            }
            catch {
                $adminKnown = $false
                $m = [string]$_.Exception.Message
                $perm = if ($m -match 'GroupMember\.Read\.All') { 'GroupMember.Read.All' } else { 'RoleManagement.Read.Directory' }
                $rs['warnings'] = @(@($rs['warnings']) + $(if ($m -match '\(403 Forbidden\)') { "Couldn't check which risky users hold an admin role, so none is marked critical. The app registration needs the $perm application permission, with admin consent." } else { "Couldn't check which risky users hold an admin role, so none is marked critical: $m" }))
            }
        }

        # 3. Each risky user's account, manager and recent detections.
        $since = (Get-Date).ToUniversalTime().AddDays(-$lookback).ToString('yyyy-MM-ddTHH:mm:ssZ')
        $rows = New-Object System.Collections.ArrayList
        foreach ($ru in $atRisk) {
            $id = [string](Get-RsProp $ru 'id')
            $upn = [string](Get-RsProp $ru 'userPrincipalName')
            $u = $null
            try { $u = Get-GraphUser -Id $id -Select 'id,userPrincipalName,displayName,mail,accountEnabled,onPremisesSyncEnabled' }
            catch { if ($_.Exception.Message -match '\(403 Forbidden\)') { Stop-RsRun $rs "Can't read the risky users' accounts. The app registration needs the User.Read.All application permission, with admin consent. Nothing was changed." }; throw }
            if ($null -eq $u) { $rs['warnings'] = @(@($rs['warnings']) + "Risky user $upn no longer exists in the directory, so it was skipped."); continue }
            if (Get-RsProp $u 'userPrincipalName') { $upn = [string](Get-RsProp $u 'userPrincipalName') }

            $mgr = $null
            try {
                $mr = Invoke-Graph -Method GET -Path "/v1.0/users/$id/manager?`$select=id,displayName,mail,userPrincipalName" -Permission 'User.Read.All'
                if ($null -ne $mr) { $mgr = [ordered]@{ id = [string](Get-RsProp $mr 'id'); name = [string](Get-RsProp $mr 'displayName'); mail = [string](Get-RsProp $mr 'mail'); upn = [string](Get-RsProp $mr 'userPrincipalName') } }
            }
            catch { if ($GraphState.LastStatus -ne 404) { $rs['warnings'] = @(@($rs['warnings']) + "Couldn't read the manager of $($upn): $($_.Exception.Message)") } }

            $dets = @()
            try {
                $f = [uri]::EscapeDataString("userId eq '$id' and detectedDateTime ge $since")
                $dets = @(Get-GraphAll -Path "/v1.0/identityProtection/riskDetections?`$filter=$f&`$top=50" -Permission 'IdentityRiskEvent.Read.All' -MaxPages 2)
            }
            catch {
                $m = [string]$_.Exception.Message
                if ($m -match '(?i)licen[cs]|premium|\bP2\b') { Stop-RsRun $rs "Can't read risk detections because this Microsoft 365 tenant doesn't have Microsoft Entra ID P2. Nothing was changed." }
                if ($m -match '\(403 Forbidden\)') { Stop-RsRun $rs "Can't read the risk detections. The app registration needs the IdentityRiskEvent.Read.All application permission, with admin consent. Nothing was changed." }
                Stop-RsRun $rs "Couldn't read the risk detections for $($upn): $m Nothing was changed."
            }
            $detail = @($dets | Where-Object { $null -ne $_ } | ForEach-Object {
                    $loc = Get-RsProp $_ 'location'
                    $place = @(@((Get-RsProp $loc 'city'), (Get-RsProp $loc 'state'), (Get-RsProp $loc 'countryOrRegion')) | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }) -join ', '
                    $type = [string](Get-RsProp $_ 'riskEventType')
                    [ordered]@{
                        id       = [string](Get-RsProp $_ 'id')
                        type     = $type
                        label    = $(if ($RsLabels.ContainsKey($type)) { $RsLabels[$type] } else { $type })
                        level    = [string](Get-RsProp $_ 'riskLevel')
                        detected = (ConvertTo-RsIso (Get-RsProp $_ 'detectedDateTime'))
                        activity = (ConvertTo-RsIso (Get-RsProp $_ 'activityDateTime'))
                        ip       = [string](Get-RsProp $_ 'ipAddress')
                        location = $place
                        timing   = [string](Get-RsProp $_ 'detectionTimingType')
                        source   = [string](Get-RsProp $_ 'source')
                    }
                } | Sort-Object { $_.detected } -Descending)

            $roles = @(); if ($admins.ContainsKey($id)) { $roles = @($admins[$id]) }
            $null = $rows.Add([ordered]@{
                    id           = $id
                    upn          = $upn
                    name         = $(if (Get-RsProp $u 'displayName') { [string](Get-RsProp $u 'displayName') } else { [string](Get-RsProp $ru 'userDisplayName') })
                    enabled      = ((Get-RsProp $u 'accountEnabled') -ne $false)
                    synced       = ((Get-RsProp $u 'onPremisesSyncEnabled') -eq $true)
                    risk_level   = [string](Get-RsProp $ru 'riskLevel')
                    risk_state   = [string](Get-RsProp $ru 'riskState')
                    risk_detail  = [string](Get-RsProp $ru 'riskDetail')
                    risk_updated = (ConvertTo-RsIso (Get-RsProp $ru 'riskLastUpdatedDateTime'))
                    admin_roles  = @($roles)
                    is_admin     = ($roles.Count -gt 0)
                    admin_known  = $adminKnown
                    manager      = $mgr
                    detections   = @($detail)
                })
        }

        $rs['risky'] = @($rows)
        Set-NodeOutput $rs
      timeoutSeconds: 600
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: node-respond
    name: Respond to new risky users
    type: powershell-script
    position:
      x: 680
      y: 200
    properties:
      script: |-
        # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
        # Edit this file, then run: node automationai/_shared/inject.js <automation-folder>
        # Signs in with the app registration's client credentials from the runner Key Vault.
        # Each helper names the Graph application permission it needs; when Graph answers 403,
        # the error says which permission to grant (with admin consent).
        # All state lives in the $GraphState hashtable and is changed in place, because the runner
        # runs a step in a child scope where $script: variables don't behave.

        $GraphState = @{
            Base           = 'https://graph.microsoft.com'
            Headers        = $null
            Creds          = $null
            TenantId       = ''
            ExpiresAt      = [datetime]::MinValue
            MaxAttempts    = 5
            MaxWaitSeconds = 120
            LastStatus     = 0
        }

        # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
        # The first secret that has a value, from a list of names.
        function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
        function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
        function Get-GraphRetryAfter {
            param($Err, [int]$Attempt)
            $s = 0
            try {
                $ra = $Err.Exception.Response.Headers.RetryAfter
                if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
            } catch { }
            if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
            return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
        }
        # Graph's own error message when there is one, otherwise the exception text.
        function Get-GraphErrorText {
            param($Err)
            $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
            if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
            return [string]$Err.Exception.Message
        }
        function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

        function Update-GraphToken {
            $c = $GraphState.Creds
            if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
            $r = $null
            try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
            catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
            $tok = Get-GraphProp $r 'access_token'
            if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
            $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
            $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
            $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
        }

        # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
        # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
        # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
        # Returns @{ TenantId }.
        function Connect-Graph {
            param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
            if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
            $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
            $GraphState.TenantId = $TenantId.Trim()
            Update-GraphToken
            return @{ TenantId = $GraphState.TenantId }
        }

        # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
        # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
        # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
        # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
        function Invoke-Graph {
            param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
            if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
            $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
            $short = $uri.Replace($GraphState.Base, '')
            $reauth = $false
            for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                try {
                    $r = Invoke-RestMethod @p
                    $GraphState.LastStatus = 200
                    return $r
                }
                catch {
                    $code = Get-GraphHttpStatus $_
                    $GraphState.LastStatus = $code
                    if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                    if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                    $why = Get-GraphErrorText $_
                    if ($code -eq 403) {
                        $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                        throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                    }
                    throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                }
            }
        }

        # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
        function Get-GraphAll {
            param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
            $rows = New-Object System.Collections.ArrayList
            $next = $Path; $n = 0
            while ($next -and $n -lt $MaxPages) {
                $n++
                $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                $next = [string](Get-GraphProp $r '@odata.nextLink')
            }
            return @($rows)
        }

        # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
        function Get-GraphUser {
            param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
            try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
            catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
        }

        # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
        # Mail-enabled security groups and distribution lists can't be changed through Graph.
        function Add-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
            catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
        }

        # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
        function Remove-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
            catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
        }

        # Sets the user's manager. Needs User.ReadWrite.All.
        function Set-GraphManager {
            param([string]$UserId, [string]$ManagerId)
            $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
        }

        # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
        function Revoke-GraphSessions {
            param([string]$UserId)
            $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
        }

        # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
        # Disabling an admin account also needs a privileged role, which app permissions can't grant.
        function Set-GraphAccountEnabled {
            param([string]$UserId, [bool]$Enabled)
            $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
        }

        # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
        # The user must have a usage location before a licence can be added.
        function Set-GraphLicense {
            param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
            $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
            $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
            if (-not $toAdd.Count -and -not $toRemove.Count) { return }
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
            catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
        }

        # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
        # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
        function Get-GraphSignInActivity {
            param([string]$UserId = '')
            $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
            $perm = 'AuditLog.Read.All (with User.Read.All)'
            if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
            # Graph caps the page size at 120 when signInActivity is selected.
            return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
        }

        # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
        function Get-GraphAuthMethods {
            param([string]$UserId)
            return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
        }

        # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
        # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
        function Remove-GraphAuthMethod {
            param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
            if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
            $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
            $seg = @{
                microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                phoneAuthenticationMethod                  = 'phoneMethods'
                fido2AuthenticationMethod                  = 'fido2Methods'
                emailAuthenticationMethod                  = 'emailMethods'
                softwareOathAuthenticationMethod           = 'softwareOathMethods'
                windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
            }
            if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
            if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
            $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
        }

        # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
        # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
        function Get-GraphRiskyUsers {
            param([string]$UserId = '', [switch]$AtRiskOnly)
            $perm = 'IdentityRiskyUser.Read.All'
            if ($UserId) {
                try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
            }
            $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
            return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
        }

        # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
        function New-GraphTempPassword {
            param([int]$Length = 16)
            if ($Length -lt 8) { $Length = 8 }
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
            $all = -join $sets
            $rng = [System.Security.Cryptography.RandomNumberGenerator]
            $chars = New-Object System.Collections.Generic.List[char]
            foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
            while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
            for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
            return -join $chars
        }
        # ---------- end _shared/graph.ps1 ----------
        # <<< _shared/graph.ps1
        # >>> _shared/psa.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/psa.ps1: one adapter for six PSAs ----------
