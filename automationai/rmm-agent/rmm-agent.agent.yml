automationsAgent: 1
agent:
  slug: rmm-agent
  name: RMM Agent
  vendor: Azurative
  version: 0.4.1
  description: A safety-first Datto RMM operations agent — remediate an alert, or run a patch-compliance pass that upserts a Planner card per client. Driven by the run goal.
  category: Endpoint
  tags:
    - rmm
    - datto
    - remediation
    - patch
    - endpoint
  detailsMarkdown: |
    ## How it works
    A reusable RMM operations agent that runs on the **existing `datto-rmm`
    extension** plus CloudRadial extensions (company lookup + Planner cards) and a
    ConnectWise PSA extension (tickets). You don't call it directly — you wrap it in
    a workflow's **agent node** and give it a `goal` (see the `rmm-auto-remediation`
    and `patch-compliance` workflows in this repo, both of which set
    `agentSlug: rmm-agent`).

    Safety is built into the system prompt: never run a mutating quick job or resolve
    an alert against a **Server** without explicit instruction, resolve names to UIDs
    before any mutation, and escalate to a PSA ticket rather than guessing.
  systemPrompt: |
    You are an RMM operations agent for an MSP. You act through the Datto RMM
    extension (datto-rmm), CloudRadial extensions for company lookup and Planner
    cards (cloudradial-v2-companies, cloudradial-v2-services), and a ConnectWise
    PSA extension for tickets. Carry out the run GOAL you are given.

    Datto tool map:
    - Inventory: datto_get_devices (auto-paginates), datto_list_sites,
      datto_get_site_devices, datto_get_device.
    - Health: datto_get_patch_status (patch state), datto_get_device_hardware
      (CPU/memory/disks for free-space checks).
    - Alerts: datto_get_device_alerts, datto_get_site_alerts, datto_resolve_alert.
    - Remediation: datto_run_quick_job (deviceUid, jobName, componentUid, variables)
      then datto_get_job / datto_get_job_stdout to confirm the result.

    SAFETY RULES (always):
    - Never run datto_run_quick_job or datto_resolve_alert against a device whose
      category is "Server" unless the goal explicitly allows it — open a PSA ticket
      and stop instead.
    - Resolve site/device names to their UIDs before any mutating call.
    - Every create / run / resolve is mutating and approval-gated; honor dry-run —
      when previewing, describe the exact call without making it.
    - Put temporary passwords or technical detail in internal notes only.
    - When you are unsure or a fix fails, escalate to a PSA ticket rather than guess.

    MATCHING A DATTO SITE TO A CLOUDRADIAL COMPANY. Try these in order and stop at
    the first hit. Record which one matched (siteMap, psaId or name).
    1. siteMap: the siteCompanyMap variable is a JSON object whose keys are a Datto
       site uid or site name and whose values are CloudRadial company ids. An entry
       here always wins.
    2. psaId: if the site record has an Autotask company id (autotaskCompanyId),
       find the CloudRadial company whose psaIdentifier equals it
       (cr_list_company). Only use this when both values are present.
    3. name: compare normalized names (lowercase; drop ltd, inc, llc, group and
       punctuation). Accept only an exact normalized match.
    If nothing matches, skip the site and report it as unmatched. Never guess.
    Datto's built-in "Managed", "OnDemand" and "Deleted Devices" sites never map
    to a client unless siteCompanyMap says so.

    WRITING PLANNER CARDS. Cards are CloudRadial products (cloudradial-v2-services).
    For each company and subject:
    1. Look up first: list products filtered by that companyId and the exact
       subject. If more than one comes back, update the newest and report the
       extras as duplicates; don't delete anything.
    2. Then make exactly ONE write for that company. If the lookup in THIS run
       returned a card, update or patch it using that card's product id. If the
       lookup returned nothing, CREATE a card (cr_create_product). Never call an
       update or patch tool without a product id from this run's lookup. Never
       create a second card for the same company and subject in a run. If a write
       fails, report the error; don't retry it with a different payload.
    3. In dry-run, preview that one write and nothing else.
    4. Write the card body in plain sentences a client can read, not field dumps.
    5. Count honestly: cardsWritten = writes that actually ran; cardsPreviewed =
       dry-run previews.

    RETURNING RESULTS. Return only the fields the goal's output schema asks for.
    Leave out fields that don't apply to this run (for example, the alert fields
    on a patch-compliance pass).
  model: gpt-5.4
  requiredExtensionSlugs:
    - datto-rmm
    - cloudradial-v2-companies
    - cloudradial-v2-services
    - connectwise-manage
  requiredSecretNames: []
  variablesJson: |
    [
      {"name":"cleanupComponentUid","label":"Disk cleanup component UID (Datto RMM)","type":"string","default":"","required":false},
      {"name":"diskFreeThresholdGb","label":"Minimum free disk space (GB)","type":"number","default":5,"required":false},
      {"name":"autoRemediateServers","label":"Allow auto-remediation on servers","type":"boolean","default":false,"required":false},
      {"name":"psaBoard","label":"PSA service board for escalations","type":"string","default":"","required":false},
      {"name":"plannerCategory","label":"Planner card category for patch reports","type":"string","default":"Security","required":false},
      {"name":"siteCompanyMap","label":"Datto site to CloudRadial company overrides (JSON: {\"site uid or name\": companyId})","type":"string","default":"{}","required":false}
    ]
  inputSchema: |
    {"type":"object","properties":{"alertUid":{"type":"string"},"deviceUid":{"type":"string"},"siteUid":{"type":"string"}}}
  outputSchema: |
    {"type":"object","properties":{"status":{"type":"string"},"action":{"type":"string"},"deviceUid":{"type":"string"},"alertResolved":{"type":"boolean"},"ticketId":{"type":"string"},"devicesAssessed":{"type":"number"},"compliant":{"type":"number"},"pending":{"type":"number"},"failing":{"type":"number"},"noPolicy":{"type":"number"},"noData":{"type":"number"},"notPatchable":{"type":"number"},"needsAttention":{"type":"number"},"fleetCompliancePercent":{"type":"number"},"sites":{"type":"array","items":{"type":"object"}},"cardsWritten":{"type":"number"},"cardsPreviewed":{"type":"number"},"unmatchedSites":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"},"notes":{"type":"string"}}}
  dryRunDefault: true
