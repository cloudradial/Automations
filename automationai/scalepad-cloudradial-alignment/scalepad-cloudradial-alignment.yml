automationsWorkflow: 1
name: ScalePad to CloudRadial Alignment
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        y: 80
      properties:
        webhookEnabled: false
    - id: node-1
      name: Alignment Agent
      type: agent
      position:
        x: 320
        y: 100
      properties:
        # Runs the imported saved agent. Its systemPrompt carries the full procedure and
        # guardrails; this goal sets the run's scope + mode and folds in the run inputs.
        goal: |
          Align the client's ScalePad Lifecycle Manager data with CloudRadial, following your
          grounding map. Act on the run inputs you are given: align the CloudRadial company
          identified by companyId (or resolve scalePadClientName through the crosswalk), and
          run the requested phase in the requested mode (defaults: all phases, plan mode).

          Read ScalePad (hardware lifecycles, initiatives, contracts, assessments) and the
          current CloudRadial state, then map each item to its CloudRadial home: warranty/EOL
          to endpoint expirationDate (write it directly, never update-warranty);
          serial/model/manufacturer only where the portal value is blank; purchase date to endpoint manufacturedDate (only when blank) and
          other extras to endpoint custom-properties; installed software to
          endpointApplications; network, mobile and imaging hardware and devices with no serial
          to flexible assets ("ScalePad Assets"); maturity/risk
          assessments to assessment upload; historical QBR PDFs to the report archive.

          Match endpoints by serial; a device without one is kept as a flexible asset, never an endpoint. Enrich, never clobber
          RMM-supplied data. In plan mode make NO writes - return the full plan with the
          policy each write would affect (e.g. expirationDate -> Warranty Coverage). In apply
          mode make only approved changes. Do not attempt to configure policies. Close with
          the structured summary and counts.
        model: ""
        agentSlug: scalepad-cloudradial-alignment
        # Pre-filled from the agent; kept explicit so the workflow is self-contained.
        allowedExtensions:
          - lifecycle-manager
          - cloudradial-v2-companies
          - cloudradial-v2-endpoints
          - cloudradial-v2-services
        timeoutSeconds: 1800
        # false = mutating tool calls pause for approval in the Inbox (the plan/apply gate).
        # Set true only once you trust an unattended apply run.
        autoApprove: false
        inputSchema: |
          {"type":"object","properties":{"companyId":{"type":"integer","description":"Target CloudRadial companyId. Optional - omit to resolve from scalePadClientName, or to let the agent crosswalk ScalePad clients itself (up to maxCompanies)."},"scalePadClientName":{"type":"string","description":"Optional. Restrict the run to a single ScalePad client by name."},"mode":{"type":"string","enum":["plan","apply"],"default":"plan","description":"plan = describe changes, no writes (default); apply = write approved changes only, and only for a named company."},"phase":{"type":"string","enum":["devices","assets","software","assessments","roadmap","archive","all"],"default":"all","description":"Which phase to review - the same names as the ScalePad to CloudRadial Sync. Defaults to all."},"createPlaceholders":{"type":"boolean","default":false,"description":"Allow creating placeholder endpoints for unmanaged ScalePad assets."},"maxCompanies":{"type":"integer","default":3,"description":"When no company is named, how many crosswalked clients to plan for."}}}
        outputSchema: |
          {"type":"object","properties":{"summary":{"type":"string"},"clientsMapped":{"type":"array","items":{"type":"object","properties":{"scalepadClient":{"type":"string"},"cloudradialCompanyId":{"type":"integer"},"matchConfidence":{"type":"string"}}}},"unresolvedClients":{"type":"array","items":{"type":"string"}},"matched":{"type":"integer"},"enriched":{"type":"integer"},"created":{"type":"integer"},"skipped":{"type":"integer"},"planned":{"type":"array","items":{"type":"object","properties":{"target":{"type":"string"},"action":{"type":"string","enum":["workflow","enrich","create","upload","archive","skip"]},"fields":{"type":"object"},"policyImpact":{"type":"string"},"reason":{"type":"string"},"count":{"type":"integer","description":"Items covered by this entry (grouped skips, or a workflow phase)."},"examples":{"type":"array","items":{"type":"string"},"description":"Up to 20 example serials or names."},"workflowInputs":{"type":"object","description":"For action workflow: the ScalePad to CloudRadial Sync inputs to run (companyId, scalePadClientId, mode, phases)."}}}},"unmapped":{"type":"array","items":{"type":"object","properties":{"item":{"type":"string"},"reason":{"type":"string"}}}},"policySpecification":{"type":"array","items":{"type":"object","properties":{"proposedPolicy":{"type":"string"},"input":{"type":"string"},"note":{"type":"string"}}}},"currencyNote":{"type":"string"},"warnings":{"type":"array","items":{"type":"string"}}}}
    - id: end
      name: End
      type: end
      position:
        x: 560
        y: 80
  connections:
    - source: start
      target: node-1
      sourceHandle: null
    - source: node-1
      target: end
      sourceHandle: null
  startActivityId: start
