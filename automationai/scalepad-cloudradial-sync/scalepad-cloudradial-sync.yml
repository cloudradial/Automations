                          $body = "<p>$(ConvertTo-Html (Get-P $i 'description' ''))</p><p><b>Affected:</b> $affected$(ConvertTo-Html $trendText). <b>Risk:</b> $(ConvertTo-Html $risk). <b>Category:</b> $(ConvertTo-Html $cat).</p>"
