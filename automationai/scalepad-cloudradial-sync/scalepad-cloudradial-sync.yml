                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 6 - Deliverable PDFs -> CloudRadial Report Archive
                  #   1. Download the PDF from ScalePad to the run's temp folder.
                  #   2. Upload it to the archive (POST /api/beta/archive/{id}/item).
                  #   3. If that route rejects the file, list it in the migration report
                  #      (written to the portal by the summary step) as a manual upload.
                  #   Nothing is kept after the run.
                  # =====================================================================
                  $phase = 'archive'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $counts = [ordered]@{ deliverables = 0; alreadyArchived = 0; toArchive = 0; uploaded = 0; needsManual = 0; errors = 0 }
                  $items = New-Object System.Collections.ArrayList

                  if (-not (Get-Command Send-ArchiveUpload -ErrorAction SilentlyContinue)) {
                      function script:Send-ArchiveUpload {
                          param([int]$ArchiveId, [string]$FilePath, [string]$FileName)
                          Add-Type -AssemblyName System.Net.Http
                          $client = New-Object System.Net.Http.HttpClient
                          $client.DefaultRequestHeaders.Add('Authorization', $crAuth)
                          $form = New-Object System.Net.Http.MultipartFormDataContent
                          $fc = New-Object System.Net.Http.ByteArrayContent(, [System.IO.File]::ReadAllBytes($FilePath))
                          $fc.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/pdf')
                          $form.Add($fc, 'file', $FileName)
                          $resp = $client.PostAsync("$crBase/api/beta/archive/$ArchiveId/item", $form).GetAwaiter().GetResult()
                          $text = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                          $client.Dispose()
                          if (-not $resp.IsSuccessStatusCode) { throw "HTTP $([int]$resp.StatusCode): $text" }
                          return $text
                      }
                  }

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $archiveName = [string](Get-P $settings 'archiveName' 'ScalePad QBR History')
                      $archive = Get-CrArchive -CompanyId $companyId -Name $archiveName -Create:$apply -Category 'QBR'
                      if ($null -eq $archive) { Warn "Archive '$archiveName' doesn't exist yet; apply will create it." }
                      $archiveId = [int](Get-P $archive 'id' 0)

                      $archivedSubjects = New-Object System.Collections.Generic.HashSet[string]
                      if ($archiveId -gt 0) {
                          try {
                              $existingItems = @(Get-CrBetaAll "/api/beta/archive/$archiveId/item")
                              foreach ($it in $existingItems) { $s = [string](Get-P $it 'subject' (Get-P $it 'name' '')); if ($s) { $null = $archivedSubjects.Add($s.ToLowerInvariant()) } }
                          } catch { Warn "Could not list existing archive items; duplicates are possible. $($_.Exception.Message)" }
                      }

                      # ScalePad has answered this list with 400/422 depending on sort and page size, so fall back
                      # step by step, and never let a failed read stop the migration report.
                      $deliverables = @()
                      $readOk = $false
                      foreach ($try in @(@{ q = @{ 'filter[client.id]' = "eq:$spClientId"; sort = '-created_at' }; ps = 100 }, @{ q = @{ 'filter[client.id]' = "eq:$spClientId" }; ps = 100 }, @{ q = @{ 'filter[client.id]' = "eq:$spClientId" }; ps = 25 })) {
                          try { $deliverables = @(Get-SpAll '/lifecycle-manager/v1/deliverables' $try.q -PageSize $try.ps); $readOk = $true; break }
                          catch { $lastErr = "$_" }
                      }
                      if (-not $readOk) { $counts.errors++; Warn "Could not read ScalePad deliverables, so no PDFs were archived: $lastErr" }
                      $deliverables = @($deliverables | Sort-Object { ConvertTo-IsoDate (Get-P $_ 'created_at') } -Descending)
                      $counts.deliverables = $deliverables.Count
                      $limit = [int](Get-P $settings 'deliverableLimit' 20)
                      foreach ($d in @($deliverables | Select-Object -First $limit)) {
                          $dname = [string](Get-P $d 'name' 'Deliverable')
                          $created = Format-Day (Get-P $d 'created_at')
                          $subject = "ScalePad - $dname$(if ($created) { " ($created)" })"
                          if ($archivedSubjects.Contains($subject.ToLowerInvariant()) -or $archivedSubjects.Contains(($subject + '.pdf').ToLowerInvariant())) { $counts.alreadyArchived++; continue }
                          $counts.toArchive++
                          $item = [ordered]@{ deliverable = $dname; subject = $subject; action = 'archive' }
                          if ($apply) {
                              $file = Join-Path ([System.IO.Path]::GetTempPath()) ("sp-" + [guid]::NewGuid().ToString('N') + '.pdf')
                              try {
                                  $null = Invoke-WithRetry -What "ScalePad PDF $dname" -Call { Invoke-WebRequest -Method Get -Uri "$spBase/lifecycle-manager/v1/deliverables/$(Get-P $d 'id')/pdf" -Headers @{ 'x-api-key' = $spKey; Accept = 'application/pdf' } -OutFile $file }
                                  $fileName = (($subject -replace '[\\/:*?"<>|]', '-') + '.pdf')
                                  if ($archiveId -le 0) { throw "the '$archiveName' archive has no id, so nothing was uploaded" }
                                  $null = Send-ArchiveUpload -ArchiveId $archiveId -FilePath $file -FileName $fileName
                                  $counts.uploaded++; $item.method = 'api'
                              }
                              catch { $counts.errors++; $item.error = $_.Exception.Message; Warn "Couldn't upload '$subject' to the '$archiveName' archive: $($_.Exception.Message). Re-run to retry - uploaded PDFs are skipped." }
                              finally { if (Test-Path $file) { Remove-Item $file -Force -ErrorAction SilentlyContinue } }
                          }
                          $null = $items.Add($item)
                      }
                      if ($deliverables.Count -gt $limit) { Warn "Only the newest $limit of $($deliverables.Count) deliverables were processed (deliverableLimit)." }
                      $results[$phase] = [ordered]@{ ran = $true; counts = $counts; archiveName = $archiveName; archiveId = $archiveId; items = @($items) }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Archive: $($c.deliverables) deliverables, $($c.alreadyArchived) already archived, $(if ($apply) { "$($c.uploaded) uploaded" } else { "$($c.toArchive) to archive" }), $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'archive' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'followup' = {
                  # ---------------- Manual follow-up (read-only) ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Manual follow-up (read-only) - the company's own items in areas that
                  # have no CloudRadial API, gathered for the report's checklist:
                  #   - open action items, grouped under the Planner card of their initiative
                  #   - meetings (upcoming, plus the last 12 months) to recreate
                  #   - goals
                  #   - the assessment templates this client's assessments used
                  # Nothing is written here; the migration report turns it into a checklist.
                  # =====================================================================
                  $phase = 'followup'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $counts = [ordered]@{ actionItems = 0; meetings = 0; goals = 0; templates = 0; errors = 0 }
                  $data = [ordered]@{ actionItems = @(); meetings = @(); goals = @(); templates = @() }

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $q = @{ 'filter[client.id]' = "eq:$spClientId" }
                      try {
                          $open = @(Get-SpAll '/lifecycle-manager/v1/action-items' (@{ 'filter[client.id]' = "eq:$spClientId"; 'filter[is_completed]' = 'eq:false' }) -PageSize 100)
                          $data.actionItems = @($open | ForEach-Object {
                              $ini = Get-P $_ 'initiative_links'
                              [ordered]@{ title = [string](Get-P $_ 'title' ''); due = Format-Day (Get-P $_ 'due_at'); initiative = [string](Get-P $ini 'initiative_name' ''); meeting = [string]((@(Get-P $_ 'meeting_links' @()) | Select-Object -First 1 | ForEach-Object { Get-P $_ 'meeting_title' '' }) -join '') }
                          })
                          $counts.actionItems = $data.actionItems.Count
                      } catch { $counts.errors++; Warn "Couldn't read ScalePad action items: $($_.Exception.Message)" }

                      try {
                          $since = (Get-Date).ToUniversalTime().AddMonths(-12)
                          $all = @(Get-SpAll '/lifecycle-manager/v1/meetings' $q -PageSize 100)
                          $data.meetings = @($all | Where-Object { $d0 = ConvertTo-IsoDate (Get-P $_ 'starts_at'); (-not (Get-P $_ 'is_complete' $false)) -or (-not $d0) -or ([datetime]$d0 -ge $since) } |
                              Sort-Object { ConvertTo-IsoDate (Get-P $_ 'starts_at') } | ForEach-Object {
                                  [ordered]@{ title = [string](Get-P $_ 'title' ''); type = [string](Get-P $_ 'type' ''); starts = Format-Day (Get-P $_ 'starts_at'); complete = [bool](Get-P $_ 'is_complete' $false); deliverables = [int](Get-P $_ 'linked_deliverable_count' 0) }
                              })
                          $counts.meetings = $data.meetings.Count
                      } catch { $counts.errors++; Warn "Couldn't read ScalePad meetings: $($_.Exception.Message)" }

                      try {
                          $data.goals = @(@(Get-SpAll '/lifecycle-manager/v1/goals' $q -PageSize 100) | Where-Object { ([string](Get-P $_ 'status' '')) -notmatch '(?i)archiv|cancel' } | ForEach-Object {
                              $per = Get-P $_ 'period'
                              [ordered]@{ title = [string](Get-P $_ 'title' ''); status = [string](Get-P $_ 'status' ''); period = (@((Get-P $per 'year'), $(if (Get-P $per 'quarter') { 'Q' + (Get-P $per 'quarter') } elseif (Get-P $per 'half') { 'H' + (Get-P $per 'half') })) | Where-Object { $_ }) -join ' '; outcomes = @(@(Get-P $_ 'outcomes' @()) | Where-Object { -not (Get-P $_ 'is_archived' $false) } | ForEach-Object { [string](Get-P $_ 'label' '') }) }
                          })
                          $counts.goals = $data.goals.Count
                      } catch { $counts.errors++; Warn "Couldn't read ScalePad goals: $($_.Exception.Message)" }

                      try {
                          $data.templates = @(@(Get-SpAll '/lifecycle-manager/v1/assessments' $q -PageSize 100) | Group-Object { [string](Get-P $_ 'assessment_template_id' '') } | Where-Object { $_.Name } | ForEach-Object {
                              [ordered]@{ templateId = $_.Name; usedBy = @($_.Group | ForEach-Object { [string](Get-P $_ 'title' '') } | Select-Object -Unique -First 5); count = $_.Count }
                          })
                          $counts.templates = $data.templates.Count
                      } catch { $counts.errors++; Warn "Couldn't read ScalePad assessments for templates: $($_.Exception.Message)" }

                      $results[$phase] = [ordered]@{ ran = $true; counts = $counts; data = $data }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Follow-up: $($c.actionItems) open action items, $($c.meetings) meetings, $($c.goals) goals, $($c.templates) assessment templates to handle by hand, $($c.errors) read errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'followup' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
          }
          foreach ($SyncPhase in $SyncPhases.Keys) {
              if (@($global:SyncCtx.phases) -notcontains $SyncPhase) { continue }   # only the phases this run asked for
              $global:SyncLast = $null
              try { & $SyncPhases[$SyncPhase] }
              catch { $null = $global:SyncLog.Add("$SyncPhase failed: $($_.Exception.Message)"); continue }
              if ($null -ne $global:SyncLast) {
                  if ($global:SyncLast.ctx) { $global:SyncCtx = ($global:SyncLast.ctx | ConvertTo-Json -Depth 30 | ConvertFrom-Json) }
                  if ($global:SyncLast.message) { $null = $global:SyncLog.Add([string]$global:SyncLast.message) }
              }
          }
          Set-NodeOutput @{ status = 'ok'; companyId = $global:SyncCtx.companyId; companyName = $global:SyncCtx.companyName; messages = @($global:SyncLog); ctx = $global:SyncCtx }
        mode: sequential
        maxItems: 500
        failurePolicy: continue
        timeoutSeconds: 1800
        parameters: []
        aiExtensions: []
    - id: node-summary
      name: Migration report
      type: powershell-script
      position:
        x: 720
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  ScalePad to CloudRadial Sync - Migration report
          #  Deterministic, paged API-to-API transfer. With no run input it migrates
          #  every ScalePad client that matches a CloudRadial company by name; send
          #  {"mode":"plan"} to preview, or companyId / companyIds to limit.
          #  Secrets (runner Key Vault): ScalePad-ApiUrl, ScalePad-ApiKey,
          #  CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          #  See the README first.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          function ConvertFrom-MaybeJson { param($v) if ($v -is [string] -and $v.Trim() -match '^[\[{]') { return ($v | ConvertFrom-Json) }; return $v }
          function Get-Field { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-ReportParam { param([string]$n)
              # Parameters may arrive as a variable, as a property of the node input, or via Get-NodeInput -Name
              # (which can also return the whole input bag) - try each and unwrap.
              $v = Get-Variable -Name $n -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $v) { $all = $null; try { $all = ConvertFrom-MaybeJson (Get-NodeInput) } catch { }; $v = Get-Field $all $n }
              if ($null -eq $v) { try { $v = ConvertFrom-MaybeJson (Get-NodeInput -Name $n) } catch { }; $inner = Get-Field $v $n; if ($null -ne $inner) { $v = $inner } }
              return (ConvertFrom-MaybeJson $v)
          }
          $ReportSync = Get-ReportParam 'sync'
          $ReportResolve = Get-ReportParam 'resolve'
          # The For Each output carries each iteration's result under results[] and items[] (items[i].output).
          $ReportItems = @()
          foreach ($k in @('results', 'items')) {
              foreach ($x in @(Get-Field $ReportSync $k)) {
                  $x = ConvertFrom-MaybeJson $x
                  if ($null -eq $x) { continue }
                  $o = Get-Field $x 'output'; if ($null -ne $o) { $x = ConvertFrom-MaybeJson $o }
                  if ($null -ne (Get-Field $x 'ctx')) { $ReportItems += $x }
              }
          }
          if ($ReportItems.Count -eq 0 -and $ReportSync -is [array]) { $ReportItems = @($ReportSync | Where-Object { $null -ne (Get-Field $_ 'ctx') }) }
          # the same company can appear under both results[] and items[] - keep one
          $seenCompanies = @{}
          $ReportItems = @($ReportItems | Where-Object { $cid = [string](Get-Field (Get-Field $_ 'ctx') 'companyId') + '|' + [string](Get-Field (Get-Field $_ 'ctx') 'scalePadClientId'); if ($seenCompanies.ContainsKey($cid)) { $false } else { $seenCompanies[$cid] = $true; $true } })
          $failedIterations = @(@(Get-Field $ReportSync 'items') | Where-Object { $e = Get-Field $_ 'error'; $e -and [string]$e -ne '' } | ForEach-Object { [string](Get-Field $_ 'error') })
          $global:ReportCtx = $null
          function Get-SyncInput { [pscustomobject]@{ ctx = $global:ReportCtx } }
          function Set-SyncOutput { param($o) $global:ReportLast = $o }
          $ReportCompanies = New-Object System.Collections.ArrayList
          foreach ($ReportItem in $ReportItems) {
              $it = $ReportItem
              $global:ReportCtx = $it.ctx
              $global:ReportLast = $null
              try {
                  & {
                      # ---- shared helpers (identical in every step of this workflow) ----
                      $ErrorActionPreference = 'Stop'
                      Set-StrictMode -Version Latest

                      function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                      function Get-P {
                          # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                          param($Obj, [string]$Path, $Default = $null)
                          $cur = $Obj
                          foreach ($part in $Path.Split('.')) {
                              if ($null -eq $cur) { return $Default }
                              if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                              $p = $cur.PSObject.Properties[$part]
                              if (-not $p) { return $Default }
                              $cur = $p.Value
                          }
                          if ($null -eq $cur) { return $Default }
                          return $cur
                      }
                      function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                      # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                      function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                      function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                      function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                      function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                      $warnings = New-Object System.Collections.ArrayList
                      function Warn { param([string]$m) $null = $warnings.Add($m) }

                      function ConvertTo-Dict {
                          param($o)
                          if ($null -eq $o) { return [ordered]@{} }
                          if ($o -is [System.Collections.IDictionary]) { return $o }
                          $h = [ordered]@{}
                          foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                          return $h
                      }

                      # Context from the previous step (or the run inputs on the first step).
                      # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                      $nodeIn = Get-SyncInput
                      if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                      $ctx = Get-P $nodeIn 'ctx'
                      if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                      if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                      if ($null -eq $ctx) { $ctx = $nodeIn }
                      $ctx = ConvertTo-Dict $ctx

                      $spBase = Get-Secret 'ScalePad-ApiUrl'
                      $spKey = Get-Secret 'ScalePad-ApiKey'
                      $crBase = Get-Secret 'CloudRadial-BaseUrl'
                      $crPub = Get-Secret 'CloudRadial-PublicKey'
                      $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                      $missingSecrets = @()
                      foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                      if ($missingSecrets.Count -gt 0) {
                          $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                          Set-SyncOutput @{ status = 'error'; message = $m }
                          throw $m
                      }
                      $spBase = $spBase.TrimEnd('/')
                      $crBase = $crBase.TrimEnd('/')
                      $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                      $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                      $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                      function Invoke-WithRetry {
                          param([scriptblock]$Call, [string]$What)
                          for ($i = 1; $i -le 4; $i++) {
                              try { return & $Call }
                              catch {
                                  $code = $null
                                  try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                                  if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                                  throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                              }
                          }
                      }
                      function Get-SpAll {
                          # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                          # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                          param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                          $items = New-Object System.Collections.ArrayList
                          $cursor = $null
                          for ($page = 1; $page -le $MaxPages; $page++) {
                              $q = @{} + $Query
                              $q['page_size'] = $PageSize
                              if ($cursor) { $q['cursor'] = $cursor }
                              $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                              $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                              try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                              catch {
                                  if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                                  throw
                              }
                              foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                              $cursor = Get-P $resp 'next_cursor'
                              if (Test-Blank $cursor) { break }
                              if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                          }
                          return $items.ToArray()
                      }
                      function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                      function Invoke-Cr {
                          param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                          $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                          $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                          if ($null -ne $Body) {
                              $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                              if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                              $args2.Body = $json
                              $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                          }
                          return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                      }
                      function Get-CrAll {
                          # Follows @odata.nextLink.
                          param([string]$Path)
                          $items = New-Object System.Collections.ArrayList
                          $next = $Path
                          $guard = 0
                          while ($next -and $guard -lt 500) {
                              $guard++
                              $resp = Invoke-Cr -Method GET -Path $next
                              foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                              $next = Get-P $resp '@odata.nextLink'
                          }
                          return $items.ToArray()
                      }
                      function Get-CrBetaAll {
                          # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                          param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                          $all = New-Object System.Collections.ArrayList
                          $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                          for ($p = 0; $p -lt $MaxPages; $p++) {
                              $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                              $rows = @($raw)
                              foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                              $rows = @($rows | Where-Object { $null -ne $_ })
                              foreach ($r in $rows) { $null = $all.Add($r) }
                              if ($rows.Count -lt $Take) { break }
                          }
                          return $all.ToArray()
                      }
                      function Get-CrArchive {
                          # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                          # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                          # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                          # id is read from any known shape and, failing that, the archive is looked up again by name.
                          param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                          function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                          $script:ArchiveSeen = @()
                          function Find-Archive {
                              foreach ($path in @('/api/beta/archive')) {
                                  $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                                  $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                                  $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                                  $hit = @($list | Where-Object {
                                      $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                      $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                      $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                                  }) | Select-Object -First 1
                                  if ($null -ne $hit) { return $hit }
                              }
                              return $null
                          }
                          $hit = Find-Archive
                          if ($null -eq $hit -and $Create) {
                              # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                              try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                              catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                              $id = Get-ArchiveId $resp
                              $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                          }
                          if ($null -eq $hit) { return $null }
                          $id = Get-ArchiveId $hit
                          if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                          return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                      }
                      function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                      $mode = [string](Get-P $ctx 'mode' 'plan')
                      if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                      $apply = ($mode -eq 'apply')
                      # ---- end shared helpers ----
                      # =====================================================================
                      # Step 7 - Migration report
                      #   Builds a plain-language summary and, in apply mode, writes it into the
                      #   CloudRadial portal so the result is visible there:
                      #     reportTarget = article (default) -> a knowledge base article (POST /v2/article)
                      #     reportTarget = archive           -> an HTML item in the company's
                      #                    "ScalePad Migration" report archive (POST /v2/archiveitem)
                      #     reportTarget = none              -> run output only
                      #   If the archive can't be written, it falls back to an article.
                      #   Plan mode writes nothing - the report is returned in the run output.
                      # =====================================================================
                      $results = ConvertTo-Dict (Get-P $ctx 'results')
                      $settings = Get-P $ctx 'settings'
                      $companyId = [int](Get-P $ctx 'companyId')
                      $companyName = [string](Get-P $ctx 'companyName')
                      $spName = [string](Get-P $ctx 'scalePadClientName')
                      $runDay = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
                      function ConvertTo-HtmlText { param($s) [System.Net.WebUtility]::HtmlEncode([string]$s) }

                      $discovery = Get-P $ctx 'discovery'
                      if ($null -ne $discovery) {
                          Set-SyncOutput @{ status = 'ok'; mode = 'plan'; summary = [string](Get-P $discovery 'message'); message = [string](Get-P $discovery 'message'); matchedClients = @(Get-P $discovery 'matched' @()); unmatchedClients = @(Get-P $discovery 'unmatched' @()); nextRun = [string](Get-P $discovery 'nextRun'); reportLocation = 'run output only'; results = [ordered]@{}; warnings = @(Get-P $ctx 'warnings' @()) }
                          return
                      }


                      # ---- Areas of ScalePad Lifecycle Manager this API-to-API sync does not move ----
                      # CloudRadial has no API for these (or none this workflow uses yet), so the report says so plainly.
                      $NotMigrated = @(
                          [ordered]@{ area = 'Policies and standards'; why = "CloudRadial's API has no route for Compliance Policies. The only policy data it exposes is each endpoint's Windows audit-policy settings (EndpointAuditPolicy), reported by the agent - so ScalePad's lifecycle, warranty and replacement policies can't be recreated automatically."; action = "Set up the equivalent checks in CloudRadial under Compliance > Policies. The Sync already fills the endpoint fields those checks read (warranty expiry, purchase date, server type)." }
                          [ordered]@{ area = 'Assessment templates'; why = 'Only completed assessments (with answers) are imported. Blank templates and scoring rules have no import route.'; action = 'Recreate templates under Compliance > Assessments, or export one from ScalePad and import it with the Excel template.' }
                          [ordered]@{ area = 'Meetings and QBR agendas'; why = 'CloudRadial has no meeting or agenda API.'; action = 'The meeting PDFs (deliverables) are archived; recreate recurring QBR meetings in your calendar or PSA.' }
                          [ordered]@{ area = 'Goals'; why = 'CloudRadial has no API for client goals or outcomes.'; action = "Record them on a Planner card or in the client's QBR notes - the checklist lists this client's goals." }
                          [ordered]@{ area = 'Initiative action items and notes'; why = 'Planner cards carry the initiative, budget and quarter, but CloudRadial has no API for card sub-tasks.'; action = "Add action items to the Planner card's description, or track them in your PSA." }
                          [ordered]@{ area = 'Report and deliverable templates, branding'; why = 'Templates are not exposed by either API; only finished PDFs are.'; action = 'Rebuild layouts in CloudRadial Report Layouts.' }
                      )
                      $lines = New-Object System.Collections.ArrayList
                      $html = New-Object System.Text.StringBuilder
                      $null = $lines.Add("ScalePad client '$spName' to CloudRadial company '$companyName' ($companyId), $mode mode.")
                      $null = $html.Append("<h2>ScalePad migration - $(ConvertTo-HtmlText $companyName)</h2><p>Run on $runDay in <b>$(if ($apply) { 'apply' } else { 'plan (preview)' })</b> mode, from ScalePad client <b>$(ConvertTo-HtmlText $spName)</b>.</p>")
                      $rows = New-Object System.Collections.ArrayList
                      $attention = New-Object System.Collections.ArrayList
                      $notes = New-Object System.Collections.ArrayList

                      $cu = Get-P $results 'cleanup.counts'
                      if ($cu) {
                          $del = [bool](Get-P $results 'cleanup.deleted' $false)
                          $act = if ($del) { "Deleted $(Get-P $cu 'deleted') duplicate copies." } else { "Would delete $(Get-P $cu 'toDelete') duplicate copies (nothing deleted)." }
                          $null = $lines.Add("Clean-up: $(Get-P $cu 'syncRecords') software records written by the Sync, $(Get-P $cu 'duplicateGroups') duplicated. $act")
                          $null = $rows.Add(@('Duplicate software clean-up', "$(Get-P $cu 'syncRecords') Sync-written records of $(Get-P $cu 'records')", $act, "$(Get-P $cu 'errors') errors"))
                      }
                      $d = Get-P $results 'devices.counts'
                      if ($d) {
                          $act = if ($apply) { "Enriched $(Get-P $d 'enriched') and created $(Get-P $d 'created')." } else { "Would enrich $(Get-P $d 'toEnrich') and create $(Get-P $d 'toCreate')." }
                          $null = $lines.Add("Devices: $(Get-P $d 'inScope') workstations, servers and VMs in ScalePad, $(Get-P $d 'matched') already in CloudRadial. $act $(Get-P $d 'unchanged') needed nothing, $(Get-P $d 'skipped') were skipped, $(Get-P $d 'errors') errors.")
                          $null = $rows.Add(@('Devices', "$(Get-P $d 'inScope') in ScalePad, $(Get-P $d 'matched') already in CloudRadial", $act, "$(Get-P $d 'skipped') skipped, $(Get-P $d 'errors') errors"))
                          $groups = @{}
                          foreach ($s in @(Get-P $results 'devices.skipped' @())) { $r = [string](Get-P $s 'reason'); if (-not $groups.ContainsKey($r)) { $groups[$r] = New-Object System.Collections.ArrayList }; $null = $groups[$r].Add([string](Get-P $s 'device')) }
                          foreach ($k in $groups.Keys) { $null = $attention.Add("Devices skipped - $k ($($groups[$k].Count)): $((@($groups[$k]) | Select-Object -First 15) -join ', ')") }
                      }
                      $fa = Get-P $results 'assets.counts'
                      if ($fa) {
                          $act = if ($apply) { "Created $(Get-P $fa 'created') and updated $(Get-P $fa 'updated')." } else { "Would create $(Get-P $fa 'toCreate') and update $(Get-P $fa 'toUpdate')." }
                          $byType = @((ConvertTo-Dict (Get-P $fa 'byType')).GetEnumerator() | ForEach-Object { "$($_.Value) $($_.Key)" }) -join ', '
                          $where = "the '$(Get-P $results 'assets.flexibleAssetType')' flexible asset type (Infrastructure)"
                          $null = $lines.Add("Other hardware: $(Get-P $fa 'scalePadAssets') ScalePad assets that aren't endpoints$(if ($byType) { " ($byType)" }), kept in $where. $act")
                          $null = $rows.Add(@('Other hardware (flexible assets)', "$(Get-P $fa 'scalePadAssets') assets$(if ($byType) { ": $byType" })", $act, "$(Get-P $fa 'unchanged') unchanged, $(Get-P $fa 'errors') errors"))
                      }
                      $sa = Get-P $results 'saas.counts'
                      if ($sa) {
                          $act = if ($apply) { "Created $(Get-P $sa 'created') and updated $(Get-P $sa 'updated')." } else { "Would create $(Get-P $sa 'toCreate') and update $(Get-P $sa 'toUpdate')." }
                          $null = $lines.Add("SaaS: $(Get-P $sa 'scalePadAssets') ScalePad SaaS subscriptions, kept in the '$(Get-P $results 'saas.flexibleAssetType')' flexible asset type. $act")
                          $saasType = [string](Get-P $results 'saas.flexibleAssetType' 'SaaS')
                          $null = $notes.Add("SaaS subscriptions are under Infrastructure > $saasType (a flexible asset type), not under Software > SaaS. That tab lists SaaS CloudRadial discovers itself and has no API to write to, so ScalePad's subscriptions - with licences, assigned seats and renewal dates - are kept in the $saasType flexible asset instead.")
                          $null = $rows.Add(@('SaaS subscriptions (flexible assets)', "$(Get-P $sa 'scalePadAssets') subscriptions", $act, "$(Get-P $sa 'unchanged') unchanged, $(Get-P $sa 'errors') errors"))
                      }
                      $s = Get-P $results 'software.counts'
                      if ($s) {
                          $act = if ($apply) { "Created $(Get-P $s 'created')." } else { "Would create $(Get-P $s 'toCreate')." }
                          $null = $lines.Add("Software: $(Get-P $s 'scalePadInstalls') installed items in ScalePad, $(Get-P $s 'alreadyPresent') already in CloudRadial. $act $(Get-P $s 'noDevice') are on devices not in CloudRadial.")
                          $null = $rows.Add(@('Installed software', "$(Get-P $s 'scalePadInstalls') installs on $(Get-P $s 'scalePadDevices' (Get-P $s 'devicesWithSoftware')) devices", $act, "$(Get-P $s 'noDevice') on devices not in CloudRadial, $(Get-P $s 'errors') errors"))
                          if ([int](Get-P $s 'overCap' 0) -gt 0) { $null = $attention.Add("Software: $(Get-P $s 'overCap') records left for the next run (maxSoftwareWrites).") }
                      }
                      $a = Get-P $results 'assessments.counts'
                      if ($a) {
                          $act = if ($apply) { "Imported $(Get-P $a 'imported')." } else { "Would import $(Get-P $a 'toImport')." }
                          $null = $lines.Add("Assessments: $(Get-P $a 'scalePadAssessments') in ScalePad, $(Get-P $a 'alreadyInCloudRadial') already imported. $act ($(Get-P $a 'questions') questions).")
                          $null = $rows.Add(@('Assessments', "$(Get-P $a 'scalePadAssessments') in ScalePad ($(Get-P $a 'questions') questions)", $act, "$(Get-P $a 'alreadyInCloudRadial') already imported, $(Get-P $a 'errors') errors"))
                      }
                      $r = Get-P $results 'roadmap.counts'
                      if ($r) {
                          $act = if ($apply) { "Created $(Get-P $r 'created') cards and updated $(Get-P $r 'updated')." } else { "Would create $(Get-P $r 'toCreate') cards and update $(Get-P $r 'toUpdate')." }
                          $null = $lines.Add("Roadmap: $(Get-P $r 'initiatives') initiatives and $(Get-P $r 'contracts') contracts. $act")
                          $null = $rows.Add(@('Roadmap and budget', "$(Get-P $r 'initiatives') initiatives, $(Get-P $r 'contracts') contracts", $act, "$(Get-P $r 'errors') errors"))
                      }
                      $ins = Get-P $results 'insights.counts'
                      if ($ins) {
                          $act = if ($apply) { "Created $(Get-P $ins 'created') Planner cards and updated $(Get-P $ins 'updated')." } else { "Would create $(Get-P $ins 'toCreate') Planner cards and update $(Get-P $ins 'toUpdate')." }
                          $null = $lines.Add("Insights: $(Get-P $ins 'insights') in ScalePad, $(Get-P $ins 'active') with affected assets. $act")
                          $null = $rows.Add(@('Insights and recommendations', "$(Get-P $ins 'insights') insights, $(Get-P $ins 'active') with affected assets", $act, "$(Get-P $ins 'errors') errors"))
                      }
                      $ar = Get-P $results 'archive.counts'
                      if ($ar) {
                          $act = if ($apply) { "Uploaded $(Get-P $ar 'uploaded')." } else { "Would archive $(Get-P $ar 'toArchive')." }
                          $null = $lines.Add("Report archive: $(Get-P $ar 'deliverables') ScalePad deliverables, $(Get-P $ar 'alreadyArchived') already archived. $act ")
                          $null = $rows.Add(@('Deliverable PDFs', "$(Get-P $ar 'deliverables') in ScalePad", $act, "$(Get-P $ar 'alreadyArchived') already archived, $(Get-P $ar 'errors') errors"))
                      }

                      $allWarnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) | Where-Object { $_ })
                      $errors = 0
                      foreach ($ph in @('cleanup', 'devices', 'assets', 'saas', 'software', 'assessments', 'roadmap', 'insights', 'archive', 'followup')) { $errors += [int](Get-P $results "$ph.counts.errors" 0) }

                      $null = $html.Append('<table border="1" cellpadding="6" cellspacing="0"><tr><th>Area</th><th>In ScalePad</th><th>Result</th><th>Notes</th></tr>')
                      foreach ($row in $rows) { $null = $html.Append("<tr><td>$(ConvertTo-HtmlText $row[0])</td><td>$(ConvertTo-HtmlText $row[1])</td><td>$(ConvertTo-HtmlText $row[2])</td><td>$(ConvertTo-HtmlText $row[3])</td></tr>") }
                      $null = $html.Append('</table>')
                      $checklist = New-Object System.Collections.ArrayList
                      function Add-Check { param([string]$Group, [string]$Text) $null = $checklist.Add([ordered]@{ group = $Group; item = $Text }) }
                      # (the checklist appears in plan and apply runs)
                          Add-Check 'Policies' 'Recreate the lifecycle, warranty and replacement policies you used in ScalePad under Compliance > Policies (no API). The endpoint fields they check are already filled.'
                          $fu = Get-P $results 'followup.data'
                          if ($fu) {
                              foreach ($g in @(@(Get-P $fu 'actionItems' @()) | Group-Object { [string](Get-P $_ 'initiative' '') })) {
                                  foreach ($a in $g.Group) {
                                      $due = [string](Get-P $a 'due' ''); $mt = [string](Get-P $a 'meeting' '')
                                      $txt = "$(Get-P $a 'title')$(if ($due) { " (due $due)" })$(if ($mt) { " - from meeting '$mt'" })"
                                      if ($g.Name) { Add-Check 'Action items' "Add to Planner card 'ScalePad Initiative - $($g.Name)': $txt" } else { Add-Check 'Action items' "Track in your PSA (not linked to an initiative): $txt" }
                                  }
                              }
                              foreach ($m in @(Get-P $fu 'meetings' @())) {
                                  $when = [string](Get-P $m 'starts' ''); $typ = [string](Get-P $m 'type' '')
                                  if (Get-P $m 'complete' $false) { Add-Check 'Meetings' "Past meeting '$(Get-P $m 'title')'$(if ($when) { " ($when)" }) - its PDFs are archived; recreate it if it recurs." }
                                  else { Add-Check 'Meetings' "Recreate '$(Get-P $m 'title')'$(if ($typ) { " ($typ)" })$(if ($when) { " on $when" }) in your calendar or PSA." }
                              }
                              foreach ($g in @(Get-P $fu 'goals' @())) {
                                  $oc = @(Get-P $g 'outcomes' @()) -join '; '
                                  Add-Check 'Goals' "Record goal '$(Get-P $g 'title')'$(if (Get-P $g 'period') { ' (' + (Get-P $g 'period') + ')' })$(if (Get-P $g 'status') { ', ' + (Get-P $g 'status') })$(if ($oc) { ' - outcomes: ' + $oc })."
                              }
                              foreach ($t in @(Get-P $fu 'templates' @())) { Add-Check 'Assessment templates' "Recreate the template behind: $(@(Get-P $t 'usedBy' @()) -join ', ') ($(Get-P $t 'count' 0) assessment(s))." }
                          }
                          # Problems from this run that need a person.
                          foreach ($w in @(@(Get-P $ctx 'warnings' @()) + @($warnings) | Where-Object { $_ } | Select-Object -Unique)) {
                              $ws = [string]$w
                              if ($ws -match '^Warranty differs') { Add-Check 'Decide' $ws }
                              elseif ($ws -match "(?i)couldn't|could not|failed") { Add-Check 'Fix and re-run' $ws }
                              elseif ($ws -match '^Skipped \d+ cancelled') { Add-Check 'Decide' $ws }
                          }
                      if ($checklist.Count -gt 0) {
                          $null = $html.Append('<h3>Manual follow-up checklist</h3>')
                          $order = @('Fix and re-run', 'Decide', 'Action items', 'Meetings', 'Goals', 'Assessment templates', 'Policies')
                          foreach ($grp in @($checklist | Group-Object { $_.group } | Sort-Object { $i = [array]::IndexOf($order, $_.Name); if ($i -lt 0) { 99 } else { $i } })) {
                              $null = $html.Append("<p><b>$(ConvertTo-HtmlText $grp.Name)</b></p><ul>")
                              foreach ($x in $grp.Group) { $null = $html.Append("<li>&#9744; $(ConvertTo-HtmlText $x.item)</li>") }
                              $null = $html.Append('</ul>')
                          }
                      }
                      $insTable = @(Get-P $results 'insights.table' @())
                      if ($insTable.Count -gt 0) {
                          $null = $html.Append('<h3>ScalePad insights</h3><table border="1" cellpadding="6" cellspacing="0"><tr><th>Insight</th><th>Category</th><th>Risk</th><th>Affected</th><th>30-day change</th></tr>')
                          foreach ($t in @($insTable | Sort-Object { -[int](Get-P $_ 'affected' 0) })) { $tr = Get-P $t 'trend'; $null = $html.Append("<tr><td>$(ConvertTo-HtmlText (Get-P $t 'insight'))</td><td>$(ConvertTo-HtmlText (Get-P $t 'category'))</td><td>$(ConvertTo-HtmlText (Get-P $t 'risk'))</td><td>$(Get-P $t 'affected' 0)</td><td>$(if ($null -ne $tr) { $tr })</td></tr>") }
                          $null = $html.Append('</table><p>Insights with affected assets are Proposed Planner cards ("ScalePad Insight - ...").</p>')
                      }
                      if ($notes.Count -gt 0) { $null = $html.Append('<h3>Where to find it</h3><ul>'); foreach ($x in $notes) { $null = $html.Append("<li>$(ConvertTo-HtmlText $x)</li>") }; $null = $html.Append('</ul>') }
                      if ($attention.Count -gt 0) { $null = $html.Append('<h3>Needs attention</h3><ul>'); foreach ($x in $attention) { $null = $html.Append("<li>$(ConvertTo-HtmlText $x)</li>") }; $null = $html.Append('</ul>') }
                      if ($allWarnings.Count -gt 0) { $null = $html.Append('<h3>Warnings</h3><ul>'); foreach ($x in @($allWarnings | Select-Object -First 40)) { $null = $html.Append("<li>$(ConvertTo-HtmlText $x)</li>") }; $null = $html.Append('</ul>') }
                      $null = $html.Append('<h3>Not migrated - no CloudRadial API for these areas</h3><table border="1" cellpadding="6" cellspacing="0"><tr><th>ScalePad area</th><th>Why</th><th>What to do</th></tr>')
                      foreach ($n in $NotMigrated) { $null = $html.Append("<tr><td>$(ConvertTo-HtmlText $n.area)</td><td>$(ConvertTo-HtmlText $n.why)</td><td>$(ConvertTo-HtmlText $n.action)</td></tr>") }
                      $null = $html.Append('</table>')
                      $null = $html.Append('<p><i>Written by the AutomationAI workflow "ScalePad to CloudRadial Sync". Devices created from ScalePad are tagged ScalePad.</i></p>')

                      # ---- write the report into the portal ----
                      $reportLocation = 'run output only'
                      $target = [string](Get-P $settings 'reportTarget' 'article')
                      $subject = "ScalePad migration - $runDay"
                      if ($apply -and $target -ne 'none') {
                          $written = $false
                          if ($target -eq 'archive') {
                              try {
                                  $archName = [string](Get-P $settings 'reportArchiveName' 'ScalePad Migration')
                                  $arch = Get-CrArchive -CompanyId $companyId -Name $archName -Create -Category 'ScalePad'
                                  $archId = [int](Get-P $arch 'id' 0)
                                  if ($archId -le 0) { throw 'no archive id returned' }
                                  $null = Invoke-Cr -Method POST -Path '/v2/archiveitem' -Body ([ordered]@{ companyId = $companyId; archiveId = $archId; subject = $subject; text = $html.ToString(); isHtml = $true; isError = ($errors -gt 0) })
                                  $reportLocation = "Report archive '$archName' (Compliance > Reports), item '$subject'"
                                  $written = $true
                              }
                              catch { Warn "Couldn't write the report to the archive ($($_.Exception.Message)); writing it as a knowledge base article instead." }
                          }
                          if (-not $written) {
                              try {
                                  $null = Invoke-Cr -Method POST -Path '/v2/article' -Body ([ordered]@{ companyId = $companyId; subject = $subject; category = 'ScalePad Migration'; datePublished = (ConvertTo-IsoDate (Get-Date)); body = $html.ToString(); author = 'AutomationAI' })
                                  $reportLocation = "Knowledge base article '$subject' (category ScalePad Migration)"
                              }
                              catch { Warn "Couldn't write the report to the portal: $($_.Exception.Message). It's in the run output." }
                          }
                      }
                      $null = $lines.Add("Report: $reportLocation.")
                      $allWarnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) | Where-Object { $_ })

                      Set-SyncOutput @{
                          status         = $(if ($errors -gt 0) { 'completed_with_errors' } else { 'ok' })
                          mode           = $mode
                          summary        = ($lines -join ' ')
                          reportLocation = $reportLocation
                          reportHtml     = $html.ToString()
                          notMigrated    = @($NotMigrated)
                          notes          = @($notes)
                          checklist      = @($checklist)
                          results        = $results
                          warnings       = $allWarnings
                          message        = ($lines -join ' ')
                      }
                  }
                  $null = $ReportCompanies.Add([ordered]@{ companyId = $it.ctx.companyId; companyName = $it.ctx.companyName; status = $global:ReportLast.status; summary = $global:ReportLast.summary; reportLocation = $global:ReportLast.reportLocation; warnings = $global:ReportLast.warnings; notMigrated = $global:ReportLast.notMigrated; checklistItems = @($global:ReportLast.checklist).Count })
              }
              catch { $null = $ReportCompanies.Add([ordered]@{ companyId = $it.ctx.companyId; companyName = $it.ctx.companyName; status = 'report_failed'; summary = "Report failed: $($_.Exception.Message)" }) }
          }
          $mode = [string](Get-Field $ReportResolve 'mode')
          $unmatched = @(Get-Field $ReportResolve 'unmatched' | Where-Object { $_ })
          $expected = @(Get-Field $ReportResolve 'targets').Count
          $msg = if ($ReportCompanies.Count -eq 0 -and $expected -gt 0) {
              "The migration step didn't return a result for any of the $expected matched compan$(if ($expected -eq 1) { 'y' } else { 'ies' }). $(if ($failedIterations.Count) { 'Error: ' + $failedIterations[0] })"
          } elseif ($ReportCompanies.Count -eq 0) {
              "No ScalePad client matched a CloudRadial company by name, so nothing was migrated. $($unmatched.Count) ScalePad clients checked. Rename to match, or send {""companyId"": <id>, ""scalePadClientId"": ""<id>""} to pair one."
          } else {
              "$(if ($mode -eq 'plan') { 'Previewed' } else { 'Migrated' }) $($ReportCompanies.Count) compan$(if ($ReportCompanies.Count -eq 1) { 'y' } else { 'ies' }): " + ((@($ReportCompanies | ForEach-Object { "$($_.companyName) - $($_.reportLocation)" })) -join '; ') + $(if ($unmatched.Count) { ". $($unmatched.Count) ScalePad clients had no CloudRadial company with the same name." } else { '.' })
          }
          Set-NodeOutput @{
              status = $(if (@($ReportCompanies | Where-Object { $_.status -ne 'ok' }).Count) { 'completed_with_errors' } else { 'ok' })
              mode = $mode
              message = $msg
              summary = $msg
              companies = @($ReportCompanies)
              unmatchedScalePadClients = $unmatched
              notMigrated = @(@($ReportCompanies | Select-Object -First 1 | ForEach-Object { $_.notMigrated }) | Where-Object { $_ })
          }
        timeoutSeconds: 600
        retryCount: 0
        aiExtensions: []
        parameters:
          - name: sync
            expression: '{{ nodes.node-sync.output }}'
          - name: resolve
            expression: '{{ nodes.node-resolve.output }}'
    - id: end
      name: End
      type: end
      position:
        x: 940
        'y': 120
  connections:
    - source: start
      target: node-resolve
      sourceHandle: null
    - source: node-resolve
      target: node-sync
      sourceHandle: null
    - source: node-sync
      target: node-summary
      sourceHandle: null
    - source: node-summary
      target: end
      sourceHandle: null
  startActivityId: start
