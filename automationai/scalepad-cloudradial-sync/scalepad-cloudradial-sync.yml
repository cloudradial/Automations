                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 2 - Devices: workstations, servers and VMs (enrich or create)
                  # =====================================================================
                  $phase = 'devices'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $serialMap = [ordered]@{}   # serial -> companyEndpointId (used by the software step)

                  function Get-Platform { param($os, $manufacturer)
                      $o = ([string]$os).ToLowerInvariant(); $mf = ([string]$manufacturer).ToLowerInvariant()
                      if ($o -match 'mac|os x|darwin') { return 1 }
                      if ($o -match 'linux|ubuntu|debian|centos|red hat|rhel') { return 2 }
                      if ($o -match 'windows') { return 0 }
                      if ($mf -match 'apple') { return 1 }
                      return 0
                  }
                  # OData returns enclosure as the enum name ("Desktop", "Server") - accept a name or a number.
                  function Test-ServerEnclosure { param($v) $e = [string]$v; if ($e -match '^\d+$') { return ([int]$e -eq 80) }; return ($e -match '(?i)server') }
                  function Get-Enclosure { param($type, $model)
                      switch ($type) { 'SERVER' { return 80 } 'VIRTUAL' { return 30 } }
                      if (([string]$model) -match '(?i)laptop|notebook|book|thinkpad|latitude|elitebook|probook|zbook|surface|xps|inspiron \d{2}|vostro \d{2}|yoga|ideapad|travelmate|spectre|envy x|dragonfly') { return 10 }
                      return 20
                  }

                  # ScalePad sometimes types a server as WORKSTATION; a Windows Server OS makes it a server here.
                  $ServerOsPattern = '(?i)windows\s*server|hyper-v\s*server'
                  $counts = [ordered]@{ scalePadDevices = 0; inScope = 0; serversByOs = 0; matched = 0; toEnrich = 0; toCreate = 0; enriched = 0; created = 0; unchanged = 0; skipped = 0; errors = 0 }
                  $planned = New-Object System.Collections.ArrayList
                  $skipped = New-Object System.Collections.ArrayList

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $hw = @(Get-SpAll '/core/v1/assets/hardware' @{ 'filter[client.id]' = "eq:$spClientId" })
                      $life = @(Get-SpAll '/lifecycle-manager/v1/assets/hardware/lifecycles' @{ 'filter[client_id]' = "eq:$spClientId" })
                      $lifeBySerial = @{}
                      foreach ($l in $life) { $s = Normalize-Serial (Get-P $l 'serial_number'); if ($s) { $lifeBySerial[$s] = $l } }
                      $counts.scalePadDevices = $hw.Count

                      $crEps = @(Get-CrAll "/v2/odata/endpoint?`$filter=companyId eq $companyId&`$select=companyEndpointId,serialNumber,name,manufacturer,model,expirationDate,manufacturedDate,os,cpu,memory,isServer,isVirtual,enclosure")
                      $crBySerial = @{}
                      foreach ($e in $crEps) { $s = Normalize-Serial (Get-P $e 'serialNumber'); if ($s -and -not $crBySerial.ContainsKey($s)) { $crBySerial[$s] = $e } }

                      $types = @(Get-P $settings 'deviceTypes' @('WORKSTATION', 'SERVER', 'VIRTUAL'))
                      $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddT00:00:00Z')
                      foreach ($d in $hw) {
                          $type = ([string](Get-P $d 'type' '')).ToUpperInvariant()
                          $name = [string](Get-P $d 'name' '')
                          $serial = Normalize-Serial (Get-P $d 'serial_number')
                          if ($type -notin $types) { $counts.skipped++; $null = $skipped.Add(@{ device = $name; serial = $serial; reason = $(if ((Get-P $ctx 'phases' @()) -contains 'assets') { "type $type - kept as a flexible asset (assets phase)" } else { "type $type is not synced (deviceTypes)" }) }); continue }
                          $counts.inScope++
                          if (-not $serial) { $counts.skipped++; $null = $skipped.Add(@{ device = $name; serial = ''; reason = $(if ((Get-P $ctx 'phases' @()) -contains 'assets' -and (Get-P $settings 'includeNoSerialDevices' $true)) { 'no serial number - kept as a flexible asset (assets phase)' } else { 'no serial number' }) }); continue }

                          $l = $lifeBySerial[$serial]
                          $mf = [string](Get-P $d 'manufacturer.name' (Get-P $l 'manufacturer' ''))
                          $model = [string](Get-P $d 'model.description' (Get-P $d 'model.number' (Get-P $l 'model' '')))
                          $os = [string](Get-P $d 'software.operating_system' '')
                          $cpu = [string](Get-P $d 'configuration.cpu.name' '')
                          $ram = Get-P $d 'configuration.ram_bytes'
                          $warranty = ConvertTo-IsoDate (Get-P $l 'warranty_expiry_date')
                          $purchase = ConvertTo-IsoDate (Get-P $l 'purchase_date')
                          $av = [string](Get-P $d 'software.antivirus_info.status' '')
                          $existing = $crBySerial[$serial]
                          $serverOs = ($os -match $ServerOsPattern) -or ([string](Get-P $existing 'os' '') -match $ServerOsPattern)
                          $isServer = ($type -eq 'SERVER') -or $serverOs
                          $encType = if ($serverOs -and $type -ne 'VIRTUAL') { 'SERVER' } else { $type }
                          if ($serverOs -and $type -ne 'SERVER') { $counts.serversByOs++ }

                          if ($null -ne $existing) {
                              $counts.matched++
                              $epId = [int](Get-P $existing 'companyEndpointId')
                              $serialMap[$serial] = $epId
                              $fields = @{}
                              if ((Test-Blank (Get-P $existing 'manufacturer')) -and $mf) { $fields.manufacturer = $mf }
                              if ((Test-Blank (Get-P $existing 'model')) -and $model) { $fields.model = $model }
                              if (-not (Test-Blank $warranty)) {
                                  $cur = Get-P $existing 'expirationDate'
                                  if (Test-Blank $cur) { $fields.expirationDate = $warranty }
                                  elseif ((Format-Day $cur) -ne (Format-Day $warranty)) {
                                      if (Get-P $settings 'overwriteWarranty' $false) { $fields.expirationDate = $warranty }
                                      else { Warn "Warranty differs for $name ($serial): CloudRadial $(Format-Day $cur), ScalePad $(Format-Day $warranty). Left as is (overwriteWarranty is off)." }
                                  }
                              }
                              if ((Test-Blank (Get-P $existing 'manufacturedDate')) -and -not (Test-Blank $purchase)) { $fields.manufacturedDate = $purchase }
                              if ((Test-Blank (Get-P $existing 'os')) -and $os) { $fields.os = $os }
                              if ((Test-Blank (Get-P $existing 'cpu')) -and $cpu) { $fields.cpu = $cpu }
                              if (((Test-Blank (Get-P $existing 'memory')) -or [double](Get-P $existing 'memory' 0) -eq 0) -and $ram) { $fields.memory = [int64]$ram }
                              # Server typing is corrected, not just filled: a desktop record running Windows Server is a server.
                              if ($isServer -and (Get-P $existing 'isServer' $false) -ne $true) { $fields.isServer = $true }
                              if ($isServer -and $encType -eq 'SERVER' -and (Get-P $existing 'isVirtual' $false) -ne $true -and -not (Test-ServerEnclosure (Get-P $existing 'enclosure'))) { $fields.enclosure = 80 }
                              if ($fields.Count -eq 0) { $counts.unchanged++; continue }
                              $counts.toEnrich++
                              $null = $planned.Add(@{ action = 'enrich'; device = $name; serial = $serial; companyEndpointId = $epId; fields = $fields })
                              if ($apply) {
                                  try { $null = Invoke-Cr -Method PATCH -Path "/v2/endpoint/id/$epId" -Body (New-PatchOps $fields); $counts.enriched++ }
                                  catch { $counts.errors++; Warn "Enrich failed for $name ($serial): $($_.Exception.Message)" }
                              }
                              continue
                          }

                          if (-not (Get-P $settings 'createMissingDevices' $true)) { $counts.skipped++; $null = $skipped.Add(@{ device = $name; serial = $serial; reason = 'not in CloudRadial (createMissingDevices is off)' }); continue }
                          $body = [ordered]@{
                              companyId = $companyId; name = $(if ($name) { $name } else { $serial }); machineName = $name
                              serialNumber = [string](Get-P $d 'serial_number'); manufacturer = $mf; model = $model
                              platformType = (Get-Platform $os $mf); enclosure = (Get-Enclosure $encType $model)
                              isServer = $isServer; isVirtual = ($type -eq 'VIRTUAL')
                              os = $os; cpu = $cpu; tagNumber = 'ScalePad'
                              isWindowsDefenderRunning = ($av -eq 'RUNNING' -and $os -match '(?i)windows')
                              lastCheckIn = $today; lastOSUpdate = $today
                          }
                          foreach ($k in @($body.Keys)) { if ($body[$k] -is [string] -and [string]::IsNullOrWhiteSpace($body[$k])) { $body.Remove($k) } }
                          if ($ram) { $body.memory = [int64]$ram }
                          if (-not (Test-Blank $warranty)) { $body.expirationDate = $warranty }
                          if (-not (Test-Blank $purchase)) { $body.manufacturedDate = $purchase }
                          $counts.toCreate++
                          $null = $planned.Add(@{ action = 'create'; device = $name; serial = $serial; type = $(if ($encType -ne $type) { "$type (server by OS)" } else { $type }); enclosure = $body.enclosure; platformType = $body.platformType })
                          if ($apply) {
                              try {
                                  $resp = Invoke-Cr -Method POST -Path '/v2/endpoint' -Body $body
                                  $newId = Get-P $resp 'companyEndpointId' (Get-P $resp 'id')
                                  if ($newId) { $serialMap[$serial] = [int]$newId }
                                  $counts.created++
                              }
                              catch { $counts.errors++; Warn "Create failed for $name ($serial): $($_.Exception.Message)" }
                          }
                      }
                      $results[$phase] = [ordered]@{
                          ran = $true; counts = $counts
                          planned = @($planned | Select-Object -First 150); plannedTotal = $planned.Count
                          skipped = @($skipped | Select-Object -First 100); skippedTotal = $skipped.Count
                          serialMap = $serialMap
                      }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Devices: $($c.inScope) in scope, $($c.matched) matched, $(if ($apply) { "$($c.enriched) enriched, $($c.created) created" } else { "$($c.toEnrich) to enrich, $($c.toCreate) to create" }), $($c.skipped) skipped, $($c.errors) errors.$(if ($c.serversByOs) { " $($c.serversByOs) typed as servers from a Windows Server OS." })"; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'devices' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'assets' = {
                  # ---------------- Other hardware to flexible assets ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 3 - Other ScalePad hardware to CloudRadial flexible assets
                  #   Network gear, mobiles, printers/imaging (any ScalePad type that isn't
                  #   synced as an endpoint) and in-scope devices with no serial number
                  #   become rows of one flexible asset type ("ScalePad Assets"), shown under
                  #   Infrastructure. Matched on the ScalePad asset id, so re-runs update
                  #   rather than duplicate. Native v2 routes: /v2/flexible-asset-type,
                  #   /v2/flexible-asset-field, /v2/flexible-asset (reads via /v2/odata).
                  # =====================================================================
                  $phase = 'assets'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')

                  # Field order = column order in the portal. nameKey is the trait key CloudRadial derives from the name.
                  $FieldDefs = @(
                      @{ name = 'Name'; kind = 'Text'; order = 1; useForTitle = $true; showInList = $false; required = $true },   # shown as the NAME column already
                      @{ name = 'Type'; kind = 'Text'; order = 2; showInList = $true },
                      @{ name = 'Manufacturer'; kind = 'Text'; order = 3; showInList = $true },
                      @{ name = 'Model'; kind = 'Text'; order = 4; showInList = $true },
                      @{ name = 'Serial Number'; kind = 'Text'; order = 5; showInList = $true },
                      @{ name = 'Warranty Expires'; kind = 'Date'; order = 6; showInList = $true },
                      @{ name = 'Purchase Date'; kind = 'Date'; order = 7 },
                      @{ name = 'Location'; kind = 'Text'; order = 8 },
                      @{ name = 'Assigned User'; kind = 'Text'; order = 9 },
                      @{ name = 'ScalePad ID'; kind = 'Text'; order = 10; hint = 'Used by the ScalePad to CloudRadial Sync to match this row. Do not edit.' }
                  )
                  function ConvertTo-NameKey { param([string]$n) return (($n.Trim().ToLowerInvariant() -replace '[^a-z0-9]+', '-').Trim('-')) }
                  function ConvertFrom-Traits { param($a)
                      $raw = Get-P $a 'traitsJson'
                      if ($raw -is [string] -and -not [string]::IsNullOrWhiteSpace($raw)) { try { return ConvertTo-Dict ($raw | ConvertFrom-Json) } catch { return [ordered]@{} } }
                      return ConvertTo-Dict (Get-P $a 'traits')
                  }

                  $counts = [ordered]@{ scalePadAssets = 0; byType = [ordered]@{}; noSerialDevices = 0; typeCreated = $false; fieldsAdded = 0; toCreate = 0; toUpdate = 0; unchanged = 0; created = 0; updated = 0; errors = 0 }
                  $planned = New-Object System.Collections.ArrayList

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $typeName = [string](Get-P $settings 'flexibleAssetTypeName' 'ScalePad Assets')
                      $deviceTypes = @(Get-P $settings 'deviceTypes' @('WORKSTATION', 'SERVER', 'VIRTUAL'))
                      $assetTypes = @(Get-P $settings 'assetTypes' @())
                      $includeNoSerial = [bool](Get-P $settings 'includeNoSerialDevices' $true)

                      $hw = @(Get-SpAll '/core/v1/assets/hardware' @{ 'filter[client.id]' = "eq:$spClientId" })
                      $life = @(Get-SpAll '/lifecycle-manager/v1/assets/hardware/lifecycles' @{ 'filter[client_id]' = "eq:$spClientId" })
                      $lifeBySerial = @{}
                      foreach ($l in $life) { $s = Normalize-Serial (Get-P $l 'serial_number'); if ($s) { $lifeBySerial[$s] = $l } }

                      $rows = New-Object System.Collections.ArrayList
                      foreach ($d in $hw) {
                          $type = ([string](Get-P $d 'type' '')).ToUpperInvariant()
                          $serial = Normalize-Serial (Get-P $d 'serial_number')
                          $isDeviceType = $type -in $deviceTypes
                          $take = if ($isDeviceType) { $includeNoSerial -and -not $serial } elseif ($assetTypes.Count -gt 0) { $type -in $assetTypes } else { $true }
                          if (-not $take) { continue }
                          if ($isDeviceType) { $counts.noSerialDevices++ }
                          $l = if ($serial) { $lifeBySerial[$serial] } else { $null }
                          $label = if ($type) { (Get-Culture).TextInfo.ToTitleCase($type.ToLowerInvariant()) } else { 'Unknown' }
                          if (-not $counts.byType.Contains($label)) { $counts.byType[$label] = 0 }
                          $counts.byType[$label]++
                          $vals = [ordered]@{
                              'Name'             = [string](Get-P $d 'name' $serial)
                              'Type'             = $label
                              'Manufacturer'     = [string](Get-P $d 'manufacturer.name' (Get-P $l 'manufacturer' ''))
                              'Model'            = [string](Get-P $d 'model.description' (Get-P $d 'model.number' (Get-P $l 'model' '')))
                              'Serial Number'    = [string](Get-P $d 'serial_number' '')
                              'Warranty Expires' = Format-Day (Get-P $l 'warranty_expiry_date')
                              'Purchase Date'    = Format-Day (Get-P $l 'purchase_date')
                              'Location'         = [string](Get-P $d 'site.name' (Get-P $d 'location_name' ''))
                              'Assigned User'    = [string](Get-P $d 'assigned_user_name' (Get-P $d 'assigned_user.name' ''))
                              'ScalePad ID'      = [string](Get-P $d 'id')
                          }
                          if (Test-Blank $vals['Name']) { $vals['Name'] = "$label $($vals['ScalePad ID'])" }
                          $null = $rows.Add($vals)
                      }
                      $counts.scalePadAssets = $rows.Count

                      # --- the flexible asset type and its fields ---
                      $esc = $typeName.Replace("'", "''")
                      $type = @(Get-CrAll "/v2/odata/flexibleassettype?`$filter=name eq '$esc'") | Select-Object -First 1
                      $typeId = if ($type) { [int](Get-P $type 'id') } else { 0 }
                      if (-not $typeId -and $rows.Count -gt 0) {
                          $null = $planned.Add(@{ action = 'create-type'; type = $typeName; fields = @($FieldDefs | ForEach-Object { $_.name }) })
                          if ($apply) {
                              $body = [ordered]@{ name = $typeName; description = 'Hardware from ScalePad Lifecycle Manager that is not an endpoint: network, mobile and imaging devices, and devices without a serial number. Kept current by the ScalePad to CloudRadial Sync.'; icon = 'router'; showInMenu = $true; fields = $FieldDefs }
                              try {
                                  $resp = Invoke-Cr -Method POST -Path '/v2/flexible-asset-type' -Body $body
                                  $typeId = [int](Get-P $resp 'id' (Get-P $resp 'flexibleAssetTypeId' 0))
                                  if (-not $typeId) { $again = @(Get-CrAll "/v2/odata/flexibleassettype?`$filter=name eq '$esc'") | Select-Object -First 1; if ($again) { $typeId = [int](Get-P $again 'id') } }
                                  if ($typeId) { $counts.typeCreated = $true } else { throw 'the type was created but its id could not be read back' }
                              }
                              catch { $counts.errors++; Warn "Could not create the '$typeName' flexible asset type: $($_.Exception.Message)" }
                          }
                      }

                      $keyOf = @{}
                      foreach ($f in $FieldDefs) { $keyOf[$f.name] = ConvertTo-NameKey $f.name }
                      $existingAssets = @()
                      if ($typeId) {
                          $fields = @(Get-CrAll "/v2/odata/flexibleassetfield?`$filter=flexibleAssetTypeId eq $typeId")
                          $have = @{}
                          foreach ($f in $fields) { $have[[string](Get-P $f 'name')] = [string](Get-P $f 'nameKey' (ConvertTo-NameKey (Get-P $f 'name'))) }
                          foreach ($f in $FieldDefs) {
                              if ($have.ContainsKey($f.name)) { $keyOf[$f.name] = $have[$f.name]; continue }
                              if ($fields.Count -eq 0 -and $counts.typeCreated) { continue }   # created inline just now
                              $null = $planned.Add(@{ action = 'add-field'; field = $f.name })
                              if ($apply) {
                                  try { $null = Invoke-Cr -Method POST -Path '/v2/flexible-asset-field' -Body ([ordered]@{ flexibleAssetTypeId = $typeId } + $f); $counts.fieldsAdded++ }
                                  catch { $counts.errors++; Warn "Could not add field '$($f.name)' to '$typeName': $($_.Exception.Message)" }
                              }
                          }
                          $existingAssets = @(Get-CrAll "/v2/odata/flexibleasset?`$filter=companyId eq $companyId and flexibleAssetTypeId eq $typeId")
                      }
                      $idKey = $keyOf['ScalePad ID']; $serialKey = $keyOf['Serial Number']
                      $byId = @{}; $bySerial = @{}
                      foreach ($a in $existingAssets) {
                          $t = ConvertFrom-Traits $a
                          $sid = [string](Get-P $t $idKey ''); $sn = Normalize-Serial (Get-P $t $serialKey '')
                          if ($sid) { $byId[$sid] = $a }
                          if ($sn -and -not $bySerial.ContainsKey($sn)) { $bySerial[$sn] = $a }
                      }

                      foreach ($vals in $rows) {
                          $traits = [ordered]@{}
                          foreach ($k in $vals.Keys) { if (-not (Test-Blank $vals[$k])) { $traits[$keyOf[$k]] = [string]$vals[$k] } }
                          $match = $byId[$vals['ScalePad ID']]
                          if ($null -eq $match -and $vals['Serial Number']) { $match = $bySerial[(Normalize-Serial $vals['Serial Number'])] }
                          if ($null -ne $match) {
                              $cur = ConvertFrom-Traits $match
                              $merged = [ordered]@{}; foreach ($k in $cur.Keys) { $merged[$k] = $cur[$k] }
                              $changed = @()
                              foreach ($k in $traits.Keys) { if ([string](Get-P $cur $k '') -ne $traits[$k]) { $merged[$k] = $traits[$k]; $changed += $k } }
                              if ($changed.Count -eq 0) { $counts.unchanged++; continue }
                              $counts.toUpdate++
                              $assetId = [int](Get-P $match 'id')
                              $null = $planned.Add(@{ action = 'update'; asset = $vals['Name']; flexibleAssetId = $assetId; fields = $changed })
                              if ($apply) {
                                  try {
                                      $json = $merged | ConvertTo-Json -Depth 5 -Compress
                                      try { $null = Invoke-Cr -Method PATCH -Path "/v2/flexible-asset/$assetId" -Body @(@{ op = 'replace'; path = '/traitsJson'; value = $json }) }
                                      catch {
                                          # Fallback: the IT Glue-compatible route takes traits as an object.
                                          $b = @{ data = @{ type = 'flexible-assets'; id = $assetId; attributes = @{ traits = $merged } } } | ConvertTo-Json -Depth 8
                                          $null = Invoke-WithRetry -What "CloudRadial PATCH /compatibility/flexible_assets/$assetId" -Call { Invoke-RestMethod -Method Patch -Uri "$crBase/compatibility/flexible_assets/$assetId" -Headers $crHeaders -Body $b -ContentType 'application/json' }
                                      }
                                      $counts.updated++
                                  }
                                  catch { $counts.errors++; Warn "Update failed for flexible asset $($vals['Name']): $($_.Exception.Message)" }
                              }
                              continue
                          }
                          $counts.toCreate++
                          $null = $planned.Add(@{ action = 'create'; asset = $vals['Name']; type = $vals['Type']; serial = $vals['Serial Number'] })
                          if ($apply -and $typeId) {
                              try { $null = Invoke-Cr -Method POST -Path '/v2/flexible-asset' -Body ([ordered]@{ companyId = $companyId; flexibleAssetTypeId = $typeId; traits = $traits }); $counts.created++ }
                              catch { $counts.errors++; Warn "Create failed for flexible asset $($vals['Name']): $($_.Exception.Message)" }
                          }
                      }
                      $results[$phase] = [ordered]@{
                          ran = $true; counts = $counts; flexibleAssetType = $typeName; flexibleAssetTypeId = $typeId
                          planned = @($planned | Select-Object -First 150); plannedTotal = $planned.Count
                      }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Flexible assets: $($c.scalePadAssets) ScalePad assets that aren't endpoints ($($c.noSerialDevices) of them devices with no serial), $(if ($apply) { "$($c.created) created, $($c.updated) updated" } else { "$($c.toCreate) to create, $($c.toUpdate) to update" }), $($c.unchanged) unchanged, $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'assets' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'saas' = {
                  # ---------------- SaaS subscriptions to flexible assets ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # SaaS subscriptions -> CloudRadial flexible asset type "SaaS"
                  #   CloudRadial's software records (endpointapplication) always belong to a
                  #   device, and its API has no SaaS or licence route, so ScalePad SaaS assets
                  #   (Microsoft 365, Google Workspace, ... with seats and terms) become rows of
                  #   a flexible asset type named "SaaS". Matched on the ScalePad SaaS id, so
                  #   re-runs update rather than duplicate.
                  # =====================================================================
                  $phase = 'saas'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')

                  # Field order = column order in the portal. nameKey is the trait key CloudRadial derives from the name.
                  $FieldDefs = @(
                      @{ name = 'Name'; kind = 'Text'; order = 1; useForTitle = $true; showInList = $false; required = $true },   # shown as the NAME column already
                      @{ name = 'Vendor'; kind = 'Text'; order = 2; showInList = $true },
                      @{ name = 'SKU'; kind = 'Text'; order = 3 },
                      @{ name = 'Category'; kind = 'Text'; order = 4 },
                      @{ name = 'Status'; kind = 'Text'; order = 5; showInList = $true },
                      @{ name = 'Licenses'; kind = 'Number'; order = 6; showInList = $true },
                      @{ name = 'Assigned'; kind = 'Number'; order = 7; showInList = $true },
                      @{ name = 'Renewal Date'; kind = 'Date'; order = 8; showInList = $true },
                      @{ name = 'Term Start'; kind = 'Date'; order = 9 },
                      @{ name = 'Auto Renew'; kind = 'Text'; order = 10 },
                      @{ name = 'Billing'; kind = 'Text'; order = 11 },
                      @{ name = 'Provider'; kind = 'Text'; order = 12 },
                      @{ name = 'Tenant Domain'; kind = 'Text'; order = 13 },
                      @{ name = 'ScalePad ID'; kind = 'Text'; order = 14; hint = 'Used by the ScalePad to CloudRadial Sync to match this row. Do not edit.' }
                  )
                  function ConvertTo-NameKey { param([string]$n) return (($n.Trim().ToLowerInvariant() -replace '[^a-z0-9]+', '-').Trim('-')) }
                  function ConvertFrom-Traits { param($a)
                      $raw = Get-P $a 'traitsJson'
                      if ($raw -is [string] -and -not [string]::IsNullOrWhiteSpace($raw)) { try { return ConvertTo-Dict ($raw | ConvertFrom-Json) } catch { return [ordered]@{} } }
                      return ConvertTo-Dict (Get-P $a 'traits')
                  }

                  $counts = [ordered]@{ scalePadAssets = 0; typeCreated = $false; fieldsAdded = 0; toCreate = 0; toUpdate = 0; unchanged = 0; created = 0; updated = 0; errors = 0 }
                  $planned = New-Object System.Collections.ArrayList

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $typeName = [string](Get-P $settings 'saasTypeName' 'SaaS')
                      $saas = @(Get-SpAll '/core/v1/assets/saas' @{ 'filter[client.id]' = "eq:$spClientId" })
                      $rows = New-Object System.Collections.ArrayList
                      foreach ($a in $saas) {
                          $sub = @(Get-P $a 'subscriptions' @()) | Select-Object -First 1
                          $auto = Get-P $a 'term.is_auto_renewed' (Get-P $sub 'term.is_auto_renewed')
                          $vals = [ordered]@{
                              'Name'          = [string](Get-P $a 'product.name' (Get-P $sub 'friendly_name' ''))
                              'Vendor'        = [string](Get-P $a 'product.manufacturer.name' '')
                              'SKU'           = $(if (([string](Get-P $a 'product.manufacturer_sku.name' '')) -ne ([string](Get-P $a 'product.name' ''))) { [string](Get-P $a 'product.manufacturer_sku.name' '') } else { '' })
                              'Category'      = [string](Get-P $a 'product.category' '')
                              'Status'        = [string](Get-P $a 'status' '')
                              'Licenses'      = [string](Get-P $a 'pool.capacity' (Get-P $sub 'license_count' ''))
                              'Assigned'      = [string](Get-P $a 'pool.utilized' '')
                              'Renewal Date'  = Format-Day (Get-P $a 'term.ends_at' (Get-P $sub 'term.ends_at'))
                              'Term Start'    = Format-Day (Get-P $a 'term.starts_at' (Get-P $sub 'term.starts_at'))
                              'Auto Renew'    = $(if ($null -eq $auto) { '' } elseif ($auto -eq $true) { 'Yes' } else { 'No' })
                              'Billing'       = [string](Get-P $sub 'billing_cycle_name' '')
                              'Provider'      = [string](Get-P $sub 'provider_name' '')
                              'Tenant Domain' = [string](Get-P $a 'tenant_domain' '')
                              'ScalePad ID'   = [string](Get-P $a 'id')
                          }
                          if (Test-Blank $vals['Name']) { $vals['Name'] = "SaaS $($vals['ScalePad ID'])" }
                          $null = $rows.Add($vals)
                      }
                      $counts.scalePadAssets = $rows.Count

                      # --- the flexible asset type and its fields ---
                      $esc = $typeName.Replace("'", "''")
                      $type = @(Get-CrAll "/v2/odata/flexibleassettype?`$filter=name eq '$esc'") | Select-Object -First 1
                      $typeId = if ($type) { [int](Get-P $type 'id') } else { 0 }
                      if (-not $typeId -and $rows.Count -gt 0) {
                          $null = $planned.Add(@{ action = 'create-type'; type = $typeName; fields = @($FieldDefs | ForEach-Object { $_.name }) })
                          if ($apply) {
                              $body = [ordered]@{ name = $typeName; description = 'SaaS subscriptions from ScalePad (product, vendor, seats, term). Kept current by the ScalePad to CloudRadial Sync.'; icon = 'cloud'; showInMenu = $true; fields = $FieldDefs }
                              try {
                                  $resp = Invoke-Cr -Method POST -Path '/v2/flexible-asset-type' -Body $body
                                  $typeId = [int](Get-P $resp 'id' (Get-P $resp 'flexibleAssetTypeId' 0))
                                  if (-not $typeId) { $again = @(Get-CrAll "/v2/odata/flexibleassettype?`$filter=name eq '$esc'") | Select-Object -First 1; if ($again) { $typeId = [int](Get-P $again 'id') } }
                                  if ($typeId) { $counts.typeCreated = $true } else { throw 'the type was created but its id could not be read back' }
                              }
                              catch { $counts.errors++; Warn "Could not create the '$typeName' flexible asset type: $($_.Exception.Message)" }
                          }
                      }

                      $keyOf = @{}
                      foreach ($f in $FieldDefs) { $keyOf[$f.name] = ConvertTo-NameKey $f.name }
                      $existingAssets = @()
                      if ($typeId) {
                          $fields = @(Get-CrAll "/v2/odata/flexibleassetfield?`$filter=flexibleAssetTypeId eq $typeId")
                          $have = @{}
                          foreach ($f in $fields) { $have[[string](Get-P $f 'name')] = [string](Get-P $f 'nameKey' (ConvertTo-NameKey (Get-P $f 'name'))) }
                          foreach ($f in $FieldDefs) {
                              if ($have.ContainsKey($f.name)) { $keyOf[$f.name] = $have[$f.name]; continue }
                              if ($fields.Count -eq 0 -and $counts.typeCreated) { continue }   # created inline just now
                              $null = $planned.Add(@{ action = 'add-field'; field = $f.name })
                              if ($apply) {
                                  try { $null = Invoke-Cr -Method POST -Path '/v2/flexible-asset-field' -Body ([ordered]@{ flexibleAssetTypeId = $typeId } + $f); $counts.fieldsAdded++ }
                                  catch { $counts.errors++; Warn "Could not add field '$($f.name)' to '$typeName': $($_.Exception.Message)" }
                              }
                          }
                          $existingAssets = @(Get-CrAll "/v2/odata/flexibleasset?`$filter=companyId eq $companyId and flexibleAssetTypeId eq $typeId")
                      }
                      $idKey = $keyOf['ScalePad ID']; $serialKey = 'no-serial-field'
                      $byId = @{}; $bySerial = @{}
                      foreach ($a in $existingAssets) {
                          $t = ConvertFrom-Traits $a
                          $sid = [string](Get-P $t $idKey ''); $sn = Normalize-Serial (Get-P $t $serialKey '')
                          if ($sid) { $byId[$sid] = $a }
                          if ($sn -and -not $bySerial.ContainsKey($sn)) { $bySerial[$sn] = $a }
                      }

                      foreach ($vals in $rows) {
                          $traits = [ordered]@{}
                          foreach ($k in $vals.Keys) { if (-not (Test-Blank $vals[$k])) { $traits[$keyOf[$k]] = [string]$vals[$k] } }
                          $match = $byId[$vals['ScalePad ID']]
                          if ($null -eq $match -and $vals['Serial Number']) { $match = $bySerial[(Normalize-Serial $vals['Serial Number'])] }
                          if ($null -ne $match) {
                              $cur = ConvertFrom-Traits $match
                              $merged = [ordered]@{}; foreach ($k in $cur.Keys) { $merged[$k] = $cur[$k] }
                              $changed = @()
                              foreach ($k in $traits.Keys) { if ([string](Get-P $cur $k '') -ne $traits[$k]) { $merged[$k] = $traits[$k]; $changed += $k } }
                              if ($changed.Count -eq 0) { $counts.unchanged++; continue }
                              $counts.toUpdate++
                              $assetId = [int](Get-P $match 'id')
                              $null = $planned.Add(@{ action = 'update'; asset = $vals['Name']; flexibleAssetId = $assetId; fields = $changed })
                              if ($apply) {
                                  try {
                                      $json = $merged | ConvertTo-Json -Depth 5 -Compress
                                      try { $null = Invoke-Cr -Method PATCH -Path "/v2/flexible-asset/$assetId" -Body @(@{ op = 'replace'; path = '/traitsJson'; value = $json }) }
                                      catch {
                                          # Fallback: the IT Glue-compatible route takes traits as an object.
                                          $b = @{ data = @{ type = 'flexible-assets'; id = $assetId; attributes = @{ traits = $merged } } } | ConvertTo-Json -Depth 8
                                          $null = Invoke-WithRetry -What "CloudRadial PATCH /compatibility/flexible_assets/$assetId" -Call { Invoke-RestMethod -Method Patch -Uri "$crBase/compatibility/flexible_assets/$assetId" -Headers $crHeaders -Body $b -ContentType 'application/json' }
                                      }
                                      $counts.updated++
                                  }
                                  catch { $counts.errors++; Warn "Update failed for flexible asset $($vals['Name']): $($_.Exception.Message)" }
                              }
                              continue
                          }
                          $counts.toCreate++
                          $null = $planned.Add(@{ action = 'create'; asset = $vals['Name']; type = $vals['Type']; serial = $vals['Serial Number'] })
                          if ($apply -and $typeId) {
                              try { $null = Invoke-Cr -Method POST -Path '/v2/flexible-asset' -Body ([ordered]@{ companyId = $companyId; flexibleAssetTypeId = $typeId; traits = $traits }); $counts.created++ }
                              catch { $counts.errors++; Warn "Create failed for flexible asset $($vals['Name']): $($_.Exception.Message)" }
                          }
                      }
                      $results[$phase] = [ordered]@{
                          ran = $true; counts = $counts; flexibleAssetType = $typeName; flexibleAssetTypeId = $typeId
                          planned = @($planned | Select-Object -First 150); plannedTotal = $planned.Count
                      }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "SaaS: $($c.scalePadAssets) ScalePad SaaS subscriptions, $(if ($apply) { "$($c.created) created, $($c.updated) updated" } else { "$($c.toCreate) to create, $($c.toUpdate) to update" }), $($c.unchanged) unchanged, $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'saas' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'software' = {
                  # ---------------- Installed software ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 3 - Installed software -> CloudRadial endpoint applications
                  # =====================================================================
                  $phase = 'software'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $counts = [ordered]@{ scalePadInstalls = 0; devicesWithSoftware = 0; scalePadDevices = 0; alreadyPresent = 0; toCreate = 0; created = 0; noDevice = 0; overCap = 0; errors = 0 }
                  $noDevice = New-Object System.Collections.Generic.HashSet[string]

                  function Split-Version { param([string]$v)
                      $parts = @(([string]$v) -split '[^0-9]+' | Where-Object { $_ -ne '' } | Select-Object -First 3)
                      $n = @(0, 0, 0)
                      for ($i = 0; $i -lt $parts.Count; $i++) { $x = 0; if ([int]::TryParse(([string]$parts[$i]).Substring(0, [Math]::Min(9, ([string]$parts[$i]).Length)), [ref]$x)) { $n[$i] = $x } }
                      return $n
                  }

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      # serial -> companyEndpointId from the devices step, refreshed from CloudRadial so
                      # devices created in this run (apply) or earlier runs are included.
                      $epBySerial = @{}
                      $prior = Get-P $results 'devices.serialMap'
                      if ($null -ne $prior) { foreach ($p in (ConvertTo-Dict $prior).GetEnumerator()) { $epBySerial[[string]$p.Key] = [int]$p.Value } }
                      foreach ($e in @(Get-CrAll "/v2/odata/endpoint?`$filter=companyId eq $companyId&`$select=companyEndpointId,serialNumber")) {
                          $s = Normalize-Serial (Get-P $e 'serialNumber'); if ($s) { $epBySerial[$s] = [int](Get-P $e 'companyEndpointId') }
                      }

                      # What each endpoint already has. The RMM names software differently from ScalePad
                      # ("Google Chrome / Google LLC" vs "Google Chrome / Google") and re-syncs its list, so:
                      #  - a device that already has software in CloudRadial is left alone (skipDevicesWithSoftware), and
                      #  - otherwise matching is by endpoint + normalized product name, ignoring publisher and version.
                      function Get-AppKey { param([string]$n)
                          $t = $n.ToLowerInvariant() -replace '\(.*?\)', ' ' -replace '\b(x64|x86|64-bit|32-bit|en-us|en-gb)\b', ' ' -replace '\b\d+(\.\d+)+\b', ' ' -replace '[^a-z0-9]+', ' '
                          return ($t -replace '\s+', ' ').Trim()
                      }
                      $appsByEp = @{}
                      function Add-ExistingApp { param($eid, $name) if (-not $appsByEp.ContainsKey([int]$eid)) { $appsByEp[[int]$eid] = New-Object System.Collections.Generic.HashSet[string] }; $k = Get-AppKey ([string]$name); if ($k) { $null = $appsByEp[[int]$eid].Add($k) } }
                      try { foreach ($a in @(Get-CrAll "/v2/odata/endpointapplication?`$filter=companyId eq $companyId&`$select=endpointId,name")) { Add-ExistingApp (Get-P $a 'endpointId' 0) (Get-P $a 'name') } }
                      catch { Warn "Couldn't read existing software by company; reading per device. $($_.Exception.Message)" }

                      $installs = @(Get-SpAll '/lifecycle-manager/v1/assets/software' @{ 'filter[client.id]' = "eq:$spClientId" } -PageSize 100)
                      # The company-wide read has come back empty on a portal that had software, so confirm per device.
                      $touch = @($installs | ForEach-Object { Normalize-Serial (Get-P $_ 'hardware_asset.serial_number') } | Where-Object { $_ -and $epBySerial.ContainsKey($_) } | Sort-Object -Unique)
                      foreach ($sn in $touch) {
                          $eid = $epBySerial[$sn]
                          if ($appsByEp.ContainsKey([int]$eid)) { continue }
                          try { foreach ($a in @(Get-CrAll "/v2/odata/endpointapplication?`$filter=endpointId eq $eid&`$select=endpointId,name")) { Add-ExistingApp $eid (Get-P $a 'name') } }
                          catch { Warn "Couldn't read existing software for endpoint $eid ($sn): $($_.Exception.Message)" }
                      }
                      $skipWithSoftware = -not ([string](Get-P $settings 'skipDevicesWithSoftware' 'true') -match '^(false|no|0)$')
                      $hadSoftware = @{}
                      foreach ($k in $appsByEp.Keys) { if ($appsByEp[$k].Count -gt 0) { $hadSoftware[[int]$k] = $true } }
                      $skippedDevices = New-Object System.Collections.Generic.HashSet[string]

                      $counts.scalePadInstalls = $installs.Count
                      $cap = [int](Get-P $settings 'maxSoftwareWrites' 2000)
                      $devicesSeen = New-Object System.Collections.Generic.HashSet[string]
                      $sample = New-Object System.Collections.ArrayList
                      $writeCount = 0
                      foreach ($i in $installs) {
                          $serial = Normalize-Serial (Get-P $i 'hardware_asset.serial_number')
                          if (-not $serial -or -not $epBySerial.ContainsKey($serial)) { $counts.noDevice++; $null = $noDevice.Add([string](Get-P $i 'hardware_asset.name' $serial)); continue }
                          $epId = [int]$epBySerial[$serial]
                          $null = $devicesSeen.Add($serial)
                          $name = [string](Get-P $i 'product.name' '')
                          if (Test-Blank $name) { continue }
                          if ($skipWithSoftware -and $hadSoftware.ContainsKey($epId)) { $counts.alreadyPresent++; $null = $skippedDevices.Add($serial); continue }
                          $key = Get-AppKey $name
                          if (-not $appsByEp.ContainsKey($epId)) { $appsByEp[$epId] = New-Object System.Collections.Generic.HashSet[string] }
                          if ($appsByEp[$epId].Contains($key)) { $counts.alreadyPresent++; continue }
                          $null = $appsByEp[$epId].Add($key)
                          $publisher = [string](Get-P $i 'publisher.name' '')
                          if (Test-Blank $publisher) { $publisher = 'Unknown' }
                          $counts.toCreate++
                          if ($writeCount -ge $cap) { $counts.overCap++; continue }
                          $display = [string](Get-P $i 'version.display' '')
                          $v = Split-Version $display
                          $body = [ordered]@{ companyId = $companyId; endpointId = $epId; name = $name; publisher = $publisher; display = $display; major = $v[0]; minor = $v[1]; version = $v[2]; category = [string](Get-P $i 'product.category' ''); comments = 'Added by ScalePad to CloudRadial Sync' }
                          if ($sample.Count -lt 25) { $null = $sample.Add(@{ device = [string](Get-P $i 'hardware_asset.name'); product = $name; publisher = $publisher; version = $display }) }
                          if ($apply) {
                              try { $null = Invoke-Cr -Method POST -Path '/v2/endpointapplication' -Body $body; $counts.created++ }
                              catch { $counts.errors++; if ($counts.errors -le 10) { Warn "Software create failed ($name on $serial): $($_.Exception.Message)" } }
                          }
                          $writeCount++
                      }
                      $counts.devicesSkippedHaveSoftware = $skippedDevices.Count
                      if ($skippedDevices.Count -gt 0) { Warn "$($skippedDevices.Count) device(s) already have software in CloudRadial (usually from the RMM), so ScalePad's list wasn't added to them. Set skipDevicesWithSoftware to false to add missing items anyway." }
                      $counts.devicesWithSoftware = $devicesSeen.Count
                      $counts.scalePadDevices = @($installs | ForEach-Object { Normalize-Serial (Get-P $_ 'hardware_asset.serial_number') } | Where-Object { $_ } | Sort-Object -Unique).Count
                      if ($counts.overCap -gt 0) { Warn "$($counts.overCap) software records were left for the next run (maxSoftwareWrites = $cap). Re-run to continue; existing records are skipped." }
                      if ($noDevice.Count -gt 0 -and -not $apply) { Warn "Software for $($noDevice.Count) device(s) has no CloudRadial endpoint yet. In plan mode, devices the devices step would create aren't counted; run apply (devices then software) to include them." }
                      # --- Diagnostics: how CloudRadial answers the existing-software reads (for troubleshooting duplicates) ---
                      $diag = [ordered]@{ companyReadApps = 0; endpointsWithApps = $appsByEp.Keys.Count }
                      foreach ($k in $appsByEp.Keys) { $diag.companyReadApps += $appsByEp[$k].Count }
                      function Get-Probe { param([string]$label, [string]$path)
                          try { $r = Invoke-Cr -Method GET -Path $path; $v = @(Get-P $r 'value' @()); return [ordered]@{ query = $label; rows = $v.Count; first = $(if ($v.Count) { ($v[0] | ConvertTo-Json -Depth 3 -Compress) } else { '' }) } }
                          catch { return [ordered]@{ query = $label; error = $_.Exception.Message } }
                      }
                      $probeEp = if ($touch.Count) { [int]$epBySerial[$touch[0]] } else { 0 }
                      $diag.probeEndpoint = [ordered]@{ serial = $(if ($touch.Count) { $touch[0] } else { '' }); companyEndpointId = $probeEp }
                      $diag.probes = @(
                          (Get-Probe 'company, top 1, all fields' "/v2/odata/endpointapplication?`$filter=companyId eq $companyId&`$top=1"),
                          (Get-Probe 'no filter, top 1' "/v2/odata/endpointapplication?`$top=1"),
                          (Get-Probe 'endpointId = companyEndpointId' "/v2/odata/endpointapplication?`$filter=endpointId eq $probeEp&`$top=3"),
                          (Get-Probe 'endpoint by id, all fields' "/v2/odata/endpoint?`$filter=companyEndpointId eq $probeEp&`$top=1"),
                          # SaaS: how does CloudRadial store software that isn't on a device?
                          (Get-Probe 'SaaS? no device (endpointId eq 0)' "/v2/odata/endpointapplication?`$filter=companyId eq $companyId and endpointId eq 0&`$top=5"),
                          (Get-Probe 'SaaS? no device (endpointId eq null)' "/v2/odata/endpointapplication?`$filter=companyId eq $companyId and endpointId eq null&`$top=5"),
                          (Get-Probe 'cloud storage apps (isCloudStorage)' "/v2/odata/endpointapplication?`$filter=companyId eq $companyId and isCloudStorage eq true&`$top=5")
                      )
                      $results[$phase] = [ordered]@{ ran = $true; counts = $counts; diagnostics = $diag; sample = @($sample); devicesWithoutEndpoint = @($noDevice | Select-Object -First 50) }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Software: $($c.scalePadInstalls) installs in ScalePad, $($c.alreadyPresent) already in CloudRadial$(if ($c.devicesSkippedHaveSoftware) { " ($($c.devicesSkippedHaveSoftware) devices already have software)" }), $(if ($apply) { "$($c.created) created" } else { "$($c.toCreate) to create" }), $($c.noDevice) on devices not in CloudRadial, $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'software' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'assessments' = {
                  # ---------------- Assessments ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 4 - Assessments -> CloudRadial assessment (Excel import format)
                  #   Columns follow support KB 360052746791 "Importing Assessments".
                  #   The .xlsx is built in memory - nothing is written to storage.
                  # =====================================================================
                  $phase = 'assessments'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $counts = [ordered]@{ scalePadAssessments = 0; alreadyInCloudRadial = 0; toImport = 0; imported = 0; questions = 0; errors = 0 }
                  $items = New-Object System.Collections.ArrayList

                  $Columns = @('Category', 'Question', 'Order', 'Explanation', 'Type', 'Answer', 'Text Answer', 'Responses', 'Is Flagged', 'Notes', 'Evaluation', 'Remediation Summary', 'Remediation', 'Reference', 'Partner Notes')
                  # The official blank template (radials.io/blankassessment): sheet "Assessment", these 51
                  # headers in this order. The workbook is written in exactly this shape so it imports whether
                  # CloudRadial reads columns by name or by position; columns we don't fill stay empty.
                  $TemplateColumns = @('Partner Notes', 'Monthly Unit Cost', 'Project Unit Cost', 'Psa Board', 'Psa Item', 'Psa Status', 'Psa Category', 'Psa Sub Type', 'Psa Type', 'Psa Priority', 'Psa Source', 'Psa Estimated Time', 'Email List', 'Teams Webhook', 'Slack Webhook', 'Flow Webhook', 'Json Webhook', 'Script', 'Checklist', 'Category', 'Question', 'Order', 'Explanation', 'Type', 'Answer', 'Text Answer', 'Responses', 'Is Flagged', 'Notes', 'Evaluation', 'Remediation Summary', 'Remediation', 'Reference', 'Monthly Units', 'Monthly Unit Price', 'Project Units', 'Project Unit Price', 'Control Type', 'Likelihood', 'Risk', 'Risk Cost', 'Risk Impact', 'Owner', 'Updated by', 'Update Key', 'Content Update Key', 'Note Compliant', 'Note Partially Compliant', 'Note NA', 'Note Missing', 'Note Not Compliant')
                  function ConvertTo-TemplateRows { param([object[]]$Rows)
                      $idx = @{}; for ($i = 0; $i -lt $Columns.Count; $i++) { $idx[$Columns[$i]] = $i }
                      $out = New-Object System.Collections.ArrayList
                      foreach ($r in $Rows) {
                          $row = @($r)
                          $null = $out.Add(@($TemplateColumns | ForEach-Object { if ($idx.ContainsKey($_)) { $row[$idx[$_]] } else { $null } }))
                      }
                      return $out.ToArray()
                  }
                  $ScoreText = @{ 2 = 'Compliant'; 1 = 'Partially Compliant'; 0 = 'N/A'; -1 = 'Missing answer'; -2 = 'Not compliant' }
                  $Suffix = @{ 2 = ''; 1 = '+'; 0 = '='; -1 = '*'; -2 = '-' }

                  function Get-LabelScore { param([string]$key, [string]$label, $overrides)
                      if ($null -ne $overrides) { $o = Get-P $overrides $key; if ($null -ne $o) { return [int]$o } }
                      $t = ("$label $key").ToLowerInvariant()
                      if ($t -match 'not applicable|n/a|\bna\b|notapplicable') { return 0 }
                      if ($t -match 'partial|needs attention|needsattention|some|in progress|inprogress|moderate|minor') { return 1 }
                      if ($t -match 'unanswered|unknown|not assessed|notassessed') { return -1 }
                      if ($t -match '\bno\b|not |non|fail|unsatisf|at risk|atrisk|missing|critical|major|poor|\bnone\b|high risk|highrisk') { return -2 }
                      if ($t -match 'yes|satisf|compliant|pass|good|complete|met|low risk|lowrisk|healthy') { return 2 }
                      return -1
                  }
                  function Get-Text { param($v) if ($null -eq $v) { return '' }; if ($v -is [string]) { return $v }; $t = Get-P $v 'text' (Get-P $v 'comment' (Get-P $v 'value' '')); return [string]$t }
                  function New-XlsxBytes {
                      # Minimal Office Open XML workbook: one sheet, inline strings, header row + data rows.
                      param([string[]]$Header, [object[]]$Rows)
                      Add-Type -AssemblyName System.IO.Compression
                      $esc = { param($s) [System.Security.SecurityElement]::Escape([string]$s) }
                      $colName = { param([int]$n) $s = ''; $n++; while ($n -gt 0) { $m = ($n - 1) % 26; $s = [char](65 + $m) + $s; $n = [int][Math]::Floor(($n - 1) / 26) }; $s }
                      $sb = New-Object System.Text.StringBuilder
                      $null = $sb.Append('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>')
                      $all = @(, $Header) + $Rows
                      for ($r = 0; $r -lt $all.Count; $r++) {
                          $null = $sb.Append("<row r=""$($r + 1)"">")
                          $row = @($all[$r])
                          for ($c = 0; $c -lt $row.Count; $c++) {
                              $ref = (& $colName $c) + ($r + 1)
                              $val = $row[$c]
                              if ($val -is [int] -or $val -is [long] -or $val -is [double]) { $null = $sb.Append("<c r=""$ref""><v>$val</v></c>") }
                              elseif (-not [string]::IsNullOrEmpty([string]$val)) { $null = $sb.Append("<c r=""$ref"" t=""inlineStr""><is><t xml:space=""preserve"">$(& $esc $val)</t></is></c>") }
                          }
                          $null = $sb.Append('</row>')
                      }
                      $null = $sb.Append('</sheetData></worksheet>')
                      $files = [ordered]@{
                          '[Content_Types].xml'        = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'
                          '_rels/.rels'                = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
                          'xl/workbook.xml'            = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Assessment" sheetId="1" r:id="rId1"/></sheets></workbook>'
                          'xl/_rels/workbook.xml.rels' = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'
                          'xl/worksheets/sheet1.xml'   = $sb.ToString()
                      }
                      $ms = New-Object System.IO.MemoryStream
                      $zip = New-Object System.IO.Compression.ZipArchive($ms, [System.IO.Compression.ZipArchiveMode]::Create, $true)
                      foreach ($k in $files.Keys) {
                          $entry = $zip.CreateEntry($k)
                          $w = New-Object System.IO.StreamWriter($entry.Open(), (New-Object System.Text.UTF8Encoding($false)))
                          $w.Write($files[$k]); $w.Dispose()
                      }
                      $zip.Dispose()
                      return , $ms.ToArray()
                  }
                  if (-not (Get-Command Send-CrMultipart -ErrorAction SilentlyContinue)) {
                      function script:Send-CrMultipart {
                          param([string]$Path, [string]$DataJson, [byte[]]$FileBytes, [string]$FileName)
                          Add-Type -AssemblyName System.Net.Http
                          $client = New-Object System.Net.Http.HttpClient
                          $client.DefaultRequestHeaders.Add('Authorization', $crAuth)
                          $form = New-Object System.Net.Http.MultipartFormDataContent
                          $form.Add((New-Object System.Net.Http.StringContent($DataJson, [Text.Encoding]::UTF8, 'application/json')), 'data')
                          $fc = New-Object System.Net.Http.ByteArrayContent(, $FileBytes)
                          $fc.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
                          $form.Add($fc, 'file', $FileName)
                          $resp = $client.PostAsync("$crBase$Path", $form).GetAwaiter().GetResult()
                          $text = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                          $client.Dispose()
                          if (-not $resp.IsSuccessStatusCode) { throw "HTTP $([int]$resp.StatusCode): $text" }
                          return $text
                      }
                  }

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $labels = @{}
                      try {
                          foreach ($t in @(Get-P (Get-SpOne '/lifecycle-manager/v1/assessments/criteria/labels') 'data' @())) {
                              foreach ($l in @(Get-P $t 'assessment_criterion_labels' @())) { $labels[[string](Get-P $l 'label_key')] = [string](Get-P $l 'label') }
                          }
                      } catch { Warn "Could not read ScalePad answer labels; scoring falls back to the answer text. $($_.Exception.Message)" }
                      $overrides = Get-P $settings 'labelScoreMap'
                      if ($overrides -is [string] -and -not (Test-Blank $overrides)) { try { $overrides = $overrides | ConvertFrom-Json } catch { Warn 'labelScoreMap is not valid JSON; ignored.'; $overrides = $null } }

                      $status = [string](Get-P $settings 'assessmentStatus' 'Completed')
                      $q = @{ 'filter[client.id]' = "eq:$spClientId" }
                      if (-not (Test-Blank $status) -and $status -ne 'all') { $q['filter[status]'] = "eq:$status" }
                      $list = @(Get-SpAll '/lifecycle-manager/v1/assessments' $q)
                      $counts.scalePadAssessments = $list.Count
                      if ($list.Count -eq 0) {
                          try {
                              $probe = Invoke-WithRetry -What 'ScalePad GET /lifecycle-manager/v1/assessments (all clients)' -Call { Invoke-RestMethod -Method Get -Uri "$spBase/lifecycle-manager/v1/assessments?page_size=25" -Headers $spHeaders }
                              $sampleClients = @(@(Get-P $probe 'data' @()) | ForEach-Object { "$(Get-P $_ 'client.name' (Get-P $_ 'client_name' '?')) ($(Get-P $_ 'client.id' (Get-P $_ 'client_id' '?')), $(Get-P $_ 'status' ''))" } | Select-Object -Unique -First 10)
                              Warn "ScalePad returned no assessments for client $spClientId. Across all clients it has $(Get-P $probe 'total_count' @(Get-P $probe 'data' @()).Count) assessment(s)$(if ($sampleClients.Count) { ', e.g. ' + ($sampleClients -join '; ') })."
                          } catch { Warn "ScalePad returned no assessments for client $spClientId, and the all-clients check failed: $($_.Exception.Message)" }
                      }

                      $crTitles = New-Object System.Collections.Generic.HashSet[string]
                      foreach ($a in @(Get-CrAll "/v2/odata/assessment?`$filter=companyId eq $companyId&`$select=assessmentId,title")) { $null = $crTitles.Add(([string](Get-P $a 'title')).ToLowerInvariant()) }

                      $scoreUse = @{}
                      foreach ($s in $list) {
                          $spId = [string](Get-P $s 'id')
                          $title = 'ScalePad - ' + [string](Get-P $s 'title' 'Assessment')
                          $evaluated = Format-Day (Get-P $s 'evaluated_at')
                          if ($evaluated) { $title = "$title ($evaluated)" }
                          if ($crTitles.Contains($title.ToLowerInvariant())) { $counts.alreadyInCloudRadial++; $null = $items.Add(@{ title = $title; action = 'skip'; reason = 'already in CloudRadial' }); continue }

                          $full = Get-P (Get-SpOne "/lifecycle-manager/v1/assessments/$spId") 'assessment'
                          $rows = New-Object System.Collections.ArrayList
                          $catNo = 0
                          foreach ($cat in @(Get-P $full 'category_list' @())) {
                              $catNo++
                              $catTitle = '{0}. {1}' -f $catNo, [string](Get-P $cat 'title' 'General')
                              $order = 0
                              foreach ($qn in @(Get-P $cat 'question_list' @())) {
                                  $order += 10
                                  $responses = @(); $answer = -1
                                  foreach ($cr in @(Get-P $qn 'criteria_list' @())) {
                                      $key = [string](Get-P $cr 'label_key' '')
                                      $label = [string](Get-P $cr 'display_label' (Get-P $labels $key $key))
                                      $sc = Get-LabelScore $key $label $overrides
                                      $scoreUse["$label"] = $sc
                                      $responses += ($label -replace ',', ' ') + $Suffix[$sc]
                                      if ((Get-P $cr 'is_selected' $false) -eq $true) { $answer = $sc }
                                  }
                                  if ($responses.Count -eq 0) { $responses = @('Yes', 'Partially+', 'Not Applicable=', 'Unanswered*', 'No-') }
                                  $tips = [string](Get-P $qn 'remediation_tips' '')
                                  $summary = if ($tips) { ($tips -split '(?<=[.!?])\s')[0] } else { '' }
                                  $refs = @(@(Get-P $qn 'linked_initiatives' @()) | ForEach-Object { Get-P $_ 'initiative_name' } | Where-Object { $_ }) -join '; '
                                  $null = $rows.Add(@(
                                          $catTitle, [string](Get-P $qn 'title' ''), $order, [string](Get-P $qn 'description' ''), 'List',
                                          $answer, $ScoreText[$answer], ($responses -join ','), $(if ($answer -eq -2) { 'Yes' } else { 'No' }),
                                          (Get-Text (Get-P $qn 'public_comment')), [string](Get-P $qn 'scoring_instructions' ''), $summary, $tips,
                                          $(if ($refs) { "Linked initiatives: $refs" } else { '' }), (Get-Text (Get-P $qn 'internal_comments'))))
                              }
                          }
                          $counts.questions += $rows.Count
                          if ($rows.Count -eq 0) { $null = $items.Add(@{ title = $title; action = 'skip'; reason = 'no questions' }); continue }
                          $counts.toImport++
                          $item = [ordered]@{ title = $title; action = 'import'; questions = $rows.Count; scalePadScore = Get-P $s 'overall_score' }
                          if ($apply) {
                              try {
                                  $desc = "Imported from ScalePad Lifecycle Manager. $([string](Get-P $full 'description' ''))".Trim()
                                  $created = Invoke-Cr -Method POST -Path '/v2/assessment' -Body ([ordered]@{ companyId = $companyId; title = $title; category = 'ScalePad'; description = $desc })
                                  $aid = Get-P $created 'assessmentId' (Get-P $created 'id')
                                  if (-not $aid) { throw 'CloudRadial did not return an assessmentId.' }
                                  $bytes = New-XlsxBytes -Header $TemplateColumns -Rows (ConvertTo-TemplateRows $rows.ToArray())
                                  $data = (@{ name = $title; assessmentId = [int]$aid; type = 0; companyId = $companyId } | ConvertTo-Json -Compress)
                                  $null = Send-CrMultipart -Path '/v2/assessment/upload' -DataJson $data -FileBytes $bytes -FileName ('scalepad-' + $spId + '.xlsx')
                                  $item.assessmentId = [int]$aid
                                  $counts.imported++
                              }
                              catch { $counts.errors++; $item.error = $_.Exception.Message; Warn "Assessment '$title' failed: $($_.Exception.Message)" }
                          }
                          $null = $items.Add($item)
                      }
                      $results[$phase] = [ordered]@{ ran = $true; counts = $counts; items = @($items); answerScoring = $scoreUse }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Assessments: $($c.scalePadAssessments) in ScalePad, $($c.alreadyInCloudRadial) already in CloudRadial, $(if ($apply) { "$($c.imported) imported" } else { "$($c.toImport) to import" }) ($($c.questions) questions), $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'assessments' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'roadmap' = {
                  # ---------------- Roadmap and budget ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

                  $mode = [string](Get-P $ctx 'mode' 'plan')
                  if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
                  $apply = ($mode -eq 'apply')
                  # ---- end shared helpers ----
                  try {
                  # =====================================================================
                  # Step 5 - Roadmap and budget: initiatives + contracts -> Planner cards
                  #   Subjects match the earlier migration ("ScalePad Initiative - <name>",
                  #   "ScalePad Contract - <name>") so existing cards are updated, not duplicated.
                  # =====================================================================
                  $phase = 'roadmap'
                  $results = ConvertTo-Dict (Get-P $ctx 'results')
                  $settings = Get-P $ctx 'settings'
                  $companyId = [int](Get-P $ctx 'companyId')
                  $spClientId = [string](Get-P $ctx 'scalePadClientId')
                  $counts = [ordered]@{ initiatives = 0; contracts = 0; toCreate = 0; toUpdate = 0; created = 0; updated = 0; errors = 0 }
                  $items = New-Object System.Collections.ArrayList
                  $currencies = New-Object System.Collections.Generic.HashSet[string]

                  # CloudRadial Planner status / priority codes (MatrixStatus / MatrixPriority).
                  $StatusMap = @{ New = 0; Proposed = 0; Approved = 10; InProgress = 30; OnHold = 20; Completed = 40; Declined = 50 }
                  $PriorityMap = @{ High = 1; Medium = 0; Low = -1; None = 0 }
                  # Keys are matched case-insensitively (ScalePad uses MONTHLY on contracts, Monthly on initiatives).
                  $MonthlyFactor = @{ MONTHLY = 1.0; BI_MONTHLY = 0.5; QUARTERLY = (1 / 3); SEMI_ANNUAL = (1 / 6); ANNUAL = (1 / 12); ANNUALLY = (1 / 12); YEARLY = (1 / 12); WEEKLY = (52 / 12); BI_WEEKLY = (26 / 12) }

                  function Get-QuarterSlot { param($fq)
                      # CloudRadial scheduledQuarter = Nth upcoming quarter (1 = current); quarterOffset = N-1.
                      $y = Get-P $fq 'year'; $qq = Get-P $fq 'quarter'
                      if (-not $y -or -not $qq) { return $null }
                      $now = (Get-Date).ToUniversalTime()
                      $cur = $now.Year * 4 + [Math]::Floor(($now.Month - 1) / 3)
                      $tgt = [int]$y * 4 + ([int]$qq - 1)
                      return ($tgt - $cur + 1)
                  }
                  function ConvertTo-Html { param($s) return [System.Net.WebUtility]::HtmlEncode([string]$s) }
                  function Save-Card { param([string]$Subject, [hashtable]$Fields, [string]$Kind)
                      $existing = $cards[$Subject.ToLowerInvariant()]
                      if ($null -ne $existing) {
                          $counts.toUpdate++
                          $null = $items.Add(@{ kind = $Kind; subject = $Subject; action = 'update'; productId = Get-P $existing 'productId' })
                          if ($apply) {
                              try { $null = Invoke-Cr -Method PATCH -Path "/v2/product/$(Get-P $existing 'productId')" -Body (New-PatchOps $Fields); $counts.updated++ }
                              catch { $counts.errors++; Warn "Update failed for '$Subject': $($_.Exception.Message)" }
                          }
                          return
                      }
                      $counts.toCreate++
                      $null = $items.Add(@{ kind = $Kind; subject = $Subject; action = 'create' })
                      if ($apply) {
                          $body = [ordered]@{ companyId = $companyId; subject = $Subject; category = [string](Get-P $settings 'roadmapCategory' 'Efficiency'); productCategoryId = [int](Get-P $settings 'roadmapCategoryId' 7); isRequired = $false; isShowPrice = $false; isClientVisible = $false }
                          foreach ($k in $Fields.Keys) { $body[$k] = $Fields[$k] }
                          try { $null = Invoke-Cr -Method POST -Path '/v2/product' -Body $body; $counts.created++ }
                          catch { $counts.errors++; Warn "Create failed for '$Subject': $($_.Exception.Message)" }
                      }
                  }

                  if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $cards = @{}
                      foreach ($p in @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $companyId&`$select=productId,subject")) { $cards[([string](Get-P $p 'subject')).ToLowerInvariant()] = $p }

                      # --- Initiatives ---
                      $inits = @(Get-SpAll '/lifecycle-manager/v2/initiatives' @{ 'filter[client.id]' = "eq:$spClientId"; include_unscheduled = 'true' })
                      $counts.initiatives = $inits.Count
                      foreach ($i in $inits) {
                          $name = [string](Get-P $i 'name' 'Initiative')
                          $detail = $null
                          try { $detail = Get-P (Get-SpOne "/lifecycle-manager/v1/initiatives/$(Get-P $i 'id')") 'initiative' } catch { Warn "Could not read initiative '$name' detail: $($_.Exception.Message)" }
                          $src = if ($null -ne $detail) { $detail } else { $i }
                          $ratio = [double](Get-P $src 'budget.currency.subunit_ratio' 100); if ($ratio -le 0) { $ratio = 100 }
                          $cur = [string](Get-P $src 'budget.currency.code_alpha' '')
                          if ($cur) { $null = $currencies.Add($cur) }
                          $oneTime = 0.0
                          foreach ($li in @(Get-P $src 'budget.line_items' @())) { $oneTime += ([double](Get-P $li 'cost_subunits' 0) / $ratio) * [double](Get-P $li 'unit_count' 1) }
                          $monthly = 0.0
                          foreach ($li in @(Get-P $src 'budget.recurring_line_items' @())) {
                              $f = [string](Get-P $li 'frequency' 'Monthly'); $factor = if ($MonthlyFactor.ContainsKey($f)) { $MonthlyFactor[$f] } else { 1.0 }
                              $monthly += ([double](Get-P $li 'cost_subunits' 0) / $ratio) * [double](Get-P $li 'unit_count' 1) * $factor
                          }
                          $summaryText = [string](Get-P $detail 'executive_summary' '')
                          $status = [string](Get-P $src 'status' 'Proposed')
                          $slot = Get-QuarterSlot (Get-P $src 'fiscal_quarter')
                          $when = ''
                          $fqY = Get-P $src 'fiscal_quarter.year'; $fqQ = Get-P $src 'fiscal_quarter.quarter'
                          if ($fqY) { $when = "Q$fqQ $fqY" }
                          $bodyHtml = "<p>$(ConvertTo-Html $(if ($summaryText) { $summaryText } else { "ScalePad initiative: $name." }))</p>" +
                              "<p>Status in ScalePad: $status$(if ($when) { "; scheduled for $when" }). One-time budget: $([Math]::Round($oneTime, 2)) $cur; recurring: $([Math]::Round($monthly, 2)) $cur per month.</p>"
                          $fields = @{
                              summary = $(if ($summaryText) { $summaryText.Substring(0, [Math]::Min(250, $summaryText.Length)) } else { "ScalePad initiative$(if ($when) { " for $when" })." })
                              body = $bodyHtml
                              status = $(if ($StatusMap.ContainsKey($status)) { $StatusMap[$status] } else { 0 })
                              priority = $(if ($PriorityMap.ContainsKey([string](Get-P $src 'priority' 'None'))) { $PriorityMap[[string](Get-P $src 'priority' 'None')] } else { 0 })
                              projectUnits = 1; projectUnitPrice = [Math]::Round($oneTime, 2)
                              monthlyUnits = 1; monthlyUnitPrice = [Math]::Round($monthly, 2)
                          }
                          if ($status -eq 'Completed') { $fields.productType = 1; $fields.scheduledQuarter = -1 }
                          elseif ($null -ne $slot -and $slot -ge 1) { $fields.productType = 1; $fields.scheduledQuarter = [int]$slot; $fields.quarterOffset = [int]$slot - 1 }
                          Save-Card -Subject ("ScalePad Initiative - $name") -Fields $fields -Kind 'initiative'
                      }

                      # --- Contracts ---
                      if (Get-P $settings 'includeContracts' $true) {
                          $contracts = @(Get-SpAll '/core/v1/service/contracts' @{ 'filter[client.id]' = "eq:$spClientId" })
                          $inactive = @($contracts | Where-Object { ([string](Get-P $_ 'status' '')).ToUpperInvariant() -in @('CANCELLED', 'CANCELED', 'EXPIRED', 'TERMINATED', 'INACTIVE') })
                          if ($inactive.Count -gt 0 -and -not (Get-P $settings 'includeInactiveContracts' $false)) {
                              Warn "Skipped $($inactive.Count) cancelled or expired ScalePad contract(s): $((@($inactive | ForEach-Object { Get-P $_ 'name' }) | Select-Object -First 10) -join ', '). Set includeInactiveContracts to add them."
                              $contracts = @($contracts | Where-Object { $_ -notin $inactive })
                          }
                          $counts.contracts = $contracts.Count
                          foreach ($k in $contracts) {
                              $name = [string](Get-P $k 'name' 'Contract')
                              $cur = [string](Get-P $k 'total_price.iso_currency_code' '')
                              if ($cur) { $null = $currencies.Add($cur) }
                              $period = [string](Get-P $k 'term.billing_period' 'MONTHLY')
                              $total = [double](Get-P $k 'total_price.amount' 0)
                              $factor = if ($MonthlyFactor.ContainsKey($period)) { $MonthlyFactor[$period] } else { 0 }
                              $starts = Format-Day (Get-P $k 'term.starts_at'); $ends = Format-Day (Get-P $k 'term.ends_at')
                              $termText = (@($(if ($starts) { "starts $starts" }), $(if ($ends) { "ends $ends" })) | Where-Object { $_ }) -join ', '
                              $fields = @{
                                  summary = "ScalePad $(([string](Get-P $k 'type' '')).Replace('_', ' ').ToLowerInvariant()) contract, $(([string](Get-P $k 'status' '')).ToLowerInvariant())$(if ($termText) { ", $termText" })."
                                  body = "<p>$(ConvertTo-Html ([string](Get-P $k 'description' $name)))</p><p>Billing: $($period.Replace('_', ' ').ToLowerInvariant()), $([Math]::Round($total, 2)) $cur per period$(if ((Get-P $k 'term.is_auto_renew' $false) -eq $true) { '; auto-renews' }).</p>"
                              }
                              if ($factor -gt 0) { $fields.monthlyUnits = 1; $fields.monthlyUnitPrice = [Math]::Round($total * $factor, 2) }
                              elseif ($period -eq 'ONE_TIME') { $fields.projectUnits = 1; $fields.projectUnitPrice = [Math]::Round($total, 2) }
                              Save-Card -Subject ("ScalePad Contract - $name") -Fields $fields -Kind 'contract'
                          }
                      }
                      if ($currencies.Count -gt 0) { Warn "ScalePad amounts are in $(@($currencies) -join ', '). CloudRadial stores the number only - confirm the portal currency matches before relying on prices." }
                      $results[$phase] = [ordered]@{ ran = $true; counts = $counts; items = @($items); currencies = @($currencies) }
                  }

                  $ctx.results = $results
                  $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
                  $c = $counts
                  Set-SyncOutput @{ status = 'ok'; message = "Roadmap: $($c.initiatives) initiatives and $($c.contracts) contracts; $(if ($apply) { "$($c.created) cards created, $($c.updated) updated" } else { "$($c.toCreate) cards to create, $($c.toUpdate) to update" }), $($c.errors) errors."; ctx = $ctx }
                  }
                  catch {
                      $stepErr = $_.Exception.Message
                      $ph = $(if (Get-Variable -Name phase -ErrorAction SilentlyContinue) { [string]$phase } else { 'roadmap' })
                      $res = ConvertTo-Dict (Get-P $ctx 'results')
                      $res[$ph] = [ordered]@{ ran = $true; failed = $true; error = $stepErr; counts = [ordered]@{ errors = 1 } }
                      $ctx.results = $res
                      $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) + @("The $ph step failed and was skipped: $stepErr"))
                      Set-SyncOutput @{ status = 'ok'; message = "The $ph step failed and was skipped: $stepErr"; ctx = $ctx }
                  }
              }
              'insights' = {
                  # ---------------- Insights to Planner cards ----------------
                  # ---- shared helpers (identical in every step of this workflow) ----
                  $ErrorActionPreference = 'Stop'
                  Set-StrictMode -Version Latest

                  function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
                  function Get-P {
                      # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
                      param($Obj, [string]$Path, $Default = $null)
                      $cur = $Obj
                      foreach ($part in $Path.Split('.')) {
                          if ($null -eq $cur) { return $Default }
                          if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                          $p = $cur.PSObject.Properties[$part]
                          if (-not $p) { return $Default }
                          $cur = $p.Value
                      }
                      if ($null -eq $cur) { return $Default }
                      return $cur
                  }
                  function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
                  # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
                  function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
                  function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
                  function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
                  function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

                  $warnings = New-Object System.Collections.ArrayList
                  function Warn { param([string]$m) $null = $warnings.Add($m) }

                  function ConvertTo-Dict {
                      param($o)
                      if ($null -eq $o) { return [ordered]@{} }
                      if ($o -is [System.Collections.IDictionary]) { return $o }
                      $h = [ordered]@{}
                      foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
                      return $h
                  }

                  # Context from the previous step (or the run inputs on the first step).
                  # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
                  $nodeIn = Get-SyncInput
                  if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
                  $ctx = Get-P $nodeIn 'ctx'
                  if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
                  if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
                  if ($null -eq $ctx) { $ctx = $nodeIn }
                  $ctx = ConvertTo-Dict $ctx

                  $spBase = Get-Secret 'ScalePad-ApiUrl'
                  $spKey = Get-Secret 'ScalePad-ApiKey'
                  $crBase = Get-Secret 'CloudRadial-BaseUrl'
                  $crPub = Get-Secret 'CloudRadial-PublicKey'
                  $crPriv = Get-Secret 'CloudRadial-PrivateKey'
                  $missingSecrets = @()
                  foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
                  if ($missingSecrets.Count -gt 0) {
                      $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
                      Set-SyncOutput @{ status = 'error'; message = $m }
                      throw $m
                  }
                  $spBase = $spBase.TrimEnd('/')
                  $crBase = $crBase.TrimEnd('/')
                  $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
                  $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
                  $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

                  function Invoke-WithRetry {
                      param([scriptblock]$Call, [string]$What)
                      for ($i = 1; $i -le 4; $i++) {
                          try { return & $Call }
                          catch {
                              $code = $null
                              try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                              if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                              throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                          }
                      }
                  }
                  function Get-SpAll {
                      # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
                      # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
                      param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
                      $items = New-Object System.Collections.ArrayList
                      $cursor = $null
                      for ($page = 1; $page -le $MaxPages; $page++) {
                          $q = @{} + $Query
                          $q['page_size'] = $PageSize
                          if ($cursor) { $q['cursor'] = $cursor }
                          $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                          $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                          try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                          catch {
                              if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                              throw
                          }
                          foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                          $cursor = Get-P $resp 'next_cursor'
                          if (Test-Blank $cursor) { break }
                          if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
                      }
                      return $items.ToArray()
                  }
                  function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
                  function Invoke-Cr {
                      param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
                      $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
                      $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
                      if ($null -ne $Body) {
                          $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                          if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                          $args2.Body = $json
                          $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
                      }
                      return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
                  }
                  function Get-CrAll {
                      # Follows @odata.nextLink.
                      param([string]$Path)
                      $items = New-Object System.Collections.ArrayList
                      $next = $Path
                      $guard = 0
                      while ($next -and $guard -lt 500) {
                          $guard++
                          $resp = Invoke-Cr -Method GET -Path $next
                          foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                          $next = Get-P $resp '@odata.nextLink'
                      }
                      return $items.ToArray()
                  }
                  function Get-CrBetaAll {
                      # /api/beta/* lists page with Skip/Take and return 10 rows by default.
                      param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
                      $all = New-Object System.Collections.ArrayList
                      $sep = if ($Path.Contains('?')) { '&' } else { '?' }
                      for ($p = 0; $p -lt $MaxPages; $p++) {
                          $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                          $rows = @($raw)
                          foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                          $rows = @($rows | Where-Object { $null -ne $_ })
                          foreach ($r in $rows) { $null = $all.Add($r) }
                          if ($rows.Count -lt $Take) { break }
                      }
                      return $all.ToArray()
                  }
                  function Get-CrArchive {
                      # Finds a company report archive by name (legacy /api/beta/archive, which also returns
                      # its inboundAddress); creates it when -Create is set. Returns $null when absent.
                      # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
                      # id is read from any known shape and, failing that, the archive is looked up again by name.
                      param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
                      function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
                      $script:ArchiveSeen = @()
                      function Find-Archive {
                          foreach ($path in @('/api/beta/archive')) {
                              $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                              $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                              $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                              $hit = @($list | Where-Object {
                                  $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                                  $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                                  $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                              }) | Select-Object -First 1
                              if ($null -ne $hit) { return $hit }
                          }
                          return $null
                      }
                      $hit = Find-Archive
                      if ($null -eq $hit -and $Create) {
                          # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                          try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                          catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                          $id = Get-ArchiveId $resp
                          $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
                      }
                      if ($null -eq $hit) { return $null }
                      $id = Get-ArchiveId $hit
                      if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
                      return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
                  }
                  function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

