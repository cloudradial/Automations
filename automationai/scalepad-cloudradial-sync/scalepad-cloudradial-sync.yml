          $crBase = $crBase.TrimEnd('/')
          $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
          $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
          $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

          function Invoke-WithRetry {
              param([scriptblock]$Call, [string]$What)
              for ($i = 1; $i -le 4; $i++) {
                  try { return & $Call }
                  catch {
                      $code = $null
                      try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                      if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                      throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                  }
              }
          }
          function Get-SpAll {
              # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
              param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500)
              $items = New-Object System.Collections.ArrayList
              $cursor = $null
              for ($page = 1; $page -le $MaxPages; $page++) {
                  $q = @{} + $Query
                  $q['page_size'] = 200
                  if ($cursor) { $q['cursor'] = $cursor }
                  $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                  $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                  $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders }
                  foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                  $cursor = Get-P $resp 'next_cursor'
                  if (Test-Blank $cursor) { break }
                  if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
              }
              return $items.ToArray()
          }
          function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
          function Invoke-Cr {
              param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
              $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
              $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
              if ($null -ne $Body) {
                  $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                  if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                  $args2.Body = $json
                  $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
              }
              return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
          }
          function Get-CrAll {
              # Follows @odata.nextLink.
              param([string]$Path)
              $items = New-Object System.Collections.ArrayList
              $next = $Path
              $guard = 0
              while ($next -and $guard -lt 500) {
                  $guard++
                  $resp = Invoke-Cr -Method GET -Path $next
                  foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                  $next = Get-P $resp '@odata.nextLink'
              }
              return $items.ToArray()
          }
          function Get-CrArchive {
              # Finds a company report archive by name (legacy /api/beta/archive, which also returns
              # its inboundAddress); creates it when -Create is set. Returns $null when absent.
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
              $list = @(Invoke-Cr -Method GET -Path "/api/beta/archive?companyId=$CompanyId")
              if ($list.Count -eq 1 -and $null -ne (Get-P $list[0] 'value')) { $list = @(Get-P $list[0] 'value' @()) }
              $hit = @($list | Where-Object { [int](Get-P $_ 'companyId' 0) -eq $CompanyId -and ([string](Get-P $_ 'name')) -eq $Name }) | Select-Object -First 1
              if ($null -eq $hit -and $Create) { $hit = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
              return $hit
          }
          function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

          $mode = [string](Get-P $ctx 'mode' 'plan')
          if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
          $apply = ($mode -eq 'apply')
          # ---- end shared helpers ----
          # =====================================================================
          # Step 6 - Deliverable PDFs -> CloudRadial Report Archive
          #   1. Download the PDF from ScalePad to the run's temp folder.
          #   2. Upload it to the archive (POST /api/beta/archive/{id}/item).
          #   3. If that route rejects the file, list it in the migration report
          #      (written to the portal by the summary step) as a manual upload.
          #   Nothing is kept after the run.
          # =====================================================================
          $phase = 'archive'
          $results = ConvertTo-Dict (Get-P $ctx 'results')
          $settings = Get-P $ctx 'settings'
          $companyId = [int](Get-P $ctx 'companyId')
          $spClientId = [string](Get-P $ctx 'scalePadClientId')
          $counts = [ordered]@{ deliverables = 0; alreadyArchived = 0; toArchive = 0; uploaded = 0; needsManual = 0; errors = 0 }
          $items = New-Object System.Collections.ArrayList

          if (-not (Get-Command Send-ArchiveUpload -ErrorAction SilentlyContinue)) {
              function script:Send-ArchiveUpload {
                  param([int]$ArchiveId, [string]$FilePath, [string]$FileName)
                  Add-Type -AssemblyName System.Net.Http
                  $client = New-Object System.Net.Http.HttpClient
                  $client.DefaultRequestHeaders.Add('Authorization', $crAuth)
                  $form = New-Object System.Net.Http.MultipartFormDataContent
                  $fc = New-Object System.Net.Http.ByteArrayContent(, [System.IO.File]::ReadAllBytes($FilePath))
                  $fc.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/pdf')
                  $form.Add($fc, 'file', $FileName)
                  $resp = $client.PostAsync("$crBase/api/beta/archive/$ArchiveId/item", $form).GetAwaiter().GetResult()
                  $text = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                  $client.Dispose()
                  if (-not $resp.IsSuccessStatusCode) { throw "HTTP $([int]$resp.StatusCode): $text" }
                  return $text
              }
          }

          if ((Get-P $ctx 'phases' @()) -notcontains $phase) {
              $results[$phase] = [ordered]@{ ran = $false }
          }
          else {
              $archiveName = [string](Get-P $settings 'archiveName' 'ScalePad QBR History')
              $archive = Get-CrArchive -CompanyId $companyId -Name $archiveName -Create:$apply -Category 'QBR'
              if ($null -eq $archive) { Warn "Archive '$archiveName' doesn't exist yet; apply will create it." }
              $archiveId = [int](Get-P $archive 'id' 0)

              $archivedSubjects = New-Object System.Collections.Generic.HashSet[string]
              if ($archiveId -gt 0) {
                  try {
                      $existingItems = Invoke-Cr -Method GET -Path "/api/beta/archive/$archiveId/item"
                      foreach ($it in @($existingItems) + @(Get-P $existingItems 'value' @())) { $s = [string](Get-P $it 'subject' (Get-P $it 'name' '')); if ($s) { $null = $archivedSubjects.Add($s.ToLowerInvariant()) } }
                  } catch { Warn "Could not list existing archive items; duplicates are possible. $($_.Exception.Message)" }
              }

              $deliverables = @(Get-SpAll '/lifecycle-manager/v1/deliverables' @{ 'filter[client.id]' = "eq:$spClientId"; sort = '-created_at' })
              $counts.deliverables = $deliverables.Count
              $limit = [int](Get-P $settings 'deliverableLimit' 20)
              foreach ($d in @($deliverables | Select-Object -First $limit)) {
                  $dname = [string](Get-P $d 'name' 'Deliverable')
                  $created = Format-Day (Get-P $d 'created_at')
                  $subject = "ScalePad - $dname$(if ($created) { " ($created)" })"
                  if ($archivedSubjects.Contains($subject.ToLowerInvariant()) -or $archivedSubjects.Contains(($subject + '.pdf').ToLowerInvariant())) { $counts.alreadyArchived++; continue }
                  $counts.toArchive++
                  $item = [ordered]@{ deliverable = $dname; subject = $subject; action = 'archive' }
                  if ($apply) {
                      $file = Join-Path ([System.IO.Path]::GetTempPath()) ("sp-" + [guid]::NewGuid().ToString('N') + '.pdf')
                      try {
                          $null = Invoke-WithRetry -What "ScalePad PDF $dname" -Call { Invoke-WebRequest -Method Get -Uri "$spBase/lifecycle-manager/v1/deliverables/$(Get-P $d 'id')/pdf" -Headers @{ 'x-api-key' = $spKey; Accept = 'application/pdf' } -OutFile $file }
                          $fileName = (($subject -replace '[\\/:*?"<>|]', '-') + '.pdf')
                          $done = $false
                          try { $null = Send-ArchiveUpload -ArchiveId $archiveId -FilePath $file -FileName $fileName; $counts.uploaded++; $item.method = 'api'; $done = $true }
                          catch { $item.apiError = $_.Exception.Message }
                          if (-not $done) {
                              $counts.needsManual++; $item.method = 'manual'
                              Warn "'$subject' needs a manual upload to the '$archiveName' archive: the archive upload route rejected it ($($item.apiError))."
                          }
                      }
                      catch { $counts.errors++; $item.error = $_.Exception.Message; Warn "Archive '$subject' failed: $($_.Exception.Message)" }
                      finally { if (Test-Path $file) { Remove-Item $file -Force -ErrorAction SilentlyContinue } }
                  }
                  $null = $items.Add($item)
              }
              if ($deliverables.Count -gt $limit) { Warn "Only the newest $limit of $($deliverables.Count) deliverables were processed (deliverableLimit)." }
              $results[$phase] = [ordered]@{ ran = $true; counts = $counts; archiveName = $archiveName; archiveId = $archiveId; items = @($items) }
          }

          $ctx.results = $results
          $ctx.warnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings))
          $c = $counts
          Set-NodeOutput @{ status = 'ok'; message = "Archive: $($c.deliverables) deliverables, $($c.alreadyArchived) already archived, $(if ($apply) { "$($c.uploaded) uploaded, $($c.needsManual) need manual upload" } else { "$($c.toArchive) to archive" }), $($c.errors) errors."; ctx = $ctx }
        timeoutSeconds: 900
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-summary
      name: Migration report
      type: powershell-script
      position:
        x: 1460
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  ScalePad to CloudRadial Sync - Migration report
          #  Deterministic, paged API-to-API transfer. mode "plan" (default) reads
          #  and reports; mode "apply" writes. Every step is self-contained: the
          #  shared helper block is repeated in each so a step can be read alone.
          #  Secrets (runner Key Vault): ScalePad-ApiUrl, ScalePad-ApiKey,
          #  CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          #  In apply mode the last step writes a migration report into the portal
          #  (report archive, or a knowledge base article). See the README first.
          # =====================================================================
          # ---- shared helpers (identical in every step of this workflow) ----
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
          function Get-P {
              # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
              param($Obj, [string]$Path, $Default = $null)
              $cur = $Obj
              foreach ($part in $Path.Split('.')) {
                  if ($null -eq $cur) { return $Default }
                  if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                  $p = $cur.PSObject.Properties[$part]
                  if (-not $p) { return $Default }
                  $cur = $p.Value
              }
              if ($null -eq $cur) { return $Default }
              return $cur
          }
          function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
          # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
          function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
          function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
          function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
          function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

          $warnings = New-Object System.Collections.ArrayList
          function Warn { param([string]$m) $null = $warnings.Add($m) }

          function ConvertTo-Dict {
              param($o)
              if ($null -eq $o) { return [ordered]@{} }
              if ($o -is [System.Collections.IDictionary]) { return $o }
              $h = [ordered]@{}
              foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
              return $h
          }

          # Context from the previous step (or the run inputs on the first step).
          $nodeIn = Get-NodeInput
          $ctx = Get-P $nodeIn 'ctx'
          if ($null -eq $ctx) { $ctx = $nodeIn }
          $ctx = ConvertTo-Dict $ctx

          $spBase = Get-Secret 'ScalePad-ApiUrl'
          $spKey = Get-Secret 'ScalePad-ApiKey'
          $crBase = Get-Secret 'CloudRadial-BaseUrl'
          $crPub = Get-Secret 'CloudRadial-PublicKey'
          $crPriv = Get-Secret 'CloudRadial-PrivateKey'
          $missingSecrets = @()
          foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
          if ($missingSecrets.Count -gt 0) {
              $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
              Set-NodeOutput @{ status = 'error'; message = $m }
              throw $m
          }
          $spBase = $spBase.TrimEnd('/')
          $crBase = $crBase.TrimEnd('/')
          $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
          $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
          $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

          function Invoke-WithRetry {
              param([scriptblock]$Call, [string]$What)
              for ($i = 1; $i -le 4; $i++) {
                  try { return & $Call }
                  catch {
                      $code = $null
                      try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                      if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                      throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                  }
              }
          }
          function Get-SpAll {
              # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
              param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500)
              $items = New-Object System.Collections.ArrayList
              $cursor = $null
              for ($page = 1; $page -le $MaxPages; $page++) {
                  $q = @{} + $Query
                  $q['page_size'] = 200
                  if ($cursor) { $q['cursor'] = $cursor }
                  $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                  $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                  $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders }
                  foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                  $cursor = Get-P $resp 'next_cursor'
                  if (Test-Blank $cursor) { break }
                  if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
              }
              return $items.ToArray()
          }
          function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
          function Invoke-Cr {
              param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
              $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
              $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
              if ($null -ne $Body) {
                  $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                  if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                  $args2.Body = $json
                  $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
              }
              return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
          }
          function Get-CrAll {
              # Follows @odata.nextLink.
              param([string]$Path)
              $items = New-Object System.Collections.ArrayList
              $next = $Path
              $guard = 0
              while ($next -and $guard -lt 500) {
                  $guard++
                  $resp = Invoke-Cr -Method GET -Path $next
                  foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                  $next = Get-P $resp '@odata.nextLink'
              }
              return $items.ToArray()
          }
          function Get-CrArchive {
              # Finds a company report archive by name (legacy /api/beta/archive, which also returns
              # its inboundAddress); creates it when -Create is set. Returns $null when absent.
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
              $list = @(Invoke-Cr -Method GET -Path "/api/beta/archive?companyId=$CompanyId")
              if ($list.Count -eq 1 -and $null -ne (Get-P $list[0] 'value')) { $list = @(Get-P $list[0] 'value' @()) }
              $hit = @($list | Where-Object { [int](Get-P $_ 'companyId' 0) -eq $CompanyId -and ([string](Get-P $_ 'name')) -eq $Name }) | Select-Object -First 1
              if ($null -eq $hit -and $Create) { $hit = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
              return $hit
          }
          function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

          $mode = [string](Get-P $ctx 'mode' 'plan')
          if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
          $apply = ($mode -eq 'apply')
          # ---- end shared helpers ----
          # =====================================================================
          # Step 7 - Migration report
          #   Builds a plain-language summary and, in apply mode, writes it into the
          #   CloudRadial portal so the result is visible there:
          #     reportTarget = archive (default) -> an HTML item in the company's
          #                    "ScalePad Migration" report archive (POST /v2/archiveitem)
          #     reportTarget = article           -> a knowledge base article (POST /v2/article)
          #     reportTarget = none              -> run output only
          #   If the archive can't be written, it falls back to an article.
          #   Plan mode writes nothing - the report is returned in the run output.
          # =====================================================================
          $results = ConvertTo-Dict (Get-P $ctx 'results')
          $settings = Get-P $ctx 'settings'
          $companyId = [int](Get-P $ctx 'companyId')
          $companyName = [string](Get-P $ctx 'companyName')
          $spName = [string](Get-P $ctx 'scalePadClientName')
          $runDay = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          function ConvertTo-HtmlText { param($s) [System.Net.WebUtility]::HtmlEncode([string]$s) }

          $lines = New-Object System.Collections.ArrayList
          $html = New-Object System.Text.StringBuilder
          $null = $lines.Add("ScalePad client '$spName' to CloudRadial company '$companyName' ($companyId), $mode mode.")
          $null = $html.Append("<h2>ScalePad migration - $(ConvertTo-HtmlText $companyName)</h2><p>Run on $runDay in <b>$(if ($apply) { 'apply' } else { 'plan (preview)' })</b> mode, from ScalePad client <b>$(ConvertTo-HtmlText $spName)</b>.</p>")
          $rows = New-Object System.Collections.ArrayList
          $attention = New-Object System.Collections.ArrayList

          $d = Get-P $results 'devices.counts'
          if ($d) {
              $act = if ($apply) { "Enriched $(Get-P $d 'enriched') and created $(Get-P $d 'created')." } else { "Would enrich $(Get-P $d 'toEnrich') and create $(Get-P $d 'toCreate')." }
              $null = $lines.Add("Devices: $(Get-P $d 'inScope') workstations, servers and VMs in ScalePad, $(Get-P $d 'matched') already in CloudRadial. $act $(Get-P $d 'unchanged') needed nothing, $(Get-P $d 'skipped') were skipped, $(Get-P $d 'errors') errors.")
              $null = $rows.Add(@('Devices', "$(Get-P $d 'inScope') in ScalePad, $(Get-P $d 'matched') already in CloudRadial", $act, "$(Get-P $d 'skipped') skipped, $(Get-P $d 'errors') errors"))
              $groups = @{}
              foreach ($s in @(Get-P $results 'devices.skipped' @())) { $r = [string](Get-P $s 'reason'); if (-not $groups.ContainsKey($r)) { $groups[$r] = New-Object System.Collections.ArrayList }; $null = $groups[$r].Add([string](Get-P $s 'device')) }
              foreach ($k in $groups.Keys) { $null = $attention.Add("Devices skipped - $k ($($groups[$k].Count)): $((@($groups[$k]) | Select-Object -First 15) -join ', ')") }
          }
          $s = Get-P $results 'software.counts'
          if ($s) {
              $act = if ($apply) { "Created $(Get-P $s 'created')." } else { "Would create $(Get-P $s 'toCreate')." }
              $null = $lines.Add("Software: $(Get-P $s 'scalePadInstalls') installed items in ScalePad, $(Get-P $s 'alreadyPresent') already in CloudRadial. $act $(Get-P $s 'noDevice') are on devices not in CloudRadial.")
              $null = $rows.Add(@('Installed software', "$(Get-P $s 'scalePadInstalls') installs on $(Get-P $s 'devicesWithSoftware') devices", $act, "$(Get-P $s 'noDevice') on devices not in CloudRadial, $(Get-P $s 'errors') errors"))
              if ([int](Get-P $s 'overCap' 0) -gt 0) { $null = $attention.Add("Software: $(Get-P $s 'overCap') records left for the next run (maxSoftwareWrites).") }
          }
          $a = Get-P $results 'assessments.counts'
          if ($a) {
              $act = if ($apply) { "Imported $(Get-P $a 'imported')." } else { "Would import $(Get-P $a 'toImport')." }
              $null = $lines.Add("Assessments: $(Get-P $a 'scalePadAssessments') in ScalePad, $(Get-P $a 'alreadyInCloudRadial') already imported. $act ($(Get-P $a 'questions') questions).")
              $null = $rows.Add(@('Assessments', "$(Get-P $a 'scalePadAssessments') in ScalePad ($(Get-P $a 'questions') questions)", $act, "$(Get-P $a 'alreadyInCloudRadial') already imported, $(Get-P $a 'errors') errors"))
          }
          $r = Get-P $results 'roadmap.counts'
          if ($r) {
              $act = if ($apply) { "Created $(Get-P $r 'created') cards and updated $(Get-P $r 'updated')." } else { "Would create $(Get-P $r 'toCreate') cards and update $(Get-P $r 'toUpdate')." }
              $null = $lines.Add("Roadmap: $(Get-P $r 'initiatives') initiatives and $(Get-P $r 'contracts') contracts. $act")
              $null = $rows.Add(@('Roadmap and budget', "$(Get-P $r 'initiatives') initiatives, $(Get-P $r 'contracts') contracts", $act, "$(Get-P $r 'errors') errors"))
          }
          $ar = Get-P $results 'archive.counts'
          if ($ar) {
              $act = if ($apply) { "Uploaded $(Get-P $ar 'uploaded')." } else { "Would archive $(Get-P $ar 'toArchive')." }
              $null = $lines.Add("Report archive: $(Get-P $ar 'deliverables') ScalePad deliverables, $(Get-P $ar 'alreadyArchived') already archived. $act $(if ($apply) { "$(Get-P $ar 'needsManual') need a manual upload." })")
              $null = $rows.Add(@('Deliverable PDFs', "$(Get-P $ar 'deliverables') in ScalePad", $act, "$(Get-P $ar 'alreadyArchived') already archived, $(Get-P $ar 'needsManual') need manual upload, $(Get-P $ar 'errors') errors"))
              $manual = @(@(Get-P $results 'archive.items' @()) | Where-Object { (Get-P $_ 'method') -eq 'manual' } | ForEach-Object { Get-P $_ 'deliverable' })
              if ($manual.Count -gt 0) { $null = $attention.Add("Upload these PDFs to the '$(Get-P $results 'archive.archiveName')' archive by hand (download them from ScalePad): $($manual -join ', ')") }
          }

          $allWarnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) | Where-Object { $_ })
          $errors = 0
          foreach ($ph in @('devices', 'software', 'assessments', 'roadmap', 'archive')) { $errors += [int](Get-P $results "$ph.counts.errors" 0) }

          $null = $html.Append('<table border="1" cellpadding="6" cellspacing="0"><tr><th>Area</th><th>In ScalePad</th><th>Result</th><th>Notes</th></tr>')
          foreach ($row in $rows) { $null = $html.Append("<tr><td>$(ConvertTo-HtmlText $row[0])</td><td>$(ConvertTo-HtmlText $row[1])</td><td>$(ConvertTo-HtmlText $row[2])</td><td>$(ConvertTo-HtmlText $row[3])</td></tr>") }
          $null = $html.Append('</table>')
          if ($attention.Count -gt 0) { $null = $html.Append('<h3>Needs attention</h3><ul>'); foreach ($x in $attention) { $null = $html.Append("<li>$(ConvertTo-HtmlText $x)</li>") }; $null = $html.Append('</ul>') }
          if ($allWarnings.Count -gt 0) { $null = $html.Append('<h3>Warnings</h3><ul>'); foreach ($x in @($allWarnings | Select-Object -First 40)) { $null = $html.Append("<li>$(ConvertTo-HtmlText $x)</li>") }; $null = $html.Append('</ul>') }
          $null = $html.Append('<p><i>Written by the AutomationAI workflow "ScalePad to CloudRadial Sync". Devices created from ScalePad are tagged ScalePad.</i></p>')

          # ---- write the report into the portal ----
          $reportLocation = 'run output only'
          $target = [string](Get-P $settings 'reportTarget' 'archive')
          $subject = "ScalePad migration - $runDay"
          if ($apply -and $target -ne 'none') {
              $written = $false
              if ($target -eq 'archive') {
                  try {
                      $archName = [string](Get-P $settings 'reportArchiveName' 'ScalePad Migration')
                      $arch = Get-CrArchive -CompanyId $companyId -Name $archName -Create -Category 'ScalePad'
                      $archId = [int](Get-P $arch 'id' 0)
                      if ($archId -le 0) { throw 'no archive id returned' }
                      $null = Invoke-Cr -Method POST -Path '/v2/archiveitem' -Body ([ordered]@{ companyId = $companyId; archiveId = $archId; subject = $subject; text = $html.ToString(); isHtml = $true; isError = ($errors -gt 0) })
                      $reportLocation = "Report archive '$archName' (Compliance > Reports), item '$subject'"
                      $written = $true
                  }
                  catch { Warn "Couldn't write the report to the archive ($($_.Exception.Message)); writing it as a knowledge base article instead." }
              }
              if (-not $written) {
                  try {
                      $null = Invoke-Cr -Method POST -Path '/v2/article' -Body ([ordered]@{ companyId = $companyId; subject = $subject; category = 'ScalePad Migration'; datePublished = (ConvertTo-IsoDate (Get-Date)); body = $html.ToString(); author = 'AutomationAI' })
                      $reportLocation = "Knowledge base article '$subject' (category ScalePad Migration)"
                  }
                  catch { Warn "Couldn't write the report to the portal: $($_.Exception.Message). It's in the run output." }
              }
          }
          $null = $lines.Add("Report: $reportLocation.")
          $allWarnings = @(@(Get-P $ctx 'warnings' @()) + @($warnings) | Where-Object { $_ })

          Set-NodeOutput @{
              status         = $(if ($errors -gt 0) { 'completed_with_errors' } else { 'ok' })
              mode           = $mode
              summary        = ($lines -join ' ')
              reportLocation = $reportLocation
              reportHtml     = $html.ToString()
              results        = $results
              warnings       = $allWarnings
              message        = ($lines -join ' ')
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: end
      name: End
      type: end
      position:
        x: 1660
        'y': 120
