# CloudRadial AutomationAI - workflow export. Import on Workflows -> Import.
# The webhook ships disabled; enable it in-portal only if something other than a manual run or Routine triggers it.
automationsWorkflow: 1
name: ScalePad to CloudRadial Sync
description: 'Migrates ScalePad Lifecycle Manager data into CloudRadial for every ScalePad client that matches a CloudRadial company by name - no input needed. Per company: devices (workstations, servers, VMs - enrich or create, warranty to expirationDate, purchase date to manufacturedDate), other hardware to flexible assets, installed software, assessments (Excel import built in memory), initiatives and contracts to Planner cards, and deliverable PDFs to the report archive, then a migration report in each portal. Send {"mode":"plan"} to preview without writing, or companyId / companyIds to limit. Re-runs update rather than duplicate. READ THE README BEFORE IMPORTING.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 80
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-resolve
      name: Match companies by name
      type: powershell-script
      position:
        x: 280
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  ScalePad to CloudRadial Sync - Resolve companies and options
          #  Deterministic, paged API-to-API transfer. With no run input it migrates
          #  every ScalePad client that matches a CloudRadial company by name; send
          #  {"mode":"plan"} to preview, or companyId / companyIds to limit.
          #  Secrets (runner Key Vault): ScalePad-ApiUrl, ScalePad-ApiKey,
          #  CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          #  See the README first.
          # =====================================================================
          # ---- shared helpers (identical in every step of this workflow) ----
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
          function Get-P {
              # Safe property read under StrictMode. Path like 'hardware_asset.serial_number'.
              param($Obj, [string]$Path, $Default = $null)
              $cur = $Obj
              foreach ($part in $Path.Split('.')) {
                  if ($null -eq $cur) { return $Default }
                  if ($cur -is [System.Collections.IDictionary]) { if ($cur.Contains($part)) { $cur = $cur[$part] } else { return $Default } ; continue }
                  $p = $cur.PSObject.Properties[$part]
                  if (-not $p) { return $Default }
                  $cur = $p.Value
              }
              if ($null -eq $cur) { return $Default }
              return $cur
          }
          function Test-Blank { param($v) if ($v -is [datetime]) { return ($v.Year -le 1) }; return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -match '^0001-01-01') }
          # PowerShell 7 turns ISO date strings in API responses into [datetime]; normalize both ways.
          function ConvertTo-IsoDate { param($v) if (Test-Blank $v) { return $null }; if ($v -is [datetime]) { return $v.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') }; $d = [datetime]::MinValue; if ([datetime]::TryParse([string]$v, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$d)) { return $d.ToString('yyyy-MM-ddTHH:mm:ssZ') }; return [string]$v }
          function Format-Day { param($v) $iso = ConvertTo-IsoDate $v; if (-not $iso) { return '' }; return $iso.Substring(0, [Math]::Min(10, $iso.Length)) }
          function Normalize-Serial { param($s) if (Test-Blank $s) { return '' } ; return ([string]$s).Trim().ToUpperInvariant() }
          function Normalize-Name { param($s) if (Test-Blank $s) { return '' } ; $t = ([string]$s).ToLowerInvariant() -replace '[^a-z0-9 ]', ' '; $t = ' ' + $t + ' '; foreach ($w in @('ltd','limited','inc','llc','plc','group','the','co','corp','corporation','company')) { $t = $t -replace " $w ", ' ' }; return ($t -replace '\s+', ' ').Trim() }

          $warnings = New-Object System.Collections.ArrayList
          function Warn { param([string]$m) $null = $warnings.Add($m) }

          function ConvertTo-Dict {
              param($o)
              if ($null -eq $o) { return [ordered]@{} }
              if ($o -is [System.Collections.IDictionary]) { return $o }
              $h = [ordered]@{}
              foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
              return $h
          }

          # Context from the previous step (or the run inputs on the first step).
          # First step: the run's Trigger input (may be empty). Later steps: the previous step's ctx.
          $nodeIn = Get-NodeInput
          if ($nodeIn -is [string] -and $nodeIn.Trim().StartsWith('{')) { $nodeIn = $nodeIn | ConvertFrom-Json }
          $ctx = Get-P $nodeIn 'ctx'
          if ($null -eq $ctx) { $ctx = Get-P $nodeIn 'trigger' }
          if ($ctx -is [string]) { $ctx = $(if ($ctx.Trim().StartsWith('{')) { $ctx | ConvertFrom-Json } else { $null }) }
          if ($null -eq $ctx) { $ctx = $nodeIn }
          $ctx = ConvertTo-Dict $ctx

          $spBase = Get-Secret 'ScalePad-ApiUrl'
          $spKey = Get-Secret 'ScalePad-ApiKey'
          $crBase = Get-Secret 'CloudRadial-BaseUrl'
          $crPub = Get-Secret 'CloudRadial-PublicKey'
          $crPriv = Get-Secret 'CloudRadial-PrivateKey'
          $missingSecrets = @()
          foreach ($p in @(@{ n = 'ScalePad-ApiUrl'; v = $spBase }, @{ n = 'ScalePad-ApiKey'; v = $spKey }, @{ n = 'CloudRadial-BaseUrl'; v = $crBase }, @{ n = 'CloudRadial-PublicKey'; v = $crPub }, @{ n = 'CloudRadial-PrivateKey'; v = $crPriv })) { if (Test-Blank $p.v) { $missingSecrets += $p.n } }
          if ($missingSecrets.Count -gt 0) {
              $m = "Please add the following secret(s) to your runner Key Vault and re-run this workflow: $($missingSecrets -join ', ')"
              Set-NodeOutput @{ status = 'error'; message = $m }
              throw $m
          }
          $spBase = $spBase.TrimEnd('/')
          $crBase = $crBase.TrimEnd('/')
          $spHeaders = @{ 'x-api-key' = $spKey; Accept = 'application/json' }
          $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)"))
          $crHeaders = @{ Authorization = $crAuth; Accept = 'application/json' }

          function Invoke-WithRetry {
              param([scriptblock]$Call, [string]$What)
              for ($i = 1; $i -le 4; $i++) {
                  try { return & $Call }
                  catch {
                      $code = $null
                      try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                      if ($code -eq 429 -and $i -lt 4) { Start-Sleep -Seconds (5 * $i); continue }
                      throw "$What failed$(if ($code) { " (HTTP $code)" }): $($_.Exception.Message)"
                  }
              }
          }
          function Get-SpAll {
              # Follows ScalePad next_cursor until the set is complete. Query values are passed raw (filter[x]=eq:y).
              # Most lists take page_size 200; some (installed software) cap at 100, so a 400 on the first page retries at 100.
              param([string]$Path, [hashtable]$Query = @{}, [int]$MaxPages = 500, [int]$PageSize = 200)
              $items = New-Object System.Collections.ArrayList
              $cursor = $null
              for ($page = 1; $page -le $MaxPages; $page++) {
                  $q = @{} + $Query
                  $q['page_size'] = $PageSize
                  if ($cursor) { $q['cursor'] = $cursor }
                  $qs = ($q.GetEnumerator() | ForEach-Object { [uri]::EscapeDataString($_.Key) + '=' + [uri]::EscapeDataString([string]$_.Value) }) -join '&'
                  $uri = "$spBase$Path" + $(if ($qs) { "?$qs" } else { '' })
                  try { $resp = Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri $uri -Headers $spHeaders } }
                  catch {
                      if ($page -eq 1 -and $PageSize -gt 100 -and "$_" -match 'HTTP 4(00|22)') { $PageSize = 100; $page = 0; continue }
                      throw
                  }
                  foreach ($d in @(Get-P $resp 'data' @())) { if ($null -ne $d) { $null = $items.Add($d) } }
                  $cursor = Get-P $resp 'next_cursor'
                  if (Test-Blank $cursor) { break }
                  if ($page -eq $MaxPages) { Warn "ScalePad $Path stopped at $MaxPages pages." }
              }
              return $items.ToArray()
          }
          function Get-SpOne { param([string]$Path) Invoke-WithRetry -What "ScalePad GET $Path" -Call { Invoke-RestMethod -Method Get -Uri "$spBase$Path" -Headers $spHeaders } }
          function Invoke-Cr {
              param([string]$Method, [string]$Path, $Body, [string]$ContentType = 'application/json')
              $uri = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
              $args2 = @{ Method = $Method; Uri = $uri; Headers = $crHeaders }
              if ($null -ne $Body) {
                  $json = if ($Body -is [string]) { $Body } else { $Body | ConvertTo-Json -Depth 12 }
                  if ($Method -eq 'PATCH' -and $json -notmatch '^\s*\[') { $json = "[$json]" }
                  $args2.Body = $json
                  $args2.ContentType = $(if ($Method -eq 'PATCH') { 'application/json-patch+json' } else { $ContentType })
              }
              return Invoke-WithRetry -What "CloudRadial $Method $Path" -Call { Invoke-RestMethod @args2 }
          }
          function Get-CrAll {
              # Follows @odata.nextLink.
              param([string]$Path)
              $items = New-Object System.Collections.ArrayList
              $next = $Path
              $guard = 0
              while ($next -and $guard -lt 500) {
                  $guard++
                  $resp = Invoke-Cr -Method GET -Path $next
                  foreach ($v in @(Get-P $resp 'value' @())) { if ($null -ne $v) { $null = $items.Add($v) } }
                  $next = Get-P $resp '@odata.nextLink'
              }
              return $items.ToArray()
          }
          function Get-CrBetaAll {
              # /api/beta/* lists page with Skip/Take and return 10 rows by default.
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-Cr -Method GET -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-P $rows[0] $k)) { $rows = @(Get-P $rows[0] $k @()) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return $all.ToArray()
          }
          function Get-CrArchive {
              # Finds a company report archive by name (legacy /api/beta/archive, which also returns
              # its inboundAddress); creates it when -Create is set. Returns $null when absent.
              # The create response doesn't reliably carry the id (a live run uploaded to archive 0), so the
              # id is read from any known shape and, failing that, the archive is looked up again by name.
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'ScalePad')
              function Get-ArchiveId { param($a) if ($null -eq $a) { return 0 }; if ($a -is [int] -or $a -is [long] -or ([string]$a -match '^\d+$')) { return [int]$a }; foreach ($k in @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')) { $v = Get-P $a $k; if ($v -and [string]$v -match '^\d+$' -and [int]$v -gt 0) { return [int]$v } }; return 0 }
              $script:ArchiveSeen = @()
              function Find-Archive {
                  foreach ($path in @('/api/beta/archive')) {
                      $list = @(); try { $list = @(Get-CrBetaAll $path) } catch { $script:ArchiveSeen += "GET $path failed: $($_.Exception.Message)"; continue }
                      $first = if ($list.Count) { ($list[0] | ConvertTo-Json -Depth 2 -Compress) } else { '' }
                      $script:ArchiveSeen += "GET $path returned $($list.Count) archive(s)$(if ($first) { '; first: ' + $first.Substring(0, [Math]::Min(300, $first.Length)) })"
                      $hit = @($list | Where-Object {
                          $n = [string](Get-P $_ 'name' (Get-P $_ 'archiveName' (Get-P $_ 'title' '')))
                          $c = Get-P $_ 'companyId' (Get-P $_ 'company.companyId' $CompanyId)
                          $_ -and $n.Trim().ToLowerInvariant() -eq $Name.Trim().ToLowerInvariant() -and ($c -as [int]) -eq $CompanyId
                      }) | Select-Object -First 1
                      if ($null -ne $hit) { return $hit }
                  }
                  return $null
              }
              $hit = Find-Archive
              if ($null -eq $hit -and $Create) {
                  # A 400 here has meant "already exists" (the list missed it) - look again before giving up.
                  try { $resp = Invoke-Cr -Method POST -Path '/api/beta/archive' -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                  catch { $again = Find-Archive; if ($null -ne $again) { $resp = $again } else { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message). Lookup: $($script:ArchiveSeen -join ' | ')" } }
                  $id = Get-ArchiveId $resp
                  $hit = if ($id -gt 0) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { Find-Archive }
              }
              if ($null -eq $hit) { return $null }
              $id = Get-ArchiveId $hit
              if ($id -le 0) { throw "Found the '$Name' archive but couldn't read its id." }
              return [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundAddress = (Get-P $hit 'inboundAddress') }
          }
          function New-PatchOps { param([hashtable]$Fields) return @($Fields.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = '/' + $_.Key; value = $_.Value } }) }

          $mode = [string](Get-P $ctx 'mode' 'plan')
          if ($mode -notin @('plan', 'apply')) { $mode = 'plan' }
          $apply = ($mode -eq 'apply')
          # ---- end shared helpers ----
          # =====================================================================
          # Step 1 - Resolve the client in ScalePad and CloudRadial, read options
          # =====================================================================
          $defaultPhases = @('devices', 'assets', 'saas', 'software', 'assessments', 'roadmap', 'insights', 'archive', 'followup')
          $allPhases = @('cleanup') + $defaultPhases
          $phasesIn = Get-P $ctx 'phases'
          $phases = @()
          if ($phasesIn -is [array]) { $phases = @($phasesIn | ForEach-Object { ([string]$_).Trim().ToLowerInvariant() }) }
          elseif (-not (Test-Blank $phasesIn)) { $phases = @(([string]$phasesIn).Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() }) }
          if ($phases.Count -eq 0 -or $phases -contains 'all') { $phases = $defaultPhases }
          if ([string](Get-P $ctx 'cleanupDuplicateSoftware' 'false') -match '^(true|yes|1)$') { $phases = @('cleanup') }
          $unknown = @($phases | Where-Object { $_ -notin $allPhases })
          if ($unknown.Count -gt 0) { Warn "Ignored unknown phase(s): $($unknown -join ', '). Valid: $($allPhases -join ', ')." }
          $phases = @($phases | Where-Object { $_ -in $allPhases })

          $settings = [ordered]@{
              deviceTypes            = @(([string](Get-P $ctx 'deviceTypes' 'WORKSTATION,SERVER,VIRTUAL')).Split(',') | ForEach-Object { $_.Trim().ToUpperInvariant() } | Where-Object { $_ })
              createMissingDevices   = -not ([string](Get-P $ctx 'createMissingDevices' 'true') -match '^(false|no|0)$')
              overwriteWarranty      = ([string](Get-P $ctx 'overwriteWarranty' 'false') -match '^(true|yes|1)$')
              assetTypes             = @(([string](Get-P $ctx 'assetTypes' '')).Split(',') | ForEach-Object { $_.Trim().ToUpperInvariant() } | Where-Object { $_ })
              includeNoSerialDevices = -not ([string](Get-P $ctx 'includeNoSerialDevices' 'true') -match '^(false|no|0)$')
              saasTypeName           = [string](Get-P $ctx 'saasTypeName' 'SaaS')
              flexibleAssetTypeName  = [string](Get-P $ctx 'flexibleAssetTypeName' 'ScalePad Assets')
              confirmCleanup         = ([string](Get-P $ctx 'confirmCleanup' 'false') -match '^(true|yes|1)$')
              skipDevicesWithSoftware = -not ([string](Get-P $ctx 'skipDevicesWithSoftware' 'true') -match '^(false|no|0)$')
              maxSoftwareWrites      = [int](Get-P $ctx 'maxSoftwareWrites' 2000)
              assessmentStatus       = [string](Get-P $ctx 'assessmentStatus' 'Completed')
              labelScoreMap          = Get-P $ctx 'labelScoreMap'
              roadmapCategory        = [string](Get-P $ctx 'roadmapCategory' 'Efficiency')
              roadmapCategoryId      = [int](Get-P $ctx 'roadmapCategoryId' 7)
              includeInactiveContracts = ([string](Get-P $ctx 'includeInactiveContracts' 'false') -match '^(true|yes|1)$')
              includeContracts       = -not ([string](Get-P $ctx 'includeContracts' 'true') -match '^(false|no|0)$')
              insightDeviceLimit     = [int](Get-P $ctx 'insightDeviceLimit' 25)
              insightCategory        = [string](Get-P $ctx 'insightCategory' (Get-P $ctx 'roadmapCategory' 'Efficiency'))
              insightCategoryId      = [int](Get-P $ctx 'insightCategoryId' (Get-P $ctx 'roadmapCategoryId' 7))
              archiveName            = [string](Get-P $ctx 'archiveName' 'ScalePad QBR History')
              deliverableLimit       = [int](Get-P $ctx 'deliverableLimit' 20)
              reportTarget           = ([string](Get-P $ctx 'reportTarget' 'article')).ToLowerInvariant()
              reportArchiveName      = [string](Get-P $ctx 'reportArchiveName' 'ScalePad Migration')
          }
          if ($settings.reportTarget -notin @('archive', 'article', 'none')) { Warn "reportTarget '$($settings.reportTarget)' isn't article, archive or none; using article."; $settings.reportTarget = 'article' }


          # --- Mode: a run with no input migrates. "plan" previews without writing. ---
          $modeIn = ([string](Get-P $ctx 'mode' '')).Trim().ToLowerInvariant()
          $mode = if ($modeIn -eq 'plan') { 'plan' } else { 'apply' }
          if ($modeIn -and $modeIn -notin @('plan', 'apply')) { Warn "mode '$modeIn' isn't plan or apply; using apply." }

          # --- Match every ScalePad client to a CloudRadial company by name ---
          $spClients = @(Get-SpAll '/core/v1/clients')
          $crCos = @(Get-CrAll "/v2/odata/company?`$select=companyId,name")
          $crById = @{}; $crByName = @{}
          foreach ($c in $crCos) {
              $crById[[int](Get-P $c 'companyId')] = $c
              $k = Normalize-Name (Get-P $c 'name'); if ($k) { if (-not $crByName.ContainsKey($k)) { $crByName[$k] = @() }; $crByName[$k] += $c }
          }
          $spById = @{}; foreach ($s in $spClients) { $spById[[string](Get-P $s 'id')] = $s }
          $pairs = New-Object System.Collections.ArrayList
          $unmatched = New-Object System.Collections.ArrayList
          foreach ($s in $spClients) {
              $hits = @($crByName[(Normalize-Name (Get-P $s 'name'))] | Where-Object { $_ })
              if ($hits.Count -eq 1) { $null = $pairs.Add([ordered]@{ scalePadClientId = [string](Get-P $s 'id'); scalePadClientName = [string](Get-P $s 'name'); companyId = [int](Get-P $hits[0] 'companyId'); companyName = [string](Get-P $hits[0] 'name') }) }
              elseif ($hits.Count -gt 1) { $null = $unmatched.Add("$(Get-P $s 'name') (matches $($hits.Count) CloudRadial companies)") }
              else { $null = $unmatched.Add([string](Get-P $s 'name')) }
          }

          # --- Optional limits: one company, a list, or a cap ---
          $limitIds = @()
          foreach ($k in @('companyId', 'companyIds')) {
              $v = Get-P $ctx $k
              if ($v -is [array]) { $limitIds += @($v | ForEach-Object { [int]$_ } | Where-Object { $_ -gt 0 }) }
              elseif (-not (Test-Blank $v) -and [string]$v -ne '0') { $limitIds += @(([string]$v).Split(',') | ForEach-Object { [int]$_.Trim() } | Where-Object { $_ -gt 0 }) }
          }
          $collisions = @($pairs | Group-Object { $_.companyId } | Where-Object { $_.Count -gt 1 })
          $collidedIds = @($collisions | ForEach-Object { [int]$_.Name })
          foreach ($g in $collisions) {
              $null = $unmatched.Add("$((@($g.Group | ForEach-Object { $_.scalePadClientName })) -join ' and ') all match CloudRadial company '$($g.Group[0].companyName)' ($($g.Name)) - not migrated. Run with {""companyId"": $($g.Name), ""scalePadClientId"": ""<ScalePad id>""} to pick one: $((@($g.Group | ForEach-Object { "$($_.scalePadClientName) = $($_.scalePadClientId)" })) -join '; ').")
          }
          $spIdIn = [string](Get-P $ctx 'scalePadClientId' '')
          $spNameIn = [string](Get-P $ctx 'scalePadClientName' '')
          $targets = @($pairs | Where-Object { $_.companyId -notin $collidedIds })
          if (-not (Test-Blank $spIdIn)) {
              $targets = @($pairs | Where-Object { $_.scalePadClientId -eq $spIdIn })
              if ($targets.Count -eq 0) {
                  # Named explicitly: pair it even when the names differ.
                  $s = $spById[$spIdIn]; if ($null -eq $s) { $s = Get-SpOne "/core/v1/clients/$spIdIn" }
                  $cid = if ($limitIds.Count -eq 1) { $limitIds[0] } else { 0 }
                  if ($cid -le 0 -or -not $crById.ContainsKey($cid)) { throw "ScalePad client $spIdIn doesn't match a CloudRadial company by name. Send companyId as well." }
                  $targets = @([ordered]@{ scalePadClientId = $spIdIn; scalePadClientName = [string](Get-P $s 'name' (Get-P $s 'data.name' '')); companyId = $cid; companyName = [string](Get-P $crById[$cid] 'name') })
              }
          }
          elseif (-not (Test-Blank $spNameIn)) { $targets = @($targets | Where-Object { (Normalize-Name $_.scalePadClientName) -eq (Normalize-Name $spNameIn) }) }
          if ($limitIds.Count -gt 0 -and (Test-Blank $spIdIn)) {
              $targets = @($targets | Where-Object { $_.companyId -in $limitIds })
              $missing = @($limitIds | Where-Object { $_ -notin @($targets | ForEach-Object { $_.companyId }) })
              foreach ($m in $missing) { Warn "CloudRadial company $m $(if ($crById.ContainsKey($m)) { "('$(Get-P $crById[$m] 'name')') has no ScalePad client with the same name - send scalePadClientId to pair it" } else { 'was not found' })." }
          }
          $max = [int](Get-P $ctx 'maxCompanies' 0)
          if ($max -gt 0 -and $targets.Count -gt $max) { Warn "Limited to the first $max of $($targets.Count) matched companies (maxCompanies)."; $targets = @($targets | Select-Object -First $max) }

          $items = @($targets | ForEach-Object {
              [ordered]@{
                  mode = $mode; phases = $phases; settings = $settings
                  companyId = $_.companyId; companyName = $_.companyName
                  scalePadClientId = $_.scalePadClientId; scalePadClientName = $_.scalePadClientName
                  results = [ordered]@{}; warnings = @($warnings)
              }
          })
          $names = (@($targets | Select-Object -First 8 | ForEach-Object { "$($_.companyName) ($($_.companyId))" }) -join ', ') + $(if ($targets.Count -gt 8) { ', ...' } else { '' })
          Set-NodeOutput @{
              status = 'ok'
              message = "$(if ($mode -eq 'apply') { 'Migrating' } else { 'Previewing (plan mode, no writes)' }) $($targets.Count) compan$(if ($targets.Count -eq 1) { 'y' } else { 'ies' }) matched by name: $names. Phases: $($phases -join ', ').$(if ($unmatched.Count) { " $($unmatched.Count) ScalePad clients have no CloudRadial company with the same name." })"
              mode = $mode; phases = $phases
              targets = $items
              matched = @($targets | ForEach-Object { [ordered]@{ companyId = $_.companyId; companyName = $_.companyName; scalePadClientId = $_.scalePadClientId; scalePadClientName = $_.scalePadClientName } })
              unmatched = @($unmatched | Select-Object -First 500)
              warnings = @($warnings)
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {
            "mode": "plan",
            "companyId": 9
          }
    - id: node-sync
      name: Migrate each company
      type: foreach
      position:
        x: 500
        'y': 120
      properties:
        collectionExpression: '{{ nodes.node-resolve.output.targets }}'
        itemVariableName: item
        bodyLanguage: powershell
        script: |
          # =====================================================================
          #  ScalePad to CloudRadial Sync - Migrate one company (all phases)
          #  Deterministic, paged API-to-API transfer. With no run input it migrates
          #  every ScalePad client that matches a CloudRadial company by name; send
          #  {"mode":"plan"} to preview, or companyId / companyIds to limit.
          #  Secrets (runner Key Vault): ScalePad-ApiUrl, ScalePad-ApiKey,
          #  CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          #  See the README first.
          # =====================================================================
          # Runs once per matched company (the For Each item, $item). Each phase below is the
          # same script as a stand-alone step; a phase reads the context the previous one produced.
          $ErrorActionPreference = 'Stop'
