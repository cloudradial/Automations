                      $results[$phase] = [ordered]@{ ran = $false }
                  }
                  else {
                      $cards = @{}
                      foreach ($p in @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $companyId&`$select=productId,subject")) { $cards[([string](Get-P $p 'subject')).ToLowerInvariant()] = $p }

                      # The insights list takes only a client filter (no paging parameters).
                      $resp = Get-SpOne "/lifecycle-manager/v1/insights?filter%5Bclient.id%5D=eq%3A$spClientId"
                      $insights = @(Get-P $resp 'data' @())
