                          $state = [string](Get-P $i 'state' '')
                          $cat = [string](Get-P $i 'category_label' (Get-P $i 'category' ''))
                          $null = $table.Add([ordered]@{ insight = $title; category = $cat; risk = $risk; affected = $affected; trend = $trend; state = $state })
