                                  category = [string](Get-P $settings 'insightCategory' (Get-P $settings 'roadmapCategory' 'Efficiency')); productCategoryId = [int](Get-P $settings 'insightCategoryId' (Get-P $settings 'roadmapCategoryId' 7))
