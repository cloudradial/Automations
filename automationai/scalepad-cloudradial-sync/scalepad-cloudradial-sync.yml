                  $companyId = [int](Get-P $ctx 'companyId')
                  $confirmed = [bool](Get-P $settings 'confirmCleanup' $false)
                  $doDelete = $apply -and $confirmed
                  $SyncTag = 'Added by ScalePad to CloudRadial Sync'
