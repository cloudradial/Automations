                            if ($closed) { $cdt = ConvertTo-PsaUtcText $cd; if (-not $cdt -or $cdt -lt $fromIso -or $cdt -ge $toIso) { continue } }
                            $st = [string](Get-PsaProp $t 'status')
                            $null = $rows.Add((New-PsaTicketRow (Get-PsaProp $t 'id') (Get-PsaProp $t 'number') (Get-PsaProp $t 'subject') (Get-PsaProp $t 'customer_id') (Get-PsaProp $t 'customer_business_then_name') (Get-PsaProp $t 'contact_id') (Get-PsaProp $t 'contact_fullname') $st ($closed -or $st -eq 'Resolved') $cd (Get-PsaProp $t 'created_at') (Get-PsaProp $t 'updated_at') (Get-PsaProp $t 'user_id') (Get-PsaPath $t 'user.full_name')))
                        }
                        if ($PsaState.FindTruncated -or $page -ge [int](Get-PsaPath $r 'meta.total_pages')) { break }
                    }
                }
                'zendesk' {
                    # Unverified: the solved>/solved< search terms with a UTC time. Search returns at most 1,000 results,
                    # and a ticket has no solved date of its own (it is in ticket metrics), so closedDate stays empty.
                    $q = if ($closed) { "type:ticket status>=solved solved>$($from.AddSeconds(-1).ToString('yyyy-MM-ddTHH:mm:ssZ')) solved<$toIso" } else { 'type:ticket status<solved' }
                    if ($CompanyId) { $q += " organization:$CompanyId" }
                    $path = "/search?query=$(ConvertTo-PsaQuery $q)&sort_by=created_at&sort_order=asc&per_page=100"
                    for ($page = 1; $page -le 10 -and $path; $page++) {
                        $r = Invoke-Psa GET $path
                        foreach ($t in @(Get-PsaProp $r 'results' | Where-Object { $null -ne $_ })) {
                            if (& $full) { $PsaState.FindTruncated = $true; break }
                            $st = [string](Get-PsaProp $t 'status')
                            $null = $rows.Add((New-PsaTicketRow (Get-PsaProp $t 'id') $null (Get-PsaProp $t 'subject') (Get-PsaProp $t 'organization_id') '' (Get-PsaProp $t 'requester_id') '' $st ($st -in @('solved', 'closed')) $null (Get-PsaProp $t 'created_at') (Get-PsaProp $t 'updated_at') (Get-PsaProp $t 'assignee_id') ''))
                        }
                        if ($PsaState.FindTruncated) { break }
                        $path = [string](Get-PsaProp $r 'next_page')
                    }
                }
            }
            return @($rows)
        }

        # A ticket's time entries. Returns @{ supported; entries; reason }:
        #   supported  $false when this PSA can't report time (Zendesk without -ZendeskTimeFieldId); reason says why
        #   entries    @(@{ id; hours; notes; notesKnown; billable ($true, $false or $null when not set); billableKnown; who; date })
        #              notesKnown and billableKnown are $false when the PSA has no such field for that entry.
        function Get-PsaTimeEntries {
            param([string]$TicketId, [string]$ZendeskTimeFieldId = '')
            $c = Get-PsaConn
            $out = New-Object System.Collections.ArrayList
            $add = {
                param($Id, $Hours, $Notes, [bool]$NotesKnown, $Billable, [bool]$BillableKnown, $Who, $Date)
                $h = 0.0; try { $h = [double]$Hours } catch { }
                $null = $out.Add([ordered]@{ id = [string]$Id; hours = [Math]::Round($h, 2); notes = [string]$Notes; notesKnown = $NotesKnown; billable = $Billable; billableKnown = $BillableKnown; who = [string]$Who; date = (ConvertTo-PsaUtcText $Date) })
            }
            $longer = { param($a, $b) $x = ([string]$a).Trim(); $y = ([string]$b).Trim(); if ($x.Length -ge $y.Length) { $x } else { $y } }
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: /time/entries with chargeToType and chargeToId conditions; billableOption values Billable, DoNotBill, NoCharge, NoDefault.
                    $cond = "chargeToType=`"ServiceTicket`" and chargeToId=$TicketId"
                    foreach ($e in @(Invoke-Psa GET "/time/entries?conditions=$(ConvertTo-PsaQuery $cond)&pageSize=1000" | Where-Object { $null -ne $_ })) {
                        $bo = [string](Get-PsaProp $e 'billableOption')
                        $b = if ($bo -eq 'Billable') { $true } elseif ($bo -in @('DoNotBill', 'NoCharge')) { $false } else { $null }
                        $who = Get-PsaPath $e 'member.name'; if (-not $who) { $who = Get-PsaPath $e 'member.identifier' }
                        & $add (Get-PsaProp $e 'id') (Get-PsaProp $e 'actualHours') (& $longer (Get-PsaProp $e 'notes') (Get-PsaProp $e 'internalNotes')) $true $b $true $who (Get-PsaProp $e 'timeStart')
                    }
                }
                'autotask' {
                    # Unverified: TimeEntries query on ticketID, and hoursWorked, summaryNotes, internalNotes, isNonBillable.
                    $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'ticketID'; value = [long]$TicketId }) }
                    foreach ($e in @(Get-PsaProp (Invoke-Psa GET "/TimeEntries/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 5 -Compress))") 'items' | Where-Object { $null -ne $_ })) {
                        $nb = Get-PsaProp $e 'isNonBillable'
                        $b = if ($null -eq $nb) { $null } else { -not [bool]$nb }
                        & $add (Get-PsaProp $e 'id') (Get-PsaProp $e 'hoursWorked') (& $longer (Get-PsaProp $e 'summaryNotes') (Get-PsaProp $e 'internalNotes')) $true $b $true (Get-PsaProp $e 'resourceID') (Get-PsaProp $e 'dateWorked')
                    }
                }
                'halopsa' {
                    # Unverified: /Actions?ticket_id with excludesys, timetaken in hours, and actionchargehours/actionnonchargehours
                    # as the billable split. Only actions with time count as time entries.
                    $r = Invoke-Psa GET "/Actions?ticket_id=$TicketId&excludesys=true"
                    $list = @(Get-PsaProp $r 'actions'); if (-not @($list | Where-Object { $null -ne $_ }).Count -and $r -is [array]) { $list = @($r) }
                    foreach ($e in @($list | Where-Object { $null -ne $_ })) {
                        $h = 0.0; try { $h = [double](Get-PsaProp $e 'timetaken') } catch { }
                        if ($h -le 0) { continue }
                        $ch = 0.0; $nch = 0.0; try { $ch = [double](Get-PsaProp $e 'actionchargehours') } catch { }; try { $nch = [double](Get-PsaProp $e 'actionnonchargehours') } catch { }
                        $b = if ($ch -gt 0) { $true } elseif ($nch -gt 0) { $false } else { $null }
                        $note = Get-PsaProp $e 'note'; if (-not $note) { $note = Get-PsaProp $e 'note_html' }
                        & $add (Get-PsaProp $e 'id') $h (ConvertFrom-PsaHtml ([string]$note)) $true $b $true (Get-PsaProp $e 'who') (Get-PsaProp $e 'datetime')
                    }
                }
                'kaseyabms' {
                    # Vendor docs: GET /v2/timelogs with Filter.TicketId, and Timespent, Notes, InternalNotes, IsBillable.
                    # Unverified live: that Timespent is in hours.
                    for ($page = 1; $page -le 20; $page++) {
                        $r = Invoke-Psa GET "/timelogs?Filter.TicketId=$TicketId&PageSize=100&PageNumber=$page"
                        $list = @(Get-PsaProp $r 'Result' | Where-Object { $null -ne $_ })
                        foreach ($e in $list) {
                            $ib = Get-PsaProp $e 'IsBillable'
                            & $add (Get-PsaProp $e 'Id') (Get-PsaProp $e 'Timespent') (& $longer (Get-PsaProp $e 'Notes') (Get-PsaProp $e 'InternalNotes')) $true $(if ($null -eq $ib) { $null } else { [bool]$ib }) $true ("$(Get-PsaProp $e 'FirstName') $(Get-PsaProp $e 'LastName')".Trim()) (Get-PsaProp $e 'StartDate')
                        }
                        if ($list.Count -lt 100) { break }
                    }
                }
                'syncro' {
                    # Vendor docs: GET /ticket_timers?ticket_id with active_duration (seconds), billable and notes.
                    # Unverified: labour charged straight as ticket line items (no timer) is read from the ticket's line_items
                    # when the name looks like labour or time, with quantity as hours.
                    for ($page = 1; $page -le 20; $page++) {
                        $r = Invoke-Psa GET "/ticket_timers?ticket_id=$TicketId&page=$page"
                        foreach ($e in @(Get-PsaProp $r 'ticket_timers' | Where-Object { $null -ne $_ })) {
                            $sec = 0.0; try { $sec = [double](Get-PsaProp $e 'active_duration') } catch { }
                            $bl = Get-PsaProp $e 'billable'
                            & $add (Get-PsaProp $e 'id') ($sec / 3600) (Get-PsaProp $e 'notes') $true $(if ($null -eq $bl) { $null } else { [bool]$bl }) $true (Get-PsaProp $e 'user_id') (Get-PsaProp $e 'start_time')
                        }
                        if ($page -ge [int](Get-PsaPath $r 'meta.total_pages')) { break }
                    }
                    if (-not $out.Count) {
                        $t = Get-PsaProp (Invoke-Psa GET "/tickets/$TicketId") 'ticket'
                        foreach ($li in @(Get-PsaProp $t 'line_items' | Where-Object { $null -ne $_ })) {
                            $nm = "$(Get-PsaProp $li 'name') $(Get-PsaProp $li 'item')"
                            if ($nm -notmatch '(?i)labou?r|hour|time') { continue }
                            & $add "line-$(Get-PsaProp $li 'id')" (Get-PsaProp $li 'quantity') (Get-PsaProp $li 'description') $true $true $true '' (Get-PsaProp $li 'created_at')
                        }
                    }
                }
                'zendesk' {
                    # Zendesk has no native time entries. The Time Tracking app keeps the ticket's total seconds in a custom
                    # field; with that field's id the ticket counts as having time when the total is above zero. Notes and the
                    # billable flag aren't available. Unverified: that the field holds whole seconds.
                    if (-not $ZendeskTimeFieldId) { return @{ supported = $false; entries = @(); reason = 'Zendesk has no native time entries. Give zendesk_time_field_id (the Time Tracking app''s "Total time spent (sec)" field id) to check for tickets closed with no time.' } }
                    $t = Get-PsaProp (Invoke-Psa GET "/tickets/$TicketId") 'ticket'
                    $f = @(Get-PsaProp $t 'custom_fields' | Where-Object { $null -ne $_ -and [string](Get-PsaProp $_ 'id') -eq $ZendeskTimeFieldId }) | Select-Object -First 1
                    $sec = 0.0; if ($f) { try { $sec = [double](Get-PsaProp $f 'value') } catch { } }
                    if ($sec -gt 0) { & $add "zd-$TicketId" ($sec / 3600) '' $false $null $false '' (Get-PsaProp $t 'updated_at') }
                }
            }
            return @{ supported = $true; entries = @($out); reason = '' }
        }

        # A company's active contacts. Returns @{ primarySupported; contacts = @(@{ id; name; email; primary }) }.
        # primarySupported is $false for PSAs with no primary-contact flag (Syncro, Zendesk); primary is then always $false.
        function Get-PsaCompanyContacts {
            param([string]$CompanyId)
            $c = Get-PsaConn
            if ($CompanyId -notmatch '^\d+$') { throw "Get-PsaCompanyContacts needs a numeric company id (it was '$CompanyId')." }
            $list = New-Object System.Collections.ArrayList
            $supported = $true
            switch ($c.Psa) {
                'connectwise' {
                    # Unverified: company.defaultContact as the primary contact, and the contacts conditions.
                    $co = Invoke-Psa GET "/company/companies/$CompanyId"
                    $def = [string](Get-PsaPath $co 'defaultContact.id')
                    $cond = "company/id=$CompanyId and inactiveFlag=false"
                    foreach ($p in @(Invoke-Psa GET "/company/contacts?conditions=$(ConvertTo-PsaQuery $cond)&pageSize=1000" | Where-Object { $null -ne $_ })) {
                        $id = [string](Get-PsaProp $p 'id')
                        $null = $list.Add([ordered]@{ id = $id; name = "$(Get-PsaProp $p 'firstName') $(Get-PsaProp $p 'lastName')".Trim(); email = ''; primary = (($def -and $id -eq $def) -or (Get-PsaProp $p 'defaultFlag') -eq $true) })
                    }
                }
                'autotask' {
                    # Unverified: Contacts query on companyID and isActive, and the primaryContact flag.
                    $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'companyID'; value = [long]$CompanyId }, [ordered]@{ op = 'eq'; field = 'isActive'; value = 1 }) }
                    foreach ($p in @(Get-PsaProp (Invoke-Psa GET "/Contacts/query?search=$(ConvertTo-PsaQuery ($s | ConvertTo-Json -Depth 5 -Compress))") 'items' | Where-Object { $null -ne $_ })) {
                        $null = $list.Add([ordered]@{ id = [string](Get-PsaProp $p 'id'); name = "$(Get-PsaProp $p 'firstName') $(Get-PsaProp $p 'lastName')".Trim(); email = [string](Get-PsaProp $p 'emailAddress'); primary = ((Get-PsaProp $p 'primaryContact') -eq $true) })
                    }
                }
                'halopsa' {
                    # Unverified: /Users?client_id and the isprimarycontact flag name.
                    $r = Invoke-Psa GET "/Users?client_id=$CompanyId&count=500"
                    $users = @(Get-PsaProp $r 'users'); if (-not @($users | Where-Object { $null -ne $_ }).Count -and $r -is [array]) { $users = @($r) }
                    foreach ($p in @($users | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'inactive') -ne $true })) {
                        $pri = ((Get-PsaProp $p 'isprimarycontact') -eq $true) -or ((Get-PsaProp $p 'is_primary_contact') -eq $true)
                        $null = $list.Add([ordered]@{ id = [string](Get-PsaProp $p 'id'); name = [string](Get-PsaProp $p 'name'); email = [string](Get-PsaProp $p 'emailaddress'); primary = $pri })
                    }
                }
                'kaseyabms' {
                    # Vendor docs: GET /v2/crm/contacts/summary with Filter.AccountId and Filter.IsActive; IsPoc marks the point of contact.
                    for ($page = 1; $page -le 20; $page++) {
                        $r = Invoke-Psa GET "/crm/contacts/summary?Filter.AccountId=$CompanyId&Filter.IsActive=true&PageSize=100&PageNumber=$page"
                        $rs = @(Get-PsaProp $r 'Result' | Where-Object { $null -ne $_ })
                        foreach ($p in $rs) {
                            $em = @(Get-PsaProp $p 'Emails' | Where-Object { $null -ne $_ }) | Select-Object -First 1
                            $null = $list.Add([ordered]@{ id = [string](Get-PsaProp $p 'Id'); name = "$(Get-PsaProp $p 'FirstName') $(Get-PsaProp $p 'LastName')".Trim(); email = [string](Get-PsaProp $em 'EmailAddress'); primary = ((Get-PsaProp $p 'IsPoc') -eq $true) })
                        }
                        if ($rs.Count -lt 100) { break }
                    }
                }
                'syncro' {
                    # Vendor docs: GET /contacts?customer_id. Syncro contacts have no primary flag.
                    $supported = $false
                    for ($page = 1; $page -le 20; $page++) {
                        $r = Invoke-Psa GET "/contacts?customer_id=$CompanyId&page=$page"
                        foreach ($p in @(Get-PsaProp $r 'contacts' | Where-Object { $null -ne $_ })) { $null = $list.Add([ordered]@{ id = [string](Get-PsaProp $p 'id'); name = [string](Get-PsaProp $p 'name'); email = [string](Get-PsaProp $p 'email'); primary = $false }) }
                        if ($page -ge [int](Get-PsaPath $r 'meta.total_pages')) { break }
                    }
                }
                'zendesk' {
                    # Unverified: GET /organizations/{id}/users. Zendesk organizations have no primary contact.
                    $supported = $false
                    foreach ($p in @(Get-PsaProp (Invoke-Psa GET "/organizations/$CompanyId/users?per_page=100") 'users' | Where-Object { $null -ne $_ -and (Get-PsaProp $_ 'active') -ne $false })) {
                        $null = $list.Add([ordered]@{ id = [string](Get-PsaProp $p 'id'); name = [string](Get-PsaProp $p 'name'); email = [string](Get-PsaProp $p 'email'); primary = $false })
                    }
                }
            }
            return @{ primarySupported = $supported; contacts = @($list) }
        }

        # Sets a ticket's contact (the requester in Zendesk). Throws when the PSA rejects it.
        function Set-PsaTicketContact {
            param([string]$Id, [string]$ContactId)
            $c = Get-PsaConn
            if ($ContactId -notmatch '^\d+$') { throw "Set-PsaTicketContact needs a numeric contact id (it was '$ContactId')." }
            switch ($c.Psa) {
                # Unverified: json-patch on contact, the same shape as owner (PSA.md).
                'connectwise' { $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'contact'; value = @{ id = [int]$ContactId } }) }
                # Unverified: PATCH /Tickets with contactID, the at_update_ticket shape.
                'autotask' { $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; contactID = [long]$ContactId }) }
                # Unverified: POST /Tickets with user_id updates the end user.
                'halopsa' { $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; user_id = [long]$ContactId }) }
                # Vendor docs: PATCH /v2/servicedesk/tickets/{id} json-patch; ContactId is a ticket field. Unverified live.
                'kaseyabms' { $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/ContactId'; value = [long]$ContactId }) }
                # Vendor docs: PUT /tickets/{id} takes contact_id in a flat body. Unverified live.
                'syncro' { $null = Invoke-Psa PUT "/tickets/$Id" @{ contact_id = [long]$ContactId } }
                # Vendor docs: requester_id on the ticket. Unverified live.
                'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ requester_id = [long]$ContactId } } }
            }
        }
        # ---------- end src/psa-extra.ps1 ----------
        # <<< src/psa-extra.ps1

        # === NODE: Review time entries ===
        # Reads each closed ticket's time entries (read-only) and flags:
        #   no_time           the ticket was closed with no time logged (or only zero-hour entries)
        #   short_note        a time entry whose note is shorter than min_note_chars
        #   missing_billable  a time entry with no billable setting, where the PSA has one
        $ErrorActionPreference = 'Stop'
        function Get-TeProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Read-TeState {
            param([string[]]$Need)
            $raw = Get-NodeInput
            if ($null -ne $raw -and $null -eq (Get-TeProp $raw 'inputs') -and $null -ne (Get-TeProp $raw 'output')) { $raw = Get-TeProp $raw 'output' }
            $st = [ordered]@{}
            if ($raw -is [System.Collections.IDictionary]) { foreach ($k in $raw.Keys) { $st[[string]$k] = $raw[$k] } }
            elseif ($null -ne $raw) { foreach ($p in $raw.PSObject.Properties) { $st[$p.Name] = $p.Value } }
            foreach ($k in @('status', 'message', 'public_note', 'internal_note', 'ticket_id')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('actions', 'warnings', 'tickets')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k]) } }
            foreach ($k in $Need) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { throw "This step expects the output of the previous step (no '$k')." } }
            return $st
        }
        function Stop-TeRun {
            param($St, [string]$Msg)
            $St['status'] = 'error'; $St['message'] = $Msg; $St['internal_note'] = "Time entry review stopped: $Msg"
            Set-NodeOutput $St
            throw $Msg
        }
        function Get-TeShort { param([string]$s, [int]$n) $s = ($s -replace '\s+', ' ').Trim(); if ($s.Length -gt $n) { return $s.Substring(0, $n - 1) + '...' }; return $s }

        $te = Read-TeState @('inputs', 'psa')
        $opt = $te['inputs']
        $minNote = [int](Get-TeProp $opt 'min_note_chars')
        $checkBillable = [bool](Get-TeProp $opt 'check_billable')
        $zdField = [string](Get-TeProp $opt 'zendesk_time_field_id')
        $tickets = @($te['tickets'] | Where-Object { $null -ne $_ })
        $warn = @($te['warnings'])
        $findings = New-Object System.Collections.ArrayList
        $counts = [ordered]@{ tickets_closed = $tickets.Count; tickets_checked = 0; no_time = 0; short_note = 0; missing_billable = 0; entries_read = 0; unreadable = 0 }
        $timeSupported = $true; $timeReason = ''

        if ($tickets.Count) {
            try { $null = Connect-Psa ([string]$te['psa']) }
            catch { Stop-TeRun $te "Couldn't connect to the PSA: $($_.Exception.Message)" }
        }
        $psaName = Get-PsaName

        foreach ($t in $tickets) {
            $tid = [string](Get-TeProp $t 'id')
            $base = [ordered]@{ ticket_id = $tid; number = [string](Get-TeProp $t 'number'); summary = (Get-TeShort ([string](Get-TeProp $t 'summary')) 80); company = [string](Get-TeProp $t 'companyName'); companyId = [string](Get-TeProp $t 'companyId'); assignee = [string](Get-TeProp $t 'assigneeName') }
            if (-not $base.assignee) { $base.assignee = [string](Get-TeProp $t 'assigneeId') }
            if (-not $base.company -and $base.companyId) { $base.company = "Company $($base.companyId)" }
            $res = $null
            try { $res = Get-PsaTimeEntries -TicketId $tid -ZendeskTimeFieldId $zdField }
            catch {
                $m = $_.Exception.Message
                if ($m -match 'HTTP 40[13]') { Stop-TeRun $te "The $psaName API account isn't allowed to read time entries ($(if ($m -match 'HTTP 401') { 'HTTP 401' } else { 'HTTP 403' })). Give it read access to time entries and run again." }
                $counts.unreadable++
                $warn += "Couldn't read the time on ticket $($base.number): $m"
                continue
            }
            if (-not [bool]$res.supported) { $timeSupported = $false; $timeReason = [string]$res.reason; break }
            $counts.tickets_checked++
            $entries = @($res.entries | Where-Object { $null -ne $_ })
            $counts.entries_read += $entries.Count
            $hours = 0.0; foreach ($e in $entries) { $hours += [double]$e.hours }
            if ($hours -le 0) {
                $counts.no_time++
                $f = [ordered]@{}; foreach ($k in $base.Keys) { $f[$k] = $base[$k] }
                $f.issue = 'no_time'; $f.detail = 'Closed with no time logged.'; $f.technician = $base.assignee; $f.hours = 0; $f.entry_id = ''
                $null = $findings.Add($f)
            }
            foreach ($e in $entries) {
                if ([double]$e.hours -le 0) { continue }
                $who = [string]$e.who; if (-not $who) { $who = $base.assignee }
                if ($minNote -gt 0 -and [bool]$e.notesKnown) {
                    $len = ([string]$e.notes).Trim().Length
                    if ($len -lt $minNote) {
                        $counts.short_note++
                        $f = [ordered]@{}; foreach ($k in $base.Keys) { $f[$k] = $base[$k] }
                        $f.issue = 'short_note'
                        $f.detail = $(if ($len -eq 0) { 'Time entry has no note.' } else { "Time entry note is only $len characters: `"$(Get-TeShort ([string]$e.notes) 60)`"" })
                        $f.technician = $who; $f.hours = [double]$e.hours; $f.entry_id = [string]$e.id
                        $null = $findings.Add($f)
                    }
                }
                if ($checkBillable -and [bool]$e.billableKnown -and $null -eq $e.billable) {
                    $counts.missing_billable++
                    $f = [ordered]@{}; foreach ($k in $base.Keys) { $f[$k] = $base[$k] }
                    $f.issue = 'missing_billable'; $f.detail = 'Time entry has no billable setting.'; $f.technician = $who; $f.hours = [double]$e.hours; $f.entry_id = [string]$e.id
                    $null = $findings.Add($f)
                }
            }
        }
        if (-not $timeSupported) { $warn += $timeReason }

        $te['warnings'] = $warn
        $te['findings'] = @($findings)
        $te['counts'] = $counts
        $te['time_supported'] = $timeSupported
        $te['time_reason'] = $timeReason
        $te['actions'] = @($te['actions']) + $(if ($timeSupported) { "Read $($counts.entries_read) time entr$(if ($counts.entries_read -eq 1) { 'y' } else { 'ies' }) on $($counts.tickets_checked) ticket(s)." } else { "Skipped the time check: $timeReason" })
        Set-NodeOutput $te
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: node-send
    name: Email the service manager
    type: powershell-script
    position:
      x: 880
      y: 200
    properties:
      script: |-
        # >>> src/mail.ps1 (generated by src/build.js; edit the source, not this block)
        # ---------- src/mail.ps1: staff email through Postmark ----------
        # The identical file ships in automationai/time-entry-review/src and automationai/psa-hygiene/src.
        # Same secret names as the Postmark catalog extension and automationai/deliver-result:
        #   Postmark-ServerToken (required), Postmark-FromEmail (required, a verified sender), Postmark-ApiUrl (optional,
        #   default https://api.postmarkapp.com).
        # Send-PmMail returns @{ configured; sent; reason; messageId } and never throws, so a report still finishes
        # when email fails. configured is $false when the token or sender is missing.
        function Get-PmSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
        function Get-PmProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Test-PmConfigured { return (-not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-ServerToken')) -and -not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-FromEmail'))) }

        function Send-PmMail {
            param([string[]]$To, [string]$Subject, [string]$Html, [string]$Text = '', [string]$Stream = 'outbound')
            $token = Get-PmSecret 'Postmark-ServerToken'
            $from = Get-PmSecret 'Postmark-FromEmail'
            if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($from)) {
                $miss = @(@('Postmark-ServerToken', 'Postmark-FromEmail') | Where-Object { [string]::IsNullOrWhiteSpace((Get-PmSecret $_)) })
                return @{ configured = $false; sent = $false; reason = "Postmark isn't set up (missing $($miss -join ' and '))."; messageId = '' }
            }
            $rcpt = @($To | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if (-not $rcpt.Count) { return @{ configured = $true; sent = $false; reason = 'No recipient was given.'; messageId = '' } }
            $api = Get-PmSecret 'Postmark-ApiUrl'; if ([string]::IsNullOrWhiteSpace($api)) { $api = 'https://api.postmarkapp.com' }
            $body = [ordered]@{ From = $from.Trim(); To = ($rcpt -join ','); Subject = $Subject; HtmlBody = $Html; MessageStream = $Stream }
            if ($Text) { $body.TextBody = $Text }
            $h = @{ 'X-Postmark-Server-Token' = $token.Trim(); Accept = 'application/json' }
            for ($i = 1; $i -le 3; $i++) {
                try {
                    $r = Invoke-RestMethod -Method POST -Uri "$($api.TrimEnd('/'))/email" -Headers $h -Body (ConvertTo-Json -InputObject $body -Depth 5 -Compress) -ContentType 'application/json' -ErrorAction Stop
                    $code = Get-PmProp $r 'ErrorCode'
                    if ($null -ne $code -and [int]$code -ne 0) { return @{ configured = $true; sent = $false; reason = "Postmark refused the email: $(Get-PmProp $r 'Message')"; messageId = '' } }
                    return @{ configured = $true; sent = $true; reason = ''; messageId = [string](Get-PmProp $r 'MessageID') }
                }
                catch {
                    $status = 0; try { $status = [int]$_.Exception.Response.StatusCode } catch { }
                    if (($status -eq 429 -or $status -ge 500) -and $i -lt 3) { Start-Sleep -Seconds (2 * $i); continue }
                    $d = $null; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $d = $_.ErrorDetails.Message } } catch { }
                    if (-not $d) { $d = [string]$_.Exception.Message }
                    $msg = $d; try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-PmProp $j 'Message'; if ($m) { $msg = [string]$m } } catch { }
                    $why = if ($status -eq 401) { 'Postmark rejected the server token (HTTP 401). Check the Postmark-ServerToken secret.' } else { "Postmark couldn't send the email$(if ($status) { " (HTTP $status)" }): $msg" }
                    return @{ configured = $true; sent = $false; reason = $why; messageId = '' }
                }
            }
            return @{ configured = $true; sent = $false; reason = 'Postmark kept refusing the email.'; messageId = '' }
        }
        # ---------- end src/mail.ps1 ----------
        # <<< src/mail.ps1

        # === NODE: Email the service manager ===
        # Builds a plain table of the findings and emails it through Postmark to the `to` recipients.
        # Without Postmark (or without a recipient) the report stays in the run output as report_html and report_text.
        # Never writes to a ticket.
        $ErrorActionPreference = 'Stop'
        function Get-TeProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Read-TeState {
            $raw = Get-NodeInput
            if ($null -ne $raw -and $null -eq (Get-TeProp $raw 'inputs') -and $null -ne (Get-TeProp $raw 'output')) { $raw = Get-TeProp $raw 'output' }
            $st = [ordered]@{}
            if ($raw -is [System.Collections.IDictionary]) { foreach ($k in $raw.Keys) { $st[[string]$k] = $raw[$k] } }
            elseif ($null -ne $raw) { foreach ($p in $raw.PSObject.Properties) { $st[$p.Name] = $p.Value } }
            foreach ($k in @('status', 'message', 'public_note', 'internal_note', 'ticket_id', 'psa_name', 'time_reason')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('actions', 'warnings', 'findings')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k]) } }
            foreach ($k in @('inputs', 'counts', 'time_supported')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { throw "This step expects the output of the Review time entries step (no '$k')." } }
            return $st
        }
        function ConvertTo-TeHtml { param($v) return [System.Net.WebUtility]::HtmlEncode([string]$v) }
        function Get-TePlural { param([int]$n, [string]$one, [string]$many) if ($n -eq 1) { return "1 $one" }; return "$n $many" }
        function Get-TeDay { param($v) if ($v -is [datetime]) { return $v.ToString('yyyy-MM-dd') }; return [string]$v }

        $te = Read-TeState
        $opt = $te['inputs']
        $cnt = $te['counts']
        $day = Get-TeDay (Get-TeProp $opt 'date')
        $tzName = [string](Get-TeProp $opt 'timezone')
        $psaName = [string]$te['psa_name']; if (-not $psaName) { $psaName = 'the PSA' }
        $minNote = [int](Get-TeProp $opt 'min_note_chars')
        $to = @(Get-TeProp $opt 'to' | Where-Object { $_ })
        $findings = @($te['findings'] | Where-Object { $null -ne $_ })
        $warnings = @($te['warnings'])
        $actions = @($te['actions'])
        $timeOk = [bool]$te['time_supported']
        $closedN = [int](Get-TeProp $cnt 'tickets_closed')
        $noTime = [int](Get-TeProp $cnt 'no_time'); $short = [int](Get-TeProp $cnt 'short_note'); $noBill = [int](Get-TeProp $cnt 'missing_billable')

        # ---- Summary sentence ----
        $dayText = "$day ($tzName)"
        $summary = ''
        if ($closedN -eq 0) { $summary = "No tickets were closed in $psaName on $dayText." }
        elseif (-not $timeOk) { $summary = "$(Get-TePlural $closedN 'ticket was' 'tickets were') closed in $psaName on $dayText, but their time couldn't be checked: $($te['time_reason'])" }
        elseif (-not $findings.Count) { $summary = "All $(Get-TePlural $closedN 'ticket' 'tickets') closed in $psaName on $dayText have time logged with notes of at least $minNote characters$(if ([bool](Get-TeProp $opt 'check_billable')) { ' and a billable setting' })." }
        else {
            $parts = @()
            if ($noTime) { $parts += "$(Get-TePlural $noTime 'was' 'were') closed with no time logged" }
            if ($short) { $parts += "$(Get-TePlural $short 'time entry has' 'time entries have') a note shorter than $minNote characters" }
            if ($noBill) { $parts += "$(Get-TePlural $noBill 'time entry has' 'time entries have') no billable setting" }
            $lead = "Of the $(Get-TePlural $closedN 'ticket' 'tickets') closed in $psaName on $dayText, "
            $summary = $lead + ($parts -join '; ') + '.'
            if ($noTime -and -not $short -and -not $noBill) { $summary = "$(Get-TePlural $noTime 'ticket' 'tickets') of the $closedN closed in $psaName on $dayText $(if ($noTime -eq 1) { 'was' } else { 'were' }) closed with no time logged." }
        }

        # ---- Plain table ----
        $issueText = @{ no_time = 'No time logged'; short_note = 'Short note'; missing_billable = 'No billable setting' }
        $order = @{ no_time = 0; short_note = 1; missing_billable = 2 }
        $rows = @($findings | Sort-Object { $order[[string](Get-TeProp $_ 'issue')] }, { [string](Get-TeProp $_ 'technician') }, { [string](Get-TeProp $_ 'number') })
        $sb = New-Object System.Text.StringBuilder
        $null = $sb.Append("<p>$(ConvertTo-TeHtml $summary)</p>")
        if ($rows.Count) {
            $null = $sb.Append('<table border="1" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px"><tr><th>Ticket</th><th>Company</th><th>Summary</th><th>Technician</th><th>Issue</th><th>Hours</th><th>Detail</th></tr>')
            foreach ($r in $rows) {
                $null = $sb.Append("<tr><td>$(ConvertTo-TeHtml (Get-TeProp $r 'number'))</td><td>$(ConvertTo-TeHtml (Get-TeProp $r 'company'))</td><td>$(ConvertTo-TeHtml (Get-TeProp $r 'summary'))</td><td>$(ConvertTo-TeHtml (Get-TeProp $r 'technician'))</td><td>$(ConvertTo-TeHtml $issueText[[string](Get-TeProp $r 'issue')])</td><td>$(ConvertTo-TeHtml (Get-TeProp $r 'hours'))</td><td>$(ConvertTo-TeHtml (Get-TeProp $r 'detail'))</td></tr>")
            }
            $null = $sb.Append('</table>')
        }
        if ($warnings.Count) { $null = $sb.Append('<p>Notes:</p><ul>'); foreach ($w in $warnings) { $null = $sb.Append("<li>$(ConvertTo-TeHtml $w)</li>") }; $null = $sb.Append('</ul>') }
        $null = $sb.Append('<p>This report only reads the PSA. Nothing was changed.</p>')
        $html = $sb.ToString()
        $text = $summary
        if ($rows.Count) { $text += "`n`n" + ((@($rows | ForEach-Object { "Ticket $(Get-TeProp $_ 'number') ($(Get-TeProp $_ 'company')), $(Get-TeProp $_ 'technician'): $(Get-TeProp $_ 'detail')" })) -join "`n") }
        $subject = "Time entry review for $day$(if ($findings.Count) { ": $(Get-TePlural $findings.Count 'item' 'items') to check" } else { '' })"

        # ---- Send ----
        $sent = $false
        if ($to.Count) {
            $mail = Send-PmMail -To $to -Subject $subject -Html $html -Text $text
            if ($mail.sent) { $sent = $true; $actions += "Emailed the report to $($to -join ', ')." }
            elseif (-not $mail.configured) { $warnings += "$($mail.reason) The report is only in the run output." }
            else { $warnings += "$($mail.reason) The report is only in the run output." }
        }

        $status = 'success'
        if ($closedN -gt 0 -and -not $timeOk) { $status = 'incomplete' }
        $message = $summary
        if ($sent) { $message += " The list was emailed to $($to -join ', ')." }
        elseif ($findings.Count -or -not $timeOk) { $message += ' The list is in the run output (report_html); it was not emailed.' }

        $emailed = @(); if ($sent) { $emailed = @($to) }
        $out = [ordered]@{
            status        = $status
            message       = $message
            public_note   = ''
            internal_note = "Time entry review for $dayText in $psaName. $message Read-only: no ticket was changed."
            ticket_id     = ''
            actions       = @($actions)
            warnings      = @($warnings)
            date          = $day
            timezone      = $tzName
            counts        = $cnt
            findings      = @($rows)
            emailed_to    = @($emailed)
            report_html   = $html
            report_text   = $text
        }
        Set-NodeOutput $out
      timeoutSeconds: 300
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: end
    name: End
    type: end
    position:
      x: 1080
      y: 200
