automationsWorkflow: 1
name: "Weekly Fleet Audit"
definition:
  schemaVersion: 1
  activities:
  - id: start
    name: Start
    type: start
    position:
      x: 100
      y: 120
    properties:
      webhookEnabled: false
  # ---------------------------------------------------------------------------
  # Agent node - runs the CloudRadial UCP Assistant (import cloudradial-ucp/ first)
  # toward a read-only audit goal.
  # ---------------------------------------------------------------------------
  - id: node-agent
    name: Fleet Audit
    type: agent
    position:
      x: 320
      y: 120
    properties:
      agentSlug: cloudradial-ucp-assistant
      goal: |-
        For every company in the CloudRadial portal, count the endpoints whose
        warranty is expired or unknown, and flag any company that has no account
        manager assigned. Return a short per-company summary sorted by the most
        out-of-warranty endpoints first, followed by a one-paragraph overview of
        the whole estate. This is a read-only audit - do not change anything.
      allowedExtensions:
      - cloudradial-v2-companies
      - cloudradial-v2-endpoints
      model: ''
      timeoutSeconds: 900
      autoApprove: false
  # ---------------------------------------------------------------------------
  # Message node - turns the audit into the email Deliver Result sends.
  # Set the recipients here.
  # ---------------------------------------------------------------------------
  - id: node-message
    name: Build Email
    type: powershell-script
    position:
      x: 540
      y: 120
    properties:
      script: |-
        # ---- set your recipients ----
        $recipients = @('team@yourmsp.com')

        # The Agent node's output (its 'answer' field) arrives as this node's input.
        $agent = Get-NodeInput
        $answer = if ($agent -and $agent.answer) { [string]$agent.answer } else { 'The audit returned no output.' }
        $safe = ($answer -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;')
        $subject = "Weekly Fleet Audit - $((Get-Date).ToString('yyyy-MM-dd'))"

        Set-NodeOutput ([ordered]@{
            channel = 'email'
            subject = $subject
            body    = "<html><body><h2>Weekly Fleet Audit</h2><pre style='font-family:Segoe UI,Arial,sans-serif;white-space:pre-wrap'>$safe</pre></body></html>"
            toEmail = @($recipients)
            message = "Audit email ready for $($recipients -join ', ')."
        })
      timeoutSeconds: 60
      retryCount: 0
      parameters: []
      aiExtensions: []
  # ---------------------------------------------------------------------------
  # Delivery node - the shared Deliver Result agent (import deliver-result/ first)
  # sends the email through the Postmark extension.
  # ---------------------------------------------------------------------------
  - id: node-deliver
    name: Send Audit
    type: agent
    position:
      x: 760
      y: 120
    properties:
      agentSlug: deliver-result
      goal: |-
        Deliver the weekly fleet audit you are given by email, exactly as provided:
        use the subject, body and recipients in your inputs. Do not open a ticket.
      allowedExtensions:
      - postmark
      model: ''
      timeoutSeconds: 300
      # true = the send goes out unattended. Deliver Result itself ships in dry run
      # (dryRunDefault: true) until you re-import it live - see its README.
      autoApprove: true
      # Pre-bound to the Build Email step - nothing to map after import.
      inputBindingsJson: '{"channel":"{{ nodes.node-message.output.channel }}","subject":"{{ nodes.node-message.output.subject }}","body":"{{ nodes.node-message.output.body }}","toEmail":"{{ nodes.node-message.output.toEmail }}"}'
  - id: end
    name: End
    type: end
    position:
      x: 980
      y: 120
  connections:
  - source: start
    target: node-agent
    sourceHandle: null
  - source: node-agent
    target: node-message
    sourceHandle: null
  - source: node-message
    target: node-deliver
    sourceHandle: null
  - source: node-deliver
    target: end
    sourceHandle: null
  startActivityId: start
