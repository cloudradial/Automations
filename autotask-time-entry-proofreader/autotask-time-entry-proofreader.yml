# Autotask Time Entry Proofreading goal workflow. Generated by src/build.js: edit src/, never this file.
automationsWorkflow: 1
name: Autotask Time Entry Proofreading
description: 'One proofreading check-in on demand: reviews Autotask time entries worked yesterday (or the startDate, endDate and companyName in the Run input) and proposes Summary Notes corrections, each one waiting for approval. The same agent runs as a Pulsar for daily check-ins; see the autotask-time-entry-proofreader README.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-proofread
      name: Proofread time entries
      type: agent
      position:
        x: 340
        'y': 120
      properties:
        goal: 'Proofread the Summary Notes of Autotask time entries and propose each correction for approval, following the Autotask Time Entry Style Guide. Date range: startDate {{ nodes.start.output.startDate }}, endDate {{ nodes.start.output.endDate }} (blank means yesterday). Company filter: {{ nodes.start.output.companyName }} (blank means all). Review at most 15 entries.'
        model: ''
        allowedExtensions:
          - autotask-psa
        timeoutSeconds: 600
        autoApprove: false
        agentSlug: autotask-time-entry-proofreader
        inputSchema: |-
          {
            "type": "object",
            "properties": {
              "startDate": {
                "type": "string",
                "description": "Inclusive start date in YYYY-MM-DD format. Defaults to endDate."
              },
              "endDate": {
                "type": "string",
                "description": "Inclusive end date in YYYY-MM-DD format. Defaults to yesterday."
              },
              "companyName": {
                "type": "string",
                "description": "Optional company name filter."
              }
            },
            "required": []
          }
        outputSchema: |-
          {
            "type": "object",
            "properties": {
              "startDate": {
                "type": "string"
              },
              "endDate": {
                "type": "string"
              },
              "companyName": {
                "type": "string"
              },
              "rulesSource": {
                "type": "string",
                "enum": [
                  "Knowledge article",
                  "Embedded fallback"
                ]
              },
              "rows": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "timeEntryId": {
                      "type": "string"
                    },
                    "ticketId": {
                      "type": "string"
                    },
                    "ticketNumber": {
                      "type": "string"
                    },
                    "company": {
                      "type": "string"
                    },
                    "resource": {
                      "type": "string"
                    },
                    "dateWorked": {
                      "type": "string"
                    },
                    "hoursWorked": {
                      "type": "number"
                    },
                    "billable": {
                      "type": "boolean"
                    },
                    "originalSummaryNotes": {
                      "type": "string"
                    },
                    "correctedSummaryNotes": {
                      "type": "string"
                    },
                    "changes": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "Updated",
                        "Flagged",
                        "Skipped"
                      ]
                    },
                    "flagReasons": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "reason": {
                      "type": "string"
                    },
                    "writeBack": {
                      "type": "boolean"
                    },
                    "notifyReviewer": {
                      "type": "boolean"
                    },
                    "proposalResult": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "timeEntryId",
                    "ticketId",
                    "ticketNumber",
                    "company",
                    "resource",
                    "dateWorked",
                    "hoursWorked",
                    "billable",
                    "originalSummaryNotes",
                    "correctedSummaryNotes",
                    "changes",
                    "status",
                    "flagReasons",
                    "reason",
                    "writeBack",
                    "notifyReviewer",
                    "proposalResult"
                  ]
                }
              },
              "totals": {
                "type": "object",
                "properties": {
                  "updated": {
                    "type": "integer"
                  },
                  "flagged": {
                    "type": "integer"
                  },
                  "skipped": {
                    "type": "integer"
                  }
                },
                "required": [
                  "updated",
                  "flagged",
                  "skipped"
                ]
              },
              "summaryTableMarkdown": {
                "type": "string"
              }
            },
            "required": [
              "startDate",
              "endDate",
              "companyName",
              "rulesSource",
              "rows",
              "totals",
              "summaryTableMarkdown"
            ]
          }
        inputBindingsJson: '{}'
    - id: end
      name: End
      type: end
      position:
        x: 580
        'y': 120
  connections:
    - source: start
      target: node-proofread
      sourceHandle: null
    - source: node-proofread
      target: end
      sourceHandle: null
  startActivityId: start
