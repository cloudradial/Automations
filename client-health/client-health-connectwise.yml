# Client Health goal workflow for ConnectWise PSA. Import on Workflows > Import.
# Generated by src/build.js. Don't edit by hand.
automationsWorkflow: 1
name: Client Health (ConnectWise PSA)
description: 'Goal workflow for the Client Health (ConnectWise PSA) agent: one weekly check-in that scores every active client and proposes account-manager follow-ups for approval. The same agent runs as a Pulsar; use this workflow to try it by hand.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-request
      name: Read the run input
      type: powershell-script
      position:
        x: 300
        'y': 120
      properties:
        script: |-
          # Run input (optional): {"clients":"Contoso, Fabrikam"} limits the check-in to those clients.
          $ErrorActionPreference = 'Stop'
          function Get-ChProp { param($o, $n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          $chIn = Get-NodeInput
          if ($chIn -is [string]) { $chIn = $(if ($chIn.Trim().StartsWith('{')) { try { $chIn | ConvertFrom-Json } catch { $null } } else { $null }) }
          $chWrap = Get-ChProp $chIn 'trigger'; if ($null -ne $chWrap) { $chIn = $chWrap }
          $chClients = ([string](Get-ChProp $chIn 'clients')).Trim()
          $chToday = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $chReq = "Run this week's client health check-in. Today is $chToday (UTC). Score the clients, compare with your notes, propose follow-ups for the clients that need one, write your notes and summarise."
          if ($chClients) { $chReq += " Only score these clients: $chClients." }
          Set-NodeOutput ([ordered]@{ status = 'success'; request = $chReq; message = $(if ($chClients) { "Check-in limited to: $chClients" } else { 'Check-in for every active client.' }) })
        timeoutSeconds: 60
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-agent
      name: Score clients and propose follow-ups
      type: agent
      position:
        x: 500
        'y': 120
      properties:
        agentSlug: client-health-connectwise
        goal: 'Score every active client''s health from CloudRadial feedback and ConnectWise PSA tickets, compare with last week''s scores in your notes, and propose one account-manager follow-up for each client that dropped 15 or more points or is below 60 (at most 10). Read the Knowledge sections "Client Health Scoring" and "Client Health Account Managers". Request: {{ nodes.node-request.output.request }}'
        model: ''
        allowedExtensions:
          - connectwise-manage
          - cloudradial-v2-feedback
        timeoutSeconds: 900
        autoApprove: false
        inputBindingsJson: '{"request":"{{ nodes.node-request.output.request }}"}'
        inputSchema: '{"type":"object","properties":{"request":{"type":"string","description":"What this check-in should do. Optional: limit it to named clients."}}}'
        outputSchema: '{"type":"object","properties":{"scored":{"type":"number","description":"Clients scored this check-in."},"proposed":{"type":"number","description":"Follow-ups proposed."},"lowest":{"type":"array","items":{"type":"object","properties":{"client":{"type":"string"},"score":{"type":"number"},"change":{"type":"string"}},"required":["client","score"]}},"notes":{"type":"array","items":{"type":"string"},"description":"Anything capped, skipped or unreadable."},"summary":{"type":"string"}},"required":["scored","proposed","summary"]}'
    - id: end
      name: End
      type: end
      position:
        x: 700
        'y': 120
  connections:
    - source: start
      target: node-request
      sourceHandle: null
    - source: node-request
      target: node-agent
      sourceHandle: null
    - source: node-agent
      target: end
      sourceHandle: null
  startActivityId: start
