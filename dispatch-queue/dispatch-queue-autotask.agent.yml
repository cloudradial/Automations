  outputSchema: '{"type":"object","properties":{"summary":{"type":"string","description":"The check-in summary: next best ticket per technician, then the counts."},"nextBest":{"type":"array","items":{"type":"object","properties":{"technician":{"type":"string"},"ticket":{"type":"string"},"summary":{"type":"string"},"score":{"type":"number"}}},"description":"One row per dispatch-team technician."},"proposed":{"type":"integer","description":"Assignments proposed this check-in."},"unassignedLeft":{"type":"integer","description":"Unassigned tickets not proposed."},"defaultsUsed":{"type":"array","items":{"type":"string"},"description":"Settings taken from a default because a document was missing."}},"required":["summary","proposed"]}'
  dryRunDefault: true
