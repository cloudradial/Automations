# Generated by src/build.js from src/*.ps1 and the built steps of cloudradial-ucp, secure-score-assessment and
# license-reclamation. Edit those sources, not this file.
# CloudRadial AutomationAI - First 30 Days: Week One. No agent needed: every step is PowerShell.
# After import: Read the client is the first step and stays unbound; it reads the Run input.
automationsWorkflow: 1
name: 'First 30 Days: Week One'
description: 'Runs a new client''s first week in one go: adds their starter portal content (users, tokens, request forms, menu tiles) with duplicate checks, turns their Microsoft Secure Score into a portal assessment, and puts a card about unused Microsoft 365 licences on their Planner board, then sums it all up. Preview by default. Send {"company":"Contoso Ltd","company_id":7,"mode":"preview","users":[...]}.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-plan
      name: Read the client
      type: powershell-script
      position:
        x: 320
        'y': 120
      properties:
        script: |
          # === STEP: Read the client ===
          # Edit this file, then run: node first-30-days/src/build.js
          # Checks the run input once, for every stage, and stops with every problem listed before anything runs.
          # Its output feeds the stages:
          #   - the portal setup step reads it directly (company_id plus domain, users, tokens, requestForms, menuTiles)
          #   - Secure Score and License Reclamation take single fields through their step parameters
          # Run input:
          #   company         the AutomationAI company (name, external id or alias) whose Microsoft 365 and CloudRadial
          #                   secrets the stages use. Required.
          #   company_id      the client's CloudRadial company number. Required.
          #   mode            "preview" (default) or "live". Preview plans the assessment and the card without writing them.
          #                   Portal setup always waits in the Inbox for approval, and follows the agent's own dry-run setting.
          #   days            inactivity threshold for licences, 14 to 365 (default 30)
          #   client_visible  show the licence card to the client (default true)
          #   domain, companyGroup, users, tokens, requestForms, menuTiles   what portal setup adds (at least one)
          function Get-F3Prop { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-F3Text { param($o, [string]$n) $v = Get-F3Prop $o $n; if ($null -eq $v) { return '' }; if (($v -isnot [string]) -and (-not $v.GetType().IsValueType)) { return '' }; $s = ([string]$v).Trim(); if ($s.StartsWith('@')) { return '' }; return $s }
          function Stop-F3 {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'rejected'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @() })
              throw $Why
          }

          $in = Get-NodeInput
          $t = Get-F3Prop $in 'trigger'; if ($null -ne $t) { $in = $t }
          if ($in -is [string]) {
              $s = $in.Trim()
              if (-not $s) { $in = $null } else { try { $in = $s | ConvertFrom-Json -ErrorAction Stop } catch { Stop-F3 'The run input is not valid JSON. Send an object such as {"company": "Contoso Ltd", "company_id": 7, "users": [...]}.' } }
          }
          if ($null -eq $in) { Stop-F3 'No run input. Send at least {"company": "Contoso Ltd", "company_id": 7} and something for portal setup, such as users.' }

          $problems = New-Object System.Collections.ArrayList
          $company = Get-F3Text $in 'company'
          if (-not $company) { $null = $problems.Add('company is required: the AutomationAI company whose Microsoft 365 and CloudRadial connection to use.') }

          $companyId = 0
          $idText = Get-F3Text $in 'company_id'; if (-not $idText) { $idText = Get-F3Text $in 'companyId' }
          if (-not $idText) { $null = $problems.Add('company_id is required: the client''s CloudRadial company number.') }
          elseif (-not [int]::TryParse($idText, [ref]$companyId) -or $companyId -le 0) { $null = $problems.Add("company_id must be a CloudRadial company number, such as 7 (got '$idText').") }

          $mode = (Get-F3Text $in 'mode').ToLowerInvariant(); if (-not $mode) { $mode = 'preview' }
          if ($mode -notin @('preview', 'live')) { $null = $problems.Add("mode must be preview or live (got '$mode').") }

          $days = 30
          $dText = Get-F3Text $in 'days'
          if ($dText) { $n = 0; if (-not [int]::TryParse($dText, [ref]$n) -or $n -lt 14 -or $n -gt 365) { $null = $problems.Add("days must be a whole number from 14 to 365 (got '$dText').") } else { $days = $n } }

          $clientVisible = $true
          $cvText = Get-F3Text $in 'client_visible'; if (-not $cvText) { $cvText = Get-F3Text $in 'clientVisible' }
          if ($cvText) {
              if ($cvText -match '^(?i)(true|yes|1)$') { $clientVisible = $true } elseif ($cvText -match '^(?i)(false|no|0)$') { $clientVisible = $false }
              else { $null = $problems.Add("client_visible must be true or false (got '$cvText').") }
          }

          # Portal setup: pass the fields through as they came; the setup step checks each one in detail.
          $setupKeys = @('domain', 'companyGroup', 'users', 'tokens', 'requestForms', 'menuTiles')
          $setup = [ordered]@{}
          foreach ($k in $setupKeys) {
              $v = Get-F3Prop $in $k
              if ($null -eq $v) { continue }
              if ($v -is [string]) { $v = $v.Trim(); if (-not $v -or $v.StartsWith('@')) { continue } }
              elseif (-not $v.GetType().IsValueType -and @($v).Count -eq 0) { continue }
              $setup[$k] = $v
          }
          if (-not $setup.Count) { $null = $problems.Add('Portal setup needs at least one of domain, companyGroup, users, tokens, requestForms or menuTiles.') }
          foreach ($k in @('companyName', 'accountManager', 'territory', 'psaIdentifier', 'psaKey')) {
              if (Get-F3Text $in $k) { $null = $problems.Add("$k isn't used here: this workflow adds to the existing company company_id and never creates or changes the company itself.") }
          }

          if ($problems.Count) { Stop-F3 ("First 30 Days wasn't started: " + ($problems -join ' ')) }

          $live = ($mode -eq 'live')
          $what = @($setup.Keys) -join ', '
          $message = "Ready for $company (CloudRadial company $companyId), $(if ($live) { 'live' } else { 'preview' }): portal setup ($what), the Secure Score assessment$(if ($live) { '' } else { ' (plan only)' }), and the licence card$(if ($clientVisible) { ' for the client' } else { ' (internal)' })$(if ($live) { '' } else { ' (preview only)' }), with a $days-day threshold."

          $out = [ordered]@{
              status         = 'ok'
              message        = $message
              company        = $company
              company_id     = $companyId
              mode           = $mode
              scoreMode      = $(if ($live) { 'apply' } else { 'plan' })
              preview        = (-not $live)
              days           = $days
              client_visible = $clientVisible
          }
          foreach ($k in $setup.Keys) { $out[$k] = $setup[$k] }
          Set-NodeOutput $out
        timeoutSeconds: 60
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {
            "company": "Contoso Ltd",
            "company_id": 7,
            "mode": "preview",
            "days": 30,
            "client_visible": true,
            "users": [
              {
                "firstName": "Pat",
                "lastName": "Lee",
                "email": "pat.lee@contoso.com"
              }
            ],
            "tokens": [
              {
                "token": "SupportPhone",
                "value": "555-0100"
              }
            ],
            "requestForms": [
              {
                "subject": "Request a new laptop",
                "category": "Hardware",
                "description": "Tell us who the laptop is for and when they start."
              }
            ],
            "menuTiles": [
              {
                "name": "Remote Support",
                "url": "https://support.examplemsp.com",
                "category": "Help"
              }
            ]
          }
    - id: node-setup-inputs
      name: Check the portal setup
      type: powershell-script
      position:
        x: 540
        'y': 120
      properties:
        script: |
          # === NODE: Read the setup ===
          # Checks the run input and turns it into one request for the CloudRadial UCP Assistant. Fails closed:
          # a missing company name, a bad email or domain, or more than the per-run limits stops the run before
          # the agent starts, so nothing is half created. Run input (companyName or company_id is required):
          #   companyName, domain, companyGroup, accountManager, territory, psaIdentifier, psaKey,
          #   company_id   an existing CloudRadial company to add the rest to (for example one New Client
          #                Onboarding just created). The company itself is then never created or changed,
          #                so accountManager, territory, psaIdentifier and psaKey can't be sent with it.
          #   users        [{"firstName","lastName","email"}]          up to 5
          #   tokens       [{"token","value"}] or {"Token":"value"}   up to 5
          #   requestForms [{"subject","category","description"}]     up to 3
          #   menuTiles    [{"name","url","category"}]                 up to 3
          $ErrorActionPreference = 'Stop'
          function Get-Prop { param($o, $n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-Text { param($o, $n) $v = Get-Prop $o $n; if ($null -eq $v) { return '' }; return ([string]$v).Trim() }
          function Get-Pairs { param($o) if ($o -is [System.Collections.IDictionary]) { return @($o.Keys | ForEach-Object { @{ Name = [string]$_; Value = $o[$_] } }) }; return @($o.PSObject.Properties | ForEach-Object { @{ Name = $_.Name; Value = $_.Value } }) }
          function Stop-Setup { param([string]$Msg) Set-NodeOutput ([ordered]@{ status = 'rejected'; message = $Msg; request = ''; companyName = '' }); throw $Msg }

          $in = Get-NodeInput
          $t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }
          if ($in -is [string]) { $s = $in.Trim(); $in = $(if ($s.StartsWith('{')) { $s | ConvertFrom-Json } else { $null }) }
          if ($null -eq $in) { Stop-Setup 'No run input. Send at least {"companyName": "Contoso Ltd"}.' }

          $limits = @{ users = 5; tokens = 5; requestForms = 3; menuTiles = 3 }
          $problems = New-Object System.Collections.ArrayList
          $existingId = 0
          $idText = Get-Text $in 'company_id'; if (-not $idText) { $idText = Get-Text $in 'companyId' }
          if ($idText) { $n = 0; if ([int]::TryParse($idText, [ref]$n) -and $n -gt 0) { $existingId = $n } else { $null = $problems.Add("company_id must be a CloudRadial company number, such as 23 (got '$idText').") } }
          $company = [ordered]@{ name = (Get-Text $in 'companyName') }
          if (-not $company.name -and -not $idText) { $null = $problems.Add('companyName is required (or company_id, for a company that already exists).') }
          elseif ($company.name.Length -gt 100) { $null = $problems.Add('companyName is longer than 100 characters.') }
          foreach ($k in @('accountManager', 'territory', 'psaIdentifier')) { $v = Get-Text $in $k; if ($v) { $company[$k] = $v } }
          $psaKeyText = Get-Text $in 'psaKey'
          if ($psaKeyText) { $pk = [long]0; if ([long]::TryParse($psaKeyText, [ref]$pk) -and $pk -gt 0) { $company.psaKey = $pk } else { $null = $problems.Add("psaKey must be a whole number (got '$psaKeyText').") } }
          if ($idText) {
              $fields = @(@('accountManager', 'territory', 'psaIdentifier', 'psaKey') | Where-Object { Get-Text $in $_ })
              if ($fields.Count) { $null = $problems.Add("$($fields -join ', ') only apply when this run creates the company. Leave them out with company_id; this run never changes an existing company.") }
          }
          $domain = (Get-Text $in 'domain').ToLowerInvariant()
          if ($domain -and $domain -notmatch '^(?=.{4,253}$)([a-z0-9](-?[a-z0-9])*\.)+[a-z]{2,}$') { $null = $problems.Add("domain '$domain' isn't a domain name (for example contoso.com).") }
          $group = Get-Text $in 'companyGroup'

          $users = @(); foreach ($u in @(Get-Prop $in 'users')) {
              if ($null -eq $u) { continue }
              $row = [ordered]@{ firstName = (Get-Text $u 'firstName'); lastName = (Get-Text $u 'lastName'); email = (Get-Text $u 'email').ToLowerInvariant() }
              if (-not $row.firstName -or -not $row.lastName -or $row.email -notmatch '^[^@\s]+@[^@\s]+\.[^@\s]+$') { $null = $problems.Add("Each user needs firstName, lastName and a valid email (got '$($row.firstName) $($row.lastName) <$($row.email)>').") }
              else { $users += $row }
          }
          # Tokens come as a list of {"token","value"} or as one {"TokenName":"value"} map. (A one-item list arrives
          # unwrapped, so tell them apart by the "token" property, not by type.)
          $tokens = @()
          foreach ($x in @(Get-Prop $in 'tokens')) {
              if ($null -eq $x -or $x -is [string]) { continue }
              if ($null -ne (Get-Prop $x 'token')) { $tokens += [ordered]@{ token = (Get-Text $x 'token'); value = (Get-Text $x 'value') } }
              else { foreach ($p in (Get-Pairs $x)) { $tokens += [ordered]@{ token = $p.Name; value = ([string]$p.Value).Trim() } } }
          }
          foreach ($x in $tokens) {
              $x.token = $x.token.TrimStart('@')
              if ($x.token -notmatch '^[A-Za-z][A-Za-z0-9_]*$' -or -not $x.value) { $null = $problems.Add("Each token needs a name (letters, digits, underscore) and a value (got '$($x.token)').") }
          }
          $forms = @(); foreach ($f in @(Get-Prop $in 'requestForms')) {
              if ($null -eq $f) { continue }
              $row = [ordered]@{ subject = (Get-Text $f 'subject'); category = (Get-Text $f 'category'); description = (Get-Text $f 'description') }
              if (-not $row.subject -or -not $row.category) { $null = $problems.Add("Each request form needs a subject and a category (got '$($row.subject)').") } else { $forms += $row }
          }
          $menus = @(); foreach ($m in @(Get-Prop $in 'menuTiles')) {
              if ($null -eq $m) { continue }
              $row = [ordered]@{ name = (Get-Text $m 'name'); url = (Get-Text $m 'url'); category = (Get-Text $m 'category') }
              if (-not $row.name -or $row.url -notmatch '^https?://\S+$' -or -not $row.category) { $null = $problems.Add("Each menu tile needs a name, a category and an http(s) url (got '$($row.name)').") } else { $menus += $row }
          }
          $counts = [ordered]@{ users = $users.Count; tokens = $tokens.Count; requestForms = $forms.Count; menuTiles = $menus.Count }
          foreach ($k in @($limits.Keys)) { if ($counts[$k] -gt $limits[$k]) { $null = $problems.Add("$($counts[$k]) $k is more than the $($limits[$k]) one run can create. Add the rest afterwards with the bulk workflows (Onboard Many Portal Users at Once, Load Your Request Forms into Any Portal).") } }
          if ($problems.Count) { Stop-Setup ("The setup wasn't started: " + ($problems -join ' ')) }

          $plan = [ordered]@{ company = $company; existingCompanyId = $existingId; domain = $domain; companyGroup = $group; users = @($users); tokens = @($tokens); requestForms = @($forms); menuTiles = @($menus) }
          $planJson = ConvertTo-Json -InputObject $plan -Depth 6 -Compress
          $label = if ($existingId) { "existing company $existingId" + $(if ($company.name) { " ('$($company.name)')" } else { '' }) } else { "the company '$($company.name)'" }
          $parts = @()
          if (-not $existingId) { $parts += $label }
          if ($domain) { $parts += "default domain $domain" }
          if ($group) { $parts += "membership of the company group '$group'" }
          foreach ($k in @('users', 'tokens', 'requestForms', 'menuTiles')) { if ($counts[$k]) { $parts += "$($counts[$k]) $k" } }
          if ($existingId) {
              if (-not $parts.Count) { Stop-Setup "Nothing to add to company $existingId. Send at least one of domain, companyGroup, users, tokens, requestForms or menuTiles." }
              $request = "Add to the existing CloudRadial company $existingId from this plan. Follow SETTING UP A NEW COMPANY in your instructions with existingCompanyId: never create or change the company itself, create only what the plan lists, and leave out any empty field. Plan (JSON): $planJson"
              $message = "Ready to add to $label" + ': ' + ($parts -join ', ') + '.'
          } else {
              $request = "Set up a new CloudRadial company from this plan. Follow SETTING UP A NEW COMPANY in your instructions, create only what the plan lists, and leave out any empty field. Plan (JSON): $planJson"
              $message = "Ready to set up " + ($parts -join ', ') + '.'
          }
          Set-NodeOutput ([ordered]@{
              status = 'ok'; companyName = $company.name; companyId = $existingId; request = $request; plan = $plan; counts = $counts
              message = $message
          })
        timeoutSeconds: 60
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: node-portal
      name: Add portal content
      type: powershell-script
      position:
        x: 760
        'y': 120
      properties:
        script: |
          # === STEP: Add portal content ===
          # Edit this file, then run: node first-30-days/src/build.js
          # Adds the checked setup to the client's existing CloudRadial company, with no AI: the default domain, company
          # group membership, users, replacement tokens, request forms and menu tiles. Every record is checked for a
          # duplicate first and skipped when it's already there, so a re-run adds nothing twice. In preview it reads
          # everything and lists what it would add; only mode "live" writes. It never creates, changes or deletes the
          # company or any existing record, and it reports only what CloudRadial confirmed.
          # Step parameters:
          #   plan   the Read the client output (company, company_id, mode)
          #   setup  the Check the portal setup output (its plan holds the checked domain, group, users, tokens, forms, tiles)
          # Secrets: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey, through the run's AutomationAI company.
          # >>> _shared/cloudradial.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
              # A new Planner card needs a category: POST /v2/product answers 400 "The Category field is required" without one.
              # These are Endpoint LifeCycle Manager's defaults; a build's own category and productCategoryId always win.
              CardCategory          = 'Efficiency'
              CardProductCategoryId = 7
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          function Get-CrSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              if ([string]::IsNullOrWhiteSpace([string]$body['category'])) { $body['category'] = $CrState.CardCategory }
              if (-not $body.Contains('productCategoryId') -or $null -eq $body['productCategoryId']) { $body['productCategoryId'] = $CrState.CardProductCategoryId }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive by name through the legacy /api/beta/archive list (which ignores
          # companyId, so it is filtered here), and creates it with -Create. Returns @{ id; companyId; name; inboundAddress } or $null.
          # The create reply doesn't always carry the new id, so the archive is looked up again by name.
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              $find = {
                  $list = @(Get-CrBetaAll '/api/beta/archive')
                  @($list | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  # A 400 here has meant "already exists" when the list missed it, so look again before giving up.
                  try { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  $id = Get-CrId $resp @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('id', 'archiveId', 'companyReportFolderId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = [string](Get-CrProp $hit 'inboundAddress') }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # <<< _shared/cloudradial.ps1
          # >>> _shared/company.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/company.ps1: run as the client the run input names ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # A step's Company setting picks whose secrets the step reads: the client's Microsoft 365 tenant AND its
          # CloudRadial portal. A pinned Company serves one client only, and import strips it. With the step's
          # "Include all companies" on (includeAllCompanies: true, which import keeps), the runner loads every
          # AutomationAI company into $companies, and Set-DefaultCompany switches the step's secrets to one of them.
          #   $co = Select-RunCompany (Get-Prop $in 'company')
          # A blank name keeps the step's own Company (or the runner's shared secrets), so a Routine with no input
          # still works. A name is matched to exactly one AutomationAI company by external id, then by name or alias
          # (case doesn't matter). No match, or more than one, throws, so a run never uses the wrong client's secrets.
          # Each step is its own script: call it in every step that reads a client secret.
          # Returns @{ selected; externalId; name; how }.

          function Get-CompanyField {
              param($Company, [string]$Name)
              if ($null -eq $Company) { return $null }
              if ($Company -is [System.Collections.IDictionary]) { if ($Company.Contains($Name)) { return $Company[$Name] }; return $null }
              $p = $Company.PSObject.Properties[$Name]
              if ($p) { return $p.Value }
              return $null
          }

          function Select-RunCompany {
              param([string]$Name)
              $want = ([string]$Name).Trim()
              if (-not $want) { return @{ selected = $false; externalId = ''; name = ''; how = "the step's own Company setting" } }
              $all = Get-Variable -Name companies -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $all) { throw "The run names the company '$want', but this step can't switch companies. Turn on Include all companies in the step's Company settings." }
              if (-not (Get-Command Set-DefaultCompany -ErrorAction SilentlyContinue)) { throw "The run names the company '$want', but this runner has no Set-DefaultCompany command." }
              $key = $want.ToLowerInvariant()
              $same = { param($v) $null -ne $v -and ([string]$v).Trim().ToLowerInvariant() -eq $key }
              $list = @($all)
              $hits = @($list | Where-Object { & $same (Get-CompanyField $_ 'externalId') })
              if ($hits.Count -eq 0) {
                  $hits = @($list | Where-Object {
                      $c = $_
                      (& $same (Get-CompanyField $c 'name')) -or (@(@(Get-CompanyField $c 'aliases') | Where-Object { & $same $_ }).Count -gt 0)
                  })
              }
              if ($hits.Count -eq 0) { throw "No AutomationAI company matches '$want'. Add the client under Companies with its Microsoft 365 and CloudRadial secrets, or use its exact name or external id." }
              if ($hits.Count -gt 1) {
                  $names = @($hits | ForEach-Object { "$(Get-CompanyField $_ 'name') ($(Get-CompanyField $_ 'externalId'))" }) -join ', '
                  throw "'$want' matches $($hits.Count) AutomationAI companies: $names. Use the external id instead."
              }
              $m = $hits[0]
              $id = [string](Get-CompanyField $m 'externalId')
              Set-DefaultCompany -Company $id
              return @{ selected = $true; externalId = $id; name = [string](Get-CompanyField $m 'name'); how = "the run's company input" }
          }
          # <<< _shared/company.ps1

          function ConvertTo-PcObject {
              param($v)
              if ($v -is [string]) { $s = $v.Trim(); if ($s.StartsWith('{')) { try { return ($s | ConvertFrom-Json -ErrorAction Stop) } catch { } }; return $null }
              return $v
          }
          function Get-PcText { param($o, [string]$n) $v = Get-CrProp $o $n; if ($null -eq $v) { return '' }; return ([string]$v).Trim() }
          function Get-PcRows { param($o, [string]$n) return @(@(Get-CrProp $o $n) | Where-Object { $null -ne $_ }) }
          # OData string literal: double any single quote.
          function Get-PcQ { param([string]$s) return "'" + $s.Replace("'", "''") + "'" }

          $pc = @{ live = $false; done = New-Object System.Collections.ArrayList; skipped = New-Object System.Collections.ArrayList; failed = New-Object System.Collections.ArrayList; warnings = New-Object System.Collections.ArrayList }
          $manual = New-Object System.Collections.ArrayList
          foreach ($m in @('Set the logo and theme.', 'Set up messaging.', 'Link the PSA and Microsoft 365.', 'Set security roles.', 'Invite the new users or send the welcome email.')) { $null = $manual.Add($m) }

          function Write-PcOutput {
              param([string]$Status, [string]$Message)
              $lines = @(@($pc.done) + @($pc.skipped | ForEach-Object { "Skipped $_" }) + @($pc.failed | ForEach-Object { "Failed $_" }))
              Set-NodeOutput ([ordered]@{
                      status        = $Status
                      message       = $Message
                      companyId     = $(if ($companyId) { [string]$companyId } else { '' })
                      mode          = $mode
                      actions       = @($pc.done)
                      skipped       = @($pc.skipped)
                      failed        = @($pc.failed)
                      warnings      = @($pc.warnings)
                      manualSteps   = @($manual)
                      answer        = (@($Message) + $lines) -join "`n"
                      public_note   = ''
                      internal_note = (@($Message) + $lines) -join "`n"
                      ticket_id     = ''
                  })
          }
          function Stop-Pc { param([string]$Why) Write-PcOutput 'error' $Why; throw $Why }

          # One create. In preview it only records what it would do; in live it records the result CloudRadial gave.
          function Invoke-PcCreate {
              param([string]$What, [string]$Path, $Body, $Fallback = $null, [string]$FallbackStep = '', [string]$HintWhen = '', [string]$Hint = '')
              if (-not $pc.live) { $null = $pc.done.Add("Would create $What"); return $true }
              try { $null = Invoke-CrApi -Path $Path -Method POST -Body $Body; $null = $pc.done.Add("Created $What"); return $true }
              catch {
                  $err = [string]$_.Exception.Message
                  # A fallback body (fewer fields) is tried once, and its manual step added when it works.
                  if ($null -ne $Fallback) {
                      try {
                          $null = Invoke-CrApi -Path $Path -Method POST -Body $Fallback
                          $null = $pc.done.Add("Created $What"); if ($FallbackStep) { $null = $manual.Add($FallbackStep) }; return $true
                      }
                      catch { $err = [string]$_.Exception.Message }
                  }
                  # One line: CloudRadial's error body arrives as indented JSON.
                  $err = ($err -replace '\s+', ' ').Trim()
                  if ($HintWhen -and $err -match $HintWhen) { $err = "$err $Hint" }
                  $null = $pc.failed.Add("$($What): $err"); return $false
              }
          }

          $in = Get-NodeInput
          $plan = ConvertTo-PcObject (Get-CrProp $in 'plan')
          $check = ConvertTo-PcObject (Get-CrProp $in 'setup')
          $companyId = 0
          $mode = (Get-PcText $plan 'mode').ToLowerInvariant(); if (-not $mode) { $mode = 'preview' }
          $pc.live = ($mode -eq 'live')
          $idText = Get-PcText $plan 'company_id'
          if (-not [int]::TryParse($idText, [ref]$companyId) -or $companyId -le 0) { Stop-Pc "Portal setup needs the CloudRadial company number from Read the client (got '$idText')." }
          $want = ConvertTo-PcObject (Get-CrProp $check 'plan')
          if ($null -eq $want -or (Get-PcText $check 'status') -ne 'ok') { Stop-Pc "Portal setup has no checked plan from Check the portal setup$(if (Get-PcText $check 'message') { ": $(Get-PcText $check 'message')" } else { '.' })" }

          try { $null = Select-RunCompany (Get-PcText $plan 'company') } catch { Stop-Pc ([string]$_.Exception.Message) }
          try { $null = Connect-Cr } catch { Stop-Pc ([string]$_.Exception.Message) }

          $company = $null
          try { $company = @(Get-CrAll "/v2/odata/company?`$filter=companyId eq $companyId&`$select=companyId,name") | Select-Object -First 1 } catch { Stop-Pc "Couldn't read CloudRadial company $($companyId): $($_.Exception.Message)" }
          if ($null -eq $company) { Stop-Pc "CloudRadial company $companyId was not found, so nothing was added. Check company_id." }
          $companyName = Get-PcText $company 'name'; if (-not $companyName) { $companyName = "company $companyId" }

          # ---- default domain ----
          $domain = (Get-PcText $want 'domain').ToLowerInvariant()
          if ($domain) {
              try {
                  $hits = @(Get-CrAll "/v2/odata/domain?`$filter=$([uri]::EscapeDataString("name eq $(Get-PcQ $domain)"))&`$select=companyDomainId,companyId,name")
                  $mine = @(Get-CrAll "/v2/odata/domain?`$filter=companyId eq $companyId and isDefault eq true&`$select=companyDomainId,name")
                  $here = @($hits | Where-Object { [int](Get-CrProp $_ 'companyId') -eq $companyId })
                  $other = @($hits | Where-Object { [int](Get-CrProp $_ 'companyId') -ne $companyId })
                  if ($here.Count) { $null = $pc.skipped.Add("domain $($domain): $companyName already has it") }
                  elseif ($other.Count) { $null = $pc.skipped.Add("domain $($domain): company $(Get-CrProp $other[0] 'companyId') already has it"); $null = $pc.warnings.Add("The domain $domain belongs to another CloudRadial company ($(Get-CrProp $other[0] 'companyId')), so it wasn't added.") }
                  else {
                      $isDefault = ($mine.Count -eq 0)
                      $null = Invoke-PcCreate "domain $domain$(if ($isDefault) { ' (default)' })" '/v2/domain' ([ordered]@{ companyId = $companyId; name = $domain; isDefault = $isDefault })
                  }
              }
              catch { $null = $pc.failed.Add("domain $($domain): $($_.Exception.Message)") }
          }

          # ---- company group membership (never creates a group) ----
          $groupName = Get-PcText $want 'companyGroup'
          if ($groupName) {
              try {
                  $g = @(Get-CrAll '/v2/odata/companygroup') | Where-Object { (Get-PcText $_ 'group') -ieq $groupName } | Select-Object -First 1
                  if ($null -eq $g) { $null = $pc.skipped.Add("company group $($groupName): no group has that name"); $null = $pc.warnings.Add("No company group is called '$groupName', so the company wasn't added to one. Create the group first if you need it.") }
                  else {
                      $gid = [int](Get-CrProp $g 'companyGroupId')
                      $member = @(Get-CrAll "/v2/odata/companygroupcompany?`$filter=companyId eq $companyId and companyGroupId eq $gid")
                      if ($member.Count) { $null = $pc.skipped.Add("company group $($groupName): already a member") }
                      else { $null = Invoke-PcCreate "membership of company group $groupName" '/v2/companygroupcompany' ([ordered]@{ companyGroupId = $gid; companyId = $companyId }) }
                  }
              }
              catch { $null = $pc.failed.Add("company group $($groupName): $($_.Exception.Message)") }
          }

          # ---- users (an email is unique across the whole portal) ----
          foreach ($u in (Get-PcRows $want 'users')) {
              $email = (Get-PcText $u 'email').ToLowerInvariant(); $name = "$(Get-PcText $u 'firstName') $(Get-PcText $u 'lastName')".Trim()
              try {
                  $hit = @(Get-CrAll "/v2/odata/user?`$filter=$([uri]::EscapeDataString("email eq $(Get-PcQ $email)"))&`$select=userId,companyId,email") | Select-Object -First 1
                  if ($null -ne $hit) {
                      $at = [int](Get-CrProp $hit 'companyId')
                      if ($at -eq $companyId) { $null = $pc.skipped.Add("user $name <$email>: already in $companyName") }
                      else { $null = $pc.skipped.Add("user $name <$email>: already a user in company $at"); $null = $pc.warnings.Add("$email is already a portal user in another company ($at), so it wasn't added to $companyName.") }
                      continue
                  }
                  # A deleted portal user keeps its email but is hidden from the list above, so the create hits a
                  # database error (seen live 2026-11-09). Say so, because the error itself doesn't.
                  $null = Invoke-PcCreate "user $name <$email>" '/v2/user' ([ordered]@{ companyId = $companyId; email = $email; firstName = (Get-PcText $u 'firstName'); lastName = (Get-PcText $u 'lastName') }) `
                      -HintWhen '(?i)database error|already (exists|in use)|duplicate' `
                      -Hint 'This email probably belongs to a deleted portal user, which still holds it. Restore that user in CloudRadial, or use another email.'
              }
              catch { $null = $pc.failed.Add("user $name <$email>: $($_.Exception.Message)") }
          }

          # ---- replacement tokens (POST /v2/token overwrites, so an existing token is never sent) ----
          $tokenRows = Get-PcRows $want 'tokens'
          if ($tokenRows.Count) {
              $have = @()
              try { $have = @(Get-CrAll "/v2/odata/token?`$filter=companyId eq $companyId&`$select=companyId,name") | ForEach-Object { Get-PcText $_ 'name' } }
              catch { $null = $pc.failed.Add("tokens: couldn't read the existing tokens, so none were added: $($_.Exception.Message)"); $tokenRows = @() }
              foreach ($t in $tokenRows) {
                  $tn = (Get-PcText $t 'token').TrimStart('@')
                  if (@($have | Where-Object { $_ -ceq $tn }).Count) { $null = $pc.skipped.Add("token @$($tn): already set for $companyName (left as it is)"); continue }
                  if (@($have | Where-Object { $_ -ieq $tn }).Count) { $null = $pc.skipped.Add("token @$($tn): a token with the same name in different case exists"); $null = $pc.warnings.Add("Token @$tn differs only in case from an existing token, so it wasn't added. Check the name."); continue }
                  $null = Invoke-PcCreate "token @$tn" '/v2/token' ([ordered]@{ companyId = $companyId; token = $tn; value = (Get-PcText $t 'value') })
              }
          }

          # ---- request forms ----
          $formRows = Get-PcRows $want 'requestForms'
          if ($formRows.Count) {
              $forms = @()
              try { $forms = @(Get-CrAll "/v2/odata/catalog?`$filter=companyId eq $companyId&`$select=companyCatalogId,subject") | ForEach-Object { Get-PcText $_ 'subject' } }
              catch { $null = $pc.failed.Add("request forms: couldn't read the existing forms, so none were added: $($_.Exception.Message)"); $formRows = @() }
              foreach ($f in $formRows) {
                  $subject = Get-PcText $f 'subject'; $desc = Get-PcText $f 'description'
                  if (@($forms | Where-Object { $_ -ieq $subject }).Count) { $null = $pc.skipped.Add("request form '$($subject)': already in $companyName"); continue }
                  # isSelfApproval, isAppendSubject, isSendToPsa and selectText left out get other defaults from CloudRadial.
                  $body = [ordered]@{ companyId = $companyId; subject = $subject; category = (Get-PcText $f 'category'); description = $desc; shortDescription = $desc; isSelfApproval = $false; isAppendSubject = $true; isSendToPsa = $true; selectText = 'REQUEST' }
                  $null = Invoke-PcCreate "request form '$subject'" '/v2/catalog' $body
              }
          }

          # ---- menu tiles (shown to Everyone; a tile with no group may not show) ----
          $tileRows = Get-PcRows $want 'menuTiles'
          if ($tileRows.Count) {
              $tiles = @()
              try { $tiles = @(Get-CrAll "/v2/odata/menu?`$filter=companyId eq $companyId&`$select=companyMenuId,name") | ForEach-Object { Get-PcText $_ 'name' } }
              catch { $null = $pc.failed.Add("menu tiles: couldn't read the existing tiles, so none were added: $($_.Exception.Message)"); $tileRows = @() }
              foreach ($m in $tileRows) {
                  $tname = Get-PcText $m 'name'
                  if (@($tiles | Where-Object { $_ -ieq $tname }).Count) { $null = $pc.skipped.Add("menu tile '$($tname)': already in $companyName"); continue }
                  $body = [ordered]@{ companyId = $companyId; name = $tname; url = (Get-PcText $m 'url'); category = (Get-PcText $m 'category'); order = 0; editRights = 0; groups = @('Everyone') }
                  $plain = [ordered]@{}; foreach ($k in $body.Keys) { if ($k -ne 'groups') { $plain[$k] = $body[$k] } }
                  # Some portals refuse groups on create: add the tile without it and leave a manual step.
                  $null = Invoke-PcCreate "menu tile '$tname'" '/v2/menu' $body $plain "Show the menu tile '$tname' to Everyone."
              }
          }

          $verb = if ($pc.live) { 'Added' } else { 'Would add' }
          $n = $pc.done.Count
          $msg = if ($n) { "$verb $n record(s) to $companyName" } else { "Nothing to add to $companyName" }
          $msg += $(if ($pc.skipped.Count) { ", $($pc.skipped.Count) already there" } else { '' }) + $(if ($pc.failed.Count) { ", $($pc.failed.Count) failed" } else { '' }) + '.'
          if (-not $pc.live) { $msg += ' Preview: nothing was written.' }
          $status = if ($pc.failed.Count) { 'partial' } elseif ($pc.live) { 'success' } else { 'pending_confirmation' }
          Write-PcOutput $status $msg
        timeoutSeconds: 600
        retryCount: 0
        aiExtensions: []
        includeAllCompanies: true
        parameters:
          - name: plan
            expression: '{{ nodes.node-plan.output }}'
          - name: setup
            expression: '{{ nodes.node-setup-inputs.output }}'
    - id: node-score
      name: Secure Score assessment
      type: powershell-script
      position:
        x: 980
        'y': 120
      properties:
        script: |-
          # =====================================================================
          #  Secure Score -> CloudRadial Assessment (deterministic, in-memory xlsx)
          #  Run input: {"company":"Contoso Ltd","companyId":123,"assessmentTitle":"Microsoft Secure Score","mode":"apply"}
          #    company    - the AutomationAI company (name, external id or alias) whose Microsoft 365 and
          #                 CloudRadial secrets to use. Blank uses the step's own Company setting.
          #    companyId  - CloudRadial company the assessment is created under (required)
          #    tenantId   - optional. The client's Entra tenant id. Defaults to the company's M365-TenantID
          #                 secret; when both are set they must match.
          #    mode       - "apply" (default) writes; "plan" previews only
          #  Secrets (the company's, or the runner Key Vault's): CloudRadial-BaseUrl / -PublicKey / -PrivateKey,
          #    M365-TenantID, and M365-ClientID / M365-ClientSecret (an Entra app with
          #    SecurityEvents.Read.All application permission, consented in the client tenant).
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor [System.Net.SecurityProtocolType]::Tls12

          function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
          function Get-Prop { param($o,$n) if($null -eq $o){return $null}; if($o -is [System.Collections.IDictionary]){ if($o.Contains($n)){return $o[$n]}; return $null }; $p=$o.PSObject.Properties[$n]; if($p){return $p.Value}; return $null }

          # >>> _shared/company.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/company.ps1: run as the client the run input names ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # A step's Company setting picks whose secrets the step reads: the client's Microsoft 365 tenant AND its
          # CloudRadial portal. A pinned Company serves one client only, and import strips it. With the step's
          # "Include all companies" on (includeAllCompanies: true, which import keeps), the runner loads every
          # AutomationAI company into $companies, and Set-DefaultCompany switches the step's secrets to one of them.
          #   $co = Select-RunCompany (Get-Prop $in 'company')
          # A blank name keeps the step's own Company (or the runner's shared secrets), so a Routine with no input
          # still works. A name is matched to exactly one AutomationAI company by external id, then by name or alias
          # (case doesn't matter). No match, or more than one, throws, so a run never uses the wrong client's secrets.
          # Each step is its own script: call it in every step that reads a client secret.
          # Returns @{ selected; externalId; name; how }.

          function Get-CompanyField {
              param($Company, [string]$Name)
              if ($null -eq $Company) { return $null }
              if ($Company -is [System.Collections.IDictionary]) { if ($Company.Contains($Name)) { return $Company[$Name] }; return $null }
              $p = $Company.PSObject.Properties[$Name]
              if ($p) { return $p.Value }
              return $null
          }

          function Select-RunCompany {
              param([string]$Name)
              $want = ([string]$Name).Trim()
              if (-not $want) { return @{ selected = $false; externalId = ''; name = ''; how = "the step's own Company setting" } }
              $all = Get-Variable -Name companies -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $all) { throw "The run names the company '$want', but this step can't switch companies. Turn on Include all companies in the step's Company settings." }
              if (-not (Get-Command Set-DefaultCompany -ErrorAction SilentlyContinue)) { throw "The run names the company '$want', but this runner has no Set-DefaultCompany command." }
              $key = $want.ToLowerInvariant()
              $same = { param($v) $null -ne $v -and ([string]$v).Trim().ToLowerInvariant() -eq $key }
              $list = @($all)
              $hits = @($list | Where-Object { & $same (Get-CompanyField $_ 'externalId') })
              if ($hits.Count -eq 0) {
                  $hits = @($list | Where-Object {
                      $c = $_
                      (& $same (Get-CompanyField $c 'name')) -or (@(@(Get-CompanyField $c 'aliases') | Where-Object { & $same $_ }).Count -gt 0)
                  })
              }
              if ($hits.Count -eq 0) { throw "No AutomationAI company matches '$want'. Add the client under Companies with its Microsoft 365 and CloudRadial secrets, or use its exact name or external id." }
              if ($hits.Count -gt 1) {
                  $names = @($hits | ForEach-Object { "$(Get-CompanyField $_ 'name') ($(Get-CompanyField $_ 'externalId'))" }) -join ', '
                  throw "'$want' matches $($hits.Count) AutomationAI companies: $names. Use the external id instead."
              }
              $m = $hits[0]
              $id = [string](Get-CompanyField $m 'externalId')
              Set-DefaultCompany -Company $id
              return @{ selected = $true; externalId = $id; name = [string](Get-CompanyField $m 'name'); how = "the run's company input" }
          }
          # <<< _shared/company.ps1

          # ---- run input ----
          $in = Get-NodeInput
          $t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }
          if ($in -is [string]) { $s = $in.Trim(); if ($s.StartsWith('{')) { $in = $s | ConvertFrom-Json } }
          $companyId = Get-Prop $in 'companyId'
          $tenantId  = [string](Get-Prop $in 'tenantId')
          $title     = [string](Get-Prop $in 'assessmentTitle'); if ([string]::IsNullOrWhiteSpace($title)) { $title = 'Microsoft Secure Score' }
          $mode      = [string](Get-Prop $in 'mode'); if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'apply' }
          if (-not $companyId) {
              $m = 'Need companyId (the CloudRadial company), and company (the AutomationAI company whose secrets to use). e.g. {"company":"Contoso Ltd","companyId":123}.'
              Set-NodeOutput @{ status = 'error'; message = $m }; throw $m
          }

          # ---- which client's secrets ----
          try { $co = Select-RunCompany ([string](Get-Prop $in 'company')) }
          catch { $m = $_.Exception.Message; Set-NodeOutput @{ status = 'error'; message = $m }; throw $m }
          $savedTenant = ''
          foreach ($n in @('M365-TenantID', 'M365-TenantId', 'Entra-TenantID', 'Graph-TenantId')) { $v = [string](Get-Secret $n); if ($v.Trim()) { $savedTenant = $v.Trim(); break } }
          $who = if ($co.selected) { "the AutomationAI company '$($co.name)'" } else { "this step's Company setting" }
          if ([string]::IsNullOrWhiteSpace($tenantId)) { $tenantId = $savedTenant }
          elseif ($savedTenant -and $tenantId.Trim() -ne $savedTenant) {
              $m = "The tenantId in the run input doesn't match the Microsoft 365 tenant saved for $who. Leave tenantId out, or check the company input."
              Set-NodeOutput @{ status = 'error'; message = $m }; throw $m
          }
          if ([string]::IsNullOrWhiteSpace($tenantId)) {
              $m = "No Microsoft 365 tenant for $who. Send company (the AutomationAI company with the client's M365-TenantID secret), or tenantId."
              Set-NodeOutput @{ status = 'error'; message = $m }; throw $m
          }
          $tenantId = $tenantId.Trim()

          # ---- secrets ----
          $crBaseRaw = Get-Secret 'CloudRadial-BaseUrl'; $pub = Get-Secret 'CloudRadial-PublicKey'; $prv = Get-Secret 'CloudRadial-PrivateKey'
          $appId = Get-Secret 'M365-ClientID'; $appSecret = Get-Secret 'M365-ClientSecret'
          $missing = foreach ($pair in @(
              @{ n='CloudRadial-BaseUrl'; v=$crBaseRaw }, @{ n='CloudRadial-PublicKey'; v=$pub }, @{ n='CloudRadial-PrivateKey'; v=$prv },
              @{ n='M365-ClientID'; v=$appId }, @{ n='M365-ClientSecret'; v=$appSecret }
          )) { if ([string]::IsNullOrWhiteSpace([string]$pair.v)) { $pair.n } }
          if (@($missing).Count -gt 0) { $m = "Add these runner Key Vault secret(s) and re-run: $($missing -join ', ')."; Set-NodeOutput @{ status='error'; message=$m }; throw $m }
          $crBase = ([string]$crBaseRaw).TrimEnd('/')
          $crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$pub`:$prv"))

          # ---- CloudRadial helpers ----
          function Invoke-Cr {
              param([string]$Method,[string]$Path,[object]$Body)
              $u = if ($Path -match '^https?://') { $Path } else { "$crBase$Path" }
              $h = @{ Authorization = $crAuth; Accept = 'application/json' }
              $a = @{ Uri = $u; Method = $Method; Headers = $h; ContentType = 'application/json' }
              if ($null -ne $Body) { $a.Body = ($Body | ConvertTo-Json -Depth 10) }
              Invoke-RestMethod @a
          }
          function Get-CrAll {
              param([string]$Path)
              $all = @(); $skip = 0
              for ($p = 0; $p -lt 500; $p++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $r = Invoke-Cr -Method GET -Path "${Path}${sep}`$top=100&`$skip=$skip"
                  $rows = if ($r.PSObject.Properties['value']) { @($r.value) } elseif ($r -is [System.Array]) { @($r) } else { @() }
                  $all += $rows
                  if (@($rows).Count -lt 100) { break }
                  $skip += 100
              }
              return $all
          }
          function Send-CrMultipart {
              param([string]$Path,[string]$DataJson,[byte[]]$FileBytes,[string]$FileName)
              Add-Type -AssemblyName System.Net.Http
              $client = New-Object System.Net.Http.HttpClient
              $client.DefaultRequestHeaders.Add('Authorization', $crAuth)
              $form = New-Object System.Net.Http.MultipartFormDataContent
              $form.Add((New-Object System.Net.Http.StringContent($DataJson, [Text.Encoding]::UTF8, 'application/json')), 'data')
              $fc = New-Object System.Net.Http.ByteArrayContent(, $FileBytes)
              $fc.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
              $form.Add($fc, 'file', $FileName)
              $resp = $client.PostAsync("$crBase$Path", $form).GetAwaiter().GetResult()
              $text = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              $client.Dispose()
              if (-not $resp.IsSuccessStatusCode) { throw "HTTP $([int]$resp.StatusCode): $text" }
              return $text
          }

          # ---- assessment template (51-col) + a 15-col working subset ----
          $Columns = @('Category','Question','Order','Explanation','Type','Answer','Text Answer','Responses','Is Flagged','Notes','Evaluation','Remediation Summary','Remediation','Reference','Partner Notes')
          $TemplateColumns = @('Partner Notes','Monthly Unit Cost','Project Unit Cost','Psa Board','Psa Item','Psa Status','Psa Category','Psa Sub Type','Psa Type','Psa Priority','Psa Source','Psa Estimated Time','Email List','Teams Webhook','Slack Webhook','Flow Webhook','Json Webhook','Script','Checklist','Category','Question','Order','Explanation','Type','Answer','Text Answer','Responses','Is Flagged','Notes','Evaluation','Remediation Summary','Remediation','Reference','Monthly Units','Monthly Unit Price','Project Units','Project Unit Price','Control Type','Likelihood','Risk','Risk Cost','Risk Impact','Owner','Updated by','Update Key','Content Update Key','Note Compliant','Note Partially Compliant','Note NA','Note Missing','Note Not Compliant')
          function ConvertTo-TemplateRows { param([object[]]$Rows)
              $idx = @{}; for ($i = 0; $i -lt $Columns.Count; $i++) { $idx[$Columns[$i]] = $i }
              $out = New-Object System.Collections.ArrayList
              foreach ($r in $Rows) { $row = @($r); $null = $out.Add(@($TemplateColumns | ForEach-Object { if ($idx.ContainsKey($_)) { $row[$idx[$_]] } else { $null } })) }
              return $out.ToArray()
          }
          function New-XlsxBytes {
              param([string[]]$Header,[object[]]$Rows)
              Add-Type -AssemblyName System.IO.Compression
              $esc = { param($s) [System.Security.SecurityElement]::Escape([string]$s) }
              $colName = { param([int]$n) $s=''; $n++; while ($n -gt 0) { $m = ($n-1) % 26; $s = [char](65 + $m) + $s; $n = [int][Math]::Floor(($n-1)/26) }; $s }
              $sb = New-Object System.Text.StringBuilder
              $null = $sb.Append('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>')
              $all = @(, $Header) + $Rows
              for ($r = 0; $r -lt $all.Count; $r++) {
                  $null = $sb.Append("<row r=""$($r+1)"">")
                  $row = @($all[$r])
                  for ($c = 0; $c -lt $row.Count; $c++) {
                      $ref = (& $colName $c) + ($r+1); $val = $row[$c]
                      if ($val -is [int] -or $val -is [long] -or $val -is [double]) { $null = $sb.Append("<c r=""$ref""><v>$val</v></c>") }
                      elseif (-not [string]::IsNullOrEmpty([string]$val)) { $null = $sb.Append("<c r=""$ref"" t=""inlineStr""><is><t xml:space=""preserve"">$(& $esc $val)</t></is></c>") }
                  }
                  $null = $sb.Append('</row>')
              }
              $null = $sb.Append('</sheetData></worksheet>')
              $files = [ordered]@{
                  '[Content_Types].xml'        = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'
                  '_rels/.rels'                = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
                  'xl/workbook.xml'            = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Assessment" sheetId="1" r:id="rId1"/></sheets></workbook>'
                  'xl/_rels/workbook.xml.rels' = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'
                  'xl/worksheets/sheet1.xml'   = $sb.ToString()
              }
              $ms = New-Object System.IO.MemoryStream
              $zip = New-Object System.IO.Compression.ZipArchive($ms, [System.IO.Compression.ZipArchiveMode]::Create, $true)
              foreach ($k in $files.Keys) { $entry = $zip.CreateEntry($k); $w = New-Object System.IO.StreamWriter($entry.Open(), (New-Object System.Text.UTF8Encoding($false))); $w.Write($files[$k]); $w.Dispose() }
              $zip.Dispose()
              return , $ms.ToArray()
          }

          # ---- Microsoft Graph: token + Secure Score ----
          $tokUri = "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token"
          $tok = (Invoke-RestMethod -Uri $tokUri -Method Post -ContentType 'application/x-www-form-urlencoded' -Body @{ grant_type='client_credentials'; client_id=$appId; client_secret=$appSecret; scope='https://graph.microsoft.com/.default' }).access_token
          if (-not $tok) { throw 'Could not get a Microsoft Graph token - check the app id/secret and that the app is consented in the client tenant.' }
          $gh = @{ Authorization = "Bearer $tok" }
          # What the token holds: the app id and its application permissions (never the token itself), so a 403 can say what is missing.
          function Get-TokenInfo { param([string]$Jwt)
              $info = [ordered]@{ appId = ''; roles = @() }
              try {
                  $p = $Jwt.Split('.')[1].Replace('-', '+').Replace('_', '/'); while ($p.Length % 4) { $p += '=' }
                  $c = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p)) | ConvertFrom-Json
                  $info.appId = [string](Get-Prop $c 'appid'); $info.roles = @(Get-Prop $c 'roles' | Where-Object { $_ })
              } catch { }
              return $info
          }
          try { $score = (Invoke-RestMethod -Uri 'https://graph.microsoft.com/v1.0/security/secureScores?$top=1' -Headers $gh).value | Select-Object -First 1 }
          catch {
              $code = 0; try { $code = [int]$_.Exception.Response.StatusCode } catch { }
              if ($code -ne 403 -and $code -ne 401) { throw }
              $ti = Get-TokenInfo $tok
              $has = if (@($ti.roles).Count) { (@($ti.roles) | Sort-Object) -join ', ' } else { 'none' }
              $m = "Microsoft Graph refused to read Secure Score (HTTP $code). The app registration $($ti.appId) has these application permissions in tenant $($tenantId): $has. Add SecurityEvents.Read.All to it as an Application permission (not Delegated) and grant admin consent in this tenant. Its existing permissions stay as they are. Nothing was created."
              Set-NodeOutput @{ status = 'error'; message = $m; appId = $ti.appId; grantedRoles = @($ti.roles) }; throw $m
          }
          if (-not $score) { throw 'No Secure Score data for this tenant (is Microsoft Secure Score enabled, and does the app have SecurityEvents.Read.All?).' }
          $tenantCur = [double]$score.currentScore; $tenantMax = [double]$score.maxScore
          $lookup = @{}; foreach ($cs in @($score.controlScores)) { $lookup[[string]$cs.controlName] = $cs.score }
          $profiles = @(); $uri = 'https://graph.microsoft.com/v1.0/security/secureScoreControlProfiles'
          while ($uri) { $r = Invoke-RestMethod -Uri $uri -Headers $gh; $profiles += @($r.value); $uri = Get-Prop $r '@odata.nextLink' }
          $active = @($profiles | Where-Object { -not $_.deprecated })
          if ($active.Count -eq 0) { throw 'No active Secure Score control profiles returned.' }

          # ---- build the 15-column assessment rows ----
          $catOrder = @{ 'Identity'=1; 'Device'=2; 'Apps'=3; 'Data'=4; 'Infrastructure'=5 }
          $sorted = $active | Sort-Object @(
              @{ Expression = { $k=[string]$_.controlCategory; if ($catOrder.ContainsKey($k)) { $catOrder[$k] } else { 99 } } },
              @{ Expression = { $_.rank } }
          )
          $rows = New-Object System.Collections.ArrayList
          $order = 0; $compliantCount = 0
          foreach ($c in $sorted) {
              $order += 10
              $cc = [string]$c.controlCategory
              $cat = switch ($cc) { 'Account' { 'Identity' } 'Identity' { 'Identity' } 'Data' { 'Data' } 'Device' { 'Device' } 'Apps' { 'Apps' } 'Infrastructure' { 'Infrastructure' } default { $cc } }
              $cur = if ($lookup.ContainsKey([string]$c.id)) { [double]$lookup[[string]$c.id] } else { 0 }
              $max = if ($c.maxScore) { [double]$c.maxScore } else { 0 }
              $isCompliant = ($cur -ge $max) -and ($max -gt 0)
              if ($isCompliant) { $compliantCount++ }
              $answer = if ($isCompliant) { 2 } else { -2 }
              $txt = if ($isCompliant) { 'Compliant' } else { 'Not compliant' }
              $flag = if ($isCompliant) { 'No' } else { 'Yes' }
              $pct = if ($tenantMax -gt 0) { [math]::Round(($max / $tenantMax) * 100, 2) } else { 0 }
              $rem = if ($c.remediation) { ($c.remediation -replace '<[^>]+>','') } else { '' }
              $remSum = if ($rem) { $rem.Substring(0, [math]::Min(200, $rem.Length)) } else { '' }
              $null = $rows.Add(@(
                  $cat, [string]$c.title, $order,
                  "Service: $($c.service) | Score impact: $pct% | Points: $cur / $max", 'List',
                  $answer, $txt, 'Compliant,Partially Compliant+,N/A=,Missing*,Not Compliant-', $flag, '',
                  'Review this control in the Microsoft 365 Defender portal under Secure Score.',
                  $remSum, $rem, "Microsoft Secure Score - $($c.service)", ''
              ))
          }

          $titleFinal = "$title ($(Get-Date -Format 'yyyy-MM-dd'))"
          $summary = "$($rows.Count) controls ($compliantCount compliant). Tenant score $tenantCur / $tenantMax."

          # ---- duplicate check ----
          $existing = @(); $dupe = $false
          try { $existing = @(Get-CrAll "/v2/odata/assessment?`$filter=companyId eq $companyId") } catch { }
          foreach ($a in $existing) { if (([string](Get-Prop $a 'title')) -eq $titleFinal) { $dupe = $true } }

          if ($dupe) {
              Set-NodeOutput ([ordered]@{ status='skipped'; message="An assessment titled '$titleFinal' already exists for companyId $companyId - not re-created."; controls=$rows.Count; compliant=$compliantCount; tenantScore="$tenantCur / $tenantMax" })
          }
          elseif ($mode -eq 'plan') {
              Set-NodeOutput ([ordered]@{ status='plan'; message="DRY RUN - would create '$titleFinal' with $($rows.Count) questions. $summary"; controls=$rows.Count; compliant=$compliantCount; tenantScore="$tenantCur / $tenantMax" })
          }
          else {
              # The v2 API has no create endpoint (POST /v2/assessment returns 404). Like the portal's Import Assessment
              # dialog, the upload creates the assessment when assessmentId is 0 (type 20 = an assessment the portal lists)
              # and returns 204 with no body, so the new row is found afterwards by title and type.
              $bytes = New-XlsxBytes -Header $TemplateColumns -Rows (ConvertTo-TemplateRows $rows.ToArray())
              $data = ([ordered]@{ name = $titleFinal; assessmentId = 0; type = 20; companyId = [int]$companyId } | ConvertTo-Json -Compress)
              # A large upload (hundreds of controls) can outlast CloudRadial's gateway, which answers 502/503/504 while
              # the import still finishes. So a 5xx or timeout only means "look for it longer"; other errors stop the run.
              $uploadErr = $null
              try { $null = Send-CrMultipart -Path '/v2/assessment/upload' -DataJson $data -FileBytes $bytes -FileName 'secure-score.xlsx' }
              catch { $uploadErr = $_.Exception.Message; if ($uploadErr -notmatch 'HTTP 5\d\d|time(d)? ?out|canceled') { throw } }
              $waits = if ($uploadErr) { @(0, 15, 30, 60, 90) } else { @(0, 3, 10) }
              $aid = $null
              foreach ($wait in $waits) {
                  if ($wait) { Start-Sleep -Seconds $wait }
                  $seen = @(); try { $seen = @(Get-CrAll "/v2/odata/assessment?`$filter=companyId eq $companyId") } catch { continue }
                  $hit = @($seen | Where-Object { ([string](Get-Prop $_ 'title')) -eq $titleFinal -and [int](Get-Prop $_ 'type') -eq 20 } | Sort-Object { [int](Get-Prop $_ 'assessmentId') } -Descending) | Select-Object -First 1
                  if ($hit) { $aid = Get-Prop $hit 'assessmentId'; break }
              }
              if (-not $aid) {
                  $m = $(if ($uploadErr) { "The upload didn't answer in time ($uploadErr) and no assessment titled '$titleFinal' appeared for companyId $companyId within about 3 minutes. It may still appear; check the company's assessments before running again (a rerun skips it once it exists)." } else { "CloudRadial accepted the upload but no assessment titled '$titleFinal' appeared for companyId $companyId. Check the company's assessments before running again." })
                  Set-NodeOutput @{ status = 'error'; message = $m }; throw $m
              }
              Set-NodeOutput ([ordered]@{ status='created'; message="Created assessment '$titleFinal' (assessmentId $aid) with $($rows.Count) questions. $summary"; assessmentId=[int]$aid; controls=$rows.Count; compliant=$compliantCount; tenantScore="$tenantCur / $tenantMax" })
          }
        timeoutSeconds: 600
        retryCount: 0
        parameters:
          - name: company
            expression: '{{ nodes.node-plan.output.company }}'
          - name: companyId
            expression: '{{ nodes.node-plan.output.company_id }}'
          - name: mode
            expression: '{{ nodes.node-plan.output.scoreMode }}'
        aiExtensions: []
        includeAllCompanies: true
    - id: node-lr-inputs
      name: Licence check settings
      type: powershell-script
      position:
        x: 1200
        'y': 120
      properties:
        script: |
          # === STEP: Read inputs ===
          # Edit this file, then run: node license-reclamation/src/build.js
          # Reads the run input (manual run or Routine). A Routine sends no input, so every field has a default.
          #   days             inactivity threshold in days (default 60, 14 to 365)
          #   price_overrides  optional JSON map of skuPartNumber to monthly price, e.g. {"SPB": 20.5}
          #   company          optional AutomationAI company (name, external id or alias) whose Microsoft 365 and CloudRadial
          #                    secrets the next steps use; blank keeps each step's own Company setting
          #   company_id       CloudRadial company id; when blank, the CloudRadial-CompanyId secret or the tenant match is used
          #   preview          optional; true works everything out but leaves the Planner card alone
          #   client_visible   optional; true also shows the card to the client in their portal (default false: internal only)
          # Read-only: nothing in this workflow removes or changes a licence.

          function Get-LrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Test-LrBlank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or ([string]$v).Trim().StartsWith('@')) }
          function Stop-LrInput {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'rejected'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @() })
              throw $Why
          }

          $raw = Get-NodeInput
          if ($raw -is [string]) {
              if ([string]::IsNullOrWhiteSpace($raw)) { $raw = $null }
              else { try { $raw = $raw | ConvertFrom-Json -ErrorAction Stop } catch { Stop-LrInput 'The run input is not valid JSON. Send an object such as {"days": 60}.' } }
          }
          $wrap = Get-LrProp $raw 'trigger'; if ($null -ne $wrap) { $raw = $wrap }
          if ($raw -is [string]) { try { $raw = $raw | ConvertFrom-Json -ErrorAction Stop } catch { $raw = $null } }

          # days
          $days = 60
          $d = Get-LrProp $raw 'days'
          if (-not (Test-LrBlank $d)) {
              $n = 0
              if (-not [int]::TryParse(([string]$d).Trim(), [ref]$n)) { Stop-LrInput "The days input must be a whole number of days, such as 60. It was '$d'." }
              if ($n -lt 14 -or $n -gt 365) { Stop-LrInput "The days input must be between 14 and 365. It was $n." }
              $days = $n
          }

          # price_overrides: a JSON string or an object, skuPartNumber -> monthly price
          $overrides = [ordered]@{}
          $po = Get-LrProp $raw 'price_overrides'
          if (-not (Test-LrBlank $po) -or ($null -ne $po -and $po -isnot [string])) {
              if ($po -is [string]) { try { $po = $po | ConvertFrom-Json -ErrorAction Stop } catch { Stop-LrInput 'The price_overrides input is not valid JSON. Use a map such as {"SPB": 20.5}.' } }
              $pairs = @()
              if ($null -ne $po -and ($po.GetType().IsValueType -or $po -is [string] -or $po -is [array])) { Stop-LrInput 'The price_overrides input must be a map of SKU to monthly price, such as {"SPB": 20.5}.' }
              if ($po -is [System.Collections.IDictionary]) { $pairs = @($po.Keys | ForEach-Object { @{ k = [string]$_; v = $po[$_] } }) }
              elseif ($null -ne $po) { $pairs = @($po.PSObject.Properties | ForEach-Object { @{ k = [string]$_.Name; v = $_.Value } }) }
              foreach ($p in $pairs) {
                  $price = 0.0
                  if (-not [double]::TryParse(([string]$p.v).Trim(), [System.Globalization.NumberStyles]::Float, [System.Globalization.CultureInfo]::InvariantCulture, [ref]$price) -or $price -lt 0) {
                      Stop-LrInput "The price_overrides value for $($p.k) must be a monthly price such as 20.5. It was '$($p.v)'."
                  }
                  $overrides[$p.k.Trim().ToUpperInvariant()] = [Math]::Round($price, 2)
              }
          }

          # company_id
          $companyId = 0
          $c = Get-LrProp $raw 'company_id'; if (Test-LrBlank $c) { $c = Get-LrProp $raw 'companyId' }
          if (-not (Test-LrBlank $c)) {
              $n = 0
              if (-not [int]::TryParse(([string]$c).Trim(), [ref]$n) -or $n -le 0) { Stop-LrInput "The company_id input must be a CloudRadial company number, such as 9. It was '$c'." }
              $companyId = $n
          }

          # preview
          $preview = $false
          $pv = Get-LrProp $raw 'preview'
          if (-not (Test-LrBlank $pv)) { $preview = ([string]$pv).Trim() -match '^(?i)(true|yes|1)$' }

          # client_visible
          $clientVisible = $false
          $cv = Get-LrProp $raw 'client_visible'; if (Test-LrBlank $cv) { $cv = Get-LrProp $raw 'clientVisible' }
          if (-not (Test-LrBlank $cv)) { $clientVisible = ([string]$cv).Trim() -match '^(?i)(true|yes|1)$' }

          # company (AutomationAI)
          $runCompany = ''
          $rc = Get-LrProp $raw 'company'
          if (-not (Test-LrBlank $rc)) { $runCompany = ([string]$rc).Trim() }

          Set-NodeOutput ([ordered]@{
                  status          = 'ok'
                  days            = $days
                  price_overrides = $overrides
                  company         = $runCompany
                  company_id      = $companyId
                  preview         = $preview
                  client_visible  = $clientVisible
              })
        timeoutSeconds: 60
        retryCount: 0
        parameters:
          - name: company
            expression: '{{ nodes.node-plan.output.company }}'
          - name: company_id
            expression: '{{ nodes.node-plan.output.company_id }}'
          - name: days
            expression: '{{ nodes.node-plan.output.days }}'
          - name: preview
            expression: '{{ nodes.node-plan.output.preview }}'
          - name: client_visible
            expression: '{{ nodes.node-plan.output.client_visible }}'
        aiExtensions: []
    - id: node-lr-scan
      name: Find unused licences
      type: powershell-script
      position:
        x: 1420
        'y': 120
      properties:
        script: |
          # === STEP: Find unused licences ===
          # Edit this file, then run: node license-reclamation/src/build.js
          # Read-only. Reads the tenant's subscriptions, every user's licences and last sign-in, and (when allowed)
          # mailbox activity, then lists users holding a paid licence they haven't used in the last <days> days.
          # Disabled accounts that still hold a paid licence are always listed. Free and trial SKUs are ignored.
          # Graph application permissions: Organization.Read.All (or Directory.Read.All), User.Read.All,
          # AuditLog.Read.All (needs Entra ID P1). Optional: Reports.Read.All for mailbox activity.
          # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Signs in with the app registration's client credentials from the runner Key Vault.
          # Each helper names the Graph application permission it needs; when Graph answers 403,
          # the error says which permission to grant (with admin consent).
          # All state lives in the $GraphState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $GraphState = @{
              Base           = 'https://graph.microsoft.com'
              Headers        = $null
              Creds          = $null
              TenantId       = ''
              ExpiresAt      = [datetime]::MinValue
              MaxAttempts    = 5
              MaxWaitSeconds = 120
              LastStatus     = 0
          }

          # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
          # The first secret that has a value, from a list of names.
          function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
          function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-GraphRetryAfter {
              param($Err, [int]$Attempt)
              $s = 0
              try {
                  $ra = $Err.Exception.Response.Headers.RetryAfter
                  if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                  elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
              } catch { }
              if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
              return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
          }
          # Graph's own error message when there is one, otherwise the exception text.
          function Get-GraphErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
              return [string]$Err.Exception.Message
          }
          function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

          function Update-GraphToken {
              $c = $GraphState.Creds
              if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
              $r = $null
              try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
              catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
              $tok = Get-GraphProp $r 'access_token'
              if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
              $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
              $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
              $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
          }

          # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
          # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
          # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
          # Returns @{ TenantId }.
          function Connect-Graph {
              param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
              $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
              $GraphState.TenantId = $TenantId.Trim()
              Update-GraphToken
              return @{ TenantId = $GraphState.TenantId }
          }

          # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
          # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
          # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
          # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
          function Invoke-Graph {
              param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
              if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
              $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
              $short = $uri.Replace($GraphState.Base, '')
              $reauth = $false
              for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                  if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                  $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                  $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                  try {
                      $r = Invoke-RestMethod @p
                      $GraphState.LastStatus = 200
                      return $r
                  }
                  catch {
                      $code = Get-GraphHttpStatus $_
                      $GraphState.LastStatus = $code
                      if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                      if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                      $why = Get-GraphErrorText $_
                      if ($code -eq 403) {
                          $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                          throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                      }
                      throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                  }
              }
          }

          # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
          function Get-GraphAll {
              param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList
              $next = $Path; $n = 0
              while ($next -and $n -lt $MaxPages) {
                  $n++
                  $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                  foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                  $next = [string](Get-GraphProp $r '@odata.nextLink')
              }
              return @($rows)
          }

          # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
          function Get-GraphUser {
              param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }

          # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
          # Mail-enabled security groups and distribution lists can't be changed through Graph.
          function Add-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
              catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
          }

          # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
          function Remove-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
              catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
          }

          # Sets the user's manager. Needs User.ReadWrite.All.
          function Set-GraphManager {
              param([string]$UserId, [string]$ManagerId)
              $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
          }

          # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
          function Revoke-GraphSessions {
              param([string]$UserId)
              $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
          }

          # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
          # Disabling an admin account also needs a privileged role, which app permissions can't grant.
          function Set-GraphAccountEnabled {
              param([string]$UserId, [bool]$Enabled)
              $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
          }

          # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
          # The user must have a usage location before a licence can be added.
          function Set-GraphLicense {
              param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
              $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
              $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
              if (-not $toAdd.Count -and -not $toRemove.Count) { return }
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
              catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
          }

          # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
          # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
          function Get-GraphSignInActivity {
              param([string]$UserId = '')
              $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
              $perm = 'AuditLog.Read.All (with User.Read.All)'
              if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
              # Graph caps the page size at 120 when signInActivity is selected.
              return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
          }

          # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
          function Get-GraphAuthMethods {
              param([string]$UserId)
              return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
          }

          # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
          # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
          function Remove-GraphAuthMethod {
              param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
              if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
              $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
              $seg = @{
                  microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                  phoneAuthenticationMethod                  = 'phoneMethods'
                  fido2AuthenticationMethod                  = 'fido2Methods'
                  emailAuthenticationMethod                  = 'emailMethods'
                  softwareOathAuthenticationMethod           = 'softwareOathMethods'
                  windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                  temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                  platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
              }
              if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
              if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
              $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
          }

          # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
          # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
          function Get-GraphRiskyUsers {
              param([string]$UserId = '', [switch]$AtRiskOnly)
              $perm = 'IdentityRiskyUser.Read.All'
              if ($UserId) {
                  try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                  catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
              }
              $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
              return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
          }

          # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
          function New-GraphTempPassword {
              param([int]$Length = 16)
              if ($Length -lt 8) { $Length = 8 }
              $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
              $all = -join $sets
              $rng = [System.Security.Cryptography.RandomNumberGenerator]
              $chars = New-Object System.Collections.Generic.List[char]
              foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
              while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
              for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
              return -join $chars
          }
          # ---------- end _shared/graph.ps1 ----------
          # <<< _shared/graph.ps1
          # >>> _shared/company.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/company.ps1: run as the client the run input names ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # A step's Company setting picks whose secrets the step reads: the client's Microsoft 365 tenant AND its
          # CloudRadial portal. A pinned Company serves one client only, and import strips it. With the step's
          # "Include all companies" on (includeAllCompanies: true, which import keeps), the runner loads every
          # AutomationAI company into $companies, and Set-DefaultCompany switches the step's secrets to one of them.
          #   $co = Select-RunCompany (Get-Prop $in 'company')
          # A blank name keeps the step's own Company (or the runner's shared secrets), so a Routine with no input
          # still works. A name is matched to exactly one AutomationAI company by external id, then by name or alias
          # (case doesn't matter). No match, or more than one, throws, so a run never uses the wrong client's secrets.
          # Each step is its own script: call it in every step that reads a client secret.
          # Returns @{ selected; externalId; name; how }.

          function Get-CompanyField {
              param($Company, [string]$Name)
              if ($null -eq $Company) { return $null }
              if ($Company -is [System.Collections.IDictionary]) { if ($Company.Contains($Name)) { return $Company[$Name] }; return $null }
              $p = $Company.PSObject.Properties[$Name]
              if ($p) { return $p.Value }
              return $null
          }

          function Select-RunCompany {
              param([string]$Name)
              $want = ([string]$Name).Trim()
              if (-not $want) { return @{ selected = $false; externalId = ''; name = ''; how = "the step's own Company setting" } }
              $all = Get-Variable -Name companies -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $all) { throw "The run names the company '$want', but this step can't switch companies. Turn on Include all companies in the step's Company settings." }
              if (-not (Get-Command Set-DefaultCompany -ErrorAction SilentlyContinue)) { throw "The run names the company '$want', but this runner has no Set-DefaultCompany command." }
              $key = $want.ToLowerInvariant()
              $same = { param($v) $null -ne $v -and ([string]$v).Trim().ToLowerInvariant() -eq $key }
              $list = @($all)
              $hits = @($list | Where-Object { & $same (Get-CompanyField $_ 'externalId') })
              if ($hits.Count -eq 0) {
                  $hits = @($list | Where-Object {
                      $c = $_
                      (& $same (Get-CompanyField $c 'name')) -or (@(@(Get-CompanyField $c 'aliases') | Where-Object { & $same $_ }).Count -gt 0)
                  })
              }
              if ($hits.Count -eq 0) { throw "No AutomationAI company matches '$want'. Add the client under Companies with its Microsoft 365 and CloudRadial secrets, or use its exact name or external id." }
              if ($hits.Count -gt 1) {
                  $names = @($hits | ForEach-Object { "$(Get-CompanyField $_ 'name') ($(Get-CompanyField $_ 'externalId'))" }) -join ', '
                  throw "'$want' matches $($hits.Count) AutomationAI companies: $names. Use the external id instead."
              }
              $m = $hits[0]
              $id = [string](Get-CompanyField $m 'externalId')
              Set-DefaultCompany -Company $id
              return @{ selected = $true; externalId = $id; name = [string](Get-CompanyField $m 'name'); how = "the run's company input" }
          }
          # <<< _shared/company.ps1

          $in = Get-NodeInput
          $days = [int](Get-GraphProp $in 'days'); if ($days -le 0) { $days = 60 }
          $overrides = @{}
          $po = Get-GraphProp $in 'price_overrides'
          if ($po -is [System.Collections.IDictionary]) { foreach ($k in $po.Keys) { $overrides[([string]$k).ToUpperInvariant()] = [double]$po[$k] } }
          elseif ($null -ne $po) { foreach ($p in $po.PSObject.Properties) { $overrides[$p.Name.ToUpperInvariant()] = [double]$p.Value } }
          $warnings = New-Object System.Collections.ArrayList

          function Stop-LrScan {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'error'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @($warnings) })
              throw $Why
          }

          # Use the client the run names (if any) before reading any secret.
          try { $null = Select-RunCompany ([string](Get-GraphProp $in 'company')) } catch { Stop-LrScan ([string]$_.Exception.Message) }

          # ---- built-in tables ----
          # List prices in USD per user per month, annual commitment, as published by Microsoft. Estimates only:
          # partner, CSP and monthly-billing prices differ. price_overrides replaces any of them.
          $LrPrices = [ordered]@{
              'O365_BUSINESS_ESSENTIALS' = @{ name = 'Microsoft 365 Business Basic'; price = 6.00 }
              'O365_BUSINESS_PREMIUM'    = @{ name = 'Microsoft 365 Business Standard'; price = 12.50 }
              'SPB'                      = @{ name = 'Microsoft 365 Business Premium'; price = 22.00 }
              'O365_BUSINESS'            = @{ name = 'Microsoft 365 Apps for business'; price = 8.25 }
              'OFFICESUBSCRIPTION'       = @{ name = 'Microsoft 365 Apps for enterprise'; price = 12.00 }
              'STANDARDPACK'             = @{ name = 'Office 365 E1'; price = 10.00 }
              'ENTERPRISEPACK'           = @{ name = 'Office 365 E3'; price = 23.00 }
              'ENTERPRISEPREMIUM'        = @{ name = 'Office 365 E5'; price = 38.00 }
              'SPE_E3'                   = @{ name = 'Microsoft 365 E3'; price = 36.00 }
              'SPE_E5'                   = @{ name = 'Microsoft 365 E5'; price = 57.00 }
              'SPE_F1'                   = @{ name = 'Microsoft 365 F3'; price = 8.00 }
              'DESKLESSPACK'             = @{ name = 'Office 365 F3'; price = 2.25 }
              'EXCHANGESTANDARD'         = @{ name = 'Exchange Online (Plan 1)'; price = 4.00 }
              'EXCHANGEENTERPRISE'       = @{ name = 'Exchange Online (Plan 2)'; price = 8.00 }
              'EXCHANGEDESKLESS'         = @{ name = 'Exchange Online Kiosk'; price = 2.00 }
              'EXCHANGEARCHIVE_ADDON'    = @{ name = 'Exchange Online Archiving'; price = 3.00 }
              'POWER_BI_PRO'             = @{ name = 'Power BI Pro'; price = 14.00 }
              'PBI_PREMIUM_PER_USER'     = @{ name = 'Power BI Premium Per User'; price = 24.00 }
              'PROJECTPROFESSIONAL'      = @{ name = 'Project Plan 3'; price = 30.00 }
              'PROJECT_P1'               = @{ name = 'Project Plan 1'; price = 10.00 }
              'VISIOCLIENT'              = @{ name = 'Visio Plan 2'; price = 15.00 }
              'VISIOONLINE_PLAN1'        = @{ name = 'Visio Plan 1'; price = 5.00 }
              'EMS'                      = @{ name = 'Enterprise Mobility + Security E3'; price = 10.60 }
              'EMSPREMIUM'               = @{ name = 'Enterprise Mobility + Security E5'; price = 16.40 }
              'AAD_PREMIUM'              = @{ name = 'Microsoft Entra ID P1'; price = 6.00 }
              'AAD_PREMIUM_P2'           = @{ name = 'Microsoft Entra ID P2'; price = 9.00 }
              'INTUNE_A'                 = @{ name = 'Microsoft Intune Plan 1'; price = 8.00 }
              'ATP_ENTERPRISE'           = @{ name = 'Microsoft Defender for Office 365 (Plan 1)'; price = 2.00 }
              'THREAT_INTELLIGENCE'      = @{ name = 'Microsoft Defender for Office 365 (Plan 2)'; price = 5.00 }
              'MCOEV'                    = @{ name = 'Teams Phone Standard'; price = 10.00 }
              'MCOMEETADV'               = @{ name = 'Microsoft 365 Audio Conferencing'; price = 4.00 }
              'MICROSOFT_TEAMS_ENTERPRISE_NEW' = @{ name = 'Microsoft Teams Enterprise'; price = 5.25 }
              'MICROSOFT_365_COPILOT'    = @{ name = 'Microsoft 365 Copilot'; price = 30.00 }
          }
          # Free, trial and self-service SKUs that cost nothing, so they are never listed.
          $LrFree = @('FLOW_FREE', 'POWER_BI_STANDARD', 'TEAMS_EXPLORATORY', 'TEAMS_FREE', 'POWERAPPS_VIRAL', 'POWERAPPS_DEV', 'POWERAPPS_INDIVIDUAL_USER',
              'POWER_PAGES_VTRIAL_FOR_MAKERS', 'STREAM', 'WINDOWS_STORE', 'RIGHTSMANAGEMENT_ADHOC', 'CCIBOTS_PRIVPREV_VIRAL', 'MICROSOFT_BUSINESS_CENTER',
              'FORMS_PRO', 'DYN365_ENTERPRISE_P1_IW', 'PROJECT_MADEIRA_PREVIEW_IW_SKU', 'MCOPSTNC', 'PHONESYSTEM_VIRTUALUSER', 'MEETING_ROOM_FREE',
              'MICROSOFT_REMOTE_ASSIST_HOLOLENS', 'POWERAUTOMATE_ATTENDED_RPA_TRIAL', 'VIRTUAL_AGENT_BASE_TRIAL', 'DEVELOPERPACK_E5', 'MCOCAP_FREE', 'APPS_FREE')

          function Test-LrFreeSku { param([string]$Part) $u = $Part.ToUpperInvariant(); if ($LrFree -contains $u) { return $true }; return ($u -match '(_FREE$|^FREE_|_VIRAL|VIRAL_|_TRIAL|TRIAL_|_IW_SKU$|_IW$|EXPLORATORY)') }
          function ConvertTo-LrDate {
              param($v)
              if ($null -eq $v) { return $null }
              if ($v -is [datetime]) { return $v.ToUniversalTime() }
              if ($v -is [datetimeoffset]) { return $v.UtcDateTime }
              $s = ([string]$v).Trim(); if (-not $s) { return $null }
              $d = [datetime]::MinValue
              if ([datetime]::TryParse($s, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]'AdjustToUniversal,AssumeUniversal', [ref]$d)) { if ($d.Year -le 1601) { return $null }; return $d }
              return $null
          }
          function Get-LrLatest { param([object[]]$Dates) $m = $null; foreach ($d in $Dates) { if ($null -ne $d -and ($null -eq $m -or $d -gt $m)) { $m = $d } }; return $m }

          # ---- Graph ----
          try { $conn = Connect-Graph } catch { Stop-LrScan ([string]$_.Exception.Message) }
          $tenantId = [string]$conn.TenantId
          $now = (Get-Date).ToUniversalTime()
          $cutoff = $now.AddDays(-$days)

          $skus = @()
          try { $skus = @(Get-GraphAll -Path '/v1.0/subscribedSkus' -Permission 'Organization.Read.All (or Directory.Read.All)') }
          catch {
              if ($GraphState.LastStatus -eq 403) { Stop-LrScan "Microsoft Graph refused to list the tenant's subscriptions. Grant the app registration the Organization.Read.All (or Directory.Read.All) application permission, with admin consent, then run again." }
              Stop-LrScan "Couldn't read the tenant's Microsoft 365 subscriptions: $($_.Exception.Message)"
          }
          $skuMap = @{}
          foreach ($s in $skus) {
              $sid = [string](Get-GraphProp $s 'skuId'); $part = [string](Get-GraphProp $s 'skuPartNumber')
              if (-not $sid -or -not $part) { continue }
              $applies = [string](Get-GraphProp $s 'appliesTo')
              $u = $part.ToUpperInvariant()
              $free = (Test-LrFreeSku $part) -or ($applies -and $applies -ne 'User')
              $name = $part; $price = $null; $source = 'unknown'
              if ($LrPrices.Contains($u)) { $name = $LrPrices[$u].name; $price = [double]$LrPrices[$u].price; $source = 'list' }
              if ($overrides.ContainsKey($u)) { $price = [double]$overrides[$u]; $source = 'override' }
              $skuMap[$sid.ToLowerInvariant()] = @{ part = $part; name = $name; price = $price; source = $source; free = $free }
          }

          $sel = 'id,displayName,userPrincipalName,accountEnabled,userType,createdDateTime,assignedLicenses,signInActivity'
          $users = @()
          try { $users = @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission 'AuditLog.Read.All (with User.Read.All)') }
          catch {
              $msg = [string]$_.Exception.Message
              if ($GraphState.LastStatus -eq 403 -and $msg -match '(?i)premium licen|NonPremium|tenant is B2C') { Stop-LrScan 'Microsoft Graph refused to read last sign-in times because this tenant has no Microsoft Entra ID P1 (or Business Premium) licence. Last sign-in data needs Entra ID P1, so this check cannot run for this tenant.' }
              if ($GraphState.LastStatus -eq 403) { Stop-LrScan 'Microsoft Graph refused to read last sign-in times. Grant the app registration the AuditLog.Read.All application permission (with User.Read.All), with admin consent, then run again.' }
              Stop-LrScan "Couldn't read the tenant's users: $msg"
          }

          # Mailbox activity (optional). The report is CSV; it names users only when concealed names are turned off.
          $mailbox = @{}
          $mailboxChecked = $false
          try {
              $csv = Invoke-Graph -Method GET -Path "/v1.0/reports/getMailboxUsageDetail(period='D90')" -Permission 'Reports.Read.All'
              if ($csv -is [byte[]]) { $csv = [Text.Encoding]::UTF8.GetString($csv) }
              $rows = @(([string]$csv).TrimStart([char]0xFEFF) | ConvertFrom-Csv)
              $named = @($rows | Where-Object { ([string](Get-GraphProp $_ 'User Principal Name')) -like '*@*' })
              if ($rows.Count -and -not $named.Count) {
                  $null = $warnings.Add('Mailbox activity was not used because Microsoft 365 reports hide user names in this tenant. To include it, turn off "Display concealed user, group, and site names in all reports" in the Microsoft 365 admin center under Settings > Org settings > Reports.')
              }
              else {
                  foreach ($r in $named) {
                      $upn = ([string](Get-GraphProp $r 'User Principal Name')).ToLowerInvariant()
                      $mailbox[$upn] = ConvertTo-LrDate (Get-GraphProp $r 'Last Activity Date')
                  }
                  $mailboxChecked = $true
              }
          }
          catch {
              if ($GraphState.LastStatus -eq 403) { $null = $warnings.Add('Mailbox activity was not checked because the app registration does not have the Reports.Read.All permission, so this list is based on sign-in times only.') }
              else { $null = $warnings.Add("Mailbox activity could not be read, so this list is based on sign-in times only. ($($_.Exception.Message))") }
          }

          # ---- find unused paid licences ----
          $found = New-Object System.Collections.ArrayList
          $licensedUsers = 0
          foreach ($usr in $users) {
              $paid = @()
              foreach ($al in @(Get-GraphProp $usr 'assignedLicenses')) {
                  $sid = ([string](Get-GraphProp $al 'skuId')).ToLowerInvariant()
                  if ($sid -and $skuMap.ContainsKey($sid) -and -not $skuMap[$sid].free) { $paid += $skuMap[$sid] }
              }
              if (-not $paid.Count) { continue }
              $licensedUsers++
              $upn = [string](Get-GraphProp $usr 'userPrincipalName')
              $ae = Get-GraphProp $usr 'accountEnabled'
              $enabled = ($null -eq $ae -or [bool]$ae)
              $sia = Get-GraphProp $usr 'signInActivity'
              $lastSignIn = Get-LrLatest @((ConvertTo-LrDate (Get-GraphProp $sia 'lastSignInDateTime')), (ConvertTo-LrDate (Get-GraphProp $sia 'lastNonInteractiveSignInDateTime')), (ConvertTo-LrDate (Get-GraphProp $sia 'lastSuccessfulSignInDateTime')))
              $lastMail = $null; if ($upn -and $mailbox.ContainsKey($upn.ToLowerInvariant())) { $lastMail = $mailbox[$upn.ToLowerInvariant()] }
              $created = ConvertTo-LrDate (Get-GraphProp $usr 'createdDateTime')
              $reason = ''
              if (-not $enabled) { $reason = 'disabled' }
              else {
                  if ($null -ne $created -and $created -gt $cutoff) { continue }   # too new to judge
                  $lastActive = Get-LrLatest @($lastSignIn, $lastMail)
                  if ($null -ne $lastActive -and $lastActive -gt $cutoff) { continue }
                  $reason = $(if ($null -eq $lastActive) { 'never' } else { 'inactive' })
              }
              $known = @($paid | Where-Object { $null -ne $_.price })
              $monthly = 0.0; foreach ($k in $known) { $monthly += [double]$k.price }
              $null = $found.Add([ordered]@{
                      name           = [string](Get-GraphProp $usr 'displayName')
                      upn            = $upn
                      enabled        = $enabled
                      reason         = $reason
                      lastSignIn     = $(if ($null -ne $lastSignIn) { $lastSignIn.ToString('yyyy-MM-dd') } else { '' })
                      lastMailbox    = $(if ($null -ne $lastMail) { $lastMail.ToString('yyyy-MM-dd') } else { '' })
                      licences       = @($paid | ForEach-Object { [ordered]@{ sku = $_.part; name = $_.name; price = $_.price; priceSource = $_.source } })
                      monthly        = [Math]::Round($monthly, 2)
                      unknownPrices  = ($paid.Count - $known.Count)
                  })
          }

          $rowsOut = @($found | Sort-Object -Property @{ Expression = { $_.monthly }; Descending = $true }, @{ Expression = { $_.name }; Descending = $false })
          $licenceCount = 0; $saving = 0.0; $unknownSkus = @{}; $disabled = 0
          foreach ($r in $rowsOut) {
              $licenceCount += @($r.licences).Count; $saving += [double]$r.monthly
              if (-not $r.enabled) { $disabled++ }
              foreach ($l in @($r.licences)) { if ($null -eq $l.price) { $unknownSkus[$l.sku] = 1 } }
          }

          Set-NodeOutput ([ordered]@{
                  status          = 'ok'
                  days            = $days
                  company         = [string](Get-GraphProp $in 'company')
                  company_id      = [int](Get-GraphProp $in 'company_id')
                  preview         = [bool](Get-GraphProp $in 'preview')
                  client_visible  = [bool](Get-GraphProp $in 'client_visible')
                  tenantId        = $tenantId
                  checkedOn       = $now.ToString('yyyy-MM-dd')
                  licensedUsers   = $licensedUsers
                  mailboxChecked  = $mailboxChecked
                  userCount       = $rowsOut.Count
                  disabledCount   = $disabled
                  licenceCount    = $licenceCount
                  monthlySaving   = [Math]::Round($saving, 2)
                  unknownPriceSkus = @($unknownSkus.Keys | Sort-Object)
                  overridesUsed   = @($overrides.Keys | Sort-Object)
                  users           = $rowsOut
                  warnings        = @($warnings)
              })
        timeoutSeconds: 900
        retryCount: 0
        parameters: []
        aiExtensions: []
        includeAllCompanies: true
    - id: node-lr-card
      name: Licence card for the client
      type: powershell-script
      position:
        x: 1640
        'y': 120
      properties:
        script: |
          # === STEP: Update Planner card ===
          # Edit this file, then run: node license-reclamation/src/build.js
          # Writes the findings to one CloudRadial Planner card on this company's board (stable key license-reclamation),
          # updating last month's card instead of adding another. When nothing is reclaimable it updates an existing
          # card to say so, and creates nothing. The card is the only thing this workflow writes; no licence is changed.
          # Secrets: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey, optional CloudRadial-CompanyId.
          # >>> _shared/cloudradial.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
              # A new Planner card needs a category: POST /v2/product answers 400 "The Category field is required" without one.
              # These are Endpoint LifeCycle Manager's defaults; a build's own category and productCategoryId always win.
              CardCategory          = 'Efficiency'
              CardProductCategoryId = 7
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          function Get-CrSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              if ([string]::IsNullOrWhiteSpace([string]$body['category'])) { $body['category'] = $CrState.CardCategory }
              if (-not $body.Contains('productCategoryId') -or $null -eq $body['productCategoryId']) { $body['productCategoryId'] = $CrState.CardProductCategoryId }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive by name through the legacy /api/beta/archive list (which ignores
          # companyId, so it is filtered here), and creates it with -Create. Returns @{ id; companyId; name; inboundAddress } or $null.
          # The create reply doesn't always carry the new id, so the archive is looked up again by name.
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              $find = {
                  $list = @(Get-CrBetaAll '/api/beta/archive')
                  @($list | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  # A 400 here has meant "already exists" when the list missed it, so look again before giving up.
                  try { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }) }
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  $id = Get-CrId $resp @('id', 'archiveId', 'companyReportFolderId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('id', 'archiveId', 'companyReportFolderId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = [string](Get-CrProp $hit 'inboundAddress') }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # <<< _shared/cloudradial.ps1
          # >>> _shared/company.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/company.ps1: run as the client the run input names ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # A step's Company setting picks whose secrets the step reads: the client's Microsoft 365 tenant AND its
          # CloudRadial portal. A pinned Company serves one client only, and import strips it. With the step's
          # "Include all companies" on (includeAllCompanies: true, which import keeps), the runner loads every
          # AutomationAI company into $companies, and Set-DefaultCompany switches the step's secrets to one of them.
          #   $co = Select-RunCompany (Get-Prop $in 'company')
          # A blank name keeps the step's own Company (or the runner's shared secrets), so a Routine with no input
          # still works. A name is matched to exactly one AutomationAI company by external id, then by name or alias
          # (case doesn't matter). No match, or more than one, throws, so a run never uses the wrong client's secrets.
          # Each step is its own script: call it in every step that reads a client secret.
          # Returns @{ selected; externalId; name; how }.

          function Get-CompanyField {
              param($Company, [string]$Name)
              if ($null -eq $Company) { return $null }
              if ($Company -is [System.Collections.IDictionary]) { if ($Company.Contains($Name)) { return $Company[$Name] }; return $null }
              $p = $Company.PSObject.Properties[$Name]
              if ($p) { return $p.Value }
              return $null
          }

          function Select-RunCompany {
              param([string]$Name)
              $want = ([string]$Name).Trim()
              if (-not $want) { return @{ selected = $false; externalId = ''; name = ''; how = "the step's own Company setting" } }
              $all = Get-Variable -Name companies -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $all) { throw "The run names the company '$want', but this step can't switch companies. Turn on Include all companies in the step's Company settings." }
              if (-not (Get-Command Set-DefaultCompany -ErrorAction SilentlyContinue)) { throw "The run names the company '$want', but this runner has no Set-DefaultCompany command." }
              $key = $want.ToLowerInvariant()
              $same = { param($v) $null -ne $v -and ([string]$v).Trim().ToLowerInvariant() -eq $key }
              $list = @($all)
              $hits = @($list | Where-Object { & $same (Get-CompanyField $_ 'externalId') })
              if ($hits.Count -eq 0) {
                  $hits = @($list | Where-Object {
                      $c = $_
                      (& $same (Get-CompanyField $c 'name')) -or (@(@(Get-CompanyField $c 'aliases') | Where-Object { & $same $_ }).Count -gt 0)
                  })
              }
              if ($hits.Count -eq 0) { throw "No AutomationAI company matches '$want'. Add the client under Companies with its Microsoft 365 and CloudRadial secrets, or use its exact name or external id." }
              if ($hits.Count -gt 1) {
                  $names = @($hits | ForEach-Object { "$(Get-CompanyField $_ 'name') ($(Get-CompanyField $_ 'externalId'))" }) -join ', '
                  throw "'$want' matches $($hits.Count) AutomationAI companies: $names. Use the external id instead."
              }
              $m = $hits[0]
              $id = [string](Get-CompanyField $m 'externalId')
              Set-DefaultCompany -Company $id
              return @{ selected = $true; externalId = $id; name = [string](Get-CompanyField $m 'name'); how = "the run's company input" }
          }
          # <<< _shared/company.ps1

          $in = Get-NodeInput
          function Enc { param($s) return [System.Net.WebUtility]::HtmlEncode([string]$s) }
          function Money { param([double]$v) return '$' + $v.ToString('N2', [System.Globalization.CultureInfo]::InvariantCulture) }
          $warnings = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-CrProp $in 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }

          function Stop-LrCard {
              param([string]$Why)
              Set-NodeOutput ([ordered]@{ status = 'error'; message = $Why; public_note = ''; internal_note = $Why; ticket_id = ''; actions = @(); warnings = @($warnings) })
              throw $Why
          }

          $CardSubject = 'Reclaim unused Microsoft 365 licences'
          $CardKey = 'license-reclamation'
          $MaxRows = 50
          $days = [int](Get-CrProp $in 'days')
          $preview = [bool](Get-CrProp $in 'preview')
          # client_visible shows the card to the client too. Left out, an existing card keeps the visibility it has.
          $clientVisible = [bool](Get-CrProp $in 'client_visible')
          $tenantId = [string](Get-CrProp $in 'tenantId')
          $checkedOn = [string](Get-CrProp $in 'checkedOn')
          $users = @(Get-CrProp $in 'users' | Where-Object { $null -ne $_ })
          $licenceCount = [int](Get-CrProp $in 'licenceCount')
          $saving = [double](Get-CrProp $in 'monthlySaving')
          $disabledCount = [int](Get-CrProp $in 'disabledCount')
          $unknownSkus = @(Get-CrProp $in 'unknownPriceSkus' | Where-Object { $_ })

          # Use the same client as the scan (if the run named one) before reading any secret.
          try { $runCo = Select-RunCompany ([string](Get-CrProp $in 'company')) } catch { Stop-LrCard ([string]$_.Exception.Message) }
          try { $null = Connect-Cr } catch { Stop-LrCard ([string]$_.Exception.Message) }

          # ---- which CloudRadial company: the run's company_id, then the CloudRadial-CompanyId secret, then the tenant match ----
          $tenantFields = @('tenantId', 'companyTenantId', 'officeTenantId', 'm365TenantId', 'azureTenantId', 'microsoftTenantId')
          function Get-LrTenantOf { param($co) foreach ($f in $tenantFields) { $v = [string](Get-CrProp $co $f); if ($v -match '^[0-9a-fA-F-]{36}$') { return $v.ToLowerInvariant() } }; return '' }
          $companyId = [int](Get-CrProp $in 'company_id')
          $how = 'company_id input'
          if ($companyId -le 0) {
              $sec = [string](Get-CrSecret 'CloudRadial-CompanyId')
              if ($sec.Trim() -match '^\d+$' -and [int]$sec.Trim() -gt 0) { $companyId = [int]$sec.Trim(); $how = 'CloudRadial-CompanyId secret' }
          }
          $company = $null
          try {
              if ($companyId -gt 0) {
                  $company = @(Get-CrAll "/v2/odata/company?`$filter=companyId eq $companyId") | Select-Object -First 1
                  if ($null -eq $company) { Stop-LrCard "CloudRadial company $companyId (from the $how) was not found. Check the company number and run again." }
              }
              else {
                  $all = @(Get-CrAll '/v2/odata/company')
                  $hits = @($all | Where-Object { $tenantId -and (Get-LrTenantOf $_) -eq $tenantId.ToLowerInvariant() })
                  if ($hits.Count -eq 1) { $company = $hits[0]; $companyId = [int](Get-CrProp $company 'companyId'); $how = 'Microsoft 365 tenant match' }
                  else { Stop-LrCard "Couldn't tell which CloudRadial company Microsoft 365 tenant $tenantId belongs to. Set company_id on the run, or add the CloudRadial-CompanyId secret to this runner's Key Vault." }
              }
          }
          catch { if ($_.Exception.Message -match "^(CloudRadial company|Couldn't tell)") { throw }; Stop-LrCard "Couldn't read the CloudRadial company: $($_.Exception.Message)" }
          $companyName = [string](Get-CrProp $company 'name'); if (-not $companyName) { $companyName = "company $companyId" }

          # Never write one tenant's users onto another company's card.
          $coTenant = Get-LrTenantOf $company
          if ($coTenant -and $tenantId -and $coTenant -ne $tenantId.ToLowerInvariant()) {
              Stop-LrCard "CloudRadial company $companyName ($companyId) is linked to a different Microsoft 365 tenant than the one this runner signs in to ($tenantId), so no card was written. Check company_id and the runner's M365 secrets."
          }

          # ---- the card ----
          $cards = @()
          try { $cards = @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $companyId") } catch { Stop-LrCard "Couldn't read the Planner cards for $($companyName): $($_.Exception.Message)" }
          $ovUsed = @(Get-CrProp $in 'overridesUsed' | Where-Object { $_ })
          $probe = Set-CrPlannerCard -CompanyId $companyId -Subject $CardSubject -Key $CardKey -Existing $cards -Fields @{ body = '' } -Preview
          $exists = ($probe.action -eq 'would-update')
          $secretsOf = if ($runCo.selected) { "the AutomationAI company '$($runCo.name)'" } else { "the step's Company setting" }
          $internal = "Internal: CloudRadial company $companyId (chosen by $how), Microsoft 365 tenant $tenantId, secrets from $secretsOf. Checked on $checkedOn with a $days-day threshold; $([int](Get-CrProp $in 'licensedUsers')) users with a paid licence were checked. Mailbox activity used: $(if ([bool](Get-CrProp $in 'mailboxChecked')) { 'yes' } else { 'no' }). Price overrides: $(if ($ovUsed.Count) { $ovUsed -join ', ' } else { 'none' }). Marker: $CardKey."

          if (-not $users.Count) {
              $msg = "Every paid Microsoft 365 licence at $companyName was used in the last $days days, so there is nothing to reclaim."
              if (-not $exists) {
                  Set-NodeOutput ([ordered]@{ status = 'success'; message = "$msg No Planner card was needed."; public_note = ''; internal_note = $internal; ticket_id = ''; actions = @(); warnings = @($warnings)
                          companyId = $companyId; companyName = $companyName; cardAction = 'none'; productId = ''; licenceCount = 0; monthlySaving = 0; users = @() })
                  return
              }
              $body = "<p>This CloudRadial Planner card tracks unused Microsoft 365 licences at $(Enc $companyName).</p><p>As of $(Enc $checkedOn), every paid licence was used in the last $days days, so there is nothing to reclaim this month.</p><p>This card is updated each month by the License Reclamation automation.</p>"
              $fields = [ordered]@{ body = $body; summary = 'No unused Microsoft 365 licences this month.'; notes = $internal; status = 40; priority = -1 }
              if ($clientVisible) { $fields.isClientVisible = $true }
              $r = Set-CrPlannerCard -CompanyId $companyId -Subject $CardSubject -Key $CardKey -Existing $cards -Fields $fields -Preview:$preview
              $done = if ($preview) { "Preview only: the Planner card would be updated to say so." } else { 'The Planner card was updated to say so.' }
              Set-NodeOutput ([ordered]@{ status = $(if ($preview) { 'pending_confirmation' } else { 'success' }); message = "$msg $done"; public_note = ''; internal_note = $internal; ticket_id = ''
                      actions = @("Planner card $($r.action)"); warnings = @($warnings); companyId = $companyId; companyName = $companyName; cardAction = $r.action; productId = [string]$r.productId; licenceCount = 0; monthlySaving = 0; users = @() })
              return
          }

          $userWord = if ($users.Count -eq 1) { '1 user' } else { "$($users.Count) users" }
          $licWord = if ($licenceCount -eq 1) { '1 paid licence' } else { "$licenceCount paid licences" }
          $disWord = ''
          if ($disabledCount -eq 1) { $disWord = ', including 1 disabled account that still holds a licence' } elseif ($disabledCount -gt 1) { $disWord = ", including $disabledCount disabled accounts that still hold a licence" }
          $summary = "$licWord held by $userWord have not been used in $days days, worth an estimated $(Money $saving) a month."

          $sb = New-Object System.Text.StringBuilder
          $null = $sb.Append("<p>This CloudRadial Planner card lists Microsoft 365 licences at $(Enc $companyName) that look unused. As of $(Enc $checkedOn), $licWord held by $userWord have not been used in the last $days days$disWord.</p>")
          $null = $sb.Append("<p>Removing them could save an estimated <strong>$(Money $saving) a month</strong> ($(Money ($saving * 12)) a year). Prices are Microsoft list-price estimates in US dollars, not what this client actually pays.")
          if ($unknownSkus.Count) { $null = $sb.Append(" The price of $(Enc ($unknownSkus -join ', ')) is unknown, so $(if ($unknownSkus.Count -eq 1) { 'it is' } else { 'they are' }) not in the total.") }
          $null = $sb.Append('</p><p>Nothing has been removed. Review the list with the client, then remove or reassign the licences in the Microsoft 365 admin center.</p>')
          $null = $sb.Append('<table><thead><tr><th>User</th><th>Licence</th><th>Last sign-in</th><th>Status</th></tr></thead><tbody>')
          foreach ($u in @($users | Select-Object -First $MaxRows)) {
              $lics = @(@(Get-CrProp $u 'licences') | ForEach-Object { $p = Get-CrProp $_ 'price'; "$(Enc (Get-CrProp $_ 'name')) ($(if ($null -ne $p) { Money ([double]$p) } else { 'price unknown' }))" }) -join '<br>'
              $last = [string](Get-CrProp $u 'lastSignIn'); if (-not $last) { $last = 'Never' }
              $st = switch ([string](Get-CrProp $u 'reason')) { 'disabled' { 'Disabled but licensed' } 'never' { 'Never signed in' } default { 'Inactive' } }
              $mb = [string](Get-CrProp $u 'lastMailbox'); if ($mb) { $st = "$st (mailbox last used $mb)" }
              $who = Enc (Get-CrProp $u 'name'); $upn = [string](Get-CrProp $u 'upn'); if ($upn) { $who = "$who<br>$(Enc $upn)" }
              $null = $sb.Append("<tr><td>$who</td><td>$lics</td><td>$(Enc $last)</td><td>$(Enc $st)</td></tr>")
          }
          $null = $sb.Append('</tbody></table>')
          if ($users.Count -gt $MaxRows) { $null = $sb.Append("<p>$($users.Count - $MaxRows) more users are not shown here. The full list is in the workflow run output.</p>") }
          $null = $sb.Append('<p>A shared mailbox only needs a licence when it holds more than 50 GB or has an archive, so check those before removing a licence.</p>')
          foreach ($w in $warnings) { $null = $sb.Append("<p>Note: $(Enc $w)</p>") }
          $null = $sb.Append('<p>This card is updated each month by the License Reclamation automation.</p>')

          $fields = [ordered]@{ body = $sb.ToString(); summary = $summary; notes = $internal; status = 0; priority = $(if ($saving -ge 100 -or $disabledCount -gt 0) { 1 } else { 0 }) }
          if ($clientVisible) { $fields.isClientVisible = $true }
          try { $r = Set-CrPlannerCard -CompanyId $companyId -Subject $CardSubject -Key $CardKey -Existing $cards -Fields $fields -Preview:$preview }
          catch { Stop-LrCard "Couldn't write the Planner card for $($companyName): $($_.Exception.Message)" }
          if ($r.optionalFieldsDropped) { $null = $warnings.Add('This portal did not accept the internal notes field, so the card was written without it.') }

          $verb = switch ($r.action) { 'created' { 'added to' } 'updated' { 'updated on' } 'would-create' { 'would be added to' } default { 'would be updated on' } }
          $shown = if ($clientVisible) { ' and shown to the client' } else { '' }
          # Possessive that reads right for names ending in s ("Fabrikam Services' board").
          $whose = if ($companyName -match 's$') { "$companyName'" } else { "$companyName's" }
          $msg = "$summary The CloudRadial Planner card '$CardSubject' was $verb $whose board for review$shown. No licence was changed."
          if ($preview) { $msg = "Preview only: $summary The CloudRadial Planner card '$CardSubject' $verb $whose board$shown when this runs without preview. No licence was changed." }
          Set-NodeOutput ([ordered]@{
                  status        = $(if ($preview) { 'pending_confirmation' } else { 'success' })
                  message       = $msg
                  public_note   = ''
                  internal_note = $internal
                  ticket_id     = ''
                  actions       = @("Planner card $($r.action)")
                  warnings      = @($warnings)
                  companyId     = $companyId
                  companyName   = $companyName
                  cardAction    = $r.action
                  productId     = [string]$r.productId
                  clientVisible = $clientVisible
                  licenceCount  = $licenceCount
                  monthlySaving = $saving
                  users         = $users
              })
        timeoutSeconds: 600
        retryCount: 0
        parameters: []
        aiExtensions: []
        includeAllCompanies: true
    - id: node-summary
      name: Week-one summary
      type: powershell-script
      position:
        x: 1860
        'y': 120
      properties:
        script: |
          # === STEP: Week-one summary ===
          # Edit this file, then run: node first-30-days/src/build.js
          # Pulls the stages' results into one plain summary: what was set up, the score, the licence savings,
          # and the manual steps left. Reads only the step parameters below and writes nothing anywhere.
          #   plan   the Read the client output        setup  the Add portal content output
          #   score  the Secure Score step's output    card   the licence card step's output
          function Get-F3Prop { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-F3Text { param($o, [string]$n) $v = Get-F3Prop $o $n; if ($null -eq $v) { return '' }; return ([string]$v).Trim() }
          function ConvertTo-F3Object {
              param($v)
              if ($v -is [string]) { $s = $v.Trim(); if ($s.StartsWith('{')) { try { return ($s | ConvertFrom-Json -ErrorAction Stop) } catch { } }; return $null }
              return $v
          }
          function Get-F3List { param($o, [string]$n) return @(@(Get-F3Prop $o $n) | Where-Object { $null -ne $_ -and ([string]$_).Trim() } | ForEach-Object { ([string]$_).Trim() }) }

          # The agent step can come back as {"result": "<a sentence> {json}"}. Take the JSON out of the text; if there's
          # none, keep the text as the answer.
          function Get-F3AgentOutput {
              param($v)
              $o = ConvertTo-F3Object $v
              $r = Get-F3Prop $o 'result'
              if ($null -ne $o -and $r -is [string] -and $null -eq (Get-F3Prop $o 'answer')) {
                  $a = $r.IndexOf('{'); $b = $r.LastIndexOf('}')
                  if ($a -ge 0 -and $b -gt $a) { try { return ($r.Substring($a, $b - $a + 1) | ConvertFrom-Json -ErrorAction Stop) } catch { } }
                  return [pscustomobject]@{ answer = $r.Trim() }
              }
              return $o
          }
          # Possessive that reads right for names ending in s.
          function Get-F3Of { param([string]$n) if ($n -match 's$') { return "$n'" }; return "$n's" }

          $in = Get-NodeInput
          $plan = ConvertTo-F3Object (Get-F3Prop $in 'plan')
          $setup = Get-F3AgentOutput (Get-F3Prop $in 'setup')
          $score = ConvertTo-F3Object (Get-F3Prop $in 'score')
          $card = ConvertTo-F3Object (Get-F3Prop $in 'card')

          $company = Get-F3Text $plan 'company'; if (-not $company) { $company = 'the client' }
          $companyId = Get-F3Text $plan 'company_id'
          $live = ((Get-F3Text $plan 'mode') -eq 'live')
          $warnings = New-Object System.Collections.ArrayList
          $manual = New-Object System.Collections.ArrayList
          $lines = New-Object System.Collections.ArrayList

          # ---- 1. portal setup ----
          # The agent sometimes lists what it skipped among its actions; count those as skipped.
          $setupAll = @(Get-F3List $setup 'actions')
          # No actions list: use the answer's one-line-per-record lines ("created user: ...", "skipped domain: ...").
          if (-not $setupAll.Count) {
              $setupAll = @(([string](Get-F3Text $setup 'answer')) -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^(?i)(created|would create|skipped|failed|not created)\b' })
          }
          $setupActions = @($setupAll | Where-Object { $_ -notmatch '^(?i)skip' })
          $setupSkipped = @(@(Get-F3List $setup 'skipped') + @($setupAll | Where-Object { $_ -match '^(?i)skip' }))
          $setupFailed = @(Get-F3List $setup 'failed')
          if ($null -eq $setup) { $null = $warnings.Add('Portal setup returned nothing.'); $null = $lines.Add('Portal setup: no result.') }
          else {
              # One line, then one bullet per change. The step's full answer stays in setupAnswer, not the summary.
              $preview = (@($setupActions | Where-Object { $_ -match '^(?i)would ' }).Count -gt 0)
              $count = if (-not $setupActions.Count) { 'no changes' } elseif ($preview) { "$($setupActions.Count) change(s) to make (preview)" } else { "$($setupActions.Count) change(s)" }
              $line = "Portal setup: $count$(if ($setupSkipped.Count) { ", $($setupSkipped.Count) already there" })$(if ($setupFailed.Count) { ", $($setupFailed.Count) failed" })."
              foreach ($a in $setupActions) { $line += "`n    - $a" }
              foreach ($a in $setupFailed) { $line += "`n    - Failed $a" }
              if ($setupFailed.Count) { $null = $warnings.Add("$($setupFailed.Count) portal record(s) couldn't be added. See Portal setup.") }
              foreach ($w in @(Get-F3List $setup 'warnings')) { $null = $warnings.Add($w) }
              $null = $lines.Add($line)
              foreach ($m in @(Get-F3List $setup 'manualSteps')) { if (-not $manual.Contains($m)) { $null = $manual.Add($m) } }
              $setupId = Get-F3Text $setup 'companyId'
              if ($setupId -and $companyId -and $setupId -match '^\d+$' -and $setupId -ne $companyId) { $null = $warnings.Add("Portal setup reported company $setupId, but this run is for company $companyId. Check the setup's actions.") }
          }

          # ---- 2. Secure Score ----
          $scoreStatus = Get-F3Text $score 'status'
          $tenantScore = Get-F3Text $score 'tenantScore'
          $assessmentId = Get-F3Text $score 'assessmentId'
          switch ($scoreStatus) {
              'created' {
                  $null = $lines.Add("Security: Microsoft Secure Score $tenantScore, added to the portal as assessment $assessmentId ($(Get-F3Text $score 'compliant') of $(Get-F3Text $score 'controls') controls compliant).")
                  $null = $manual.Add("In the portal, open $(Get-F3Of $company) Assessments and choose Run on the new Microsoft Secure Score assessment, so the client sees their score.")
              }
              'skipped' { $null = $lines.Add("Security: Microsoft Secure Score $tenantScore. Today's assessment already exists, so it wasn't added again.") }
              'plan' { $null = $lines.Add("Security (preview): Microsoft Secure Score $tenantScore. The assessment would be added with $(Get-F3Text $score 'controls') controls, $(Get-F3Text $score 'compliant') compliant.") }
              default { $null = $lines.Add("Security: no result$(if ($scoreStatus) { " ($scoreStatus)" }). $(Get-F3Text $score 'message')".Trim()); $null = $warnings.Add('The Secure Score step did not finish with a result.') }
          }

          # ---- 3. licences ----
          $cardStatus = Get-F3Text $card 'status'
          $saving = 0.0; $null = [double]::TryParse((Get-F3Text $card 'monthlySaving'), [System.Globalization.NumberStyles]::Float, [System.Globalization.CultureInfo]::InvariantCulture, [ref]$saving)
          $licences = Get-F3Text $card 'licenceCount'; if (-not $licences) { $licences = '0' }
          if ($cardStatus -in @('success', 'pending_confirmation')) {
              $null = $lines.Add("Licences: $(Get-F3Text $card 'message')")
              if ([int]$licences -gt 0) { $null = $manual.Add("Review the 'Reclaim unused Microsoft 365 licences' card with $company before removing anything. Nothing was removed.") }
          }
          else { $null = $lines.Add("Licences: no result$(if ($cardStatus) { " ($cardStatus)" }). $(Get-F3Text $card 'message')".Trim()); $null = $warnings.Add('The licence card step did not finish with a result.') }

          $money = '$' + $saving.ToString('N2', [System.Globalization.CultureInfo]::InvariantCulture)
          $headline = if ($live) { "Week one for $company is done" } else { "Week one for $company, previewed" }
          $headline += ": score $(if ($tenantScore) { $tenantScore } else { 'not read' }), $licences unused licence(s) worth about $money a month."
          if ($warnings.Count) { $headline += " $($warnings.Count) thing(s) need a look." }
          $text = $headline + "`n`n" + ((@($lines) | ForEach-Object { "- $_" }) -join "`n") + $(if ($manual.Count) { "`n`nStill to do by hand:`n" + ((@($manual) | ForEach-Object { "- $_" }) -join "`n") } else { '' })

          Set-NodeOutput ([ordered]@{
                  status        = $(if ($warnings.Count) { 'incomplete' } elseif ($live) { 'success' } else { 'pending_confirmation' })
                  message       = $headline
                  summary       = $text
                  public_note   = ''
                  internal_note = $text
                  ticket_id     = ''
                  actions       = @($setupActions + @($(if ($scoreStatus -eq 'created') { "Added Secure Score assessment $assessmentId" })) + @($(if ($cardStatus -eq 'success') { "Planner card $(Get-F3Text $card 'cardAction')" })) | Where-Object { $_ })
                  warnings      = @($warnings)
                  manualSteps   = @($manual)
                  company       = $company
                  companyId     = $companyId
                  secureScore   = $tenantScore
                  assessmentId  = $assessmentId
                  licenceCount  = [int]$licences
                  monthlySaving = $saving
                  setupAnswer   = (Get-F3Text $setup 'answer')
              })
        timeoutSeconds: 60
        retryCount: 0
        aiExtensions: []
        parameters:
          - name: plan
            expression: '{{ nodes.node-plan.output }}'
          - name: setup
            expression: '{{ nodes.node-portal.output }}'
          - name: score
            expression: '{{ nodes.node-score.output }}'
          - name: card
            expression: '{{ nodes.node-lr-card.output }}'
    - id: end
      name: End
      type: end
      position:
        x: 2080
        'y': 120
  connections:
    - source: start
      target: node-plan
      sourceHandle: null
    - source: node-plan
      target: node-setup-inputs
      sourceHandle: null
    - source: node-setup-inputs
      target: node-portal
      sourceHandle: null
    - source: node-portal
      target: node-score
      sourceHandle: null
    - source: node-score
      target: node-lr-inputs
      sourceHandle: null
    - source: node-lr-inputs
      target: node-lr-scan
      sourceHandle: null
    - source: node-lr-scan
      target: node-lr-card
      sourceHandle: null
    - source: node-lr-card
      target: node-summary
      sourceHandle: null
    - source: node-summary
      target: end
      sourceHandle: null
  startActivityId: start
