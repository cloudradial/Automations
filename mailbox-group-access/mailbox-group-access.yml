# CloudRadial AutomationAI - Mailbox / Group Access Request (Microsoft 365, Exchange Online and the PSA ticket).
# Generated by src/build.js. Edit the scripts in src/, not this file.
# Import on Workflows -> Import. See README.md for secrets, permissions and inputs.
automationsWorkflow: 1
name: Mailbox / Group Access Request
description: 'Gives a user access to an existing shared mailbox, Microsoft 365 group, security group, distribution list or Team: full access, send as, send on behalf, membership or ownership. Refuses privileged, role-assignable, dynamic and on-premises synced groups, and waits for the user''s manager or the group''s owner to approve. Changes nothing unless confirm is true, reads the change back, notes the PSA ticket and closes it.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 80
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-read
      name: Read the request and plan it
      type: powershell-script
      position:
        x: 320
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  Mailbox / Group Access Request - Read the request and plan it
          #  Read-only. Finds the user and the mailbox, group or Team, refuses privileged, role-assignable, dynamic and
          #  on-premises synced groups, checks for existing access, and works out who must approve.
          #  Secrets: M365-TenantId, M365-ClientId, M365-ClientSecret; MicrosoftExchange-* (see README).
          #  Generated from mailbox-group-access/src. Edit the source, then run build.js.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Signs in with the app registration's client credentials from the runner Key Vault.
          # Each helper names the Graph application permission it needs; when Graph answers 403,
          # the error says which permission to grant (with admin consent).
          # All state lives in the $GraphState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $GraphState = @{
              Base           = 'https://graph.microsoft.com'
              Headers        = $null
              Creds          = $null
              TenantId       = ''
              ExpiresAt      = [datetime]::MinValue
              MaxAttempts    = 5
              MaxWaitSeconds = 120
              LastStatus     = 0
          }

          # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
          # The first secret that has a value, from a list of names.
          function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
          function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-GraphRetryAfter {
              param($Err, [int]$Attempt)
              $s = 0
              try {
                  $ra = $Err.Exception.Response.Headers.RetryAfter
                  if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                  elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
              } catch { }
              if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
              return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
          }
          # Graph's own error message when there is one, otherwise the exception text.
          function Get-GraphErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
              return [string]$Err.Exception.Message
          }
          function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

          function Update-GraphToken {
              $c = $GraphState.Creds
              if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
              $r = $null
              try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
              catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
              $tok = Get-GraphProp $r 'access_token'
              if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
              $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
              $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
              $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
          }

          # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
          # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
          # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
          # Returns @{ TenantId }.
          function Connect-Graph {
              param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
              $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
              $GraphState.TenantId = $TenantId.Trim()
              Update-GraphToken
              return @{ TenantId = $GraphState.TenantId }
          }

          # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
          # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
          # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
          # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
          function Invoke-Graph {
              param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
              if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
              $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
              $short = $uri.Replace($GraphState.Base, '')
              $reauth = $false
              for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                  if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                  $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                  $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                  try {
                      $r = Invoke-RestMethod @p
                      $GraphState.LastStatus = 200
                      return $r
                  }
                  catch {
                      $code = Get-GraphHttpStatus $_
                      $GraphState.LastStatus = $code
                      if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                      if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                      $why = Get-GraphErrorText $_
                      if ($code -eq 403) {
                          $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                          throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                      }
                      throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                  }
              }
          }

          # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
          function Get-GraphAll {
              param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList
              $next = $Path; $n = 0
              while ($next -and $n -lt $MaxPages) {
                  $n++
                  $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                  foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                  $next = [string](Get-GraphProp $r '@odata.nextLink')
              }
              return @($rows)
          }

          # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
          function Get-GraphUser {
              param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }

          # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
          # Mail-enabled security groups and distribution lists can't be changed through Graph.
          function Add-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
              catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
          }

          # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
          function Remove-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
              catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
          }

          # Sets the user's manager. Needs User.ReadWrite.All.
          function Set-GraphManager {
              param([string]$UserId, [string]$ManagerId)
              $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
          }

          # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
          function Revoke-GraphSessions {
              param([string]$UserId)
              $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
          }

          # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
          # Disabling an admin account also needs a privileged role, which app permissions can't grant.
          function Set-GraphAccountEnabled {
              param([string]$UserId, [bool]$Enabled)
              $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
          }

          # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
          # The user must have a usage location before a licence can be added.
          function Set-GraphLicense {
              param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
              $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
              $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
              if (-not $toAdd.Count -and -not $toRemove.Count) { return }
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
              catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
          }

          # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
          # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
          function Get-GraphSignInActivity {
              param([string]$UserId = '')
              $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
              $perm = 'AuditLog.Read.All (with User.Read.All)'
              if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
              # Graph caps the page size at 120 when signInActivity is selected.
              return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
          }

          # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
          function Get-GraphAuthMethods {
              param([string]$UserId)
              return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
          }

          # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
          # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
          function Remove-GraphAuthMethod {
              param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
              if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
              $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
              $seg = @{
                  microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                  phoneAuthenticationMethod                  = 'phoneMethods'
                  fido2AuthenticationMethod                  = 'fido2Methods'
                  emailAuthenticationMethod                  = 'emailMethods'
                  softwareOathAuthenticationMethod           = 'softwareOathMethods'
                  windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                  temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                  platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
              }
              if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
              if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
              $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
          }

          # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
          # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
          function Get-GraphRiskyUsers {
              param([string]$UserId = '', [switch]$AtRiskOnly)
              $perm = 'IdentityRiskyUser.Read.All'
              if ($UserId) {
                  try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                  catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
              }
              $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
              return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
          }

          # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
          function New-GraphTempPassword {
              param([int]$Length = 16)
              if ($Length -lt 8) { $Length = 8 }
              $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
              $all = -join $sets
              $rng = [System.Security.Cryptography.RandomNumberGenerator]
              $chars = New-Object System.Collections.Generic.List[char]
              foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
              while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
              for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
              return -join $chars
          }
          # ---------- end _shared/graph.ps1 ----------
          # <<< _shared/graph.ps1
          # >>> _shared/exchange.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- Exchange Online ----------
          # Graph can't convert a mailbox to shared, hide it from the address list, set forwarding, or create a shared
          # mailbox or distribution list, so these helpers reach Exchange Online two ways, in this order:
          #   1. The Exchange admin REST endpoint the microsoft-exchange catalog extension uses
          #      (POST https://outlook.office365.com/adminapi/beta/{tenant}/InvokeCommand), signed in with the
          #      extension's own secrets: MicrosoftExchange-TenantId, MicrosoftExchange-ClientId, MicrosoftExchange-ClientSecret.
          #   2. The ExchangeOnlineManagement module with app-only certificate auth, when the module is on the runner
          #      and the secrets MicrosoftExchange-ClientId, MicrosoftExchange-Organization (or the -Organization the caller
          #      passes, such as the tenant's .onmicrosoft.com domain found through Graph) and
          #      MicrosoftExchange-CertificateThumbprint or MicrosoftExchange-Certificate (base64 PFX, with optional
          #      MicrosoftExchange-CertificatePassword) are set.
          # Either way the app registration needs the Exchange.ManageAsApp application permission (Office 365 Exchange Online)
          # and the Exchange Administrator role.
          # When neither works, Connect-OfExchange returns $false and $OfExo.Reason says why; the caller decides whether to
          # list the Exchange steps for a technician or stop.
          # In module mode every cmdlet that isn't Get-* runs with -Confirm:$false, so it can't stop to ask.
          #
          # All state lives in $OfExo, changed in place (the runner runs a step in a child scope, so no $script: variables):
          #   Mode       'rest' or 'module' once connected, '' before
          #   Connected  $true after a successful sign-in
          #   Tried      $true after the first Connect-OfExchange, so a failed sign-in isn't retried in the same step
          #   Reason     why the sign-in failed, as plain sentences joined with '; '
          #   TenantId   the tenant the REST calls go to
          #   Token      the REST bearer token
          # The Of prefix (and the helper names) come from the first automation that used this code; keep them, so a step
          # can use it next to the other libraries without name clashes.
          $OfExo = @{ Mode = ''; Reason = ''; TenantId = ''; Token = ''; Connected = $false; Tried = $false }

          function Get-OfSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; if ([string]::IsNullOrWhiteSpace([string]$v)) { return '' }; return ([string]$v).Trim() }
          function Get-OfProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-OfErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) {
                  try {
                      $j = $d | ConvertFrom-Json -ErrorAction Stop
                      $e = Get-OfProp $j 'error'
                      # A sign-in error carries a code in "error" and the readable text in "error_description".
                      $m = Get-OfProp $j 'error_description'
                      if (-not $m) { $m = $(if ($e -is [string]) { $e } else { Get-OfProp $e 'message' }) }
                      if (-not $m) { $m = Get-OfProp $j 'message' }
                      if ($m) { return [string]$m }
                  } catch { }
                  return [string]$d
              }
              return [string]$Err.Exception.Message
          }
          function Get-OfHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Test-OfNotFound { param([string]$Text) return $Text -match "(?i)couldn't be found|could not be found|ManagementObjectNotFound|wasn't found|was not found" }

          # Signs in to Exchange Online once per step. Returns $true when connected; otherwise $false with $OfExo.Reason set.
          function Connect-OfExchange {
              param([string]$Organization = '')
              if ($OfExo.Connected) { return $true }
              if ($OfExo.Tried) { return $false }
              $OfExo.Tried = $true
              $appId = Get-OfSecret 'MicrosoftExchange-ClientId'
              $tenant = Get-OfSecret 'MicrosoftExchange-TenantId'
              $clientSecret = Get-OfSecret 'MicrosoftExchange-ClientSecret'
              $thumb = Get-OfSecret 'MicrosoftExchange-CertificateThumbprint'
              $pfx = Get-OfSecret 'MicrosoftExchange-Certificate'
              $org = Get-OfSecret 'MicrosoftExchange-Organization'; if (-not $org) { $org = $Organization }
              $why = New-Object System.Collections.ArrayList

              # 1. The Exchange admin REST endpoint with the microsoft-exchange extension's secrets.
              if ($tenant -and $appId -and $clientSecret) {
                  try {
                      $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$tenant/oauth2/v2.0/token" -Body @{ client_id = $appId; client_secret = $clientSecret; scope = 'https://outlook.office365.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop
                      $tok = [string](Get-OfProp $r 'access_token')
                      if (-not $tok) { throw 'Microsoft sign-in returned no access token.' }
                      $OfExo.Token = $tok; $OfExo.TenantId = $tenant; $OfExo.Mode = 'rest'; $OfExo.Connected = $true; $OfExo.Reason = ''
                      return $true
                  }
                  catch { $null = $why.Add("Exchange Online sign-in with the MicrosoftExchange-* secrets failed: $(Get-OfErrorText $_)") }
              }
              elseif (-not ($thumb -or $pfx)) {
                  $miss = @(); if (-not $tenant) { $miss += 'MicrosoftExchange-TenantId' }; if (-not $appId) { $miss += 'MicrosoftExchange-ClientId' }; if (-not $clientSecret) { $miss += 'MicrosoftExchange-ClientSecret' }
                  $null = $why.Add("the runner has no Exchange Online secrets ($($miss -join ', ') missing)")
              }

              # 2. ExchangeOnlineManagement with a certificate.
              if ($thumb -or $pfx) {
                  $hasModule = $false
                  try { $hasModule = [bool](@(Get-Module -ListAvailable -Name ExchangeOnlineManagement -ErrorAction SilentlyContinue | Where-Object { $null -ne $_ }).Count) } catch { }
                  if (-not $hasModule) { $null = $why.Add('the ExchangeOnlineManagement PowerShell module is not installed on the runner') }
                  elseif (-not $appId) { $null = $why.Add('the MicrosoftExchange-ClientId secret is missing') }
                  elseif (-not $org) { $null = $why.Add('the MicrosoftExchange-Organization secret (the tenant''s .onmicrosoft.com domain) is missing') }
                  else {
                      try {
                          Import-Module ExchangeOnlineManagement -ErrorAction Stop
                          $p = @{ AppId = $appId; Organization = $org; ShowBanner = $false; ErrorAction = 'Stop' }
                          if ($pfx) {
                              $pw = Get-OfSecret 'MicrosoftExchange-CertificatePassword'
                              $p.Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($pfx), $pw, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
                          }
                          else { $p.CertificateThumbprint = $thumb }
                          Connect-ExchangeOnline @p
                          $OfExo.Mode = 'module'; $OfExo.Connected = $true; $OfExo.Reason = ''
                          return $true
                      }
                      catch { $null = $why.Add("Exchange Online PowerShell sign-in failed: $($_.Exception.Message)") }
                  }
              }
              $OfExo.Reason = ($why -join '; ')
              return $false
          }

          # Runs one Exchange cmdlet. Returns an array of result objects; throws a plain sentence on failure.
          # REST retries 429, 503 and 504; a 401 or 403 names the permission and role the app registration needs.
          function Invoke-OfExo {
              param([string]$Cmdlet, [hashtable]$Parameters = @{})
              if (-not $OfExo.Connected) { throw "Exchange Online isn't connected: $($OfExo.Reason)" }
              if ($OfExo.Mode -eq 'module') {
                  $p = @{}; foreach ($k in $Parameters.Keys) { $p[$k] = $Parameters[$k] }; $p.ErrorAction = 'Stop'
                  if ($Cmdlet -notlike 'Get-*') { $p.Confirm = $false }
                  try { return @(& $Cmdlet @p) } catch { throw "Exchange Online $Cmdlet failed: $($_.Exception.Message)" }
              }
              $body = ConvertTo-Json -InputObject @{ CmdletInput = @{ CmdletName = $Cmdlet; Parameters = $Parameters } } -Depth 6 -Compress
              $h = @{ Authorization = "Bearer $($OfExo.Token)"; Accept = 'application/json' }
              for ($i = 1; $i -le 4; $i++) {
                  try {
                      $r = Invoke-RestMethod -Method POST -Uri "https://outlook.office365.com/adminapi/beta/$($OfExo.TenantId)/InvokeCommand" -Headers $h -Body $body -ContentType 'application/json' -ErrorAction Stop
                      return @(@(Get-OfProp $r 'value') | Where-Object { $null -ne $_ })
                  }
                  catch {
                      $code = Get-OfHttpStatus $_
                      if ($code -in @(429, 503, 504) -and $i -lt 4) { Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $i))); continue }
                      $txt = Get-OfErrorText $_
                      if ($code -eq 403 -or $code -eq 401) { throw "Exchange Online refused $Cmdlet (HTTP $code). The app registration needs the Exchange.ManageAsApp application permission and the Exchange Administrator role. Exchange said: $txt" }
                      throw "Exchange Online $Cmdlet failed$(if ($code) { " (HTTP $code)" }): $txt"
                  }
              }
          }

          # The recipient with this identity (address, alias or name), or $null when there is none.
          function Get-OfRecipient {
              param([string]$Identity)
              try { return @(Invoke-OfExo 'Get-Recipient' @{ Identity = $Identity })[0] }
              catch { if (Test-OfNotFound $_.Exception.Message) { return $null }; throw }
          }

          # The user's mailbox, or $null when they have none.
          function Get-OfMailbox {
              param([string]$Identity)
              try { return @(Invoke-OfExo 'Get-Mailbox' @{ Identity = $Identity })[0] }
              catch { if (Test-OfNotFound $_.Exception.Message) { return $null }; throw }
          }

          # Mailbox size in bytes from Get-MailboxStatistics, or -1 when it can't be read.
          function Get-OfMailboxBytes {
              param([string]$Identity)
              try {
                  $s = @(Invoke-OfExo 'Get-MailboxStatistics' @{ Identity = $Identity })[0]
                  $t = [string](Get-OfProp $s 'TotalItemSize')
                  if ($t -match '\(([\d,\.]+) bytes\)') { return [double]($Matches[1] -replace '[,\.]', '') }
              } catch { }
              return -1
          }
          # ---------- end Exchange Online helpers ----------
          # <<< _shared/exchange.ps1
          # ---------- src/common.ps1: helpers the Read and Grant steps share (pasted in by build.js) ----------
          # Needs _shared/graph.ps1 and _shared/exchange.ps1 above it.
          function Test-AccGuid { param([string]$s) return ([string]$s).Trim() -match '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
          function Test-AccTrue { param($v) return ($v -eq $true -or ([string]$v).Trim() -match '^(?i)(true|yes|y|1|on)$') }
          function Test-AccEmail { param([string]$s) return $s -match '^[^@\s<>,;]+@[^@\s<>,;]+\.[^@\s<>,;]+$' }
          function Format-AccQuote { param([string]$s) return "'" + ([string]$s).Replace("'", "''") + "'" }
          function Format-AccOData { param([string]$s) return [uri]::EscapeDataString(([string]$s).Replace("'", "''")) }
          function ConvertFrom-AccMaybeJson { param($v) if ($v -is [string]) { $s = $v.Trim(); if ($s -match '^[\[{]') { try { return ($s | ConvertFrom-Json) } catch { } } }; return $v }

          $AccKinds = @{
              team = 'Team'; m365_group = 'Microsoft 365 group'; security_group = 'security group'; mail_security_group = 'mail-enabled security group'
              distribution_list = 'distribution list'; shared_mailbox = 'shared mailbox'; room_mailbox = 'room mailbox'; equipment_mailbox = 'equipment mailbox'; user_mailbox = 'user mailbox'
          }
          # How each access type reads in a sentence: "already has <phrase> the shared mailbox Contoso Sales".
          $AccPhrase = @{ fullAccess = 'full access to'; sendAs = 'send-as permission on'; sendOnBehalf = 'send-on-behalf permission on'; member = 'membership of'; owner = 'ownership of' }
          $AccMailboxKinds = @('shared_mailbox', 'room_mailbox', 'equipment_mailbox', 'user_mailbox')
          # Groups whose membership only Exchange Online can change (Graph can read them, not write them).
          $AccExchangeGroupKinds = @('distribution_list', 'mail_security_group')
          # The access types each kind of resource takes; the first is the default.
          $AccAllowed = @{
              team = @('member', 'owner', 'sendAs'); m365_group = @('member', 'owner', 'sendAs'); security_group = @('member', 'owner')
              mail_security_group = @('member', 'owner', 'sendAs'); distribution_list = @('member', 'owner', 'sendAs')
              shared_mailbox = @('fullAccess', 'sendAs', 'sendOnBehalf'); room_mailbox = @('fullAccess', 'sendAs', 'sendOnBehalf'); equipment_mailbox = @('fullAccess', 'sendAs', 'sendOnBehalf'); user_mailbox = @('fullAccess', 'sendAs', 'sendOnBehalf')
          }

          # Every way a user can be named, lower case: object id, UPN, mail, display name and alias.
          function Get-AccUserKeys {
              param($User)
              return @(@('id', 'upn', 'mail', 'name', 'alias') | ForEach-Object { ([string](Get-OfProp $User $_)).Trim().ToLowerInvariant() } | Where-Object { $_ } | Select-Object -Unique)
          }
          # $true when one of $Values (Exchange strings, or objects such as Get-DistributionGroupMember rows) names $User.
          function Test-AccNamed {
              param($Values, $User)
              $keys = @(Get-AccUserKeys $User)
              foreach ($v in @($Values)) {
                  if ($null -eq $v) { continue }
                  $cands = @()
                  if ($v -is [string]) { $cands = @($v) }
                  else { $cands = @(@('ExternalDirectoryObjectId', 'PrimarySmtpAddress', 'WindowsLiveID', 'UserPrincipalName', 'Alias', 'Name', 'DisplayName', 'Identity') | ForEach-Object { [string](Get-OfProp $v $_) }) }
                  foreach ($c in $cands) { $k = ([string]$c).Trim().ToLowerInvariant(); if ($k -and $keys -contains $k) { return $true } }
              }
              return $false
          }
          function Get-AccRights { param($Row) return (@(Get-OfProp $Row 'AccessRights') | ForEach-Object { [string]$_ }) -join ',' }

          # The one change that gives the access, with the exact command a technician can run instead.
          # Graph changes carry path and permission; Exchange changes carry cmdlet and parameters.
          function Get-AccChange {
              param($Resource, $Target, [string]$AccessType)
              $kind = [string](Get-OfProp $Resource 'kind')
              $rid = [string](Get-OfProp $Resource 'id')
              $ident = [string](Get-OfProp $Resource 'mail'); if (-not $ident) { $ident = [string](Get-OfProp $Resource 'name') }
              $qi = Format-AccQuote $ident
              $tu = [string](Get-OfProp $Target 'upn'); $qu = Format-AccQuote $tu
              $tid = [string](Get-OfProp $Target 'id')
              $tn = [string](Get-OfProp $Target 'name'); $rn = [string](Get-OfProp $Resource 'name'); $label = $AccKinds[$kind]
              $c = [ordered]@{ method = 'exchange'; cmdlet = ''; parameters = [ordered]@{}; path = ''; permission = ''; description = ''; command = '' }
              switch ($AccessType) {
                  'fullAccess' {
                      $c.cmdlet = 'Add-MailboxPermission'; $c.parameters = [ordered]@{ Identity = $ident; User = $tu; AccessRights = @('FullAccess'); InheritanceType = 'All'; AutoMapping = $true }
                      $c.description = "Give $tn full access to the $label $rn, with AutoMapping on so it appears in Outlook"
                      $c.command = "Add-MailboxPermission -Identity $qi -User $qu -AccessRights FullAccess -InheritanceType All -AutoMapping `$true"
                  }
                  'sendAs' {
                      $c.cmdlet = 'Add-RecipientPermission'; $c.parameters = [ordered]@{ Identity = $ident; Trustee = $tu; AccessRights = @('SendAs') }
                      $c.description = "Let $tn send as the $label $rn"
                      $c.command = "Add-RecipientPermission -Identity $qi -Trustee $qu -AccessRights SendAs -Confirm:`$false"
                  }
                  'sendOnBehalf' {
                      $c.cmdlet = 'Set-Mailbox'; $c.parameters = [ordered]@{ Identity = $ident; GrantSendOnBehalfTo = @{ Add = @($tu) } }
                      $c.description = "Let $tn send on behalf of the $label $rn"
                      $c.command = "Set-Mailbox -Identity $qi -GrantSendOnBehalfTo @{Add=$qu}"
                  }
                  'member' {
                      if ($AccExchangeGroupKinds -contains $kind) {
                          $c.cmdlet = 'Add-DistributionGroupMember'; $c.parameters = [ordered]@{ Identity = $ident; Member = $tu; BypassSecurityGroupManagerCheck = $true }
                          $c.command = "Add-DistributionGroupMember -Identity $qi -Member $qu -BypassSecurityGroupManagerCheck"
                      }
                      else {
                          $c.method = 'graph'; $c.path = "/v1.0/groups/$rid/members/`$ref"; $c.permission = 'GroupMember.ReadWrite.All'
                          $c.command = "New-MgGroupMember -GroupId '$rid' -DirectoryObjectId '$tid'"
                      }
                      $c.description = "Add $tn to the $label $rn"
                  }
                  'owner' {
                      if ($AccExchangeGroupKinds -contains $kind) {
                          $c.cmdlet = 'Set-DistributionGroup'; $c.parameters = [ordered]@{ Identity = $ident; ManagedBy = @{ Add = @($tu) }; BypassSecurityGroupManagerCheck = $true }
                          $c.command = "Set-DistributionGroup -Identity $qi -ManagedBy @{Add=$qu} -BypassSecurityGroupManagerCheck"
                      }
                      else {
                          $c.method = 'graph'; $c.path = "/v1.0/groups/$rid/owners/`$ref"; $c.permission = 'GroupMember.ReadWrite.All (or Group.ReadWrite.All)'
                          $c.command = "New-MgGroupOwner -GroupId '$rid' -DirectoryObjectId '$tid'"
                      }
                      $c.description = "Make $tn an owner of the $label $rn"
                  }
              }
              return $c
          }

          # $true when the change would need Exchange Online to make or to check.
          function Test-AccNeedsExchange {
              param($Resource, [string]$AccessType)
              $kind = [string](Get-OfProp $Resource 'kind')
              if ($AccMailboxKinds -contains $kind) { return $true }
              if ($AccessType -eq 'sendAs') { return $true }
              return $false
          }

          # Does the target already have this access? Reads Graph for Graph groups, and Exchange Online for mailboxes,
          # send-as, and (when Exchange is connected) distribution list and mail-enabled security group changes.
          function Test-AccHasAccess {
              param($Resource, $Target, [string]$AccessType)
              $kind = [string](Get-OfProp $Resource 'kind')
              $rid = [string](Get-OfProp $Resource 'id')
              $ident = [string](Get-OfProp $Resource 'mail'); if (-not $ident) { $ident = [string](Get-OfProp $Resource 'name') }
              $tid = [string](Get-OfProp $Target 'id'); $tu = [string](Get-OfProp $Target 'upn')
              $exoGroup = ($AccExchangeGroupKinds -contains $kind) -and $OfExo.Connected
              switch ($AccessType) {
                  'member' {
                      if ($exoGroup) {
                          $rows = @(Invoke-OfExo 'Get-DistributionGroupMember' @{ Identity = $ident; ResultSize = 'Unlimited' })
                          return (Test-AccNamed $rows $Target)
                      }
                      $ids = @(Get-GraphAll -Path "/v1.0/groups/$rid/members?`$select=id&`$top=999" -Permission 'GroupMember.Read.All (or Group.Read.All)' | ForEach-Object { [string](Get-GraphProp $_ 'id') })
                      return ($ids -contains $tid)
                  }
                  'owner' {
                      if ($exoGroup) {
                          $g = @(Invoke-OfExo 'Get-DistributionGroup' @{ Identity = $ident })[0]
                          return (Test-AccNamed @(Get-OfProp $g 'ManagedBy') $Target)
                      }
                      $ids = @(Get-GraphAll -Path "/v1.0/groups/$rid/owners?`$select=id&`$top=999" -Permission 'Group.Read.All' | ForEach-Object { [string](Get-GraphProp $_ 'id') })
                      return ($ids -contains $tid)
                  }
                  'fullAccess' {
                      $rows = @()
                      try { $rows = @(Invoke-OfExo 'Get-MailboxPermission' @{ Identity = $ident; User = $tu }) } catch { if (-not (Test-OfNotFound $_.Exception.Message)) { throw } }
                      return [bool](@($rows | Where-Object { (Get-AccRights $_) -match '(?i)\bFullAccess\b' -and (Get-OfProp $_ 'Deny') -ne $true -and [string](Get-OfProp $_ 'Deny') -ne 'True' }).Count)
                  }
                  'sendAs' {
                      $rows = @()
                      try { $rows = @(Invoke-OfExo 'Get-RecipientPermission' @{ Identity = $ident; Trustee = $tu }) } catch { if (-not (Test-OfNotFound $_.Exception.Message)) { throw } }
                      return [bool](@($rows | Where-Object { (Get-AccRights $_) -match '(?i)\bSendAs\b' -and [string](Get-OfProp $_ 'AccessControlType') -ne 'Deny' }).Count)
                  }
                  'sendOnBehalf' {
                      $m = @(Invoke-OfExo 'Get-Mailbox' @{ Identity = $ident })[0]
                      return (Test-AccNamed @(Get-OfProp $m 'GrantSendOnBehalfTo') $Target)
                  }
              }
              return $false
          }
          # ---------- end src/common.ps1 ----------


          # ---------- this step ----------
          # Step 1: read the request and plan it. Read-only: this step changes nothing and writes nothing.
          # Finds the user and the mailbox, group or Team, refuses what must never be granted automatically
          # (role-assignable, privileged-looking, dynamic and on-premises synced groups), checks whether the user already
          # has the access, and works out who must approve. Its output feeds the Grant step.
          # Accepts a flat body, the CloudRadial {Ticket:{...}, Company:{...}} shape, or either one wrapped in {trigger:...}.

          $in = Get-NodeInput
          if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch { $in = $null } }
          foreach ($wrap in @('trigger', 'body')) { $w = Get-OfProp $in $wrap; if ($w -is [string]) { try { $w = $w | ConvertFrom-Json } catch { $w = $null } }; if ($null -ne $w -and -not ($w -is [string])) { $in = $w } }

          $warnings = New-Object System.Collections.ArrayList
          $actions = New-Object System.Collections.ArrayList
          $out = [ordered]@{
              status = 'ok'; message = ''; ticket_id = ''; psa = ''; confirm = $false; close_ticket = $true
              target = $null; resource = $null; access_type = ''; requester = ''; approved_by = ''
              already_has_access = $false; approvers = @(); approved = $false; approval = ''; needs_technician = $false
              change = $null; manual_command = ''; exchange_org = ''; exchange_mode = ''; exchange_unreachable = $false
              warnings = @(); actions = @()
          }
          function Stop-AccRead {
              param([string]$Status, [string]$Msg, [string]$Command = '')
              $out.status = $Status; $out.message = $Msg
              if ($Command) { $out.manual_command = $Command }
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          }

          # CloudRadial form answers arrive as Ticket.Questions [{Id, Value}]; flat bodies as plain fields.
          $answers = @{}
          $ticketObj = Get-OfProp $in 'Ticket'
          foreach ($q in @(Get-OfProp $ticketObj 'Questions')) { $qid = [string](Get-OfProp $q 'Id'); if ($qid) { $answers[$qid.ToLowerInvariant()] = Get-OfProp $q 'Value' } }
          $companyObj = Get-OfProp $in 'Company'
          # A value is missing when it is blank or still an unfilled placeholder (<x>, {{x}} or a bare @token).
          function Get-In {
              param([string[]]$Names)
              foreach ($n in $Names) {
                  $v = Get-OfProp $in $n
                  if ($null -eq $v -and $answers.ContainsKey($n.ToLowerInvariant())) { $v = $answers[$n.ToLowerInvariant()] }
                  if ($null -eq $v -and $n -eq 'CompanyTenantId') { $v = Get-OfProp $companyObj 'CompanyTenantId' }
                  if ($null -ne $v -and ($v -is [array] -or $v -is [System.Collections.IList])) { $v = (@($v | ForEach-Object { [string]$_ }) -join ',') }
                  if ($null -eq $v -or $v -is [System.Management.Automation.PSCustomObject] -or $v -is [System.Collections.IDictionary]) { continue }
                  $s = ([string]$v).Trim()
                  if (-not $s -or $s -match '^@[A-Za-z][A-Za-z0-9_]*$' -or $s -match '^\{\{.*\}\}$' -or $s -match '^<[^>]*>$') { continue }
                  return $s
              }
              return ''
          }
          function Get-InFlag { param([string[]]$Names, [bool]$Default) $s = Get-In $Names; if (-not $s) { return $Default }; return (Test-AccTrue $s) }

          $userSelect = 'id,userPrincipalName,displayName,mail,mailNickname,accountEnabled,userType'
          $groupSelect = 'id,displayName,mail,mailNickname,mailEnabled,securityEnabled,groupTypes,membershipRule,onPremisesSyncEnabled,isAssignableToRole,resourceProvisioningOptions'
          # A tenant user by UPN, mail or any proxy address (or by display name with -ByName). $null when there is none.
          function Find-AccUser {
              param([string]$Address, [switch]$ByName)
              if (-not $Address) { return $null }
              if (Test-AccEmail $Address) {
                  $u = Get-GraphUser -Id $Address -Select $userSelect
                  if ($null -ne $u) { return $u }
                  $a = Format-AccOData $Address
                  foreach ($f in @("mail eq '$a'", "proxyAddresses/any(x:x eq 'smtp:$a')")) {
                      $hit = @(Get-GraphAll -Path "/v1.0/users?`$filter=$f&`$select=$userSelect" -Permission 'User.Read.All' -MaxPages 1)
                      if ($hit.Count) { return $hit[0] }
                  }
                  return $null
              }
              if ($ByName) {
                  $hit = @(Get-GraphAll -Path "/v1.0/users?`$filter=displayName eq '$(Format-AccOData $Address)'&`$select=$userSelect" -Permission 'User.Read.All' -MaxPages 1)
                  if ($hit.Count -eq 1) { return $hit[0] }
              }
              return $null
          }
          function ConvertTo-AccPerson {
              param($u, [string]$Role = '')
              $m = [string](Get-GraphProp $u 'mail'); $p = [string](Get-GraphProp $u 'userPrincipalName')
              return [ordered]@{ id = [string](Get-GraphProp $u 'id'); upn = $p; mail = $(if ($m) { $m } else { $p }); name = [string](Get-GraphProp $u 'displayName'); alias = [string](Get-GraphProp $u 'mailNickname'); role = $Role; kind = '' }
          }
          # The user's manager in Microsoft 365, or $null when none is set.
          function Get-AccManager {
              param([string]$UserId)
              if (-not $UserId) { return $null }
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager?`$select=id,displayName,mail,userPrincipalName" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }
          # Privileged-looking group names. Each comma-separated word or phrase matches anywhere in the name, ignoring case;
          # spaces in a phrase also match hyphens, dots, underscores or nothing ("break glass" matches "Break-Glass").
          function Test-AccSensitive {
              param([string[]]$Names, [string[]]$Patterns)
              foreach ($p in $Patterns) {
                  $rx = '(?i)' + ((@($p.Trim() -split '\s+') | ForEach-Object { [regex]::Escape($_) }) -join '[\s._-]*')
                  foreach ($n in $Names) { if ($n -and $n -match $rx) { return $p.Trim() } }
              }
              return ''
          }

          try {
              if ($null -eq $in) { Stop-AccRead 'incomplete' 'No request was received. Send at least ticketId, targetUser and resource. Nothing was changed.'; return }

              # ---------- 1. the request ----------
              $out.ticket_id = Get-In @('ticketId', 'ticket_id', 'TicketId', 'ticketNumber')
              if (-not $out.ticket_id) { $tv = Get-OfProp $ticketObj 'TicketId'; if ($null -ne $tv) { $out.ticket_id = [string]$tv } }
              $out.psa = Get-In @('psa')
              $out.confirm = Get-InFlag @('confirm', 'approvedToWrite') $false
              $out.close_ticket = Get-InFlag @('closeTicket', 'close_ticket') $true
              $allowGuest = Get-InFlag @('allowGuest', 'allow_guest') $false
              $targetIn = Get-In @('targetUser', 'target_user', 'target', 'user', 'userPrincipalName', 'upn')
              $resIn = Get-In @('resource', 'mailbox', 'group', 'team', 'resource_email', 'resourceName')
              $atIn = Get-In @('accessType', 'access_type', 'access', 'permission')
              $out.requester = Get-In @('requester_email', 'requesterEmail', 'UserEmail', 'submittedByUpn')
              $managerIn = Get-In @('managerEmail', 'manager_email')
              $out.approved_by = Get-In @('approvedBy', 'approved_by')
              $tenantIn = Get-In @('company_tenant_id', 'companyTenantId', 'CompanyTenantId')

              if (-not $out.ticket_id) { Stop-AccRead 'incomplete' 'The request has no ticketId, so there is no ticket to note. Nothing was changed.'; return }
              if (-not $targetIn) { Stop-AccRead 'incomplete' 'The request has no targetUser (the person who should get access). Nothing was changed.'; return }
              if (-not (Test-AccEmail $targetIn)) { Stop-AccRead 'incomplete' "targetUser '$targetIn' isn't an email address or user principal name. Nothing was changed."; return }
              if (-not $resIn) { Stop-AccRead 'incomplete' 'The request has no resource (the mailbox, group or Team to get access to). Nothing was changed.'; return }
              $accessType = ''
              if ($atIn) {
                  $accessType = $(switch -Regex ($atIn.ToLowerInvariant() -replace '[\s_-]+', '') {
                          '^(fullaccess|full|readandmanage|fullmailboxaccess)$' { 'fullAccess' }
                          '^(sendas)$' { 'sendAs' }
                          '^(sendonbehalf|sendonbehalfof|onbehalf|onbehalfof)$' { 'sendOnBehalf' }
                          '^(member|membership|members|join)$' { 'member' }
                          '^(owner|owners|ownership)$' { 'owner' }
                          default { '' }
                      })
                  if (-not $accessType) { Stop-AccRead 'incomplete' "accessType '$atIn' isn't one this workflow grants. Use fullAccess, sendAs, sendOnBehalf, member or owner. Nothing was changed."; return }
              }
              foreach ($e in @(@($out.requester, $out.approved_by, $managerIn) | Where-Object { $_ })) {
                  if (-not (Test-AccEmail $e)) { Stop-AccRead 'incomplete' "'$e' isn't an email address. requester_email, managerEmail and approvedBy must be email addresses. Nothing was changed."; return }
              }

              # ---------- 2. the tenant ----------
              $graphConn = Connect-Graph
              if ($tenantIn -and (Test-AccGuid $tenantIn)) {
                  if (Test-AccGuid $graphConn.TenantId) {
                      if ($tenantIn.ToLowerInvariant() -ne ([string]$graphConn.TenantId).ToLowerInvariant()) { Stop-AccRead 'rejected' "This request is for Microsoft 365 tenant $tenantIn, but this runner signs in to tenant $($graphConn.TenantId). Nothing was changed."; return }
                  }
                  else { $null = $warnings.Add('The M365-TenantId secret is a domain name, so the request''s tenant id could not be compared with it.') }
              }

              # ---------- 3. the person who gets access ----------
              $tu = Find-AccUser $targetIn
              if ($null -eq $tu) { Stop-AccRead 'incomplete' "$targetIn isn't a user in this Microsoft 365 tenant. Nothing was changed."; return }
              $target = ConvertTo-AccPerson $tu
              $out.target = $target
              if ((Get-GraphProp $tu 'accountEnabled') -eq $false) { Stop-AccRead 'rejected' "$($target.name) ($($target.upn)) is blocked from signing in, so no access was given. Nothing was changed."; return }
              $utype = [string](Get-GraphProp $tu 'userType')
              if ($utype -eq 'Guest' -and -not $allowGuest) { Stop-AccRead 'rejected' "$($target.name) ($($target.upn)) is a guest, not a member of this organisation. A technician can run this again with allowGuest set to true if a guest should have this access. Nothing was changed."; return }
              if ($utype -eq 'Guest') { $null = $warnings.Add("$($target.name) is a guest; allowGuest was set, so the request was allowed.") }
              $null = $actions.Add("Found $($target.name) ($($target.upn)) in Microsoft 365")

              # ---------- 4. the mailbox, group or Team ----------
              $resource = $null
              $hits = New-Object System.Collections.ArrayList
              $filters = $(if (Test-AccEmail $resIn) { $a = Format-AccOData $resIn; @("mail eq '$a'", "proxyAddresses/any(x:x eq 'smtp:$a')") } else { @("displayName eq '$(Format-AccOData $resIn)'") })
              foreach ($f in $filters) {
                  foreach ($g in @(Get-GraphAll -Path "/v1.0/groups?`$filter=$f&`$select=$groupSelect" -Permission 'Group.Read.All' -MaxPages 1)) {
                      if (-not @($hits | Where-Object { (Get-GraphProp $_ 'id') -eq (Get-GraphProp $g 'id') }).Count) { $null = $hits.Add($g) }
                  }
                  if ($hits.Count) { break }
              }
              if ($hits.Count -gt 1) { Stop-AccRead 'incomplete' "More than one group is called '$resIn': $(@($hits | ForEach-Object { "$(Get-GraphProp $_ 'displayName') ($(if (Get-GraphProp $_ 'mail') { Get-GraphProp $_ 'mail' } else { Get-GraphProp $_ 'id' }))" }) -join ', '). Send the group's email address instead. Nothing was changed."; return }

              $mbxUser = $null
              if ($hits.Count -eq 1) {
                  $g = $hits[0]
                  $types = @(@(Get-GraphProp $g 'groupTypes') | ForEach-Object { [string]$_ })
                  $prov = @(@(Get-GraphProp $g 'resourceProvisioningOptions') | ForEach-Object { [string]$_ })
                  $mailOn = (Get-GraphProp $g 'mailEnabled') -eq $true; $secOn = (Get-GraphProp $g 'securityEnabled') -eq $true
                  $kind = $(if ($types -contains 'Unified') { $(if ($prov -contains 'Team') { 'team' } else { 'm365_group' }) } elseif ($mailOn -and $secOn) { 'mail_security_group' } elseif ($mailOn) { 'distribution_list' } else { 'security_group' })
                  $resource = [ordered]@{ kind = $kind; label = $AccKinds[$kind]; id = [string](Get-GraphProp $g 'id'); name = [string](Get-GraphProp $g 'displayName'); mail = [string](Get-GraphProp $g 'mail'); alias = [string](Get-GraphProp $g 'mailNickname'); mailbox_user_id = '' }
                  $out.resource = $resource
                  $null = $actions.Add("Found the $($resource.label) $($resource.name) in Microsoft 365")
                  $rname = "The $($resource.label) $($resource.name)"
                  # Never granted automatically: these need a person with the right role, or a change somewhere else.
                  if ((Get-GraphProp $g 'isAssignableToRole') -eq $true) { Stop-AccRead 'rejected' "$rname can be given Microsoft Entra admin roles, so membership of it is never granted automatically. A Privileged Role Administrator has to decide this one. Nothing was changed."; return }
                  $patSecret = Get-OfSecret 'Access-SensitiveGroupPatterns'
                  $patterns = @($(if ($patSecret) { $patSecret -split '[,;\r\n]+' } else { @('admin', 'global', 'privileged', 'break glass', 'domain admins') }) | Where-Object { $_.Trim() })
                  $hit = Test-AccSensitive @($resource.name, $resource.alias, (($resource.mail -split '@')[0])) $patterns
                  if ($hit) { Stop-AccRead 'rejected' "$rname looks like a privileged group (its name matches '$hit'), so access to it is never granted automatically. A technician has to decide this one. Nothing was changed."; return }
                  if ($types -contains 'DynamicMembership') { Stop-AccRead 'rejected' "$rname has dynamic membership, so people can't be added to it by hand. Its rule decides who is in it: $([string](Get-GraphProp $g 'membershipRule')). Change the user's attributes or the rule instead. Nothing was changed."; return }
                  if ((Get-GraphProp $g 'onPremisesSyncEnabled') -eq $true) {
                      $cmd = "Add-ADGroupMember -Identity $(Format-AccQuote $resource.name) -Members $(Format-AccQuote (($target.upn -split '@')[0]))"
                      Stop-AccRead 'rejected' "$rname is synced from on-premises Active Directory, so it can only be changed there. A technician can add $($target.name) in Active Directory and let Entra Connect sync. Nothing was changed." $cmd
                      return
                  }
              }
              else {
                  # Not a group: a mailbox. Exchange Online says which kind.
                  $mbxUser = Find-AccUser $resIn -ByName
                  $org = Get-OfSecret 'MicrosoftExchange-Organization'
                  if (-not $org -and ((Get-OfSecret 'MicrosoftExchange-CertificateThumbprint') -or (Get-OfSecret 'MicrosoftExchange-Certificate'))) {
                      try { $ini = @(Get-GraphAll -Path '/v1.0/domains?$select=id,isInitial' -Permission 'Domain.Read.All' | Where-Object { (Get-GraphProp $_ 'isInitial') -eq $true }); if ($ini.Count) { $org = [string](Get-GraphProp $ini[0] 'id') } } catch { }
                  }
                  $out.exchange_org = $org
                  if (-not (Connect-OfExchange -Organization $org)) {
                      $out.exchange_unreachable = $true
                      if ($null -eq $mbxUser) { Stop-AccRead 'incomplete' "No group called $resIn was found, and Exchange Online couldn't be reached to look for a mailbox: $($OfExo.Reason.TrimEnd('.')). Nothing was changed."; return }
                      $guess = ConvertTo-AccPerson $mbxUser
                      $at = $(if ($accessType) { $accessType } else { 'fullAccess' })
                      $tmp = [ordered]@{ kind = 'shared_mailbox'; label = 'mailbox'; id = $guess.id; name = $guess.name; mail = $guess.mail; alias = $guess.alias; mailbox_user_id = $guess.id }
                      $cmd = (Get-AccChange $tmp $target $at).command
                      Stop-AccRead 'incomplete' "Exchange Online couldn't be reached, so it can't be checked whether $($guess.mail) is a shared or a personal mailbox, or what access $($target.name) already has: $($OfExo.Reason.TrimEnd('.')). Nothing was changed. A technician can check the approval and run the command in the internal note." $cmd
                      return
                  }
                  $out.exchange_mode = $OfExo.Mode
                  $rec = $null
                  try { $rec = Get-OfRecipient $(if ($null -ne $mbxUser) { [string](Get-GraphProp $mbxUser 'userPrincipalName') } else { $resIn }) }
                  catch { if ($_.Exception.Message -match '(?i)matches multiple') { Stop-AccRead 'incomplete' "More than one mailbox matches '$resIn'. Send its email address instead. Nothing was changed."; return }; throw }
                  if ($null -eq $rec) { Stop-AccRead 'incomplete' "No mailbox, group or Team called $resIn was found in this Microsoft 365 tenant. Check the name or send its email address. Nothing was changed."; return }
                  $rtd = [string](Get-OfProp $rec 'RecipientTypeDetails')
                  $kind = $(switch ($rtd) { 'SharedMailbox' { 'shared_mailbox' } 'RoomMailbox' { 'room_mailbox' } 'EquipmentMailbox' { 'equipment_mailbox' } 'UserMailbox' { 'user_mailbox' } default { '' } })
                  $rmail = [string](Get-OfProp $rec 'PrimarySmtpAddress')
                  if (-not $kind) { Stop-AccRead 'incomplete' "$resIn is a $(if ($rtd) { $rtd } else { 'recipient' }) in Exchange Online, not a mailbox, group or Team this workflow can give access to. Nothing was changed."; return }
                  if ($null -eq $mbxUser -and $rmail) { $mbxUser = Find-AccUser $rmail }
                  $mp = $(if ($null -ne $mbxUser) { ConvertTo-AccPerson $mbxUser } else { $null })
                  $resource = [ordered]@{ kind = $kind; label = $AccKinds[$kind]; id = $(if ($mp) { $mp.id } else { [string](Get-OfProp $rec 'ExternalDirectoryObjectId') }); name = [string](Get-OfProp $rec 'DisplayName'); mail = $rmail; alias = [string](Get-OfProp $rec 'Alias'); mailbox_user_id = $(if ($mp) { $mp.id } else { [string](Get-OfProp $rec 'ExternalDirectoryObjectId') }) }
                  if (-not $resource.name) { $resource.name = $rmail }
                  $out.resource = $resource
                  $null = $actions.Add("Found the $($resource.label) $($resource.name) ($rmail) in Exchange Online")
                  if ($resource.mailbox_user_id -and $resource.mailbox_user_id -eq $target.id) { Stop-AccRead 'rejected' "$($target.name) already owns the mailbox $rmail; it is their own mailbox. Nothing was changed."; return }
              }

              # ---------- 5. which access ----------
              $allowed = @($AccAllowed[$resource.kind])
              if (-not $accessType) { $accessType = $allowed[0] }
              if ($allowed -notcontains $accessType) { Stop-AccRead 'incomplete' "$accessType doesn't apply to the $($resource.label) $($resource.name). For it, accessType can be: $($allowed -join ', '). Nothing was changed."; return }
              $out.access_type = $accessType
              $change = Get-AccChange $resource $target $accessType
              $out.change = $change
              $out.manual_command = $change.command

              # ---------- 6. does the user already have it? ----------
              if ((Test-AccNeedsExchange $resource $accessType) -and -not $OfExo.Connected) {
                  $org = Get-OfSecret 'MicrosoftExchange-Organization'; $out.exchange_org = $org
                  if (-not (Connect-OfExchange -Organization $org)) {
                      $out.exchange_unreachable = $true
                      Stop-AccRead 'incomplete' "Exchange Online couldn't be reached, so what access $($target.name) already has to the $($resource.label) $($resource.name) couldn't be checked: $($OfExo.Reason.TrimEnd('.')). Nothing was changed. A technician can check the approval and run the command in the internal note." $change.command
                      return
                  }
                  $out.exchange_mode = $OfExo.Mode
              }
              if (Test-AccHasAccess $resource $target $accessType) {
                  $out.already_has_access = $true
                  $out.message = "$($target.name) already has $($AccPhrase[$accessType]) the $($resource.label) $($resource.name). Nothing needs to change."
                  $out.warnings = @($warnings); $out.actions = @($actions)
                  Set-NodeOutput $out
                  return
              }
              $null = $actions.Add("Checked that $($target.name) doesn't have $($AccPhrase[$accessType]) it yet")

              # ---------- 7. who can approve ----------
              $approvers = New-Object System.Collections.ArrayList
              function Add-AccApprover { param($u, [string]$Role, [string]$Kind) if ($null -eq $u) { return }; $p = ConvertTo-AccPerson $u $Role; $p.kind = $Kind; if (-not $p.id -or @($approvers | Where-Object { $_.id -eq $p.id }).Count) { return }; $null = $approvers.Add($p) }
              $isUserMailbox = $resource.kind -eq 'user_mailbox'
              if ($isUserMailbox) {
                  # A person's own mailbox: only that person or their manager can approve, and a technician must run it.
                  if ($resource.mailbox_user_id) { Add-AccApprover (Get-GraphUser -Id $resource.mailbox_user_id -Select $userSelect) "the owner of the mailbox $($resource.mail)" owner }
                  Add-AccApprover (Get-AccManager $resource.mailbox_user_id) "the manager of $($resource.name), whose mailbox it is" manager
                  $out.needs_technician = @('fullAccess', 'sendAs') -contains $accessType
              }
              else {
                  Add-AccApprover (Get-AccManager $target.id) "$($target.name)'s manager" manager
                  if ($AccMailboxKinds -contains $resource.kind) {
                      # A shared, room or equipment mailbox has no owner in Exchange; the manager set on its account is its owner.
                      Add-AccApprover (Get-AccManager $resource.mailbox_user_id) "the owner of the $($resource.label) $($resource.name), set as the manager on its account" owner
                  }
                  else {
                      foreach ($o in @(Get-GraphAll -Path "/v1.0/groups/$($resource.id)/owners?`$select=$userSelect&`$top=999" -Permission 'Group.Read.All')) {
                          if ([string](Get-GraphProp $o '@odata.type') -match 'servicePrincipal') { continue }
                          Add-AccApprover $o "an owner of the $($resource.label) $($resource.name)" owner
                      }
                  }
              }
              foreach ($e in @((Get-OfSecret 'Access-Approvers') -split '[,;\s]+' | Where-Object { Test-AccEmail $_ })) { Add-AccApprover (Find-AccUser $e) 'listed in the Access-Approvers secret' listed }
              # The target can't approve their own access (only a group's existing owner could, and they would already have it).
              $approvers = @($approvers | Where-Object { $_.id -ne $target.id })
              $out.approvers = @($approvers)
              $null = $actions.Add("Found $($approvers.Count) $(if ($approvers.Count -eq 1) { 'person' } else { 'people' }) who can approve")

              # An email matches an approver by address, or by the account it belongs to (an alias or proxy address).
              $who = @{}
              function Find-AccApprover {
                  param([string]$Email)
                  if (-not $Email) { return $null }
                  $k = $Email.ToLowerInvariant()
                  foreach ($a in $approvers) { if (@($a.mail, $a.upn) | Where-Object { $_ -and $_.ToLowerInvariant() -eq $k }) { return $a } }
                  if (-not $who.ContainsKey($k)) { $u = Find-AccUser $Email; $who[$k] = $(if ($null -ne $u) { [string](Get-GraphProp $u 'id') } else { '' }) }
                  if ($who[$k]) { foreach ($a in $approvers) { if ($a.id -eq $who[$k]) { return $a } } }
                  return $null
              }
              $ok = Find-AccApprover $out.approved_by
              if ($null -ne $ok) { $out.approved = $true; $out.approval = "Approved by $($ok.name) ($($ok.mail)), $($ok.role)." }
              elseif ($out.approved_by) { $null = $warnings.Add("approvedBy $($out.approved_by) isn't $(if ($isUserMailbox) { "$($resource.name) or their manager" } else { "$($target.name)'s manager or an owner of the $($resource.label)" }), so it doesn't count as approval.") }
              if (-not $out.approved -and $out.requester -and -not $out.needs_technician) {
                  $ok = Find-AccApprover $out.requester
                  if ($null -ne $ok) { $out.approved = $true; $out.approval = "Requested by $($ok.name) ($($ok.mail)), who is $($ok.role), so the request is its own approval." }
              }
              if ($managerIn) {
                  $mgr = @($approvers | Where-Object { $_.kind -eq 'manager' })
                  if (-not @($mgr | Where-Object { $_.mail -ieq $managerIn -or $_.upn -ieq $managerIn }).Count) {
                      $null = $warnings.Add("The request names $managerIn as the manager, but Microsoft 365 $(if ($mgr.Count) { "has $(@($mgr | ForEach-Object { $_.mail }) -join ', ')" } else { 'has no manager set' }). Only Microsoft 365 counts for approval.")
                  }
              }
              if (-not $out.approved -and -not $approvers.Count) { $null = $warnings.Add("Nobody can approve this yet: $(if ($isUserMailbox) { "$($resource.name) has no account the workflow can read" } else { "$($target.name) has no manager set in Microsoft 365 and the $($resource.label) has no owner" }). Set one (or add the Access-Approvers secret) and run it again.") }

              $out.message = "Planned: $($change.description)."
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          }
          catch {
              Stop-AccRead 'error' "Couldn't check the access request: $($_.Exception.Message) Nothing was changed."
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {
            "ticketId": "12345",
            "targetUser": "alex.kim@contoso.com",
            "resource": "sales@contoso.com",
            "accessType": "fullAccess",
            "requester_email": "alex.kim@contoso.com",
            "managerEmail": "",
            "approvedBy": "",
            "confirm": "false",
            "closeTicket": "true",
            "company_tenant_id": "",
            "psa": ""
          }
    - id: node-grant
      name: Give the access and read it back
      type: powershell-script
      position:
        x: 580
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  Mailbox / Group Access Request - Give the access and read it back
          #  Changes one thing, only when confirm is true and the request is approved: a Graph group membership or
          #  ownership, or an Exchange Online mailbox permission or distribution list change. Writes nothing to the ticket.
          #  Secrets: M365-*, MicrosoftExchange-*.
          #  Generated from mailbox-group-access/src. Edit the source, then run build.js.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Signs in with the app registration's client credentials from the runner Key Vault.
          # Each helper names the Graph application permission it needs; when Graph answers 403,
          # the error says which permission to grant (with admin consent).
          # All state lives in the $GraphState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $GraphState = @{
              Base           = 'https://graph.microsoft.com'
              Headers        = $null
              Creds          = $null
              TenantId       = ''
              ExpiresAt      = [datetime]::MinValue
              MaxAttempts    = 5
              MaxWaitSeconds = 120
              LastStatus     = 0
          }

          # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
          # The first secret that has a value, from a list of names.
          function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
          function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-GraphRetryAfter {
              param($Err, [int]$Attempt)
              $s = 0
              try {
                  $ra = $Err.Exception.Response.Headers.RetryAfter
                  if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                  elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
              } catch { }
              if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
              return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
          }
          # Graph's own error message when there is one, otherwise the exception text.
          function Get-GraphErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
              return [string]$Err.Exception.Message
          }
          function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

          function Update-GraphToken {
              $c = $GraphState.Creds
              if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
              $r = $null
              try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
              catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
              $tok = Get-GraphProp $r 'access_token'
              if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
              $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
              $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
              $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
          }

          # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
          # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
          # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
          # Returns @{ TenantId }.
          function Connect-Graph {
              param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
              $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
              $GraphState.TenantId = $TenantId.Trim()
              Update-GraphToken
              return @{ TenantId = $GraphState.TenantId }
          }

          # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
          # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
          # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
          # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
          function Invoke-Graph {
              param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
              if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
              $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
              $short = $uri.Replace($GraphState.Base, '')
              $reauth = $false
              for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                  if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                  $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                  $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                  try {
                      $r = Invoke-RestMethod @p
                      $GraphState.LastStatus = 200
                      return $r
                  }
                  catch {
                      $code = Get-GraphHttpStatus $_
                      $GraphState.LastStatus = $code
                      if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                      if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                      $why = Get-GraphErrorText $_
                      if ($code -eq 403) {
                          $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                          throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                      }
                      throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                  }
              }
          }

          # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
          function Get-GraphAll {
              param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList
              $next = $Path; $n = 0
              while ($next -and $n -lt $MaxPages) {
                  $n++
                  $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                  foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                  $next = [string](Get-GraphProp $r '@odata.nextLink')
              }
              return @($rows)
          }

          # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
          function Get-GraphUser {
              param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }

          # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
          # Mail-enabled security groups and distribution lists can't be changed through Graph.
          function Add-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
              catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
          }

          # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
          function Remove-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
              catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
          }

          # Sets the user's manager. Needs User.ReadWrite.All.
          function Set-GraphManager {
              param([string]$UserId, [string]$ManagerId)
              $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
