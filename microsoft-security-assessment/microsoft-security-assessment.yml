automationsWorkflow: 1
name: Microsoft Security Assessment
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 100
      properties:
        webhookEnabled: false
    - id: review-m365-security
      name: Review Microsoft 365 security
      type: powershell-script
      position:
        x: 320
        'y': 100
      properties:
        script: |
          # === NODE: Review Microsoft 365 security ===
          # Reads the run input, resolves the CloudRadial company, reads the tenant's security settings
          # from Microsoft Graph and turns each check into one assessment question (import-file columns,
          # support KB 360052746791). No AI: every answer comes from a fixed rule.
          #   Run input (JSON):
          #     companyId        - CloudRadial companyId (or companyName)
          #     companyName      - CloudRadial company name, exact or a unique partial match
          #     tenantId         - Entra tenant to review (default: the M365-TenantID secret)
          #     assessmentTitle  - the assessment's name, default "Microsoft 365 Security Assessment". Each run
          #                        is titled "<name> - M/d/yy", the portal's own run naming.
          #     runTitle         - overrides the run's title (for example a second run on the same day)
          #     mode             - apply (default) creates the assessment; plan only previews the questions
          #     assessmentType   - omit to create or refresh the type 20 assessment and then add today's type 30
          #                        run, like the portal's own pairs. Send 20 to only refresh the assessment, or 30 to
          #                        only add a run of the existing one. (10 = template, 20 = assessment, 30 = run.)
          #   Secrets (runner Key Vault): M365-ClientID, M365-ClientSecret, M365-TenantID (optional when
          #   tenantId is sent), CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          $ErrorActionPreference = 'Stop'
          function Get-Prop { param($o, $n, $d = $null) if ($null -eq $o) { return $d }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $d }; $p = $o.PSObject.Properties[$n]; if ($p -and $null -ne $p.Value) { return $p.Value }; return $d }
          function Stop-Run { param([string]$m) Set-NodeOutput @{ status = 'error'; message = $m }; throw $m }

          # ---- run input ----
          $in = $null; try { $in = Get-NodeInput } catch { }
          $t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }
          if ($in -is [string]) { $in = $(if ($in.Trim().StartsWith('{')) { $in | ConvertFrom-Json } else { $null }) }
          $companyId = 0; [int]::TryParse([string](Get-Prop $in 'companyId' ''), [ref]$companyId) | Out-Null
          $companyName = ([string](Get-Prop $in 'companyName' '')).Trim()
          $tenantId = ([string](Get-Prop $in 'tenantId' '')).Trim()
          $runDate = (Get-Date).ToUniversalTime()
          $title = ([string](Get-Prop $in 'assessmentTitle' '')).Trim()
          if (-not $title) { $title = 'Microsoft 365 Security Assessment' }
          $runTitle = ([string](Get-Prop $in 'runTitle' '')).Trim()
          if (-not $runTitle) { $runTitle = $title + ' - ' + $runDate.ToString('M/d/yy', [System.Globalization.CultureInfo]::InvariantCulture) }
          $mode = ([string](Get-Prop $in 'mode' '')).Trim().ToLowerInvariant(); if ($mode -ne 'plan') { $mode = 'apply' }
          $uploads = 'both'; $t = ([string](Get-Prop $in 'assessmentType' '')).Trim(); if ($t -in @('20', '30')) { $uploads = $t }
          if ($companyId -le 0 -and -not $companyName) { Stop-Run 'Send companyId or companyName in the run input, for example {"companyName":"Contoso","mode":"plan"}.' }

          # ---- secrets ----
          function Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }
          $s = [ordered]@{}
          foreach ($n in @('M365-ClientID', 'M365-ClientSecret', 'M365-TenantID', 'CloudRadial-BaseUrl', 'CloudRadial-PublicKey', 'CloudRadial-PrivateKey')) { $s[$n] = Get-Secret $n }
          if (-not $tenantId) { $tenantId = [string]$s['M365-TenantID'] }
          $missing = @($s.Keys | Where-Object { [string]::IsNullOrWhiteSpace([string]$s[$_]) -and -not ($_ -eq 'M365-TenantID' -and $tenantId) })
          if ($missing.Count) { Stop-Run "Please add these secrets to your runner Key Vault and run again: $($missing -join ', ')" }

          # ---- CloudRadial company ----
          $crBase = ([string]$s['CloudRadial-BaseUrl']).TrimEnd('/')
          $crHeaders = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($s['CloudRadial-PublicKey']):$($s['CloudRadial-PrivateKey'])")); Accept = 'application/json' }
          function Get-CrRows { param([string]$Path) @(Get-Prop (Invoke-RestMethod -Method Get -Uri "$crBase$Path" -Headers $crHeaders) 'value' @()) }
          try {
              if ($companyId -gt 0) { $hits = @(Get-CrRows "/v2/odata/company?`$filter=companyId eq $companyId") }
              else {
                  $q = $companyName.Replace("'", "''")
                  $hits = @(Get-CrRows ("/v2/odata/company?`$filter=" + [uri]::EscapeDataString("name eq '$q'")))
                  if ($hits.Count -eq 0) { $hits = @(Get-CrRows ("/v2/odata/company?`$filter=" + [uri]::EscapeDataString("contains(tolower(name),'$($q.ToLowerInvariant())')"))) }
              }
          }
          catch { Stop-Run "Couldn't look up the CloudRadial company. Check CloudRadial-BaseUrl and the API keys. $($_.Exception.Message)" }
          if ($hits.Count -eq 0) { Stop-Run "No CloudRadial company matches $(if ($companyId -gt 0) { "companyId $companyId" } else { "'$companyName'" })." }
          if ($hits.Count -gt 1) { Stop-Run "'$companyName' matches $($hits.Count) companies: $((@($hits | Select-Object -First 10 | ForEach-Object { "$(Get-Prop $_ 'name') ($(Get-Prop $_ 'companyId'))" })) -join '; '). Send companyId instead." }
          $companyId = [int](Get-Prop $hits[0] 'companyId'); $companyName = [string](Get-Prop $hits[0] 'name' '')

          # ---- Microsoft Graph ----
          try {
              $tok = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{
                  client_id = $s['M365-ClientID']; client_secret = $s['M365-ClientSecret']; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' }
          }
          catch { Stop-Run "Couldn't get a Microsoft Graph token for tenant $tenantId. Check M365-ClientID, M365-ClientSecret and that the app is consented in that tenant. $($_.Exception.Message)" }
          $gHeaders = @{ Authorization = "Bearer $(Get-Prop $tok 'access_token')"; Accept = 'application/json'; ConsistencyLevel = 'eventual' }

          function Invoke-Graph {
              # GET with 429/5xx retry. -All follows @odata.nextLink and returns the value rows.
              param([string]$Uri, [switch]$All)
              $rows = New-Object System.Collections.ArrayList
              $next = $Uri
              while ($next) {
                  $attempt = 0
                  while ($true) {
                      try { $r = Invoke-RestMethod -Method Get -Uri $next -Headers $gHeaders; break }
                      catch {
                          $attempt++
                          $code = 0; $resp = Get-Prop $_.Exception 'Response'; if ($resp) { try { $code = [int]$resp.StatusCode } catch { } }
                          if (($code -eq 429 -or $code -ge 500) -and $attempt -lt 5) { Start-Sleep -Seconds ([math]::Min(30, [math]::Pow(2, $attempt))); continue }
                          throw
                      }
                  }
                  if (-not $All) { return $r }
                  foreach ($v in @(Get-Prop $r 'value' @())) { $null = $rows.Add($v) }
                  $next = [string](Get-Prop $r '@odata.nextLink' '')
              }
              return , $rows.ToArray()
          }
          $G = 'https://graph.microsoft.com/v1.0'
          $unavailable = [ordered]@{}   # area -> reason (partner notes only)
          function Read-Area { param([string]$Area, [scriptblock]$Call)
              try { return (& $Call) }
              catch {
                  $msg = $_.Exception.Message
                  if ($_.ErrorDetails -and $_.ErrorDetails.Message) { try { $msg = [string](Get-Prop (Get-Prop ($_.ErrorDetails.Message | ConvertFrom-Json) 'error') 'message' $msg) } catch { } }
                  $unavailable[$Area] = $msg; Write-Information "Graph: couldn't read $Area. $msg"; return $null
              }
          }

          $org = Read-Area 'organization' { @(Get-Prop (Invoke-Graph "$G/organization?`$select=displayName") 'value' @()) | Select-Object -First 1 }
          $tenantName = [string](Get-Prop $org 'displayName' $tenantId)
          $secDefaults = Read-Area 'securityDefaults' { Invoke-Graph "$G/policies/identitySecurityDefaultsEnforcementPolicy" }
          $caPolicies = Read-Area 'conditionalAccess' { Invoke-Graph "$G/identity/conditionalAccess/policies" -All }
          $regRows = Read-Area 'mfaRegistration' { Invoke-Graph "$G/reports/authenticationMethods/userRegistrationDetails?`$top=999" -All }
          $gaMembers = Read-Area 'globalAdmins' { Invoke-Graph "$G/directoryRoles(roleTemplateId='62e90394-69f5-4237-9190-012177145e10')/members?`$select=id,displayName,userPrincipalName" -All }
          $riskyUsers = Read-Area 'riskyUsers' { Invoke-Graph "$G/identityProtection/riskyUsers?`$top=500" -All }
          $since = $runDate.AddDays(-30).ToString('yyyy-MM-ddTHH:mm:ssZ')
          $detections = Read-Area 'riskDetections' { Invoke-Graph "$G/identityProtection/riskDetections?`$filter=detectedDateTime ge $since&`$top=500" -All }
          # Without Entra ID P2, riskDetections can come back empty instead of failing, so trust it only
          # when riskyUsers (same licence) could be read.
          $noP2 = $unavailable.Contains('riskyUsers') -and ([string]$unavailable['riskyUsers']) -match 'licen[cs]'
          if ($noP2 -and -not $unavailable.Contains('riskDetections')) { $unavailable['riskDetections'] = [string]$unavailable['riskyUsers'] }
          $score = Read-Area 'secureScore' { @(Get-Prop (Invoke-Graph "$G/security/secureScores?`$top=1") 'value' @()) | Select-Object -First 1 }

          # ---- facts ----
          function Test-Has { param($list, [string]$v) @(@($list) | Where-Object { [string]$_ -eq $v }).Count -gt 0 }
          function Get-Pct { param([int]$n, [int]$d) if ($d -le 0) { return 0 }; [math]::Round(100.0 * $n / $d, 1) }
          $sdOn = $null; if ($null -ne $secDefaults) { $sdOn = [bool](Get-Prop $secDefaults 'isEnabled' $false) }
          $ca = @(@($caPolicies) | Where-Object { $null -ne $_ } | ForEach-Object {
                  $c = Get-Prop $_ 'conditions'; $u = Get-Prop $c 'users'; $g = Get-Prop $_ 'grantControls'
                  [pscustomobject]@{
                      name = [string](Get-Prop $_ 'displayName' ''); state = [string](Get-Prop $_ 'state' '')
                      allUsers = Test-Has (Get-Prop $u 'includeUsers' @()) 'All'
                      roles = @(Get-Prop $u 'includeRoles' @()).Count
                      allApps = Test-Has (Get-Prop (Get-Prop $c 'applications') 'includeApplications' @()) 'All'
                      mfa = (Test-Has (Get-Prop $g 'builtInControls' @()) 'mfa') -or ($null -ne (Get-Prop $g 'authenticationStrength'))
                      block = Test-Has (Get-Prop $g 'builtInControls' @()) 'block'
                      legacy = (Test-Has (Get-Prop $c 'clientAppTypes' @()) 'exchangeActiveSync') -or (Test-Has (Get-Prop $c 'clientAppTypes' @()) 'other')
                      risk = (@(Get-Prop $c 'userRiskLevels' @()).Count + @(Get-Prop $c 'signInRiskLevels' @()).Count) -gt 0
                  } })
          function Join-Names { param($list) (@(@($list) | ForEach-Object { $_.name }) -join ', ') }
          function Find-Ca { param([scriptblock]$Where, [string]$State = 'enabled') , @($ca | Where-Object { $_.state -eq $State } | Where-Object $Where) }
          $caNote = if ($unavailable.Contains('conditionalAccess')) { '' } else { "$(@($ca | Where-Object { $_.state -eq 'enabled' }).Count) of $($ca.Count) Conditional Access policies are on." }

          $members = @(@($regRows) | Where-Object { $null -ne $_ -and ([string](Get-Prop $_ 'userType' 'member')) -eq 'member' })
          $mfaReg = @($members | Where-Object { (Get-Prop $_ 'isMfaRegistered' $false) -eq $true }).Count
          $ssprReg = @($members | Where-Object { (Get-Prop $_ 'isSsprRegistered' $false) -eq $true }).Count
          $admins = @($members | Where-Object { (Get-Prop $_ 'isAdmin' $false) -eq $true })
          $adminMfa = @($admins | Where-Object { (Get-Prop $_ 'isMfaRegistered' $false) -eq $true }).Count
          $gaUsers = @(@($gaMembers) | Where-Object { $null -ne $_ -and ([string](Get-Prop $_ '@odata.type' '#microsoft.graph.user')) -eq '#microsoft.graph.user' })
          $atRisk = @(@($riskyUsers) | Where-Object { $null -ne $_ -and (Test-Has @('atRisk', 'confirmedCompromised') ([string](Get-Prop $_ 'riskState' ''))) })
          $highDet = @(@($detections) | Where-Object { $null -ne $_ -and ([string](Get-Prop $_ 'riskLevel' '')) -eq 'high' })
          $ssCur = [double](Get-Prop $score 'currentScore' 0); $ssMax = [double](Get-Prop $score 'maxScore' 0); $ssPct = $(if ($ssMax -gt 0) { [math]::Round(100 * $ssCur / $ssMax, 1) } else { 0 })

          # ---- questions ----
          # Answer: 2 Compliant, 1 Partially Compliant, 0 N/A, -1 Missing (couldn't check), -2 Not compliant.
          $questions = New-Object System.Collections.ArrayList
          $PermHint = @{
              securityDefaults = 'Policy.Read.All'; conditionalAccess = 'Policy.Read.All'; mfaRegistration = 'AuditLog.Read.All (and Entra ID P1)'
              globalAdmins = 'RoleManagement.Read.Directory or Directory.Read.All'; riskyUsers = 'IdentityRiskyUser.Read.All (and Entra ID P2)'
              riskDetections = 'IdentityRiskEvent.Read.All (and Entra ID P2)'; secureScore = 'SecurityEvents.Read.All'
          }
          function Get-QuestionKey {
              # The import file's per-question Update Key, which CloudRadial uses to match a question on re-upload.
              # It is derived from the check's permanent id, so it never changes: keep a check's -Id when you
              # reword or move it, and give a new check a new id.
              param([string]$Id)
              $b = [System.Security.Cryptography.MD5]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes("cloudradial/microsoft-security-assessment/$Id"))
              $b[7] = ($b[7] -band 0x0f) -bor 0x30; $b[8] = ($b[8] -band 0x3f) -bor 0x80
              return ([guid]::new([byte[]]$b)).ToString()
          }
          function Add-Q {
              param([string]$Category, [int]$Order, [string]$Question, [string]$Explanation, [string]$Evaluation, [int]$Answer, [string]$Notes,
                  [string]$Summary, [string]$Remediation, [string]$Reference, [int]$ControlType = 10, [int]$Likelihood = 3, [int]$Risk = 4, [int]$Impact = 20, [string[]]$Areas = @(), [Parameter(Mandatory)][string]$Id)
              $gaps = @($Areas | Where-Object { $unavailable.Contains($_) })
              $partner = ''
              if ($gaps.Count) {
                  $Answer = -1
                  $Notes = "This couldn't be checked automatically. An administrator should review it in the Microsoft admin centers."
                  $partner = (@($gaps | ForEach-Object { if (([string]$unavailable[$_]) -match 'licen[cs]') { "Graph couldn't read $_ because the tenant isn't licensed for it ($($unavailable[$_])). It needs Entra ID P2." } else { "Graph couldn't read $_ ($($unavailable[$_])). The app needs $($PermHint[$_])." } }) -join ' ')
              }
              $null = $questions.Add([ordered]@{
                      category = $Category; order = $Order; question = $Question; explanation = $Explanation; evaluation = $Evaluation
                      answer = $Answer; notes = $Notes; remediationSummary = $(if ($Answer -ge 2) { '' } else { $Summary }); remediation = $(if ($Answer -ge 2) { '' } else { $Remediation })
                      reference = $Reference; controlType = $ControlType; likelihood = $Likelihood; risk = $Risk; riskImpact = $Impact; partnerNotes = $partner
                      id = $Id; updateKey = Get-QuestionKey $Id
                  })
          }
          $C1 = '1. Identity and MFA'; $C2 = '2. Privileged access'; $C3 = '3. Identity protection'; $C4 = '4. Security posture'

          # 1. MFA enforced for everyone
          $mfaAll = Find-Ca { $_.allUsers -and $_.allApps -and $_.mfa }
          $mfaSome = Find-Ca { $_.mfa }
          $mfaReport = Find-Ca { $_.mfa } -State 'enabledForReportingButNotEnforced'
          $a = if ($sdOn -or $mfaAll.Count) { 2 } elseif ($mfaSome.Count -or $mfaReport.Count) { 1 } else { -2 }
          $n = if ($sdOn) { 'Security defaults are on, so every user must use MFA.' } elseif ($mfaAll.Count) { "MFA is required for all users by: $(Join-Names $mfaAll). $caNote" } elseif ($mfaSome.Count) { "MFA is required only for some users or apps by: $(Join-Names $mfaSome). $caNote" } elseif ($mfaReport.Count) { "MFA policies exist but are in report-only mode: $(Join-Names $mfaReport). $caNote" } else { "Security defaults are off and no Conditional Access policy requires MFA. $caNote" }
          Add-Q $C1 10 'Is multi-factor authentication (MFA) required for all users?' 'Most account takeovers start with a stolen password. MFA stops most of them.' 'Security defaults are on, or an enabled Conditional Access policy requires MFA for All users and All cloud apps.' $a $n.Trim() 'Require MFA for all users.' 'Turn on security defaults, or create a Conditional Access policy that requires MFA for All users and All cloud apps. Exclude only the emergency (break-glass) accounts.' 'https://learn.microsoft.com/entra/identity/conditional-access/policy-all-users-mfa-strength' -Likelihood 4 -Risk 5 -Impact 25 -Areas @('securityDefaults', 'conditionalAccess') -Id 'mfa-all-users'

          # 2. Users registered for MFA
          $p = Get-Pct $mfaReg $members.Count
          $a = if ($members.Count -eq 0) { -1 } elseif ($p -ge 95) { 2 } elseif ($p -ge 80) { 1 } else { -2 }
          Add-Q $C1 20 'Have users registered an MFA method?' "Users who haven't registered can't complete MFA, and an attacker with their password could register first." 'At least 95% of member accounts are MFA registered (80% or more is partial).' $a "$mfaReg of $($members.Count) member accounts ($p%) have registered an MFA method." 'Get the remaining users to register for MFA.' 'Turn on the registration campaign (Entra ID > Authentication methods > Registration campaign) and follow up with the users who are still not registered.' 'https://learn.microsoft.com/entra/identity/authentication/how-to-mfa-registration-campaign' -Likelihood 3 -Risk 4 -Impact 20 -Areas @('mfaRegistration') -Id 'mfa-registration'

          # 3. SSPR registration
          $p = Get-Pct $ssprReg $members.Count
          $a = if ($members.Count -eq 0) { -1 } elseif ($p -ge 80) { 2 } elseif ($p -ge 50) { 1 } else { -2 }
          Add-Q $C1 30 'Have users registered for self-service password reset?' 'Self-service password reset lets users recover their own accounts safely, which cuts help-desk calls and risky manual resets.' 'At least 80% of member accounts are registered for self-service password reset (50% or more is partial).' $a "$ssprReg of $($members.Count) member accounts ($p%) are registered for self-service password reset." 'Turn on and promote self-service password reset.' 'Turn on self-service password reset for all users and use combined registration so users set up MFA and password reset together.' 'https://learn.microsoft.com/entra/identity/authentication/tutorial-enable-sspr' -ControlType 20 -Likelihood 2 -Risk 2 -Impact 10 -Areas @('mfaRegistration') -Id 'sspr-registration'

          # 4. Legacy authentication blocked
          $legAll = Find-Ca { $_.legacy -and $_.block -and $_.allUsers }
          $legSome = @((Find-Ca { $_.legacy -and $_.block }) + (Find-Ca { $_.legacy -and $_.block } -State 'enabledForReportingButNotEnforced'))
          $a = if ($sdOn -or $legAll.Count) { 2 } elseif ($legSome.Count) { 1 } else { -2 }
          $n = if ($sdOn) { 'Security defaults are on, which blocks legacy authentication.' } elseif ($legAll.Count) { "Legacy authentication is blocked for all users by: $(Join-Names $legAll)." } elseif ($legSome.Count) { "Legacy authentication is blocked only partly or in report-only mode: $(Join-Names $legSome)." } else { 'No policy blocks legacy authentication.' }
          Add-Q $C1 40 'Is legacy authentication blocked?' "Older sign-in methods like IMAP, POP and basic SMTP can't do MFA, so attackers use them to get around it." 'Security defaults are on, or an enabled Conditional Access policy blocks Exchange ActiveSync and other clients for All users.' $a $n 'Block legacy authentication.' 'Create a Conditional Access policy that targets the Exchange ActiveSync and Other clients client apps for All users and blocks access.' 'https://learn.microsoft.com/entra/identity/conditional-access/policy-block-legacy-authentication' -Likelihood 4 -Risk 4 -Impact 20 -Areas @('securityDefaults', 'conditionalAccess') -Id 'legacy-auth-blocked'

          # 5. Admins registered for MFA
          $p = Get-Pct $adminMfa $admins.Count
          $a = if ($admins.Count -eq 0) { -1 } elseif ($adminMfa -eq $admins.Count) { 2 } elseif ($p -ge 80) { 1 } else { -2 }
          $n = if ($admins.Count -eq 0) { 'No admin accounts were found in the registration report.' } else { "$adminMfa of $($admins.Count) admin accounts ($p%) have registered an MFA method." }
          $unreg = @($admins | Where-Object { (Get-Prop $_ 'isMfaRegistered' $false) -ne $true } | Select-Object -First 10 | ForEach-Object { [string](Get-Prop $_ 'userPrincipalName' '') })
          if ($unreg.Count) { $n += " Not registered: $($unreg -join ', ')." }
          Add-Q $C2 10 'Have all admin accounts registered an MFA method?' 'Admin accounts can change everything in the tenant, so each one must be protected by MFA.' 'Every account that holds an admin role is MFA registered (80% or more is partial).' $a $n 'Register MFA on every admin account.' 'Have every admin register a phishing-resistant method (FIDO2 key, Windows Hello or passkey). Then require it with an authentication-strength Conditional Access policy.' 'https://learn.microsoft.com/entra/identity/conditional-access/policy-admin-phish-resistant-mfa' -Likelihood 3 -Risk 5 -Impact 25 -Areas @('mfaRegistration') -Id 'admin-mfa-registration'

          # 6. MFA required for admin roles
          $admPol = Find-Ca { $_.mfa -and ($_.roles -gt 0 -or ($_.allUsers -and $_.allApps)) }
          $admRep = Find-Ca { $_.mfa -and $_.roles -gt 0 } -State 'enabledForReportingButNotEnforced'
          $a = if ($sdOn -or $admPol.Count) { 2 } elseif ($admRep.Count) { 1 } else { -2 }
          $n = if ($sdOn) { 'Security defaults are on, so admins must use MFA.' } elseif ($admPol.Count) { "Admins must use MFA because of: $(Join-Names $admPol)." } elseif ($admRep.Count) { "An admin MFA policy exists but is report-only: $(Join-Names $admRep)." } else { 'No policy requires MFA for admin roles.' }
          Add-Q $C2 20 'Does a policy require MFA for admin roles?' "Registering MFA isn't enough. A policy has to require it every time an admin signs in." 'Security defaults are on, or an enabled Conditional Access policy requires MFA for directory roles or for All users.' $a $n 'Require MFA for admin roles.' 'Create a Conditional Access policy that targets the admin directory roles and requires MFA, preferably phishing-resistant authentication strength.' 'https://learn.microsoft.com/entra/identity/conditional-access/policy-old-require-mfa-admin' -Likelihood 3 -Risk 5 -Impact 25 -Areas @('securityDefaults', 'conditionalAccess') -Id 'admin-mfa-policy'

          # 7. Global Administrator count
          $gc = $gaUsers.Count
          $a = if ($gc -ge 2 -and $gc -le 4) { 2 } elseif ($gc -eq 1 -or ($gc -ge 5 -and $gc -le 6)) { 1 } else { -2 }
          $names = @($gaUsers | Select-Object -First 10 | ForEach-Object { [string](Get-Prop $_ 'userPrincipalName' (Get-Prop $_ 'displayName' '')) })
          Add-Q $C2 30 'Are there between 2 and 4 Global Administrators?' 'Too many Global Administrators widens the attack surface. Only one risks a lockout.' 'The Global Administrator role has 2 to 4 user members (1, 5 or 6 is partial).' $a "The Global Administrator role has $gc user member(s)$(if ($names.Count) { ': ' + ($names -join ', ') })$(if ($gc -gt $names.Count) { " and $($gc - $names.Count) more" })." 'Keep 2 to 4 Global Administrators.' 'Move day-to-day admins to least-privilege roles (for example User Administrator or Exchange Administrator). Keep 2 to 4 Global Administrators, including one emergency access account.' 'https://learn.microsoft.com/entra/identity/role-based-access-control/best-practices' -ControlType 10 -Likelihood 3 -Risk 4 -Impact 20 -Areas @('globalAdmins') -Id 'global-admin-count'

          # 8. Risky users
          $a = if ($atRisk.Count -eq 0) { 2 } else { -2 }
          $n = if ($atRisk.Count -eq 0) { 'No users are currently flagged as at risk.' } else { "$($atRisk.Count) user(s) are flagged as at risk: $((@($atRisk | Select-Object -First 10 | ForEach-Object { [string](Get-Prop $_ 'userPrincipalName' '') })) -join ', ')." }
          Add-Q $C3 10 'Are there no users flagged as at risk?' 'Microsoft Entra ID Protection flags accounts that show signs of compromise, such as leaked credentials.' 'No risky users with risk state At risk or Confirmed compromised.' $a $n 'Investigate and fix the users flagged as at risk.' 'For each risky user, confirm whether the account is compromised, reset the password, revoke sessions, then dismiss or confirm the risk in Entra ID Protection.' 'https://learn.microsoft.com/entra/id-protection/howto-identity-protection-investigate-risk' -ControlType 30 -Likelihood 4 -Risk 5 -Impact 25 -Areas @('riskyUsers') -Id 'risky-users'

          # 9. High-risk detections, last 30 days
          $a = if ($highDet.Count -eq 0) { 2 } else { -2 }
          Add-Q $C3 20 'Were there no high-risk sign-in detections in the last 30 days?' 'High-risk detections, such as impossible travel or leaked credentials, often mean an attacker is trying to get in.' 'No risk detections with risk level High detected in the last 30 days.' $a "$($highDet.Count) high-risk detection(s) out of $(@($detections).Count) detection(s) in the last 30 days." 'Review the high-risk detections.' 'Review each high-risk detection in Entra ID Protection, fix the affected accounts, and add a sign-in risk policy so future detections are handled automatically.' 'https://learn.microsoft.com/entra/id-protection/concept-identity-protection-risks' -ControlType 30 -Likelihood 4 -Risk 4 -Impact 20 -Areas @('riskDetections') -Id 'high-risk-detections'

          # 10. Risk-based Conditional Access
          $rp = Find-Ca { $_.risk }; $rr = Find-Ca { $_.risk } -State 'enabledForReportingButNotEnforced'
          $a = if ($rp.Count) { 2 } elseif ($rr.Count) { 1 } else { -2 }
          $n = if ($rp.Count) { "Risk-based policies are on: $(Join-Names $rp)." } elseif ($rr.Count) { "Risk-based policies are report-only: $(Join-Names $rr)." } else { 'No Conditional Access policy responds to user or sign-in risk.' }
          if ($noP2 -and -not $rp.Count) { $n += ' Risk-based policies need an Entra ID P2 licence, which this tenant does not have.' }
          Add-Q $C3 30 'Do Conditional Access policies respond to user and sign-in risk?' 'Risk-based policies automatically require MFA or a password change when Microsoft sees a risky sign-in or user.' 'An enabled Conditional Access policy uses user risk or sign-in risk conditions (Entra ID P2).' $a $n 'Add user-risk and sign-in-risk policies.' 'With Entra ID P2, create Conditional Access policies that require a secure password change for high user risk and MFA for medium or high sign-in risk.' 'https://learn.microsoft.com/entra/id-protection/howto-identity-protection-configure-risk-policies' -ControlType 20 -Likelihood 3 -Risk 4 -Impact 15 -Areas @('conditionalAccess') -Id 'risk-based-ca'

          # 11. Secure Score
          $a = if ($ssMax -le 0) { -1 } elseif ($ssPct -ge 70) { 2 } elseif ($ssPct -ge 50) { 1 } else { -2 }
          Add-Q $C4 10 'Is the Microsoft Secure Score at least 70%?' "Secure Score measures how many of Microsoft's recommended security settings the tenant has in place." 'The latest Secure Score is 70% or more of the maximum (50% or more is partial).' $a "Secure Score is $ssCur of $ssMax ($ssPct%)." 'Raise the Secure Score.' 'In Microsoft Defender > Exposure management > Secure Score, work through the recommended actions with the most points first.' 'https://learn.microsoft.com/defender-xdr/microsoft-secure-score' -ControlType 30 -Likelihood 3 -Risk 3 -Impact 15 -Areas @('secureScore') -Id 'secure-score'

          # ---- summary ----
          $qs = @($questions)
          $cnt = [ordered]@{
              compliant = @($qs | Where-Object { $_.answer -eq 2 }).Count; partial = @($qs | Where-Object { $_.answer -eq 1 }).Count
              notCompliant = @($qs | Where-Object { $_.answer -eq -2 }).Count; notChecked = @($qs | Where-Object { $_.answer -eq -1 }).Count
          }
          $summary = "Automated Microsoft 365 security review of $tenantName on $($runDate.ToString('yyyy-MM-dd')): $($qs.Count) checks - $($cnt.compliant) compliant, $($cnt.partial) partially compliant, $($cnt.notCompliant) not compliant, $($cnt.notChecked) couldn't be checked."
          Set-NodeOutput ([ordered]@{
                  status = 'success'; mode = $mode; message = $summary
                  companyId = $companyId; companyName = $companyName; tenantId = $tenantId; tenantName = $tenantName
                  assessmentTitle = $title; runTitle = $runTitle; uploads = $uploads; portalUrl = ([string](Get-Prop $in 'portalUrl' '')).Trim(); summary = $summary; counts = $cnt; unavailable = $unavailable; questions = $qs
              })
        timeoutSeconds: 600
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: '{"companyName":"Contoso","mode":"plan"}'
    - id: create-cloudradial-assessment
      name: Create CloudRadial assessment
      type: powershell-script
      position:
        x: 560
        'y': 100
      properties:
        script: |
          # === NODE: Create CloudRadial assessment ===
          # Makes sure the company has the type 20 assessment "<name>" that the portal lists under
          # Compliance > Assessments, holding this review's answers. The first run creates it from JSON
          # (POST /v2/assessment); later runs refresh its questions and answers in place, matched on each
          # check's updateKey, so the same row and its runs stay linked. Plan mode stops before any write.
          # ---- shared: CloudRadial assessments (build.js prepends this to steps 2 and 3) ----
          $ErrorActionPreference = 'Stop'
          function Get-Prop { param($o, $n, $d = $null) if ($null -eq $o) { return $d }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $d }; $p = $o.PSObject.Properties[$n]; if ($p -and $null -ne $p.Value) { return $p.Value }; return $d }
          function Stop-Run { param([string]$m) Set-NodeOutput @{ status = 'error'; message = $m }; throw $m }
          function Read-StepInput { $i = Get-NodeInput; if ($i -is [string]) { $i = $i | ConvertFrom-Json }; return $i }

          $ScoreText = @{ 2 = 'Compliant'; 1 = 'Partially Compliant'; 0 = 'N/A'; -1 = 'Missing answer'; -2 = 'Not compliant' }

          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
              # A new Planner card needs a category: POST /v2/product answers 400 "The Category field is required" without one.
              # These are Endpoint LifeCycle Manager's defaults; a build's own category and productCategoryId always win.
              CardCategory          = 'Efficiency'
              CardProductCategoryId = 7
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          # A step that sets $global:NcoCrSecretSuffix (New Client Onboarding Form's cloudradial_company) reads <Name>-<suffix>
          # instead, so one runner can hold several partners' CloudRadial keys. Unset or empty: the shared keys. Read through
          # Get-Variable, because reading an unset variable throws in strict mode.
          function Get-CrSecret { param([string]$Name) $v = $null; $sfx = ''; $gv = Get-Variable -Name NcoCrSecretSuffix -Scope Global -ErrorAction SilentlyContinue; if ($gv) { $sfx = [string]$gv.Value }; if ($sfx) { try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name "$Name-$sfx" -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not $v) { throw "The runner Key Vault has no $Name-$sfx secret for cloudradial_company. Add it, or leave cloudradial_company empty to use the shared CloudRadial keys." }; return $v }; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              if ([string]::IsNullOrWhiteSpace([string]$body['category'])) { $body['category'] = $CrState.CardCategory }
              if (-not $body.Contains('productCategoryId') -or $null -eq $body['productCategoryId']) { $body['productCategoryId'] = $CrState.CardProductCategoryId }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive folder by name, and creates it with -Create.
          # Returns @{ id; companyId; name; inboundAddress } or $null.
          # Uses the v2 archive folder API: GET /v2/odata/archivefolder filtered to the company, and POST /v2/archivefolder,
          # which validates the name like the portal and gives the folder its inbound email address. Portals that answer the v2
          # routes with 404 or 405 fall back to the legacy /api/beta/archive list (which ignores companyId, so it is filtered
          # here) for the rest of the run. Names match case-insensitively, as the portal does.
          function Test-CrMissingRoute { param([string]$Message) return ($Message -match '\(HTTP (404|405)\)') }
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              if (-not $CrState.ContainsKey('ArchiveApi')) { $CrState['ArchiveApi'] = 'v2' }
              $match = { param($rows) @($rows | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1 }
              $find = {
                  if ($CrState['ArchiveApi'] -eq 'v2') {
                      try { return (& $match @(Get-CrAll "/v2/odata/archivefolder?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))")) }
                      catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }
                  }
                  return (& $match @(Get-CrBetaAll '/api/beta/archive'))
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  $body = [ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }
                  try {
                      if ($CrState['ArchiveApi'] -eq 'v2') {
                          try { $resp = Invoke-CrApi -Path '/v2/archivefolder' -Method POST -Body $body }
                          catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }
                      }
                      if ($CrState['ArchiveApi'] -eq 'beta') { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body $body }
                  }
                  # A 400 can mean the folder already exists (another run made it just now), so look again before giving up.
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  # v2 replies { success, data = { archiveFolderId, inboundEmailAddress, ... } }; the legacy create may reply with a bare id.
                  $id = Get-CrId $resp @('data.archiveFolderId', 'archiveFolderId', 'companyReportFolderId', 'id', 'archiveId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $inb = [string](Get-CrProp (Get-CrProp $resp 'data') 'inboundEmailAddress'); if (-not $inb) { $inb = [string](Get-CrProp $resp 'inboundEmailAddress') }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundEmailAddress = $inb } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('archiveFolderId', 'companyReportFolderId', 'id', 'archiveId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              $inbound = [string](Get-CrProp $hit 'inboundEmailAddress'); if (-not $inbound) { $inbound = [string](Get-CrProp $hit 'inboundAddress') }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = $inbound }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }

          # The answer options a synced multiple-choice question offers in the portal, so every value an automation writes
          # (2 compliant, 1 partial, 0 not applicable, -1 not determined, -2 not compliant) can also be picked by hand.
          $CrState['AssessmentOptions'] = @(
              [ordered]@{ label = 'Yes'; value = 2 }, [ordered]@{ label = 'Partial'; value = 1 }, [ordered]@{ label = 'No'; value = -2 },
              [ordered]@{ label = 'Not Applicable'; value = 0 }, [ordered]@{ label = 'Not Determined'; value = -1 })

          # Creates or refreshes one company assessment from JSON, answers it, and optionally runs it, so the portal shows a
          # dated, scored run linked to the assessment. No workbook upload.
          #   -Title      the assessment's title. The company's assessment (type 20) with this title is refreshed in place;
          #               without one, it is created.
          #   -Questions  each a hashtable: updateKey (a stable text such as a control name, so a re-run updates the same
          #               question), label, category, value (2 compliant, 1 partial, 0 not applicable, -1 not determined,
          #               -2 not compliant), and optionally textValue, publicNotes, privateNotes, isFlagged, explanation,
          #               evaluationInfo, remediationInfo, remediationLineItem, controlType, likelihood, risk, riskCost,
          #               riskImpact, order, type (80 choice, the default, or 0 text) and answerOptions.
          #   -Category, -Description, -Recommendations   the assessment's own fields, set when it is created
          #   -Visibility     0 partner only (the default) or 2 client visible, set when it is created
          #   -RemoveMissing  soft-delete the assessment's questions that aren't in -Questions
          #   -RunName        also create a run with this name, a dated snapshot that the portal's Assessments list shows
          #   -Preview        work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; assessmentId; runId; added; updated; removed; scores }.
          function Sync-CrAssessment {
              param([int]$CompanyId, [string]$Title, [object[]]$Questions, [string]$Category = '', [string]$Description = '', [string]$Recommendations = '',
                  [int]$Visibility = 0, [switch]$RemoveMissing, [string]$RunName = '', [switch]$Preview)
              if ($CompanyId -le 0 -or [string]::IsNullOrWhiteSpace($Title)) { throw 'Sync-CrAssessment needs a company id and a title.' }
              $qs = @($Questions | Where-Object { $null -ne $_ })
              if (-not $qs.Count) { throw "Sync-CrAssessment has no questions for '$Title'." }
              $keys = @{}
              foreach ($q in $qs) {
                  $k = [string](Get-CrProp $q 'updateKey'); $l = [string](Get-CrProp $q 'label')
                  if (-not $k -or -not $l) { throw "Every question of '$Title' needs an updateKey and a label." }
                  if ($keys.ContainsKey($k.ToLowerInvariant())) { throw "Two questions of '$Title' share the updateKey '$k'." }
                  $keys[$k.ToLowerInvariant()] = $true
              }
              $structure = @('updateKey', 'category', 'label', 'type', 'answerOptions', 'explanation', 'evaluationInfo', 'remediationInfo', 'remediationLineItem',
                  'remediationMonthlyUnits', 'remediationMonthlyUnitPrice', 'remediationProjectUnits', 'remediationProjectUnitPrice', 'controlType', 'likelihood', 'risk', 'riskCost', 'riskImpact', 'order')
              $answerFields = @('value', 'textValue', 'publicNotes', 'privateNotes', 'isFlagged', 'owner')
              $qBodies = @(foreach ($q in $qs) {
                      $b = [ordered]@{}
                      foreach ($f in $structure) { $v = Get-CrProp $q $f; if ($null -ne $v -and [string]$v -ne '') { $b[$f] = $v } }
                      if (-not $b.Contains('type')) { $b['type'] = 80 }
                      if ([int]$b['type'] -eq 80 -and -not $b.Contains('answerOptions')) { $b['answerOptions'] = $CrState['AssessmentOptions'] }
                      , $b
                  })
              $aBodies = @(foreach ($q in $qs) {
                      $b = [ordered]@{ updateKey = [string](Get-CrProp $q 'updateKey') }
                      foreach ($f in $answerFields) { $v = Get-CrProp $q $f; if ($null -ne $v) { $b[$f] = $v } }
                      if ($b.Count -gt 1) { , $b }
                  })
              $existing = @(Get-CrAll "/v2/odata/assessment?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))") | Where-Object {
                  $t = [string](Get-CrProp $_ 'type')
                  ([string](Get-CrProp $_ 'title')).Trim() -ieq $Title.Trim() -and ($t -eq '20' -or $t -eq 'Assessment') -and -not (Get-CrProp $_ 'isDeleted')
              } | Sort-Object { [int](Get-CrProp $_ 'assessmentId') } | Select-Object -First 1
              $aid = Get-CrId $existing @('assessmentId')
              $res = @{ action = ''; assessmentId = $aid; runId = 0; added = 0; updated = 0; removed = 0; scores = $null }
              if ($Preview) { $res.action = $(if ($aid) { 'would-update' } else { 'would-create' }); return $res }
              $chunk = 1000
              $slice = { param($list, [int]$from) @($list[$from..([Math]::Min($from + $chunk, $list.Count) - 1)]) }
              if ($aid) {
                  $res.action = 'updated'
                  for ($i = 0; $i -lt $qBodies.Count; $i += $chunk) {
                      # removeMissing only when every question fits in one call, or a later chunk would delete an earlier one's questions.
                      $r = Invoke-CrApi -Path "/v2/assessment/$aid/questions?companyId=$CompanyId" -Method PUT -Body ([ordered]@{ questions = (& $slice $qBodies $i); removeMissing = [bool]($RemoveMissing -and $qBodies.Count -le $chunk) })
                      $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }
                      $res.added += [int](Get-CrProp $d 'added'); $res.updated += [int](Get-CrProp $d 'updated'); $res.removed += [int](Get-CrProp $d 'removed')
                  }
              }
              else {
                  $res.action = 'created'
                  $first = & $slice $qBodies 0
                  $r = Invoke-CrApi -Path '/v2/assessment' -Method POST -Body ([ordered]@{ companyId = $CompanyId; title = $Title; type = 20; category = $Category; description = $Description; recommendations = $Recommendations; visibility = $Visibility; questions = $first })
                  $aid = Get-CrId $r @('data.assessmentId', 'assessmentId')
                  if (-not $aid) { throw "CloudRadial created the assessment '$Title' but its reply had no assessmentId." }
                  $res.assessmentId = $aid; $res.added = $first.Count
                  for ($i = $chunk; $i -lt $qBodies.Count; $i += $chunk) {
                      $part = & $slice $qBodies $i
                      $null = Invoke-CrApi -Path "/v2/assessment/$aid/questions?companyId=$CompanyId" -Method PUT -Body ([ordered]@{ questions = $part })
                      $res.added += $part.Count
                  }
              }
              for ($i = 0; $i -lt $aBodies.Count; $i += $chunk) {
                  $r = Invoke-CrApi -Path "/v2/assessment/$aid/answers?companyId=$CompanyId" -Method PATCH -Body ([ordered]@{ answers = (& $slice $aBodies $i) })
                  $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }
                  $s = Get-CrProp $d 'scores'; if ($null -ne $s) { $res.scores = $s }
              }
              if ($RunName) {
                  $run = Invoke-CrApi -Path "/v2/assessment/$aid/run" -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $RunName })
                  $res.runId = Get-CrId $run @('data.assessmentId', 'assessmentId')
                  $rd = Get-CrProp $run 'data'; if ($null -eq $rd) { $rd = $run }
                  if ($null -ne (Get-CrProp $rd 'totalScore')) { $res.scores = [ordered]@{ totalScore = Get-CrProp $rd 'totalScore'; compliantScore = Get-CrProp $rd 'compliantScore'; partialScore = Get-CrProp $rd 'partialScore'; maxScore = Get-CrProp $rd 'maxScore'; questionCount = Get-CrProp $rd 'questionCount' } }
              }
              return $res
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # The review's questions in the shape Sync-CrAssessment takes. updateKey is the review's stable GUID per check, so a
          # rerun (or an assessment first made by the old workbook upload) updates the same questions.
          function ConvertTo-CrQuestions { param([object[]]$Questions)
              @(foreach ($q in $Questions) {
                  $ans = [int](Get-Prop $q 'answer' -1)
                  $ref = [string](Get-Prop $q 'reference' '')
                  $exp = [string](Get-Prop $q 'explanation' ''); if ($ref) { $exp = ($exp + ' Reference: ' + $ref).Trim() }
                  , ([ordered]@{
                      updateKey = [string](Get-Prop $q 'updateKey' ''); category = [string](Get-Prop $q 'category' ''); label = [string](Get-Prop $q 'question' '')
                      order = [int](Get-Prop $q 'order' 0); explanation = $exp; evaluationInfo = [string](Get-Prop $q 'evaluation' '')
                      remediationInfo = [string](Get-Prop $q 'remediation' ''); remediationLineItem = [string](Get-Prop $q 'remediationSummary' '')
                      controlType = [int](Get-Prop $q 'controlType' 0); likelihood = [int](Get-Prop $q 'likelihood' 0); risk = [int](Get-Prop $q 'risk' 0)
                      riskCost = [int](Get-Prop $q 'risk' 0); riskImpact = [int](Get-Prop $q 'riskImpact' 0)
                      value = $ans; isFlagged = ($ans -eq -2); publicNotes = [string](Get-Prop $q 'notes' ''); privateNotes = [string](Get-Prop $q 'partnerNotes' '')
                  })
              })
          }
          function Get-Preview { param([object[]]$Questions) @($Questions | ForEach-Object { [ordered]@{ category = Get-Prop $_ 'category'; question = Get-Prop $_ 'question'; answer = $ScoreText[[int](Get-Prop $_ 'answer' -1)]; notes = Get-Prop $_ 'notes' } }) }
          function Get-CompanyAssessments { param([int]$CompanyId) @(Get-CrAll "/v2/odata/assessment?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))") }
          function Get-AssessmentType { param($Row) $t = [string](Get-Prop $Row 'type' ''); switch ($t) { 'Template' { 10 } 'Assessment' { 20 } 'Assessment_Run' { 30 } 'Assessment_Archive' { 50 } default { if ($t -match '^\d+$') { [int]$t } else { -1 } } } }
          function Find-Assessment { param($Rows, [string]$Name, [int]$Type)
              @($Rows | Where-Object { ([string](Get-Prop $_ 'title' '')).Trim() -ieq $Name -and (Get-AssessmentType $_) -eq $Type -and -not (Get-Prop $_ 'isDeleted' $false) } |
                  Sort-Object { [int](Get-Prop $_ 'assessmentId' 0) } -Descending) | Select-Object -First 1 }
          function Get-Fields { param($Row)
              # Every scalar field (long text trimmed), for comparing a run with its assessment.
              $o = [ordered]@{}
              if ($null -eq $Row) { return $o }
              foreach ($p in $Row.PSObject.Properties) {
                  $v = $p.Value
                  if ($null -eq $v -or $v -is [string] -or $v -is [ValueType]) { $s = [string]$v; $o[$p.Name] = $(if ($s.Length -gt 80) { $s.Substring(0, 80) + '...' } else { $v }) }
              }
              return $o }
          # ---- end shared ----
          $in = Read-StepInput
          if ([string](Get-Prop $in 'status' '') -ne 'success') { Stop-Run 'The review step did not finish, so there is nothing to create.' }
          $companyId = [int](Get-Prop $in 'companyId' 0)
          $companyName = [string](Get-Prop $in 'companyName' '')
          $title = [string](Get-Prop $in 'assessmentTitle' '')
          $runTitle = [string](Get-Prop $in 'runTitle' '')
          $summary = [string](Get-Prop $in 'summary' '')
          $mode = [string](Get-Prop $in 'mode' 'apply')
          $uploads = [string](Get-Prop $in 'uploads' 'both')
          $questions = @(Get-Prop $in 'questions' @())
          if ($companyId -le 0 -or -not $title -or -not $runTitle -or $questions.Count -eq 0) { Stop-Run 'The review step output is missing companyId, assessmentTitle, runTitle or questions.' }
          # Passed on to the run step.
          $carry = [ordered]@{ companyId = $companyId; companyName = $companyName; assessmentTitle = $title; runTitle = $runTitle; summary = $summary; mode = $mode; uploads = $uploads; portalUrl = [string](Get-Prop $in 'portalUrl' ''); questions = $questions }

          if ($mode -eq 'plan') {
              $out = [ordered]@{ status = 'success'; message = "Plan only. The assessment is '$title' (type 20, created only if $companyName doesn't have it yet)." }
              foreach ($k in $carry.Keys) { $out[$k] = $carry[$k] }
              $out.parent = $null
              Set-NodeOutput $out
              return
          }

          $null = Connect-Cr
          try { $all = @(Get-CompanyAssessments $companyId) }
          catch { Stop-Run "Couldn't list this company's assessments, so nothing was created (to avoid a duplicate). $($_.Exception.Message)" }
          $parentRow = Find-Assessment $all $title 20
          $action = 'exists'
          $scores = $null
          if (-not $parentRow -and $uploads -eq '30') { $action = 'missing' }
          elseif ($uploads -ne '30') {
              try { $sync = Sync-CrAssessment -CompanyId $companyId -Title $title -Questions (ConvertTo-CrQuestions $questions) -Category 'Security' -Description "Microsoft 365 security review for $companyName, refreshed by AutomationAI." -Visibility 2 }
              catch { Stop-Run "Couldn't $(if ($parentRow) { "refresh the answers in '$title'" } else { "create the assessment '$title'" }) for ${companyName}: $($_.Exception.Message)" }
              $action = $(if ($sync.action -eq 'created') { 'created' } else { 'refreshed' })
              $scores = $sync.scores
              $parentRow = @(@(Get-CompanyAssessments $companyId) | Where-Object { [int](Get-Prop $_ 'assessmentId' 0) -eq [int]$sync.assessmentId }) | Select-Object -First 1
              if (-not $parentRow) { $parentRow = [pscustomobject]@{ assessmentId = [int]$sync.assessmentId; title = $title; type = 20 } }
          }
          $parent = $null
          if ($parentRow) { $parent = [ordered]@{ assessmentId = [int](Get-Prop $parentRow 'assessmentId' 0); updateKey = [string](Get-Prop $parentRow 'updateKey' ''); action = $action; fields = Get-Fields $parentRow } }
          $msg = switch ($action) {
              'created' { "Created the assessment '$title' for $companyName (assessmentId $($parent.assessmentId))." }
              'refreshed' { "Updated the answers in the assessment '$title' for $companyName (assessmentId $($parent.assessmentId))$(if ($scores) { ": total $(Get-Prop $scores 'totalScore') of $(Get-Prop $scores 'maxScore')" })." }
              'exists' { "The assessment '$title' already exists for $companyName (assessmentId $($parent.assessmentId))." }
              default { "$companyName has no assessment '$title' and assessmentType 30 skips creating it, so there is nothing to run." }
          }
          $out = [ordered]@{ status = 'success'; message = $msg }
          foreach ($k in $carry.Keys) { $out[$k] = $carry[$k] }
          $out.parent = $parent
          Set-NodeOutput $out
        timeoutSeconds: 600
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: create-assessment-run
      name: Create assessment run
      type: powershell-script
      position:
        x: 800
        'y': 100
      properties:
        script: |
          # === NODE: Create assessment run ===
          # Creates today's run of the assessment through POST /v2/assessment/{id}/run, the same assessment service
          # the portal's Run button uses: a dated type 30 copy with the assessment's answers and its updateKey, so the
          # portal links the two and shows the run's score in the Assessments list. A run with the same title is never
          # created twice.
          # ---- shared: CloudRadial assessments (build.js prepends this to steps 2 and 3) ----
          $ErrorActionPreference = 'Stop'
          function Get-Prop { param($o, $n, $d = $null) if ($null -eq $o) { return $d }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $d }; $p = $o.PSObject.Properties[$n]; if ($p -and $null -ne $p.Value) { return $p.Value }; return $d }
          function Stop-Run { param([string]$m) Set-NodeOutput @{ status = 'error'; message = $m }; throw $m }
          function Read-StepInput { $i = Get-NodeInput; if ($i -is [string]) { $i = $i | ConvertFrom-Json }; return $i }

          $ScoreText = @{ 2 = 'Compliant'; 1 = 'Partially Compliant'; 0 = 'N/A'; -1 = 'Missing answer'; -2 = 'Not compliant' }

          # ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.
          # Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.
          # Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the
          # knowledge base, and never carry another client's data.
          # All state lives in the $CrState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $CrState = @{
              Base        = $null
              Headers     = $null
              MaxAttempts = 6
              # A new Planner card needs a category: POST /v2/product answers 400 "The Category field is required" without one.
              # These are Endpoint LifeCycle Manager's defaults; a build's own category and productCategoryId always win.
              CardCategory          = 'Efficiency'
              CardProductCategoryId = 7
          }

          # ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----
          # A step that sets $global:NcoCrSecretSuffix (New Client Onboarding Form's cloudradial_company) reads <Name>-<suffix>
          # instead, so one runner can hold several partners' CloudRadial keys. Unset or empty: the shared keys. Read through
          # Get-Variable, because reading an unset variable throws in strict mode.
          function Get-CrSecret { param([string]$Name) $v = $null; $sfx = ''; $gv = Get-Variable -Name NcoCrSecretSuffix -Scope Global -ErrorAction SilentlyContinue; if ($gv) { $sfx = [string]$gv.Value }; if ($sfx) { try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name "$Name-$sfx" -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not $v) { throw "The runner Key Vault has no $Name-$sfx secret for cloudradial_company. Add it, or leave cloudradial_company empty to use the shared CloudRadial keys." }; return $v }; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
          function Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }
          function Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }

          # Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.
          function Connect-Cr {
              param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }
              if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }
              if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $CrState.Base = $BaseUrl.Trim().TrimEnd('/')
              $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($PublicKey.Trim()):$($PrivateKey.Trim())")); Accept = 'application/json' }
              return @{ Base = $CrState.Base }
          }

          # One CloudRadial call. Path is relative to the base URL (or a full URL).
          # Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.
          function Invoke-CrApi {
              param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')
              if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }
              $url = if ($Path -match '^https?://') { $Path } else { "$($CrState.Base)$Path" }
              for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {
                  try {
                      $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }
                      if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }
                      return Invoke-RestMethod @a
                  }
                  catch {
                      $code = Get-CrHttpStatus $_
                      $msg = [string]$_.Exception.Message
                      $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')
                      if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }
                      $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }
                      throw "CloudRadial $Method $Path failed$(if ($code) { " (HTTP $code)" }): $detail"
                  }
              }
          }

          # Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.
          # Wrap the result in @(...).
          function Get-CrAll {
              param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList; $skip = 0
              for ($n = 0; $n -lt $MaxPages; $n++) {
                  $sep = if ($Path -match '\?') { '&' } else { '?' }
                  $resp = Invoke-CrApi -Path "$Path$sep`$top=$PageSize&`$skip=$skip"
                  $batch = @(); $v = Get-CrProp $resp 'value'
                  if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }
                  $batch = @($batch | Where-Object { $null -ne $_ })
                  foreach ($r in $batch) { $null = $rows.Add($r) }
                  if ($batch.Count -lt $PageSize) { break }
                  $skip += $PageSize
              }
              return @($rows)
          }

          # Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.
          function Get-CrBetaAll {
              param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)
              $all = New-Object System.Collections.ArrayList
              $sep = if ($Path.Contains('?')) { '&' } else { '?' }
              for ($p = 0; $p -lt $MaxPages; $p++) {
                  $raw = Invoke-CrApi -Path "$Path$($sep)Skip=$($p * $Take)&Take=$Take"
                  $rows = @($raw)
                  foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }
                  $rows = @($rows | Where-Object { $null -ne $_ })
                  foreach ($r in $rows) { $null = $all.Add($r) }
                  if ($rows.Count -lt $Take) { break }
              }
              return @($all)
          }

          # Creates or updates one Planner card (a CloudRadial "product") for a company, so a run never duplicates a card.
          # It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.
          #   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),
          #              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on
          #   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes
          #   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here
          #   -Preview   work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.
          function Set-CrPlannerCard {
              param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }
              $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll "/v2/odata/product?`$filter=companyId eq $CompanyId") }
              $want = $Subject.Trim()
              $card = @($cards | Where-Object {
                      $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (
                          ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))
                  }) | Select-Object -First 1
              $f = [ordered]@{ subject = $want }
              foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }
              if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = "$($f['body'])<p><em>$Key</em></p>" }
              $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')
              $dropped = $false

              if ($null -ne $card) {
                  $id = [string](Get-CrProp $card 'productId')
                  if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }
                  $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = "/$($_.Key)"; value = $_.Value } })
                  try { $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }
                  catch {
                      # Older portals may not take notes or the roadmap fields: write the card without them.
                      $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })
                      if ($core.Count -eq $ops.Count) { throw }
                      $null = Invoke-CrApi -Path "/v2/product/$id" -Method PATCH -Body $core -ContentType 'application/json-patch+json'
                      $dropped = $true
                  }
                  return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }
              }

              if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }
              $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }
              foreach ($k in $f.Keys) { $body[$k] = $f[$k] }
              if ([string]::IsNullOrWhiteSpace([string]$body['category'])) { $body['category'] = $CrState.CardCategory }
              if (-not $body.Contains('productCategoryId') -or $null -eq $body['productCategoryId']) { $body['productCategoryId'] = $CrState.CardProductCategoryId }
              $new = $null
              try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }
              catch {
                  $had = @($optional | Where-Object { $body.Contains($_) })
                  if (-not $had.Count) { throw }
                  foreach ($k in $had) { $body.Remove($k) }
                  $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body
                  $dropped = $true
              }
              # POST replies { success, message, data = { productId, ... } }.
              $newId = Get-CrId $new @('productId', 'data.productId')
              return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }
          }

          # Finds a company's report archive folder by name, and creates it with -Create.
          # Returns @{ id; companyId; name; inboundAddress } or $null.
          # Uses the v2 archive folder API: GET /v2/odata/archivefolder filtered to the company, and POST /v2/archivefolder,
          # which validates the name like the portal and gives the folder its inbound email address. Portals that answer the v2
          # routes with 404 or 405 fall back to the legacy /api/beta/archive list (which ignores companyId, so it is filtered
          # here) for the rest of the run. Names match case-insensitively, as the portal does.
          function Test-CrMissingRoute { param([string]$Message) return ($Message -match '\(HTTP (404|405)\)') }
          function Get-CrArchive {
              param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')
              if (-not $CrState.ContainsKey('ArchiveApi')) { $CrState['ArchiveApi'] = 'v2' }
              $match = { param($rows) @($rows | Where-Object {
                          $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }
                          $c = Get-CrProp $_ 'companyId'
                          $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)
                      }) | Select-Object -First 1 }
              $find = {
                  if ($CrState['ArchiveApi'] -eq 'v2') {
                      try { return (& $match @(Get-CrAll "/v2/odata/archivefolder?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))")) }
                      catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }
                  }
                  return (& $match @(Get-CrBetaAll '/api/beta/archive'))
              }
              $hit = & $find
              if ($null -eq $hit -and $Create) {
                  $resp = $null
                  $body = [ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }
                  try {
                      if ($CrState['ArchiveApi'] -eq 'v2') {
                          try { $resp = Invoke-CrApi -Path '/v2/archivefolder' -Method POST -Body $body }
                          catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }
                      }
                      if ($CrState['ArchiveApi'] -eq 'beta') { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body $body }
                  }
                  # A 400 can mean the folder already exists (another run made it just now), so look again before giving up.
                  catch { $again = & $find; if ($null -eq $again) { throw "Couldn't create or find the '$Name' report archive: $($_.Exception.Message)" }; $resp = $again }
                  # v2 replies { success, data = { archiveFolderId, inboundEmailAddress, ... } }; the legacy create may reply with a bare id.
                  $id = Get-CrId $resp @('data.archiveFolderId', 'archiveFolderId', 'companyReportFolderId', 'id', 'archiveId', 'data.id', 'data.archiveId')
                  if (-not $id -and ([string]$resp -match '^\d+$')) { $id = [int][string]$resp }
                  $inb = [string](Get-CrProp (Get-CrProp $resp 'data') 'inboundEmailAddress'); if (-not $inb) { $inb = [string](Get-CrProp $resp 'inboundEmailAddress') }
                  $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundEmailAddress = $inb } } else { & $find }
              }
              if ($null -eq $hit) { return $null }
              $aid = Get-CrId $hit @('archiveFolderId', 'companyReportFolderId', 'id', 'archiveId')
              if (-not $aid) { throw "Found the '$Name' archive but couldn't read its id." }
              $inbound = [string](Get-CrProp $hit 'inboundEmailAddress'); if (-not $inbound) { $inbound = [string](Get-CrProp $hit 'inboundAddress') }
              return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = $inbound }
          }

          # Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive
          # when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.
          # Never falls back to a knowledge base article: if this throws, keep the report in the run output.
          # Returns @{ action = created | updated | would-write; archiveId; itemId; location }.
          function Add-CrArchiveReport {
              param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)
              if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }
              $where = "Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'"
              $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category
              if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }
              $aid = [int]$arch.id
              $esc = $Subject.Replace("'", "''")
              $prev = $null
              try { $prev = @(Get-CrAll "/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'"))&`$select=companyReportItemId,subject") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }
              $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }
              $iid = Get-CrId $prev @('companyReportItemId')
              if ($iid) {
                  $null = Invoke-CrApi -Path "/v2/archiveitem/$aid/$iid" -Method PUT -Body $item
                  return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }
              }
              $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item
              return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }
          }

          # The answer options a synced multiple-choice question offers in the portal, so every value an automation writes
          # (2 compliant, 1 partial, 0 not applicable, -1 not determined, -2 not compliant) can also be picked by hand.
          $CrState['AssessmentOptions'] = @(
              [ordered]@{ label = 'Yes'; value = 2 }, [ordered]@{ label = 'Partial'; value = 1 }, [ordered]@{ label = 'No'; value = -2 },
              [ordered]@{ label = 'Not Applicable'; value = 0 }, [ordered]@{ label = 'Not Determined'; value = -1 })

          # Creates or refreshes one company assessment from JSON, answers it, and optionally runs it, so the portal shows a
          # dated, scored run linked to the assessment. No workbook upload.
          #   -Title      the assessment's title. The company's assessment (type 20) with this title is refreshed in place;
          #               without one, it is created.
          #   -Questions  each a hashtable: updateKey (a stable text such as a control name, so a re-run updates the same
          #               question), label, category, value (2 compliant, 1 partial, 0 not applicable, -1 not determined,
          #               -2 not compliant), and optionally textValue, publicNotes, privateNotes, isFlagged, explanation,
          #               evaluationInfo, remediationInfo, remediationLineItem, controlType, likelihood, risk, riskCost,
          #               riskImpact, order, type (80 choice, the default, or 0 text) and answerOptions.
          #   -Category, -Description, -Recommendations   the assessment's own fields, set when it is created
          #   -Visibility     0 partner only (the default) or 2 client visible, set when it is created
          #   -RemoveMissing  soft-delete the assessment's questions that aren't in -Questions
          #   -RunName        also create a run with this name, a dated snapshot that the portal's Assessments list shows
          #   -Preview        work out what would happen without writing
          # Returns @{ action = created | updated | would-create | would-update; assessmentId; runId; added; updated; removed; scores }.
          function Sync-CrAssessment {
              param([int]$CompanyId, [string]$Title, [object[]]$Questions, [string]$Category = '', [string]$Description = '', [string]$Recommendations = '',
                  [int]$Visibility = 0, [switch]$RemoveMissing, [string]$RunName = '', [switch]$Preview)
              if ($CompanyId -le 0 -or [string]::IsNullOrWhiteSpace($Title)) { throw 'Sync-CrAssessment needs a company id and a title.' }
              $qs = @($Questions | Where-Object { $null -ne $_ })
              if (-not $qs.Count) { throw "Sync-CrAssessment has no questions for '$Title'." }
              $keys = @{}
              foreach ($q in $qs) {
                  $k = [string](Get-CrProp $q 'updateKey'); $l = [string](Get-CrProp $q 'label')
                  if (-not $k -or -not $l) { throw "Every question of '$Title' needs an updateKey and a label." }
                  if ($keys.ContainsKey($k.ToLowerInvariant())) { throw "Two questions of '$Title' share the updateKey '$k'." }
                  $keys[$k.ToLowerInvariant()] = $true
              }
              $structure = @('updateKey', 'category', 'label', 'type', 'answerOptions', 'explanation', 'evaluationInfo', 'remediationInfo', 'remediationLineItem',
                  'remediationMonthlyUnits', 'remediationMonthlyUnitPrice', 'remediationProjectUnits', 'remediationProjectUnitPrice', 'controlType', 'likelihood', 'risk', 'riskCost', 'riskImpact', 'order')
              $answerFields = @('value', 'textValue', 'publicNotes', 'privateNotes', 'isFlagged', 'owner')
              $qBodies = @(foreach ($q in $qs) {
                      $b = [ordered]@{}
                      foreach ($f in $structure) { $v = Get-CrProp $q $f; if ($null -ne $v -and [string]$v -ne '') { $b[$f] = $v } }
                      if (-not $b.Contains('type')) { $b['type'] = 80 }
                      if ([int]$b['type'] -eq 80 -and -not $b.Contains('answerOptions')) { $b['answerOptions'] = $CrState['AssessmentOptions'] }
                      , $b
                  })
              $aBodies = @(foreach ($q in $qs) {
                      $b = [ordered]@{ updateKey = [string](Get-CrProp $q 'updateKey') }
                      foreach ($f in $answerFields) { $v = Get-CrProp $q $f; if ($null -ne $v) { $b[$f] = $v } }
                      if ($b.Count -gt 1) { , $b }
                  })
              $existing = @(Get-CrAll "/v2/odata/assessment?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))") | Where-Object {
                  $t = [string](Get-CrProp $_ 'type')
                  ([string](Get-CrProp $_ 'title')).Trim() -ieq $Title.Trim() -and ($t -eq '20' -or $t -eq 'Assessment') -and -not (Get-CrProp $_ 'isDeleted')
              } | Sort-Object { [int](Get-CrProp $_ 'assessmentId') } | Select-Object -First 1
              $aid = Get-CrId $existing @('assessmentId')
              $res = @{ action = ''; assessmentId = $aid; runId = 0; added = 0; updated = 0; removed = 0; scores = $null }
              if ($Preview) { $res.action = $(if ($aid) { 'would-update' } else { 'would-create' }); return $res }
              $chunk = 1000
              $slice = { param($list, [int]$from) @($list[$from..([Math]::Min($from + $chunk, $list.Count) - 1)]) }
              if ($aid) {
                  $res.action = 'updated'
                  for ($i = 0; $i -lt $qBodies.Count; $i += $chunk) {
                      # removeMissing only when every question fits in one call, or a later chunk would delete an earlier one's questions.
                      $r = Invoke-CrApi -Path "/v2/assessment/$aid/questions?companyId=$CompanyId" -Method PUT -Body ([ordered]@{ questions = (& $slice $qBodies $i); removeMissing = [bool]($RemoveMissing -and $qBodies.Count -le $chunk) })
                      $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }
                      $res.added += [int](Get-CrProp $d 'added'); $res.updated += [int](Get-CrProp $d 'updated'); $res.removed += [int](Get-CrProp $d 'removed')
                  }
              }
              else {
                  $res.action = 'created'
                  $first = & $slice $qBodies 0
                  $r = Invoke-CrApi -Path '/v2/assessment' -Method POST -Body ([ordered]@{ companyId = $CompanyId; title = $Title; type = 20; category = $Category; description = $Description; recommendations = $Recommendations; visibility = $Visibility; questions = $first })
                  $aid = Get-CrId $r @('data.assessmentId', 'assessmentId')
                  if (-not $aid) { throw "CloudRadial created the assessment '$Title' but its reply had no assessmentId." }
                  $res.assessmentId = $aid; $res.added = $first.Count
                  for ($i = $chunk; $i -lt $qBodies.Count; $i += $chunk) {
                      $part = & $slice $qBodies $i
                      $null = Invoke-CrApi -Path "/v2/assessment/$aid/questions?companyId=$CompanyId" -Method PUT -Body ([ordered]@{ questions = $part })
                      $res.added += $part.Count
                  }
              }
              for ($i = 0; $i -lt $aBodies.Count; $i += $chunk) {
                  $r = Invoke-CrApi -Path "/v2/assessment/$aid/answers?companyId=$CompanyId" -Method PATCH -Body ([ordered]@{ answers = (& $slice $aBodies $i) })
                  $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }
                  $s = Get-CrProp $d 'scores'; if ($null -ne $s) { $res.scores = $s }
              }
              if ($RunName) {
                  $run = Invoke-CrApi -Path "/v2/assessment/$aid/run" -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $RunName })
                  $res.runId = Get-CrId $run @('data.assessmentId', 'assessmentId')
                  $rd = Get-CrProp $run 'data'; if ($null -eq $rd) { $rd = $run }
                  if ($null -ne (Get-CrProp $rd 'totalScore')) { $res.scores = [ordered]@{ totalScore = Get-CrProp $rd 'totalScore'; compliantScore = Get-CrProp $rd 'compliantScore'; partialScore = Get-CrProp $rd 'partialScore'; maxScore = Get-CrProp $rd 'maxScore'; questionCount = Get-CrProp $rd 'questionCount' } }
              }
              return $res
          }
          # ---------- end _shared/cloudradial.ps1 ----------
          # The review's questions in the shape Sync-CrAssessment takes. updateKey is the review's stable GUID per check, so a
          # rerun (or an assessment first made by the old workbook upload) updates the same questions.
          function ConvertTo-CrQuestions { param([object[]]$Questions)
              @(foreach ($q in $Questions) {
                  $ans = [int](Get-Prop $q 'answer' -1)
                  $ref = [string](Get-Prop $q 'reference' '')
                  $exp = [string](Get-Prop $q 'explanation' ''); if ($ref) { $exp = ($exp + ' Reference: ' + $ref).Trim() }
                  , ([ordered]@{
                      updateKey = [string](Get-Prop $q 'updateKey' ''); category = [string](Get-Prop $q 'category' ''); label = [string](Get-Prop $q 'question' '')
                      order = [int](Get-Prop $q 'order' 0); explanation = $exp; evaluationInfo = [string](Get-Prop $q 'evaluation' '')
                      remediationInfo = [string](Get-Prop $q 'remediation' ''); remediationLineItem = [string](Get-Prop $q 'remediationSummary' '')
                      controlType = [int](Get-Prop $q 'controlType' 0); likelihood = [int](Get-Prop $q 'likelihood' 0); risk = [int](Get-Prop $q 'risk' 0)
                      riskCost = [int](Get-Prop $q 'risk' 0); riskImpact = [int](Get-Prop $q 'riskImpact' 0)
                      value = $ans; isFlagged = ($ans -eq -2); publicNotes = [string](Get-Prop $q 'notes' ''); privateNotes = [string](Get-Prop $q 'partnerNotes' '')
                  })
              })
          }
          function Get-Preview { param([object[]]$Questions) @($Questions | ForEach-Object { [ordered]@{ category = Get-Prop $_ 'category'; question = Get-Prop $_ 'question'; answer = $ScoreText[[int](Get-Prop $_ 'answer' -1)]; notes = Get-Prop $_ 'notes' } }) }
          function Get-CompanyAssessments { param([int]$CompanyId) @(Get-CrAll "/v2/odata/assessment?`$filter=$([uri]::EscapeDataString("companyId eq $CompanyId"))") }
          function Get-AssessmentType { param($Row) $t = [string](Get-Prop $Row 'type' ''); switch ($t) { 'Template' { 10 } 'Assessment' { 20 } 'Assessment_Run' { 30 } 'Assessment_Archive' { 50 } default { if ($t -match '^\d+$') { [int]$t } else { -1 } } } }
          function Find-Assessment { param($Rows, [string]$Name, [int]$Type)
              @($Rows | Where-Object { ([string](Get-Prop $_ 'title' '')).Trim() -ieq $Name -and (Get-AssessmentType $_) -eq $Type -and -not (Get-Prop $_ 'isDeleted' $false) } |
                  Sort-Object { [int](Get-Prop $_ 'assessmentId' 0) } -Descending) | Select-Object -First 1 }
          function Get-Fields { param($Row)
              # Every scalar field (long text trimmed), for comparing a run with its assessment.
              $o = [ordered]@{}
              if ($null -eq $Row) { return $o }
              foreach ($p in $Row.PSObject.Properties) {
                  $v = $p.Value
                  if ($null -eq $v -or $v -is [string] -or $v -is [ValueType]) { $s = [string]$v; $o[$p.Name] = $(if ($s.Length -gt 80) { $s.Substring(0, 80) + '...' } else { $v }) }
              }
              return $o }
          # ---- end shared ----
          $in = Read-StepInput
          $companyId = [int](Get-Prop $in 'companyId' 0)
          $companyName = [string](Get-Prop $in 'companyName' '')
          $title = [string](Get-Prop $in 'assessmentTitle' '')
          $runTitle = [string](Get-Prop $in 'runTitle' '')
          $summary = [string](Get-Prop $in 'summary' '')
          $mode = [string](Get-Prop $in 'mode' 'apply')
          $uploads = [string](Get-Prop $in 'uploads' 'both')
          $questions = @(Get-Prop $in 'questions' @())
          $parent = Get-Prop $in 'parent'
          $parentId = [int](Get-Prop $parent 'assessmentId' 0)
          $parentKey = [string](Get-Prop $parent 'updateKey' '')
          $preview = Get-Preview $questions
          function Out-Run { param([string]$Status, [string]$Message, [hashtable]$More = @{})
              $o = [ordered]@{ status = $Status; mode = $mode; message = "$Message $summary".Trim(); companyId = $companyId; parentAssessmentId = $parentId; title = $runTitle }
              foreach ($k in $More.Keys) { $o[$k] = $More[$k] }
              $o.questions = $preview
              Set-NodeOutput $o }

          if ($uploads -eq '20') { Out-Run 'skipped' 'assessmentType 20: only the assessment was requested, so no run was created.'; return }
          if ($mode -eq 'plan') { Out-Run 'success' "Plan only. Would create the run '$runTitle' of '$title' for $companyName, unless that run already exists."; return }
          if ($parentId -le 0) { Out-Run 'skipped' "There is no assessment '$title' for $companyName to create a run of."; return }

          $null = Connect-Cr

          try { $all = @(Get-CompanyAssessments $companyId) }
          catch { Stop-Run "Couldn't list this company's assessments, so no run was created (to avoid a duplicate). $($_.Exception.Message)" }
          $existing = Find-Assessment $all $runTitle 30
          if ($existing) {
              $k = [string](Get-Prop $existing 'updateKey' '')
              Out-Run 'skipped' "The run '$runTitle' already exists for $companyName (assessmentId $(Get-Prop $existing 'assessmentId')). Nothing was changed." @{ assessmentId = [int](Get-Prop $existing 'assessmentId' 0); linked = [bool]($parentKey -and $k -eq $parentKey); run = Get-Fields $existing }
              return
          }

          try { $run = Invoke-CrApi -Path "/v2/assessment/$parentId/run" -Method POST -Body ([ordered]@{ companyId = $companyId; name = $runTitle }) }
          catch { Stop-Run "Couldn't create the run '$runTitle' of '$title' (assessmentId $parentId): $($_.Exception.Message)" }
          $runRow = Get-Prop $run 'data'; if ($null -eq $runRow) { $runRow = $run }
          $runId = [int](Get-Prop $runRow 'assessmentId' 0)
          if ($runId -le 0) { Stop-Run "CloudRadial answered the run request for '$title' without an assessmentId." }
          $runKey = [string](Get-Prop $runRow 'updateKey' '')
          $linked = [bool]($parentKey -and $runKey -eq $parentKey)
          $all = @(); try { $all = @(Get-CompanyAssessments $companyId) } catch { }
          Out-Run $(if ($linked -or -not $parentKey) { 'success' } else { 'unlinked' }) "Created the run '$runTitle' (assessmentId $runId) of '$title' for $companyName$(if ($linked) { '. It is linked to the assessment.' } elseif ($parentKey) { ", but its updateKey $runKey doesn't match the assessment's $parentKey." } else { '.' }) The run copies the assessment's answers." @{
              assessmentId = $runId; linked = $linked; updateKey = $runKey; parentUpdateKey = $parentKey
              compliantScore = Get-Prop $runRow 'compliantScore'; partialScore = Get-Prop $runRow 'partialScore'; totalScore = Get-Prop $runRow 'totalScore'; maxScore = Get-Prop $runRow 'maxScore'
              run = Get-Fields $runRow; parent = Get-Prop $parent 'fields'; companyAssessments = @($all | Sort-Object { [int](Get-Prop $_ 'assessmentId' 0) } -Descending | Select-Object -First 25 | ForEach-Object { Get-Fields $_ }) }
        timeoutSeconds: 600
        retryCount: 0
        parameters: []
        aiExtensions: []
    - id: end
      name: End
      type: end
      position:
        x: 1040
        'y': 100
  connections:
    - source: start
      target: review-m365-security
      sourceHandle: null
    - source: review-m365-security
      target: create-cloudradial-assessment
      sourceHandle: null
    - source: create-cloudradial-assessment
      target: create-assessment-run
      sourceHandle: null
    - source: create-assessment-run
      target: end
      sourceHandle: null
  startActivityId: start
