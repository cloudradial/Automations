automationsWorkflow: 1
name: Microsoft Tenant Review
description: 'Run by the Microsoft Tenant Review portal form: creates a client assessment from Microsoft Secure Score, then conversational Planner cards for unused Microsoft 365 licenses, accounts without MFA and stale accounts. Takes the client and tenant from the ticket.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        'y': 100
      properties:
        webhookEnabled: false
    - id: secure-score
      name: Secure Score assessment
      type: powershell-script
      position:
        x: 320
        'y': 120
      properties:
        script: "# =====================================================================\n#  Secure Score -> CloudRadial Assessment (deterministic, JSON assessment API)\n#  Run input: {\"companyId\":123,\"tenantId\":\"<client Graph tenant GUID>\",\"assessmentTitle\":\"Microsoft Secure Score\",\"mode\":\"apply\"}\n#    companyId  - CloudRadial company the assessment is created under (required)\n#    tenantId   - the CLIENT's Entra tenant id to pull Secure Score from (required)\n#    mode       - \"apply\" (default) writes; \"plan\" previews only\n#  Keeps one assessment per client (\"<companyName> Secure Score Assessment\"), one question per control keyed on\n#  the control id, refreshed in place on every run, and adds a dated run the portal lists.\n#  Secrets (runner Key Vault): CloudRadial-BaseUrl / -PublicKey / -PrivateKey,\n#    and M365-ClientID / M365-ClientSecret (an Entra app with\n#    SecurityEvents.Read.All application permission, consented in the client tenant).\n# =====================================================================\n$ErrorActionPreference = 'Stop'\n[System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor [System.Net.SecurityProtocolType]::Tls12\n\nfunction Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }\nfunction Get-Prop { param($o,$n) if($null -eq $o){return $null}; if($o -is [System.Collections.IDictionary]){ if($o.Contains($n)){return $o[$n]}; return $null }; $p=$o.PSObject.Properties[$n]; if($p){return $p.Value}; return $null }\n\n# ---- run input ----\n$in = Get-NodeInput\n$t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }\nif ($in -is [string]) { $s = $in.Trim(); if ($s.StartsWith('{')) { $in = $s | ConvertFrom-Json } }\n$companyId = Get-Prop $in 'companyId'\n$tenantId  = Get-Prop $in 'tenantId'\n$title     = [string](Get-Prop $in 'assessmentTitle'); if ([string]::IsNullOrWhiteSpace($title)) { $title = 'Microsoft Secure Score' }\n$mode      = [string](Get-Prop $in 'mode'); if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'apply' }\nif ([string]::IsNullOrWhiteSpace([string]$tenantId) -or [string]$tenantId -match '^0{8}-') { Set-NodeOutput ([ordered]@{ status = 'skipped'; message = 'Microsoft 365 is not connected for this client (no tenant on the portal company), so the Secure Score section was skipped.'; plannerCards = @() }); return }\nif (-not $companyId -or [string]::IsNullOrWhiteSpace([string]$tenantId)) {\n    $m = 'Need companyId (CloudRadial) and tenantId (the client Entra tenant). e.g. {\"companyId\":123,\"tenantId\":\"00000000-0000-0000-0000-000000000000\"}.'\n    Set-NodeOutput @{ status = 'error'; message = $m }; throw $m\n}\n\n# ---- secrets ----\n$crBaseRaw = Get-Secret 'CloudRadial-BaseUrl'; $pub = Get-Secret 'CloudRadial-PublicKey'; $prv = Get-Secret 'CloudRadial-PrivateKey'\n$appId = Get-Secret 'M365-ClientID'; $appSecret = Get-Secret 'M365-ClientSecret'\n$missing = foreach ($pair in @(\n    @{ n='CloudRadial-BaseUrl'; v=$crBaseRaw }, @{ n='CloudRadial-PublicKey'; v=$pub }, @{ n='CloudRadial-PrivateKey'; v=$prv },\n    @{ n='M365-ClientID'; v=$appId }, @{ n='M365-ClientSecret'; v=$appSecret }\n)) { if ([string]::IsNullOrWhiteSpace([string]$pair.v)) { $pair.n } }\nif (@($missing).Count -gt 0) { $m = \"Add these runner Key Vault secret(s) and re-run: $($missing -join ', ').\"; Set-NodeOutput @{ status='error'; message=$m }; throw $m }\n$crBase = ([string]$crBaseRaw).TrimEnd('/')\n$crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(\"$pub`:$prv\"))\n\n# ---- CloudRadial API (assessments from JSON, no workbook upload) ----\n# ---------- _shared/cloudradial.ps1: CloudRadial API for AutomationAI steps ----------\n# Edit this file, then run: node _shared/inject.js <automation-folder>\n# Lifted from endpoint-lifecycle-manager/src/elm.ps1 and the ScalePad sync's archive helpers.\n# Secrets (runner Key Vault): CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey.\n# Reports for a client go to Report Archives (Compliance > Reports, admins only), never to the\n# knowledge base, and never carry another client's data.\n# All state lives in the $CrState hashtable and is changed in place, because the runner\n# runs a step in a child scope where $script: variables don't behave.\n\n$CrState = @{\n    Base        = $null\n    Headers     = $null\n    MaxAttempts = 6\n    # A new Planner card needs a category: POST /v2/product answers 400 \"The Category field is required\" without one.\n    # These are Endpoint LifeCycle Manager's defaults; a build's own category and productCategoryId always win.\n    CardCategory          = 'Efficiency'\n    CardProductCategoryId = 7\n}\n\n# ---- small helpers (all Cr-prefixed so they don't clash with other shared files) ----\n# A step that sets $global:NcoCrSecretSuffix (New Client Onboarding Form's cloudradial_company) reads <Name>-<suffix>\n# instead, so one runner can hold several partners' CloudRadial keys. Unset or empty: the shared keys. Read through\n# Get-Variable, because reading an unset variable throws in strict mode.\nfunction Get-CrSecret { param([string]$Name) $v = $null; $sfx = ''; $gv = Get-Variable -Name NcoCrSecretSuffix -Scope Global -ErrorAction SilentlyContinue; if ($gv) { $sfx = [string]$gv.Value }; if ($sfx) { try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name \"$Name-$sfx\" -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not $v) { throw \"The runner Key Vault has no $Name-$sfx secret for cloudradial_company. Add it, or leave cloudradial_company empty to use the shared CloudRadial keys.\" }; return $v }; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }\nfunction Get-CrProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }\nfunction Get-CrHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }\nfunction Get-CrRetryAfter { param($Err, [int]$Attempt) $s = 0; try { $ra = $Err.Exception.Response.Headers.RetryAfter; if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) } elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) } } catch { }; if ($s -le 0) { $s = [int][Math]::Min(30, [Math]::Pow(2, $Attempt)) }; return [Math]::Min($s, 120) }\nfunction Get-CrId { param($o, [string[]]$Names) foreach ($n in $Names) { $v = $o; foreach ($part in $n -split '\\.') { $v = Get-CrProp $v $part }; if ($null -ne $v -and [string]$v -match '^\\d+$' -and [long]$v -gt 0) { return [int]$v } }; return 0 }\n\n# Reads the API keys from the runner Key Vault (or takes them as parameters). Returns @{ Base }.\nfunction Connect-Cr {\n    param([string]$BaseUrl, [string]$PublicKey, [string]$PrivateKey)\n    if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $BaseUrl = Get-CrSecret 'CloudRadial-BaseUrl' }\n    if ([string]::IsNullOrWhiteSpace($PublicKey)) { $PublicKey = Get-CrSecret 'CloudRadial-PublicKey' }\n    if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $PrivateKey = Get-CrSecret 'CloudRadial-PrivateKey' }\n    $missing = @()\n    if ([string]::IsNullOrWhiteSpace($BaseUrl)) { $missing += 'CloudRadial-BaseUrl' }\n    if ([string]::IsNullOrWhiteSpace($PublicKey)) { $missing += 'CloudRadial-PublicKey' }\n    if ([string]::IsNullOrWhiteSpace($PrivateKey)) { $missing += 'CloudRadial-PrivateKey' }\n    if ($missing.Count) { throw \"Add these secrets to the runner Key Vault: $($missing -join ', ')\" }\n    $CrState.Base = $BaseUrl.Trim().TrimEnd('/')\n    $CrState.Headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(\"$($PublicKey.Trim()):$($PrivateKey.Trim())\")); Accept = 'application/json' }\n    return @{ Base = $CrState.Base }\n}\n\n# One CloudRadial call. Path is relative to the base URL (or a full URL).\n# Retries 429, GET 5xx and dropped connections, honoring Retry-After; other errors throw a plain message.\nfunction Invoke-CrApi {\n    param([string]$Path, [string]$Method = 'GET', $Body = $null, [string]$ContentType = 'application/json')\n    if ($null -eq $CrState.Headers) { throw 'Call Connect-Cr before any other CloudRadial function.' }\n    $url = if ($Path -match '^https?://') { $Path } else { \"$($CrState.Base)$Path\" }\n    for ($i = 1; $i -le $CrState.MaxAttempts; $i++) {\n        try {\n            $a = @{ Uri = $url; Method = $Method; Headers = $CrState.Headers; ContentType = $ContentType; ErrorAction = 'Stop' }\n            if ($null -ne $Body) { $a.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 12 }) }\n            return Invoke-RestMethod @a\n        }\n        catch {\n            $code = Get-CrHttpStatus $_\n            $msg = [string]$_.Exception.Message\n            $transient = (-not $code -and $msg -match 'SSL connection|could not be established|No such host|actively refused|forcibly closed|error occurred while sending|timed out|TaskCanceled')\n            if (($code -eq 429 -or ($Method -eq 'GET' -and $code -ge 500) -or $transient) -and $i -lt $CrState.MaxAttempts) { Start-Sleep -Seconds (Get-CrRetryAfter $_ $i); continue }\n            $detail = $msg; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $detail = $_.ErrorDetails.Message } } catch { }\n            throw \"CloudRadial $Method $Path failed$(if ($code) { \" (HTTP $code)\" }): $detail\"\n        }\n    }\n}\n\n# Every row of a /v2/odata list. Those lists stop at 200 rows with no nextLink, so this pages with $top/$skip.\n# Wrap the result in @(...).\nfunction Get-CrAll {\n    param([string]$Path, [int]$PageSize = 200, [int]$MaxPages = 500)\n    $rows = New-Object System.Collections.ArrayList; $skip = 0\n    for ($n = 0; $n -lt $MaxPages; $n++) {\n        $sep = if ($Path -match '\\?') { '&' } else { '?' }\n        $resp = Invoke-CrApi -Path \"$Path$sep`$top=$PageSize&`$skip=$skip\"\n        $batch = @(); $v = Get-CrProp $resp 'value'\n        if ($null -ne $v) { $batch = @($v) } elseif ($resp -is [array]) { $batch = @($resp) }\n        $batch = @($batch | Where-Object { $null -ne $_ })\n        foreach ($r in $batch) { $null = $rows.Add($r) }\n        if ($batch.Count -lt $PageSize) { break }\n        $skip += $PageSize\n    }\n    return @($rows)\n}\n\n# Every row of a legacy /api/beta list. Those page with Skip/Take and return 10 rows by default.\nfunction Get-CrBetaAll {\n    param([string]$Path, [int]$Take = 100, [int]$MaxPages = 50)\n    $all = New-Object System.Collections.ArrayList\n    $sep = if ($Path.Contains('?')) { '&' } else { '?' }\n    for ($p = 0; $p -lt $MaxPages; $p++) {\n        $raw = Invoke-CrApi -Path \"$Path$($sep)Skip=$($p * $Take)&Take=$Take\"\n        $rows = @($raw)\n        foreach ($k in @('value', 'data', 'items', 'archives')) { if ($rows.Count -eq 1 -and $null -ne (Get-CrProp $rows[0] $k)) { $rows = @(Get-CrProp $rows[0] $k) } }\n        $rows = @($rows | Where-Object { $null -ne $_ })\n        foreach ($r in $rows) { $null = $all.Add($r) }\n        if ($rows.Count -lt $Take) { break }\n    }\n    return @($all)\n}\n\n# Creates or updates one Planner card (a CloudRadial \"product\") for a company, so a run never duplicates a card.\n# It finds the company's card whose subject matches -Subject, or whose body holds -Key, and updates it; otherwise it creates one.\n#   -Fields    the card's other fields: body, summary, notes, category, productCategoryId, priority (1 high, 0 medium, -1 low),\n#              status (0 open, 20 scheduled, 40 completed), productType, scheduledQuarter, quarterOffset, and so on\n#   -Key       a stable marker. It is added to the end of the body when missing, so the card is found again after its subject changes\n#   -Existing  the company's cards when already read (saves a call per card); otherwise they are read here\n#   -Preview   work out what would happen without writing\n# Returns @{ action = created | updated | would-create | would-update; productId; optionalFieldsDropped }.\nfunction Set-CrPlannerCard {\n    param([int]$CompanyId, [string]$Subject, [hashtable]$Fields = @{}, [string]$Key = '', $Existing = $null, [switch]$Preview)\n    if ([string]::IsNullOrWhiteSpace($Subject)) { throw 'Set-CrPlannerCard needs a subject.' }\n    $cards = if ($null -ne $Existing) { @($Existing) } else { @(Get-CrAll \"/v2/odata/product?`$filter=companyId eq $CompanyId\") }\n    $want = $Subject.Trim()\n    $card = @($cards | Where-Object {\n            $null -ne $_ -and ($null -eq (Get-CrProp $_ 'companyId') -or [int](Get-CrProp $_ 'companyId') -eq $CompanyId) -and (\n                ([string](Get-CrProp $_ 'subject')).Trim() -ieq $want -or ($Key -and ([string](Get-CrProp $_ 'body')).Contains($Key)))\n        }) | Select-Object -First 1\n    $f = [ordered]@{ subject = $want }\n    foreach ($k in $Fields.Keys) { if ($k -ne 'subject') { $f[$k] = $Fields[$k] } }\n    if ($Key -and $f.Contains('body') -and -not ([string]$f['body']).Contains($Key)) { $f['body'] = \"$($f['body'])<p><em>$Key</em></p>\" }\n    $optional = @('notes', 'productType', 'scheduledQuarter', 'quarterOffset')\n    $dropped = $false\n\n    if ($null -ne $card) {\n        $id = [string](Get-CrProp $card 'productId')\n        if ($Preview) { return @{ action = 'would-update'; productId = $id; optionalFieldsDropped = $false } }\n        $ops = @($f.GetEnumerator() | ForEach-Object { @{ op = 'replace'; path = \"/$($_.Key)\"; value = $_.Value } })\n        try { $null = Invoke-CrApi -Path \"/v2/product/$id\" -Method PATCH -Body $ops -ContentType 'application/json-patch+json' }\n        catch {\n            # Older portals may not take notes or the roadmap fields: write the card without them.\n            $core = @($ops | Where-Object { $_.path.TrimStart('/') -notin $optional })\n            if ($core.Count -eq $ops.Count) { throw }\n            $null = Invoke-CrApi -Path \"/v2/product/$id\" -Method PATCH -Body $core -ContentType 'application/json-patch+json'\n            $dropped = $true\n        }\n        return @{ action = 'updated'; productId = $id; optionalFieldsDropped = $dropped }\n    }\n\n    if ($Preview) { return @{ action = 'would-create'; productId = ''; optionalFieldsDropped = $false } }\n    $body = [ordered]@{ companyId = $CompanyId; datePublished = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); isRequired = $false; isShowPrice = $false; isClientVisible = $false; status = 0 }\n    foreach ($k in $f.Keys) { $body[$k] = $f[$k] }\n    if ([string]::IsNullOrWhiteSpace([string]$body['category'])) { $body['category'] = $CrState.CardCategory }\n    if (-not $body.Contains('productCategoryId') -or $null -eq $body['productCategoryId']) { $body['productCategoryId'] = $CrState.CardProductCategoryId }\n    $new = $null\n    try { $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body }\n    catch {\n        $had = @($optional | Where-Object { $body.Contains($_) })\n        if (-not $had.Count) { throw }\n        foreach ($k in $had) { $body.Remove($k) }\n        $new = Invoke-CrApi -Path '/v2/product' -Method POST -Body $body\n        $dropped = $true\n    }\n    # POST replies { success, message, data = { productId, ... } }.\n    $newId = Get-CrId $new @('productId', 'data.productId')\n    return @{ action = 'created'; productId = $(if ($newId) { [string]$newId } else { '' }); optionalFieldsDropped = $dropped }\n}\n\n# Finds a company's report archive folder by name, and creates it with -Create.\n# Returns @{ id; companyId; name; inboundAddress } or $null.\n# Uses the v2 archive folder API: GET /v2/odata/archivefolder filtered to the company, and POST /v2/archivefolder,\n# which validates the name like the portal and gives the folder its inbound email address. Portals that answer the v2\n# routes with 404 or 405 fall back to the legacy /api/beta/archive list (which ignores companyId, so it is filtered\n# here) for the rest of the run. Names match case-insensitively, as the portal does.\nfunction Test-CrMissingRoute { param([string]$Message) return ($Message -match '\\(HTTP (404|405)\\)') }\nfunction Get-CrArchive {\n    param([int]$CompanyId, [string]$Name, [switch]$Create, [string]$Category = 'AutomationAI')\n    if (-not $CrState.ContainsKey('ArchiveApi')) { $CrState['ArchiveApi'] = 'v2' }\n    $match = { param($rows) @($rows | Where-Object {\n                $n = [string](Get-CrProp $_ 'name'); if (-not $n) { $n = [string](Get-CrProp $_ 'archiveName') }\n                $c = Get-CrProp $_ 'companyId'\n                $n.Trim() -ieq $Name.Trim() -and ($null -eq $c -or [int]$c -eq $CompanyId)\n            }) | Select-Object -First 1 }\n    $find = {\n        if ($CrState['ArchiveApi'] -eq 'v2') {\n            try { return (& $match @(Get-CrAll \"/v2/odata/archivefolder?`$filter=$([uri]::EscapeDataString(\"companyId eq $CompanyId\"))\")) }\n            catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }\n        }\n        return (& $match @(Get-CrBetaAll '/api/beta/archive'))\n    }\n    $hit = & $find\n    if ($null -eq $hit -and $Create) {\n        $resp = $null\n        $body = [ordered]@{ companyId = $CompanyId; name = $Name; category = $Category }\n        try {\n            if ($CrState['ArchiveApi'] -eq 'v2') {\n                try { $resp = Invoke-CrApi -Path '/v2/archivefolder' -Method POST -Body $body }\n                catch { if (-not (Test-CrMissingRoute $_.Exception.Message)) { throw }; $CrState['ArchiveApi'] = 'beta' }\n            }\n            if ($CrState['ArchiveApi'] -eq 'beta') { $resp = Invoke-CrApi -Path '/api/beta/archive' -Method POST -Body $body }\n        }\n        # A 400 can mean the folder already exists (another run made it just now), so look again before giving up.\n        catch { $again = & $find; if ($null -eq $again) { throw \"Couldn't create or find the '$Name' report archive: $($_.Exception.Message)\" }; $resp = $again }\n        # v2 replies { success, data = { archiveFolderId, inboundEmailAddress, ... } }; the legacy create may reply with a bare id.\n        $id = Get-CrId $resp @('data.archiveFolderId', 'archiveFolderId', 'companyReportFolderId', 'id', 'archiveId', 'data.id', 'data.archiveId')\n        if (-not $id -and ([string]$resp -match '^\\d+$')) { $id = [int][string]$resp }\n        $inb = [string](Get-CrProp (Get-CrProp $resp 'data') 'inboundEmailAddress'); if (-not $inb) { $inb = [string](Get-CrProp $resp 'inboundEmailAddress') }\n        $hit = if ($id) { [pscustomobject]@{ id = $id; companyId = $CompanyId; name = $Name; inboundEmailAddress = $inb } } else { & $find }\n    }\n    if ($null -eq $hit) { return $null }\n    $aid = Get-CrId $hit @('archiveFolderId', 'companyReportFolderId', 'id', 'archiveId')\n    if (-not $aid) { throw \"Found the '$Name' archive but couldn't read its id.\" }\n    $inbound = [string](Get-CrProp $hit 'inboundEmailAddress'); if (-not $inbound) { $inbound = [string](Get-CrProp $hit 'inboundAddress') }\n    return @{ id = $aid; companyId = $CompanyId; name = $Name; inboundAddress = $inbound }\n}\n\n# Writes an HTML report into a company's Report Archive (Compliance > Reports, admins only), creating the archive\n# when needed. An item with the same subject is replaced, so a re-run updates the report instead of piling up.\n# Never falls back to a knowledge base article: if this throws, keep the report in the run output.\n# Returns @{ action = created | updated | would-write; archiveId; itemId; location }.\nfunction Add-CrArchiveReport {\n    param([int]$CompanyId, [string]$ArchiveName, [string]$Subject, [string]$Html, [string]$Category = 'AutomationAI', [switch]$IsError, [switch]$Preview)\n    if ([string]::IsNullOrWhiteSpace($ArchiveName) -or [string]::IsNullOrWhiteSpace($Subject)) { throw 'Add-CrArchiveReport needs an archive name and a subject.' }\n    $where = \"Report archive '$ArchiveName' (Compliance > Reports, admins only), item '$Subject'\"\n    $arch = Get-CrArchive -CompanyId $CompanyId -Name $ArchiveName -Create:(-not $Preview) -Category $Category\n    if ($Preview) { return @{ action = 'would-write'; archiveId = $(if ($arch) { $arch.id } else { 0 }); itemId = 0; location = $where } }\n    $aid = [int]$arch.id\n    $esc = $Subject.Replace(\"'\", \"''\")\n    $prev = $null\n    try { $prev = @(Get-CrAll \"/v2/odata/archiveitem?`$filter=$([uri]::EscapeDataString(\"companyId eq $CompanyId and companyReportFolderId eq $aid and subject eq '$esc'\"))&`$select=companyReportItemId,subject\") | Where-Object { ([string](Get-CrProp $_ 'subject')) -eq $Subject } | Select-Object -First 1 } catch { $prev = $null }\n    $item = [ordered]@{ companyId = $CompanyId; archiveId = $aid; subject = $Subject; text = $Html; isHtml = $true; isError = [bool]$IsError }\n    $iid = Get-CrId $prev @('companyReportItemId')\n    if ($iid) {\n        $null = Invoke-CrApi -Path \"/v2/archiveitem/$aid/$iid\" -Method PUT -Body $item\n        return @{ action = 'updated'; archiveId = $aid; itemId = $iid; location = $where }\n    }\n    $r = Invoke-CrApi -Path '/v2/archiveitem' -Method POST -Body $item\n    return @{ action = 'created'; archiveId = $aid; itemId = (Get-CrId $r @('companyReportItemId', 'id', 'data.companyReportItemId', 'data.id')); location = $where }\n}\n\n# The answer options a synced multiple-choice question offers in the portal, so every value an automation writes\n# (2 compliant, 1 partial, 0 not applicable, -1 not determined, -2 not compliant) can also be picked by hand.\n$CrState['AssessmentOptions'] = @(\n    [ordered]@{ label = 'Yes'; value = 2 }, [ordered]@{ label = 'Partial'; value = 1 }, [ordered]@{ label = 'No'; value = -2 },\n    [ordered]@{ label = 'Not Applicable'; value = 0 }, [ordered]@{ label = 'Not Determined'; value = -1 })\n\n# Creates or refreshes one company assessment from JSON, answers it, and optionally runs it, so the portal shows a\n# dated, scored run linked to the assessment. No workbook upload.\n#   -Title      the assessment's title. The company's assessment (type 20) with this title is refreshed in place;\n#               without one, it is created.\n#   -Questions  each a hashtable: updateKey (a stable text such as a control name, so a re-run updates the same\n#               question), label, category, value (2 compliant, 1 partial, 0 not applicable, -1 not determined,\n#               -2 not compliant), and optionally textValue, publicNotes, privateNotes, isFlagged, explanation,\n#               evaluationInfo, remediationInfo, remediationLineItem, controlType, likelihood, risk, riskCost,\n#               riskImpact, order, type (80 choice, the default, or 0 text) and answerOptions.\n#   -Category, -Description, -Recommendations   the assessment's own fields, set when it is created\n#   -Visibility     0 partner only (the default) or 2 client visible, set when it is created\n#   -RemoveMissing  soft-delete the assessment's questions that aren't in -Questions\n#   -RunName        also create a run with this name, a dated snapshot that the portal's Assessments list shows\n#   -Preview        work out what would happen without writing\n# Returns @{ action = created | updated | would-create | would-update; assessmentId; runId; added; updated; removed; scores }.\nfunction Sync-CrAssessment {\n    param([int]$CompanyId, [string]$Title, [object[]]$Questions, [string]$Category = '', [string]$Description = '', [string]$Recommendations = '',\n        [int]$Visibility = 0, [switch]$RemoveMissing, [string]$RunName = '', [switch]$Preview)\n    if ($CompanyId -le 0 -or [string]::IsNullOrWhiteSpace($Title)) { throw 'Sync-CrAssessment needs a company id and a title.' }\n    $qs = @($Questions | Where-Object { $null -ne $_ })\n    if (-not $qs.Count) { throw \"Sync-CrAssessment has no questions for '$Title'.\" }\n    $keys = @{}\n    foreach ($q in $qs) {\n        $k = [string](Get-CrProp $q 'updateKey'); $l = [string](Get-CrProp $q 'label')\n        if (-not $k -or -not $l) { throw \"Every question of '$Title' needs an updateKey and a label.\" }\n        if ($keys.ContainsKey($k.ToLowerInvariant())) { throw \"Two questions of '$Title' share the updateKey '$k'.\" }\n        $keys[$k.ToLowerInvariant()] = $true\n    }\n    $structure = @('updateKey', 'category', 'label', 'type', 'answerOptions', 'explanation', 'evaluationInfo', 'remediationInfo', 'remediationLineItem',\n        'remediationMonthlyUnits', 'remediationMonthlyUnitPrice', 'remediationProjectUnits', 'remediationProjectUnitPrice', 'controlType', 'likelihood', 'risk', 'riskCost', 'riskImpact', 'order')\n    $answerFields = @('value', 'textValue', 'publicNotes', 'privateNotes', 'isFlagged', 'owner')\n    $qBodies = @(foreach ($q in $qs) {\n            $b = [ordered]@{}\n            foreach ($f in $structure) { $v = Get-CrProp $q $f; if ($null -ne $v -and [string]$v -ne '') { $b[$f] = $v } }\n            if (-not $b.Contains('type')) { $b['type'] = 80 }\n            if ([int]$b['type'] -eq 80 -and -not $b.Contains('answerOptions')) { $b['answerOptions'] = $CrState['AssessmentOptions'] }\n            , $b\n        })\n    $aBodies = @(foreach ($q in $qs) {\n            $b = [ordered]@{ updateKey = [string](Get-CrProp $q 'updateKey') }\n            foreach ($f in $answerFields) { $v = Get-CrProp $q $f; if ($null -ne $v) { $b[$f] = $v } }\n            if ($b.Count -gt 1) { , $b }\n        })\n    $existing = @(Get-CrAll \"/v2/odata/assessment?`$filter=$([uri]::EscapeDataString(\"companyId eq $CompanyId\"))\") | Where-Object {\n        $t = [string](Get-CrProp $_ 'type')\n        ([string](Get-CrProp $_ 'title')).Trim() -ieq $Title.Trim() -and ($t -eq '20' -or $t -eq 'Assessment') -and -not (Get-CrProp $_ 'isDeleted')\n    } | Sort-Object { [int](Get-CrProp $_ 'assessmentId') } | Select-Object -First 1\n    $aid = Get-CrId $existing @('assessmentId')\n    $res = @{ action = ''; assessmentId = $aid; runId = 0; added = 0; updated = 0; removed = 0; scores = $null }\n    if ($Preview) { $res.action = $(if ($aid) { 'would-update' } else { 'would-create' }); return $res }\n    $chunk = 1000\n    $slice = { param($list, [int]$from) @($list[$from..([Math]::Min($from + $chunk, $list.Count) - 1)]) }\n    if ($aid) {\n        $res.action = 'updated'\n        for ($i = 0; $i -lt $qBodies.Count; $i += $chunk) {\n            # removeMissing only when every question fits in one call, or a later chunk would delete an earlier one's questions.\n            $r = Invoke-CrApi -Path \"/v2/assessment/$aid/questions?companyId=$CompanyId\" -Method PUT -Body ([ordered]@{ questions = (& $slice $qBodies $i); removeMissing = [bool]($RemoveMissing -and $qBodies.Count -le $chunk) })\n            $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }\n            $res.added += [int](Get-CrProp $d 'added'); $res.updated += [int](Get-CrProp $d 'updated'); $res.removed += [int](Get-CrProp $d 'removed')\n        }\n    }\n    else {\n        $res.action = 'created'\n        $first = & $slice $qBodies 0\n        $r = Invoke-CrApi -Path '/v2/assessment' -Method POST -Body ([ordered]@{ companyId = $CompanyId; title = $Title; type = 20; category = $Category; description = $Description; recommendations = $Recommendations; visibility = $Visibility; questions = $first })\n        $aid = Get-CrId $r @('data.assessmentId', 'assessmentId')\n        if (-not $aid) { throw \"CloudRadial created the assessment '$Title' but its reply had no assessmentId.\" }\n        $res.assessmentId = $aid; $res.added = $first.Count\n        for ($i = $chunk; $i -lt $qBodies.Count; $i += $chunk) {\n            $part = & $slice $qBodies $i\n            $null = Invoke-CrApi -Path \"/v2/assessment/$aid/questions?companyId=$CompanyId\" -Method PUT -Body ([ordered]@{ questions = $part })\n            $res.added += $part.Count\n        }\n    }\n    for ($i = 0; $i -lt $aBodies.Count; $i += $chunk) {\n        $r = Invoke-CrApi -Path \"/v2/assessment/$aid/answers?companyId=$CompanyId\" -Method PATCH -Body ([ordered]@{ answers = (& $slice $aBodies $i) })\n        $d = Get-CrProp $r 'data'; if ($null -eq $d) { $d = $r }\n        $s = Get-CrProp $d 'scores'; if ($null -ne $s) { $res.scores = $s }\n    }\n    if ($RunName) {\n        $run = Invoke-CrApi -Path \"/v2/assessment/$aid/run\" -Method POST -Body ([ordered]@{ companyId = $CompanyId; name = $RunName })\n        $res.runId = Get-CrId $run @('data.assessmentId', 'assessmentId')\n        $rd = Get-CrProp $run 'data'; if ($null -eq $rd) { $rd = $run }\n        if ($null -ne (Get-CrProp $rd 'totalScore')) { $res.scores = [ordered]@{ totalScore = Get-CrProp $rd 'totalScore'; compliantScore = Get-CrProp $rd 'compliantScore'; partialScore = Get-CrProp $rd 'partialScore'; maxScore = Get-CrProp $rd 'maxScore'; questionCount = Get-CrProp $rd 'questionCount' } }\n    }\n    return $res\n}\n# ---------- end _shared/cloudradial.ps1 ----------\n$null = Connect-Cr\nfunction Invoke-Cr { param([string]$Method, [string]$Path, [object]$Body) Invoke-CrApi -Path $Path -Method $Method -Body $Body }\n\n# ---- Microsoft Graph: token + Secure Score ----\n$tokUri = \"https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token\"\n$tok = (Invoke-RestMethod -Uri $tokUri -Method Post -ContentType 'application/x-www-form-urlencoded' -Body @{ grant_type='client_credentials'; client_id=$appId; client_secret=$appSecret; scope='https://graph.microsoft.com/.default' }).access_token\nif (-not $tok) { throw 'Could not get a Microsoft Graph token - check the app id/secret and that the app is consented in the client tenant.' }\n$gh = @{ Authorization = \"Bearer $tok\" }\n# What the token holds: the app id and its application permissions (never the token itself), so a 403 can say what is missing.\nfunction Get-TokenInfo { param([string]$Jwt)\n    $info = [ordered]@{ appId = ''; roles = @() }\n    try {\n        $p = $Jwt.Split('.')[1].Replace('-', '+').Replace('_', '/'); while ($p.Length % 4) { $p += '=' }\n        $c = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p)) | ConvertFrom-Json\n        $info.appId = [string](Get-Prop $c 'appid'); $info.roles = @(Get-Prop $c 'roles' | Where-Object { $_ })\n    } catch { }\n    return $info\n}\ntry { $score = (Invoke-RestMethod -Uri 'https://graph.microsoft.com/v1.0/security/secureScores?$top=1' -Headers $gh).value | Select-Object -First 1 }\ncatch {\n    $code = 0; try { $code = [int]$_.Exception.Response.StatusCode } catch { }\n    if ($code -ne 403 -and $code -ne 401) { throw }\n    $ti = Get-TokenInfo $tok\n    $has = if (@($ti.roles).Count) { (@($ti.roles) | Sort-Object) -join ', ' } else { 'none' }\n    $m = \"Microsoft Graph refused to read Secure Score (HTTP $code). The app registration $($ti.appId) has these application permissions in tenant $($tenantId): $has. Add SecurityEvents.Read.All to it as an Application permission (not Delegated) and grant admin consent in this tenant. Its existing permissions stay as they are. Nothing was created.\"\n    Set-NodeOutput @{ status = 'error'; message = $m; appId = $ti.appId; grantedRoles = @($ti.roles) }; throw $m\n}\nif (-not $score) { throw 'No Secure Score data for this tenant (is Microsoft Secure Score enabled, and does the app have SecurityEvents.Read.All?).' }\n$tenantCur = [double]$score.currentScore; $tenantMax = [double]$score.maxScore\n$lookup = @{}; foreach ($cs in @($score.controlScores)) { $lookup[[string]$cs.controlName] = $cs.score }\n$profiles = @(); $uri = 'https://graph.microsoft.com/v1.0/security/secureScoreControlProfiles'\nwhile ($uri) { $r = Invoke-RestMethod -Uri $uri -Headers $gh; $profiles += @($r.value); $uri = Get-Prop $r '@odata.nextLink' }\n$active = @($profiles | Where-Object { -not $_.deprecated })\nif ($active.Count -eq 0) { throw 'No active Secure Score control profiles returned.' }\n\nfunction ConvertTo-PlainText { param([string]$Html)\n    if ([string]::IsNullOrWhiteSpace($Html)) { return '' }\n    $t = $Html -replace '(?i)<br\\s*/?>', \"`n\" -replace '(?i)</p\\s*>', \"`n\" -replace '(?i)<li[^>]*>', \"`n• \" -replace '(?i)</(li|ul|ol|div|h\\d)\\s*>', \"`n\"\n    $t = $t -replace '<[^>]+>', ''\n    $t = [System.Net.WebUtility]::HtmlDecode([System.Net.WebUtility]::HtmlDecode($t))\n    $t = $t -replace \"\_\", ' ' -replace '[ \\t]+', ' ' -replace ' *\\r?\\n *', \"`n\" -replace \"(`n){2,}\", \"`n\"\n    return $t.Trim()\n}\nfunction Get-ShortText { param([string]$Text, [int]$Max = 240)\n    $first = (($Text -split \"`n\") | ForEach-Object { ($_ -replace '^\\s*(•|\\d+\\.)\\s*', '').Trim() } | Where-Object { $_.Length -ge 25 } | Select-Object -First 1)\n    if (-not $first) { $first = ($Text -replace \"\\s*`n\\s*\", ' ').Trim() }\n    if ($first.Length -le $Max) { return $first }\n    $cut = $first.Substring(0, $Max); $dot = $cut.LastIndexOf('. ')\n    if ($dot -gt [int]($Max * 0.5)) { return $cut.Substring(0, $dot + 1) }\n    $sp = $cut.LastIndexOf(' '); if ($sp -gt 0) { $cut = $cut.Substring(0, $sp) }\n    return ($cut.TrimEnd(',', ';', ':', ' ') + '…')\n}\n# ---- one question per control, keyed on the control id so a rerun updates the same question ----\n$catOrder = @{ 'Identity'=1; 'Device'=2; 'Apps'=3; 'Data'=4; 'Infrastructure'=5 }\n$sorted = $active | Sort-Object @(\n    @{ Expression = { $k=[string]$_.controlCategory; if ($catOrder.ContainsKey($k)) { $catOrder[$k] } else { 99 } } },\n    @{ Expression = { $_.rank } }\n)\n$today = Get-Date -Format 'yyyy-MM-dd'\n$questions = New-Object System.Collections.ArrayList\n$order = 0; $compliantCount = 0\nforeach ($c in $sorted) {\n    $order += 10\n    $cc = [string]$c.controlCategory\n    $cat = switch ($cc) { 'Account' { 'Identity' } 'Identity' { 'Identity' } 'Data' { 'Data' } 'Device' { 'Device' } 'Apps' { 'Apps' } 'Infrastructure' { 'Infrastructure' } default { $cc } }\n    $cur = if ($lookup.ContainsKey([string]$c.id)) { [double]$lookup[[string]$c.id] } else { 0 }\n    $max = if ($c.maxScore) { [double]$c.maxScore } else { 0 }\n    $isCompliant = ($cur -ge $max) -and ($max -gt 0)\n    if ($isCompliant) { $compliantCount++ }\n    $pct = if ($tenantMax -gt 0) { [math]::Round(($max / $tenantMax) * 100, 2) } else { 0 }\n    $rem = ConvertTo-PlainText ([string]$c.remediation)\n    $null = $questions.Add([ordered]@{\n        updateKey = [string]$c.id; category = $cat; label = ([System.Net.WebUtility]::HtmlDecode([string]$c.title)).Trim(); order = $order\n        explanation = \"Service: $($c.service) | Score impact: $pct% | Points: $cur / $max\"\n        evaluationInfo = 'Review this control in the Microsoft 365 Defender portal under Secure Score.'\n        remediationInfo = $rem; remediationLineItem = (Get-ShortText $rem 240)\n        value = $(if ($isCompliant) { 2 } else { -2 }); isFlagged = (-not $isCompliant)\n        privateNotes = \"Microsoft Secure Score - $($c.service): $cur of $max points on $today.\"\n    })\n}\n$textSample = @($questions | Where-Object { $_.remediationInfo } | Select-Object -First 3 | ForEach-Object { [ordered]@{ title = $_.label; short = $_.remediationLineItem; full = $_.remediationInfo.Substring(0, [math]::Min(600, $_.remediationInfo.Length)) } })\n\n$catCards = @()\nif ($mode -eq 'apply') {\n    $groups = $sorted | Group-Object { $k = [string]$_.controlCategory; if ($k -eq 'Account') { 'Identity' } else { $k } }\n    $existingCards = @(); try { $existingCards = @(Get-CrAll \"/v2/odata/product?`$filter=companyId eq $companyId\") } catch { }\n    $asOf = (Get-Date).ToString('d MMM yyyy')\n    foreach ($g in $groups) {\n        $catName = [string]$g.Name; if (-not $catName) { continue }\n        $gaps = @(); $got = 0.0; $possible = 0.0\n        foreach ($c in $g.Group) {\n            $cur = if ($lookup.ContainsKey([string]$c.id)) { [double]$lookup[[string]$c.id] } else { 0 }\n            $max = if ($c.maxScore) { [double]$c.maxScore } else { 0 }\n            $got += $cur; $possible += $max\n            if (-not (($cur -ge $max) -and ($max -gt 0))) { $gaps += [pscustomobject]@{ title = [string]$c.title; gain = ($max - $cur) } }\n        }\n        if ($gaps.Count -eq 0) { continue }\n        $top = @($gaps | Sort-Object gain -Descending | Select-Object -First 5)\n        $subject = \"Microsoft 365 $catName security\"\n        $pctC = if ($possible -gt 0) { [math]::Round(100 * $got / $possible, 0) } else { 0 }\n        $summary = if ($gaps.Count) { \"Your $catName security is at $pctC%. We found $($gaps.Count) improvement$(if ($gaps.Count -ne 1) { 's' }) worth making.\" } else { \"Your $catName security is in great shape: every setting Microsoft checks is in place.\" }\n        $items = ($top | ForEach-Object { '<li>' + [System.Net.WebUtility]::HtmlEncode($_.title) + ' (+' + [math]::Round($_.gain, 1) + ' points)</li>' }) -join ''\n        $pctDone = if ($possible -gt 0) { [math]::Round(100 * $got / $possible, 0) } else { 0 }\n        $body = \"<div style='background:linear-gradient(135deg,#001F54 0%,#09507B 55%,#1282A2 100%);color:#fff;padding:14px 18px;border-radius:12px;border-left:6px solid #B3C9D5;margin:0 0 10px'><div style='font-size:18px;font-weight:600'><i class='fal fa-shield-halved' style='color:#B3C9D5'></i>&nbsp; Your $catName security is at $pctDone%</div><div style='font-size:13px;opacity:.9;margin-top:4px'>Microsoft checks $($g.Count) $catName settings in your Microsoft 365. $(if ($gaps.Count) { \"$($gaps.Count) still need attention.\" } else { 'All of them are in place.' }) Checked $asOf.</div></div><div style='display:flex;align-items:center;gap:10px;margin:12px 0 6px;padding:8px 12px;background:#E8F3F7;border:1px solid #B3D7E3;border-left:4px solid #B3C9D5;border-radius:10px'><span style='background:#001F54;color:#B3C9D5;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center'><i class='fal fa-list-check'></i></span><span style='font-size:15px;font-weight:600;color:#001F54'>Where we would start</span></div><ul style='margin:6px 0 0 18px;color:#001F54'>$items</ul><p style='margin:10px 0 0;font-size:13px;color:#001F54'><b>What we suggest:</b> these are the changes that raise your score the most. We will go through each one with you, make sure it will not disrupt anyone, and schedule the work. Reply on this card with any questions.</p>\"\n        $ex = $existingCards | Where-Object { [string]$_.subject -eq $subject } | Select-Object -First 1\n        try {\n            if ($ex) { $ops = @(@{ op = 'replace'; path = '/summary'; value = $summary }, @{ op = 'replace'; path = '/body'; value = $body }); $null = Invoke-RestMethod -Uri \"$crBase/v2/product/$($ex.productId)\" -Method PATCH -Headers @{ Authorization = $crAuth; Accept = 'application/json' } -ContentType 'application/json-patch+json' -Body (ConvertTo-Json -InputObject $ops -Depth 5); $catCards += \"Updated: $($subject)\" }\n            else { $null = Invoke-Cr -Method POST -Path '/v2/product' -Body @{ companyId = [int]$companyId; subject = $subject; summary = $summary; body = $body; category = 'Security'; productCategoryId = 6; isClientVisible = $true }; $catCards += \"Created: $($subject)\" }\n        } catch { $catCards += \"Could not save $($subject): $($_.Exception.Message)\" }\n    }\n}\n$coName = [string](Get-Prop $in 'companyName'); if (-not $coName) { $coName = 'Client' }\n$titleFinal = \"$coName Secure Score Assessment\"\n$summary = \"$($questions.Count) controls ($compliantCount compliant). Tenant score $tenantCur / $tenantMax.\"\n$facts = [ordered]@{ controls = $questions.Count; compliant = $compliantCount; tenantScore = \"$tenantCur / $tenantMax\" }\nfunction Send-ReviewOut { param($o) $r = [ordered]@{ plannerCards = $catCards; textSample = $textSample }; foreach ($k in $o.Keys) { $r[$k] = $o[$k] }; foreach ($k in $facts.Keys) { $r[$k] = $facts[$k] }; Set-NodeOutput $r }\n\nif ($mode -eq 'plan') {\n    $p = Sync-CrAssessment -CompanyId ([int]$companyId) -Title $titleFinal -Questions $questions.ToArray() -Preview\n    $what = if ($p.action -eq 'would-update') { \"refresh '$titleFinal' (assessmentId $($p.assessmentId)) in place\" } else { \"create '$titleFinal'\" }\n    Send-ReviewOut ([ordered]@{ status = 'plan'; message = \"DRY RUN - would $what with $($questions.Count) questions and add today's run. $summary\"; assessmentId = [int]$p.assessmentId })\n    return\n}\n$pctScore = if ([double]$tenantMax -gt 0) { [math]::Round(100 * [double]$tenantCur / [double]$tenantMax, 0) } else { 0 }\n$assessDescription = \"Microsoft Secure Score review for $coName from Microsoft 365, refreshed by the Microsoft Tenant Review. Tenant score on $(Get-Date -Format 'd MMMM yyyy'): $tenantCur of $tenantMax points ($pctScore%), with $compliantCount of $($questions.Count) security controls fully in place. Each question is one Microsoft Secure Score control, grouped by Identity, Device, Apps and Data. Compliant means Microsoft reports the control as fully implemented; Not compliant means points are still available. The score impact on each question shows how much fixing it raises the overall score.\"\n$assessRecommendations = \"Start with the highest-impact gaps in Identity (multi-factor authentication, admin account protection and legacy sign-in blocking), then work through Device, Apps and Data. The Microsoft 365 security cards on the Planner list the top fixes for each category. Run the Microsoft Tenant Review again after changes to update the score.\"\ntry {\n    # The portal names a run \"<assessment> - M/d/yy\". A second review on the same day gets \" (2)\", \" (3)\" and so on,\n    # so every review keeps its own snapshot.\n    $runBase = \"$titleFinal - $((Get-Date).ToString('M/d/yy', [Globalization.CultureInfo]::InvariantCulture))\"\n    $taken = @(@(Get-CrAll \"/v2/odata/assessment?`$filter=$([uri]::EscapeDataString(\"companyId eq $companyId\"))\") | Where-Object { -not (Get-Prop $_ 'isDeleted') } | ForEach-Object { ([string](Get-Prop $_ 'title')).Trim().ToLowerInvariant() })\n    $runName = $runBase; $n = 1\n    while ($taken -contains $runName.ToLowerInvariant()) { $n++; $runName = \"$runBase ($n)\" }\n    $r = Sync-CrAssessment -CompanyId ([int]$companyId) -Title $titleFinal -Questions $questions.ToArray() -Category 'Microsoft 365 Security' -Description $assessDescription -Recommendations $assessRecommendations -Visibility 2 -RemoveMissing -RunName $runName\n}\ncatch {\n    $m = \"Couldn't write the Secure Score assessment for companyId ${companyId}: $($_.Exception.Message)\"\n    Send-ReviewOut ([ordered]@{ status = 'error'; message = $m }); throw $m\n}\n$did = if ($r.action -eq 'created') { 'Created' } else { 'Refreshed' }\n$sc = if ($r.scores) { \" Assessment score $(Get-Prop $r.scores 'totalScore') of $(Get-Prop $r.scores 'maxScore').\" } else { '' }\nSend-ReviewOut ([ordered]@{ status = 'created'; message = \"$did assessment '$titleFinal' (assessmentId $($r.assessmentId)) with $($questions.Count) questions and added the run '$runName' (assessmentId $($r.runId)). $summary$sc\"; assessmentId = [int]$r.assessmentId; runId = [int]$r.runId; assessmentAction = $r.action; runName = $runName })"
        timeoutSeconds: 600
        retryCount: 0
        parameters:
          - name: companyId
            expression: '{{ nodes.trigger.output.company.id }}'
          - name: tenantId
            expression: '{{ nodes.trigger.output.company.tenantId }}'
          - name: companyName
            expression: '{{ nodes.trigger.output.company.name }}'
        aiExtensions: []
    - id: tenant-cards
      name: License and MFA review
      type: powershell-script
      position:
        x: 620
        'y': 120
      properties:
        script: "# =====================================================================\n#  Secure Score -> CloudRadial Assessment (deterministic, in-memory xlsx)\n#  Run input: {\"companyId\":123,\"tenantId\":\"<client Graph tenant GUID>\",\"assessmentTitle\":\"Microsoft Secure Score\",\"mode\":\"apply\"}\n#    companyId  - CloudRadial company the assessment is created under (required)\n#    tenantId   - the CLIENT's Entra tenant id to pull Secure Score from (required)\n#    mode       - \"apply\" (default) writes; \"plan\" previews only\n#  Secrets (runner Key Vault): CloudRadial-BaseUrl / -PublicKey / -PrivateKey,\n#    and M365-ClientID / M365-ClientSecret (an Entra app with\n#    SecurityEvents.Read.All application permission, consented in the client tenant).\n# =====================================================================\n$ErrorActionPreference = 'Stop'\n[System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor [System.Net.SecurityProtocolType]::Tls12\n\nfunction Get-Secret { param([string]$Name) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue }\nfunction Get-Prop { param($o,$n) if($null -eq $o){return $null}; if($o -is [System.Collections.IDictionary]){ if($o.Contains($n)){return $o[$n]}; return $null }; $p=$o.PSObject.Properties[$n]; if($p){return $p.Value}; return $null }\n\n# ---- run input ----\n$in = Get-NodeInput\n$t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }\nif ($in -is [string]) { $s = $in.Trim(); if ($s.StartsWith('{')) { $in = $s | ConvertFrom-Json } }\n$companyId = Get-Prop $in 'companyId'\n$tenantId  = Get-Prop $in 'tenantId'\n$title     = [string](Get-Prop $in 'assessmentTitle'); if ([string]::IsNullOrWhiteSpace($title)) { $title = 'Microsoft Secure Score' }\n$mode      = [string](Get-Prop $in 'mode'); if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'apply' }\nif ([string]::IsNullOrWhiteSpace([string]$tenantId) -or [string]$tenantId -match '^0{8}-') { Set-NodeOutput ([ordered]@{ status = 'skipped'; message = 'Microsoft 365 is not connected for this client (no tenant on the portal company), so the tenant review was skipped.' }); return }\nif (-not $companyId -or [string]::IsNullOrWhiteSpace([string]$tenantId)) {\n    $m = 'Need companyId (CloudRadial) and tenantId (the client Entra tenant). e.g. {\"companyId\":123,\"tenantId\":\"00000000-0000-0000-0000-000000000000\"}.'\n    Set-NodeOutput @{ status = 'error'; message = $m }; throw $m\n}\n\n# ---- secrets ----\n$crBaseRaw = Get-Secret 'CloudRadial-BaseUrl'; $pub = Get-Secret 'CloudRadial-PublicKey'; $prv = Get-Secret 'CloudRadial-PrivateKey'\n$appId = Get-Secret 'M365-ClientID'; $appSecret = Get-Secret 'M365-ClientSecret'\n$missing = foreach ($pair in @(\n    @{ n='CloudRadial-BaseUrl'; v=$crBaseRaw }, @{ n='CloudRadial-PublicKey'; v=$pub }, @{ n='CloudRadial-PrivateKey'; v=$prv },\n    @{ n='M365-ClientID'; v=$appId }, @{ n='M365-ClientSecret'; v=$appSecret }\n)) { if ([string]::IsNullOrWhiteSpace([string]$pair.v)) { $pair.n } }\nif (@($missing).Count -gt 0) { $m = \"Add these runner Key Vault secret(s) and re-run: $($missing -join ', ').\"; Set-NodeOutput @{ status='error'; message=$m }; throw $m }\n$crBase = ([string]$crBaseRaw).TrimEnd('/')\n$crAuth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(\"$pub`:$prv\"))\n\n# ---- CloudRadial helpers ----\nfunction Invoke-Cr {\n    param([string]$Method,[string]$Path,[object]$Body)\n    $u = if ($Path -match '^https?://') { $Path } else { \"$crBase$Path\" }\n    $h = @{ Authorization = $crAuth; Accept = 'application/json' }\n    $a = @{ Uri = $u; Method = $Method; Headers = $h; ContentType = 'application/json' }\n    if ($null -ne $Body) { $a.Body = ($Body | ConvertTo-Json -Depth 10) }\n    Invoke-RestMethod @a\n}\nfunction Get-CrAll {\n    param([string]$Path)\n    $all = @(); $skip = 0\n    for ($p = 0; $p -lt 500; $p++) {\n        $sep = if ($Path -match '\\?') { '&' } else { '?' }\n        $r = Invoke-Cr -Method GET -Path \"${Path}${sep}`$top=100&`$skip=$skip\"\n        $rows = if ($r.PSObject.Properties['value']) { @($r.value) } elseif ($r -is [System.Array]) { @($r) } else { @() }\n        $all += $rows\n        if (@($rows).Count -lt 100) { break }\n        $skip += 100\n    }\n    return $all\n}\nfunction Send-CrMultipart {\n    param([string]$Path,[string]$DataJson,[byte[]]$FileBytes,[string]$FileName)\n    Add-Type -AssemblyName System.Net.Http\n    $client = New-Object System.Net.Http.HttpClient\n    $client.DefaultRequestHeaders.Add('Authorization', $crAuth)\n    $form = New-Object System.Net.Http.MultipartFormDataContent\n    $form.Add((New-Object System.Net.Http.StringContent($DataJson, [Text.Encoding]::UTF8, 'application/json')), 'data')\n    $fc = New-Object System.Net.Http.ByteArrayContent(, $FileBytes)\n    $fc.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')\n    $form.Add($fc, 'file', $FileName)\n    $resp = $client.PostAsync(\"$crBase$Path\", $form).GetAwaiter().GetResult()\n    $text = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()\n    $client.Dispose()\n    if (-not $resp.IsSuccessStatusCode) { throw \"HTTP $([int]$resp.StatusCode): $text\" }\n    return $text\n}\n\n# ---- assessment template (51-col) + a 15-col working subset ----\n$Columns = @('Category','Question','Order','Explanation','Type','Answer','Text Answer','Responses','Is Flagged','Notes','Evaluation','Remediation Summary','Remediation','Reference','Partner Notes')\n$TemplateColumns = @('Partner Notes','Monthly Unit Cost','Project Unit Cost','Psa Board','Psa Item','Psa Status','Psa Category','Psa Sub Type','Psa Type','Psa Priority','Psa Source','Psa Estimated Time','Email List','Teams Webhook','Slack Webhook','Flow Webhook','Json Webhook','Script','Checklist','Category','Question','Order','Explanation','Type','Answer','Text Answer','Responses','Is Flagged','Notes','Evaluation','Remediation Summary','Remediation','Reference','Monthly Units','Monthly Unit Price','Project Units','Project Unit Price','Control Type','Likelihood','Risk','Risk Cost','Risk Impact','Owner','Updated by','Update Key','Content Update Key','Note Compliant','Note Partially Compliant','Note NA','Note Missing','Note Not Compliant')\nfunction ConvertTo-TemplateRows { param([object[]]$Rows)\n    $idx = @{}; for ($i = 0; $i -lt $Columns.Count; $i++) { $idx[$Columns[$i]] = $i }\n    $out = New-Object System.Collections.ArrayList\n    foreach ($r in $Rows) { $row = @($r); $null = $out.Add(@($TemplateColumns | ForEach-Object { if ($idx.ContainsKey($_)) { $row[$idx[$_]] } else { $null } })) }\n    return $out.ToArray()\n}\nfunction New-XlsxBytes {\n    param([string[]]$Header,[object[]]$Rows)\n    Add-Type -AssemblyName System.IO.Compression\n    $esc = { param($s) [System.Security.SecurityElement]::Escape([string]$s) }\n    $colName = { param([int]$n) $s=''; $n++; while ($n -gt 0) { $m = ($n-1) % 26; $s = [char](65 + $m) + $s; $n = [int][Math]::Floor(($n-1)/26) }; $s }\n    $sb = New-Object System.Text.StringBuilder\n    $null = $sb.Append('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetData>')\n    $all = @(, $Header) + $Rows\n    for ($r = 0; $r -lt $all.Count; $r++) {\n        $null = $sb.Append(\"<row r=\"\"$($r+1)\"\">\")\n        $row = @($all[$r])\n        for ($c = 0; $c -lt $row.Count; $c++) {\n            $ref = (& $colName $c) + ($r+1); $val = $row[$c]\n            if ($val -is [int] -or $val -is [long] -or $val -is [double]) { $null = $sb.Append(\"<c r=\"\"$ref\"\"><v>$val</v></c>\") }\n            elseif (-not [string]::IsNullOrEmpty([string]$val)) { $null = $sb.Append(\"<c r=\"\"$ref\"\" t=\"\"inlineStr\"\"><is><t xml:space=\"\"preserve\"\">$(& $esc $val)</t></is></c>\") }\n        }\n        $null = $sb.Append('</row>')\n    }\n    $null = $sb.Append('</sheetData></worksheet>')\n    $files = [ordered]@{\n        '[Content_Types].xml'        = '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/><Override PartName=\"/xl/worksheets/sheet1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/></Types>'\n        '_rels/.rels'                = '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/></Relationships>'\n        'xl/workbook.xml'            = '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets><sheet name=\"Assessment\" sheetId=\"1\" r:id=\"rId1\"/></sheets></workbook>'\n        'xl/_rels/workbook.xml.rels' = '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet1.xml\"/></Relationships>'\n        'xl/worksheets/sheet1.xml'   = $sb.ToString()\n    }\n    $ms = New-Object System.IO.MemoryStream\n    $zip = New-Object System.IO.Compression.ZipArchive($ms, [System.IO.Compression.ZipArchiveMode]::Create, $true)\n    foreach ($k in $files.Keys) { $entry = $zip.CreateEntry($k); $w = New-Object System.IO.StreamWriter($entry.Open(), (New-Object System.Text.UTF8Encoding($false))); $w.Write($files[$k]); $w.Dispose() }\n    $zip.Dispose()\n    return , $ms.ToArray()\n}\n\n\n# ==== Tenant review Planner cards: unused Microsoft 365 licenses and accounts without MFA ====\n$tok = (Invoke-RestMethod -Uri \"https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token\" -Method Post -ContentType 'application/x-www-form-urlencoded' -Body @{ grant_type = 'client_credentials'; client_id = $appId; client_secret = $appSecret; scope = 'https://graph.microsoft.com/.default' }).access_token\nif (-not $tok) { throw 'Could not get a Microsoft Graph token. Check the app id and secret, and that the app is consented in the client tenant.' }\n$gh = @{ Authorization = \"Bearer $tok\"; ConsistencyLevel = 'eventual' }\nfunction Get-GraphAll { param([string]$Url) $all = @(); $u = $Url; for ($i = 0; $i -lt 60 -and $u; $i++) { $r = Invoke-RestMethod -Uri $u -Headers $gh; $all += @($r.value); $nl = $r.PSObject.Properties['@odata.nextLink']; $u = if ($nl) { [string]$nl.Value } else { $null } }; return $all }\nfunction Enc { param($s) [System.Net.WebUtility]::HtmlEncode([string]$s) }\n$warn = @(); $cardNotes = @(); $asOf = (Get-Date).ToString('d MMM yyyy')\n# Licenses\n$skuNames = @{ 'SPB' = 'Microsoft 365 Business Premium'; 'O365_BUSINESS_PREMIUM' = 'Microsoft 365 Business Standard'; 'O365_BUSINESS_ESSENTIALS' = 'Microsoft 365 Business Basic'; 'O365_BUSINESS' = 'Microsoft 365 Apps for business'; 'OFFICESUBSCRIPTION' = 'Microsoft 365 Apps for enterprise'; 'ENTERPRISEPACK' = 'Office 365 E3'; 'ENTERPRISEPREMIUM' = 'Office 365 E5'; 'STANDARDPACK' = 'Office 365 E1'; 'SPE_E3' = 'Microsoft 365 E3'; 'SPE_E5' = 'Microsoft 365 E5'; 'SPE_F1' = 'Microsoft 365 F3'; 'EXCHANGESTANDARD' = 'Exchange Online (Plan 1)'; 'EXCHANGEENTERPRISE' = 'Exchange Online (Plan 2)'; 'AAD_PREMIUM' = 'Microsoft Entra ID P1'; 'AAD_PREMIUM_P2' = 'Microsoft Entra ID P2'; 'EMS' = 'Enterprise Mobility + Security E3'; 'POWER_BI_PRO' = 'Power BI Pro'; 'PROJECTPROFESSIONAL' = 'Project Plan 3'; 'VISIOCLIENT' = 'Visio Plan 2'; 'ATP_ENTERPRISE' = 'Defender for Office 365 (Plan 1)'; 'Microsoft_Teams_Premium' = 'Teams Premium'; 'MCOEV' = 'Teams Phone Standard' }\n$skus = @(); try { $skus = Get-GraphAll 'https://graph.microsoft.com/v1.0/subscribedSkus' } catch { $warn += \"Licenses were not read: $($_.Exception.Message) The app needs Organization.Read.All (application) with admin consent.\" }\n$unused = @($skus | Where-Object { [string]$_.capabilityStatus -eq 'Enabled' -and [string]$_.appliesTo -eq 'User' } | ForEach-Object { $en = [int]$_.prepaidUnits.enabled; $used = [int]$_.consumedUnits; $p = [string]$_.skuPartNumber; [pscustomobject]@{ name = $(if ($skuNames.ContainsKey($p)) { $skuNames[$p] } else { $p }); enabled = $en; used = $used; free = ($en - $used) } } | Where-Object { $_.free -gt 0 -and $_.enabled -lt 1000 -and $_.name -notmatch '(?i)free|trial|viral' } | Sort-Object free -Descending)\n$freeTotal = [int](($unused | Measure-Object free -Sum).Sum)\n# MFA\n$noMfa = @(); $mfaSource = ''\ntry { $reg = Get-GraphAll \"https://graph.microsoft.com/v1.0/reports/authenticationMethods/userRegistrationDetails?`$filter=isMfaRegistered eq false\"; $noMfa = @($reg | Where-Object { [string]$_.userType -ne 'guest' } | ForEach-Object { [pscustomobject]@{ name = [string]$_.userDisplayName; upn = [string]$_.userPrincipalName; admin = [bool]$_.isAdmin } }); $mfaSource = 'Microsoft Entra MFA registration report' }\ncatch {\n    try { $users = @(Get-GraphAll \"https://graph.microsoft.com/v1.0/users?`$filter=accountEnabled eq true and userType eq 'Member'&`$select=id,displayName,userPrincipalName,assignedLicenses&`$top=999&`$count=true\")\n        $users = @($users | Where-Object { @($_.assignedLicenses).Count -gt 0 } | Select-Object -First 300)\n        foreach ($u in $users) { $m = @((Invoke-RestMethod -Uri \"https://graph.microsoft.com/v1.0/users/$($u.id)/authentication/methods\" -Headers $gh).value); $strong = @($m | Where-Object { [string]$_.'@odata.type' -notmatch 'passwordAuthenticationMethod' }); if (-not $strong.Count) { $noMfa += [pscustomobject]@{ name = [string]$u.displayName; upn = [string]$u.userPrincipalName; admin = $false } } }\n        $mfaSource = 'sign-in methods on each licensed account'\n    } catch { $warn += \"MFA was not checked: $($_.Exception.Message) The app needs AuditLog.Read.All, or UserAuthenticationMethod.Read.All, as application permissions with admin consent.\" }\n}\n$noMfa = @($noMfa | Sort-Object @{ Expression = { -not $_.admin } }, name)\n\n# Stale accounts: enabled, licensed accounts with no sign-in for 90+ days (or never, when older than 30 days)\n$stale = @(); $staleSource = ''; $staleDays = 90; $cut = (Get-Date).ToUniversalTime().AddDays(-$staleDays)\ntry {\n    $su = @(Get-GraphAll \"https://graph.microsoft.com/v1.0/users?`$filter=accountEnabled eq true and userType eq 'Member'&`$select=displayName,userPrincipalName,createdDateTime,assignedLicenses,signInActivity&`$top=120\")\n    foreach ($u in $su) { if (-not @($u.assignedLicenses).Count) { continue }\n        $last = $null; $sa = $u.signInActivity; if ($sa) { foreach ($k in @('lastSuccessfulSignInDateTime', 'lastSignInDateTime', 'lastNonInteractiveSignInDateTime')) { $vv = $sa.$k; if ($vv) { $d = [datetime]$vv; if (-not $last -or $d -gt $last) { $last = $d } } } }\n        $created = if ($u.createdDateTime) { [datetime]$u.createdDateTime } else { $null }\n        if (($last -and $last -lt $cut) -or (-not $last -and $created -and $created -lt (Get-Date).ToUniversalTime().AddDays(-30))) { $stale += [pscustomobject]@{ name = [string]$u.displayName; upn = [string]$u.userPrincipalName; last = $(if ($last) { $last.ToString('d MMM yyyy') } else { 'Never' }); days = $(if ($last) { [int]((Get-Date).ToUniversalTime() - $last).TotalDays } else { 9999 }) } } }\n    $staleSource = 'Microsoft Entra sign-in activity'\n} catch {\n    $siErr = $_.Exception.Message\n    try { $csv = Invoke-RestMethod -Uri \"https://graph.microsoft.com/v1.0/reports/getOffice365ActiveUserDetail(period='D180')\" -Headers $gh\n        $rows = @([string]$csv -replace '^\uFEFF', '' | ConvertFrom-Csv)\n        foreach ($r in $rows) { $isDel = ($r.PSObject.Properties | Where-Object { $_.Name -eq 'Is Deleted' } | Select-Object -First 1).Value; $prods = ($r.PSObject.Properties | Where-Object { $_.Name -eq 'Assigned Products' } | Select-Object -First 1).Value; if ([string]$isDel -eq 'True' -or -not [string]$prods) { continue }\n            $d = $null; foreach ($pp in $r.PSObject.Properties) { if ($pp.Name -match 'Last Activity Date$' -and [string]$pp.Value) { $dd = [datetime][string]$pp.Value; if (-not $d -or $dd -gt $d) { $d = $dd } } }\n            if (-not $d -or $d -lt $cut) { $stale += [pscustomobject]@{ name = [string]$r.'Display Name'; upn = [string]$r.'User Principal Name'; last = $(if ($d) { $d.ToString('d MMM yyyy') } else { 'No activity in 180 days' }); days = $(if ($d) { [int]((Get-Date) - $d).TotalDays } else { 9999 }) } } }\n        $staleSource = 'Microsoft 365 active user report'; $warn += \"Sign-in activity was not available ($siErr), so the Microsoft 365 active user report was used instead.\"\n    } catch { $warn += \"Stale accounts were not checked: $($_.Exception.Message) The app needs AuditLog.Read.All (with Entra ID P1) or Reports.Read.All, as application permissions with admin consent.\" }\n}\n$stale = @($stale | Sort-Object days -Descending)\n# Card helpers (branded, updated in place)\nfunction New-Banner { param([string]$Icon, [string]$Big, [string]$Unit, [string]$Title, [string]$Sub) \"<div style='background:linear-gradient(135deg,#001F54 0%,#09507B 55%,#1282A2 100%);color:#fff;padding:16px 20px;border-radius:12px;border-left:6px solid #B3C9D5;box-shadow:0 4px 14px rgba(0,31,84,.3);display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 12px;'><div style='background:#fff;color:#001F54;border-radius:10px;min-width:64px;padding:8px 10px;text-align:center;'><div style='font-size:26px;font-weight:700;line-height:1;'>$(Enc $Big)</div><div style='font-size:11px;text-transform:uppercase;letter-spacing:.04em;'>$(Enc $Unit)</div></div><div style='flex:1;min-width:200px;'><div style='font-size:19px;font-weight:600;'><i class='fal $Icon' style='color:#B3C9D5;'></i>&nbsp; $(Enc $Title)</div><div style='font-size:14px;opacity:.9;margin-top:4px;'>$(Enc $Sub)</div></div></div>\" }\nfunction New-Head { param([string]$Icon, [string]$Text) \"<div style='display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:8px 12px;background:#E8F3F7;border:1px solid #B3D7E3;border-left:4px solid #B3C9D5;border-radius:10px;'><span style='background:#001F54;color:#B3C9D5;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;'><i class='fal $Icon'></i></span><span style='font-size:15px;font-weight:600;color:#001F54;'>$(Enc $Text)</span></div>\" }\nfunction New-Tbl { param([string[]]$Head, [object[]]$Rows) $th = ($Head | ForEach-Object { \"<th style='background:#001F54;color:#fff;text-align:left;padding:7px 9px;font-size:12px;'>$(Enc $_)</th>\" }) -join ''; $n = 0; $tr = foreach ($r in $Rows) { $n++; $bg = if ($n % 2) { '#FFFFFF' } else { '#E8F3F7' }; \"<tr style='background:$bg;'>\" + ((@($r) | ForEach-Object { \"<td style='padding:6px 9px;font-size:13px;color:#001F54;border-bottom:1px solid #B3D7E3;'>$_</td>\" }) -join '') + '</tr>' }; \"<div style='border:1px solid #B3D7E3;border-radius:10px;overflow:hidden;margin:6px 0;'><table style='width:100%;border-collapse:collapse;'><tr>$th</tr>$($tr -join '')</table></div>\" }\n$existing = @(); try { $existing = @(Get-CrAll \"/v2/odata/product?`$filter=companyId eq $companyId\") } catch { }\nfunction Save-Card { param([string]$Subject, [string]$Summary, [string]$Body, [string]$Category, [int]$CatId)\n    $oldSubject = $Subject -replace 'nses$', 'nces'\n    $ex = $existing | Where-Object { [string]$_.subject -eq $Subject -or [string]$_.subject -eq $oldSubject } | Select-Object -First 1\n    try {\n        if ($ex) { $ops = @(@{ op = 'replace'; path = '/subject'; value = $Subject }, @{ op = 'replace'; path = '/summary'; value = $Summary }, @{ op = 'replace'; path = '/body'; value = $Body }); $null = Invoke-RestMethod -Uri \"$crBase/v2/product/$($ex.productId)\" -Method PATCH -Headers @{ Authorization = $crAuth; Accept = 'application/json' } -ContentType 'application/json-patch+json' -Body (ConvertTo-Json -InputObject $ops -Depth 5); return \"Updated: $Subject\" }\n        else { $null = Invoke-Cr -Method POST -Path '/v2/product' -Body @{ companyId = [int]$companyId; subject = $Subject; summary = $Summary; body = $Body; category = $Category; productCategoryId = $CatId; isClientVisible = $true }; return \"Created: $Subject\" }\n    } catch { return \"Could not save $($Subject): $($_.Exception.Message)\" }\n}\nif ($mode -eq 'apply') {\n    if ($skus.Count) {\n        $lsum = if ($freeTotal) { \"You are paying for $freeTotal Microsoft 365 license$(if ($freeTotal -ne 1) { 's' }) that nobody is using.\" } else { 'Every Microsoft 365 license you pay for is in use.' }\n        $lTitle = if ($freeTotal) { \"You have $freeTotal license$(if ($freeTotal -ne 1) { 's' }) nobody is using\" } else { 'Every license is in use' }\n        $lbody = (New-Banner 'fa-id-card' ([string]$freeTotal) 'spare' $lTitle \"We checked your Microsoft 365 subscriptions on $asOf.\") +\n            $(if ($unused.Count) { (New-Head 'fa-list-check' 'Where the spare licenses are') + (New-Tbl @('Subscription', 'You pay for', 'In use', 'Spare') @($unused | ForEach-Object { ,@((Enc $_.name), $_.enabled, $_.used, \"<b>$($_.free)</b>\") })) + \"<p style='font-size:13px;color:#001F54;margin:10px 0 0;'><b>What we suggest:</b> before buying licenses for new starters, we will use these spares first. If you do not expect to grow into them, we can lower the count at your next renewal so you stop paying for them. Just reply on this card and we will take care of it.</p>\" } else { \"<p style='font-size:13px;color:#001F54;'>Nice work: there is nothing to reclaim. We will keep an eye on this at every review.</p>\" })\n        $cardNotes += Save-Card 'Unused Microsoft 365 licenses' $lsum $lbody 'Efficiency' 7\n    }\n    if ($mfaSource) {\n        $admins = @($noMfa | Where-Object { $_.admin }).Count; $nm = $noMfa.Count\n        $msum = if ($nm) { \"$nm $(if ($nm -eq 1) { 'person' } else { 'people' }) can still sign in with just a password$(if ($admins) { \", including $admins admin account$(if ($admins -ne 1) { 's' })\" }).\" } else { 'Everyone is protected with multi-factor authentication.' }\n        $mTitle = if ($nm) { \"$nm account$(if ($nm -ne 1) { 's are' } else { ' is' }) not protected by MFA\" } else { 'Everyone is protected by MFA' }\n        $rows = @($noMfa | Select-Object -First 25 | ForEach-Object { ,@((Enc $_.name), (Enc $_.upn), $(if ($_.admin) { \"<span style='background:#C2410C;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;'>ADMIN</span>\" } else { 'User' })) })\n        $mbody = (New-Banner 'fa-user-lock' ([string]$nm) $(if ($nm -eq 1) { 'account' } else { 'accounts' }) $mTitle \"Multi-factor authentication (MFA) stops most account takeovers. We checked every licensed account on $asOf.\") +\n            $(if ($nm) { (New-Head 'fa-list-check' 'Who needs to set up MFA') + (New-Tbl @('Name', 'Sign-in', 'Role') $rows) + $(if ($nm -gt 25) { \"<p style='font-size:12px;color:#09507B;'>Showing 25 of $nm.</p>\" } else { '' }) + \"<p style='font-size:13px;color:#001F54;margin:10px 0 0;'><b>What we suggest:</b> we will help each person set up the Microsoft Authenticator app, which takes about five minutes, starting with any admin accounts. Then we will turn on a policy that requires MFA for everyone, so new accounts are protected from day one. Let us know a good time and we will walk them through it.</p>\" } else { \"<p style='font-size:13px;color:#001F54;'>Great job: every account has a second sign-in step set up. We will keep checking at every review.</p>\" })\n        $cardNotes += Save-Card 'Accounts without MFA' $msum $mbody 'Security' 6\n    }\n    if ($staleSource) {\n        $ns = $stale.Count\n        $ssum = if ($ns) { \"$ns account$(if ($ns -ne 1) { 's have' } else { ' has' }) not been used in over $staleDays days but still hold$(if ($ns -eq 1) { 's' }) a license.\" } else { \"Every licensed account has been used in the last $staleDays days.\" }\n        $sTitle = if ($ns) { \"$ns account$(if ($ns -ne 1) { 's' }) nobody has used in $staleDays days\" } else { 'No stale accounts' }\n        $srows = @($stale | Select-Object -First 25 | ForEach-Object { ,@((Enc $_.name), (Enc $_.upn), (Enc $_.last)) })\n        $sbody = (New-Banner 'fa-user-clock' ([string]$ns) $(if ($ns -eq 1) { 'account' } else { 'accounts' }) $sTitle \"Accounts that stay licensed after someone leaves cost money every month and are an easy way in for attackers. Checked $asOf from the $staleSource.\") +\n            $(if ($ns) { (New-Head 'fa-list-check' 'Accounts to review') + (New-Tbl @('Name', 'Sign-in', 'Last used') $srows) + $(if ($ns -gt 25) { \"<p style='font-size:12px;color:#09507B;'>Showing 25 of $ns.</p>\" } else { '' }) + \"<p style='font-size:13px;color:#001F54;margin:10px 0 0;'><b>What we suggest:</b> tell us which of these people have left or no longer need an account. We will block sign-in, keep their mailbox and files where you need them, and take back the license so you stop paying for it.</p>\" } else { \"<p style='font-size:13px;color:#001F54;'>Nice: every licensed account is in use. We will keep checking at every review.</p>\" })\n        $cardNotes += Save-Card 'Stale Microsoft 365 accounts' $ssum $sbody 'Efficiency' 7\n    }\n}\n$msg = \"Tenant review: $freeTotal unused license$(if ($freeTotal -ne 1) { 's' }), $($noMfa.Count) account$(if ($noMfa.Count -ne 1) { 's' }) without MFA, $($stale.Count) stale account$(if ($stale.Count -ne 1) { 's' }).\"\nSet-NodeOutput ([ordered]@{ status = $(if ($warn.Count) { 'warning' } else { 'success' }); message = $msg; plannerCards = $cardNotes; unusedLicences = $unused; accountsWithoutMfa = @($noMfa | Select-Object -First 50); staleAccounts = @($stale | Select-Object -First 50); staleSource = $staleSource; warnings = $warn })"
