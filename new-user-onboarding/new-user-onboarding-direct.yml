        $body = [ordered]@{
            accountEnabled = $true; displayName = F 'displayName'; givenName = F 'firstName'; surname = F 'lastName'
            mailNickname = [string]$state['mailNickname']; userPrincipalName = [string]$state['upn']; usageLocation = F 'usageLocation'
            passwordProfile = @{ password = $tempPassword; forceChangePasswordNextSignIn = $true }
