        if ((F 'department') -ne '') { $body['department'] = F 'department' }
        if ((F 'officeLocation') -ne '') { $body['officeLocation'] = F 'officeLocation' }
        try { $u = Invoke-Graph 'Post' '/v1.0/users' $body $H }
