        # <<< _shared/psa.ps1

        $state = Read-State
        if ([string]$state['status'] -ne 'ok') { Set-NodeOutput $state; return }
        $f = $state['fields']
        function F { param($n) return [string](Get-Prop $f $n) }

        # --- PSA ticket ---
        if (-not [string]$state['ticketId']) {
            $psaType = ''
            try { $psaType = Get-PsaType (F 'psa') } catch { Add-To $state 'warnings' $_.Exception.Message }
            if (-not $psaType) { Add-To $state 'followUp' "No ticket was given and no PSA is set up (add the PSA-Type secret and that PSA's secrets), so no ticket was created. Log the onboarding by hand." }
            else {
                $psaName = $PsaState.Names[$psaType]
                $coId = ''; $queue = ''; $made = $null; $connected = $false
                try { $null = Connect-Psa $psaType; $connected = $true } catch { Add-To $state 'followUp' "No ticket was given and $psaName couldn't be reached, so no ticket was created: $($_.Exception.Message)" }
                if ($connected) {
                    # The company: a PSA company id, a ConnectWise identifier, or the exact company name.
                    try {
                        $coIn = F 'companyPsaId'
                        if ($coIn -match '^\d+$') { $coId = $coIn }
                        elseif ($coIn -and $psaType -eq 'connectwise') {
                            $q = $coIn.Replace('\', '\\').Replace('"', '\"')
                            $rows = @(Invoke-PsaRead "/company/companies?conditions=$(ConvertTo-PsaQuery ('identifier="' + $q + '"'))&pageSize=5&fields=id" 'read companies' 'read companies' | Where-Object { $null -ne $_ })
                            if ($rows.Count) { $coId = [string](Get-PsaProp $rows[0] 'id') }
                        }
                        if (-not $coId -and (F 'companyName')) { $coId = [string](Resolve-PsaCompanyId (F 'companyName')).id }
                    } catch { Add-To $state 'warnings' "$psaName company lookup failed: $($_.Exception.Message)" }
                    if (-not $coId) { Add-To $state 'followUp' "The $psaName company could not be matched, so no ticket was created. Log the onboarding by hand." }
                    else {
                        $queue = [string](Get-PsaSecret 'PSA-ServiceQueue')
                        if (-not $queue -and $psaType -eq 'connectwise') { $queue = [string](Get-PsaSecret 'CW-ServiceBoard') }
                        $summary = "New user onboarding: $(F 'displayName')"
                        $desc = "New starter $(F 'displayName') ($($state['upn'])). Start date: $(if ((F 'startDate')) { F 'startDate' } else { 'not given' }). Requested by: $(if ((F 'submittedByUpn')) { F 'submittedByUpn' } else { 'unknown' }). Device: $(if ((F 'deviceType')) { F 'deviceType' } else { 'not requested' })."
                        try { $made = New-PsaTicket -CompanyId $coId -Summary $summary -Description $desc -Queue $queue }
                        catch { Add-To $state 'followUp' "$psaName didn't accept the new ticket: $($_.Exception.Message)" }
                    }
                }
                if ($made) { $state['ticketId'] = [string]$made.id; Add-To $state 'actions' "Created $psaName ticket $($made.id)$(if ($queue) { " on $queue" })" }
                foreach ($w in @($PsaState.Warnings)) { Add-To $state 'warnings' $w }
            }
        }

        # --- Notify the manager (optional) ---
        $mgr = [string]$state['managerMail']
        if ($mgr) {
            $sender = Get-KvSecret @('Onboarding-NotifySender')
            if (-not $sender) { Add-To $state 'followUp' "The manager ($mgr) was not emailed. Add an Onboarding-NotifySender secret (a mailbox to send from) to turn this on." }
            else {
                $text = "Hello,`n`nA Microsoft 365 account has been created for your new starter, $(F 'displayName').`n`nSign-in name: $($state['upn'])`nStart date: $(if ((F 'startDate')) { F 'startDate' } else { 'not given' })`n`nYour IT team will share the first sign-in details securely before the start date.$(if ([string]$state['ticketId']) { " Reference: ticket $($state['ticketId'])." })"
                $mail = @{ message = @{ subject = "Account ready for $(F 'displayName')"; body = @{ contentType = 'Text'; content = $text }; toRecipients = @(@{ emailAddress = @{ address = $mgr } }) }; saveToSentItems = $false }
                try {
                    $H = Get-GraphHeaders
                    Invoke-RestMethod -Method Post -Uri "https://graph.microsoft.com/v1.0/users/$([uri]::EscapeDataString($sender))/sendMail" -Headers $H -Body ($mail | ConvertTo-Json -Depth 8) | Out-Null
                    Add-To $state 'actions' "Emailed the manager ($mgr) that the account is ready"
                } catch { Add-To $state 'followUp' "Couldn't email the manager ($mgr): $($_.Exception.Message)" }
            }
        }
        Set-NodeOutput $state
      timeoutSeconds: 300
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: node-finish
    name: Internal note and result
    type: powershell-script
    position:
      x: 1360
