automationsWorkflow: 1
name: Password Expiry Reminder
description: 'Daily check of Microsoft 365 passwords. Emails each person whose password expires in 14, 7 or 1 days with the date and how to change it, so nobody is locked out. Cloud accounts only: accounts synced from on-premises Active Directory are listed in warnings, never emailed. Run with preview true first. No AI.'
definition:
  schemaVersion: 1
  activities:
  - id: start
    name: Start
    type: start
    position:
      x: 100
      y: 200
    properties:
      # Manual run or daily Routine: the first step reads Get-NodeInput, so the webhook stays off.
      webhookEnabled: false
  - id: node-inputs
    name: Read inputs
    type: powershell-script
    position:
      x: 280
      y: 200
    properties:
      script: |-
        # ---------- src/common.ps1: helpers shared by the Password Expiry Reminder steps ----------
        # Pasted into every step by src/build.js. Needs no other file. Every name starts with Pe so it can't clash
        # with the _shared libraries. Run-wide state is one ordered hashtable that the steps change in place, because
        # the runner runs each step in a child scope where $script: variables don't behave.

        function Get-PeProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }

        # The first non-empty value among Names, as trimmed text. A list is joined with commas. A value CloudRadial
        # left as a literal @token (for example "@resetUrl") counts as not given.
        function Get-PeText {
            param($o, [string[]]$Names)
            foreach ($n in $Names) {
                $v = Get-PeProp $o $n
                if ($null -eq $v) { continue }
                if ($v -is [array]) { $v = (@($v | Where-Object { $null -ne $_ } | ForEach-Object { [string]$_ }) -join ',') }
                $t = ([string]$v).Trim()
                if ($t -ne '' -and -not $t.StartsWith('@')) { return $t }
            }
            return ''
        }

        # The first runner Key Vault secret among Names that has a value, or ''.
        function Get-PeSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return ([string]$v).Trim() } }; return '' }

        # A date from Graph (a DateTime or an ISO string) as UTC, or $null.
        function ConvertTo-PeDate {
            param($v)
            if ($null -eq $v) { return $null }
            if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }
            $t = [string]$v; if ([string]::IsNullOrWhiteSpace($t)) { return $null }
            $d = [datetime]::MinValue
            if ([datetime]::TryParse($t, [Globalization.CultureInfo]::InvariantCulture, ([Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal), [ref]$d)) { return $d }
            return $null
        }

        # A date as yyyy-MM-ddTHH:mm:ssZ. The runner turns ISO text into a DateTime between steps, so format it again.
        function Format-PeIso { param($v) $d = ConvertTo-PeDate $v; if ($null -eq $d) { return '' }; return $d.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture) }

        function New-PeCounts {
            return [ordered]@{ checked = 0; expiringSoon = 0; due = 0; emailed = 0; alreadySentToday = 0; failed = 0; skippedSynced = 0; skippedNeverExpires = 0; skippedDisabled = 0; skippedGuests = 0; skippedNoMail = 0; skippedOther = 0; alreadyExpired = 0 }
        }

        # An object from the previous step's JSON as an ordered hashtable, one level deep.
        function ConvertTo-PeHash {
            param($o)
            $h = [ordered]@{}
            if ($null -eq $o) { return $h }
            if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] }; return $h }
            foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
            return $h
        }

        # The run state handed on by the step before, with every key this workflow reads filled in.
        function Read-PeState {
            $raw = Get-NodeInput
            if ($raw -is [string]) { try { $raw = $raw | ConvertFrom-Json } catch { $raw = $null } }
            if ($null -ne $raw -and $null -eq (Get-PeProp $raw 'inputs') -and $null -ne (Get-PeProp $raw 'output')) { $raw = Get-PeProp $raw 'output' }
            $st = ConvertTo-PeHash $raw
            if (-not $st.Contains('inputs') -or $null -eq $st['inputs']) { throw 'This step needs the output of the step before it. Run the workflow from the start.' }
            foreach ($k in @('status', 'message', 'tenant_id', 'checked_at', 'sent_via')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('due', 'emailed', 'skipped', 'actions', 'warnings')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k] | Where-Object { $null -ne $_ }) } }
            if (-not $st.Contains('done')) { $st['done'] = $false }
            $c = New-PeCounts
            if ($st.Contains('counts') -and $null -ne $st['counts']) { foreach ($k in @($c.Keys)) { $v = Get-PeProp $st['counts'] $k; if ($null -ne $v) { $c[$k] = [int]$v } } }
            $st['counts'] = $c
            return $st
        }

        # Ends the run: writes the state with the status and message, then throws so the run shows as failed.
        function Stop-PeRun {
            param($St, [string]$Status, [string]$Msg)
            $St['status'] = $Status; $St['message'] = $Msg
            Set-NodeOutput $St
            throw $Msg
        }

        # "a, b, c and 4 more" for a warning or message.
        function Join-PeNames { param($Names, [int]$Max = 10) $all = @($Names | Where-Object { $_ }); if ($all.Count -le $Max) { return ($all -join ', ') }; return ((@($all | Select-Object -First $Max) -join ', ') + " and $($all.Count - $Max) more") }
        function Get-PePlural { param([int]$n, [string]$One, [string]$Many) if ($n -eq 1) { return "1 $One" }; return "$n $Many" }
        # ---------- end src/common.ps1 ----------

        # === NODE: Read inputs ===
        # Reads the run input and fills in defaults. A daily Routine sends no input, so every field is optional:
        #   daysBeforeExpiry   days before expiry on which a reminder goes out (default "14,7,1"; a comma list or a JSON list, 0 to 365)
        #   preview            true = list who would be emailed and send nothing (default false; dryRun and dry_run work too)
        #   catchUpDays        how many days back a run looks for a reminder day it may have missed (default 1 = today only, 1 to 30)
        #   resetUrl           the page the email links to (default: the PasswordExpiry-ResetUrl secret, else https://passwordreset.microsoftonline.com/)
        #   timeZone           the time zone used for "today" and the expiry date in the email (default: the PasswordExpiry-TimeZone secret, else UTC)
        #   onlyUsers          sign-in names, email addresses or object ids to limit the run to, for testing (default: everyone)
        #   company_tenant_id  optional Microsoft 365 tenant id; when given it must be this runner's tenant (M365-TenantId)
        # Bad input stops the run with a plain sentence and nothing is read or sent.
        $ErrorActionPreference = 'Stop'
        function Stop-PeInput {
            param([string]$Msg)
            Set-NodeOutput ([ordered]@{ status = 'incomplete'; message = $Msg; counts = (New-PeCounts); due = @(); emailed = @(); skipped = @(); actions = @(); warnings = @() })
            throw $Msg
        }

        $runIn = Get-NodeInput
        foreach ($k in @('trigger', 'body', 'input')) { $w = Get-PeProp $runIn $k; if ($null -ne $w) { $runIn = $w } }
        if ($runIn -is [string]) {
            if ([string]::IsNullOrWhiteSpace($runIn)) { $runIn = $null }
            else { try { $runIn = $runIn | ConvertFrom-Json } catch { Stop-PeInput 'The run input is text that is not valid JSON. No email was sent.' } }
        }
        $warnings = @()

        # Reminder days, largest first.
        $thrText = Get-PeText $runIn @('daysBeforeExpiry', 'days_before_expiry', 'reminderDays', 'reminder_days')
        if ($thrText -eq '') { $thrText = '14,7,1' }
        $thr = @()
        foreach ($part in ($thrText.Trim().TrimStart('[').TrimEnd(']') -split '[,;\s]+')) {
            $t = $part.Trim().Trim('"', "'")
            if ($t -eq '') { continue }
            if ($t -notmatch '^\d+$' -or [int64]$t -gt 365) { Stop-PeInput "daysBeforeExpiry must be whole numbers from 0 to 365, for example 14,7,1 (it was '$thrText'). No email was sent." }
            if ($thr -notcontains [int]$t) { $thr += [int]$t }
        }
        if (-not $thr.Count) { Stop-PeInput 'daysBeforeExpiry has no days in it. Use whole numbers, for example 14,7,1. No email was sent.' }
        $thr = @($thr | Sort-Object -Descending)

        $prevText = Get-PeText $runIn @('preview', 'dryRun', 'dry_run')
        $preview = $false
        if ($prevText -ne '') {
            $pv = $prevText.ToLowerInvariant()
            if (@('true', 'yes', 'y', '1') -contains $pv) { $preview = $true }
            elseif (@('false', 'no', 'n', '0') -notcontains $pv) { Stop-PeInput "preview must be true or false (it was '$prevText'). No email was sent." }
        }

        $catchText = Get-PeText $runIn @('catchUpDays', 'catch_up_days')
        $catchUp = 1
        if ($catchText -ne '') {
            if ($catchText -notmatch '^\d+$' -or [int64]$catchText -lt 1 -or [int64]$catchText -gt 30) { Stop-PeInput "catchUpDays must be a whole number from 1 to 30 (it was '$catchText'). No email was sent." }
            $catchUp = [int]$catchText
        }

        $resetUrl = Get-PeText $runIn @('resetUrl', 'reset_url')
        $resetFrom = 'input'
        if ($resetUrl -eq '') { $resetUrl = Get-PeSecret @('PasswordExpiry-ResetUrl'); $resetFrom = 'the PasswordExpiry-ResetUrl secret' }
        if ($resetUrl -eq '') { $resetUrl = 'https://passwordreset.microsoftonline.com/'; $resetFrom = 'default' }
        if ($resetUrl -notmatch '^https://[^\s<>"]+$') { Stop-PeInput "resetUrl (from $resetFrom) must be a web address starting with https:// (it was '$resetUrl'). No email was sent." }

        $tzText = Get-PeText $runIn @('timeZone', 'time_zone')
        if ($tzText -eq '') { $tzText = Get-PeSecret @('PasswordExpiry-TimeZone') }
        if ($tzText -eq '') { $tzText = 'UTC' }
        try { $null = [TimeZoneInfo]::FindSystemTimeZoneById($tzText) }
        catch { Stop-PeInput "timeZone '$tzText' isn't a time zone this runner knows. Use a name such as UTC, Eastern Standard Time or America/New_York. No email was sent." }

        $only = @()
        foreach ($part in ((Get-PeText $runIn @('onlyUsers', 'only_users')) -split '[,;\s]+')) {
            $t = $part.Trim().Trim('"', "'", '[', ']')
            if ($t -eq '') { continue }
            if ($t -match '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$' -or $t -match '^[^@\s]+@[^@\s]+$') { if ($only -notcontains $t.ToLowerInvariant()) { $only += $t.ToLowerInvariant() } }
            else { $warnings += "Ignored '$t' in onlyUsers: it is neither a sign-in name, an email address nor a user object id." }
        }
        if ((Get-PeText $runIn @('onlyUsers', 'only_users')) -ne '' -and -not $only.Count) { Stop-PeInput 'onlyUsers was given but has no valid sign-in name, email address or user object id in it, so the run stopped rather than email everyone. No email was sent.' }

        $tenantIn = (Get-PeText $runIn @('company_tenant_id', 'companyTenantId', 'CompanyTenantId', 'tenant_id', 'tenantId')).ToLowerInvariant()
        if ($tenantIn -ne '' -and $tenantIn -notmatch '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$') { Stop-PeInput "company_tenant_id must be a Microsoft 365 tenant id (a GUID). It was '$tenantIn'. No email was sent." }

        Set-NodeOutput ([ordered]@{
                status     = 'running'
                message    = ''
                preview    = $preview
                done       = $false
                tenant_id  = ''
                checked_at = ''
                sent_via   = ''
                counts     = (New-PeCounts)
                due        = @()
                emailed    = @()
                skipped    = @()
                actions    = @()
                warnings   = @($warnings)
                inputs     = [ordered]@{
                    daysBeforeExpiry  = @($thr)
                    preview           = $preview
                    catchUpDays       = $catchUp
                    resetUrl          = $resetUrl
                    timeZone          = $tzText
                    onlyUsers         = @($only)
                    company_tenant_id = $tenantIn
                }
            })
      timeoutSeconds: 120
      retryCount: 0
      parameters: []
      aiExtensions: []
      testInput: |-
        {
          "preview": true,
          "daysBeforeExpiry": "14,7,1",
          "onlyUsers": ""
        }
  - id: node-find
    name: Find passwords that expire soon
    type: powershell-script
    position:
      x: 480
      y: 200
    properties:
      script: |-
        # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
        # Edit this file, then run: node _shared/inject.js <automation-folder>
        # Signs in with the app registration's client credentials from the runner Key Vault.
        # Each helper names the Graph application permission it needs; when Graph answers 403,
        # the error says which permission to grant (with admin consent).
        # All state lives in the $GraphState hashtable and is changed in place, because the runner
        # runs a step in a child scope where $script: variables don't behave.

        $GraphState = @{
            Base           = 'https://graph.microsoft.com'
            Headers        = $null
            Creds          = $null
            TenantId       = ''
            ExpiresAt      = [datetime]::MinValue
            MaxAttempts    = 5
            MaxWaitSeconds = 120
            LastStatus     = 0
        }

        # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
        # The first secret that has a value, from a list of names.
        function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
        function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
        function Get-GraphRetryAfter {
            param($Err, [int]$Attempt)
            $s = 0
            try {
                $ra = $Err.Exception.Response.Headers.RetryAfter
                if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
            } catch { }
            if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
            return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
        }
        # Graph's own error message when there is one, otherwise the exception text.
        function Get-GraphErrorText {
            param($Err)
            $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
            if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
            return [string]$Err.Exception.Message
        }
        function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

        function Update-GraphToken {
            $c = $GraphState.Creds
            if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
            $r = $null
            try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
            catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
            $tok = Get-GraphProp $r 'access_token'
            if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
            $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
            $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
            $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
        }

        # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
        # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
        # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
        # Returns @{ TenantId }.
        function Connect-Graph {
            param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
            if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
            $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
            $GraphState.TenantId = $TenantId.Trim()
            Update-GraphToken
            return @{ TenantId = $GraphState.TenantId }
        }

        # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
        # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
        # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
        # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
        function Invoke-Graph {
            param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
            if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
            $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
            $short = $uri.Replace($GraphState.Base, '')
            $reauth = $false
            for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                try {
                    $r = Invoke-RestMethod @p
                    $GraphState.LastStatus = 200
                    return $r
                }
                catch {
                    $code = Get-GraphHttpStatus $_
                    $GraphState.LastStatus = $code
                    if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                    if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                    $why = Get-GraphErrorText $_
                    if ($code -eq 403) {
                        $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                        throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                    }
                    throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                }
            }
        }

        # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
        function Get-GraphAll {
            param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
            $rows = New-Object System.Collections.ArrayList
            $next = $Path; $n = 0
            while ($next -and $n -lt $MaxPages) {
                $n++
                $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                $next = [string](Get-GraphProp $r '@odata.nextLink')
            }
            return @($rows)
        }

        # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
        function Get-GraphUser {
            param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
            try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
            catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
        }

        # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
        # Mail-enabled security groups and distribution lists can't be changed through Graph.
        function Add-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
            catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
        }

        # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
        function Remove-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
            catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
        }

        # Sets the user's manager. Needs User.ReadWrite.All.
        function Set-GraphManager {
            param([string]$UserId, [string]$ManagerId)
            $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
        }

        # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
        function Revoke-GraphSessions {
            param([string]$UserId)
            $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
        }

        # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
        # Disabling an admin account also needs a privileged role, which app permissions can't grant.
        function Set-GraphAccountEnabled {
            param([string]$UserId, [bool]$Enabled)
            $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
        }

        # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
        # The user must have a usage location before a licence can be added.
        function Set-GraphLicense {
            param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
            $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
            $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
            if (-not $toAdd.Count -and -not $toRemove.Count) { return }
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
            catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
        }

        # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
        # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
        function Get-GraphSignInActivity {
            param([string]$UserId = '')
            $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
            $perm = 'AuditLog.Read.All (with User.Read.All)'
            if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
            # Graph caps the page size at 120 when signInActivity is selected.
            return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
        }

        # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
        function Get-GraphAuthMethods {
            param([string]$UserId)
            return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
        }

        # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
        # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
        function Remove-GraphAuthMethod {
            param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
            if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
            $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
            $seg = @{
                microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                phoneAuthenticationMethod                  = 'phoneMethods'
                fido2AuthenticationMethod                  = 'fido2Methods'
                emailAuthenticationMethod                  = 'emailMethods'
                softwareOathAuthenticationMethod           = 'softwareOathMethods'
                windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
            }
            if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
            if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
            $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
        }

        # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
        # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
        function Get-GraphRiskyUsers {
            param([string]$UserId = '', [switch]$AtRiskOnly)
            $perm = 'IdentityRiskyUser.Read.All'
            if ($UserId) {
                try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
            }
            $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
            return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
        }

        # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
        function New-GraphTempPassword {
            param([int]$Length = 16)
            if ($Length -lt 8) { $Length = 8 }
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
            $all = -join $sets
            $rng = [System.Security.Cryptography.RandomNumberGenerator]
            $chars = New-Object System.Collections.Generic.List[char]
            foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
            while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
            for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
            return -join $chars
        }
        # ---------- end _shared/graph.ps1 ----------
        # <<< _shared/graph.ps1
        # ---------- src/common.ps1: helpers shared by the Password Expiry Reminder steps ----------
        # Pasted into every step by src/build.js. Needs no other file. Every name starts with Pe so it can't clash
        # with the _shared libraries. Run-wide state is one ordered hashtable that the steps change in place, because
        # the runner runs each step in a child scope where $script: variables don't behave.

        function Get-PeProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }

        # The first non-empty value among Names, as trimmed text. A list is joined with commas. A value CloudRadial
        # left as a literal @token (for example "@resetUrl") counts as not given.
        function Get-PeText {
            param($o, [string[]]$Names)
            foreach ($n in $Names) {
                $v = Get-PeProp $o $n
                if ($null -eq $v) { continue }
                if ($v -is [array]) { $v = (@($v | Where-Object { $null -ne $_ } | ForEach-Object { [string]$_ }) -join ',') }
                $t = ([string]$v).Trim()
                if ($t -ne '' -and -not $t.StartsWith('@')) { return $t }
            }
            return ''
        }

        # The first runner Key Vault secret among Names that has a value, or ''.
        function Get-PeSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return ([string]$v).Trim() } }; return '' }

        # A date from Graph (a DateTime or an ISO string) as UTC, or $null.
        function ConvertTo-PeDate {
            param($v)
            if ($null -eq $v) { return $null }
            if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }
            $t = [string]$v; if ([string]::IsNullOrWhiteSpace($t)) { return $null }
            $d = [datetime]::MinValue
            if ([datetime]::TryParse($t, [Globalization.CultureInfo]::InvariantCulture, ([Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal), [ref]$d)) { return $d }
            return $null
        }

        # A date as yyyy-MM-ddTHH:mm:ssZ. The runner turns ISO text into a DateTime between steps, so format it again.
        function Format-PeIso { param($v) $d = ConvertTo-PeDate $v; if ($null -eq $d) { return '' }; return $d.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture) }

        function New-PeCounts {
            return [ordered]@{ checked = 0; expiringSoon = 0; due = 0; emailed = 0; alreadySentToday = 0; failed = 0; skippedSynced = 0; skippedNeverExpires = 0; skippedDisabled = 0; skippedGuests = 0; skippedNoMail = 0; skippedOther = 0; alreadyExpired = 0 }
        }

        # An object from the previous step's JSON as an ordered hashtable, one level deep.
        function ConvertTo-PeHash {
            param($o)
            $h = [ordered]@{}
            if ($null -eq $o) { return $h }
            if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] }; return $h }
            foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
            return $h
        }

        # The run state handed on by the step before, with every key this workflow reads filled in.
        function Read-PeState {
            $raw = Get-NodeInput
            if ($raw -is [string]) { try { $raw = $raw | ConvertFrom-Json } catch { $raw = $null } }
            if ($null -ne $raw -and $null -eq (Get-PeProp $raw 'inputs') -and $null -ne (Get-PeProp $raw 'output')) { $raw = Get-PeProp $raw 'output' }
            $st = ConvertTo-PeHash $raw
            if (-not $st.Contains('inputs') -or $null -eq $st['inputs']) { throw 'This step needs the output of the step before it. Run the workflow from the start.' }
            foreach ($k in @('status', 'message', 'tenant_id', 'checked_at', 'sent_via')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('due', 'emailed', 'skipped', 'actions', 'warnings')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k] | Where-Object { $null -ne $_ }) } }
            if (-not $st.Contains('done')) { $st['done'] = $false }
            $c = New-PeCounts
            if ($st.Contains('counts') -and $null -ne $st['counts']) { foreach ($k in @($c.Keys)) { $v = Get-PeProp $st['counts'] $k; if ($null -ne $v) { $c[$k] = [int]$v } } }
            $st['counts'] = $c
            return $st
        }

        # Ends the run: writes the state with the status and message, then throws so the run shows as failed.
        function Stop-PeRun {
            param($St, [string]$Status, [string]$Msg)
            $St['status'] = $Status; $St['message'] = $Msg
            Set-NodeOutput $St
            throw $Msg
        }

        # "a, b, c and 4 more" for a warning or message.
        function Join-PeNames { param($Names, [int]$Max = 10) $all = @($Names | Where-Object { $_ }); if ($all.Count -le $Max) { return ($all -join ', ') }; return ((@($all | Select-Object -First $Max) -join ', ') + " and $($all.Count - $Max) more") }
        function Get-PePlural { param([int]$n, [string]$One, [string]$Many) if ($n -eq 1) { return "1 $One" }; return "$n $Many" }
        # ---------- end src/common.ps1 ----------

        # === NODE: Find passwords that expire soon (read-only) ===
        # Reads each verified domain's password lifetime (passwordValidityPeriodInDays; 2147483647 or empty means the
        # passwords never expire, which is Microsoft's default for new tenants) and every user. Works out each
        # remaining user's expiry date as lastPasswordChangeDateTime plus the lifetime of their sign-in domain.
        # Skips: disabled accounts, guests, accounts synced from on-premises Active Directory (their expiry is set
        # there, which this workflow can't read, so they are listed in warnings and never emailed), accounts with
        # DisablePasswordExpiration, and accounts without an email address.
        # Reminder rule: a person is due when the number of whole days left (in timeZone) is one of daysBeforeExpiry.
        # With catchUpDays N above 1, a person is also due when a reminder day fell in the last N-1 days (a missed
        # run); each person gets at most one email per run, for the nearest reminder day. Expired passwords get no email.
        # Changes nothing and sends nothing. Needs User.Read.All and Domain.Read.All.
        $ErrorActionPreference = 'Stop'
        $st = Read-PeState
        $opt = $st['inputs']
        $thr = @(@(Get-PeProp $opt 'daysBeforeExpiry') | Where-Object { $null -ne $_ } | ForEach-Object { [int]$_ } | Sort-Object)
        $catchUp = [int](Get-PeProp $opt 'catchUpDays'); if ($catchUp -lt 1) { $catchUp = 1 }
        $only = @(@(Get-PeProp $opt 'onlyUsers') | Where-Object { $_ } | ForEach-Object { ([string]$_).ToLowerInvariant() })
        $tzId = [string](Get-PeProp $opt 'timeZone'); if (-not $tzId) { $tzId = 'UTC' }
        $tz = [TimeZoneInfo]::FindSystemTimeZoneById($tzId)
        $counts = $st['counts']

        try { $conn = Connect-Graph } catch { Stop-PeRun $st 'error' "Couldn't sign in to Microsoft 365: $($_.Exception.Message) No email was sent." }
        $st['tenant_id'] = [string]$conn.TenantId
        $tenantWanted = [string](Get-PeProp $opt 'company_tenant_id')
        if ($tenantWanted -and $tenantWanted -ne ([string]$conn.TenantId).ToLowerInvariant()) {
            Stop-PeRun $st 'rejected' "The run asked for Microsoft 365 tenant $tenantWanted, but this runner is set up for a different tenant (the M365-TenantId secret), so nothing was read and no email was sent."
        }

        # 1. Password lifetime per verified domain. 0 here means the passwords never expire.
        $domains = @()
        try { $domains = @(Get-GraphAll -Path '/v1.0/domains' -Permission 'Domain.Read.All') }
        catch {
            $m = [string]$_.Exception.Message
            if ($m -match '\(403 Forbidden\)') { Stop-PeRun $st 'error' "Can't read the tenant's password expiry settings. The app registration needs the Domain.Read.All application permission, with admin consent. No email was sent." }
            Stop-PeRun $st 'error' "Couldn't read the Microsoft 365 domains: $m No email was sent."
        }
        $life = @{}
        $expiring = @()
        foreach ($d in $domains) {
            if ((Get-GraphProp $d 'isVerified') -ne $true) { continue }
            $name = ([string](Get-GraphProp $d 'id')).ToLowerInvariant()
            if (-not $name) { continue }
            $v = Get-GraphProp $d 'passwordValidityPeriodInDays'
            $days = 0
            if ($null -ne $v -and [string]$v -match '^\d+$' -and [int64]$v -gt 0 -and [int64]$v -lt 2147483647) { $days = [int]$v; $expiring += "$name ($days days)" }
            $life[$name] = $days
        }
        $nowUtc = (Get-Date).ToUniversalTime()
        $st['checked_at'] = $nowUtc.ToString('yyyy-MM-dd HH:mm', [Globalization.CultureInfo]::InvariantCulture) + ' UTC'
        if (-not $expiring.Count) {
            $st['done'] = $true
            $st['status'] = 'success'
            $st['message'] = 'Passwords in this Microsoft 365 tenant are set to never expire, so nobody needs a reminder. No email was sent.'
            $st['actions'] = @(@($st['actions']) + "Checked $(Get-PePlural $life.Count 'verified domain' 'verified domains'): none has a password expiry policy.")
            Set-NodeOutput $st
            return
        }

        # 2. Every user.
        $sel = 'id,displayName,givenName,userPrincipalName,mail,accountEnabled,userType,passwordPolicies,lastPasswordChangeDateTime,onPremisesSyncEnabled'
        $users = @()
        try { $users = @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=999" -Permission 'User.Read.All') }
        catch {
            $m = [string]$_.Exception.Message
            if ($m -match '\(403 Forbidden\)') { Stop-PeRun $st 'error' "Can't read the Microsoft 365 user list. The app registration needs the User.Read.All application permission, with admin consent. No email was sent." }
            Stop-PeRun $st 'error' "Couldn't read the Microsoft 365 user list: $m No email was sent."
        }

        # 3. Sort every user into skipped, not due yet, or due today.
        $todayLocal = [TimeZoneInfo]::ConvertTimeFromUtc($nowUtc, $tz).Date
        $maxThr = [int]($thr | Measure-Object -Maximum).Maximum
        $found = @{}
        $synced = @()
        $due = New-Object System.Collections.ArrayList
        $skipped = New-Object System.Collections.ArrayList
        foreach ($u in $users) {
            if ($null -eq $u) { continue }
            $id = ([string](Get-GraphProp $u 'id')).ToLowerInvariant()
            $upn = [string](Get-GraphProp $u 'userPrincipalName')
            $mail = [string](Get-GraphProp $u 'mail')
            if ($only.Count) {
                $hits = @($only | Where-Object { $_ -eq $id -or $_ -eq $upn.ToLowerInvariant() -or ($mail -and $_ -eq $mail.ToLowerInvariant()) })
                if (-not $hits.Count) { continue }
                foreach ($h in $hits) { $found[$h] = $true }
            }
            $counts.checked++
            if ((Get-GraphProp $u 'accountEnabled') -eq $false) { $counts.skippedDisabled++; continue }
            if (([string](Get-GraphProp $u 'userType')) -ieq 'Guest') { $counts.skippedGuests++; continue }
            if ((Get-GraphProp $u 'onPremisesSyncEnabled') -eq $true) { $counts.skippedSynced++; $synced += $upn; continue }
            $domain = ($upn.ToLowerInvariant() -split '@')[-1]
            if ([string](Get-GraphProp $u 'passwordPolicies') -match '(?i)DisablePasswordExpiration') { $counts.skippedNeverExpires++; continue }
            if (-not $life.ContainsKey($domain)) { $counts.skippedOther++; $null = $skipped.Add([ordered]@{ upn = $upn; reason = "Its sign-in domain ($domain) isn't a verified domain in this tenant, so its password expiry isn't known." }); continue }
            if ($life[$domain] -eq 0) { $counts.skippedNeverExpires++; continue }
            if (-not $mail) { $counts.skippedNoMail++; $null = $skipped.Add([ordered]@{ upn = $upn; reason = 'No email address (no mailbox), so there is nowhere to send a reminder.' }); continue }
            $changed = ConvertTo-PeDate (Get-GraphProp $u 'lastPasswordChangeDateTime')
            if ($null -eq $changed) { $counts.skippedOther++; $null = $skipped.Add([ordered]@{ upn = $upn; reason = 'Microsoft 365 has no last password change date for this account.' }); continue }

            $expUtc = $changed.AddDays($life[$domain])
            $expLocal = [TimeZoneInfo]::ConvertTimeFromUtc($expUtc, $tz)
            $daysLeft = [int]($expLocal.Date - $todayLocal).TotalDays
            $expText = $expLocal.ToString('dddd d MMMM yyyy', [Globalization.CultureInfo]::InvariantCulture) + ' at ' + $expLocal.ToString('HH:mm', [Globalization.CultureInfo]::InvariantCulture) + " ($tzId)"
            if ($expUtc -le $nowUtc) {
                $counts.alreadyExpired++
                $null = $skipped.Add([ordered]@{ upn = $upn; reason = "Password already expired on $expText. They will be asked to change it at their next sign-in, so no reminder was sent." })
                continue
            }
            if ($daysLeft -le $maxThr) { $counts.expiringSoon++ }
            # The nearest reminder day from today back to catchUpDays - 1 days ago.
            $hitT = @($thr | Where-Object { $_ -ge $daysLeft -and $_ -le ($daysLeft + $catchUp - 1) } | Select-Object -First 1)
            if (-not $hitT.Count) { continue }
            $first = [string](Get-GraphProp $u 'givenName')
            if (-not $first.Trim()) { $first = ([string](Get-GraphProp $u 'displayName') -split '\s+' | Where-Object { $_ } | Select-Object -First 1) }
            $null = $due.Add([ordered]@{
                    id          = [string](Get-GraphProp $u 'id')
                    upn         = $upn
                    mail        = $mail
                    name        = [string](Get-GraphProp $u 'displayName')
                    firstName   = $(if ($first) { [string]$first } else { '' })
                    daysLeft    = $daysLeft
                    reminderDay = [int]$hitT[0]
                    expires     = $expUtc.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture)
                    expiresText = $expText
                    result      = 'due'
                })
        }
        $counts.due = $due.Count

        $warn = @($st['warnings'])
        foreach ($o in $only) { if (-not $found.ContainsKey($o)) { $warn += "onlyUsers: no Microsoft 365 account matches '$o'." } }
        if ($synced.Count) { $warn += "$(Get-PePlural $synced.Count 'account is' 'accounts are') synced from on-premises Active Directory and $(if ($synced.Count -eq 1) { 'was' } else { 'were' }) not emailed: their password expiry is set by Active Directory, which this workflow can't read, so it won't guess a date. Remind them from Active Directory instead: $(Join-PeNames $synced)." }
        if ($counts.skippedOther -or $counts.skippedNoMail) { $warn += "$(Get-PePlural ($counts.skippedOther + $counts.skippedNoMail) 'account was' 'accounts were') skipped for another reason; see skipped." }

        $st['due'] = @($due)
        $st['skipped'] = @($skipped)
        $st['warnings'] = @($warn)
        $st['actions'] = @(@($st['actions']) + "Checked $(Get-PePlural $counts.checked 'Microsoft 365 account' 'Microsoft 365 accounts') against the password expiry policy ($($expiring -join ', ')): $($counts.expiringSoon) expire within $maxThr days and $($due.Count) $(if ($due.Count -eq 1) { 'is' } else { 'are' }) on a reminder day today.")
        Set-NodeOutput $st
      timeoutSeconds: 900
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: node-send
    name: Send reminders
    type: powershell-script
    position:
      x: 680
      y: 200
    properties:
      script: |-
        # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
        # Edit this file, then run: node _shared/inject.js <automation-folder>
        # Signs in with the app registration's client credentials from the runner Key Vault.
        # Each helper names the Graph application permission it needs; when Graph answers 403,
        # the error says which permission to grant (with admin consent).
        # All state lives in the $GraphState hashtable and is changed in place, because the runner
        # runs a step in a child scope where $script: variables don't behave.

        $GraphState = @{
            Base           = 'https://graph.microsoft.com'
            Headers        = $null
            Creds          = $null
            TenantId       = ''
            ExpiresAt      = [datetime]::MinValue
            MaxAttempts    = 5
            MaxWaitSeconds = 120
            LastStatus     = 0
        }

        # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
        # The first secret that has a value, from a list of names.
        function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
        function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
        function Get-GraphRetryAfter {
            param($Err, [int]$Attempt)
            $s = 0
            try {
                $ra = $Err.Exception.Response.Headers.RetryAfter
                if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
            } catch { }
            if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
            return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
        }
        # Graph's own error message when there is one, otherwise the exception text.
        function Get-GraphErrorText {
            param($Err)
            $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
            if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
            return [string]$Err.Exception.Message
        }
        function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

        function Update-GraphToken {
            $c = $GraphState.Creds
            if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
            $r = $null
            try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
            catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
            $tok = Get-GraphProp $r 'access_token'
            if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
            $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
            $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
            $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
        }

        # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
        # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
        # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
        # Returns @{ TenantId }.
        function Connect-Graph {
            param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
            if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
            if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
            if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
            $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
            $GraphState.TenantId = $TenantId.Trim()
            Update-GraphToken
            return @{ TenantId = $GraphState.TenantId }
        }

        # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
        # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
        # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
        # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
        function Invoke-Graph {
            param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
            if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
            $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
            $short = $uri.Replace($GraphState.Base, '')
            $reauth = $false
            for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                try {
                    $r = Invoke-RestMethod @p
                    $GraphState.LastStatus = 200
                    return $r
                }
                catch {
                    $code = Get-GraphHttpStatus $_
                    $GraphState.LastStatus = $code
                    if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                    if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                    $why = Get-GraphErrorText $_
                    if ($code -eq 403) {
                        $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                        throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                    }
                    throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                }
            }
        }

        # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
        function Get-GraphAll {
            param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
            $rows = New-Object System.Collections.ArrayList
            $next = $Path; $n = 0
            while ($next -and $n -lt $MaxPages) {
                $n++
                $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                $next = [string](Get-GraphProp $r '@odata.nextLink')
            }
            return @($rows)
        }

        # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
        function Get-GraphUser {
            param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
            try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
            catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
        }

        # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
        # Mail-enabled security groups and distribution lists can't be changed through Graph.
        function Add-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
            catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
        }

        # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
        function Remove-GraphGroupMember {
            param([string]$GroupId, [string]$UserId)
            try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
            catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
        }

        # Sets the user's manager. Needs User.ReadWrite.All.
        function Set-GraphManager {
            param([string]$UserId, [string]$ManagerId)
            $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
        }

        # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
        function Revoke-GraphSessions {
            param([string]$UserId)
            $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
        }

        # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
        # Disabling an admin account also needs a privileged role, which app permissions can't grant.
        function Set-GraphAccountEnabled {
            param([string]$UserId, [bool]$Enabled)
            $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
        }

        # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
        # The user must have a usage location before a licence can be added.
        function Set-GraphLicense {
            param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
            $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
            $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
            if (-not $toAdd.Count -and -not $toRemove.Count) { return }
            try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
            catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
        }

        # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
        # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
        function Get-GraphSignInActivity {
            param([string]$UserId = '')
            $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
            $perm = 'AuditLog.Read.All (with User.Read.All)'
            if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
            # Graph caps the page size at 120 when signInActivity is selected.
            return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
        }

        # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
        function Get-GraphAuthMethods {
            param([string]$UserId)
            return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
        }

        # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
        # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
        function Remove-GraphAuthMethod {
            param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
            if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
            $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
            $seg = @{
                microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                phoneAuthenticationMethod                  = 'phoneMethods'
                fido2AuthenticationMethod                  = 'fido2Methods'
                emailAuthenticationMethod                  = 'emailMethods'
                softwareOathAuthenticationMethod           = 'softwareOathMethods'
                windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
            }
            if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
            if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
            $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
        }

        # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
        # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
        function Get-GraphRiskyUsers {
            param([string]$UserId = '', [switch]$AtRiskOnly)
            $perm = 'IdentityRiskyUser.Read.All'
            if ($UserId) {
                try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
            }
            $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
            return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
        }

        # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
        function New-GraphTempPassword {
            param([int]$Length = 16)
            if ($Length -lt 8) { $Length = 8 }
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
            $all = -join $sets
            $rng = [System.Security.Cryptography.RandomNumberGenerator]
            $chars = New-Object System.Collections.Generic.List[char]
            foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
            while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
            for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
            return -join $chars
        }
        # ---------- end _shared/graph.ps1 ----------
        # <<< _shared/graph.ps1
        # >>> _shared/postmark.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/postmark.ps1: staff email through Postmark ----------
        # Edit this file, then run: node _shared/inject.js <automation-folder>
        # Same secret names as the Postmark catalog extension and deliver-result:
        #   Postmark-ServerToken (required), Postmark-FromEmail (required, a verified sender),
        #   Postmark-ApiUrl (optional, default https://api.postmarkapp.com).
        # Emails go to staff (service manager, dispatcher, account manager). Messages to a ticket's requester go
        # through a public PSA note instead, so the PSA emails them. Stands alone: it needs no other _shared file.

        function Get-PmSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
        function Get-PmProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Test-PmEmail { param([string]$s) return ([string]$s -match '^[^@\s]+@[^@\s]+\.[^@\s]+$') }
        # $true when both required secrets are set.
        function Test-PmConfigured { return (-not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-ServerToken')) -and -not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-FromEmail'))) }
        # Text made safe to put inside HTML.
        function ConvertTo-PmHtml { param([string]$s) if ($null -eq $s) { return '' }; return [System.Net.WebUtility]::HtmlEncode($s) }

        # Sends one email. Never throws, so a report or alert still finishes when email fails; the caller falls back
        # (usually to an internal note) when sent is $false.
        #   -To       one or more addresses, or one comma/semicolon separated string. Invalid addresses are dropped.
        #   -Html / -Text  at least one is needed. -Tag and -Stream (default 'outbound') are passed to Postmark.
        #   -From     overrides the Postmark-FromEmail secret (it must still be a verified sender).
        # Returns @{ configured; sent; reason; messageId; to }. configured is $false when the token or sender is missing.
        # Retries 429 and 5xx twice. A 401 names the Postmark-ServerToken secret.
        function Send-PmMail {
            param([string[]]$To, [string]$Subject, [string]$Html = '', [string]$Text = '', [string]$Tag = '', [string]$Stream = 'outbound', [string]$From = '')
            $rcpt = @(@($To) | ForEach-Object { ([string]$_) -split '[,;]' } | ForEach-Object { $_.Trim() } | Where-Object { Test-PmEmail $_ } | Select-Object -Unique)
            $token = Get-PmSecret 'Postmark-ServerToken'
            $sender = if ($From.Trim()) { $From.Trim() } else { [string](Get-PmSecret 'Postmark-FromEmail') }
            if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($sender)) {
                $miss = @(); if ([string]::IsNullOrWhiteSpace($token)) { $miss += 'Postmark-ServerToken' }; if ([string]::IsNullOrWhiteSpace($sender)) { $miss += 'Postmark-FromEmail' }
                return @{ configured = $false; sent = $false; reason = "Postmark isn't set up (add the $($miss -join ' and ') secret$(if ($miss.Count -gt 1) { 's' }))."; messageId = ''; to = @($rcpt) }
            }
            if (-not $rcpt.Count) { return @{ configured = $true; sent = $false; reason = 'There is no valid recipient address.'; messageId = ''; to = @() } }
            if (-not $Html -and -not $Text) { return @{ configured = $true; sent = $false; reason = 'The email has no body.'; messageId = ''; to = @($rcpt) } }
            $api = Get-PmSecret 'Postmark-ApiUrl'; if ([string]::IsNullOrWhiteSpace($api)) { $api = 'https://api.postmarkapp.com' }
            $body = [ordered]@{ From = $sender.Trim(); To = ($rcpt -join ','); Subject = $Subject; MessageStream = $Stream }
            if ($Html) { $body.HtmlBody = $Html }
            if ($Text) { $body.TextBody = $Text }
            if ($Tag) { $body.Tag = $Tag }
            $h = @{ 'X-Postmark-Server-Token' = $token.Trim(); Accept = 'application/json' }
            for ($i = 1; $i -le 3; $i++) {
                try {
                    $r = Invoke-RestMethod -Method POST -Uri "$($api.TrimEnd('/'))/email" -Headers $h -Body (ConvertTo-Json -InputObject $body -Depth 5 -Compress) -ContentType 'application/json' -ErrorAction Stop
                    $code = Get-PmProp $r 'ErrorCode'
                    if ($null -ne $code -and [int]$code -ne 0) { return @{ configured = $true; sent = $false; reason = "Postmark refused the email: $(Get-PmProp $r 'Message')"; messageId = ''; to = @($rcpt) } }
                    return @{ configured = $true; sent = $true; reason = ''; messageId = [string](Get-PmProp $r 'MessageID'); to = @($rcpt) }
                }
                catch {
                    $status = 0; try { $status = [int]$_.Exception.Response.StatusCode } catch { }
                    if (($status -eq 429 -or $status -ge 500) -and $i -lt 3) { Start-Sleep -Seconds (2 * $i); continue }
                    $d = $null; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $d = $_.ErrorDetails.Message } } catch { }
                    if (-not $d) { $d = [string]$_.Exception.Message }
                    $msg = $d; try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-PmProp $j 'Message'; if ($m) { $msg = [string]$m } } catch { }
                    $why = if ($status -eq 401) { 'Postmark rejected the server token (HTTP 401). Check the Postmark-ServerToken secret.' } else { "Postmark couldn't send the email$(if ($status) { " (HTTP $status)" }): $msg" }
                    return @{ configured = $true; sent = $false; reason = $why; messageId = ''; to = @($rcpt) }
                }
            }
            return @{ configured = $true; sent = $false; reason = 'Postmark kept refusing the email.'; messageId = ''; to = @($rcpt) }
        }
        # ---------- end _shared/postmark.ps1 ----------
        # <<< _shared/postmark.ps1
        # ---------- src/common.ps1: helpers shared by the Password Expiry Reminder steps ----------
        # Pasted into every step by src/build.js. Needs no other file. Every name starts with Pe so it can't clash
        # with the _shared libraries. Run-wide state is one ordered hashtable that the steps change in place, because
        # the runner runs each step in a child scope where $script: variables don't behave.

        function Get-PeProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }

        # The first non-empty value among Names, as trimmed text. A list is joined with commas. A value CloudRadial
        # left as a literal @token (for example "@resetUrl") counts as not given.
        function Get-PeText {
            param($o, [string[]]$Names)
            foreach ($n in $Names) {
                $v = Get-PeProp $o $n
                if ($null -eq $v) { continue }
                if ($v -is [array]) { $v = (@($v | Where-Object { $null -ne $_ } | ForEach-Object { [string]$_ }) -join ',') }
                $t = ([string]$v).Trim()
                if ($t -ne '' -and -not $t.StartsWith('@')) { return $t }
            }
            return ''
        }

        # The first runner Key Vault secret among Names that has a value, or ''.
        function Get-PeSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return ([string]$v).Trim() } }; return '' }

        # A date from Graph (a DateTime or an ISO string) as UTC, or $null.
        function ConvertTo-PeDate {
            param($v)
            if ($null -eq $v) { return $null }
            if ($v -is [datetime]) { if ($v.Kind -eq [DateTimeKind]::Unspecified) { return [datetime]::SpecifyKind($v, [DateTimeKind]::Utc) }; return $v.ToUniversalTime() }
            $t = [string]$v; if ([string]::IsNullOrWhiteSpace($t)) { return $null }
            $d = [datetime]::MinValue
            if ([datetime]::TryParse($t, [Globalization.CultureInfo]::InvariantCulture, ([Globalization.DateTimeStyles]::AdjustToUniversal -bor [Globalization.DateTimeStyles]::AssumeUniversal), [ref]$d)) { return $d }
            return $null
        }

        # A date as yyyy-MM-ddTHH:mm:ssZ. The runner turns ISO text into a DateTime between steps, so format it again.
        function Format-PeIso { param($v) $d = ConvertTo-PeDate $v; if ($null -eq $d) { return '' }; return $d.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture) }

        function New-PeCounts {
            return [ordered]@{ checked = 0; expiringSoon = 0; due = 0; emailed = 0; alreadySentToday = 0; failed = 0; skippedSynced = 0; skippedNeverExpires = 0; skippedDisabled = 0; skippedGuests = 0; skippedNoMail = 0; skippedOther = 0; alreadyExpired = 0 }
        }

        # An object from the previous step's JSON as an ordered hashtable, one level deep.
        function ConvertTo-PeHash {
            param($o)
            $h = [ordered]@{}
            if ($null -eq $o) { return $h }
            if ($o -is [System.Collections.IDictionary]) { foreach ($k in $o.Keys) { $h[[string]$k] = $o[$k] }; return $h }
            foreach ($p in $o.PSObject.Properties) { $h[$p.Name] = $p.Value }
            return $h
        }

        # The run state handed on by the step before, with every key this workflow reads filled in.
        function Read-PeState {
            $raw = Get-NodeInput
            if ($raw -is [string]) { try { $raw = $raw | ConvertFrom-Json } catch { $raw = $null } }
            if ($null -ne $raw -and $null -eq (Get-PeProp $raw 'inputs') -and $null -ne (Get-PeProp $raw 'output')) { $raw = Get-PeProp $raw 'output' }
            $st = ConvertTo-PeHash $raw
            if (-not $st.Contains('inputs') -or $null -eq $st['inputs']) { throw 'This step needs the output of the step before it. Run the workflow from the start.' }
            foreach ($k in @('status', 'message', 'tenant_id', 'checked_at', 'sent_via')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = '' } }
            foreach ($k in @('due', 'emailed', 'skipped', 'actions', 'warnings')) { if (-not $st.Contains($k) -or $null -eq $st[$k]) { $st[$k] = @() } else { $st[$k] = @($st[$k] | Where-Object { $null -ne $_ }) } }
            if (-not $st.Contains('done')) { $st['done'] = $false }
            $c = New-PeCounts
            if ($st.Contains('counts') -and $null -ne $st['counts']) { foreach ($k in @($c.Keys)) { $v = Get-PeProp $st['counts'] $k; if ($null -ne $v) { $c[$k] = [int]$v } } }
            $st['counts'] = $c
            return $st
        }

        # Ends the run: writes the state with the status and message, then throws so the run shows as failed.
        function Stop-PeRun {
            param($St, [string]$Status, [string]$Msg)
            $St['status'] = $Status; $St['message'] = $Msg
            Set-NodeOutput $St
            throw $Msg
        }

        # "a, b, c and 4 more" for a warning or message.
        function Join-PeNames { param($Names, [int]$Max = 10) $all = @($Names | Where-Object { $_ }); if ($all.Count -le $Max) { return ($all -join ', ') }; return ((@($all | Select-Object -First $Max) -join ', ') + " and $($all.Count - $Max) more") }
        function Get-PePlural { param([int]$n, [string]$One, [string]$Many) if ($n -eq 1) { return "1 $One" }; return "$n $Many" }
        # ---------- end src/common.ps1 ----------

        # === NODE: Send reminders ===
        # Emails each person found by the step before. With preview true it lists them and sends nothing.
        # Sends through Microsoft Graph as the mailbox in the PasswordExpiry-Sender secret (needs Mail.Send; a copy is
        # kept in that mailbox's Sent Items). When that secret isn't set, it sends through Postmark when the
        # Postmark-ServerToken and Postmark-FromEmail secrets are set. The email never contains a password.
        # One failed email is counted and the rest still go out; a missing permission or sender mailbox stops the
        # sending and counts the rest as failed.
        # Safe to rerun the same day through Graph: before sending, it reads the sender's Sent Items since midnight
        # (in timeZone; needs Mail.ReadBasic.All) and skips anyone who already got today's reminder. Without that
        # permission it warns and sends anyway. Postmark has no such check, so a second Postmark run the same day sends again.
        $ErrorActionPreference = 'Stop'

        function New-PeMail {
            param($p, [string]$ResetUrl)
            $days = [int](Get-PeProp $p 'daysLeft')
            $when = if ($days -le 0) { 'today' } elseif ($days -eq 1) { 'tomorrow' } else { "in $days days" }
            $first = [string](Get-PeProp $p 'firstName'); if (-not $first.Trim()) { $first = 'there' }
            $subject = "Your Microsoft 365 password expires $when"
            $lines = @(
                "Hello $($first.Trim()),"
                ''
                "The Microsoft 365 password for $(Get-PeProp $p 'upn') expires $when, on $(Get-PeProp $p 'expiresText'). Please change it before then so you aren't locked out of your email, Teams and files."
                ''
                'You can change it in any of these ways:'
                '- On a work Windows PC you sign in to with this account, press Ctrl+Alt+Del and choose Change a password.'
                '- In Outlook on the web (https://outlook.office.com), select your picture or initials at the top right, choose View account, then Password.'
                "- Go to $ResetUrl and follow the steps."
                ''
                'Choose a new password you have not used before. After you change it, sign in again with the new password on your phone and any other devices.'
                ''
                "IT will never ask you for your password, by email, phone or chat. If you aren't sure this message is genuine, don't use the link: open Outlook on the web yourself, or contact your IT support team."
                ''
                'Thank you,'
                'Your IT support team'
            )
            return @{ subject = $subject; text = ($lines -join "`n"); when = $when }
        }

        $st = Read-PeState
        if ([bool]$st['done']) { Set-NodeOutput $st; return }
        $opt = $st['inputs']
        $preview = [bool](Get-PeProp $opt 'preview')
        $resetUrl = [string](Get-PeProp $opt 'resetUrl')
        $counts = $st['counts']
        $due = @($st['due'] | ForEach-Object { ConvertTo-PeHash $_ })
        foreach ($p in $due) { $p['expires'] = Format-PeIso $p['expires'] }
        $st['preview'] = $preview

        $sender = Get-PeSecret @('PasswordExpiry-Sender')
        $via = ''
        if ($sender) { $via = 'graph' } elseif (Test-PmConfigured) { $via = 'postmark' }
        $st['sent_via'] = $(if ($via -eq 'graph') { "Microsoft Graph as $sender" } elseif ($via -eq 'postmark') { 'Postmark' } else { '' })
        $noSender = 'Add the PasswordExpiry-Sender secret (the mailbox to send from, with the Mail.Send permission) or the Postmark-ServerToken and Postmark-FromEmail secrets.'

        if (-not $due.Count) {
            $st['status'] = 'success'
            $st['message'] = "Checked $(Get-PePlural $counts.checked 'account' 'accounts'). Nobody is on a reminder day today, so no email was sent."
            Set-NodeOutput $st
            return
        }

        $names = @($due | ForEach-Object { "$($_['upn']) ($(Get-PePlural ([int]$_['daysLeft']) 'day' 'days'))" })
        if ($preview) {
            foreach ($p in $due) { $p['result'] = 'would be emailed' }
            $st['due'] = @($due)
            $st['status'] = 'pending_confirmation'
            $st['message'] = "Preview: $(Get-PePlural $due.Count 'person' 'people') would be emailed today: $(Join-PeNames $names). Nothing was sent."
            if (-not $via) { $st['warnings'] = @(@($st['warnings']) + "No way to send email is set up yet, so a live run would stop. $noSender") }
            $st['actions'] = @(@($st['actions']) + "Preview only: $(Get-PePlural $due.Count 'reminder' 'reminders') not sent.")
            Set-NodeOutput $st
            return
        }
        if (-not $via) { Stop-PeRun $st 'error' "$(Get-PePlural $due.Count 'person is' 'people are') due a password reminder, but no way to send email is set up. $noSender No email was sent." }
        if ($via -eq 'graph') {
            try { $null = Connect-Graph } catch { Stop-PeRun $st 'error' "Couldn't sign in to Microsoft 365 to send the reminders: $($_.Exception.Message) No email was sent." }
        }

        # Who already got a reminder today (Graph only), so a rerun or an Action Runs Retry doesn't email them twice.
        $sentToday = @{}
        if ($via -eq 'graph') {
            $tzId = [string](Get-PeProp $opt 'timeZone'); if (-not $tzId) { $tzId = 'UTC' }
            $tz = [TimeZoneInfo]::FindSystemTimeZoneById($tzId)
            $localMidnight = [TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz).Date
            $sinceUtc = [TimeZoneInfo]::ConvertTimeToUtc([datetime]::SpecifyKind($localMidnight, [DateTimeKind]::Unspecified), $tz).ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture)
            try {
                $sentPath = "/v1.0/users/$(ConvertTo-GraphId $sender)/mailFolders/sentitems/messages?`$filter=$([uri]::EscapeDataString("sentDateTime ge $sinceUtc"))&`$select=subject,toRecipients&`$top=100"
                foreach ($msg in @(Get-GraphAll -Path $sentPath -Permission 'Mail.ReadBasic.All')) {
                    if (-not ([string](Get-GraphProp $msg 'subject')).StartsWith('Your Microsoft 365 password expires')) { continue }
                    foreach ($r in @(Get-GraphProp $msg 'toRecipients')) { $a = [string](Get-GraphProp (Get-GraphProp $r 'emailAddress') 'address'); if ($a) { $sentToday[$a.ToLowerInvariant()] = $true } }
                }
            }
            catch { $st['warnings'] = @(@($st['warnings']) + "Couldn't check $sender's Sent Items for reminders already sent today, so a second run today would email people again. Add the Mail.ReadBasic.All application permission to make reruns safe. ($($_.Exception.Message))") }
        }

        $emailed = New-Object System.Collections.ArrayList
        $acts = @($st['actions'])
        $stopWhy = ''
        foreach ($p in $due) {
            $to = [string]$p['mail']
            if ($sentToday.ContainsKey($to.ToLowerInvariant())) { $p['result'] = 'already emailed today'; $counts.alreadySentToday++; $acts += "Skipped ${to}: already got today's reminder."; continue }
            if ($stopWhy) { $p['result'] = 'not sent'; $counts.failed++; $acts += "Didn't email ${to}: $stopWhy"; continue }
            $m = New-PeMail $p $resetUrl
            $ok = $false; $why = ''
            if ($via -eq 'graph') {
                $msg = @{ message = @{ subject = $m.subject; body = @{ contentType = 'Text'; content = $m.text }; toRecipients = @(@{ emailAddress = @{ address = $to; name = [string]$p['name'] } }) }; saveToSentItems = $true }
                try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $sender)/sendMail" -Body $msg -Permission 'Mail.Send'; $ok = $true }
                catch {
                    $why = [string]$_.Exception.Message
                    if ($GraphState.LastStatus -eq 403) { $stopWhy = "the app registration can't send as $sender. It needs the Mail.Send application permission, with admin consent (and, if an application access policy limits it, access to that mailbox)." }
                    elseif ($GraphState.LastStatus -eq 404) { $stopWhy = "the sender mailbox $sender wasn't found. Check the PasswordExpiry-Sender secret: it must be a licensed mailbox in this tenant." }
                    if ($stopWhy) { $why = $stopWhy }
                }
            }
            else {
                $r = Send-PmMail -To $to -Subject $m.subject -Text $m.text -Tag 'password-expiry'
                if ($r.sent) { $ok = $true } else { $why = [string]$r.reason }
            }
            if ($ok) {
                $p['result'] = 'emailed'; $counts.emailed++
                $null = $emailed.Add([ordered]@{ upn = [string]$p['upn']; mail = $to; daysLeft = [int]$p['daysLeft']; expires = (Format-PeIso $p['expires']) })
                $acts += "Emailed ${to}: the password expires $($m.when), on $($p['expiresText'])."
            }
            else { $p['result'] = 'failed'; $counts.failed++; $acts += "Couldn't email ${to}: $why" }
        }

        $st['due'] = @($due)
        $st['emailed'] = @($emailed)
        $st['actions'] = @($acts)
        $sentNames = @($emailed | ForEach-Object { "$($_['upn']) ($(Get-PePlural ([int]$_['daysLeft']) 'day' 'days'))" })
        $msgText = "Emailed $(Get-PePlural $counts.emailed 'person' 'people') whose Microsoft 365 password expires soon$(if ($sentNames.Count) { ": $(Join-PeNames $sentNames)" })."
        if ($counts.alreadySentToday) { $msgText += " $(Get-PePlural $counts.alreadySentToday 'person' 'people') already had today's reminder, so $(if ($counts.alreadySentToday -eq 1) { 'was' } else { 'were' }) not emailed again." }
        if ($counts.failed) {
            $st['status'] = 'incomplete'
            $msgText += " $(Get-PePlural $counts.failed 'email' 'emails') couldn't be sent$(if ($stopWhy) { ": $stopWhy" } else { '; see actions.' })"
        }
        else { $st['status'] = 'success' }
        $st['message'] = $msgText
        Set-NodeOutput $st
      timeoutSeconds: 1800
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: end
    name: End
    type: end
    position:
      x: 880
      y: 200
  connections:
  - source: start
    target: node-inputs
    sourceHandle: null
  - source: node-inputs
    target: node-find
    sourceHandle: null
  - source: node-find
    target: node-send
    sourceHandle: null
  - source: node-send
    target: end
    sourceHandle: null
  startActivityId: start
