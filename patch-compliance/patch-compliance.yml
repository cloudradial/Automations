automationsWorkflow: 1
name: Patch Compliance
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        y: 80
      properties:
        webhookEnabled: false
    - id: end
      name: End
      type: end
      position:
        x: 520
        y: 80
    - id: node-1
      name: Agent
      type: agent
      position:
        x: 310
        y: 110
      properties:
        goal: |
          Run a patch-compliance pass across the Datto RMM fleet. If the input
          has a siteUid, only assess that site.
          1. List devices (datto_get_devices) and sites (datto_list_sites).
          2. Put every device in exactly one bucket, using its deviceClass and its
             patch status (from the device record, or datto_get_patch_status):
             - notPatchable: deviceClass is anything other than "device" (network
               devices, printers, ESXi hosts). Leave these out of every score.
             - noData: a "device" with no patch status, or NoData. Leave these
               out of the score and list them so someone can check the agent.
             - compliant: FullyPatched.
             - pending: ApprovedPending or RebootRequired (patches are on the way).
             - failing: InstallError.
             - noPolicy: NoPolicy (no patch policy is applied; this is a setup gap).
             Count each device once, keyed by its deviceUid, and name it by its
             hostname. Before returning, check that the six bucket counts add up
             to devicesAssessed, and that each site's buckets add up to that
             site's device count. If they don't, recount; never return totals
             that don't add up.
             A site's compliance % = compliant / (compliant + pending + failing +
             noPolicy). needsAttention = pending + failing + noPolicy only; noData
             and notPatchable are never part of needsAttention or the score, at
             the fleet level or per site. A site with no scorable devices is
             reported as "no devices to score", not 0%, and is left out of the
             fleet total.
          3. Match each site to a CloudRadial company using the matching order in
             your instructions (site map, then PSA id, then normalized name). Skip
             and report sites with no match. Never guess a match.
          4. For each matched company, upsert ONE Planner card with the exact
             subject "Patch Compliance Report". Follow your card-writing rules:
             look the card up first. If the lookup found no card, the one write
             is a CREATE; only update or patch a card whose product id came back
             from that lookup. Write the card body in plain sentences: the
             compliance %, what is pending, what is failing, which devices have no
             patch policy, and which devices had no patch data.
          5. Return ONLY the fields in the output schema below, using its exact
             field names. Each entry in sites must have site, cloudradialCompanyId,
             matchedBy (siteMap, psaId, name or none), compliancePercent (null
             when there is nothing to score), needsAttention and cardAction
             (created, updated, previewed or skipped). cardsWritten counts creates
             and updates that actually ran; cardsPreviewed counts dry-run
             previews. Never count a preview as written.
        model: ""
        allowedExtensions:
          - datto-rmm
          - cloudradial-v2-companies
          - cloudradial-v2-services
        timeoutSeconds: 900
        autoApprove: true
        agentSlug: rmm-agent
        inputSchema: |
          {"type":"object","properties":{"siteUid":{"type":"string","description":"Restrict the run to a single Datto site by uid. Omit to run across the whole fleet."}}}
        outputSchema: |
          {"type":"object","properties":{"devicesAssessed":{"type":"number","description":"Every device read, including notPatchable."},"compliant":{"type":"number"},"pending":{"type":"number"},"failing":{"type":"number"},"noPolicy":{"type":"number"},"noData":{"type":"number"},"notPatchable":{"type":"number"},"needsAttention":{"type":"number","description":"pending + failing + noPolicy."},"fleetCompliancePercent":{"type":"number"},"sites":{"type":"array","items":{"type":"object","properties":{"site":{"type":"string"},"cloudradialCompanyId":{"type":"number"},"matchedBy":{"type":"string","enum":["siteMap","psaId","name","none"]},"compliancePercent":{"type":["number","null"]},"cardAction":{"type":"string","enum":["created","updated","previewed","skipped"]},"needsAttention":{"type":"number"}},"required":["site","cloudradialCompanyId","matchedBy","compliancePercent","needsAttention","cardAction"]}},"cardsWritten":{"type":"number","description":"Creates and updates that actually ran."},"cardsPreviewed":{"type":"number","description":"Dry-run previews only."},"unmatchedSites":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["devicesAssessed","cardsWritten","cardsPreviewed","summary"]}
  connections:
    - source: start
      target: node-1
      sourceHandle: null
    - source: node-1
      target: end
      sourceHandle: null
  startActivityId: start
