# GENERATED by recurring-issue-finder/src/build.js. Do not edit by hand.
automationsWorkflow: 1
name: "Recurring Issue Finder (HaloPSA)"
description: "Runs one Recurring Issue Finder check-in by hand: finds the issues that keep coming back in each client's last 30 days of HaloPSA tickets and proposes a problem ticket with a KB draft for the top three, each waiting for approval. Import the Recurring Issue Finder (HaloPSA) agent first. Optional run input: {\"lookback_days\": 30, \"min_tickets\": 3, \"max_proposals\": 3}."
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 100
        y: 120
      properties:
        webhookEnabled: false
    - id: node-settings
      name: Check-in settings
      type: powershell-script
      position:
        x: 300
        y: 120
      properties:
        script: |
          # Recurring Issue Finder: check-in settings (first step of the goal workflow, left unbound).
          # Run input (all optional): {"lookback_days": 30, "min_tickets": 3, "max_proposals": 3}
          # Builds the request the agent node reads. No PSA calls here.
          $ErrorActionPreference = 'Stop'

          function Get-RifProp {
              param($Obj, [string]$Name)
              if ($null -eq $Obj) { return $null }
              if ($Obj -is [System.Collections.IDictionary]) { if ($Obj.Contains($Name)) { return $Obj[$Name] }; return $null }
              $p = $Obj.PSObject.Properties[$Name]
              if ($p) { return $p.Value }
              return $null
          }

          function Get-RifInt {
              param($Obj, [string]$Name, [int]$Default, [int]$Min, [int]$Max, $Warnings)
              $v = Get-RifProp $Obj $Name
              if ($null -eq $v -or "$v" -eq '') { return $Default }
              $n = 0
              if (-not [int]::TryParse("$v", [ref]$n) -or $n -lt $Min -or $n -gt $Max) {
                  $Warnings.Add("$Name '$v' is not a whole number from $Min to $Max, so $Default was used.")
                  return $Default
              }
              return $n
          }

          $in = Get-NodeInput
          $t = Get-RifProp $in 'trigger'
          if ($null -ne $t) { $in = $t }
          if ($in -is [string]) {
              $s = $in.Trim()
              if ($s.StartsWith('{')) { $in = $s | ConvertFrom-Json } else { $in = $null }
          }

          $warnings = [System.Collections.Generic.List[string]]::new()
          $days = Get-RifInt $in 'lookback_days' 30 7 90 $warnings
          $min  = Get-RifInt $in 'min_tickets' 3 2 20 $warnings
          $max  = Get-RifInt $in 'max_proposals' 3 1 5 $warnings

          $request = "Look-back: the last $days days. Minimum tickets per theme: $min. Propose at most $max problem tickets. " +
              "Today is $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')) (UTC)."

          Set-NodeOutput ([ordered]@{
              status        = 'success'
              message       = "Check-in over the last $days days, themes of $min or more tickets, at most $max proposals."
              request       = $request
              lookback_days = $days
              min_tickets   = $min
              max_proposals = $max
              warnings      = @($warnings)
          })
        timeoutSeconds: 60
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {"lookback_days": 30, "min_tickets": 3, "max_proposals": 3}
    - id: node-agent
      name: Find recurring issues
      type: agent
      position:
        x: 520
        y: 120
      properties:
        agentSlug: recurring-issue-finder-halo
        goal: "Run one Recurring Issue Finder check-in in HaloPSA. Your request input gives the look-back, the minimum tickets per theme, the most proposals and today's date. Read your notes and the Recurring Issue Rules and Problem Ticket Standards when you have them. Read the tickets in one or two bulk queries, group each client's tickets into themes, rank them, and propose a problem ticket with a KB draft for each top theme that isn't already proposed or covered by an open problem ticket. Every write is a proposal for approval; change nothing else. Return the structured output."
        model: ""
        # Never leave this list empty: an empty list gives the agent every installed extension.
        allowedExtensions:
          - halo-psa
        timeoutSeconds: 900
        autoApprove: false
        inputBindingsJson: '{"request":"{{ nodes.node-settings.output.request }}"}'
        inputSchema: '{"type":"object","properties":{"request":{"type":"string"}},"required":["request"],"additionalProperties":false}'
        outputSchema: '{"type":"object","properties":{"window":{"type":"string","description":"The look-back used, for example \"2026-10-14 to 2026-11-13\"."},"ticketsRead":{"type":"number"},"themes":{"type":"array","items":{"type":"object","properties":{"client":{"type":"string"},"clientId":{"type":"string"},"theme":{"type":"string"},"ticketIds":{"type":"array","items":{"type":"string"}},"count":{"type":"number"},"proposed":{"type":"boolean"},"reason":{"type":"string","description":"Why it was or was not proposed."}},"required":["client","theme","ticketIds","count","proposed"]}},"proposals":{"type":"number","description":"Problem tickets proposed in this check-in."},"standardsApplied":{"type":"array","items":{"type":"string"},"description":"Each rule used, as \"document - heading: rule\"."},"standardsSource":{"type":"string","enum":["knowledge","mixed","default"]},"questions":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["ticketsRead","themes","proposals","summary"]}'
    - id: end
      name: End
      type: end
      position:
        x: 740
        y: 120
  connections:
    - source: start
      target: node-settings
      sourceHandle: null
