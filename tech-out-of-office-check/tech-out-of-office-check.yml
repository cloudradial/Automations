        # >>> _shared/postmark.ps1 (generated by _shared/inject.js; edit the source, not this block)
        # ---------- _shared/postmark.ps1: staff email through Postmark ----------
        # Edit this file, then run: node _shared/inject.js <automation-folder>
        # Same secret names as the Postmark catalog extension and deliver-result:
        #   Postmark-ServerToken (required), Postmark-FromEmail (required, a verified sender),
        #   Postmark-ApiUrl (optional, default https://api.postmarkapp.com).
        # Emails go to staff (service manager, dispatcher, account manager). Messages to a ticket's requester go
        # through a public PSA note instead, so the PSA emails them. Stands alone: it needs no other _shared file.

        function Get-PmSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; return $v }
        function Get-PmProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Test-PmEmail { param([string]$s) return ([string]$s -match '^[^@\s]+@[^@\s]+\.[^@\s]+$') }
        # $true when both required secrets are set.
        function Test-PmConfigured { return (-not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-ServerToken')) -and -not [string]::IsNullOrWhiteSpace((Get-PmSecret 'Postmark-FromEmail'))) }
        # Text made safe to put inside HTML.
        function ConvertTo-PmHtml { param([string]$s) if ($null -eq $s) { return '' }; return [System.Net.WebUtility]::HtmlEncode($s) }

        # Sends one email. Never throws, so a report or alert still finishes when email fails; the caller falls back
        # (usually to an internal note) when sent is $false.
        #   -To       one or more addresses, or one comma/semicolon separated string. Invalid addresses are dropped.
        #   -Html / -Text  at least one is needed. -Tag and -Stream (default 'outbound') are passed to Postmark.
        #   -From     overrides the Postmark-FromEmail secret (it must still be a verified sender).
        # Returns @{ configured; sent; reason; messageId; to }. configured is $false when the token or sender is missing.
        # Retries 429 and 5xx twice. A 401 names the Postmark-ServerToken secret.
        function Send-PmMail {
            param([string[]]$To, [string]$Subject, [string]$Html = '', [string]$Text = '', [string]$Tag = '', [string]$Stream = 'outbound', [string]$From = '')
            $rcpt = @(@($To) | ForEach-Object { ([string]$_) -split '[,;]' } | ForEach-Object { $_.Trim() } | Where-Object { Test-PmEmail $_ } | Select-Object -Unique)
            $token = Get-PmSecret 'Postmark-ServerToken'
            $sender = if ($From.Trim()) { $From.Trim() } else { [string](Get-PmSecret 'Postmark-FromEmail') }
            if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($sender)) {
                $miss = @(); if ([string]::IsNullOrWhiteSpace($token)) { $miss += 'Postmark-ServerToken' }; if ([string]::IsNullOrWhiteSpace($sender)) { $miss += 'Postmark-FromEmail' }
                return @{ configured = $false; sent = $false; reason = "Postmark isn't set up (add the $($miss -join ' and ') secret$(if ($miss.Count -gt 1) { 's' }))."; messageId = ''; to = @($rcpt) }
            }
            if (-not $rcpt.Count) { return @{ configured = $true; sent = $false; reason = 'There is no valid recipient address.'; messageId = ''; to = @() } }
            if (-not $Html -and -not $Text) { return @{ configured = $true; sent = $false; reason = 'The email has no body.'; messageId = ''; to = @($rcpt) } }
            $api = Get-PmSecret 'Postmark-ApiUrl'; if ([string]::IsNullOrWhiteSpace($api)) { $api = 'https://api.postmarkapp.com' }
            $body = [ordered]@{ From = $sender.Trim(); To = ($rcpt -join ','); Subject = $Subject; MessageStream = $Stream }
            if ($Html) { $body.HtmlBody = $Html }
            if ($Text) { $body.TextBody = $Text }
            if ($Tag) { $body.Tag = $Tag }
            $h = @{ 'X-Postmark-Server-Token' = $token.Trim(); Accept = 'application/json' }
            for ($i = 1; $i -le 3; $i++) {
                try {
                    $r = Invoke-RestMethod -Method POST -Uri "$($api.TrimEnd('/'))/email" -Headers $h -Body (ConvertTo-Json -InputObject $body -Depth 5 -Compress) -ContentType 'application/json' -ErrorAction Stop
                    $code = Get-PmProp $r 'ErrorCode'
                    if ($null -ne $code -and [int]$code -ne 0) { return @{ configured = $true; sent = $false; reason = "Postmark refused the email: $(Get-PmProp $r 'Message')"; messageId = ''; to = @($rcpt) } }
                    return @{ configured = $true; sent = $true; reason = ''; messageId = [string](Get-PmProp $r 'MessageID'); to = @($rcpt) }
                }
                catch {
                    $status = 0; try { $status = [int]$_.Exception.Response.StatusCode } catch { }
                    if (($status -eq 429 -or $status -ge 500) -and $i -lt 3) { Start-Sleep -Seconds (2 * $i); continue }
                    $d = $null; try { if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $d = $_.ErrorDetails.Message } } catch { }
                    if (-not $d) { $d = [string]$_.Exception.Message }
                    $msg = $d; try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-PmProp $j 'Message'; if ($m) { $msg = [string]$m } } catch { }
                    $why = if ($status -eq 401) { 'Postmark rejected the server token (HTTP 401). Check the Postmark-ServerToken secret.' } else { "Postmark couldn't send the email$(if ($status) { " (HTTP $status)" }): $msg" }
                    return @{ configured = $true; sent = $false; reason = $why; messageId = ''; to = @($rcpt) }
                }
            }
            return @{ configured = $true; sent = $false; reason = 'Postmark kept refusing the email.'; messageId = ''; to = @($rcpt) }
        }
        # ---------- end _shared/postmark.ps1 ----------
        # <<< _shared/postmark.ps1
        # >>> src/step.ps1 (generated by src/build.js; edit the source, not this block)
        # ---------- src/step.ps1: helpers every step in this workflow uses ----------
        # Reading the trigger body (flat or the CloudRadial {Ticket, Company} shape), reading the previous
        # step's context, and escaping text for HTML. Staff email uses Send-PmMail from _shared/postmark.ps1.

        function Get-StepProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
        function Read-StepJson { param($v) if ($null -eq $v) { return $null }; if ($v -is [string]) { if (-not $v.Trim()) { return $null }; try { return ($v | ConvertFrom-Json) } catch { return $null } }; return $v }
        function Test-StepTrue { param($v) if ($v -eq $true) { return $true }; return (@('true', 'yes', 'y', '1') -contains ([string]$v).Trim().ToLowerInvariant()) }
        # A value as trimmed text. A CloudRadial token that wasn't filled in arrives as literal "@name", which counts as missing.
        function Get-StepText { param($v) if ($null -eq $v) { return '' }; $s = ([string]$v).Trim(); if ($s.StartsWith('@')) { return '' }; return $s }
        # A list from a comma, semicolon or line separated value (or an array). Items are trimmed; an item may start with @ (an @domain).
        function Get-StepList { param($v) if ($null -eq $v) { return @() }; if ($v -isnot [string]) { return @(@($v) | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ }) }; return @(($v -split '[,;\r\n]+') | ForEach-Object { $_.Trim() } | Where-Object { $_ }) }
        function Test-StepEmail { param([string]$s) return ($s -match '^[^@\s]+@[^@\s]+\.[^@\s]+$') }

        # Every simple field of the trigger body, keyed case-insensitively. Handles a body wrapped in "trigger",
        # a JSON string, and the CloudRadial {Ticket:{TicketId, Questions:[{Id, Value}]}, Company:{...}} shape.
        function Read-StepTrigger {
            param($Raw)
            $in = Read-StepJson $Raw
            $w = Get-StepProp $in 'trigger'; if ($null -ne $w) { $in = Read-StepJson $w }
            $a = @{}
            if ($null -eq $in -or $in -is [string] -or $in -is [array]) { return $a }
            $addProps = {
                param($obj, [string]$prefix)
                $pairs = if ($obj -is [System.Collections.IDictionary]) { @($obj.Keys | ForEach-Object { [pscustomobject]@{ Name = [string]$_; Value = $obj[$_] } }) } else { @($obj.PSObject.Properties | ForEach-Object { [pscustomobject]@{ Name = $_.Name; Value = $_.Value } }) }
                foreach ($p in $pairs) {
                    if ($null -eq $p.Value) { continue }
                    if ($p.Value -is [string] -or $p.Value.GetType().IsValueType) { $a["$prefix$($p.Name)"] = $p.Value }
                }
            }
            & $addProps $in ''
            $t = Get-StepProp $in 'Ticket'
            if ($null -ne $t -and $t -isnot [string]) {
                & $addProps $t 'Ticket.'
                foreach ($q in @(Get-StepProp $t 'Questions')) { $qid = [string](Get-StepProp $q 'Id'); if ($qid) { $a[$qid] = Get-StepProp $q 'Value' } }
                foreach ($k in @('TicketId', 'Status', 'StatusName', 'Subject', 'Summary', 'ContactEmail', 'Priority')) { if ($a.ContainsKey("Ticket.$k") -and -not $a.ContainsKey($k)) { $a[$k] = $a["Ticket.$k"] } }
            }
            $co = Get-StepProp $in 'Company'
            if ($null -ne $co -and $co -isnot [string]) {
                & $addProps $co 'Company.'
                foreach ($k in @('CompanyName', 'CompanyId', 'CompanyPsaId', 'CompanyTenantId')) { if ($a.ContainsKey("Company.$k") -and -not $a.ContainsKey($k)) { $a[$k] = $a["Company.$k"] } }
                if ($a.ContainsKey('Company.Name') -and -not $a.ContainsKey('CompanyName')) { $a['CompanyName'] = $a['Company.Name'] }
            }
            return $a
        }
        # The first non-empty field among the names.
        function Get-StepField { param([hashtable]$A, [string[]]$Names) foreach ($n in $Names) { if ($A.ContainsKey($n)) { $v = Get-StepText $A[$n]; if ($v) { return $v } } }; return '' }

        # The previous step's context, carried in its output as ctx (an object) or ctx_json (a string).
        function Read-StepContext {
            param($Raw)
            $in = Read-StepJson $Raw
            $ctx = Read-StepJson (Get-StepProp $in 'ctx_json')
            if ($null -eq $ctx) { $ctx = Read-StepJson (Get-StepProp $in 'ctx') }
            return $ctx
        }

        function ConvertTo-StepHtml { param([string]$s) if ($null -eq $s) { return '' }; return ($s -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;' -replace '"', '&quot;') }
        # ---------- end src/step.ps1 ----------
        # <<< src/step.ps1
        # >>> src/availability.ps1 (generated by src/build.js; edit the source, not this block)
        # ---------- src/availability.ps1: is a ConnectWise member out right now? ----------
        # Reads the two places a dispatcher marks a technician as out in ConnectWise PSA:
        #   1. The In/Out Board (GET /system/inOutBoards). An entry whose Date Back is still ahead, and whose In/Out type
        #      isn't one of the "in" types (OOO-InTypes), means the member is out until then.
        #   2. Schedule entries (GET /schedule/entries). An entry for the member that covers right now, whose schedule type
        #      or entry name matches one of the out-of-office names (OOO-ScheduleTypes), means the member is out until it ends.
        # Unverified against a live ConnectWise: whether an "In Office" board record keeps a future Date Back (the type check
        # covers it either way), and the schedule type name each Partner uses for out-of-office time (a setting).
        # Needs _shared/psa.ps1 (Invoke-Psa, Get-PsaFirst, ConvertTo-PsaDate, Format-PsaDate, ConvertTo-PsaQuery).

        $OooDefaults = @{
            InTypes       = 'In Office, In'
            ScheduleTypes = 'Out of Office, PTO, Vacation, Holiday, Sick, Wellness'
        }

        # A setting: the input value when it's sent, else the runner secret, else the default.
        function Get-OooSetting { param([string]$InputValue, [string]$Secret, [string]$Default = '') if ($InputValue) { return $InputValue }; $s = [string](Get-PsaSecret $Secret); if ($s.Trim()) { return $s.Trim() }; return $Default }

        # The list of names, lowercased and trimmed.
        function Get-OooNames { param([string]$Value) return @(($Value -split '[,;\r\n]+') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ }) }

        # A UTC time shown in the dispatcher's time zone, for example "Thu 10/15 12:00 AM Central Daylight Time".
        # $TimeZone is an IANA (America/Chicago) or Windows (Central Standard Time) id; blank or unknown shows UTC.
        function Format-OooTime {
            param($When, [string]$TimeZone = '', [switch]$Short)
            $d = ConvertTo-PsaDate $When
            if ($null -eq $d) { return 'an unknown time' }
            $tz = $null
            if ($TimeZone) { try { $tz = [TimeZoneInfo]::FindSystemTimeZoneById($TimeZone.Trim()) } catch { $tz = $null } }
            $ci = [Globalization.CultureInfo]::InvariantCulture
            if ($null -eq $tz) { return $d.ToString('ddd M/d h:mm tt', $ci) + ' UTC' }
            $local = [TimeZoneInfo]::ConvertTimeFromUtc($d, $tz)
            $label = if ($tz.IsDaylightSavingTime($local)) { $tz.DaylightName } else { $tz.StandardName }
            # -Short: US zones as PDT, CST and so on; other zones keep their full name.
            if ($Short -and $label -match '^(Pacific|Mountain|Central|Eastern|Alaskan|Hawaiian)( Daylight| Standard) Time$') { $label = ($label -split ' ' | ForEach-Object { $_.Substring(0, 1) }) -join '' }
            return $local.ToString('ddd M/d h:mm tt', $ci) + " $label"
        }
        # $true when the time zone id is one this runner knows.
        function Test-OooTimeZone { param([string]$TimeZone) if (-not $TimeZone) { return $true }; try { $null = [TimeZoneInfo]::FindSystemTimeZoneById($TimeZone.Trim()); return $true } catch { return $false } }

        # ConnectWise conditions date literal: [2026-10-13T21:00:00Z]
        function Format-OooCwDate { param([datetime]$When) return '[' + $When.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture) + ']' }

        # The identifier for a member record id (Member #). Throws a plain sentence when there is no such member.
        function Resolve-OooMemberId {
            param([string]$Id)
            $m = $null
            try { $m = Invoke-Psa GET "/system/members/$Id" } catch { if ([string]$_.Exception.Message -match '\(HTTP 404\)') { throw "ConnectWise has no member #$Id." }; throw }
            $ident = [string](Get-PsaProp $m 'identifier')
            if (-not $ident) { throw "ConnectWise member #$Id has no identifier." }
            return $ident
        }

        # Members named on the ticket: the owner, the resources list, and any extra identifiers passed in.
        # Returns identifiers (lowercase-insensitive unique, original spelling kept).
        function Get-OooTicketMembers {
            param($Ticket, [string[]]$Extra = @())
            $list = New-Object System.Collections.ArrayList
            $seen = @{}
            # A number is a ConnectWise member record id (Member #), which is looked up and turned into its identifier.
            $addOne = { param([string]$m) $m = ([string]$m).Trim(); if (-not $m) { return }; if ($m -match '^\d+$') { $m = Resolve-OooMemberId $m }; if (-not $m) { return }; $k = $m.ToLowerInvariant(); if (-not $seen.ContainsKey($k)) { $seen[$k] = $true; $null = $list.Add($m) } }
            & $addOne ([string](Get-PsaPath $Ticket 'owner.identifier'))
            foreach ($r in @(([string](Get-PsaProp $Ticket 'resources')) -split '[,;\s]+')) { & $addOne $r }
            foreach ($e in @($Extra)) { foreach ($r in @(([string]$e) -split '[,;\s]+')) { & $addOne $r } }
            return @($list)
        }

        # Whether one member is out at $Now. Returns @{ identifier; out; reasons; back } where back is the latest
        # time any matching record says they return ('' when unknown).
        function Get-OooMemberStatus {
            param([string]$Identifier, [datetime]$Now, [string[]]$InTypes, [string[]]$ScheduleTypes, [string]$TimeZone = '')
            $reasons = New-Object System.Collections.ArrayList
            $items = New-Object System.Collections.ArrayList   # @{ what; where; until } for the dispatcher email
            $seen = New-Object System.Collections.ArrayList   # every record read and why it counted or not, for the run output
            $back = $null
            $who = 'member/identifier="' + $Identifier.Replace('"', '') + '"'

            # 1. In/Out Board
            $boardQ = ConvertTo-PsaQuery $who
            $board = @(Invoke-Psa GET "/system/inOutBoards?conditions=$boardQ&orderBy=$(ConvertTo-PsaQuery 'id desc')&pageSize=25" | Where-Object { $null -ne $_ })
            foreach ($b in $board) {
                $type = [string](Get-PsaFirst $b @('inOutType.name', 'inOutType.description'))
                $rawBack = [string](Get-PsaProp $b 'dateBack')
                $db = ConvertTo-PsaDate (Get-PsaProp $b 'dateBack')
                $desc = "In/Out Board record $(Get-PsaProp $b 'id'): type '$type', dateBack '$rawBack'"
                if ($type -and ($InTypes -contains $type.Trim().ToLowerInvariant())) { $null = $seen.Add("$desc. Counted as in: '$type' is an in type."); continue }
                if ($null -eq $db) { $null = $seen.Add("$desc. Not counted: no Date Back."); continue }
                if ($db -le $Now) { $null = $seen.Add("$desc. Not counted: Date Back is not after $(Format-PsaDate $Now)."); continue }
                $null = $seen.Add("$desc. Counted as out.")
                $label = if ($type) { $type } else { 'Out' }
                $info = [string](Get-PsaProp $b 'additionalInfo')
                $null = $reasons.Add("In/Out Board: $label until $(Format-OooTime $db $TimeZone)$(if ($info) { " ($info)" })")
                $null = $items.Add([ordered]@{ what = "$label$(if ($info) { ": $info" })"; where = 'In/Out Board'; until = (Format-OooTime $db $TimeZone -Short) })
                if ($null -eq $back -or $db -gt $back) { $back = $db }
            }

            # 2. Schedule entries that cover right now
            $nowLit = Format-OooCwDate $Now
            $schedQ = ConvertTo-PsaQuery "$who and dateStart<=$nowLit and dateEnd>$nowLit"
            $entries = @(Invoke-Psa GET "/schedule/entries?conditions=$schedQ&pageSize=100" | Where-Object { $null -ne $_ })
            foreach ($e in $entries) {
                $type = [string](Get-PsaFirst $e @('type.name', 'type.identifier'))
                $name = [string](Get-PsaProp $e 'name')
                # An Activity booked on a member's calendar becomes a schedule entry of type 'C' named after the activity's
                # summary. Its activity type (for example a Partner's own "Out of Office" type) is read too when the API
                # member may read Activities; without that permission the summary alone is matched.
                $actType = ''
                if ([string](Get-PsaPath $e 'type.identifier') -eq 'C' -and -not (Test-PsaBlank (Get-PsaProp $e 'objectId'))) {
                    try { $actType = [string](Get-PsaPath (Invoke-Psa GET "/sales/activities/$(Get-PsaProp $e 'objectId')") 'type.name') } catch { $actType = '' }
                    if ($actType) { $type = "Activity: $actType" }
                }
                $hay = "$type`n$name".ToLowerInvariant()
                $hit = $null
                foreach ($t in $ScheduleTypes) { if ($hay.Contains($t)) { $hit = $t; break } }
                if (-not $hit) { $null = $seen.Add("Schedule entry $(Get-PsaProp $e 'id'): type '$type', name '$name'. Not counted: not an out-of-office type."); continue }
                $null = $seen.Add("Schedule entry $(Get-PsaProp $e 'id'): type '$type', name '$name'. Counted as out.")
                $end = ConvertTo-PsaDate (Get-PsaProp $e 'dateEnd')
                $label = if ($type) { $type } else { $name }
                $null = $reasons.Add("Schedule: $label$(if ($name -and $name -ne $label) { " '$name'" }) until $(Format-OooTime $end $TimeZone)")
                $kind = ([string]$type) -replace '^Activity: ', ''
                $null = $items.Add([ordered]@{ what = $(if ($name) { $name } else { $label }); where = $(if ($kind -and $kind -ne $name) { "Schedule, $kind" } else { 'Schedule' }); until = (Format-OooTime $end $TimeZone -Short) })
                if ($null -ne $end -and ($null -eq $back -or $end -gt $back)) { $back = $end }
            }
            if (-not $board.Count) { $null = $seen.Add('In/Out Board: no records for this member.') }
            if (-not $entries.Count) {
                $null = $seen.Add('Schedule: no entries covering now.')
                # Diagnostics only (never counted): what the member has within 24 hours either side, as schedule entries
                # and as calendar activities, so a near miss or the wrong entry kind shows up in the run output.
                $from = Format-OooCwDate $Now.AddHours(-24); $to = Format-OooCwDate $Now.AddHours(24)
                try {
                    $near = @(Invoke-Psa GET "/schedule/entries?conditions=$(ConvertTo-PsaQuery "$who and dateStart<$to and dateEnd>$from")&pageSize=25" | Where-Object { $null -ne $_ })
                    foreach ($e in $near) { $null = $seen.Add("Nearby schedule entry $(Get-PsaProp $e 'id') (not covering now): type '$(Get-PsaFirst $e @('type.name', 'type.identifier'))', name '$(Get-PsaProp $e 'name')', $(Format-PsaDate (Get-PsaProp $e 'dateStart')) to $(Format-PsaDate (Get-PsaProp $e 'dateEnd')).") }
                    if (-not $near.Count) { $null = $seen.Add('Schedule: no entries within 24 hours of now either.') }
                } catch { $null = $seen.Add("Schedule: the nearby check failed: $($_.Exception.Message)") }
                try {
                    $actWho = 'assignTo/identifier="' + $Identifier.Replace('"', '') + '"'
                    $acts = @(Invoke-Psa GET "/sales/activities?conditions=$(ConvertTo-PsaQuery "$actWho and dateStart<$to and dateEnd>$from")&pageSize=25" | Where-Object { $null -ne $_ })
                    foreach ($x in $acts) { $null = $seen.Add("Activity $(Get-PsaProp $x 'id') (activities are not checked): type '$(Get-PsaPath $x 'type.name')', name '$(Get-PsaProp $x 'name')', $(Format-PsaDate (Get-PsaProp $x 'dateStart')) to $(Format-PsaDate (Get-PsaProp $x 'dateEnd')).") }
                } catch { $null = $seen.Add("Activities: the check failed: $($_.Exception.Message)") }
            }
            return @{ identifier = $Identifier; out = ($reasons.Count -gt 0); reasons = @($reasons); items = @($items); back = (Format-PsaDate $back); evidence = @($seen) }
        }

        # The technician to hand the ticket to: an active member who is in, picked by $PickBy:
        #   fewest-open   fewest open tickets (default)
        #   least-recent  the one whose newest assigned ticket is oldest, so tickets rotate round the team
        #   list-order    the first one in the list (OOO-BackupPool order, else the team's order)
        # Candidates come from $Pool (identifiers or Member #s, in order) when it has any, else from the ticket's team on
        # its board, else from every team on the board. Members in $Exclude (the ones who are out) are skipped.
        # Returns @{ identifier; open; source; how; considered } or @{ identifier = ''; source; considered } when nobody fits.
        # Unverified on a live ConnectWise: GET /service/boards/{id}/teams/{id} and its members list of member record ids.
        function Find-OooReplacement {
            param([string]$PickBy = 'fewest-open', [string[]]$Pool = @(), [string]$PoolLabel = 'the backup list', [string]$BoardId = '', [string]$TeamId = '', [string[]]$Exclude = @(), [datetime]$Now, [string[]]$InTypes, [string[]]$ScheduleTypes, [int]$Max = 25)
            $considered = New-Object System.Collections.ArrayList
            $skip = @{}; foreach ($x in @($Exclude)) { if ($x) { $skip[([string]$x).ToLowerInvariant()] = $true } }
            $cands = New-Object System.Collections.ArrayList   # @{ identifier; order }
            $seen = @{}
            $add = { param($rec, [string]$label) if ($null -eq $rec) { $null = $considered.Add("$label isn't a ConnectWise member."); return }; $i = [string](Get-PsaProp $rec 'identifier'); if (-not $i) { return }; $k = $i.ToLowerInvariant(); if ($seen.ContainsKey($k)) { return }; $seen[$k] = $true; if ($skip.ContainsKey($k)) { return }; if ((Get-PsaProp $rec 'inactiveFlag') -eq $true) { $null = $considered.Add("${i}: inactive."); return }; $null = $cands.Add(@{ identifier = $i; order = $cands.Count }) }
            $source = ''
            $poolList = @($Pool | Where-Object { $_ })
            if ($poolList.Count) {
                $source = $PoolLabel
                foreach ($p in $poolList) { & $add (Get-OooMember ([string]$p)) "'$p'" }
            }
            elseif ($BoardId) {
                $ids = @()
                try {
                    if ($TeamId) { $source = 'the ticket''s team'; $ids = @(Get-PsaProp (Invoke-Psa GET "/service/boards/$BoardId/teams/$TeamId") 'members') }
                    else { $source = 'the board''s teams'; foreach ($t in @(Invoke-Psa GET "/service/boards/$BoardId/teams?pageSize=100" | Where-Object { $null -ne $_ })) { $ids += @(Get-PsaProp $t 'members') } }
                }
                catch {
                    if ([string]$_.Exception.Message -notmatch '\(HTTP 40[134]\)') { throw }
                    $null = $considered.Add("ConnectWise wouldn't list $source ($([string]$_.Exception.Message)). Give the API member Inquire access to service board teams (System > Table Setup), or set OOO-BackupPool.")
                    $ids = @()
                }
                $ids = @($ids | Where-Object { -not (Test-PsaBlank $_) } | ForEach-Object { [string]$_ } | Select-Object -Unique)
                if ($ids.Count) {
                    $q = ConvertTo-PsaQuery "id in ($($ids -join ','))"
                    $recs = @(Invoke-Psa GET "/system/members?conditions=$q&fields=id,identifier,inactiveFlag&pageSize=200" | Where-Object { $null -ne $_ })
                    foreach ($id in $ids) { $r = @($recs | Where-Object { [string](Get-PsaProp $_ 'id') -eq $id }) | Select-Object -First 1; & $add $r "Member #$id" }
                }
                elseif (-not $considered.Count) { $null = $considered.Add("$source has no members.") }
            }
            else { $source = 'nowhere'; $null = $considered.Add('The ticket has no board and no OOO-BackupPool is set.') }
            if ($cands.Count -gt $Max) { $null = $considered.Add("Only the first $Max of $($cands.Count) candidates were checked."); $cands = @($cands[0..($Max - 1)]) }
            $PickBy = ([string]$PickBy).Trim().ToLowerInvariant(); if (-not $PickBy) { $PickBy = 'fewest-open' }
            $unknown = [int]::MaxValue
            # Each candidate gets a rank: open-ticket count, the date of their newest assigned ticket, or the list position.
            foreach ($c in $cands) {
                $c.open = $unknown; $c.last = $null
                if ($PickBy -eq 'fewest-open') { $n = $null; try { $n = Get-PsaOpenCount $c.identifier } catch { $n = $null }; if ($null -ne $n) { $c.open = [int]$n } }
                elseif ($PickBy -eq 'least-recent') { try { $c.last = Get-PsaLastAssigned $c.identifier } catch { $c.last = $null } }
            }
            $rankText = {
                param($c)
                if ($PickBy -eq 'fewest-open') { if ($c.open -eq $unknown) { 'open tickets unknown' } elseif ($c.open -eq 1) { '1 open ticket' } else { "$($c.open) open tickets" } }
                elseif ($PickBy -eq 'least-recent') { if ($null -eq $c.last) { 'last assignment unknown' } elseif ($c.last -eq [datetime]::MinValue) { 'no tickets assigned' } else { "newest ticket $(Format-PsaDate $c.last)" } }
                else { "#$($c.order + 1) in the list" }
            }
            $sorted = @(switch ($PickBy) {
                'least-recent' { @($cands | Sort-Object @{ e = { if ($null -eq $_.last) { [datetime]::MaxValue } else { $_.last } } }, @{ e = { $_.order } }) }
                'list-order' { @($cands | Sort-Object @{ e = { $_.order } }) }
                default { @($cands | Sort-Object @{ e = { $_.open } }, @{ e = { $_.order } }) }
            })
            $how = switch ($PickBy) { 'least-recent' { 'longest since their last ticket' } 'list-order' { 'first available in the list' } default { 'fewest open tickets' } }
            for ($i = 0; $i -lt $sorted.Count; $i++) {
                $c = $sorted[$i]
                $s = Get-OooMemberStatus -Identifier $c.identifier -Now $Now -InTypes $InTypes -ScheduleTypes $ScheduleTypes
                if ($s.out) { $null = $considered.Add("$($c.identifier) ($(& $rankText $c)): out ($($s.reasons -join '; '))."); continue }
                $null = $considered.Add("$($c.identifier) ($(& $rankText $c)): in. Picked.")
                # Everyone after the pick, with their rank, so the run shows why they lost. Their availability isn't read.
                for ($j = $i + 1; $j -lt $sorted.Count; $j++) {
                    $o = $sorted[$j]
                    $why = switch ($PickBy) {
                        'least-recent' { "$($c.identifier) has gone longer without a ticket" }
                        'list-order' { "$($c.identifier) is earlier in the list" }
                        default { if ($o.open -eq $c.open) { "same count as $($c.identifier), later in the list" } else { "more open tickets than $($c.identifier)" } }
                    }
                    $null = $considered.Add("$($o.identifier) ($(& $rankText $o)): not picked, $why.")
                }
                $howFull = if ($PickBy -eq 'fewest-open' -and $c.open -ne $unknown) { "fewest open tickets ($($c.open))" } else { $how }
                return @{ identifier = $c.identifier; open = $c.open; source = $source; how = $howFull; considered = @($considered) }
            }
            return @{ identifier = ''; open = $null; source = $source; considered = @($considered) }
        }

        # The coverage table: a ConnectWise Knowledge Base article (title or id) listing who covers for whom, in order.
        # One row per line, "who: first, second, ...", or a two-column table. "who" is a member (identifier or Member #),
        # "Board <board name>", or "*" for everyone else. Lines starting with # are notes.
        # Returns @{ rows = @{ key = @(members) }; title; error }. Keys: member identifier or number lowercased,
        # "board:<name>" lowercased, or "*".
        function Get-OooCoverage {
            param([string]$Article)
            $res = @{ rows = @{}; title = ''; error = '' }
            $a = $null
            try {
                if ($Article -match '^\d+$') { $a = Invoke-Psa GET "/service/knowledgeBaseArticles/$Article" }
                else {
                    $q = ConvertTo-PsaQuery ('title="' + $Article.Replace('\', '\\').Replace('"', '\"') + '"')
                    $a = @(Invoke-Psa GET "/service/knowledgeBaseArticles?conditions=$q&pageSize=5" | Where-Object { $null -ne $_ }) | Select-Object -First 1
                }
            }
            catch {
                $m = [string]$_.Exception.Message
                $res.error = if ($m -match '\(HTTP 40[13]\)') { "ConnectWise wouldn't read the coverage article '$Article' ($m). Give the API member Inquire access to the Knowledge Base." } elseif ($m -match '\(HTTP 404\)') { "There is no Knowledge Base article '$Article'." } else { "The coverage article '$Article' couldn't be read: $m" }
                return $res
            }
            if ($null -eq $a) { $res.error = "There is no Knowledge Base article titled '$Article'. Check OOO-CoverageArticle."; return $res }
            $res.title = [string](Get-PsaProp $a 'title')
            # Unverified on a live ConnectWise: which article fields hold the body (issue and resolution are read).
            $body = (@('issue', 'resolution', 'description', 'text') | ForEach-Object { [string](Get-PsaProp $a $_) } | Where-Object { $_ }) -join "`n"
            # HTML to lines: rows and paragraphs end a line, table cells become a separator.
            # Table rows first, cell by cell, so a <p> or <br> inside a cell (as the ConnectWise editor writes) can't split it.
            $body = [regex]::Replace($body, '(?is)<tr[^>]*>(.*?)</tr>', { param($m) $cells = @([regex]::Matches($m.Groups[1].Value, '(?is)<t[dh][^>]*>(.*?)</t[dh]>') | ForEach-Object { (($_.Groups[1].Value -replace '(?i)<br\s*/?>|</p>', ' ') -replace '<[^>]+>', '').Trim() }); "`n" + ($cells -join ' | ') + "`n" })
            $body = $body -replace '(?i)</(p|div|li|h\d)>|<br\s*/?>', "`n" -replace '<[^>]+>', ''
            $body = [System.Net.WebUtility]::HtmlDecode($body)
            foreach ($line in ($body -split "`r?`n")) {
                $l = $line.Trim().Trim('|').Trim()
                if (-not $l -or $l.StartsWith('#') -or $l -match '^[-:| ]+$') { continue }
                $parts = $l -split '\s*[:|]\s*', 2
                if ($parts.Count -lt 2) { continue }
                $who = $parts[0].Trim(); $list = @(($parts[1] -split '[,;|]+') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                if (-not $who -or -not $list.Count) { continue }
                if ($who -match '^(?i)(who is out|out|technician|tech|member)$') { continue }   # a table header row
                $key = if ($who -eq '*') { '*' } elseif ($who -match '^(?i)board\s+(.+)$') { 'board:' + $Matches[1].Trim().ToLowerInvariant() } else { $who.ToLowerInvariant() }
                $res.rows[$key] = $list
            }
            if (-not $res.rows.Count) { $res.error = "The coverage article '$($res.title)' has no rows in the form 'who: first, second'." }
            return $res
        }

        # The row that covers an out technician on a board: their own row (by identifier or Member #), then the board's,
        # then "*". Returns @{ list; label } or $null.
        function Select-OooCoverageRow {
            param($Coverage, [string]$Identifier, [string]$MemberId = '', [string]$Board = '')
            $rows = $Coverage.rows
            $tries = @(, @($Identifier.ToLowerInvariant(), "the $Identifier row"))
            if ($MemberId) { $tries += , @($MemberId, "the $Identifier row") }
            if ($Board) { $tries += , @(('board:' + $Board.ToLowerInvariant()), "the $Board board row") }
            $tries += , @('*', 'the * row')
            foreach ($t in $tries) { if ($rows.ContainsKey($t[0])) { return @{ list = @($rows[$t[0]]); label = $t[1] } } }
            return $null
        }

        # The ticket's schedule entries (type S) for one member: what puts the ticket on their calendar and resources list.
        function Get-OooTicketEntries {
            param([string]$TicketId, [string]$Identifier)
            $q = ConvertTo-PsaQuery ("objectId=$TicketId and type/identifier=""S"" and member/identifier=""" + $Identifier.Replace('"', '') + '"')
            return @(Invoke-Psa GET "/schedule/entries?conditions=$q&pageSize=50" | Where-Object { $null -ne $_ })
        }

        # A member record by identifier, or $null. Used to check the backup technician exists and is active.
        function Get-OooMember {
            param([string]$Identifier)
            if ($Identifier -match '^\d+$') { try { return (Invoke-Psa GET "/system/members/$Identifier") } catch { return $null } }
            $q = ConvertTo-PsaQuery ('identifier="' + $Identifier.Replace('"', '') + '"')
            $m = @(Invoke-Psa GET "/system/members?conditions=$q&pageSize=1" | Where-Object { $null -ne $_ })
            if ($m.Count) { return $m[0] }
            return $null
        }
        # ---------- end src/availability.ps1 ----------
        # <<< src/availability.ps1
        # Step 2: Handle the ticket and tell the dispatcher.
        # when_out decides what happens to a ticket whose owner is out:
        #   reassign  make the in, active technician with the fewest open tickets the owner (default). Candidates come
        #             from OOO-BackupPool, else the ticket's board team. Nobody fits: left as is and flagged.
        #   flag      leave the assignment alone
        #   unassign  remove the owner, so the ticket goes back to the dispatch queue (opt-in only)
        # Every live run adds one internal note marked [ooo-check] and alerts the dispatcher (email through Postmark,
        # and a Teams message through a Power Automate flow when OOO-TeamsFlowUrl is set).
        # Until live mode is on (confirm true, or the OOO-LiveMode secret is yes) it writes nothing and returns
        # status pending_confirmation with the note it would add.
        # A sweep (a Routine, no ticket) hands over one context per ticket; each is handled the same way and the run
        # returns a summary of all of them.
        $stopState = @{ done = $false }
        $warnings = New-Object System.Collections.ArrayList
        function Add-ActPsaWarnings { foreach ($w in @($PsaState.Warnings)) { if ($w -and -not $warnings.Contains([string]$w)) { $null = $warnings.Add([string]$w) } } }
        $ctx = Read-StepContext (Get-NodeInput)
        trap { if (-not $stopState.done) { $stopState.done = $true; $m = [string]$_.Exception.Message; $tid = ''; if ($null -ne $ctx) { $tid = [string]$ctx.ticket_id }; Add-ActPsaWarnings; Set-NodeOutput ([ordered]@{ status = 'error'; message = "The out-of-office check for ticket $tid could not be completed: $m"; public_note = ''; internal_note = "Out-of-office check failed: $m"; ticket_id = $tid; out_members = @(); changed = $false; actions = @(); warnings = @($warnings); chatReply = 'The out-of-office check failed. See the run for details.' }) }; break }
        if ($null -eq $ctx -or $null -eq $ctx.PSObject.Properties['skip']) { throw 'The check result is missing. Run the workflow from the start.' }
        if ($ctx.skip) { $stopState.done = $true; Set-NodeOutput $ctx.result; return }
        $conn = Connect-Psa 'connectwise'
        $OooCache = @{ coverage = $null }   # the coverage article, read once per run

        # One ticket: the change, the note and the alert. Returns the result for that ticket.
        function Invoke-OooTicket {
            param($ctx)

            $id = [string]$ctx.ticket_id
            $warnings = New-Object System.Collections.ArrayList
            $actions = New-Object System.Collections.ArrayList; foreach ($x in @($ctx.actions)) { if ($x) { $null = $actions.Add([string]$x) } }
            foreach ($x in @($ctx.warnings)) { if ($x) { $null = $warnings.Add([string]$x) } }
            $out = @($ctx.out)
            $owner = [string]$ctx.owner
            $ownerOut = $owner -and (@($out | Where-Object { ([string]$_.identifier).ToLowerInvariant() -eq $owner.ToLowerInvariant() }).Count -gt 0)
            $resourceOnly = @($out | Where-Object { -not $owner -or ([string]$_.identifier).ToLowerInvariant() -ne $owner.ToLowerInvariant() } | ForEach-Object { [string]$_.identifier })


            # ---- decide the change ----
            $backupId = ''; $plan = 'flag'; $case = 'flagged'; $poolSource = ''; $planText = 'The assignment was left as it is for the dispatcher to decide.'
            if ($ownerOut -and $ctx.when_out -eq 'unassign') { $plan = 'unassign'; $case = 'unassigned'; $planText = "$owner was removed as owner so the ticket goes back to dispatch." }
            $considered = @(); $pick = $null
            if ($ownerOut -and $ctx.when_out -eq 'reassign') {
                # list-order with a coverage article: the out owner's row, else the board's, else "*", in that order.
                $pickBy = [string]$ctx.pick_by; $pool = @($ctx.backup_pool); $poolLabel = 'the backup list'
                $article = [string](Get-StepProp $ctx 'coverage_article')
                if ($pickBy -eq 'list-order' -and $article) {
                    if ($null -eq $OooCache.coverage) { $OooCache.coverage = Get-OooCoverage $article }
                    if ($OooCache.coverage.error) { $null = $warnings.Add("$($OooCache.coverage.error) The ticket's team was used instead.") }
                    $row = $null
                    if (-not $OooCache.coverage.error) { $row = Select-OooCoverageRow $OooCache.coverage -Identifier $owner -MemberId ([string](Get-StepProp $ctx 'owner_id')) -Board ([string]$ctx.board) }
                    if ($row) { $pool = @($row.list); $poolLabel = "the coverage table ($($row.label))" }
                    else {
                        if (-not $OooCache.coverage.error) { $null = $warnings.Add("The coverage article has no row for $owner, the $([string]$ctx.board) board or *, so the ticket's team was used (fewest open tickets).") }
                        $pool = @(); $pickBy = 'fewest-open'
                    }
                }
                $pick = Find-OooReplacement -PickBy $pickBy -Pool $pool -PoolLabel $poolLabel -BoardId ([string]$ctx.board_id) -TeamId ([string]$ctx.team_id) -Exclude @($out | ForEach-Object { [string]$_.identifier }) -Now (ConvertTo-PsaDate $ctx.now) -InTypes @($ctx.in_types) -ScheduleTypes @($ctx.schedule_types)
                $considered = @($pick.considered)
                if ($pick.identifier) {
                    $plan = 'reassign'; $case = 'reassigned'; $backupId = [string]$pick.identifier
                    $why = "from $($pick.source), $($pick.how)"
                    $planText = "The ticket was reassigned from $owner to $backupId, who is in ($why)."
                }
                else {
                    $case = 'no-replacement'; $poolSource = [string]$pick.source
                    $planText = "Nobody in $($pick.source) is in and active right now, so the ticket was left with $owner for the dispatcher to reassign."
                    $null = $warnings.Add("No replacement technician was found in $($pick.source): $($considered -join ' ')")
                }
            }
            if (-not $ownerOut) { $case = if ($owner) { 'resource-only' } else { 'no-owner' } }
            if (-not $ownerOut -and $ctx.when_out -ne 'flag') {
                if (-not $owner) { $planText = "The ticket has no owner saved yet, so nothing was unassigned. Please make sure it isn't scheduled to $(@($out | ForEach-Object { $_.identifier }) -join ', ')."; $null = $warnings.Add("Ticket $id has no owner saved in ConnectWise yet, so there was nothing to $($ctx.when_out). If ServiceAI assigns after the Action runs, the dispatcher alert and note are the record.") }
                else { $null = $warnings.Add("The technician who is out isn't the ticket owner (they're on the resources list), so the assignment was left alone. Remove them from the schedule by hand if needed.") }
            }

            # ---- the note, and the dispatcher email (subject, plain text, HTML), rebuilt if the change fails ----
            $outNames = (@($out | ForEach-Object { [string]$_.identifier }) -join ', ')
            $ticketUrl = ''; try { $ticketUrl = [string](Get-PsaTicketUrl -Id $id) } catch { $ticketUrl = '' }
            $txt = @{}
            $buildText = {
                $lines = @("Out-of-office check: ticket $id is assigned to someone who is out.")
                foreach ($o in $out) { $lines += "- $($o.identifier): $(@($o.reasons) -join '; ')" }
                $lines += $planText
                $txt.note = ($lines -join "`n")

                # What happened (headline), what the dispatcher should do, and the subject, per outcome. Preview says "would".
                $w = if ($ctx.live) { @{ was = 'was'; is = 'is'; has = 'has' } } else { @{ was = 'would be'; is = 'would be'; has = 'would have' } }
                switch ($case) {
                    'reassigned' { $subj = "Ticket $id reassigned to ${backupId}: $owner is out"; $head = "Ticket $id $($w.was) reassigned from $owner to $backupId because $owner is out."; $todo = "Nothing, unless $backupId isn't the right fit. $backupId $($w.was) picked from $(if ($pick) { "$($pick.source) ($($pick.how))" } else { 'the team' })." }
                    'unassigned' { $subj = "Ticket $id unassigned: $owner is out"; $head = "$owner $($w.was) removed as owner of ticket $id because they're out. The ticket $($w.is) back in the dispatch queue."; $todo = 'Assign the ticket to a technician who is in.' }
                    'no-replacement' { $subj = "Action needed: ticket $id is assigned to $owner, who is out"; $head = "Ticket $id is assigned to $owner, who is out, and nobody in $poolSource is available to take it."; $todo = 'Reassign the ticket by hand.' }
                    'failed' { $subj = "Action needed: ticket $id is assigned to $owner, who is out"; $head = "Ticket $id is assigned to $owner, who is out. The workflow tried to $(if ($failedPlan -eq 'unassign') { "remove $owner as owner" } else { "reassign it to $backupId" }), but ConnectWise refused the change."; $todo = "$(if ($failedPlan -eq 'unassign') { 'Remove the owner' } else { "Reassign the ticket to $backupId or another technician" }) by hand." }
                    'no-owner' { $subj = "Check ticket ${id}: $outNames is out"; $head = "Ticket $id has no owner saved yet, and $outNames, who ServiceAI picked for it, is out."; $todo = "Make sure the ticket isn't assigned or scheduled to $outNames." }
                    'resource-only' { $subj = "Check ticket ${id}: $outNames is out"; $head = "$outNames is on the schedule for ticket $id but is out. The owner, $owner, is in."; $todo = "Remove $outNames from the ticket's schedule if they shouldn't be on it." }
                    default { $subj = "Action needed: ticket $id is assigned to $outNames, who is out"; $head = "Ticket $id is assigned to $outNames, who is out."; $todo = 'Reassign the ticket if it can''t wait until they''re back.' }
                }
                if (-not $ctx.live) { $subj = "Preview: $subj" }

                $details = [ordered]@{}
                $details['Ticket'] = "#$id$(if ($ctx.summary) { " $($ctx.summary)" })"
                if ($ctx.company) { $details['Company'] = [string]$ctx.company }
                if ($ctx.board) { $details['Board'] = [string]$ctx.board }

                # Plain text: one fact per line, blank lines between sections (Teams and mail clients that strip HTML).
                $t = @($head, '')
                foreach ($k in $details.Keys) { $t += "${k}: $($details[$k])" }
                if ($ticketUrl) { $t += "Open the ticket: $ticketUrl" }
                foreach ($o in $out) {
                    $t += ''; $t += "Why $($o.identifier) is out:"
                    foreach ($r in @($o.items)) { $t += "  - $($r.what) ($($r.where)), until $($r.until)" }
                }
                $t += ''; $t += "What to do: $todo"
                $t += ''; $t += 'Sent by the Out-of-Office Check workflow in AutomationAI. The ticket has an internal note with the same details.'
                $txt.subject = $subj
                $txt.alert = ($t -join "`n")

                # HTML: the same content, laid out so Outlook doesn't merge lines.
                $e = { param($v) ConvertTo-PmHtml ([string]$v) }
                $rows = foreach ($k in $details.Keys) { "<tr><td style=""padding:2px 12px 2px 0;color:#555"">$(& $e $k)</td><td style=""padding:2px 0"">$(& $e $details[$k])</td></tr>" }
                $why = foreach ($o in $out) {
                    "<p style=""margin:16px 0 4px""><b>Why $(& $e $o.identifier) is out</b></p><ul style=""margin:0;padding-left:20px"">" + ((@($o.items) | ForEach-Object { "<li>$(& $e $_.what) <span style=""color:#555"">($(& $e $_.where))</span>, until <b>$(& $e $_.until)</b></li>" }) -join '') + '</ul>'
                }
                $link = if ($ticketUrl) { "<p style=""margin:12px 0""><a href=""$(& $e $ticketUrl)"">Open ticket $(& $e $id) in ConnectWise</a></p>" } else { '' }
                $txt.html = @"
            <div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#222;line-height:1.4">
            <p style="margin:0 0 12px;font-size:15px"><b>$(& $e $head)</b></p>
            <table style="border-collapse:collapse;font-size:14px">$($rows -join '')</table>
            $link$($why -join '')
            <p style="margin:16px 0 4px"><b>What to do</b></p><p style="margin:0">$(& $e $todo)</p>
            <p style="margin:20px 0 0;color:#777;font-size:12px">Sent by the Out-of-Office Check workflow in AutomationAI. The ticket has an internal note with the same details.</p>
            </div>
        "@
            }
            $failedPlan = ''
            . $buildText
            $noteText = $txt.note; $alertText = $txt.alert; $subject = $txt.subject

            if (-not $ctx.live) {
                # Preview: say what would happen, not what did.
                foreach ($pair in @(@('The ticket was reassigned from', 'The ticket would be reassigned from'), @(' was removed as owner so the ticket goes back', ' would be removed as owner so the ticket would go back'), @('The assignment was left as it is', 'The assignment would be left as it is'), @('so the ticket was left with', 'so the ticket would be left with'))) { $planText = $planText.Replace($pair[0], $pair[1]) }
                . $buildText
                $noteText = $txt.note; $alertText = $txt.alert; $subject = $txt.subject
                $would = if ($plan -eq 'reassign') { " It would go to $backupId." } elseif ($plan -eq 'unassign') { " The owner would be removed." } else { '' }
                $msg = "Preview: ticket $id is assigned to $(@($out | ForEach-Object { $_.identifier }) -join ', '), who is out.$would Live mode is off, so nothing was changed, noted or sent."
                return ([ordered]@{ status = 'pending_confirmation'; message = $msg; public_note = ''; internal_note = $noteText; ticket_id = $id; out_members = $out; plan = $plan; replacement = $backupId; considered = @($considered); changed = $false; subject = $subject; alert_text = $alertText; alert_html = $txt.html; actions = @($actions); warnings = @($warnings); chatReply = $msg })
            }

            # ---- make the change ----
            $changed = $false
            $changeFailed = $false
            try {
                if ($plan -eq 'unassign') {
                    $null = Invoke-Psa PATCH "/service/tickets/$id" @([ordered]@{ op = 'remove'; path = 'owner' })
                    $changed = $true; $null = $actions.Add("Removed $owner as owner of ticket $id.")
                }
                elseif ($plan -eq 'reassign') {
                    Set-PsaAssignee -Id $id -UserId $backupId
                    $changed = $true; $null = $actions.Add("Made $backupId the owner of ticket $id.")
                }
            }
            catch {
                # The dispatcher still needs to know, so a failed change becomes a flag: note and alert still go out.
                $why = [string]$_.Exception.Message
                $changeFailed = $true
                $hint = if ($why -match '\(HTTP 403\)') { ' Give the API member Service Desk > Service Tickets: Edit permission.' } else { '' }
                $null = $warnings.Add("The ticket could not be changed ($plan): $why$hint")
                $planText = "The workflow tried to $(if ($plan -eq 'unassign') { "remove $owner as owner" } else { "reassign the ticket to $backupId" }) but ConnectWise refused, so please do it by hand."
                $failedPlan = $plan; $plan = 'flag'; $case = 'failed'
                . $buildText
                $noteText = $txt.note; $alertText = $txt.alert; $subject = $txt.subject
            }

            # ---- move the out owner's schedule entries on this ticket to the new owner, so the ticket leaves their calendar ----
            # Unverified on a live ConnectWise: PATCH /schedule/entries/{id} replace member.
            if ($changed -and $plan -eq 'reassign') {
                try {
                    foreach ($e in @(Get-OooTicketEntries -TicketId $id -Identifier $owner)) {
                        $eid = [string](Get-PsaProp $e 'id')
                        try {
                            $null = Invoke-Psa PATCH "/schedule/entries/$eid" @([ordered]@{ op = 'replace'; path = 'member'; value = @{ identifier = $backupId } })
                            $null = $actions.Add("Moved schedule entry $eid on ticket $id from $owner to $backupId.")
                        }
                        catch { $null = $warnings.Add("Schedule entry $eid still has $owner on ticket ${id}: $($_.Exception.Message) Give the API member edit access to schedule entries, or move it by hand.") }
                    }
                }
                catch { $null = $warnings.Add("The ticket's schedule entries couldn't be read, so $owner may still show on ticket ${id}'s resources: $($_.Exception.Message)") }
            }

            # ---- tell the dispatcher ----
            $told = @()
            $to = @($ctx.dispatch_to | Where-Object { $_ })
            if ($to.Count) {
                $mail = Send-PmMail -To $to -Subject $subject -Text $alertText -Html $txt.html -Tag 'ooo-check'
                if ($mail.sent) { $told += "email to $($to -join ', ')"; $null = $actions.Add("Emailed the dispatcher ($($to -join ', ')).") }
                else { $null = $warnings.Add("The dispatcher email was not sent: $(([string]$mail.reason).TrimEnd('.')).") }
            }
            if ($ctx.teams_flow) {
                try {
                    $null = Invoke-RestMethod -Method POST -Uri ([string]$ctx.teams_flow) -Body (ConvertTo-Json -InputObject ([ordered]@{ title = $subject; text = $alertText; ticketId = $id }) -Compress) -ContentType 'application/json' -ErrorAction Stop
                    $told += 'Teams'; $null = $actions.Add('Posted the alert to Teams.')
                }
                catch { $null = $warnings.Add("The Teams alert was not posted: $($_.Exception.Message)") }
            }
            if (-not $told.Count) { $null = $warnings.Add('No dispatcher alert went out (set OOO-DispatchTo and Postmark, or OOO-TeamsFlowUrl). The internal note is the only record.') }

            $noteFull = "$noteText`nDispatcher told by: $(if ($told.Count) { $told -join ' and ' } else { 'nobody (no alert is set up)' })."
            $noted = Add-PsaNote -Id $id -Text $noteFull -Title 'Out-of-office check' -Internal -Marker 'ooo-check'
            if ($noted -eq 'already-present') { $null = $warnings.Add("Ticket $id already had the out-of-office note, so no second note was added.") } else { $null = $actions.Add("Added an internal note to ticket $id.") }

            $msg = "Ticket ${id}: $(@($out | ForEach-Object { $_.identifier }) -join ', ') is out. $planText"
            return ([ordered]@{ status = $(if ($changeFailed) { 'incomplete' } else { 'success' }); message = $msg; public_note = ''; internal_note = $noteFull; ticket_id = $id; out_members = $out; plan = $plan; replacement = $(if ($changed) { $backupId } else { '' }); considered = @($considered); changed = $changed; actions = @($actions); warnings = @($warnings); chatReply = $msg })

        }

        if ([string](Get-StepProp $ctx 'mode') -ne 'sweep') {
            $r = Invoke-OooTicket $ctx
            foreach ($w in @($r.warnings)) { if ($w -and -not $warnings.Contains([string]$w)) { $null = $warnings.Add([string]$w) } }
            Add-ActPsaWarnings
            $r.warnings = @($warnings)
            $stopState.done = $true
            Set-NodeOutput $r
            return
        }

        # ---- sweep: every ticket the check step found ----
        foreach ($x in @($ctx.warnings)) { if ($x -and -not $warnings.Contains([string]$x)) { $null = $warnings.Add([string]$x) } }
        $results = New-Object System.Collections.ArrayList
        foreach ($item in @($ctx.items)) {
            $tid = [string]$item.ticket_id
            try { $r = Invoke-OooTicket $item }
            catch { $r = [ordered]@{ status = 'error'; message = "Ticket ${tid}: $($_.Exception.Message)"; ticket_id = $tid; plan = 'flag'; replacement = ''; changed = $false; actions = @(); warnings = @() } }
            $null = $results.Add([ordered]@{ ticket_id = $tid; status = [string]$r.status; plan = [string]$r.plan; replacement = [string]$r.replacement; changed = [bool]$r.changed; message = [string]$r.message; considered = @($r.considered); actions = @($r.actions); warnings = @($r.warnings) })
        }
        Add-ActPsaWarnings
        $stopState.done = $true
        $n = $results.Count
        $moved = @($results | Where-Object { $_.changed }).Count
        $bad = @($results | Where-Object { @('error', 'incomplete') -contains $_.status }).Count
        $preview = -not $ctx.live
        $msg = if (-not $n) { [string]$ctx.message } elseif ($preview) { "Preview: $n ticket$(if ($n -ne 1) { 's' }) assigned to someone who is out. Live mode is off, so nothing was changed, noted or sent." } else { "$n ticket$(if ($n -ne 1) { 's' }) assigned to someone who is out: $moved reassigned$(if ($bad) { ", $bad need a person (see results)" })." }
        $status = if ($preview -and $n) { 'pending_confirmation' } elseif ($bad) { 'incomplete' } else { 'success' }
        Set-NodeOutput ([ordered]@{ status = $status; message = $msg; public_note = ''; internal_note = ''; ticket_id = ''; mode = 'sweep'; out_now = @($ctx.out_now); tickets = @($results); skipped = @($ctx.skipped); changed = ($moved -gt 0); actions = @($ctx.actions); warnings = @($warnings); chatReply = $msg })
      timeoutSeconds: 300
      retryCount: 0
      parameters: []
      aiExtensions: []
  - id: end
    name: End
    type: end
    position:
      x: 640
      y: 80
  connections:
  - source: start
    target: check
    sourceHandle: null
  - source: check
    target: act
    sourceHandle: null
  - source: act
    target: end
    sourceHandle: null
  startActivityId: start
