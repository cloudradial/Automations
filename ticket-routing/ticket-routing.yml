# CloudRadial AutomationAI - Send Every Ticket to the Right Engineer.
# Generated by src/build.js. Edit the scripts in src/, not this file.
# Import on Workflows -> Import, after uploading ticket-skill-classifier.agent.yml on Agents -> Custom.
# See README.md for the routing table, secrets and the ServiceAI Action.
automationsWorkflow: 1
name: Send Every Ticket to the Right Engineer
description: Assigns a new ticket to an engineer who has the right skill, chosen by your rule (least busy, round robin, listed order or random), and adds an internal note saying why. The routing table lives in two CloudRadial KB articles. Run from a ServiceAI Triage Action. Preview only until confirm is true.
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 80
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-prepare
      name: Read the request, routing table and ticket
      type: powershell-script
      position:
        x: 300
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  Send Every Ticket to the Right Engineer - Read the request, routing table and ticket
          #  Writes nothing. Reads the two routing KB articles from CloudRadial and the ticket from the PSA.
          #  Secrets: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey, Routing-CompanyId,
          #  PSA-Type, and the PSA's own secrets (the same names as its catalog extension).
          #  Generated from ticket-routing/src. Edit the source, then run build.js.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # ---------- routing table: parse and check (shared by the workflow and Test-RoutingTable.ps1) ----------

          # Turns a KB article body into plain text lines. Handles text pasted as
          # paragraphs, line breaks, a code block, or an HTML table.
          function ConvertFrom-ArticleBody {
              param([string]$Html)
              $t = $Html -replace '\r', ''
              $t = $t -replace '(?i)<br\s*/?>', "`n"
              $t = $t -replace '(?i)</(p|div|tr|li|h[1-6]|pre)>', "`n"
              # Table cells become quoted CSV fields so commas inside a cell survive.
              $t = $t -replace '(?is)<t[dh][^>]*>(.*?)</t[dh]>', '"$1",'
              $t = $t -replace '<[^>]+>', ''
              $t = [System.Net.WebUtility]::HtmlDecode($t)
              $t = $t -replace [char]0x00A0, ' ' -replace [char]0xFEFF, ''
              # Smart quotes from the editor break CSV quoting.
              $t = $t -replace "[$([char]0x201C)$([char]0x201D)]", '"' -replace "[$([char]0x2018)$([char]0x2019)]", "'"
              # A table row ends with the trailing comma added above; drop it.
              $t = $t -replace '(?m)",\s*$', '"'
              return @($t -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
          }

          # Splits lines into [Settings], [Engineers] and [Skills] sections. Lines before
          # any marker count as [Skills], so a plain skills CSV works on its own.
          function Split-RoutingSections {
              param([string[]]$Lines)
              $s = @{ Settings = @(); Engineers = @(); Skills = @() }
              $cur = 'Skills'
              foreach ($l in $Lines) {
                  if ($l -match '^"?\[(Settings|Engineers|Skills)\]"?,?$') { $cur = (Get-Culture).TextInfo.ToTitleCase($Matches[1].ToLowerInvariant()); continue }
                  $s[$cur] += $l
              }
              return $s
          }

          # Drops titles and notes above a table: the table starts at its header row.
          function Select-FromHeader {
              param([string[]]$Lines, [string]$FirstColumn)
              $i = 0
              foreach ($l in $Lines) { if ($l -match ('^\s*"?' + [regex]::Escape($FirstColumn) + '"?\s*,')) { return @($Lines | Select-Object -Skip $i) }; $i++ }
              return @()
          }

          function Read-RoutingTable {
              param([string[]]$SkillLines, [string[]]$EngineerLines, [string[]]$SettingLines)
              $SkillLines = @(Select-FromHeader @($SkillLines) 'Skill')
              $EngineerLines = @(Select-FromHeader @($EngineerLines) 'Engineer')
              $clean = { param($v) $x = ([string]$v).Trim(); if ($x -eq '#N/A') { '' } else { $x } }
              # Names are matched across the two tables, so tidy spacing: "Hildebrand , Caleb" -> "Hildebrand, Caleb".
              $name = { param($v) ((& $clean $v) -replace '\s+,', ',' -replace ',(?=\S)', ', ' -replace '\s{2,}', ' ') }
              $col = { param($r, $n) if ($r.PSObject.Properties[$n]) { & $clean $r.$n } else { '' } }
              $skills = @()
              if ($SkillLines.Count) {
                  foreach ($r in @($SkillLines | ConvertFrom-Csv)) {
                      $skills += [pscustomobject]@{
                          Skill = & $col $r 'Skill'; Role = & $col $r 'Role'; Engineer = & $name (& $col $r 'Engineer'); Description = & $col $r 'Skill Description'
                      }
                  }
              }
              $engineers = @()
              if ($EngineerLines.Count) {
                  foreach ($r in @($EngineerLines | ConvertFrom-Csv)) {
                      $engineers += [pscustomobject]@{
                          Engineer = & $name (& $col $r 'Engineer'); Email = & $col $r 'Email'; PsaUserId = & $col $r 'PSA User Id'; PsaRoleId = & $col $r 'PSA Role Id'
                          Active = ((& $col $r 'Active') -notmatch '^(?i)(no|false|0)$'); MaxOpen = & $col $r 'Max Open Tickets'
                      }
                  }
              }
              $settings = [ordered]@{ tieBreak = 'least-open-tickets'; respectMaxOpen = 'yes'; noMatch = 'leave-unassigned'; fallbackEngineer = ''; minConfidence = '0.7'; liveAssign = 'no' }
              foreach ($l in @($SettingLines)) { if ($l -match '^\s*"?([A-Za-z]+)\s*[:=]\s*(.*?)"?,?$') { $settings[$Matches[1]] = $Matches[2].Trim() } }
              return [pscustomobject]@{ Skills = $skills; Engineers = $engineers; Settings = $settings }
          }

          # Everything the workflow would trip on. Errors stop the workflow; warnings don't.
          function Test-RoutingData {
              param($Table, [string]$Psa = '')
              $errors = @(); $warnings = @()
              $t = $Table
              if (-not $t.Skills.Count) { $errors += 'No skills rows were found. The first line must be the header: Skill,Role,Engineer,Skill Description' }
              $missingCols = @($t.Skills | Where-Object { -not $_.Skill -or -not $_.Role -or -not $_.Engineer })
              if ($missingCols.Count) { $errors += "$($missingCols.Count) skills rows are missing a Skill, Role or Engineer." }
              $dupes = @($t.Skills | Group-Object { "$($_.Skill)|$($_.Role)|$($_.Engineer)" } | Where-Object Count -gt 1)
              if ($dupes.Count) { $warnings += "$($dupes.Count) skills rows are duplicated (same skill, role and engineer)." }
              $roleOnly = @($t.Skills | Where-Object { $_.Skill -eq 'Role only' })
              if ($roleOnly.Count) { $warnings += "$($roleOnly.Count) 'Role only' rows have no skill. They are never matched to a ticket; they're kept for reference." }
              $descs = @($t.Skills | Where-Object { $_.Skill -and $_.Skill -ne 'Role only' } | Group-Object Skill | Where-Object { @($_.Group.Description | Where-Object { $_ } | Select-Object -Unique).Count -ne 1 })
              if ($descs.Count) { $warnings += "$($descs.Count) skills have no description, or different descriptions on different rows. The classifier reads one description per skill: $(@($descs.Name | Select-Object -First 5) -join '; ')" }

              $named = @($t.Skills | Where-Object { $_.Engineer } | ForEach-Object { $_.Engineer } | Select-Object -Unique)
              if ($t.Engineers.Count) {
                  $known = @($t.Engineers | ForEach-Object { $_.Engineer })
                  $unknown = @($named | Where-Object { $known -notcontains $_ })
                  if ($unknown.Count) { $errors += "$($unknown.Count) engineers in the skills table aren't in the engineers table, so they can't be assigned: $(@($unknown | Select-Object -First 8) -join '; ')" }
                  $noId = @($t.Engineers | Where-Object { -not $_.PsaUserId })
                  if ($noId.Count) { $errors += "$($noId.Count) engineers have no PSA User Id: $(@($noId | ForEach-Object { $_.Engineer } | Select-Object -First 8) -join '; ')" }
                  if ($Psa -eq 'autotask') { $noRole = @($t.Engineers | Where-Object { -not $_.PsaRoleId }); if ($noRole.Count) { $errors += "Autotask needs a PSA Role Id for each engineer. Missing for $($noRole.Count): $(@($noRole | ForEach-Object { $_.Engineer } | Select-Object -First 8) -join '; ')" } }
                  $badMax = @($t.Engineers | Where-Object { $_.MaxOpen -and $_.MaxOpen -notmatch '^\d+$' })
                  if ($badMax.Count) { $errors += "Max Open Tickets must be a whole number or blank: $(@($badMax | ForEach-Object { $_.Engineer }) -join '; ')" }
                  $dupEng = @($t.Engineers | Group-Object Engineer | Where-Object Count -gt 1)
                  if ($dupEng.Count) { $errors += "Engineers listed more than once: $(@($dupEng.Name) -join '; ')" }
              } else { $errors += 'No engineers table was found. Add an [Engineers] section with the header Engineer,Email,PSA User Id,PSA Role Id,Active,Max Open Tickets' }

              $s = $t.Settings
              if (@('least-open-tickets', 'least-recently-assigned', 'listed-order', 'random') -notcontains $s.tieBreak) { $errors += "tieBreak '$($s.tieBreak)' isn't one of: least-open-tickets, least-recently-assigned, listed-order, random." }
              if (@('leave-unassigned', 'assign-fallback', 'recommend-only') -notcontains $s.noMatch) { $errors += "noMatch '$($s.noMatch)' isn't one of: leave-unassigned, assign-fallback, recommend-only." }
              if ($s.noMatch -eq 'assign-fallback') {
                  if (-not $s.fallbackEngineer) { $errors += 'noMatch is assign-fallback but fallbackEngineer is empty.' }
                  elseif ($t.Engineers.Count -and @($t.Engineers | ForEach-Object { $_.Engineer }) -notcontains (($s.fallbackEngineer -replace '\s+,', ',' -replace ',(?=\S)', ', ').Trim())) { $errors += "fallbackEngineer '$($s.fallbackEngineer)' isn't in the engineers table." }
              }
              if ($s.respectMaxOpen -notmatch '^(?i)(yes|no)$') { $errors += 'respectMaxOpen must be yes or no.' }
              if ($s.liveAssign -notmatch '^(?i)(yes|no)$') { $errors += 'liveAssign must be yes or no.' }
              [double]$mc = 0; if (-not [double]::TryParse([string]$s.minConfidence, [System.Globalization.NumberStyles]::Float, [System.Globalization.CultureInfo]::InvariantCulture, [ref]$mc) -or $mc -lt 0 -or $mc -gt 1) { $errors += 'minConfidence must be a number from 0 to 1.' }
              return [pscustomobject]@{ Errors = $errors; Warnings = $warnings }
          }

          # The only part of the table the AI sees: one line per skill with its description and roles.
          function Get-ClassifierSkillList {
              param($Table)
              $matchable = @($Table.Skills | Where-Object { $_.Skill -and $_.Skill -ne 'Role only' })
              return (@($matchable | Group-Object Skill | ForEach-Object {
                  $d = @($_.Group | ForEach-Object { $_.Description } | Where-Object { $_ } | Select-Object -First 1)
                  $roles = @($_.Group | ForEach-Object { $_.Role } | Where-Object { $_ } | Select-Object -Unique)
                  "$($_.Name): $(if ($d.Count) { $d[0] } else { '(no description)' }) [roles: $($roles -join ', ')]"
              }) -join "`n")
          }

          # ---------- PSA calls (see reference/build-kit/PSA.md for the source of each one) ----------
          # Uses the same Key Vault secret names as each PSA's catalog extension.

          function Secret { param($n) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue }
          function Get-Prop { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-Path { param($o, [string]$path) foreach ($n in $path -split '\.') { $o = Get-Prop $o $n; if ($null -eq $o) { return $null } }; return $o }
          function Test-Blank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -eq '0') }

          $script:PsaSecrets = @{
              connectwise = @('CW-ApiUrl', 'CW-CompanyID', 'CW-PublicKey', 'CW-PrivateKey', 'CW-ClientId')
              autotask    = @('Autotask-ApiUrl', 'Autotask-ApiIntegrationCode', 'Autotask-Username', 'Autotask-Secret')
              halopsa     = @('Halo-ApiUrl', 'Halo-ClientId', 'Halo-ClientSecret')
              kaseyabms   = @('KaseyaBMS-ApiUrl', 'KaseyaBMS-Username', 'KaseyaBMS-Password', 'KaseyaBMS-CompanyName')
              syncro      = @('Syncro-ApiUrl', 'Syncro-ApiKey')
              zendesk     = @('Zendesk-BaseUrl', 'Zendesk-Email', 'Zendesk-ApiToken')
          }
          $script:Conn = $null
          $script:AtPicklists = $null

          function Connect-Psa {
              param([string]$Psa)
              if (-not $script:PsaSecrets.ContainsKey($Psa)) { throw "psa '$Psa' isn't one of: $($script:PsaSecrets.Keys -join ', ')." }
              $v = @{}; $missing = @()
              foreach ($n in $script:PsaSecrets[$Psa]) { $v[$n] = Secret $n; if ([string]::IsNullOrWhiteSpace($v[$n])) { $missing += $n } }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $json = 'application/json'
              switch ($Psa) {
                  'connectwise' {
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['CW-CompanyID'])+$($v['CW-PublicKey']):$($v['CW-PrivateKey'])"))
                      $c = @{ Base = $v['CW-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Basic $b"; clientId = $v['CW-ClientId']; Accept = $json } }
                  }
                  'autotask' {
                      $c = @{ Base = ($v['Autotask-ApiUrl'].TrimEnd('/') -replace '/atservicesrest/v1\.0$', '') + '/atservicesrest/v1.0'
                          Headers = @{ ApiIntegrationCode = $v['Autotask-ApiIntegrationCode']; UserName = $v['Autotask-Username']; Secret = $v['Autotask-Secret']; Accept = $json } }
                  }
                  'halopsa' {
                      $base = $v['Halo-ApiUrl'].TrimEnd('/') -replace '/api$', ''
                      $form = "grant_type=client_credentials&client_id=$([uri]::EscapeDataString($v['Halo-ClientId']))&client_secret=$([uri]::EscapeDataString($v['Halo-ClientSecret']))&scope=all"
                      $tok = $null
                      try { $tok = Invoke-RestMethod -Method POST -Uri "$base/auth/token" -Body $form -ContentType 'application/x-www-form-urlencoded' }
                      catch {
                          # Some instances run a separate auth server; /api/authinfo names it.
                          $info = Invoke-RestMethod -Method GET -Uri "$base/api/authinfo"
                          $authUrl = [string](Get-Prop $info 'auth_url'); if (-not $authUrl) { throw }
                          $tok = Invoke-RestMethod -Method POST -Uri "$($authUrl.TrimEnd('/'))/token" -Body $form -ContentType 'application/x-www-form-urlencoded'
                      }
                      $c = @{ Base = "$base/api"; Headers = @{ Authorization = "Bearer $(Get-Prop $tok 'access_token')"; Accept = $json } }
                  }
                  'kaseyabms' {
                      $base = $v['KaseyaBMS-ApiUrl'].TrimEnd('/')
                      $r = Invoke-RestMethod -Method POST -Uri "$base/v2/security/authenticate" -Form @{ UserName = $v['KaseyaBMS-Username']; Password = $v['KaseyaBMS-Password']; Tenant = $v['KaseyaBMS-CompanyName']; GrantType = 'password' }
                      $token = Get-Path $r 'Result.AccessToken'; if (-not $token) { $token = Get-Path $r 'result.accessToken' }
                      if (-not $token) { throw 'Kaseya BMS sign-in returned no Result.AccessToken. Check the KaseyaBMS-* secrets.' }
                      $c = @{ Base = "$base/v2"; Headers = @{ Authorization = "Bearer $token"; Accept = $json } }
                  }
                  'syncro' { $c = @{ Base = $v['Syncro-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Bearer $($v['Syncro-ApiKey'])"; Accept = $json } } }
                  'zendesk' {
                      $base = $v['Zendesk-BaseUrl'].TrimEnd('/'); if ($base -notmatch '/api/v2$') { $base += '/api/v2' }
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['Zendesk-Email'])/token:$($v['Zendesk-ApiToken'])"))
                      $c = @{ Base = $base; Headers = @{ Authorization = "Basic $b"; Accept = $json } }
                  }
              }
              $c.Psa = $Psa
              $script:Conn = $c
              return $c
          }

          function Invoke-Psa {
              param([string]$Method, [string]$Path, $Body = $null)
              $p = @{ Method = $Method; Uri = "$($script:Conn.Base)$Path"; Headers = $script:Conn.Headers }
              if ($null -ne $Body) { $p.Body = ($Body | ConvertTo-Json -Depth 10 -Compress -AsArray:($Body -is [array])); $p.ContentType = 'application/json' }
              return Invoke-RestMethod @p
          }
          function Q { param([string]$s) [uri]::EscapeDataString($s) }
          # ConnectWise conditions quote strings and leave numbers bare.
          function CwOwner { param([string]$u) if ($u -match '^\d+$') { "owner/id=$u" } else { "owner/identifier=`"$u`"" } }

          function Get-PsaTicket {
              param([string]$Id)
              switch ($script:Conn.Psa) {
                  'connectwise' {
                      $t = Invoke-Psa GET "/service/tickets/$Id"
                      $desc = ''
                      try { $n = @(Invoke-Psa GET "/service/tickets/$Id/notes?orderBy=$(Q 'id asc')&pageSize=1"); if ($n.Count) { $desc = [string](Get-Prop $n[0] 'text') } } catch { }
                      $owner = Get-Prop $t 'owner'
                      $a = @(@((Get-Prop $owner 'identifier'), (Get-Prop $owner 'id')) | Where-Object { -not (Test-Blank $_) } | ForEach-Object { [string]$_ })
                      return @{ id = $Id; summary = [string](Get-Prop $t 'summary'); description = $desc; companyId = [string](Get-Path $t 'company.id'); status = [string](Get-Path $t 'status.name'); assigneeId = $(if ($a.Count) { $a[0] } else { '' }); assigneeIds = $a; raw = $t }
                  }
                  'autotask' {
                      $t = Get-Prop (Invoke-Psa GET "/Tickets/$Id") 'item'
                      if ($null -eq $t) { throw "Autotask returned no ticket $Id." }
                      $a = Get-Prop $t 'assignedResourceID'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'title'); description = [string](Get-Prop $t 'description'); companyId = [string](Get-Prop $t 'companyID'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'halopsa' {
                      $t = Invoke-Psa GET "/Tickets/$($Id)?includedetails=true"
                      $a = Get-Prop $t 'agent_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'summary'); description = [string](Get-Prop $t 'details'); companyId = [string](Get-Prop $t 'client_id'); status = [string](Get-Prop $t 'status_id'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'kaseyabms' {
                      $t = Get-Prop (Invoke-Psa GET "/servicedesk/tickets/$Id") 'Result'
                      if ($null -eq $t) { throw "Kaseya BMS returned no ticket $Id." }
                      $a = Get-Prop $t 'AssigneeId'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'Title'); description = [string](Get-Prop $t 'Details'); companyId = [string](Get-Prop $t 'AccountId'); status = [string](Get-Prop $t 'StatusName'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'syncro' {
                      $t = Get-Prop (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Syncro returned no ticket $Id." }
                      $c = @(Get-Prop $t 'comments' | Where-Object { $null -ne $_ })
                      $desc = if ($c.Count) { [string](Get-Prop $c[0] 'body') } else { '' }
                      $pt = [string](Get-Prop $t 'problem_type'); if ($pt) { $desc = "Issue type: $pt`n$desc" }
                      $a = Get-Prop $t 'user_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'subject'); description = $desc; companyId = [string](Get-Prop $t 'customer_id'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'zendesk' {
                      $t = Get-Prop (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Zendesk returned no ticket $Id." }
                      $a = Get-Prop $t 'assignee_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'subject'); description = [string](Get-Prop $t 'description'); companyId = [string](Get-Prop $t 'organization_id'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
              }
          }

          function Set-PsaAssignee {
              param([string]$Id, [string]$UserId, [string]$RoleId = '')
              switch ($script:Conn.Psa) {
                  'connectwise' {
                      $val = if ($UserId -match '^\d+$') { @{ id = [int]$UserId } } else { @{ identifier = $UserId } }
                      $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'owner'; value = $val })
                  }
                  'autotask' {
                      if (-not $RoleId) { throw 'Autotask needs a PSA Role Id with the resource. Add it to the engineers table.' }
                      $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; assignedResourceID = [long]$UserId; assignedResourceRoleID = [long]$RoleId })
                  }
                  'halopsa' { $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; agent_id = [long]$UserId }) }
                  'kaseyabms' { $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/AssigneeId'; value = [long]$UserId }) }
                  'syncro' { $null = Invoke-Psa PUT "/tickets/$Id" @{ user_id = [long]$UserId } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ assignee_id = [long]$UserId } } }
              }
          }

          # Autotask note picklists are per tenant: match on the label, never a hard-coded number.
          function Get-AtPicklist {
              param([string]$Entity, [string]$Field)
              if ($null -eq $script:AtPicklists) { $script:AtPicklists = @{} }
              if (-not $script:AtPicklists.ContainsKey($Entity)) { $script:AtPicklists[$Entity] = @(Get-Prop (Invoke-Psa GET "/$Entity/entityInformation/fields") 'fields') }
              $f = @($script:AtPicklists[$Entity] | Where-Object { [string](Get-Prop $_ 'name') -eq $Field }) | Select-Object -First 1
              return @(Get-Prop $f 'picklistValues' | Where-Object { $null -ne $_ -and (Get-Prop $_ 'isActive') -ne $false })
          }
          function Select-AtValue {
              param($Values, [string[]]$Patterns)
              foreach ($p in $Patterns) {
                  $hit = @($Values | Where-Object { [string](Get-Prop $_ 'label') -match $p }) | Select-Object -First 1
                  if ($hit) { return (Get-Prop $hit 'value') }
              }
              return $null
          }

          function Add-PsaNote {
              param([string]$Id, [string]$Text, [switch]$Internal)
              switch ($script:Conn.Psa) {
                  'connectwise' { $null = Invoke-Psa POST "/service/tickets/$Id/notes" @{ text = $Text; internalAnalysisFlag = $true; detailDescriptionFlag = $false; resolutionFlag = $false } }
                  'autotask' {
                      $pub = Secret 'Autotask-NotePublishId'
                      if (-not $pub) { $pub = Select-AtValue (Get-AtPicklist 'TicketNotes' 'publish') @('^Internal Only$', 'Internal') }
                      $type = Secret 'Autotask-NoteTypeId'
                      if (-not $type) { $vals = @(Get-AtPicklist 'TicketNotes' 'noteType' | Where-Object { [string](Get-Prop $_ 'value') -ne '13' -and [string](Get-Prop $_ 'label') -notmatch 'Workflow' }); $type = Select-AtValue $vals @('Internal', 'Task Detail', 'Detail', '.') }
                      if ($null -eq $pub -or $null -eq $type) { throw 'Could not find the Autotask note publish and type values. Set the Autotask-NotePublishId and Autotask-NoteTypeId secrets.' }
                      $null = Invoke-Psa POST "/Tickets/$Id/Notes" @{ ticketID = [long]$Id; title = 'Ticket routing'; description = $Text; noteType = [int]$type; publish = [int]$pub }
                  }
                  'halopsa' {
                      $outcome = Secret 'Halo-NoteOutcomeId'; if (-not $outcome) { $outcome = 7 }
                      $null = Invoke-Psa POST '/Actions' @(@{ ticket_id = [long]$Id; note = $Text; hiddenfromuser = $true; outcome_id = [int]$outcome })
                  }
                  'kaseyabms' {
                      $type = Secret 'KaseyaBMS-NoteTypeId'
                      if (-not $type) { throw 'Kaseya BMS notes need a note type id. Set the KaseyaBMS-NoteTypeId secret.' }
                      $null = Invoke-Psa POST "/servicedesk/tickets/$Id/notes" @{ Details = $Text; IsInternal = $true; NoteDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); TypeId = [int]$type }
                  }
                  'syncro' { $null = Invoke-Psa POST "/tickets/$Id/comment" @{ subject = 'Ticket routing'; body = $Text; hidden = $true; do_not_email = $true } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ comment = @{ body = $Text; public = $false } } } }
              }
          }

          function Get-AtCompleteStatuses {
              $v = @(Get-AtPicklist 'Tickets' 'status' | Where-Object { [string](Get-Prop $_ 'label') -match '(?i)complete' } | ForEach-Object { [int](Get-Prop $_ 'value') })
              if (-not $v.Count) { $v = @(5) }
              return $v
          }

          # An int, or $null when this PSA can't count (the caller falls back and warns).
          function Get-PsaOpenCount {
              param([string]$UserId)
              switch ($script:Conn.Psa) {
                  'connectwise' { return [int](Get-Prop (Invoke-Psa GET "/service/tickets/count?conditions=$(Q "$(CwOwner $UserId) and closedFlag=false")") 'count') }
                  'autotask' {
                      $f = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }) + @(Get-AtCompleteStatuses | ForEach-Object { [ordered]@{ op = 'noteq'; field = 'status'; value = $_ } })
                      $r = Invoke-Psa GET "/Tickets/query/count?search=$(Q (@{ filter = $f } | ConvertTo-Json -Depth 6 -Compress))"
                      $n = Get-Prop $r 'queryCount'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'halopsa' { $n = Get-Prop (Invoke-Psa GET "/Tickets?agent_id=$UserId&open_only=true&pageinate=true&page_size=1&page_no=1") 'record_count'; if ($null -eq $n) { return $null }; return [int]$n }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $r = Invoke-Psa GET "/tickets?user_id=$UserId&status=$(Q 'Not Closed')&page=1"
                      $te = Get-Path $r 'meta.total_entries'; if ($null -ne $te) { return [int]$te }
                      $n = @(Get-Prop $r 'tickets').Count; $pages = [int](Get-Path $r 'meta.total_pages')
                      for ($p = 2; $p -le [Math]::Min($pages, 10); $p++) { $n += @(Get-Prop (Invoke-Psa GET "/tickets?user_id=$UserId&status=$(Q 'Not Closed')&page=$p") 'tickets').Count }
                      if ($pages -gt 10) { return $null }
                      return $n
                  }
                  'zendesk' { return [int](Get-Prop (Invoke-Psa GET "/search/count?query=$(Q "type:ticket assignee:$UserId status<solved")") 'count') }
              }
          }

          # The newest ticket currently assigned to the engineer: a date, [datetime]::MinValue
          # when they have none, or $null when this PSA can't tell.
          function Get-PsaLastAssigned {
              param([string]$UserId)
              $none = [datetime]::MinValue
              $date = { param($v) if (Test-Blank $v) { $none } else { [datetime]::Parse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal) } }
              switch ($script:Conn.Psa) {
                  'connectwise' { $r = @(Invoke-Psa GET "/service/tickets?conditions=$(Q (CwOwner $UserId))&orderBy=$(Q 'dateEntered desc')&pageSize=1&fields=id,dateEntered"); if (-not $r.Count) { return $none }; return (& $date (Get-Prop $r[0] 'dateEntered')) }
                  'autotask' {
                      # The query API can't sort, so take the highest id from the last 90 days.
                      $since = (Get-Date).ToUniversalTime().AddDays(-90).ToString('yyyy-MM-ddTHH:mm:ssZ')
                      $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }, [ordered]@{ op = 'gt'; field = 'createDate'; value = $since }); IncludeFields = @('id', 'createDate'); MaxRecords = 500 }
                      $r = Invoke-Psa GET "/Tickets/query?search=$(Q ($s | ConvertTo-Json -Depth 6 -Compress))"
                      $top = @(Get-Prop $r 'items' | Where-Object { $null -ne $_ } | Sort-Object { [long](Get-Prop $_ 'id') } -Descending) | Select-Object -First 1
                      if (-not $top) { return $none }; return (& $date (Get-Prop $top 'createDate'))
                  }
                  'halopsa' { $t = @(Get-Prop (Invoke-Psa GET "/Tickets?agent_id=$UserId&order=dateoccurred&orderdesc=true&pageinate=true&page_size=1&page_no=1") 'tickets'); if (-not $t.Count -or $null -eq $t[0]) { return $none }; return (& $date (Get-Prop $t[0] 'dateoccurred')) }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $latest = $none
                      for ($p = 1; $p -le 10; $p++) {
                          $r = Invoke-Psa GET "/tickets?user_id=$UserId&page=$p"
                          foreach ($t in @(Get-Prop $r 'tickets' | Where-Object { $null -ne $_ })) { $d = & $date (Get-Prop $t 'created_at'); if ($d -gt $latest) { $latest = $d } }
                          if ($p -ge [int](Get-Path $r 'meta.total_pages')) { break }
                      }
                      return $latest
                  }
                  'zendesk' { $t = @(Get-Prop (Invoke-Psa GET "/search?query=$(Q "type:ticket assignee:$UserId")&sort_by=created_at&sort_order=desc&per_page=1") 'results'); if (-not $t.Count -or $null -eq $t[0]) { return $none }; return (& $date (Get-Prop $t[0] 'created_at')) }
              }
          }

          # ---------- this step ----------
          # Reads the request, the routing table (two CloudRadial KB articles) and the ticket.
          # Writes nothing. Its output feeds the classifier and the Assign step.
          $in = Get-NodeInput
          $t = Get-Prop $in 'trigger'; if ($null -ne $t) { $in = $t }
          $b = Get-Prop $in 'body'; if ($null -ne $b -and ($b -is [string] -or $null -ne (Get-Prop $b 'ticketId') -or $null -ne (Get-Prop $b 'id'))) { $in = $b }
          if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch { $in = $null } }

          $warnings = New-Object System.Collections.ArrayList; $actions = New-Object System.Collections.ArrayList
          $out = [ordered]@{
              status = 'ok'; message = ''; internal_note = ''; skip = $false
              ticketId = ''; psa = ''; confirm = $false; reassign = $false; triggerSource = ''
              summary = ''; description = ''; currentAssignee = ''; skillList = ''; roles = ''
              table = $null; warnings = @(); actions = @()
          }
          function Stop-Prepare { param([string]$Status, [string]$Msg)
              $out.status = $Status; $out.message = $Msg; $out.internal_note = $Msg; $out.skip = $true
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          }
          # A value is missing when it's blank or still an unreplaced placeholder (@token or {{field}}).
          function Get-In { param([string[]]$Names)
              foreach ($n in $Names) {
                  $v = if ($n -like '*.*') { Get-Path $in $n } else { Get-Prop $in $n }
                  if ($null -eq $v -or $v -is [System.Management.Automation.PSCustomObject]) { continue }
                  $s = ([string]$v).Trim()
                  if ($s -eq '' -or $s.StartsWith('@') -or $s.StartsWith('{{')) { continue }
                  return $s
              }
              return ''
          }
          function Test-Yes { param([string]$v) return (@('true', 'yes', 'y', '1') -contains $v.Trim().ToLowerInvariant()) }

          try {
              if ($null -eq $in) { Stop-Prepare 'incomplete' 'No request body was received. Send {"ticketId":"..."} or the PSA ticket.'; return }

              # ---------- 1. the request ----------
              $out.ticketId = Get-In @('ticketId', 'id', 'ticketID', 'TicketID', 'TicketId', 'Id', 'ticket.id', 'Ticket.TicketId', 'ticket_id')
              $out.triggerSource = Get-In @('triggerSource')
              $confirmIn = Get-In @('confirm')   # an explicit confirm in the body wins; otherwise the table's liveAssign setting decides (below)
              $out.confirm = $confirmIn -ne '' -and (Test-Yes $confirmIn)
              $out.reassign = Test-Yes (Get-In @('reassign'))
              $psa = (Get-In @('psa')).ToLowerInvariant(); if (-not $psa) { $psa = ([string](Secret 'PSA-Type')).Trim().ToLowerInvariant() }
              $out.psa = $psa
              if (-not $out.ticketId) { Stop-Prepare 'incomplete' 'No ticket id was found in ticketId, id, ticketID, TicketID or ticket.id. Nothing was assigned.'; return }
              if (-not $psa) { Stop-Prepare 'incomplete' 'No PSA was given. Send psa, or set the PSA-Type secret (connectwise, autotask, halopsa, kaseyabms, syncro or zendesk).'; return }
              if (-not $script:PsaSecrets.ContainsKey($psa)) { Stop-Prepare 'incomplete' "psa '$psa' isn't one of: connectwise, autotask, halopsa, kaseyabms, syncro, zendesk."; return }

              # ---------- 2. the routing table ----------
              $companyId = Get-In @('routingCompanyId'); if (-not $companyId) { $companyId = ([string](Secret 'Routing-CompanyId')).Trim() }
              if ($companyId -notmatch '^\d+$') { Stop-Prepare 'incomplete' 'No routing company was given. Set the Routing-CompanyId secret to the CloudRadial company id that holds the routing articles.'; return }
              $skillsSubject = Get-In @('skillsArticle'); if (-not $skillsSubject) { $skillsSubject = 'Ticket Routing: Skills' }
              $engSubject = Get-In @('engineersArticle'); if (-not $engSubject) { $engSubject = 'Ticket Routing: Engineers and Settings' }

              $crBase = [string](Secret 'CloudRadial-BaseUrl'); $crPub = Secret 'CloudRadial-PublicKey'; $crPriv = Secret 'CloudRadial-PrivateKey'
              if (-not $crBase -or -not $crPub -or -not $crPriv) { Stop-Prepare 'error' 'Add these secrets to the runner Key Vault: CloudRadial-BaseUrl, CloudRadial-PublicKey, CloudRadial-PrivateKey'; return }
              $crHeaders = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($crPub):$($crPriv)")); Accept = 'application/json' }
              $crBase = $crBase.TrimEnd('/')
              function Get-Article { param([string]$Subject)
                  $f = "companyId eq $companyId and subject eq '$($Subject -replace "'", "''")'"
                  $list = @(Get-Prop (Invoke-RestMethod -Method GET -Uri "$crBase/v2/odata/article?`$filter=$([uri]::EscapeDataString($f))&`$select=articleId,subject" -Headers $crHeaders) 'value' | Where-Object { $null -ne $_ })
                  if (-not $list.Count) { return $null }
                  if ($list.Count -gt 1) { $null = $warnings.Add("$($list.Count) articles in company $companyId are titled '$Subject'. The first one was used.") }
                  $a = Invoke-RestMethod -Method GET -Uri "$crBase/v2/article/$(Get-Prop $list[0] 'articleId')" -Headers $crHeaders
                  $body = Get-Prop $a 'body'; if ($null -eq $body) { $body = Get-Path $a 'data.body' }
                  return [string]$body
              }
              $skillsHtml = Get-Article $skillsSubject
              $engHtml = Get-Article $engSubject
              $missingArticles = @(); if ($null -eq $skillsHtml) { $missingArticles += "'$skillsSubject'" }; if ($null -eq $engHtml) { $missingArticles += "'$engSubject'" }
              if ($missingArticles.Count) { Stop-Prepare 'incomplete' "The routing table wasn't found: no article titled $($missingArticles -join ' or ') in CloudRadial company $companyId. Nothing was assigned."; return }

              $sk = Split-RoutingSections (ConvertFrom-ArticleBody $skillsHtml)
              $en = Split-RoutingSections (ConvertFrom-ArticleBody $engHtml)
              # Skills come from the skills article; engineers and settings from the other. A section in the wrong article still counts.
              $skillLines = if (@(Select-FromHeader @($sk.Skills) 'Skill').Count) { @($sk.Skills) } else { @($en.Skills) }
              $engLines = if ($en.Engineers.Count) { @($en.Engineers) } else { @($sk.Engineers) }
              $setLines = @($en.Settings) + @($sk.Settings)
              $table = Read-RoutingTable $skillLines $engLines $setLines
              $check = Test-RoutingData $table $psa
              foreach ($w in @($check.Warnings)) { $null = $warnings.Add($w) }
              if ($check.Errors.Count) { Stop-Prepare 'incomplete' ("The routing table has errors, so nothing was assigned. Fix them in the KB articles (Test-RoutingTable.ps1 shows the same list):`n- " + ($check.Errors -join "`n- ")); return }
              $null = $actions.Add("Read the routing table: $(@($table.Skills).Count) skills rows, $(@($table.Engineers).Count) engineers")
              # A Triage Action may post the raw PSA ticket with no confirm field, so the table can switch live assignment on.
              if ($confirmIn -eq '') { $out.confirm = Test-Yes ([string]$table.Settings.liveAssign) }

              # ---------- 3. the ticket ----------
              $null = Connect-Psa $psa
              $ticket = Get-PsaTicket $out.ticketId
              $null = $actions.Add("Read ticket $($out.ticketId) from $psa")
              $out.summary = $ticket.summary
              $d = [string]$ticket.description
              $d = ($d -replace '(?is)<(script|style)[^>]*>.*?</\1>', '' -replace '<[^>]+>', ' ' -replace '[ \t]{2,}', ' ').Trim()
              if ($d.Length -gt 4000) { $d = $d.Substring(0, 4000) }
              $out.description = $d
              $out.currentAssignee = $ticket.assigneeId
              $out.table = [ordered]@{
                  settings = $table.Settings
                  engineers = @($table.Engineers)
                  rows = @($table.Skills | Where-Object { $_.Skill -and $_.Skill -ne 'Role only' } | ForEach-Object { [ordered]@{ s = $_.Skill; r = $_.Role; e = $_.Engineer } })
              }
              $out.skillList = Get-ClassifierSkillList $table
              $out.roles = (@($table.Skills | ForEach-Object { $_.Role } | Where-Object { $_ } | Select-Object -Unique) -join ', ')

              if ($ticket.assigneeId -and -not $out.reassign) {
                  $who = @($table.Engineers | Where-Object { $_.PsaUserId -eq $ticket.assigneeId -or @($ticket.assigneeIds) -contains $_.PsaUserId } | ForEach-Object { $_.Engineer }) | Select-Object -First 1
                  Stop-Prepare 'rejected' "Ticket $($out.ticketId) is already assigned to $(if ($who) { $who } else { "PSA user $($ticket.assigneeId)" }), so it was left alone. Send reassign true to route it anyway."
                  return
              }
              if (-not $out.summary -and -not $out.description) { Stop-Prepare 'incomplete' "Ticket $($out.ticketId) has no summary or description to classify."; return }

              $out.message = "Ticket $($out.ticketId) read; ready to classify."
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          } catch {
              Stop-Prepare 'error' "Couldn't read the request, routing table or ticket: $($_.Exception.Message)"
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters:
          - name: trigger
            expression: '{{ nodes.trigger.output }}'
        aiExtensions: []
        testInput: |-
          {
            "triggerSource": "manual-test",
            "ticketId": "12345",
            "psa": "connectwise",
            "confirm": "false"
          }
    - id: node-classify
      name: Pick the skill
      type: agent
      position:
        x: 540
        'y': 120
      properties:
        goal: 'Read the ticket summary and description in your input and pick the one skill from skillList that an engineer needs to work it, and the role for that skill. Copy the skill and role exactly as they are written in skillList. Return skill, role, confidence (0 to 1) and a one-sentence reason. If nothing in the list fits, return an empty skill and a confidence below 0.5. If skip is true, return an empty skill and confidence 0 straight away. This is read-only: you have no tools and change nothing.'
        model: ''
        allowedExtensions: []
        timeoutSeconds: 120
        autoApprove: true
        agentSlug: ticket-skill-classifier
        inputSchema: |
          {"type":"object","properties":{"summary":{"type":"string","description":"The ticket summary or subject."},"description":{"type":"string","description":"The ticket description or first note, as plain text."},"skillList":{"type":"string","description":"One line per skill: '<skill>: <description> [roles: ...]'. Pick only from this list."},"roles":{"type":"string","description":"Every role used in the table, comma separated."},"skip":{"type":"boolean","description":"True when the workflow has already decided not to route this ticket."}},"required":["skillList"]}
        outputSchema: |
          {"type":"object","properties":{"skill":{"type":"string","description":"Copied exactly from skillList, or empty when nothing fits."},"role":{"type":"string","description":"One of the roles listed for that skill, or empty."},"confidence":{"type":"number","description":"0 to 1."},"reason":{"type":"string","description":"One sentence for the internal note."}},"required":["skill","role","confidence","reason"]}
        inputBindingsJson: '{"summary":"{{ nodes.node-prepare.output.summary }}","description":"{{ nodes.node-prepare.output.description }}","skillList":"{{ nodes.node-prepare.output.skillList }}","roles":"{{ nodes.node-prepare.output.roles }}","skip":"{{ nodes.node-prepare.output.skip }}"}'
    - id: node-route
      name: Find, pick, assign and note
      type: powershell-script
      position:
        x: 780
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  Send Every Ticket to the Right Engineer - Find, pick, assign and note
          #  Writes to the PSA only when confirm is true: sets the assignee, then adds an internal note.
          #  Generated from ticket-routing/src. Edit the source, then run build.js.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # ---------- PSA calls (see reference/build-kit/PSA.md for the source of each one) ----------
          # Uses the same Key Vault secret names as each PSA's catalog extension.

          function Secret { param($n) Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue }
          function Get-Prop { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-Path { param($o, [string]$path) foreach ($n in $path -split '\.') { $o = Get-Prop $o $n; if ($null -eq $o) { return $null } }; return $o }
          function Test-Blank { param($v) return ($null -eq $v -or [string]::IsNullOrWhiteSpace([string]$v) -or [string]$v -eq '0') }

          $script:PsaSecrets = @{
              connectwise = @('CW-ApiUrl', 'CW-CompanyID', 'CW-PublicKey', 'CW-PrivateKey', 'CW-ClientId')
              autotask    = @('Autotask-ApiUrl', 'Autotask-ApiIntegrationCode', 'Autotask-Username', 'Autotask-Secret')
              halopsa     = @('Halo-ApiUrl', 'Halo-ClientId', 'Halo-ClientSecret')
              kaseyabms   = @('KaseyaBMS-ApiUrl', 'KaseyaBMS-Username', 'KaseyaBMS-Password', 'KaseyaBMS-CompanyName')
              syncro      = @('Syncro-ApiUrl', 'Syncro-ApiKey')
              zendesk     = @('Zendesk-BaseUrl', 'Zendesk-Email', 'Zendesk-ApiToken')
          }
          $script:Conn = $null
          $script:AtPicklists = $null

          function Connect-Psa {
              param([string]$Psa)
              if (-not $script:PsaSecrets.ContainsKey($Psa)) { throw "psa '$Psa' isn't one of: $($script:PsaSecrets.Keys -join ', ')." }
              $v = @{}; $missing = @()
              foreach ($n in $script:PsaSecrets[$Psa]) { $v[$n] = Secret $n; if ([string]::IsNullOrWhiteSpace($v[$n])) { $missing += $n } }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ')" }
              $json = 'application/json'
              switch ($Psa) {
                  'connectwise' {
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['CW-CompanyID'])+$($v['CW-PublicKey']):$($v['CW-PrivateKey'])"))
                      $c = @{ Base = $v['CW-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Basic $b"; clientId = $v['CW-ClientId']; Accept = $json } }
                  }
                  'autotask' {
                      $c = @{ Base = ($v['Autotask-ApiUrl'].TrimEnd('/') -replace '/atservicesrest/v1\.0$', '') + '/atservicesrest/v1.0'
                          Headers = @{ ApiIntegrationCode = $v['Autotask-ApiIntegrationCode']; UserName = $v['Autotask-Username']; Secret = $v['Autotask-Secret']; Accept = $json } }
                  }
                  'halopsa' {
                      $base = $v['Halo-ApiUrl'].TrimEnd('/') -replace '/api$', ''
                      $form = "grant_type=client_credentials&client_id=$([uri]::EscapeDataString($v['Halo-ClientId']))&client_secret=$([uri]::EscapeDataString($v['Halo-ClientSecret']))&scope=all"
                      $tok = $null
                      try { $tok = Invoke-RestMethod -Method POST -Uri "$base/auth/token" -Body $form -ContentType 'application/x-www-form-urlencoded' }
                      catch {
                          # Some instances run a separate auth server; /api/authinfo names it.
                          $info = Invoke-RestMethod -Method GET -Uri "$base/api/authinfo"
                          $authUrl = [string](Get-Prop $info 'auth_url'); if (-not $authUrl) { throw }
                          $tok = Invoke-RestMethod -Method POST -Uri "$($authUrl.TrimEnd('/'))/token" -Body $form -ContentType 'application/x-www-form-urlencoded'
                      }
                      $c = @{ Base = "$base/api"; Headers = @{ Authorization = "Bearer $(Get-Prop $tok 'access_token')"; Accept = $json } }
                  }
                  'kaseyabms' {
                      $base = $v['KaseyaBMS-ApiUrl'].TrimEnd('/')
                      $r = Invoke-RestMethod -Method POST -Uri "$base/v2/security/authenticate" -Form @{ UserName = $v['KaseyaBMS-Username']; Password = $v['KaseyaBMS-Password']; Tenant = $v['KaseyaBMS-CompanyName']; GrantType = 'password' }
                      $token = Get-Path $r 'Result.AccessToken'; if (-not $token) { $token = Get-Path $r 'result.accessToken' }
                      if (-not $token) { throw 'Kaseya BMS sign-in returned no Result.AccessToken. Check the KaseyaBMS-* secrets.' }
                      $c = @{ Base = "$base/v2"; Headers = @{ Authorization = "Bearer $token"; Accept = $json } }
                  }
                  'syncro' { $c = @{ Base = $v['Syncro-ApiUrl'].TrimEnd('/'); Headers = @{ Authorization = "Bearer $($v['Syncro-ApiKey'])"; Accept = $json } } }
                  'zendesk' {
                      $base = $v['Zendesk-BaseUrl'].TrimEnd('/'); if ($base -notmatch '/api/v2$') { $base += '/api/v2' }
                      $b = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($v['Zendesk-Email'])/token:$($v['Zendesk-ApiToken'])"))
                      $c = @{ Base = $base; Headers = @{ Authorization = "Basic $b"; Accept = $json } }
                  }
              }
              $c.Psa = $Psa
              $script:Conn = $c
              return $c
          }

          function Invoke-Psa {
              param([string]$Method, [string]$Path, $Body = $null)
              $p = @{ Method = $Method; Uri = "$($script:Conn.Base)$Path"; Headers = $script:Conn.Headers }
              if ($null -ne $Body) { $p.Body = ($Body | ConvertTo-Json -Depth 10 -Compress -AsArray:($Body -is [array])); $p.ContentType = 'application/json' }
              return Invoke-RestMethod @p
          }
          function Q { param([string]$s) [uri]::EscapeDataString($s) }
          # ConnectWise conditions quote strings and leave numbers bare.
          function CwOwner { param([string]$u) if ($u -match '^\d+$') { "owner/id=$u" } else { "owner/identifier=`"$u`"" } }

          function Get-PsaTicket {
              param([string]$Id)
              switch ($script:Conn.Psa) {
                  'connectwise' {
                      $t = Invoke-Psa GET "/service/tickets/$Id"
                      $desc = ''
                      try { $n = @(Invoke-Psa GET "/service/tickets/$Id/notes?orderBy=$(Q 'id asc')&pageSize=1"); if ($n.Count) { $desc = [string](Get-Prop $n[0] 'text') } } catch { }
                      $owner = Get-Prop $t 'owner'
                      $a = @(@((Get-Prop $owner 'identifier'), (Get-Prop $owner 'id')) | Where-Object { -not (Test-Blank $_) } | ForEach-Object { [string]$_ })
                      return @{ id = $Id; summary = [string](Get-Prop $t 'summary'); description = $desc; companyId = [string](Get-Path $t 'company.id'); status = [string](Get-Path $t 'status.name'); assigneeId = $(if ($a.Count) { $a[0] } else { '' }); assigneeIds = $a; raw = $t }
                  }
                  'autotask' {
                      $t = Get-Prop (Invoke-Psa GET "/Tickets/$Id") 'item'
                      if ($null -eq $t) { throw "Autotask returned no ticket $Id." }
                      $a = Get-Prop $t 'assignedResourceID'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'title'); description = [string](Get-Prop $t 'description'); companyId = [string](Get-Prop $t 'companyID'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'halopsa' {
                      $t = Invoke-Psa GET "/Tickets/$($Id)?includedetails=true"
                      $a = Get-Prop $t 'agent_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'summary'); description = [string](Get-Prop $t 'details'); companyId = [string](Get-Prop $t 'client_id'); status = [string](Get-Prop $t 'status_id'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'kaseyabms' {
                      $t = Get-Prop (Invoke-Psa GET "/servicedesk/tickets/$Id") 'Result'
                      if ($null -eq $t) { throw "Kaseya BMS returned no ticket $Id." }
                      $a = Get-Prop $t 'AssigneeId'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'Title'); description = [string](Get-Prop $t 'Details'); companyId = [string](Get-Prop $t 'AccountId'); status = [string](Get-Prop $t 'StatusName'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'syncro' {
                      $t = Get-Prop (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Syncro returned no ticket $Id." }
                      $c = @(Get-Prop $t 'comments' | Where-Object { $null -ne $_ })
                      $desc = if ($c.Count) { [string](Get-Prop $c[0] 'body') } else { '' }
                      $pt = [string](Get-Prop $t 'problem_type'); if ($pt) { $desc = "Issue type: $pt`n$desc" }
                      $a = Get-Prop $t 'user_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'subject'); description = $desc; companyId = [string](Get-Prop $t 'customer_id'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
                  'zendesk' {
                      $t = Get-Prop (Invoke-Psa GET "/tickets/$Id") 'ticket'
                      if ($null -eq $t) { throw "Zendesk returned no ticket $Id." }
                      $a = Get-Prop $t 'assignee_id'
                      return @{ id = $Id; summary = [string](Get-Prop $t 'subject'); description = [string](Get-Prop $t 'description'); companyId = [string](Get-Prop $t 'organization_id'); status = [string](Get-Prop $t 'status'); assigneeId = $(if (Test-Blank $a) { '' } else { [string]$a }); assigneeIds = @(); raw = $t }
                  }
              }
          }

          function Set-PsaAssignee {
              param([string]$Id, [string]$UserId, [string]$RoleId = '')
              switch ($script:Conn.Psa) {
                  'connectwise' {
                      $val = if ($UserId -match '^\d+$') { @{ id = [int]$UserId } } else { @{ identifier = $UserId } }
                      $null = Invoke-Psa PATCH "/service/tickets/$Id" @([ordered]@{ op = 'replace'; path = 'owner'; value = $val })
                  }
                  'autotask' {
                      if (-not $RoleId) { throw 'Autotask needs a PSA Role Id with the resource. Add it to the engineers table.' }
                      $null = Invoke-Psa PATCH '/Tickets' ([ordered]@{ id = [long]$Id; assignedResourceID = [long]$UserId; assignedResourceRoleID = [long]$RoleId })
                  }
                  'halopsa' { $null = Invoke-Psa POST '/Tickets' @([ordered]@{ id = [long]$Id; agent_id = [long]$UserId }) }
                  'kaseyabms' { $null = Invoke-Psa PATCH "/servicedesk/tickets/$Id" @([ordered]@{ op = 'replace'; path = '/AssigneeId'; value = [long]$UserId }) }
                  'syncro' { $null = Invoke-Psa PUT "/tickets/$Id" @{ user_id = [long]$UserId } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ assignee_id = [long]$UserId } } }
              }
          }

          # Autotask note picklists are per tenant: match on the label, never a hard-coded number.
          function Get-AtPicklist {
              param([string]$Entity, [string]$Field)
              if ($null -eq $script:AtPicklists) { $script:AtPicklists = @{} }
              if (-not $script:AtPicklists.ContainsKey($Entity)) { $script:AtPicklists[$Entity] = @(Get-Prop (Invoke-Psa GET "/$Entity/entityInformation/fields") 'fields') }
              $f = @($script:AtPicklists[$Entity] | Where-Object { [string](Get-Prop $_ 'name') -eq $Field }) | Select-Object -First 1
              return @(Get-Prop $f 'picklistValues' | Where-Object { $null -ne $_ -and (Get-Prop $_ 'isActive') -ne $false })
          }
          function Select-AtValue {
              param($Values, [string[]]$Patterns)
              foreach ($p in $Patterns) {
                  $hit = @($Values | Where-Object { [string](Get-Prop $_ 'label') -match $p }) | Select-Object -First 1
                  if ($hit) { return (Get-Prop $hit 'value') }
              }
              return $null
          }

          function Add-PsaNote {
              param([string]$Id, [string]$Text, [switch]$Internal)
              switch ($script:Conn.Psa) {
                  'connectwise' { $null = Invoke-Psa POST "/service/tickets/$Id/notes" @{ text = $Text; internalAnalysisFlag = $true; detailDescriptionFlag = $false; resolutionFlag = $false } }
                  'autotask' {
                      $pub = Secret 'Autotask-NotePublishId'
                      if (-not $pub) { $pub = Select-AtValue (Get-AtPicklist 'TicketNotes' 'publish') @('^Internal Only$', 'Internal') }
                      $type = Secret 'Autotask-NoteTypeId'
                      if (-not $type) { $vals = @(Get-AtPicklist 'TicketNotes' 'noteType' | Where-Object { [string](Get-Prop $_ 'value') -ne '13' -and [string](Get-Prop $_ 'label') -notmatch 'Workflow' }); $type = Select-AtValue $vals @('Internal', 'Task Detail', 'Detail', '.') }
                      if ($null -eq $pub -or $null -eq $type) { throw 'Could not find the Autotask note publish and type values. Set the Autotask-NotePublishId and Autotask-NoteTypeId secrets.' }
                      $null = Invoke-Psa POST "/Tickets/$Id/Notes" @{ ticketID = [long]$Id; title = 'Ticket routing'; description = $Text; noteType = [int]$type; publish = [int]$pub }
                  }
                  'halopsa' {
                      $outcome = Secret 'Halo-NoteOutcomeId'; if (-not $outcome) { $outcome = 7 }
                      $null = Invoke-Psa POST '/Actions' @(@{ ticket_id = [long]$Id; note = $Text; hiddenfromuser = $true; outcome_id = [int]$outcome })
                  }
                  'kaseyabms' {
                      $type = Secret 'KaseyaBMS-NoteTypeId'
                      if (-not $type) { throw 'Kaseya BMS notes need a note type id. Set the KaseyaBMS-NoteTypeId secret.' }
                      $null = Invoke-Psa POST "/servicedesk/tickets/$Id/notes" @{ Details = $Text; IsInternal = $true; NoteDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); TypeId = [int]$type }
                  }
                  'syncro' { $null = Invoke-Psa POST "/tickets/$Id/comment" @{ subject = 'Ticket routing'; body = $Text; hidden = $true; do_not_email = $true } }
                  'zendesk' { $null = Invoke-Psa PUT "/tickets/$Id" @{ ticket = @{ comment = @{ body = $Text; public = $false } } } }
              }
          }

          function Get-AtCompleteStatuses {
              $v = @(Get-AtPicklist 'Tickets' 'status' | Where-Object { [string](Get-Prop $_ 'label') -match '(?i)complete' } | ForEach-Object { [int](Get-Prop $_ 'value') })
              if (-not $v.Count) { $v = @(5) }
              return $v
          }

          # An int, or $null when this PSA can't count (the caller falls back and warns).
          function Get-PsaOpenCount {
              param([string]$UserId)
              switch ($script:Conn.Psa) {
                  'connectwise' { return [int](Get-Prop (Invoke-Psa GET "/service/tickets/count?conditions=$(Q "$(CwOwner $UserId) and closedFlag=false")") 'count') }
                  'autotask' {
                      $f = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }) + @(Get-AtCompleteStatuses | ForEach-Object { [ordered]@{ op = 'noteq'; field = 'status'; value = $_ } })
                      $r = Invoke-Psa GET "/Tickets/query/count?search=$(Q (@{ filter = $f } | ConvertTo-Json -Depth 6 -Compress))"
                      $n = Get-Prop $r 'queryCount'; if ($null -eq $n) { return $null }; return [int]$n
                  }
                  'halopsa' { $n = Get-Prop (Invoke-Psa GET "/Tickets?agent_id=$UserId&open_only=true&pageinate=true&page_size=1&page_no=1") 'record_count'; if ($null -eq $n) { return $null }; return [int]$n }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $r = Invoke-Psa GET "/tickets?user_id=$UserId&status=$(Q 'Not Closed')&page=1"
                      $te = Get-Path $r 'meta.total_entries'; if ($null -ne $te) { return [int]$te }
                      $n = @(Get-Prop $r 'tickets').Count; $pages = [int](Get-Path $r 'meta.total_pages')
                      for ($p = 2; $p -le [Math]::Min($pages, 10); $p++) { $n += @(Get-Prop (Invoke-Psa GET "/tickets?user_id=$UserId&status=$(Q 'Not Closed')&page=$p") 'tickets').Count }
                      if ($pages -gt 10) { return $null }
                      return $n
                  }
                  'zendesk' { return [int](Get-Prop (Invoke-Psa GET "/search/count?query=$(Q "type:ticket assignee:$UserId status<solved")") 'count') }
              }
          }

          # The newest ticket currently assigned to the engineer: a date, [datetime]::MinValue
          # when they have none, or $null when this PSA can't tell.
          function Get-PsaLastAssigned {
              param([string]$UserId)
              $none = [datetime]::MinValue
              $date = { param($v) if (Test-Blank $v) { $none } else { [datetime]::Parse([string]$v, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal) } }
              switch ($script:Conn.Psa) {
                  'connectwise' { $r = @(Invoke-Psa GET "/service/tickets?conditions=$(Q (CwOwner $UserId))&orderBy=$(Q 'dateEntered desc')&pageSize=1&fields=id,dateEntered"); if (-not $r.Count) { return $none }; return (& $date (Get-Prop $r[0] 'dateEntered')) }
                  'autotask' {
                      # The query API can't sort, so take the highest id from the last 90 days.
                      $since = (Get-Date).ToUniversalTime().AddDays(-90).ToString('yyyy-MM-ddTHH:mm:ssZ')
                      $s = @{ filter = @([ordered]@{ op = 'eq'; field = 'assignedResourceID'; value = [long]$UserId }, [ordered]@{ op = 'gt'; field = 'createDate'; value = $since }); IncludeFields = @('id', 'createDate'); MaxRecords = 500 }
                      $r = Invoke-Psa GET "/Tickets/query?search=$(Q ($s | ConvertTo-Json -Depth 6 -Compress))"
                      $top = @(Get-Prop $r 'items' | Where-Object { $null -ne $_ } | Sort-Object { [long](Get-Prop $_ 'id') } -Descending) | Select-Object -First 1
                      if (-not $top) { return $none }; return (& $date (Get-Prop $top 'createDate'))
                  }
                  'halopsa' { $t = @(Get-Prop (Invoke-Psa GET "/Tickets?agent_id=$UserId&order=dateoccurred&orderdesc=true&pageinate=true&page_size=1&page_no=1") 'tickets'); if (-not $t.Count -or $null -eq $t[0]) { return $none }; return (& $date (Get-Prop $t[0] 'dateoccurred')) }
                  'kaseyabms' { return $null }
                  'syncro' {
                      $latest = $none
                      for ($p = 1; $p -le 10; $p++) {
                          $r = Invoke-Psa GET "/tickets?user_id=$UserId&page=$p"
                          foreach ($t in @(Get-Prop $r 'tickets' | Where-Object { $null -ne $_ })) { $d = & $date (Get-Prop $t 'created_at'); if ($d -gt $latest) { $latest = $d } }
                          if ($p -ge [int](Get-Path $r 'meta.total_pages')) { break }
                      }
                      return $latest
                  }
                  'zendesk' { $t = @(Get-Prop (Invoke-Psa GET "/search?query=$(Q "type:ticket assignee:$UserId")&sort_by=created_at&sort_order=desc&per_page=1") 'results'); if (-not $t.Count -or $null -eq $t[0]) { return $none }; return (& $date (Get-Prop $t[0] 'created_at')) }
              }
          }

          # ---------- this step ----------
          # Checks the classifier's pick against the routing table, finds every qualified engineer,
          # applies the tie-break, and (only when confirm is true) assigns the ticket and adds an internal note.
          function ConvertFrom-MaybeJson { param($v)
              if ($v -is [string]) { $s = $v.Trim() -replace '^```(json)?\s*', '' -replace '\s*```$', ''; if ($s -match '^[\[{]') { try { return ($s | ConvertFrom-Json) } catch { } } }
              return $v
          }
          function Get-Param { param([string]$n)
              # Parameters may arrive as a variable, as a property of the node input, or via Get-NodeInput -Name.
              $v = Get-Variable -Name $n -ValueOnly -ErrorAction SilentlyContinue
              if ($null -eq $v) { $all = $null; try { $all = ConvertFrom-MaybeJson (Get-NodeInput) } catch { }; $v = Get-Prop $all $n }
              if ($null -eq $v) { try { $v = ConvertFrom-MaybeJson (Get-NodeInput -Name $n) } catch { }; $inner = Get-Prop $v $n; if ($null -ne $inner) { $v = $inner } }
              return (ConvertFrom-MaybeJson $v)
          }
          $prep = Get-Param 'prep'
          $ai = Get-Param 'ai'
          # The agent's answer may be wrapped (output / result / structuredOutput) or arrive as JSON text.
          foreach ($k in @('output', 'result', 'structuredOutput', 'response')) { if ($null -ne $ai -and $null -eq (Get-Prop $ai 'skill') -and $null -ne (Get-Prop $ai $k)) { $ai = ConvertFrom-MaybeJson (Get-Prop $ai $k) } }

          $warnings = New-Object System.Collections.ArrayList
          $actions = New-Object System.Collections.ArrayList
          foreach ($w in @(Get-Prop $prep 'warnings')) { if ($w) { $null = $warnings.Add([string]$w) } }
          foreach ($a in @(Get-Prop $prep 'actions')) { if ($a) { $null = $actions.Add([string]$a) } }
          $ticketId = [string](Get-Prop $prep 'ticketId')
          $confirm = (Get-Prop $prep 'confirm') -eq $true
          $out = [ordered]@{
              status = 'error'; message = ''; public_note = ''; internal_note = ''; ticket_id = $ticketId
              actions = @(); warnings = @(); chatReply = ''
              confirm = $confirm; assignee = $null; skill = ''; role = ''; confidence = $null; reason = ''
              candidates = @(); tieBreak = ''; noMatchApplied = $false
          }
          function Complete { param([string]$Status, [string]$Msg, [string]$Note = '')
              $out.status = $Status; $out.message = $Msg; $out.internal_note = $(if ($Note) { $Note } else { $Msg }); $out.chatReply = $Msg
              $out.actions = @($actions); $out.warnings = @($warnings)
              Set-NodeOutput $out
          }

          if ($null -eq $prep) { Complete 'error' 'The Assign step got no output from the Read step.'; return }
          if ((Get-Prop $prep 'status') -ne 'ok') { Complete ([string](Get-Prop $prep 'status')) ([string](Get-Prop $prep 'message')); return }

          try {
              $table = Get-Prop $prep 'table'
              $s = Get-Prop $table 'settings'
              $set = { param($n, $d) $v = [string](Get-Prop $s $n); if ($v.Trim()) { $v.Trim() } else { $d } }
              $tieBreak = & $set 'tieBreak' 'least-open-tickets'
              $respectMax = (& $set 'respectMaxOpen' 'yes') -match '^(?i)yes$'
              $noMatch = & $set 'noMatch' 'leave-unassigned'
              $fallbackName = ((& $set 'fallbackEngineer' '') -replace '\s+,', ',' -replace ',(?=\S)', ', ').Trim()
              $minConf = [double]::Parse((& $set 'minConfidence' '0.7'), [System.Globalization.CultureInfo]::InvariantCulture)
              $out.tieBreak = $tieBreak
              $engineers = @(Get-Prop $table 'engineers' | Where-Object { $null -ne $_ })
              $rows = @(Get-Prop $table 'rows' | Where-Object { $null -ne $_ })
              $eng = @{}; foreach ($e in $engineers) { $eng[[string](Get-Prop $e 'Engineer')] = $e }

              # ---------- 5. check the AI's pick ----------
              $aiSkill = ([string](Get-Prop $ai 'skill')).Trim()
              $aiRole = ([string](Get-Prop $ai 'role')).Trim()
              $conf = 0.0; $c = Get-Prop $ai 'confidence'; if ($null -ne $c) { try { $conf = [double]$c } catch { $null = $warnings.Add("The classifier's confidence '$c' isn't a number, so it counted as 0.") } }
              $reason = ([string](Get-Prop $ai 'reason')).Trim()
              if ($null -eq $ai) { $null = $warnings.Add('The classifier returned nothing, so this counts as no match.') }
              $out.confidence = $conf; $out.reason = $reason
              # Only a skill that's in the table counts (case and spacing aside). The AI never invents one.
              $skill = @($rows | ForEach-Object { [string](Get-Prop $_ 's') } | Where-Object { $_.Trim() -ieq $aiSkill } | Select-Object -First 1)
              $skill = if ($skill.Count -and $aiSkill) { $skill[0] } else { '' }
              $skillRows = @($rows | Where-Object { $skill -and [string](Get-Prop $_ 's') -eq $skill })
              $role = @($skillRows | ForEach-Object { [string](Get-Prop $_ 'r') } | Where-Object { $_.Trim() -ieq $aiRole } | Select-Object -First 1)
              $role = if ($role.Count -and $aiRole) { $role[0] } else { '' }
              $out.skill = $skill; $out.role = $role
              $pickRows = if ($role) { @($skillRows | Where-Object { [string](Get-Prop $_ 'r') -eq $role }) } else { $skillRows }
              if ($skill -and -not $role) { $null = $warnings.Add("Role '$aiRole' isn't listed for $skill, so every engineer with that skill was considered.") }

              $noMatchWhy = ''
              if (-not $aiSkill) { $noMatchWhy = 'the classifier found no skill in the table that fits this ticket' }
              elseif (-not $skill) { $noMatchWhy = "the classifier picked '$aiSkill', which isn't a skill in the routing table" }
              elseif ($conf -lt $minConf) { $noMatchWhy = "the classifier's confidence ($conf) is below minConfidence ($minConf)" }

              # ---------- candidates, in listed order ----------
              $null = Connect-Psa ([string](Get-Prop $prep 'psa'))
              $cands = New-Object System.Collections.ArrayList
              foreach ($n in @($pickRows | ForEach-Object { [string](Get-Prop $_ 'e') } | Select-Object -Unique)) {
                  $e = $eng[$n]
                  $cand = [ordered]@{ name = $n; psaUserId = ''; psaRoleId = ''; email = ''; maxOpen = ''; openCount = $null; lastAssigned = $null; skipped = '' }
                  if ($null -eq $e) { $cand.skipped = 'not in the engineers table' }
                  else {
                      $cand.psaUserId = [string](Get-Prop $e 'PsaUserId'); $cand.psaRoleId = [string](Get-Prop $e 'PsaRoleId'); $cand.email = [string](Get-Prop $e 'Email'); $cand.maxOpen = [string](Get-Prop $e 'MaxOpen')
                      if ((Get-Prop $e 'Active') -eq $false) { $cand.skipped = 'inactive' }
                  }
                  $null = $cands.Add($cand)
              }
              $eligible = { @($cands | Where-Object { -not $_.skipped }) }

              # ---------- 6. tie-break ----------
              $needCounts = ($tieBreak -eq 'least-open-tickets') -or ($respectMax -and @(& $eligible | Where-Object { $_.maxOpen }).Count)
              $countsOk = $true
              if (-not $noMatchWhy -and $needCounts -and @(& $eligible).Count) {
                  foreach ($cd in (& $eligible)) {
                      try { $cd.openCount = Get-PsaOpenCount $cd.psaUserId } catch { $cd.openCount = $null; $null = $warnings.Add("Couldn't count open tickets for $($cd.name): $($_.Exception.Message)") }
                      if ($null -eq $cd.openCount) { $countsOk = $false }
                  }
                  if (-not $countsOk) { $null = $warnings.Add("Open-ticket counts aren't available from $($script:Conn.Psa) for every engineer, so$(if ($tieBreak -eq 'least-open-tickets') { ' listed order was used and' }) Max Open Tickets wasn't enforced.") }
                  if ($respectMax -and $countsOk) {
                      foreach ($cd in (& $eligible)) { if ($cd.maxOpen -and $cd.openCount -ge [int]$cd.maxOpen) { $cd.skipped = "at the limit ($($cd.openCount) of $($cd.maxOpen) open)" } }
                  }
              }
              $pool = @(& $eligible)
              if (-not $noMatchWhy -and -not $pool.Count) { $noMatchWhy = $(if ($cands.Count) { "every engineer for $skill$(if ($role) { " / $role" }) is inactive or at their limit" } else { "no engineer is listed for $skill$(if ($role) { " / $role" })" }) }

              $pick = $null; $usedTie = $tieBreak
              if (-not $noMatchWhy) {
                  switch ($tieBreak) {
                      'least-open-tickets' { if ($countsOk) { $pick = @($pool | Sort-Object { $_.openCount } -Stable)[0] } else { $usedTie = 'listed-order' } }
                      'least-recently-assigned' {
                          $ok = $true
                          foreach ($cd in $pool) { try { $cd.lastAssigned = Get-PsaLastAssigned $cd.psaUserId } catch { $cd.lastAssigned = $null; $null = $warnings.Add("Couldn't read the last ticket for $($cd.name): $($_.Exception.Message)") }; if ($null -eq $cd.lastAssigned) { $ok = $false } }
                          if ($ok) { $pick = @($pool | Sort-Object { $_.lastAssigned } -Stable)[0] } else { $usedTie = 'listed-order'; $null = $warnings.Add("Last-assigned times aren't available from $($script:Conn.Psa), so listed order was used.") }
                      }
                      'random' { $pick = $pool | Get-Random }
                  }
                  if ($null -eq $pick) { $pick = $pool[0] }
              }
              $out.tieBreak = $usedTie

              # ---------- no match ----------
              $recommend = @()
              if ($noMatchWhy) {
                  $out.noMatchApplied = $true
                  if ($noMatch -eq 'assign-fallback') {
                      $fe = $eng[$fallbackName]
                      if ($null -eq $fe -or (Get-Prop $fe 'Active') -eq $false) { $null = $warnings.Add("fallbackEngineer '$fallbackName' is missing or inactive, so the ticket was left unassigned.") }
                      else { $pick = [ordered]@{ name = $fallbackName; psaUserId = [string](Get-Prop $fe 'PsaUserId'); psaRoleId = [string](Get-Prop $fe 'PsaRoleId'); email = [string](Get-Prop $fe 'Email'); openCount = $null; skipped = '' }; $usedTie = 'fallback'; $out.tieBreak = 'fallback' }
                  }
                  if ($noMatch -eq 'recommend-only') { $recommend = @($pool | Select-Object -First 3 | ForEach-Object { $_.name }) }
              }
              $out.candidates = @($cands | ForEach-Object { [ordered]@{ name = $_.name; openCount = $_.openCount; skipped = $_.skipped } })
              if ($pick) { $out.assignee = [ordered]@{ name = $pick.name; psaUserId = $pick.psaUserId; email = $pick.email } }

              # ---------- the note ----------
              $fmt = { param($cd) "$($cd.name)$(if ($null -ne $cd.openCount) { " ($($cd.openCount) open)" })$(if ($cd.skipped) { ", skipped: $($cd.skipped)" })" }
              $lines = @()
              if ($pick) { $lines += "Ticket routing: assigned to $($pick.name)$(if ($noMatchWhy) { ' (the fallback engineer)' })." }
              else { $lines += "Ticket routing: not assigned, because $noMatchWhy." }
              if ($noMatchWhy -and $pick) { $lines += "No match: $noMatchWhy." }
              if ($aiSkill) { $lines += "Skill: $(if ($skill) { $skill } else { "$aiSkill (not in the table)" })$(if ($role) { ", role: $role" } elseif ($aiRole) { ", role: $aiRole (not listed for this skill)" }). Confidence $conf." }
              if ($reason) { $lines += "Why: $reason" }
              if ($cands.Count) { $lines += "Candidates: $((@($cands | ForEach-Object { & $fmt $_ })) -join '; ')." }
              if ($recommend.Count) { $lines += "Suggested: $($recommend -join ', ')." }
              if ($pick) { $lines += "Tie-break: $usedTie." }
              $note = $lines -join "`n"

              # ---------- 7. write (only when confirm is true) ----------
              if (-not $confirm) {
                  $msg = if ($pick) { "Would assign ticket $ticketId to $($pick.name)." } else { "Would leave ticket $ticketId unassigned: $noMatchWhy." }
                  $null = $actions.Add('Preview only (confirm is false): nothing was assigned and no note was added.')
                  Complete 'pending_confirmation' "$msg Send confirm true to apply it." "PREVIEW (confirm is false; nothing written)`n$note"
                  return
              }
              if ($pick) {
                  try { Set-PsaAssignee $ticketId $pick.psaUserId $pick.psaRoleId; $null = $actions.Add("Assigned ticket $ticketId to $($pick.name) (PSA user $($pick.psaUserId))") }
                  catch { Complete 'error' "Couldn't assign ticket $ticketId to $($pick.name): $($_.Exception.Message)" "$note`nThe assignment failed: $($_.Exception.Message)"; return }
              }
              try { Add-PsaNote $ticketId $note -Internal; $null = $actions.Add('Added the internal routing note') }
              catch { $null = $warnings.Add("The internal note wasn't added: $($_.Exception.Message)") }
              if ($pick) { Complete 'success' "Assigned ticket $ticketId to $($pick.name)$(if ($skill) { " for $skill" })." $note }
              else { Complete 'incomplete' "Ticket $ticketId was left unassigned: $noMatchWhy." $note }
          } catch {
              Complete 'error' "Routing failed: $($_.Exception.Message)"
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters:
          - name: prep
            expression: '{{ nodes.node-prepare.output }}'
