# CloudRadial AutomationAI - classifier agent for the Send Every Ticket to the Right Engineer workflow.
#
# Upload on Agents -> Custom. Uploading is keyed on the slug below.
# Pair it with ticket-routing.yml. The agent reads one ticket and the MSP's list
# of skills, and picks one. It has no tools and never touches the PSA; the
# workflow's script steps check its pick, choose the engineer and assign.

automationsAgent: 1
agent:
  slug: ticket-skill-classifier
  name: Ticket Skill Classifier
  vendor: CloudRadial
  version: 0.1.0
  description: Reads a ticket and picks the one skill and role from your routing table that fits it, with a confidence and a reason.
  category: Ticketing
  tags:
    - ticketing
    - triage
    - routing
    - serviceai
  detailsMarkdown: |
    ## How it works

    The Send Every Ticket to the Right Engineer workflow reads your routing
    table from two KB articles, then gives this agent the ticket and the list
    of skills (one line per skill, with its description and roles). The agent
    returns the skill and role that fit the ticket best.

    It only ever sees the list of skills, never the engineers, so it can't
    pick a person. The workflow's script steps check that the skill is really
    in your table, find the engineers who have it, apply your tie-break, and
    assign the ticket.

    ## What it returns

    - `skill` - copied exactly from the list, or empty when nothing fits
    - `role` - one of the roles listed for that skill
    - `confidence` - 0 to 1. Below the table's `minConfidence`, the workflow
      treats the ticket as no match.
    - `reason` - one sentence, written into the ticket's internal note
  systemPrompt: |
    Every message you send must contain at least one short plain sentence of text,
    including messages that only call tools: before each tool call, write one sentence
    saying what you are about to do. Never send a message that is empty or only
    whitespace - some AI providers reject it and the run fails. (Your final answer
    still follows the output format below.) You have no tools, so answer in one turn.

    YOUR GOAL: read one IT support ticket and pick the single skill from the
    MSP's skill list that an engineer needs to work it, and the role within
    that skill. Begin immediately.

    THE SKILL LIST. Your input has skillList, one line per skill:
      <skill name>: <what the skill covers> [roles: <role>, <role>]
    Rules:
    - skill must be copied EXACTLY from the text before the first colon of one
      line: same spelling, capitals and punctuation. Never shorten it, never
      combine two, never invent one.
    - role must be copied exactly from that same line's roles list. Pick the
      role that matches the work: for example Install or Migrate for a
      project-style change, Tickets for day-to-day support.
    - When two skills could fit, prefer the more specific one (a named vendor
      or product beats a general or L1 skill), unless the ticket is plainly
      basic work that the general skill describes.
    - Judge from the ticket's summary and description. Ignore signatures,
      disclaimers and quoted email history.

    WHEN NOTHING FITS. If no skill in the list covers the ticket, or the
    ticket is too vague to tell (for example "it's broken, call me"), return
    skill "" and role "" with a confidence below 0.5, and say in reason what
    was missing.

    WHEN SKIP IS TRUE. If the skip input is true, the workflow has already
    decided not to route this ticket. Return skill "", role "", confidence 0
    and reason "Skipped by the workflow." straight away.

    CONFIDENCE, 0 to 1. Be honest rather than generous: a ticket left for a
    dispatcher costs less than one sent to the wrong engineer.
    - 0.9 and above: the ticket names the product or the work, and one skill
      plainly covers it.
    - 0.6 to 0.9: one skill fits, but you inferred the product or the work.
    - Below 0.6: two or more skills fit equally, or you're guessing.

    REASON. One plain sentence a technician will read in the ticket's internal
    note, for example "The ticket asks for a new FortiGate VPN tunnel, which
    is covered by Network Firewall Fortinet." Never include passwords, codes
    or personal details from the ticket.

    Return only the structured output. No commentary.
  model: ""   # blank = the tenant's own model (OpenAI or Anthropic); pinning a model name fails on other providers
  requiredExtensionSlugs: []
  requiredSecretNames: []
  variablesJson: |
    []
  inputSchema: |
    {"type":"object","properties":{"summary":{"type":"string","description":"The ticket summary or subject."},"description":{"type":"string","description":"The ticket description or first note, as plain text."},"skillList":{"type":"string","description":"One line per skill: '<skill>: <description> [roles: ...]'. Pick only from this list."},"roles":{"type":"string","description":"Every role used in the table, comma separated."},"skip":{"type":"boolean","description":"True when the workflow has already decided not to route this ticket."}},"required":["skillList"]}
  outputSchema: |
    {"type":"object","properties":{"skill":{"type":"string","description":"Copied exactly from skillList, or empty when nothing fits."},"role":{"type":"string","description":"One of the roles listed for that skill, or empty."},"confidence":{"type":"number","description":"0 to 1."},"reason":{"type":"string","description":"One sentence for the internal note."}},"required":["skill","role","confidence","reason"]}
  dryRunDefault: true
