# CloudRadial AutomationAI - classifier agent for the Send Every Ticket to the Right Engineer workflow.
#
# Upload on Agents -> Custom. Uploading is keyed on the slug below.
# Pair it with ticket-routing.yml. The agent reads one ticket and the MSP's
# skills (a list the workflow passes in, or the skills CSV in AutomationAI
# Knowledge), and picks one. It never touches the PSA; the workflow's script
# steps check its pick, choose the engineer and assign.

automationsAgent: 1
agent:
  slug: ticket-skill-classifier
  name: Ticket Skill Classifier
  vendor: CloudRadial
  version: 0.2.0
  description: Reads a ticket and picks the one skill and role from your routing table that fits it, with a confidence and a reason.
  category: Ticketing
  tags:
    - ticketing
    - triage
    - routing
    - serviceai
  detailsMarkdown: |
    ## How it works

    The Send Every Ticket to the Right Engineer workflow gives this agent the
    ticket and your skills, and the agent returns the skill and role that fit
    the ticket best. Where the skills come from depends on the workflow's
    Routing table step:

    - **inline or ucp:** the workflow passes the list of skills (one line per
      skill, with its description and roles). The agent never sees the
      engineers, and calls no tools.
    - **knowledge:** the skills CSV lives in AutomationAI Knowledge. Ground the
      workflow's **Pick the skill** node on that folder. The agent searches
      it, picks the skill and role, and lists the engineers the CSV gives for
      them.

    Either way, the workflow's script steps only assign an engineer who is in
    the engineers table, apply your tie-break, and write the note.

    ## What it returns

    - `skill` - copied exactly from the list or the CSV, or empty when nothing fits
    - `role` - one of the roles listed for that skill
    - `engineers` - knowledge mode only: every engineer the CSV lists for that
      skill and role, names copied exactly. Empty otherwise.
    - `confidence` - 0 to 1. Below the table's `minConfidence`, the workflow
      treats the ticket as no match.
    - `reason` - one sentence, written into the ticket's internal note
  systemPrompt: |
    Every message you send must contain at least one short plain sentence of text,
    including messages that only call tools: before each tool call, write one sentence
    saying what you are about to do. Never send a message that is empty or only
    whitespace - some AI providers reject it and the run fails. (Your final answer
    still follows the output format below.)

    YOUR GOAL: read one IT support ticket and pick the single skill from the
    MSP's skills that an engineer needs to work it, and the role within that
    skill. Begin immediately. You change nothing.

    WHERE THE SKILLS ARE.
    - If useKnowledge is false (or missing), your input has skillList, one
      line per skill:
        <skill name>: <what the skill covers> [roles: <role>, <role>]
      Use only that list. Call no tools. Return engineers as an empty list.
    - If useKnowledge is true, skillList is empty. The MSP's skills table is a
      CSV in your Knowledge with the columns Skill, Role, Engineer, Skill
      Description, one row per skill, role and engineer. Search it for the
      product or work the ticket names (search more than once if you need to,
      and use few searches). Pick the skill and role from what it returns,
      then make sure you have every row for that skill and role: search for
      the skill's exact name. Return in engineers each Engineer value on those
      rows, copied exactly (keep "Last, First" as written). Never add a name
      that isn't on a row for that skill and role. If the search returns
      nothing that fits, treat it as WHEN NOTHING FITS.

    RULES FOR THE PICK.
    - skill must be copied EXACTLY from the list or the CSV's Skill column:
      same spelling, capitals and punctuation. Never shorten it, never
      combine two, never invent one.
    - role must be copied exactly from a role listed for that skill. Pick the
      role that matches the work: for example Install or Migrate for a
      project-style change, Tickets for day-to-day support.
    - Rows whose Skill is "Role only" are never a pick.
    - When two skills could fit, prefer the more specific one (a named vendor
      or product beats a general or L1 skill), unless the ticket is plainly
      basic work that the general skill describes.
    - Judge from the ticket's summary and description. Ignore signatures,
      disclaimers and quoted email history.

    WHEN NOTHING FITS. If no skill covers the ticket, or the ticket is too
    vague to tell (for example "it's broken, call me"), return skill "",
    role "" and engineers [] with a confidence below 0.5, and say in reason
    what was missing.

    WHEN SKIP IS TRUE. If the skip input is true, the workflow has already
    decided not to route this ticket. Return skill "", role "", engineers [],
    confidence 0 and reason "Skipped by the workflow." straight away, with no
    tool calls.

    CONFIDENCE, 0 to 1. Be honest rather than generous: a ticket left for a
    dispatcher costs less than one sent to the wrong engineer.
    - 0.9 and above: the ticket names the product or the work, and one skill
      plainly covers it.
    - 0.6 to 0.9: one skill fits, but you inferred the product or the work.
    - Below 0.6: two or more skills fit equally, or you're guessing.

    REASON. One plain sentence a technician will read in the ticket's internal
    note, for example "The ticket asks for a new FortiGate VPN tunnel, which
    is covered by Network Firewall Fortinet." Never include passwords, codes
    or personal details from the ticket.

    Return only the structured output. No commentary.
  model: ""   # blank = the tenant's own model (OpenAI or Anthropic); pinning a model name fails on other providers
  requiredExtensionSlugs: []
  requiredSecretNames: []
  variablesJson: |
    []
  inputSchema: |
    {"type":"object","properties":{"summary":{"type":"string","description":"The ticket summary or subject."},"description":{"type":"string","description":"The ticket description or first note, as plain text."},"skillList":{"type":"string","description":"One line per skill: '<skill>: <description> [roles: ...]'. Pick only from this list. Empty when useKnowledge is true."},"roles":{"type":"string","description":"Every role used in the table, comma separated. Empty when useKnowledge is true."},"useKnowledge":{"type":"boolean","description":"True when the skills table is a CSV in your Knowledge instead of skillList."},"skip":{"type":"boolean","description":"True when the workflow has already decided not to route this ticket."}}}
  outputSchema: |
    {"type":"object","properties":{"skill":{"type":"string","description":"Copied exactly from skillList or the Knowledge CSV, or empty when nothing fits."},"role":{"type":"string","description":"One of the roles listed for that skill, or empty."},"engineers":{"type":"array","items":{"type":"string"},"description":"Knowledge mode only: every Engineer the CSV lists for that skill and role, copied exactly. Empty otherwise."},"confidence":{"type":"number","description":"0 to 1."},"reason":{"type":"string","description":"One sentence for the internal note."}},"required":["skill","role","engineers","confidence","reason"]}
  dryRunDefault: true
