# CloudRadial AutomationAI - Offboard a Departing Employee (Microsoft 365 and Exchange Online).
# Generated by src/build.js. Edit the scripts in src/, not this file.
# Import on Workflows -> Import. See README.md for secrets, permissions and inputs.
automationsWorkflow: 1
name: Offboard a Departing Employee
description: 'Offboards a departing Microsoft 365 user: blocks sign-in, resets the password to a random value, signs them out everywhere, removes their cloud groups, converts the mailbox to shared, hides it from the address list, optionally forwards mail, then removes licences. Preview only until confirm is true. Refuses admin accounts and self-offboarding. Writes an internal ticket note and an admin-only completion report.'
definition:
  schemaVersion: 1
  activities:
    - id: start
      name: Start
      type: start
      position:
        x: 80
        'y': 120
      properties:
        webhookEnabled: false
    - id: node-read
      name: Read the user and plan the offboarding
      type: powershell-script
      position:
        x: 320
        'y': 120
      properties:
        script: |
          # =====================================================================
          #  Offboard a Departing Employee - Read the user and plan the offboarding
          #  Writes nothing. Reads the user, admin roles, groups, licences, manager, direct reports and devices from Microsoft Graph,
          #  and the mailbox from Exchange Online when the runner can reach it.
          #  Secrets: M365-TenantId, M365-ClientId, M365-ClientSecret; optional MicrosoftExchange-* (see README) and CloudRadial-CompanyId.
          #  Generated from user-offboarding/src. Edit the source, then run build.js.
          # =====================================================================
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # >>> _shared/graph.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- _shared/graph.ps1: Microsoft Graph for AutomationAI steps ----------
          # Edit this file, then run: node _shared/inject.js <automation-folder>
          # Signs in with the app registration's client credentials from the runner Key Vault.
          # Each helper names the Graph application permission it needs; when Graph answers 403,
          # the error says which permission to grant (with admin consent).
          # All state lives in the $GraphState hashtable and is changed in place, because the runner
          # runs a step in a child scope where $script: variables don't behave.

          $GraphState = @{
              Base           = 'https://graph.microsoft.com'
              Headers        = $null
              Creds          = $null
              TenantId       = ''
              ExpiresAt      = [datetime]::MinValue
              MaxAttempts    = 5
              MaxWaitSeconds = 120
              LastStatus     = 0
          }

          # ---- small helpers (all Graph-prefixed so they don't clash with other shared files) ----
          # The first secret that has a value, from a list of names.
          function Get-GraphSecret { param([string[]]$Names) foreach ($n in $Names) { $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $n -AsPlainText -ErrorAction SilentlyContinue } catch { }; if (-not [string]::IsNullOrWhiteSpace($v)) { return $v } }; return $null }
          function Get-GraphProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-GraphHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Get-GraphRetryAfter {
              param($Err, [int]$Attempt)
              $s = 0
              try {
                  $ra = $Err.Exception.Response.Headers.RetryAfter
                  if ($null -ne $ra -and $null -ne $ra.Delta) { $s = [int][Math]::Ceiling($ra.Delta.TotalSeconds) }
                  elseif ($null -ne $ra -and $null -ne $ra.Date) { $s = [int][Math]::Ceiling(($ra.Date.UtcDateTime - [datetime]::UtcNow).TotalSeconds) }
              } catch { }
              if ($s -le 0) { $s = [int][Math]::Min(60, [Math]::Pow(2, $Attempt)) }
              return [int][Math]::Min($s, $GraphState.MaxWaitSeconds)
          }
          # Graph's own error message when there is one, otherwise the exception text.
          function Get-GraphErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) { try { $j = $d | ConvertFrom-Json -ErrorAction Stop; $m = Get-GraphProp (Get-GraphProp $j 'error') 'message'; if (-not $m) { $m = Get-GraphProp $j 'error_description' }; if ($m) { return [string]$m } } catch { }; return $d }
              return [string]$Err.Exception.Message
          }
          function ConvertTo-GraphId { param([string]$Id) return [uri]::EscapeDataString($Id.Trim()) }

          function Update-GraphToken {
              $c = $GraphState.Creds
              if ($null -eq $c) { throw 'Call Connect-Graph before any other Graph function.' }
              $r = $null
              try { $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$($c.TenantId)/oauth2/v2.0/token" -Body @{ client_id = $c.ClientId; client_secret = $c.ClientSecret; scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop }
              catch { throw "Couldn't get a Microsoft Graph token for tenant $($c.TenantId): $(Get-GraphErrorText $_). Check the M365-TenantId, M365-ClientId and M365-ClientSecret secrets." }
              $tok = Get-GraphProp $r 'access_token'
              if (-not $tok) { throw 'Microsoft sign-in returned no access token. Check the M365-ClientId and M365-ClientSecret secrets.' }
              $GraphState.Headers = @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' }
              $exp = 3600; $e = Get-GraphProp $r 'expires_in'; if ($null -ne $e -and [string]$e -match '^\d+$') { $exp = [int]$e }
              $GraphState.ExpiresAt = (Get-Date).AddSeconds([Math]::Max(60, $exp - 300))
          }

          # Signs in with client credentials. With no parameters it reads the runner Key Vault, trying each
          # name in turn: M365-TenantId / M365-TenantID / Entra-TenantID / Graph-TenantId, M365-ClientId /
          # M365-ClientID / Entra-ClientID / Graph-ClientId, and M365-ClientSecret / Entra-ClientSecret / Graph-ClientSecret.
          # Returns @{ TenantId }.
          function Connect-Graph {
              param([string]$TenantId, [string]$ClientId, [string]$ClientSecret)
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $TenantId = Get-GraphSecret @('M365-TenantId', 'M365-TenantID', 'Entra-TenantID', 'Graph-TenantId') }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $ClientId = Get-GraphSecret @('M365-ClientId', 'M365-ClientID', 'Entra-ClientID', 'Graph-ClientId') }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $ClientSecret = Get-GraphSecret @('M365-ClientSecret', 'Entra-ClientSecret', 'Graph-ClientSecret') }
              $missing = @()
              if ([string]::IsNullOrWhiteSpace($TenantId)) { $missing += 'M365-TenantId' }
              if ([string]::IsNullOrWhiteSpace($ClientId)) { $missing += 'M365-ClientId' }
              if ([string]::IsNullOrWhiteSpace($ClientSecret)) { $missing += 'M365-ClientSecret' }
              if ($missing.Count) { throw "Add these secrets to the runner Key Vault: $($missing -join ', ') (the Entra-* and Graph-* names work too)." }
              $GraphState.Creds = @{ TenantId = $TenantId.Trim(); ClientId = $ClientId.Trim(); ClientSecret = $ClientSecret }
              $GraphState.TenantId = $TenantId.Trim()
              Update-GraphToken
              return @{ TenantId = $GraphState.TenantId }
          }

          # One Graph call. Path is '/v1.0/...', '/beta/...', a path without a version (v1.0 is added), or a full URL.
          # Retries 429, 503 and 504 honoring Retry-After, refreshes the token once on 401, and on 403 throws a
          # message naming -Permission. Other failures throw "Microsoft Graph <method> <path> failed (HTTP n): <reason>".
          # $GraphState.LastStatus holds the last HTTP status, so a caller can treat 404 as "not found".
          function Invoke-Graph {
              param([string]$Method = 'GET', [string]$Path, $Body = $null, [string]$Permission = '', [hashtable]$Headers = @{})
              if ($null -eq $GraphState.Creds) { throw 'Call Connect-Graph before any other Graph function.' }
              $uri = if ($Path -match '^https?://') { $Path } elseif ($Path -match '^/(v1\.0|beta)/') { "$($GraphState.Base)$Path" } else { "$($GraphState.Base)/v1.0/$($Path.TrimStart('/'))" }
              $short = $uri.Replace($GraphState.Base, '')
              $reauth = $false
              for ($i = 1; $i -le $GraphState.MaxAttempts; $i++) {
                  if ((Get-Date) -ge $GraphState.ExpiresAt) { Update-GraphToken }
                  $h = @{}; foreach ($k in $GraphState.Headers.Keys) { $h[$k] = $GraphState.Headers[$k] }; foreach ($k in $Headers.Keys) { $h[$k] = $Headers[$k] }
                  $p = @{ Method = $Method; Uri = $uri; Headers = $h; ErrorAction = 'Stop' }
                  if ($null -ne $Body) { $p.Body = $(if ($Body -is [string]) { $Body } else { ConvertTo-Json -InputObject $Body -Depth 10 -Compress }) }
                  try {
                      $r = Invoke-RestMethod @p
                      $GraphState.LastStatus = 200
                      return $r
                  }
                  catch {
                      $code = Get-GraphHttpStatus $_
                      $GraphState.LastStatus = $code
                      if ($code -in @(429, 503, 504) -and $i -lt $GraphState.MaxAttempts) { Start-Sleep -Seconds (Get-GraphRetryAfter $_ $i); continue }
                      if ($code -eq 401 -and -not $reauth) { $reauth = $true; Update-GraphToken; continue }
                      $why = Get-GraphErrorText $_
                      if ($code -eq 403) {
                          $need = if ($Permission) { "the $Permission application permission" } else { 'a Microsoft Graph application permission it does not have' }
                          throw "Microsoft Graph refused $Method $short (403 Forbidden). The app registration needs $need, with admin consent. Graph said: $why"
                      }
                      throw "Microsoft Graph $Method $short failed$(if ($code) { " (HTTP $code)" }): $why"
                  }
              }
          }

          # Every item from a list call, following @odata.nextLink. Wrap the result in @(...).
          function Get-GraphAll {
              param([string]$Path, [string]$Permission = '', [int]$MaxPages = 500)
              $rows = New-Object System.Collections.ArrayList
              $next = $Path; $n = 0
              while ($next -and $n -lt $MaxPages) {
                  $n++
                  $r = Invoke-Graph -Method GET -Path $next -Permission $Permission
                  foreach ($v in @(Get-GraphProp $r 'value')) { if ($null -ne $v) { $null = $rows.Add($v) } }
                  $next = [string](Get-GraphProp $r '@odata.nextLink')
              }
              return @($rows)
          }

          # A user by id or UPN, or $null when there is no such user. Needs User.Read.All.
          function Get-GraphUser {
              param([string]$Id, [string]$Select = 'id,userPrincipalName,displayName,mail,accountEnabled,usageLocation,jobTitle,department,assignedLicenses')
              try { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $Id)?`$select=$Select" -Permission 'User.Read.All' }
              catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
          }

          # Adds a user to a group. Returns 'added' or 'already-member'. Needs GroupMember.ReadWrite.All.
          # Mail-enabled security groups and distribution lists can't be changed through Graph.
          function Add-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/groups/$GroupId/members/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/directoryObjects/$UserId" } -Permission 'GroupMember.ReadWrite.All'; return 'added' }
              catch { if ($GraphState.LastStatus -eq 400 -and $_.Exception.Message -match 'already exist') { return 'already-member' }; throw }
          }

          # Removes a user from a group. Returns 'removed' or 'not-member'. Needs GroupMember.ReadWrite.All.
          function Remove-GraphGroupMember {
              param([string]$GroupId, [string]$UserId)
              try { $null = Invoke-Graph -Method DELETE -Path "/v1.0/groups/$GroupId/members/$UserId/`$ref" -Permission 'GroupMember.ReadWrite.All'; return 'removed' }
              catch { if ($GraphState.LastStatus -eq 404) { return 'not-member' }; throw }
          }

          # Sets the user's manager. Needs User.ReadWrite.All.
          function Set-GraphManager {
              param([string]$UserId, [string]$ManagerId)
              $null = Invoke-Graph -Method PUT -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/manager/`$ref" -Body @{ '@odata.id' = "https://graph.microsoft.com/v1.0/users/$ManagerId" } -Permission 'User.ReadWrite.All'
          }

          # Signs the user out of every session (refresh tokens revoked). Needs User.RevokeSessions.All (or User.ReadWrite.All).
          function Revoke-GraphSessions {
              param([string]$UserId)
              $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/revokeSignInSessions" -Permission 'User.RevokeSessions.All (or User.ReadWrite.All)'
          }

          # Turns sign-in on or off. Needs User.EnableDisableAccount.All (or User.ReadWrite.All).
          # Disabling an admin account also needs a privileged role, which app permissions can't grant.
          function Set-GraphAccountEnabled {
              param([string]$UserId, [bool]$Enabled)
              $null = Invoke-Graph -Method PATCH -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)" -Body @{ accountEnabled = $Enabled } -Permission 'User.EnableDisableAccount.All (or User.ReadWrite.All)'
          }

          # Adds and/or removes licences by SKU id (GUID). Needs LicenseAssignment.ReadWrite.All (or User.ReadWrite.All).
          # The user must have a usage location before a licence can be added.
          function Set-GraphLicense {
              param([string]$UserId, [string[]]$Add = @(), [string[]]$Remove = @())
              $toAdd = @($Add | Where-Object { $_ } | ForEach-Object { @{ skuId = [string]$_; disabledPlans = @() } })
              $toRemove = @($Remove | Where-Object { $_ } | ForEach-Object { [string]$_ })
              if (-not $toAdd.Count -and -not $toRemove.Count) { return }
              try { $null = Invoke-Graph -Method POST -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/assignLicense" -Body @{ addLicenses = $toAdd; removeLicenses = $toRemove } -Permission 'LicenseAssignment.ReadWrite.All (or User.ReadWrite.All)' }
              catch { if ($_.Exception.Message -match '(?i)usage location') { throw "The user has no usage location, so Microsoft 365 can't assign a licence. Set usageLocation first. ($($_.Exception.Message))" }; throw }
          }

          # Last sign-in times (signInActivity). With -UserId, one user; without, every user.
          # Needs AuditLog.Read.All plus User.Read.All, and an Entra ID P1 tenant.
          function Get-GraphSignInActivity {
              param([string]$UserId = '')
              $sel = 'id,userPrincipalName,displayName,accountEnabled,signInActivity'
              $perm = 'AuditLog.Read.All (with User.Read.All)'
              if ($UserId) { return Invoke-Graph -Method GET -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)?`$select=$sel" -Permission $perm }
              # Graph caps the page size at 120 when signInActivity is selected.
              return @(Get-GraphAll -Path "/v1.0/users?`$select=$sel&`$top=120" -Permission $perm)
          }

          # The user's registered sign-in methods (each has id and @odata.type). Needs UserAuthenticationMethod.Read.All.
          function Get-GraphAuthMethods {
              param([string]$UserId)
              return @(Get-GraphAll -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/methods" -Permission 'UserAuthenticationMethod.Read.All')
          }

          # Removes one sign-in method. Pass -Method (an item from Get-GraphAuthMethods), or -MethodId and -MethodType.
          # Needs UserAuthenticationMethod.ReadWrite.All. The password method can't be removed.
          function Remove-GraphAuthMethod {
              param([string]$UserId, $Method = $null, [string]$MethodId = '', [string]$MethodType = '')
              if ($null -ne $Method) { $MethodId = [string](Get-GraphProp $Method 'id'); $MethodType = [string](Get-GraphProp $Method '@odata.type') }
              $t = ($MethodType -replace '^#?microsoft\.graph\.', '')
              $seg = @{
                  microsoftAuthenticatorAuthenticationMethod = 'microsoftAuthenticatorMethods'
                  phoneAuthenticationMethod                  = 'phoneMethods'
                  fido2AuthenticationMethod                  = 'fido2Methods'
                  emailAuthenticationMethod                  = 'emailMethods'
                  softwareOathAuthenticationMethod           = 'softwareOathMethods'
                  windowsHelloForBusinessAuthenticationMethod = 'windowsHelloForBusinessMethods'
                  temporaryAccessPassAuthenticationMethod    = 'temporaryAccessPassMethods'
                  platformCredentialAuthenticationMethod     = 'platformCredentialMethods'
              }
              if ($t -eq 'passwordAuthenticationMethod') { throw "The password method can't be removed. Reset the password instead." }
              if (-not $MethodId -or -not $seg.ContainsKey($t)) { throw "Can't remove sign-in method '$MethodType' ($MethodId): unknown method type." }
              $null = Invoke-Graph -Method DELETE -Path "/v1.0/users/$(ConvertTo-GraphId $UserId)/authentication/$($seg[$t])/$MethodId" -Permission 'UserAuthenticationMethod.ReadWrite.All'
          }

          # Risky users from Identity Protection. With -UserId, that user (or $null when not flagged); with -AtRiskOnly,
          # only riskState atRisk. Needs IdentityRiskyUser.Read.All and an Entra ID P2 tenant.
          function Get-GraphRiskyUsers {
              param([string]$UserId = '', [switch]$AtRiskOnly)
              $perm = 'IdentityRiskyUser.Read.All'
              if ($UserId) {
                  try { return Invoke-Graph -Method GET -Path "/v1.0/identityProtection/riskyUsers/$UserId" -Permission $perm }
                  catch { if ($GraphState.LastStatus -eq 404) { return $null }; throw }
              }
              $q = if ($AtRiskOnly) { "?`$filter=$([uri]::EscapeDataString("riskState eq 'atRisk'"))" } else { '' }
              return @(Get-GraphAll -Path "/v1.0/identityProtection/riskyUsers$q" -Permission $perm)
          }

          # A random temporary password with upper, lower, digit and symbol, avoiding look-alike characters.
          function New-GraphTempPassword {
              param([int]$Length = 16)
              if ($Length -lt 8) { $Length = 8 }
              $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%^&*-_=+')
              $all = -join $sets
              $rng = [System.Security.Cryptography.RandomNumberGenerator]
              $chars = New-Object System.Collections.Generic.List[char]
              foreach ($s in $sets) { $chars.Add($s[$rng::GetInt32($s.Length)]) }
              while ($chars.Count -lt $Length) { $chars.Add($all[$rng::GetInt32($all.Length)]) }
              for ($i = $chars.Count - 1; $i -gt 0; $i--) { $j = $rng::GetInt32($i + 1); $tmp = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $tmp }
              return -join $chars
          }
          # ---------- end _shared/graph.ps1 ----------
          # <<< _shared/graph.ps1
          # >>> _shared/exchange.ps1 (generated by _shared/inject.js; edit the source, not this block)
          # ---------- Exchange Online ----------
          # Graph can't convert a mailbox to shared, hide it from the address list, set forwarding, or create a shared
          # mailbox or distribution list, so these helpers reach Exchange Online two ways, in this order:
          #   1. The Exchange admin REST endpoint the microsoft-exchange catalog extension uses
          #      (POST https://outlook.office365.com/adminapi/beta/{tenant}/InvokeCommand), signed in with the
          #      extension's own secrets: MicrosoftExchange-TenantId, MicrosoftExchange-ClientId, MicrosoftExchange-ClientSecret.
          #   2. The ExchangeOnlineManagement module with app-only certificate auth, when the module is on the runner
          #      and the secrets MicrosoftExchange-ClientId, MicrosoftExchange-Organization (or the -Organization the caller
          #      passes, such as the tenant's .onmicrosoft.com domain found through Graph) and
          #      MicrosoftExchange-CertificateThumbprint or MicrosoftExchange-Certificate (base64 PFX, with optional
          #      MicrosoftExchange-CertificatePassword) are set.
          # Either way the app registration needs the Exchange.ManageAsApp application permission (Office 365 Exchange Online)
          # and the Exchange Administrator role.
          # When neither works, Connect-OfExchange returns $false and $OfExo.Reason says why; the caller decides whether to
          # list the Exchange steps for a technician or stop.
          # In module mode every cmdlet that isn't Get-* runs with -Confirm:$false, so it can't stop to ask.
          #
          # All state lives in $OfExo, changed in place (the runner runs a step in a child scope, so no $script: variables):
          #   Mode       'rest' or 'module' once connected, '' before
          #   Connected  $true after a successful sign-in
          #   Tried      $true after the first Connect-OfExchange, so a failed sign-in isn't retried in the same step
          #   Reason     why the sign-in failed, as plain sentences joined with '; '
          #   TenantId   the tenant the REST calls go to
          #   Token      the REST bearer token
          # The Of prefix (and the helper names) come from the first automation that used this code; keep them, so a step
          # can use it next to the other libraries without name clashes.
          $OfExo = @{ Mode = ''; Reason = ''; TenantId = ''; Token = ''; Connected = $false; Tried = $false }

          function Get-OfSecret { param([string]$Name) $v = $null; try { $v = Get-AzKeyVaultSecret -VaultName $env:RUNNER_KV_NAME -Name $Name -AsPlainText -ErrorAction SilentlyContinue } catch { }; if ([string]::IsNullOrWhiteSpace([string]$v)) { return '' }; return ([string]$v).Trim() }
          function Get-OfProp { param($o, [string]$n) if ($null -eq $o) { return $null }; if ($o -is [System.Collections.IDictionary]) { if ($o.Contains($n)) { return $o[$n] }; return $null }; $p = $o.PSObject.Properties[$n]; if ($p) { return $p.Value }; return $null }
          function Get-OfErrorText {
              param($Err)
              $d = $null; try { if ($Err.ErrorDetails -and $Err.ErrorDetails.Message) { $d = $Err.ErrorDetails.Message } } catch { }
              if ($d) {
                  try {
                      $j = $d | ConvertFrom-Json -ErrorAction Stop
                      $e = Get-OfProp $j 'error'
                      # A sign-in error carries a code in "error" and the readable text in "error_description".
                      $m = Get-OfProp $j 'error_description'
                      if (-not $m) { $m = $(if ($e -is [string]) { $e } else { Get-OfProp $e 'message' }) }
                      if (-not $m) { $m = Get-OfProp $j 'message' }
                      if ($m) { return [string]$m }
                  } catch { }
                  return [string]$d
              }
              return [string]$Err.Exception.Message
          }
          function Get-OfHttpStatus { param($Err) $c = 0; try { $c = [int]$Err.Exception.Response.StatusCode } catch { }; return $c }
          function Test-OfNotFound { param([string]$Text) return $Text -match "(?i)couldn't be found|could not be found|ManagementObjectNotFound|wasn't found|was not found" }

          # Signs in to Exchange Online once per step. Returns $true when connected; otherwise $false with $OfExo.Reason set.
          function Connect-OfExchange {
              param([string]$Organization = '')
              if ($OfExo.Connected) { return $true }
              if ($OfExo.Tried) { return $false }
              $OfExo.Tried = $true
              $appId = Get-OfSecret 'MicrosoftExchange-ClientId'
              $tenant = Get-OfSecret 'MicrosoftExchange-TenantId'
              $clientSecret = Get-OfSecret 'MicrosoftExchange-ClientSecret'
              $thumb = Get-OfSecret 'MicrosoftExchange-CertificateThumbprint'
              $pfx = Get-OfSecret 'MicrosoftExchange-Certificate'
              $org = Get-OfSecret 'MicrosoftExchange-Organization'; if (-not $org) { $org = $Organization }
              $why = New-Object System.Collections.ArrayList

              # 1. The Exchange admin REST endpoint with the microsoft-exchange extension's secrets.
              if ($tenant -and $appId -and $clientSecret) {
                  try {
                      $r = Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$tenant/oauth2/v2.0/token" -Body @{ client_id = $appId; client_secret = $clientSecret; scope = 'https://outlook.office365.com/.default'; grant_type = 'client_credentials' } -ErrorAction Stop
                      $tok = [string](Get-OfProp $r 'access_token')
                      if (-not $tok) { throw 'Microsoft sign-in returned no access token.' }
                      $OfExo.Token = $tok; $OfExo.TenantId = $tenant; $OfExo.Mode = 'rest'; $OfExo.Connected = $true; $OfExo.Reason = ''
                      return $true
                  }
                  catch { $null = $why.Add("Exchange Online sign-in with the MicrosoftExchange-* secrets failed: $(Get-OfErrorText $_)") }
              }
              elseif (-not ($thumb -or $pfx)) {
                  $miss = @(); if (-not $tenant) { $miss += 'MicrosoftExchange-TenantId' }; if (-not $appId) { $miss += 'MicrosoftExchange-ClientId' }; if (-not $clientSecret) { $miss += 'MicrosoftExchange-ClientSecret' }
                  $null = $why.Add("the runner has no Exchange Online secrets ($($miss -join ', ') missing)")
              }

              # 2. ExchangeOnlineManagement with a certificate.
              if ($thumb -or $pfx) {
                  $hasModule = $false
                  try { $hasModule = [bool](@(Get-Module -ListAvailable -Name ExchangeOnlineManagement -ErrorAction SilentlyContinue | Where-Object { $null -ne $_ }).Count) } catch { }
                  if (-not $hasModule) { $null = $why.Add('the ExchangeOnlineManagement PowerShell module is not installed on the runner') }
                  elseif (-not $appId) { $null = $why.Add('the MicrosoftExchange-ClientId secret is missing') }
                  elseif (-not $org) { $null = $why.Add('the MicrosoftExchange-Organization secret (the tenant''s .onmicrosoft.com domain) is missing') }
                  else {
                      try {
                          Import-Module ExchangeOnlineManagement -ErrorAction Stop
                          $p = @{ AppId = $appId; Organization = $org; ShowBanner = $false; ErrorAction = 'Stop' }
                          if ($pfx) {
                              $pw = Get-OfSecret 'MicrosoftExchange-CertificatePassword'
                              $p.Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($pfx), $pw, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
                          }
                          else { $p.CertificateThumbprint = $thumb }
                          Connect-ExchangeOnline @p
                          $OfExo.Mode = 'module'; $OfExo.Connected = $true; $OfExo.Reason = ''
                          return $true
                      }
                      catch { $null = $why.Add("Exchange Online PowerShell sign-in failed: $($_.Exception.Message)") }
                  }
              }
              $OfExo.Reason = ($why -join '; ')
              return $false
          }

          # Runs one Exchange cmdlet. Returns an array of result objects; throws a plain sentence on failure.
          # REST retries 429, 503 and 504; a 401 or 403 names the permission and role the app registration needs.
          function Invoke-OfExo {
              param([string]$Cmdlet, [hashtable]$Parameters = @{})
              if (-not $OfExo.Connected) { throw "Exchange Online isn't connected: $($OfExo.Reason)" }
              if ($OfExo.Mode -eq 'module') {
                  $p = @{}; foreach ($k in $Parameters.Keys) { $p[$k] = $Parameters[$k] }; $p.ErrorAction = 'Stop'
                  if ($Cmdlet -notlike 'Get-*') { $p.Confirm = $false }
                  try { return @(& $Cmdlet @p) } catch { throw "Exchange Online $Cmdlet failed: $($_.Exception.Message)" }
              }
              $body = ConvertTo-Json -InputObject @{ CmdletInput = @{ CmdletName = $Cmdlet; Parameters = $Parameters } } -Depth 6 -Compress
              $h = @{ Authorization = "Bearer $($OfExo.Token)"; Accept = 'application/json' }
              for ($i = 1; $i -le 4; $i++) {
                  try {
                      $r = Invoke-RestMethod -Method POST -Uri "https://outlook.office365.com/adminapi/beta/$($OfExo.TenantId)/InvokeCommand" -Headers $h -Body $body -ContentType 'application/json' -ErrorAction Stop
                      return @(@(Get-OfProp $r 'value') | Where-Object { $null -ne $_ })
                  }
                  catch {
                      $code = Get-OfHttpStatus $_
                      if ($code -in @(429, 503, 504) -and $i -lt 4) { Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $i))); continue }
                      $txt = Get-OfErrorText $_
                      if ($code -eq 403 -or $code -eq 401) { throw "Exchange Online refused $Cmdlet (HTTP $code). The app registration needs the Exchange.ManageAsApp application permission and the Exchange Administrator role. Exchange said: $txt" }
                      throw "Exchange Online $Cmdlet failed$(if ($code) { " (HTTP $code)" }): $txt"
                  }
              }
          }

          # The recipient with this identity (address, alias or name), or $null when there is none.
          function Get-OfRecipient {
              param([string]$Identity)
              try { return @(Invoke-OfExo 'Get-Recipient' @{ Identity = $Identity })[0] }
              catch { if (Test-OfNotFound $_.Exception.Message) { return $null }; throw }
          }

          # The user's mailbox, or $null when they have none.
          function Get-OfMailbox {
              param([string]$Identity)
              try { return @(Invoke-OfExo 'Get-Mailbox' @{ Identity = $Identity })[0] }
              catch { if (Test-OfNotFound $_.Exception.Message) { return $null }; throw }
          }

          # Mailbox size in bytes from Get-MailboxStatistics, or -1 when it can't be read.
          function Get-OfMailboxBytes {
              param([string]$Identity)
              try {
                  $s = @(Invoke-OfExo 'Get-MailboxStatistics' @{ Identity = $Identity })[0]
                  $t = [string](Get-OfProp $s 'TotalItemSize')
                  if ($t -match '\(([\d,\.]+) bytes\)') { return [double]($Matches[1] -replace '[,\.]', '') }
              } catch { }
              return -1
          }
          # ---------- end Exchange Online helpers ----------
          # <<< _shared/exchange.ps1

          # ---------- this step ----------
          # Step 1: read the request and the user, run the safety checks and work out the offboarding plan.
          # Writes nothing. Reads the user, roles, groups, licences, manager, direct reports and devices from Microsoft
          # Graph, and the mailbox from Exchange Online when the runner can reach it. Its output feeds the Apply step.
          function Test-OfGuid { param([string]$s) return ([string]$s).Trim() -match '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
          function Test-OfTrue { param($v) return ([string]$v).Trim() -match '^(?i)(true|yes|y|1|on)$' }
          function Format-OfQuote { param([string]$s) return "'" + $s.Replace("'", "''") + "'" }

          $in = Get-NodeInput
          if ($in -is [string]) { try { $in = $in | ConvertFrom-Json } catch { $in = $null } }
          foreach ($wrap in @('trigger', 'body')) { $w = Get-OfProp $in $wrap; if ($w -is [string]) { try { $w = $w | ConvertFrom-Json } catch { $w = $null } }; if ($null -ne $w -and -not ($w -is [string])) { $in = $w } }

          $warnings = New-Object System.Collections.ArrayList
          $actions = New-Object System.Collections.ArrayList
          $out = [ordered]@{
              status = 'ok'; message = ''; ticket_id = ''; psa = ''; confirm = $false; company_id = ''
              upn = ''; user_id = ''; display_name = ''; synced = $false; already_disabled = $false
              security = [ordered]@{ disable = $false; reset_password = $false; revoke = $true }
              groups_remove = @(); groups_licence = @(); exchange_groups = @(); manual = @()
              licences = @(); licence_plan = [ordered]@{ remove = $false; reason = ''; keep_until = '' }
              exchange = [ordered]@{ available = $false; mode = ''; reason = ''; org = ''; mailbox = 'unknown'; convert = $false; hide = $false; forward_to = ''; forward_name = ''; current_forwarding = ''; manual_commands = @() }
              roles = @(); direct_reports = @(); devices = @()
              warnings = @(); actions = @()
          }
          function Stop-OfRead {
              param([string]$Status, [string]$Msg)
              $out.status = $Status; $out.message = $Msg
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          }

          # CloudRadial form answers arrive as Ticket.Questions [{Id, Value}]; flat bodies as plain fields.
          $answers = @{}
          $ticketObj = Get-OfProp $in 'Ticket'
          foreach ($q in @(Get-OfProp $ticketObj 'Questions')) { $qid = [string](Get-OfProp $q 'Id'); if ($qid) { $answers[$qid.ToLowerInvariant()] = Get-OfProp $q 'Value' } }
          $companyObj = Get-OfProp $in 'Company'
          # A value is missing when it is blank or still an unreplaced token (@Field or {{field}}).
          function Get-In {
              param([string[]]$Names)
              foreach ($n in $Names) {
                  $v = Get-OfProp $in $n
                  if ($null -eq $v -and $answers.ContainsKey($n.ToLowerInvariant())) { $v = $answers[$n.ToLowerInvariant()] }
                  if ($null -eq $v -and $n -eq 'CompanyTenantId') { $v = Get-OfProp $companyObj 'CompanyTenantId' }
                  if ($null -eq $v -or $v -is [System.Management.Automation.PSCustomObject] -or $v -is [System.Collections.IDictionary]) { continue }
                  $s = ([string]$v).Trim()
                  if ($s -eq '' -or $s.StartsWith('@') -or $s.StartsWith('{{')) { continue }
                  return $s
              }
              return ''
          }

          try {
              if ($null -eq $in) { Stop-OfRead 'incomplete' 'No request was received. Send at least upn.'; return }

              # ---------- 1. the request ----------
              $out.ticket_id = Get-In @('ticket_id', 'ticketId', 'TicketId')
              if (-not $out.ticket_id) { $out.ticket_id = [string](Get-OfProp $ticketObj 'TicketId') }
              $out.psa = Get-In @('psa')
              $out.confirm = Test-OfTrue (Get-In @('confirm'))
              $out.company_id = Get-In @('company_id', 'companyId', 'cloudradial_company_id')
              if (-not $out.company_id) { $out.company_id = Get-OfSecret 'CloudRadial-CompanyId' }
              $upn = Get-In @('upn', 'userPrincipalName', 'user_upn', 'email')
              $fwdManager = Test-OfTrue (Get-In @('forward_to_manager', 'forwardToManager'))
              $fwdTo = Get-In @('forward_to', 'forwardTo')
              $daysIn = Get-In @('keep_licenses_days', 'keep_licences_days', 'keepLicensesDays')
              $allowAdmin = Test-OfTrue (Get-In @('allow_admin', 'allowAdmin'))
              $alreadyShared = Test-OfTrue (Get-In @('mailbox_already_shared', 'mailboxAlreadyShared'))
              $reqEmail = Get-In @('requester_email', 'requesterEmail', 'submittedByUpn', 'UserEmail')
              $reqOid = Get-In @('requester_office_id', 'requesterOfficeId', 'userOfficeId', 'UserOfficeId')
              $tenantIn = Get-In @('company_tenant_id', 'companyTenantId', 'CompanyTenantId')
              $out.upn = $upn
              if (-not $upn) { Stop-OfRead 'incomplete' 'The request has no upn (the departing user). Nothing was changed.'; return }
              if ($upn -notmatch '^[^@\s]+@[^@\s]+\.[^@\s]+$' -and -not (Test-OfGuid $upn)) { Stop-OfRead 'incomplete' "'$upn' isn't a user principal name or object id. Nothing was changed."; return }
              $days = 0
              if ($daysIn) {
                  if ($daysIn -notmatch '^\d{1,3}$') { Stop-OfRead 'incomplete' "keep_licenses_days must be a whole number of days (0 to 999), not '$daysIn'. Nothing was changed."; return }
                  $days = [int]$daysIn
              }
              if ($fwdTo -and $fwdTo -notmatch '^[^@\s]+@[^@\s]+\.[^@\s]+$') { Stop-OfRead 'incomplete' "forward_to must be an email address or UPN, not '$fwdTo'. Nothing was changed."; return }
              if ($reqEmail -and $reqEmail.ToLowerInvariant() -eq $upn.ToLowerInvariant()) { Stop-OfRead 'rejected' "The requester ($reqEmail) asked to offboard their own account. A technician must handle that. Nothing was changed."; return }

              # ---------- 2. the user ----------
              $graphConn = Connect-Graph
              if ($tenantIn -and (Test-OfGuid $tenantIn)) {
                  if (Test-OfGuid $graphConn.TenantId) {
                      if ($tenantIn.ToLowerInvariant() -ne ([string]$graphConn.TenantId).ToLowerInvariant()) { Stop-OfRead 'rejected' "This request is for Microsoft 365 tenant $tenantIn, but this runner signs in to tenant $($graphConn.TenantId). Nothing was changed."; return }
                  }
                  else { $null = $warnings.Add('The M365-TenantId secret is a domain name, so the request''s tenant id could not be compared with it.') }
              }
              $user = Get-GraphUser -Id $upn -Select 'id,userPrincipalName,displayName,mail,accountEnabled,proxyAddresses,onPremisesSyncEnabled,assignedLicenses,licenseAssignmentStates,assignedPlans'
              if ($null -eq $user) { Stop-OfRead 'incomplete' "No Microsoft 365 user was found for $upn. Nothing was changed."; return }
              $uid = [string](Get-GraphProp $user 'id')
              $realUpn = [string](Get-GraphProp $user 'userPrincipalName')
              $out.user_id = $uid; $out.upn = $realUpn; $out.display_name = [string](Get-GraphProp $user 'displayName')
              $null = $actions.Add("Read $realUpn from Microsoft 365")

              # The requester can't offboard themselves (matched on the portal's own identity tokens).
              $mine = @($realUpn, [string](Get-GraphProp $user 'mail')) + @(@(Get-GraphProp $user 'proxyAddresses') | ForEach-Object { ([string]$_) -replace '^(?i)smtp:', '' })
              $mine = @($mine | Where-Object { $_ } | ForEach-Object { $_.ToLowerInvariant() })
              if (($reqOid -and $reqOid.ToLowerInvariant() -eq $uid.ToLowerInvariant()) -or ($reqEmail -and $mine -contains $reqEmail.ToLowerInvariant())) {
                  Stop-OfRead 'rejected' "The requester asked to offboard their own account ($realUpn). A technician must handle that. Nothing was changed."; return
              }

              # Admin roles (fail closed: if the roles can't be read, nothing happens).
              $roles = @(Get-GraphAll -Path "/v1.0/users/$uid/transitiveMemberOf/microsoft.graph.directoryRole?`$select=id,displayName" -Permission 'RoleManagement.Read.Directory (or Directory.Read.All)')
              $out.roles = @($roles | ForEach-Object { [string](Get-GraphProp $_ 'displayName') })
              if ($roles.Count) {
                  if (-not $allowAdmin) { Stop-OfRead 'rejected' "$realUpn holds admin roles ($($out.roles -join ', ')). Admin accounts are offboarded by a technician; to let this workflow do it, run it again with allow_admin set to true. Nothing was changed."; return }
                  $null = $warnings.Add("$realUpn holds admin roles ($($out.roles -join ', ')) and allow_admin is true. The app registration needs a privileged role (such as Privileged Authentication Administrator) to block sign-in and reset the password of an admin. Remove the role assignments by hand.")
              }

              $synced = (Get-GraphProp $user 'onPremisesSyncEnabled') -eq $true
              $out.synced = $synced
              $out.already_disabled = (Get-GraphProp $user 'accountEnabled') -eq $false
              $manual = New-Object System.Collections.ArrayList
              if ($synced) {
                  $null = $manual.Add([ordered]@{ item = 'Disable the account and reset its password in on-premises Active Directory'; reason = 'The user is synced from on-premises Active Directory, so Microsoft 365 can''t change their sign-in or password.' })
                  $null = $warnings.Add("$realUpn is synced from on-premises Active Directory. Sign-in, password and address list changes must be made in Active Directory.")
              }
              else {
                  $out.security.disable = -not $out.already_disabled
                  $out.security.reset_password = $true
              }
              if ($out.already_disabled) { $null = $warnings.Add("$realUpn was already blocked from signing in.") }

              # ---------- 3. licences ----------
              $skuNames = @{}
              foreach ($d in @(Get-GraphAll -Path "/v1.0/users/$uid/licenseDetails?`$select=skuId,skuPartNumber" -Permission 'User.Read.All')) { $skuNames[[string](Get-GraphProp $d 'skuId')] = [string](Get-GraphProp $d 'skuPartNumber') }
              function Get-OfSkuName { param([string]$Id) if ($skuNames.ContainsKey($Id) -and $skuNames[$Id]) { return $skuNames[$Id] }; return $Id }
              $direct = New-Object System.Collections.ArrayList
              $byGroup = @{}
              $states = @(@(Get-GraphProp $user 'licenseAssignmentStates') | Where-Object { $null -ne $_ })
              if ($states.Count) {
                  foreach ($s in $states) {
                      $sku = [string](Get-GraphProp $s 'skuId'); $grp = [string](Get-GraphProp $s 'assignedByGroup')
                      if ($grp) { if (-not $byGroup.ContainsKey($grp)) { $byGroup[$grp] = New-Object System.Collections.ArrayList }; $null = $byGroup[$grp].Add((Get-OfSkuName $sku)) }
                      elseif (-not @($direct | Where-Object { $_.skuId -eq $sku }).Count) { $null = $direct.Add([ordered]@{ skuId = $sku; sku = (Get-OfSkuName $sku) }) }
                  }
              }
              else {
                  foreach ($l in @(Get-GraphProp $user 'assignedLicenses')) { $sku = [string](Get-GraphProp $l 'skuId'); if ($sku) { $null = $direct.Add([ordered]@{ skuId = $sku; sku = (Get-OfSkuName $sku) }) } }
              }
              $out.licences = @($direct)
              $hasExchangePlan = @(@(Get-GraphProp $user 'assignedPlans') | Where-Object { ([string](Get-GraphProp $_ 'service')) -eq 'exchange' -and ([string](Get-GraphProp $_ 'capabilityStatus')) -eq 'Enabled' }).Count -gt 0

              # ---------- 4. groups ----------
              $memberOf = @(Get-GraphAll -Path "/v1.0/users/$uid/memberOf?`$select=id,displayName,groupTypes,mailEnabled,securityEnabled,onPremisesSyncEnabled,mail" -Permission 'GroupMember.Read.All (or Group.Read.All)')
              $graphGroups = New-Object System.Collections.ArrayList; $licGroups = New-Object System.Collections.ArrayList; $exGroups = New-Object System.Collections.ArrayList
              foreach ($g in $memberOf) {
                  if (([string](Get-GraphProp $g '@odata.type')) -ne '#microsoft.graph.group') { continue }
                  $gid = [string](Get-GraphProp $g 'id'); $name = [string](Get-GraphProp $g 'displayName'); $mail = [string](Get-GraphProp $g 'mail')
                  $types = @(@(Get-GraphProp $g 'groupTypes') | ForEach-Object { [string]$_ })
                  $mailOn = (Get-GraphProp $g 'mailEnabled') -eq $true; $secOn = (Get-GraphProp $g 'securityEnabled') -eq $true
                  $lic = @(if ($byGroup.ContainsKey($gid)) { $byGroup[$gid] })
                  $licNote = $(if ($lic.Count) { " It assigns $($lic -join ', ')." } else { '' })
                  if ((Get-GraphProp $g 'onPremisesSyncEnabled') -eq $true) { $null = $manual.Add([ordered]@{ item = "Remove from $name in on-premises Active Directory"; reason = "The group is synced from on-premises Active Directory.$licNote" }); continue }
                  if ($types -contains 'DynamicMembership') { $null = $manual.Add([ordered]@{ item = "Check the dynamic group $name"; reason = "Its membership follows the user's attributes, so change the attributes or the rule.$licNote" }); continue }
                  $kind = ''
                  if ($types -contains 'Unified') { $kind = 'Microsoft 365 group' }
                  elseif ($mailOn -and -not $secOn) { $kind = 'distribution list' }
                  elseif ($mailOn -and $secOn) { $kind = 'mail-enabled security group' }
                  else { $kind = 'security group' }
                  if ($kind -eq 'distribution list' -or $kind -eq 'mail-enabled security group') {
                      $null = $exGroups.Add([ordered]@{ id = $gid; name = $name; kind = $kind; mail = $mail; command = "Remove-DistributionGroupMember -Identity $(Format-OfQuote $(if ($mail) { $mail } else { $gid })) -Member $(Format-OfQuote $realUpn) -BypassSecurityGroupManagerCheck -Confirm:`$false" })
                      continue
                  }
                  $row = [ordered]@{ id = $gid; name = $name; kind = $kind; licences = @($lic) }
                  if ($lic.Count) { $null = $licGroups.Add($row) } else { $null = $graphGroups.Add($row) }
              }
              $out.groups_remove = @($graphGroups); $out.groups_licence = @($licGroups); $out.exchange_groups = @($exGroups)
              $null = $actions.Add("Read $(@($memberOf).Count) group and role memberships")

              # ---------- 5. mailbox, through Exchange Online when it can be reached ----------
              $org = Get-OfSecret 'MicrosoftExchange-Organization'
              if (-not $org) {
                  try {
                      $orgs = @(Get-GraphProp (Invoke-Graph -Method GET -Path '/v1.0/organization?$select=verifiedDomains' -Permission 'Organization.Read.All') 'value')
                      foreach ($d in @(Get-GraphProp $orgs[0] 'verifiedDomains')) { if ((Get-GraphProp $d 'isInitial') -eq $true) { $org = [string](Get-GraphProp $d 'name') } }
                  } catch { }
              }
              $ex = $out.exchange
              $ex.org = $org
              $exOk = Connect-OfExchange -Organization $org
              $ex.available = $exOk; $ex.mode = $OfExo.Mode; $ex.reason = $OfExo.Reason
              $keepReason = ''
              $mb = $null
              if ($exOk) {
                  $mb = Get-OfMailbox $realUpn
                  if ($null -eq $mb) { $ex.mailbox = 'none' }
                  else {
                      $rtd = [string](Get-OfProp $mb 'RecipientTypeDetails')
                      $ex.mailbox = $(switch ($rtd) { 'UserMailbox' { 'user' } 'SharedMailbox' { 'shared' } default { $rtd } })
                      $fs = [string](Get-OfProp $mb 'ForwardingSmtpAddress'); $fa = [string](Get-OfProp $mb 'ForwardingAddress')
                      $ex.current_forwarding = $(if ($fs) { $fs -replace '^(?i)smtp:', '' } else { $fa })
                      $ex.convert = $ex.mailbox -eq 'user'
                      $ex.hide = (@('user', 'shared') -contains $ex.mailbox) -and ((Get-OfProp $mb 'HiddenFromAddressListsEnabled') -ne $true)
                      $holds = @()
                      if ((Get-OfProp $mb 'LitigationHoldEnabled') -eq $true) { $holds += 'litigation hold' }
                      if (@(@(Get-OfProp $mb 'InPlaceHolds') | Where-Object { $_ }).Count) { $holds += 'an in-place or retention hold' }
                      if (([string](Get-OfProp $mb 'ArchiveStatus')) -eq 'Active') { $holds += 'an online archive' }
                      $bytes = Get-OfMailboxBytes $realUpn
                      if ($bytes -gt 50GB) { $holds += "a mailbox of $([Math]::Round($bytes / 1GB, 1)) GB (over the 50 GB shared mailbox limit)" }
                      if ($holds.Count) { $keepReason = "The mailbox has $($holds -join ', '), and a shared mailbox like that still needs a licence. Licences were kept; review them by hand." }
                  }
                  $null = $actions.Add("Read the mailbox from Exchange Online ($($ex.mailbox))")
              }
              else {
                  $ex.mailbox = $(if ($hasExchangePlan) { 'unknown' } else { 'none' })
                  $null = $warnings.Add("Exchange Online couldn't be reached: $($ex.reason). The mailbox steps are listed for a technician instead.")
              }
              if ($synced -and $ex.hide) { $ex.hide = $false; $null = $manual.Add([ordered]@{ item = 'Hide the user from the address list in on-premises Active Directory (msExchHideFromAddressLists)'; reason = 'The user is synced from on-premises Active Directory.' }) }

              # Forwarding target: forward_to wins, then the manager when forward_to_manager is true.
              $target = $null
              if ($fwdTo) {
                  $target = Get-GraphUser -Id $fwdTo -Select 'id,userPrincipalName,displayName,mail,accountEnabled'
                  if ($null -eq $target) { $null = $warnings.Add("No Microsoft 365 user was found for forward_to ($fwdTo), so mail won't be forwarded.") }
              }
              elseif ($fwdManager) {
                  try { $target = Invoke-Graph -Method GET -Path "/v1.0/users/$uid/manager?`$select=id,userPrincipalName,displayName,mail,accountEnabled" -Permission 'User.Read.All' }
                  catch { if ($GraphState.LastStatus -ne 404) { throw }; $target = $null }
                  if ($null -eq $target) { $null = $warnings.Add("forward_to_manager is true, but $realUpn has no manager in Microsoft 365, so mail won't be forwarded.") }
              }
              if ($null -ne $target) {
                  $tUpn = [string](Get-GraphProp $target 'userPrincipalName'); $tMail = [string](Get-GraphProp $target 'mail')
                  if ([string](Get-GraphProp $target 'id') -eq $uid) { $null = $warnings.Add('The forwarding target is the departing user, so mail won''t be forwarded.') }
                  elseif ((Get-GraphProp $target 'accountEnabled') -eq $false) { $null = $warnings.Add("The forwarding target $tUpn is blocked from signing in, so mail won't be forwarded.") }
                  elseif ($ex.mailbox -eq 'none') { $null = $warnings.Add("$realUpn has no mailbox, so there is nothing to forward.") }
                  else { $ex.forward_to = $(if ($tMail) { $tMail } else { $tUpn }); $ex.forward_name = [string](Get-GraphProp $target 'displayName') }
              }
              if ($ex.current_forwarding -and -not $ex.forward_to) { $null = $warnings.Add("The mailbox already forwards to $($ex.current_forwarding). Check that this is still wanted.") }

              # Exchange steps for a technician when Exchange Online can't be reached.
              if (-not $exOk -and $hasExchangePlan) {
                  $q = Format-OfQuote $realUpn
                  $cmds = @(); if (-not $alreadyShared) { $cmds += "Set-Mailbox -Identity $q -Type Shared" }
                  if (-not $synced) { $cmds += "Set-Mailbox -Identity $q -HiddenFromAddressListsEnabled `$true" }
                  if ($ex.forward_to) { $cmds += "Set-Mailbox -Identity $q -ForwardingAddress $(Format-OfQuote $ex.forward_to) -DeliverToMailboxAndForward `$true" }
                  $ex.manual_commands = @($cmds)
              }

              # ---------- 6. licence decision (licences only go once the mailbox is safe) ----------
              $lp = $out.licence_plan
              $anyLicence = ($direct.Count + $licGroups.Count) -gt 0
              if (-not $anyLicence) { $lp.reason = 'The user has no licences that this workflow can remove.' }
              elseif ($days -gt 0) { $lp.keep_until = (Get-Date).AddDays($days).ToString('yyyy-MM-dd'); $lp.reason = "Licences are kept for $days days as asked. Remove them on or after $($lp.keep_until) by running this workflow again with keep_licenses_days 0 and confirm true." }
              elseif ($exOk) {
                  if ($keepReason) { $lp.reason = $keepReason }
                  elseif (@('none', 'user', 'shared') -contains $ex.mailbox) { $lp.remove = $true; $lp.reason = $(if ($ex.mailbox -eq 'user') { 'Licences are removed after the mailbox is converted to shared.' } else { 'The mailbox is safe without a licence.' }) }
                  else { $lp.reason = "The mailbox type is $($ex.mailbox), so licences were kept. Review them by hand." }
              }
              elseif ($alreadyShared) { $lp.remove = $true; $lp.reason = 'mailbox_already_shared is true, so the technician has confirmed the mailbox was converted to shared.'; $null = $warnings.Add('Licences are removed because mailbox_already_shared is true. Make sure the mailbox really is shared, or its mail will be lost after 30 days.') }
              elseif (-not $hasExchangePlan) { $lp.remove = $true; $lp.reason = 'The user has no Exchange Online mailbox licence, so there is no mailbox to lose.' }
              else { $lp.reason = "Exchange Online couldn't be reached, so the mailbox wasn't converted to shared. Licences stay on so the mailbox isn't lost. Convert it in Exchange, then run this workflow again with mailbox_already_shared true and confirm true." }

              # ---------- 7. report-only items ----------
              try { $out.direct_reports = @(Get-GraphAll -Path "/v1.0/users/$uid/directReports?`$select=id,displayName,userPrincipalName" -Permission 'User.Read.All' | ForEach-Object { "$(Get-GraphProp $_ 'displayName') ($(Get-GraphProp $_ 'userPrincipalName'))" }) }
              catch { $null = $warnings.Add("Couldn't read who reports to $($realUpn): $($_.Exception.Message)") }
              $devs = New-Object System.Collections.ArrayList; $seen = @{}
              foreach ($rel in @('registeredDevices', 'ownedDevices')) {
                  try {
                      foreach ($d in @(Get-GraphAll -Path "/v1.0/users/$uid/$rel`?`$select=id,displayName,operatingSystem,trustType" -Permission 'Device.Read.All (or Directory.Read.All)')) {
                          $did = [string](Get-GraphProp $d 'id'); if (-not $did -or $seen.ContainsKey($did)) { continue }; $seen[$did] = $true
                          $null = $devs.Add("$(Get-GraphProp $d 'displayName') ($(Get-GraphProp $d 'operatingSystem'), $(Get-GraphProp $d 'trustType'))")
                      }
                  }
                  catch { $null = $warnings.Add("Couldn't read the user's $($rel): $($_.Exception.Message)") }
              }
              $out.devices = @($devs)
              $out.manual = @($manual)
              $out.message = "Planned the offboarding of $realUpn."
              $out.warnings = @($warnings); $out.actions = @($actions)
              Set-NodeOutput $out
          }
          catch {
              Stop-OfRead 'error' "Couldn't plan the offboarding of $($upn): $($_.Exception.Message) Nothing was changed."
          }
        timeoutSeconds: 300
        retryCount: 0
        parameters: []
        aiExtensions: []
        testInput: |-
          {
            "upn": "sam.doe@contoso.com",
            "forward_to_manager": "true",
            "forward_to": "",
            "keep_licenses_days": "0",
            "confirm": "false",
            "allow_admin": "false",
            "mailbox_already_shared": "false",
            "requester_email": "alex.kim@contoso.com",
